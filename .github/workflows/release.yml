name: Release VibeHub

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate release identity
        run: node scripts/verify-release-version.mjs --tag "$GITHUB_REF_NAME"
      - name: Verify plugin
        run: npm run verify
      - name: Build plugin
        run: npm run build
      - name: Package release
        run: |
          archive="dist/vibehub-plugin-${GITHUB_REF_NAME#v}.tar.gz"
          tar -C dist -czf "$archive" plugin
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/vibehub-plugin-${GITHUB_REF_NAME#v}.tar.gz"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            --verify-tag --generate-notes --title "VibeHub $GITHUB_REF_NAME"
