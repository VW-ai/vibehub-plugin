name: Release VibeHub

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate release identity
        run: node scripts/verify-release-version.mjs --tag "$GITHUB_REF_NAME"
      - name: Verify plugin
        run: npm run verify
      - name: Build plugin
        run: npm run build
      - name: Build release-paired data upgrader
        run: node scripts/build-upgrade-package.mjs --out dist --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
      - name: Package release
        run: |
          archive="vibehub-plugin-${GITHUB_REF_NAME#v}.tar.gz"
          tar -C dist -czf "dist/$archive" plugin
          cd dist
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="vibehub-plugin-${GITHUB_REF_NAME#v}.tar.gz"
          gh release create "$GITHUB_REF_NAME" "dist/$archive" "dist/$archive.sha256" \
            "dist/vibehub-upgrade.tgz" "dist/vibehub-upgrade.tgz.sha256" \
            --verify-tag --generate-notes --title "VibeHub $GITHUB_REF_NAME"
