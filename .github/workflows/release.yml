name: Release VibeHub

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-vibehub
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.8.1
  RELEASE_NODE_VERSION: 24
  CLAUDE_CODE_VERSION: 2.1.177
  CODEX_VERSION: 0.144.1

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the release tag to belong to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-release-metadata.mjs "${GITHUB_REF_NAME}"

      - name: Install pinned host CLIs
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" "@openai/codex@${CODEX_VERSION}"

      - run: pnpm verify

      - name: Build the platform-neutral marketplace
        run: >-
          pnpm build:release-marketplace --
          --out dist/release
          --commit "${GITHUB_SHA}"

      - run: pnpm verify:release-marketplace -- dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-${{ github.ref_name }}
          path: dist/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-public-runtime:
    needs: source-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: macos-15-intel
          - runner: ubuntu-24.04-arm
          - runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: node scripts/wait-for-npm-release.mjs "${GITHUB_REF_NAME}"
      - run: node scripts/verify-public-npm-runtime.mjs

  publish:
    needs: verify-public-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: marketplace-${{ github.ref_name }}
          path: dist/release

      - name: Install pinned host CLIs
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" "@openai/codex@${CODEX_VERSION}"

      - name: Verify real host installation against the public npm runtime
        run: node scripts/verify-release-hosts.mjs dist/release

      - name: Package the universal marketplace archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="vibehub-${version}-marketplace.tar.gz"
          tar -czf "${archive}" -C dist/release .
          shasum -a 256 "${archive}" > "${archive}.sha256"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --draft
          fi
          gh release upload "${GITHUB_REF_NAME}" --clobber vibehub-*-marketplace.tar.gz vibehub-*-marketplace.tar.gz.sha256
          gh release edit "${GITHUB_REF_NAME}" --draft=false
