<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VibeHub · Quiet dashboard prototype</title>
  <style>
    :root {
      --page: #e6e7e5;
      --canvas: #f1f2f0;
      --surface: #f8f8f6;
      --node: #fbfbfa;
      --ink: #202124;
      --muted: #5f6368;
      --quiet: #777b81;
      --faint: #a4a8ad;
      --line: rgba(24, 27, 31, 0.095);
      --line-strong: rgba(24, 27, 31, 0.19);
      --edge: #a2a8ac;
      --edge-active: #60656a;
      --flow-0: #2579d4;
      --flow-1: #238749;
      --flow-2: #ab8209;
      --ready: #2c6844;
      --ready-soft: #e4efe8;
      --done: #56725c;
      --blocked: #7d8287;
      --running: #3a5f86;
      --planned: #6d6488;
      --attention: #8a4f0c;
      --attention-soft: #f4e7cf;
      --deviated: #a64d57;
      --focus: #657aa5;
      --kind-intent: #3c6794;
      --kind-decision: #5d4e86;
      --kind-constraint: #8d5340;
      --kind-contract: #2b6d68;
      --kind-authority: #6d3d4c;
      --kind-change: #8a6230;
      --member: #7a7194;
      --hover: #ffffff;
      --shadow: rgba(24, 27, 31, 0.16);
      --ui: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, "Cascadia Mono", monospace;
      --card-w: 240px;
      --card-h: 96px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --page: #141516;
      --canvas: #1b1c1e;
      --surface: #222325;
      --node: #2a2b2d;
      --ink: #f4f4f2;
      --muted: #c4c6c8;
      --quiet: #9a9da1;
      --faint: #73767a;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.16);
      --edge: #6d7175;
      --edge-active: #d5d6d4;
      --flow-0: #7eb6ef;
      --flow-1: #7dcea0;
      --flow-2: #e2c16a;
      --ready: #8fd0a8;
      --ready-soft: #1c3326;
      --done: #9bb8a2;
      --blocked: #a0a4a8;
      --running: #9ec0e4;
      --planned: #c4b7d6;
      --attention: #e7b16a;
      --attention-soft: #3a2d1c;
      --focus: #a9bcdf;
      --kind-intent: #8eb4dc;
      --kind-decision: #c4b4e0;
      --kind-constraint: #e0b09f;
      --kind-contract: #8dccc6;
      --kind-authority: #e0a8b6;
      --kind-change: #e2c08a;
      --member: #c4b4e0;
      --hover: #323336;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      color: var(--ink);
      background: var(--page);
      font: 15px/1.5 var(--ui);
      letter-spacing: -0.01em;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; color: inherit; letter-spacing: inherit; }
    button { border: 0; background: transparent; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .icon-sprite { position: absolute; width: 0; height: 0; }
    .icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .icon.use-fill { fill: currentColor; stroke: none; }

    .shell {
      display: grid;
      grid-template-columns: var(--rail-w, 268px) minmax(0, 1fr);
      height: 100%;
    }

    .rail-shell {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 0;
    }

    .rail {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      min-height: 0;
      padding: 16px 12px 14px;
      border-right: 1px solid var(--line);
      background: var(--surface);
      overflow: auto;
      scrollbar-width: thin;
    }

    .rail-resize {
      position: absolute;
      top: 0;
      right: -3px;
      bottom: 0;
      z-index: 4;
      width: 8px;
      cursor: col-resize;
      touch-action: none;
    }

    .rail-resize::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 3px;
      width: 1px;
      background: transparent;
      transition: background 120ms ease;
    }

    .rail-resize:hover::after,
    body.is-resizing-rail .rail-resize::after {
      background: var(--ink);
      opacity: 0.35;
    }

    body.is-resizing-rail { cursor: col-resize; }
    body.is-resizing-rail * { cursor: col-resize !important; user-select: none !important; }

    #goal-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 6px 12px;
    }

    .brand strong {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .brand span {
      color: var(--faint);
      font: 600 9px/1 var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .project {
      display: grid;
      gap: 10px;
      margin: 0 2px 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--canvas);
    }

    .project-head {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .project-head .mark {
      width: 32px;
      height: 32px;
      color: var(--ink);
      background: var(--node);
      box-shadow: inset 0 0 0 1.5px var(--line-strong);
    }

    .project-head .mark .icon { width: 16px; height: 16px; }
    .project-head b {
      min-width: 0;
      overflow: hidden;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.018em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .project-switch {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .project-switch:hover b { color: var(--ink); }
    .project-switch .caret {
      flex: none;
      width: 14px;
      height: 14px;
      color: var(--quiet);
      transition: transform 120ms ease;
    }
    .project-switch[aria-expanded="true"] .caret {
      color: var(--ink);
      transform: rotate(90deg);
    }

    .project-menu {
      display: grid;
      gap: 4px;
      padding-top: 6px;
    }
    .project-menu[hidden] { display: none; }
    .project-option {
      display: grid;
      gap: 6px;
      width: 100%;
      padding: 10px 10px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .project-option:hover { background: var(--hover); }
    .project-option[aria-pressed="true"] {
      border-color: var(--line-strong);
      background: var(--node);
    }
    .project-option.is-unavailable {
      opacity: 0.78;
    }
    .project-option-top {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .project-option strong {
      min-width: 0;
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.014em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .project-status {
      flex: none;
      margin-left: auto;
      padding: 3px 7px;
      border-radius: 999px;
      font: 600 10px/1 var(--ui);
      letter-spacing: 0.02em;
    }
    .project-status.is-open {
      color: var(--ready);
      background: color-mix(in srgb, var(--ready) 14%, transparent);
    }
    .project-status.is-clear {
      color: var(--quiet);
      background: var(--page);
    }
    .project-status.is-bad {
      color: var(--attention);
      background: color-mix(in srgb, var(--attention) 14%, transparent);
    }
    .project-option-path {
      overflow: hidden;
      color: var(--quiet);
      font: 10px/1.35 var(--mono);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .project-option-note {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .project-actions { display: flex; gap: 2px; margin-left: auto; }
    .project-actions .icon-button { width: 30px; height: 30px; }
    .project-actions .icon-button .icon { width: 15px; height: 15px; }
    .project-actions a.icon-button { color: var(--muted); text-decoration: none; }
    .project-actions a.icon-button:hover { color: var(--ink); background: var(--hover); }

    .branch-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .branch-switch button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding: 0 9px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--quiet);
      font: 11px/1 var(--mono);
    }
    .branch-switch button .icon { width: 12px; height: 12px; }
    .branch-switch button:hover { color: var(--ink); background: var(--hover); }
    .branch-switch button[aria-pressed="true"] {
      color: var(--ink);
      border-color: var(--line-strong);
      background: var(--node);
    }
    .worktree {
      overflow: hidden;
      color: var(--faint);
      font: 10px/1.45 var(--mono);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .worktree[hidden] { display: none; }

    .path-toggle {
      display: inline-grid;
      grid-auto-flow: column;
      place-items: center;
      gap: 1px;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      font-size: 0;
    }
    .path-toggle:hover {
      color: var(--ink);
      border-color: var(--line);
      background: var(--node);
    }
    .path-toggle .icon {
      width: 15px;
      height: 15px;
    }
    .path-toggle .caret {
      width: 10px;
      height: 10px;
      transition: transform 120ms ease;
    }
    .path-toggle[aria-expanded="true"] .caret { transform: rotate(90deg); }

    .checkout-meta {
      display: grid;
      gap: 4px;
    }

    .rail-section {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 10px;
    }

    .rail-section.is-grow {
      flex: 1;
      min-height: 0;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 6px 6px;
      color: var(--faint);
      font: 600 9px/1.3 var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .nav-item {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 42px;
      padding: 6px 8px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--muted);
      text-align: left;
    }

    .nav-item .mark {
      width: 28px;
      height: 28px;
      color: var(--quiet);
      background: transparent;
      box-shadow: inset 0 0 0 1.5px var(--line-strong);
    }
    .nav-item .mark .icon { width: 14px; height: 14px; }
    .nav-item:hover {
      color: var(--ink);
      background: var(--canvas);
      border-color: var(--line);
    }
    .nav-item:hover .mark { color: var(--ink); }
    .nav-item[aria-current="true"] {
      color: var(--ink);
      background: var(--page);
      border-color: var(--line-strong);
    }
    .nav-item[aria-current="true"] .mark {
      color: var(--node);
      background: var(--ink);
      box-shadow: none;
    }
    .nav-item span {
      overflow: hidden;
      font-size: 14px;
      font-weight: 550;
      letter-spacing: -0.012em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-item em {
      color: var(--faint);
      font: 11px/1 var(--mono);
      font-style: normal;
    }
    .nav-item[aria-current="true"] em { color: var(--quiet); }
    .nav-item.is-child {
      position: relative;
      margin-left: 18px;
      width: calc(100% - 18px);
    }
    .nav-item.is-child::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 8px;
      bottom: 8px;
      width: 1px;
      background: var(--line-strong);
    }
    .nav-item.is-child .mark {
      width: 24px;
      height: 24px;
    }
    .nav-item.is-child .mark .icon { width: 12px; height: 12px; }
    .nav-item.is-child span { font-size: 12.5px; font-weight: 500; }

    body.is-focus .shell { grid-template-columns: minmax(0, 1fr); }
    body.is-focus .rail-shell { display: none; }

    .appearance {
      margin-top: auto;
      padding: 12px 2px 0;
      border-top: 1px solid var(--line);
    }

    .appearance .eyebrow { margin: 0 6px 8px; }
    .appearance .segment {
      width: 100%;
      padding: 3px;
      border-radius: 10px;
      background: var(--canvas);
    }
    .appearance .segment button {
      flex: 1;
      height: 36px;
      border-radius: 8px;
    }

    .stage {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      background: var(--canvas);
    }

    .titlebar, .workbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 0 20px;
    }

    .titlebar {
      min-height: 72px;
      padding-top: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .title-copy { display: grid; gap: 6px; min-width: 0; }
    .repo {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      max-width: 100%;
    }

    .repo-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      min-width: 0;
      padding: 0 10px 0 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--node);
      color: var(--ink);
      font: 12px/1 var(--mono);
    }

    .repo-chip .icon { width: 15px; height: 15px; color: var(--quiet); flex: none; }
    .repo-chip strong {
      overflow: hidden;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .repo-chip em {
      overflow: hidden;
      color: var(--quiet);
      font-style: normal;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .repo-chip .slash { color: var(--faint); }

    .repo-actions { display: inline-flex; align-items: center; gap: 2px; }
    .repo-actions .icon-button {
      width: 28px;
      height: 28px;
      border-radius: 8px;
    }
    .repo-actions .icon-button .icon { width: 16px; height: 16px; }
    .repo-actions a.icon-button { text-decoration: none; color: var(--muted); }
    .repo-actions a.icon-button:hover { color: var(--ink); }

    .titlebar h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.024em;
    }

    .title-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .titlebar .count {
      color: var(--quiet);
      font: 12px/1 var(--mono);
    }

    .titlebar .spacer { flex: 1; }

    .scope-mark {
      display: none;
      align-items: center;
      gap: 6px;
      margin-right: 4px;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--page);
      color: var(--quiet);
      font: 11px/1 var(--mono);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .scope-mark.is-on { display: inline-flex; }

    .icon-button {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--muted);
    }

    .icon-button .icon { width: 20px; height: 20px; }

    .icon-button:hover { color: var(--ink); border-color: var(--line); background: var(--node); }

    .workbar {
      min-height: 52px;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 72%, var(--canvas));
    }

    .work-label {
      flex: none;
      color: var(--faint);
      font: 600 9px/1 var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .search {
      position: relative;
      display: flex;
      align-items: center;
      align-self: center;
    }

    .search .icon {
      position: absolute;
      left: 12px;
      width: 18px;
      height: 18px;
      color: var(--quiet);
      pointer-events: none;
    }

    .search input {
      width: 240px;
      height: 40px;
      padding: 0 12px 0 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--node);
      font-size: 14px;
    }

    .search input:focus { outline: none; border-color: var(--line-strong); }

    .text-button {
      display: inline-flex;
      align-items: center;
      align-self: center;
      gap: 8px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: var(--node);
      font-size: 14px;
    }

    .text-button .icon { width: 18px; height: 18px; }
    .inspector .actions .text-button { width: 100%; justify-content: center; }

    .text-button:hover { color: var(--ink); border-color: var(--line-strong); }

    .status-wrap { position: relative; }
    .status-panel {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 232px;
      padding: 10px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--node);
      z-index: 5;
    }

    .status-panel p { margin: 0 0 6px; }
    .status-panel strong { font-variant-numeric: tabular-nums; }
    .status-panel .warn { margin: 8px 0 0; color: var(--quiet); font-size: 12px; }

    .surfaces { display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--node); }
    .surfaces button {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 12px;
      border-radius: 9px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .surfaces .icon { width: 18px; height: 18px; }
    .surfaces button:hover { color: var(--ink); }
    .surfaces button[aria-pressed="true"] {
      color: var(--ink);
      font-weight: 600;
      background: var(--page);
    }
    .surfaces button[aria-pressed="true"]::after { display: none; }

    .workbar .spacer { flex: 1; }

    .segment {
      display: flex;
      align-self: center;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--node);
    }

    .segment button {
      display: grid;
      place-items: center;
      width: 36px;
      height: 34px;
      border-radius: 8px;
      color: var(--quiet);
    }

    .segment .icon { width: 20px; height: 20px; }

    .segment button:hover { color: var(--ink); }
    .segment button[aria-pressed="true"] { color: var(--ink); background: var(--page); }

    .filters { display: flex; align-items: center; align-self: center; gap: 2px; }
    .filters button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 40px;
      padding: 0 8px;
      border-radius: 10px;
      color: var(--quiet);
      font-size: 13px;
    }

    .filters button em {
      font: 12px/1 var(--mono);
      font-style: normal;
      color: var(--faint);
    }

    .filters button:hover,
    .filters button[aria-pressed="true"] { background: var(--page); }
    .filters button[data-filter="all"]:hover,
    .filters button[data-filter="blocked"]:hover,
    .filters button[data-filter="waiting"]:hover { color: var(--ink); }
    .filters button[data-filter="all"][aria-pressed="true"],
    .filters button[data-filter="blocked"][aria-pressed="true"],
    .filters button[data-filter="waiting"][aria-pressed="true"] { color: var(--ink); }
    .filters button[data-filter="attention"] { color: var(--attention); }
    .filters button[data-filter="running"] { color: var(--running); }
    .filters button[data-filter="ready"] { color: var(--ready); }
    .filters button[data-filter="planned"] { color: var(--planned); }
    .filters button[data-filter="done"] { color: var(--done); }
    .filters button:hover em,
    .filters button[aria-pressed="true"] em { color: var(--quiet); }
    .filters .icon { width: 18px; height: 18px; }

    .explain {
      position: fixed;
      z-index: 40;
      max-width: 240px;
      padding: 5px 8px;
      border-radius: 6px;
      background: var(--ink);
      color: var(--node);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.006em;
      line-height: 1.35;
      pointer-events: none;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      min-height: 0;
      min-width: 0;
    }

      overflow-x: auto;
      padding: 0 0 4px;
      scroll-snap-type: x proximity;
      scrollbar-width: thin;
    }

    .section-body.is-rail .rel-card {
      flex: 0 0 200px;
      width: 200px;
      scroll-snap-align: start;
    }

    .section-body.is-stack {
      max-height: 220px;
      overflow: auto;
      padding-right: 2px;
      scrollbar-width: thin;
    }

    .rel-card {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 16px;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 56px;
      padding: 10px 10px 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--node);
      text-align: left;
    }

    .rel-card:hover { border-color: var(--line-strong); background: var(--hover); }
    .rel-card:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .rel-card .mark { width: 28px; height: 28px; }
    .rel-card .mark .icon { width: 15px; height: 15px; }
    .rel-card b {
      display: block;
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.012em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rel-card small {
      display: block;
      overflow: hidden;
      color: var(--quiet);
      font: 10px/1.3 var(--mono);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rel-card .go {
      width: 16px;
      height: 16px;
      color: var(--faint);
    }
    .rel-card:hover .go { color: var(--ink); }

    .goal-chip {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto 14px;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--node);
      text-align: left;
    }

    .goal-chip:hover { border-color: var(--line-strong); background: var(--hover); }
    .goal-chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .goal-chip .icon { width: 18px; height: 18px; color: var(--quiet); }
    .goal-chip b { display: block; font-size: 13px; font-weight: 600; letter-spacing: -0.012em; }
    .goal-chip small { display: block; color: var(--quiet); font: 10px/1.3 var(--mono); }
    .goal-chip .part {
      align-self: center;
      color: var(--faint);
      font: 10px/1.2 var(--mono);
      text-align: right;
    }
    .goal-chip .go {
      width: 14px;
      height: 14px;
      color: var(--faint);
    }
    .goal-chip:hover .go { color: var(--ink); }

    .flow-map {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 14px minmax(0, 1.05fr) 14px minmax(0, 1fr);
      gap: 6px;
      align-items: start;
      margin: 0 4px 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--canvas);
    }

    .flow-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; max-height: 148px; overflow: auto; scrollbar-width: thin; }
    .flow-col .label {
      position: sticky;
      top: 0;
      z-index: 1;
      color: var(--faint);
      background: var(--canvas);
      font: 600 9px/1 var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-bottom: 2px;
    }
    .flow-col .label em {
      margin-left: 4px;
      color: var(--quiet);
      font-weight: 400;
      font-style: normal;
      letter-spacing: 0;
      text-transform: none;
    }
    .flow-here {
      display: grid;
      place-items: center;
      min-height: 72px;
      padding: 10px 8px;
      border: 1.5px solid var(--ink);
      border-radius: 10px;
      background: var(--node);
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .flow-arrow {
      align-self: center;
      color: var(--faint);
      text-align: center;
      padding-top: 18px;
    }
    .flow-arrow .icon { width: 14px; height: 14px; }
    .flow-pill {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 6px;
      align-items: center;
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--node);
      text-align: left;
    }
    .flow-pill:hover { border-color: var(--line-strong); background: var(--hover); }
    .flow-pill:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
    .flow-pill .mark { width: 22px; height: 22px; }
    .flow-pill .mark .icon { width: 12px; height: 12px; }
    .flow-pill b {
      overflow: hidden;
      font-size: 11px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .flow-more {
      color: var(--quiet);
      font: 10px/1.2 var(--mono);
      text-align: center;
      padding: 4px 0 2px;
    }

    .source-row {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      margin: 0 16px 12px;
      color: var(--quiet);
      font: 10px/1.4 var(--mono);
    }
    .source-row .icon { width: 14px; height: 14px; }
    .source-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .inspector .actions { display: flex; gap: 8px; padding: 4px 16px 18px; }
    .inspector ul { margin: 0; padding: 0; list-style: none; }
    .inspector li { position: relative; padding: 4px 0 4px 14px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .inspector li::before { content: ""; position: absolute; top: 11px; left: 0; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
    .next-line {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--node);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .next-line .icon { width: 18px; height: 18px; flex: none; color: var(--quiet); margin-top: 1px; }

    .list {
      width: 100%;
      max-width: none;
      min-width: 0;
      padding: 8px 20px 32px;
    }

    .goal {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 8px 14px;
      align-items: start;
      width: 100%;
      margin-top: 12px;
      padding: 18px 18px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: var(--node);
      text-align: left;
    }

    .goal:hover { background: var(--hover); }
    .goal[aria-current="true"] { border-color: var(--ink); }
    .goal > .mark {
      width: 36px;
      height: 36px;
      margin-top: 1px;
      color: var(--ink);
      background: var(--canvas);
      box-shadow: inset 0 0 0 1.5px var(--line-strong);
    }
    .goal:hover > .mark { box-shadow: inset 0 0 0 1.5px var(--ink); }
    .goal > .mark .icon { width: 18px; height: 18px; }
    .goal .goal-copy { min-width: 0; display: grid; gap: 6px; }
    .goal strong {
      display: block;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.028em;
      line-height: 1.2;
    }

    .goal em {
      color: var(--quiet);
      font: 12px/1.2 var(--mono);
      font-style: normal;
      margin-top: 6px;
    }

    .mini {
      display: flex;
      align-items: center;
      grid-column: 2 / -1;
      gap: 0;
      margin-top: 8px;
    }

    .mini i {
      width: 9px;
      height: 9px;
      border: 1.5px solid var(--blocked);
      border-radius: 50%;
      background: var(--node);
    }

    .mini i.done { background: var(--ready); border-color: var(--ready); }
    .mini i.ready { border-color: var(--ready); }
    .mini i.attention { border-color: var(--attention); }
    .mini i.waiting { border-color: var(--quiet); border-style: dashed; }
    .mini b {
      width: 28px;
      height: 1px;
      background: var(--edge);
      font-weight: 400;
    }

    .room { margin-top: 18px; }
    .room h2 {
      margin: 0 0 4px;
      padding-left: calc(var(--depth) * 16px);
      font: 600 9px/1.3 var(--mono);
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 44px;
      padding: 6px 8px 6px calc(var(--depth) * 16px);
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .row:hover { background: var(--hover); }
    .row .type {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--kind, var(--quiet));
      font: 10px/1 var(--mono);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .row .type::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .kind-intent { --kind: var(--kind-intent); }
    .kind-decision { --kind: var(--kind-decision); }
    .kind-constraint { --kind: var(--kind-constraint); }
    .kind-contract { --kind: var(--kind-contract); }
    .kind-authority { --kind: var(--kind-authority); }
    .kind-change { --kind: var(--kind-change); }
    .kind-convention, .kind-note { --kind: var(--quiet); }

    .row b {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.006em;
    }

    .empty {
      margin: 28px 20px;
      color: var(--quiet);
      font: 14px/1.4 var(--mono);
    }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    [hidden] { display: none !important; }
  </style>
</head>
