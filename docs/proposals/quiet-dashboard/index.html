  <div class="shell">
    <div class="rail-shell" id="rail-shell">
      <aside class="rail">
      <div class="brand"><strong>VibeHub</strong><span>Local</span></div>
      <div class="project" id="project">
        <div class="project-head">
          <span class="mark" aria-hidden="true"><svg class="icon"><use href="#icon-repo"/></svg></span>
          <button class="project-switch" id="project-switch" type="button" aria-expanded="false" aria-controls="project-menu" data-explain="Switch project">
            <b id="project-name">vibehub-plugin</b>
            <svg class="caret" aria-hidden="true"><use href="#icon-arrow"/></svg>
          </button>
          <div class="project-actions" id="project-actions"></div>
        </div>
        <div class="project-menu" id="project-menu" role="listbox" aria-label="Projects" hidden></div>
        <div class="branch-switch" id="branches" aria-label="Branch"></div>
        <div class="checkout-meta">
          <button class="path-toggle" id="path-toggle" type="button" aria-expanded="false" aria-controls="worktree" aria-label="Show checkout path" data-explain="Show checkout path">
            <svg class="icon" aria-hidden="true"><use href="#icon-folder"/></svg>
            <svg class="caret" aria-hidden="true"><use href="#icon-arrow"/></svg>
          </button>
          <div class="worktree" id="worktree" hidden></div>
        </div>
      </div>
      <div class="rail-section">
        <div class="eyebrow">In this checkout</div>
        <button class="nav-item" id="scope-all" type="button"><span class="mark" aria-hidden="true"><svg class="icon"><use href="#icon-ticket"/></svg></span><span>All tickets</span><em id="scope-all-count"></em></button>
        <button class="nav-item" id="scope-open" type="button"><span class="mark" aria-hidden="true"><svg class="icon"><use href="#icon-planned"/></svg></span><span>Unassigned</span><em id="scope-open-count"></em></button>
      </div>
      <div class="rail-section is-grow">
        <div class="eyebrow">Open a goal</div>
        <nav id="goal-nav" aria-label="Goals"></nav>
      </div>
      <div class="appearance">
        <div class="eyebrow">Appearance</div>
        <div class="segment" id="theme" aria-label="Appearance">
          <button type="button" data-theme="light" aria-label="Light" data-explain="Light"><svg class="icon"><use href="#icon-sun"/></svg></button>
          <button type="button" data-theme="dark" aria-label="Dark" data-explain="Dark"><svg class="icon"><use href="#icon-moon"/></svg></button>
          <button type="button" data-theme="system" aria-label="System" data-explain="System"><svg class="icon"><use href="#icon-system"/></svg></button>
        </div>
      </div>
      </aside>
      <div class="rail-resize" id="rail-resize" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" aria-valuemin="240" aria-valuemax="520" aria-valuenow="268" data-explain="Drag to widen sidebar"></div>
    </div>
    <main class="stage">
      <header class="titlebar">
        <button class="icon-button" id="back" type="button" hidden data-explain="Goals overview" aria-label="Goals overview"><svg class="icon"><use href="#icon-back"/></svg></button>
        <div class="title-copy">
          <div class="repo" id="repo"></div>
          <div class="title-line">
            <h1 id="heading">All tickets</h1>
            <span class="count" id="count"></span>
            <span class="scope-mark" id="scope-mark">From sidebar</span>
          </div>
        </div>
        <span class="spacer"></span>
        <div class="status-wrap">
          <button class="icon-button" id="status-button" type="button" aria-expanded="false" aria-label="Status" data-explain="Status"><svg class="icon"><use href="#icon-running"/></svg></button>
          <div class="status-panel" id="status-panel" hidden>
            <p><strong id="stat-running">0</strong> Working</p>
            <p><strong id="stat-attention">0</strong> Needs you</p>
            <p><strong id="stat-goals">0</strong> Open goals</p>
            <p class="warn" id="stat-note">Recorded status.</p>
          </div>
        </div>
        <button class="icon-button" id="expand" type="button" aria-label="Expand" data-explain="Expand"><svg class="icon"><use href="#icon-expand"/></svg></button>
      </header>
      <div class="workbar">
        <span class="work-label">View</span>
        <nav class="surfaces" aria-label="View">
          <button type="button" data-surface="goals"><svg class="icon"><use href="#icon-overview"/></svg>Goals</button>
          <button type="button" data-surface="tickets" id="tickets-tab" aria-pressed="true"><svg class="icon"><use href="#icon-ticket"/></svg><span id="tickets-label">Tickets</span></button>
          <button type="button" data-surface="context"><svg class="icon"><use href="#icon-context"/></svg>Context</button>
        </nav>
        <label class="search"><svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg><span class="sr-only">Search</span><input id="search" type="search" placeholder="Find a ticket…"></label>
        <span class="spacer"></span>
        <button class="text-button" id="new-goal" type="button" hidden><svg class="icon"><use href="#icon-plus"/></svg>New goal</button>
        <div class="segment" id="arrangement" aria-label="Arrangement">
          <button type="button" data-arrange="board" aria-pressed="true" aria-label="Columns" data-explain="Columns"><svg class="icon"><use href="#icon-columns"/></svg></button>
          <button type="button" data-arrange="graph" aria-pressed="false" aria-label="Graph" data-explain="Graph"><svg class="icon"><use href="#icon-graph"/></svg></button>
        </div>
        <div class="filters" id="filters" aria-label="States"></div>
        <div class="segment" id="direction" aria-label="Layout direction">
          <button type="button" data-dir="ltr" aria-pressed="true" aria-label="Left to right" data-explain="Left to right"><svg class="icon"><use href="#icon-ltr"/></svg></button>
          <button type="button" data-dir="ttb" aria-pressed="false" aria-label="Top to bottom" data-explain="Top to bottom"><svg class="icon"><use href="#icon-ttb"/></svg></button>
        </div>
      </div>
      <div class="body">
        <div class="maincol">
          <section class="progress" id="progress" hidden></section>
          <div class="canvas" id="canvas"></div>
        </div>
        <div class="inspector-shell" id="inspector-shell" hidden>
          <div class="inspector-resize" id="inspector-resize" role="separator" aria-orientation="vertical" aria-label="Resize inspector" aria-valuemin="300" aria-valuemax="720" aria-valuenow="400" data-explain="Drag to resize"></div>
          <aside class="inspector" id="inspector"></aside>
        </div>
      </div>
    </main>
  </div>
  <div class="explain" id="explain" role="tooltip" hidden></div>

  <script>
    const STATES = {
      attention: { icon: "pending", label: "NEEDS YOU", explain: "Needs you" },
      running: { icon: "running", label: "WORKING", explain: "Working" },
      ready: { icon: "play", label: "READY", explain: "Ready" },
      planned: { icon: "planned", label: "TO PLAN", explain: "To plan" },
      waiting: { icon: "upcoming", label: "WAITING", explain: "Waiting" },
      done: { icon: "check", label: "DONE", explain: "Done" }
    };

    const LANES = ["attention", "running", "ready", "planned", "waiting", "done"];

    let BRANCHES = [];
    let PROJECTS = [];
    let tickets = [];
    let goals = [];
    let authorities = [];
    let rooms = [];
    let byId = {};
    let repoMeta = { generatedAt: null, counts: null, discoveryRoot: null };

    const state = {
      surface: "tickets",
      arrangement: "board",
      scope: "all",
      dir: "ttb",
      filters: [],
      query: "",
      selected: null,
      branch: "main",
      context: "rooms",
      record: null,
      scale: 1,
      status: false,
      focus: false,
      graphW: 640,
      graphH: 420,
      theme: "system",
      ready: false,
      loadError: null,
      inspectorW: 400,
      railW: 268,
      projectId: null,
      projectMenu: false,
      pathOpen: false
    };

    function applyTheme() {
      const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
      const dark = state.theme === "dark" || (state.theme === "system" && systemDark);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      try { localStorage.setItem("vh-quiet-theme", state.theme); } catch { /* preview storage can be blocked */ }
      for (const button of document.querySelectorAll("#theme button")) {
        button.setAttribute("aria-pressed", String(button.dataset.theme === state.theme));
      }
    }

    function clampInspectorWidth(width) {
      const rail = state.focus ? 0 : state.railW;
      const max = Math.min(window.innerWidth * 0.72, 720, Math.max(300, window.innerWidth - rail - 360));
      return Math.round(Math.max(300, Math.min(max, width)));
    }

    function applyInspectorWidth(width = state.inspectorW) {
      state.inspectorW = clampInspectorWidth(width);
      document.documentElement.style.setProperty("--inspector-w", `${state.inspectorW}px`);
      const handle = document.getElementById("inspector-resize");
      if (handle) {
        handle.setAttribute("aria-valuenow", String(state.inspectorW));
        handle.setAttribute("aria-valuemin", "300");
        handle.setAttribute("aria-valuemax", String(Math.round(Math.min(window.innerWidth * 0.72, 720, Math.max(300, window.innerWidth - (state.focus ? 0 : state.railW) - 360)))));
      }
      try { localStorage.setItem("vh-quiet-inspector-w", String(state.inspectorW)); } catch { /* preview storage can be blocked */ }
    }

    function clampRailWidth(width) {
      const inspectorOpen = !document.getElementById("inspector-shell")?.hidden;
      const inspector = inspectorOpen ? state.inspectorW : 0;
      const max = Math.min(520, Math.max(240, window.innerWidth - inspector - 360));
      return Math.round(Math.max(240, Math.min(max, width)));
    }

    function applyRailWidth(width = state.railW) {
      state.railW = clampRailWidth(width);
      document.documentElement.style.setProperty("--rail-w", `${state.railW}px`);
      const handle = document.getElementById("rail-resize");
      if (handle) {
        handle.setAttribute("aria-valuenow", String(state.railW));
        handle.setAttribute("aria-valuemin", "240");
        handle.setAttribute("aria-valuemax", String(Math.min(520, Math.max(240, window.innerWidth - 360))));
      }
      try { localStorage.setItem("vh-quiet-rail-w", String(state.railW)); } catch { /* preview storage can be blocked */ }
      applyInspectorWidth(state.inspectorW);
    }

    function showInspector(open) {
      const shell = document.getElementById("inspector-shell");
      const inspector = document.getElementById("inspector");
      shell.hidden = !open;
      if (!open) inspector.innerHTML = "";
      applyRailWidth(state.railW);
    }

    function bindInspectorResize() {
      const handle = document.getElementById("inspector-resize");
      if (!handle || handle.dataset.bound === "1") return;
      handle.dataset.bound = "1";
      let originX = 0;
      let originW = 0;

      const onMove = (event) => {
        applyInspectorWidth(originW + (originX - event.clientX));
      };

      const onUp = () => {
        document.body.classList.remove("is-resizing-inspector");
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
      };

      handle.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        originX = event.clientX;
        originW = state.inspectorW;
        document.body.classList.add("is-resizing-inspector");
        handle.setPointerCapture?.(event.pointerId);
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onUp);
      });

      handle.addEventListener("keydown", (event) => {
        const step = event.shiftKey ? 40 : 16;
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          applyInspectorWidth(state.inspectorW + step);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          applyInspectorWidth(state.inspectorW - step);
        } else if (event.key === "Home") {
          event.preventDefault();
          applyInspectorWidth(300);
        } else if (event.key === "End") {
          event.preventDefault();
          applyInspectorWidth(720);
        }
      });
      handle.tabIndex = 0;
    }

    function bindRailResize() {
      const handle = document.getElementById("rail-resize");
      if (!handle || handle.dataset.bound === "1") return;
      handle.dataset.bound = "1";
      let originX = 0;
      let originW = 0;

      const onMove = (event) => {
        applyRailWidth(originW + (event.clientX - originX));
      };

      const onUp = () => {
        document.body.classList.remove("is-resizing-rail");
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
      };

      handle.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        originX = event.clientX;
        originW = state.railW;
        document.body.classList.add("is-resizing-rail");
        handle.setPointerCapture?.(event.pointerId);
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onUp);
      });

      handle.addEventListener("keydown", (event) => {
        const step = event.shiftKey ? 40 : 16;
        if (event.key === "ArrowRight") {
          event.preventDefault();
          applyRailWidth(state.railW + step);
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          applyRailWidth(state.railW - step);
        } else if (event.key === "Home") {
          event.preventDefault();
          applyRailWidth(240);
        } else if (event.key === "End") {
          event.preventDefault();
          applyRailWidth(520);
        }
      });
      handle.tabIndex = 0;
    }

    try { state.theme = localStorage.getItem("vh-quiet-theme") || "system"; } catch { state.theme = "system"; }
    try {
      const savedWidth = Number(localStorage.getItem("vh-quiet-inspector-w"));
      if (Number.isFinite(savedWidth) && savedWidth > 0) state.inspectorW = savedWidth;
    } catch { /* preview storage can be blocked */ }
    try {
      const savedRail = Number(localStorage.getItem("vh-quiet-rail-w"));
      if (Number.isFinite(savedRail) && savedRail > 0) state.railW = savedRail;
    } catch { /* preview storage can be blocked */ }
    applyTheme();
    applyRailWidth();
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (state.theme === "system") applyTheme();
    });
    window.addEventListener("resize", () => applyRailWidth(state.railW));

    function applyProject(project) {
      if (!project) return;
      state.projectId = project.projectId || project.checkout?.path || project.checkout?.name;
      BRANCHES = [project.checkout];
      tickets = project.tickets || [];
      goals = project.goals || [];
      authorities = project.authorities || [];
      rooms = project.rooms || [];
      byId = Object.fromEntries(tickets.map((ticket) => [ticket.id, ticket]));
      state.branch = project.checkout.id;
      state.selected = null;
      state.record = null;
      state.scope = "all";
      state.filters = [];
      state.surface = "tickets";
      state.projectMenu = false;
    }

    function ingestRepoData(data) {
      PROJECTS = Array.isArray(data.projects) && data.projects.length
        ? data.projects
        : [{
            projectId: data.activeProjectId || data.checkout?.name || "current",
            checkout: data.checkout,
            goals: data.goals || [],
            tickets: data.tickets || [],
            rooms: data.rooms || [],
            authorities: data.authorities || [],
            counts: data.counts
          }];
      const active = PROJECTS.find((item) => item.projectId === data.activeProjectId)
        || PROJECTS.find((item) => item.checkout?.path === data.checkout?.path)
        || PROJECTS[0];
      applyProject(active);
      repoMeta = {
        generatedAt: data.generatedAt,
        counts: active?.counts || data.counts,
        discoveryRoot: data.discoveryRoot || null
      };
      state.ready = true;
      state.loadError = null;
    }

    async function loadRepoData() {
      try {
        const response = await fetch(`repo-data.json?v=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        ingestRepoData(await response.json());
      } catch (error) {
        state.ready = false;
        state.loadError = error.message || String(error);
      }
      render();
    }

    function icon(id) {
      return `<svg class="icon" aria-hidden="true"><use href="#icon-${id}"/></svg>`;
    }

    function onBranch(ticket) {
      return (ticket.branches || ["main"]).includes(state.branch);
    }

    function memberIds(goalId, seen = new Set()) {
      if (seen.has(goalId)) return new Set();
      seen.add(goalId);
      const ids = new Set();
      for (const ticket of tickets) if (ticket.goal === goalId && onBranch(ticket)) ids.add(ticket.id);
      for (const goal of goals) if (goal.partOf === goalId) for (const id of memberIds(goal.id, seen)) ids.add(id);
      return ids;
    }

    function members(goalId) {
      const ids = memberIds(goalId);
      return tickets.filter((ticket) => ids.has(ticket.id));
    }

    function goalLane(goal) {
      const group = members(goal.id);
      if (!group.length) return "planned";
      if (group.every((ticket) => ticket.state === "done")) return "done";
      return LANES.find((lane) => group.some((ticket) => ticket.state === lane)) || "planned";
    }

    function goalsInView() {
      return goals.filter((goal) => members(goal.id).length);
    }

    function ticketPool() {
      const list = tickets.filter(onBranch);
      if (state.scope === "unassigned") return list.filter((ticket) => !ticket.goal);
      if (goals.some((goal) => goal.id === state.scope)) {
        const ids = memberIds(state.scope);
        return list.filter((ticket) => ids.has(ticket.id));
      }
      return list;
    }

    function matchesQuery(item) {
      if (!state.query) return true;
      const haystack = `${item.id || ""} ${item.title || ""} ${item.outcome || ""} ${item.summary || ""} ${item.detail || ""} ${item.type || ""} ${item.room || ""} ${item.path || ""} ${(item.tags || []).join(" ")}`.toLowerCase();
      return haystack.includes(state.query.toLowerCase());
    }

    function filterIsAll() {
      return state.filters.length === 0;
    }

    function laneActive(lane) {
      return filterIsAll() || state.filters.includes(lane);
    }

    function boardLanes() {
      return filterIsAll() ? LANES : LANES.filter((lane) => state.filters.includes(lane));
    }

    function toggleFilter(key) {
      if (key === "all") {
        state.filters = [];
        return;
      }
      if (!LANES.includes(key)) return;
      if (state.filters.includes(key)) {
        state.filters = state.filters.filter((lane) => lane !== key);
      } else {
        state.filters = [...state.filters, key];
      }
      if (state.filters.length === LANES.length) state.filters = [];
    }

    function visible() {
      return ticketPool().filter((ticket) => laneActive(ticket.state) && matchesQuery(ticket));
    }

    /** Graph default (no state filter) is Active work — omit Done unless selected/neighbor. */
    function graphIsActiveDefault() {
      return state.surface === "tickets" && state.arrangement === "graph" && filterIsAll();
    }

    function omitDoneOnActiveGraph(list) {
      if (!graphIsActiveDefault()) return list;
      const open = list.filter((ticket) => ticket.state !== "done");
      if (!open.length || open.length >= list.length) return list;
      const keep = new Set(open.map((ticket) => ticket.id));
      if (state.selected) {
        keep.add(state.selected);
        related(state.selected, "in").forEach((item) => keep.add(item.id));
        related(state.selected, "out").forEach((item) => keep.add(item.id));
      }
      return list.filter((ticket) => keep.has(ticket.id));
    }

    function shownTickets() {
      const list = visible();
      return state.arrangement === "graph" ? omitDoneOnActiveGraph(list) : list;
    }

    function goalNodes() {
      return goalsInView().filter(matchesQuery).filter((goal) => laneActive(goalLane(goal))).map((goal) => ({
        id: goal.id,
        title: goal.title,
        state: goalLane(goal),
        partOf: goal.partOf,
        kind: "goal",
        outcome: goal.outcome
      }));
    }

    function edgesOf(list) {
      const ids = new Set(list.map((ticket) => ticket.id));
      const edges = [];
      for (const ticket of list) {
        for (const req of ticket.requires || []) {
          if (ids.has(req)) edges.push({ from: req, to: ticket.id });
        }
      }
      return edges;
    }

    function route(from, to, index, vertical) {
      if (vertical) {
        const sx = from.x + from.w / 2;
        const sy = from.y + from.h;
        const tx = to.x + to.w / 2;
        const ty = to.y;
        if (ty - sy > 0 && ty - sy < 158) {
          if (sx === tx) return `M${sx} ${sy} V${ty}`;
          const my = (sy + ty) / 2;
          const radius = Math.min(16, Math.abs(tx - sx) / 2);
          const direction = tx >= sx ? 1 : -1;
          return `M${sx} ${sy} V${my - radius} Q${sx} ${my} ${sx + radius * direction} ${my} H${tx - radius * direction} Q${tx} ${my} ${tx} ${my + radius} V${ty}`;
        }
        const side = Math.min(from.gutter, to.gutter) - 18 - (index % 3) * 6;
        const forward = ty > sy;
        return `M${sx} ${sy} V${sy + 16} Q${sx} ${sy + 28} ${sx - 12} ${sy + 28} H${side + 12} Q${side} ${sy + 28} ${side} ${sy + (forward ? 40 : 16)} V${ty - (forward ? 40 : 28)} Q${side} ${ty - 28} ${side + 12} ${ty - 28} H${tx - 12} Q${tx} ${ty - 28} ${tx} ${ty - 16} V${ty}`;
      }
      const sx = from.x + from.w;
      const sy = from.y + from.h / 2;
      const tx = to.x;
      const ty = to.y + to.h / 2;
      if (tx - sx > 0 && tx - sx < 292) {
        if (sy === ty) return `M${sx} ${sy} H${tx}`;
        const mx = (sx + tx) / 2;
        const radius = Math.min(16, Math.abs(ty - sy) / 2, Math.abs(tx - sx) / 2);
        const direction = ty >= sy ? 1 : -1;
        return `M${sx} ${sy} H${mx - radius} Q${mx} ${sy} ${mx} ${sy + radius * direction} V${ty - radius * direction} Q${mx} ${ty} ${mx + radius} ${ty} H${tx}`;
      }
      const side = Math.min(from.gutter, to.gutter) - 18 - (index % 3) * 6;
      const forward = tx > sx;
      return `M${sx} ${sy} H${sx + 16} Q${sx + 28} ${sy} ${sx + 28} ${sy - 12} V${side + 12} Q${sx + 28} ${side} ${sx + (forward ? 40 : 16)} ${side} H${tx - (forward ? 40 : 28)} Q${tx - 28} ${side} ${tx - 28} ${side + 12} V${ty - 12} Q${tx - 28} ${ty} ${tx - 16} ${ty} H${tx}`;
    }

    function layoutGraph(list) {
      const vertical = state.dir !== "ltr";
      const cardWidth = 240;
      const cardHeight = 96;
      const sibling = vertical ? 288 : 132;
      const rankStep = vertical ? 168 : 304;
      const pad = 40;
      const ids = new Map(list.map((item) => [item.id, item]));
      const edges = [];
      for (const ticket of list) {
        for (const req of ticket.requires || []) if (ids.has(req)) edges.push({ from: req, to: ticket.id });
        if (ticket.partOf && ids.has(ticket.partOf)) edges.push({ from: ticket.partOf, to: ticket.id, membership: true });
      }
      edges.sort((a, b) => a.from.localeCompare(b.from) || a.to.localeCompare(b.to));
      const next = new Map(list.map((ticket) => [ticket.id, []]));
      const previous = new Map(list.map((ticket) => [ticket.id, []]));
      for (const edge of edges) {
        next.get(edge.from).push(edge.to);
        previous.get(edge.to).push(edge.from);
      }
      const remaining = new Map([...previous].map(([id, parents]) => [id, parents.length]));
      const ready = [...ids.keys()].filter((id) => !remaining.get(id)).sort();
      const order = [];
      const ranks = new Map();
      while (ready.length) {
        const id = ready.shift();
        order.push(id);
        ranks.set(id, ranks.get(id) || 0);
        for (const child of next.get(id)) {
          ranks.set(child, Math.max(ranks.get(child) || 0, ranks.get(id) + 1));
          remaining.set(child, remaining.get(child) - 1);
          if (!remaining.get(child)) {
            ready.push(child);
            ready.sort();
          }
        }
      }
      for (const id of [...ids.keys()].filter((id) => !ranks.has(id)).sort()) {
        ranks.set(id, 0);
        order.push(id);
      }
      const unseen = new Set([...ids.keys()].sort());
      const components = [];
      while (unseen.size) {
        const queue = [unseen.values().next().value];
        const component = [];
        unseen.delete(queue[0]);
        while (queue.length) {
          const id = queue.shift();
          component.push(id);
          for (const neighbor of [...next.get(id), ...previous.get(id)].sort()) {
            if (unseen.delete(neighbor)) queue.push(neighbor);
          }
        }
        components.push(component);
      }
      const priority = { attention: 0, ready: 1, blocked: 2, waiting: 3, done: 4 };
      const open = (group) => group.some((id) => ids.get(id).state !== "done");
      const urgent = (group) => Math.min(...group.map((id) => priority[ids.get(id).state]));
      components.sort((a, b) => Number(open(b)) - Number(open(a)) || urgent(a) - urgent(b) || b.length - a.length || a[0].localeCompare(b[0]));
      const positions = new Map();
      let shelfMain = pad;
      let shelfCross = pad;
      let shelfSpan = 0;
      let span = 0;
      const maxMain = Math.max(720, (document.getElementById("canvas").clientWidth || 1100) - 8);
      for (const component of components) {
        const layers = [];
        for (const id of component) (layers[ranks.get(id)] ||= []).push(id);
        const filled = layers.filter(Boolean);
        const maxSiblings = Math.max(...filled.map((layer) => layer.length));
        const componentMain = (maxSiblings - 1) * sibling + (vertical ? cardWidth : cardHeight);
        const componentCross = (filled.length - 1) * rankStep + (vertical ? cardHeight : cardWidth);
        if (shelfMain > pad && shelfMain + componentMain + pad > maxMain) {
          shelfCross += shelfSpan + 72;
          shelfMain = pad;
          shelfSpan = 0;
        }
        const ordinal = new Map();
        filled.forEach((layer) => {
          const center = (id) => {
            const parents = previous.get(id).filter((parent) => ordinal.has(parent));
            return parents.length ? parents.reduce((sum, parent) => sum + ordinal.get(parent), 0) / parents.length : 0;
          };
          layer.sort((a, b) => center(a) - center(b) || a.localeCompare(b));
          layer.forEach((id, index) => {
            const along = shelfMain + (maxSiblings - layer.length) * sibling / 2 + index * sibling;
            ordinal.set(id, along);
            const rank = ranks.get(id);
            positions.set(id, {
              x: vertical ? along : shelfCross + rank * rankStep,
              y: vertical ? shelfCross + rank * rankStep : along,
              w: cardWidth,
              h: cardHeight,
              gutter: shelfMain
            });
          });
        });
        span = Math.max(span, shelfMain + componentMain + pad);
        shelfMain += componentMain + 64;
        shelfSpan = Math.max(shelfSpan, componentCross);
      }
      const branchColors = new Map();
      const edgeColors = new Map();
      let colorCursor = 0;
      for (const id of order) {
        if (!positions.has(id)) continue;
        if (!branchColors.has(id)) branchColors.set(id, colorCursor++ % 3);
        edges.filter((edge) => edge.from === id && !edge.membership).forEach((edge, index) => {
          const color = index ? colorCursor++ % 3 : branchColors.get(id);
          edgeColors.set(edge, color);
          if (!branchColors.has(edge.to)) branchColors.set(edge.to, color);
        });
      }
      const nodes = order.filter((id) => positions.has(id)).map((id) => ({ ...ids.get(id), ...positions.get(id) }));
      const nodeById = new Map(nodes.map((node) => [node.id, node]));
      const connections = edges.map((edge, index) => ({
        ...edge,
        color: edgeColors.get(edge) ?? 0,
        d: route(nodeById.get(edge.from), nodeById.get(edge.to), index, vertical)
      }));
      return {
        nodes,
        connections,
        width: vertical ? Math.max(span, cardWidth + pad * 2) : shelfCross + shelfSpan + pad,
        height: vertical ? shelfCross + shelfSpan + pad : Math.max(span, cardHeight + pad * 2)
      };
    }

    function currentCheckout() {
      return BRANCHES.find((item) => item.id === state.branch) || BRANCHES[0] || {
        id: "main",
        branch: "main",
        name: "vibehub-plugin",
        path: "/Users/waynewang/vibehub-plugin",
        remote: null
      };
    }

    function editorHref(path) {
      return `cursor://file${path}`;
    }

    function absoluteCheckoutPath(relOrAbs) {
      const checkout = currentCheckout();
      if (!relOrAbs) return checkout.path;
      if (relOrAbs.startsWith("/")) return relOrAbs;
      const root = String(checkout.path || "").replace(/\/$/, "");
      return `${root}/${String(relOrAbs).replace(/^\.\//, "")}`;
    }

    function githubBlobHref(relPath) {
      const checkout = currentCheckout();
      if (!checkout.remote || !relPath) return null;
      const remote = String(checkout.remote).replace(/\.git$/, "").replace(/\/$/, "");
      const branch = encodeURIComponent(checkout.branch || "main");
      const path = String(relPath).replace(/^\.\//, "").split("/").map(encodeURIComponent).join("/");
      return `${remote}/blob/${branch}/${path}`;
    }

    function pathActions(relPath) {
      const abs = absoluteCheckoutPath(relPath);
      const blob = githubBlobHref(relPath);
      const remote = blob
        ? `<a class="icon-button" href="${blob}" target="_blank" rel="noreferrer" aria-label="Open on GitHub" data-explain="Open on GitHub"><svg class="icon use-fill"><use href="#icon-github"/></svg></a>`
        : "";
      return `${remote}<a class="icon-button" href="${editorHref(abs)}" aria-label="Open in editor" data-explain="Open in editor"><svg class="icon"><use href="#icon-editor"/></svg></a>`;
    }

    function setFoldPathExpanded(toggle, expanded) {
      if (!toggle) return;
      const wrap = toggle.closest(".fold-path");
      const value = wrap?.querySelector(".fold-path-value");
      toggle.setAttribute("aria-expanded", String(expanded));
      const noun = toggle.dataset.pathNoun || "path";
      const explain = expanded ? `Hide ${noun}` : `Show ${noun}`;
      toggle.dataset.explain = explain;
      toggle.setAttribute("aria-label", explain);
      if (value) value.hidden = !expanded;
    }

    function foldPathControl(path, { label = "path", actions = true } = {}) {
      if (!path) return "";
      const actionRow = actions
        ? `<span class="fold-path-actions">${pathActions(path)}</span>`
        : "";
      return `<div class="fold-path">
        <div class="fold-path-row">
          <button class="path-toggle" type="button" data-fold-path data-path-noun="${label}" aria-expanded="false" aria-label="Show ${label}" data-explain="Show ${label}">
            <svg class="icon" aria-hidden="true"><use href="#icon-folder"/></svg>
            <svg class="caret" aria-hidden="true"><use href="#icon-arrow"/></svg>
          </button>
          ${actionRow}
        </div>
        <code class="fold-path-value" hidden>${path}</code>
      </div>`;
    }

    function repoActions(checkout) {
      const remote = checkout.remote
        ? `<a class="icon-button" href="${checkout.remote}" target="_blank" rel="noreferrer" aria-label="Open on GitHub" data-explain="Open on GitHub"><svg class="icon use-fill"><use href="#icon-github"/></svg></a>`
        : "";
      return `${remote}<a class="icon-button" href="${editorHref(checkout.path)}" aria-label="Open in editor" data-explain="Open in editor"><svg class="icon"><use href="#icon-editor"/></svg></a>`;
    }

    function renderRail() {
      const pool = tickets.filter(onBranch);
      const checkout = currentCheckout();
      const mark = (id, on) => {
        const button = document.getElementById(id);
        if (on) button.setAttribute("aria-current", "true");
        else button.removeAttribute("aria-current");
      };
      mark("scope-all", state.surface === "tickets" && state.scope === "all");
      mark("scope-open", state.surface === "tickets" && state.scope === "unassigned");
      document.getElementById("scope-all-count").textContent = String(pool.length);
      document.getElementById("scope-open-count").textContent = String(pool.filter((ticket) => !ticket.goal).length);
      document.getElementById("project-name").textContent = checkout.name;
      document.getElementById("project-actions").innerHTML = repoActions(checkout);
      const switcher = document.getElementById("project-switch");
      const menu = document.getElementById("project-menu");
      const multi = PROJECTS.length > 1;
      switcher.disabled = !multi;
      switcher.setAttribute("aria-expanded", String(multi && state.projectMenu));
      switcher.querySelector(".caret").hidden = !multi;
      menu.hidden = !(multi && state.projectMenu);
      menu.innerHTML = multi ? PROJECTS.map((project) => {
        const item = project.checkout;
        const pressed = (project.projectId || item.path) === state.projectId;
        const unavailable = Boolean(project.loadError);
        const openCount = project.counts?.open ?? 0;
        const status = unavailable
          ? `<span class="project-status is-bad">Unavailable</span>`
          : openCount > 0
            ? `<span class="project-status is-open">${openCount} open</span>`
            : `<span class="project-status is-clear">Clear</span>`;
        const note = unavailable
          ? `<span class="project-option-note">Schema or checkout needs repair before it can open.</span>`
          : "";
        return `<button class="project-option${unavailable ? " is-unavailable" : ""}" type="button" role="option" data-project="${project.projectId}" aria-pressed="${pressed}" data-explain="Open ${item.name}"><span class="project-option-top"><strong>${item.name}</strong>${status}</span><span class="project-option-path">${item.path}</span>${note}</button>`;
      }).join("") : "";
      document.getElementById("branches").innerHTML = BRANCHES.map((branch) =>
        `<button type="button" data-branch="${branch.id}" aria-pressed="${state.branch === branch.id}" data-explain="Switch to ${branch.branch}"><svg class="icon"><use href="#icon-branch"/></svg>${branch.branch}</button>`
      ).join("");
      const pathToggle = document.getElementById("path-toggle");
      const worktree = document.getElementById("worktree");
      const pathExplain = state.pathOpen ? "Hide checkout path" : "Show checkout path";
      pathToggle.setAttribute("aria-expanded", String(state.pathOpen));
      pathToggle.setAttribute("aria-label", pathExplain);
      pathToggle.dataset.explain = pathExplain;
      worktree.hidden = !state.pathOpen;
      worktree.textContent = checkout.path;
      worktree.title = checkout.path;
      const ordered = [];
      const roots = goalsInView().filter((goal) => !goal.partOf);
      const childrenOf = (id) => goalsInView().filter((goal) => goal.partOf === id);
      for (const root of roots) {
        ordered.push({ goal: root, child: false });
        for (const child of childrenOf(root.id)) ordered.push({ goal: child, child: true });
      }
      for (const goal of goalsInView()) {
        if (!ordered.some((item) => item.goal.id === goal.id)) ordered.push({ goal, child: Boolean(goal.partOf) });
      }
      document.getElementById("goal-nav").innerHTML = ordered.map(({ goal, child }) => {
        const current = state.surface === "tickets" && state.scope === goal.id ? " aria-current=\"true\"" : "";
        const nest = child ? " is-child" : "";
        return `<button class="nav-item${nest}" type="button" data-goal="${goal.id}" data-explain="Open ${goal.title}"${current}><span class="mark" aria-hidden="true"><svg class="icon"><use href="#icon-overview"/></svg></span><span>${goal.title}</span><em>${members(goal.id).length}</em></button>`;
      }).join("");
    }

    function activeGoal() {
      return goals.find((goal) => goal.id === state.scope) || null;
    }

    function renderBar() {
      const goal = activeGoal();
      const checkout = currentCheckout();
      const activeGraph = graphIsActiveDefault();
      let heading = "All tickets";
      let mark = "";
      if (state.surface === "goals") heading = "Goals";
      else if (state.surface === "context") heading = "Context";
      else if (goal) { heading = goal.title; mark = activeGraph ? "Active" : "Goal"; }
      else if (state.scope === "unassigned") { heading = "Unassigned"; mark = activeGraph ? "Active" : "Scope"; }
      else if (activeGraph) heading = "Active tickets";
      else mark = "Scope";
      document.getElementById("heading").textContent = heading;
      document.getElementById("repo").innerHTML = `
        <span class="repo-chip" title="${checkout.path}">
          <svg class="icon"><use href="#icon-repo"/></svg>
          <strong>${checkout.name}</strong>
          <span class="slash">/</span>
          <svg class="icon"><use href="#icon-branch"/></svg>
          <em>${checkout.branch}</em>
        </span>
        <span class="repo-actions">${repoActions(checkout)}</span>`;
      const scopeMark = document.getElementById("scope-mark");
      scopeMark.textContent = mark;
      scopeMark.classList.toggle("is-on", Boolean(mark) && state.surface === "tickets");
      document.getElementById("back").hidden = !(state.surface === "tickets" && goal);
      document.getElementById("tickets-label").textContent = "Tickets";
      const shown = state.surface === "tickets" ? shownTickets() : state.surface === "goals" ? goalNodes() : contextHits();
      const countEl = document.getElementById("count");
      countEl.textContent = String(shown.length);
      countEl.title = activeGraph ? "Currently active · Done omitted until you select it" : "";
      for (const button of document.querySelectorAll(".surfaces button")) {
        button.setAttribute("aria-pressed", String(button.dataset.surface === state.surface));
      }
      const onWork = state.surface !== "context";
      const onGraph = onWork && state.arrangement === "graph";
      document.getElementById("arrangement").hidden = !onWork;
      document.getElementById("filters").hidden = !onWork;
      document.getElementById("direction").hidden = !onGraph;
      document.getElementById("new-goal").hidden = state.surface !== "goals";
      const boardButton = document.querySelector("#arrangement [data-arrange=board]");
      const boardName = state.surface === "goals" ? "Overview" : "Columns";
      boardButton.dataset.explain = boardName;
      boardButton.setAttribute("aria-label", boardName);
      boardButton.querySelector("use").setAttribute("href", state.surface === "goals" ? "#icon-overview" : "#icon-columns");
      for (const button of document.querySelectorAll("#arrangement button")) {
        button.setAttribute("aria-pressed", String(button.dataset.arrange === state.arrangement));
      }
      for (const button of document.querySelectorAll("#direction button")) {
        button.setAttribute("aria-pressed", String(button.dataset.dir === state.dir));
      }
      const search = document.getElementById("search");
      search.placeholder = state.surface === "context" ? "Find a room or record…" : state.surface === "goals" ? "Find a goal…" : "Find a ticket…";
      const pool = state.surface === "goals"
        ? goalsInView().map((item) => ({ state: goalLane(item) }))
        : ticketPool();
      const activePool = pool.filter((item) => item.state !== "done");
      const counts = { all: onGraph ? activePool.length : pool.length };
      for (const key of LANES) counts[key] = pool.filter((item) => item.state === key).length;
      document.getElementById("filters").innerHTML = ["all", ...LANES].map((key) => {
        const meta = key === "all"
          ? (onGraph
            ? { icon: "overview", explain: "Active · Done omitted until selected", label: "Active" }
            : { icon: "overview", explain: "All states", label: "All" })
          : { ...STATES[key], explain: `${STATES[key].explain} · click to add or remove` };
        const pressed = key === "all" ? filterIsAll() : state.filters.includes(key);
        return `<button type="button" data-filter="${key}" aria-label="${meta.label || meta.explain}" data-explain="${meta.explain}" aria-pressed="${pressed}">${icon(meta.icon)}<em>${counts[key] || 0}</em></button>`;
      }).join("");
      const branchTickets = tickets.filter(onBranch);
      const running = branchTickets.filter((ticket) => ticket.state === "running").length;
      const attention = branchTickets.filter((ticket) => ticket.state === "attention").length;
      const openGoals = goalsInView().filter((item) => goalLane(item) !== "done" && !item.partOf).length;
      document.getElementById("stat-running").textContent = String(running);
      document.getElementById("stat-attention").textContent = String(attention);
      document.getElementById("stat-goals").textContent = String(openGoals);
      document.getElementById("status-panel").hidden = !state.status;
      document.getElementById("status-button").setAttribute("aria-expanded", String(state.status));
      const expand = document.getElementById("expand");
      expand.dataset.explain = state.focus ? "Close" : "Expand";
      expand.setAttribute("aria-label", expand.dataset.explain);
      document.body.classList.toggle("is-focus", state.focus);
    }

    function renderProgress() {
      const bar = document.getElementById("progress");
      const goal = activeGoal();
      if (!goal || state.surface !== "tickets") {
        bar.hidden = true;
        bar.innerHTML = "";
        return;
      }
      const group = members(goal.id);
      const done = group.filter((ticket) => ticket.state === "done").length;
      const chips = LANES.filter((lane) => group.some((ticket) => ticket.state === lane)).map((lane) => {
        const count = group.filter((ticket) => ticket.state === lane).length;
        return `<button type="button" class="chip" data-filter="${lane}" aria-pressed="${state.filters.includes(lane)}">${count} ${STATES[lane].explain}</button>`;
      }).join("");
      bar.hidden = false;
      bar.innerHTML = `<span class="meter" aria-hidden="true"><i style="width:${group.length ? (done / group.length) * 100 : 0}%"></i></span><span>${done}/${group.length}</span>${chips}<span class="spacer"></span><button class="text-button" id="copy-steps" type="button">Copy next steps</button>`;
    }

    function card(ticket, extra = "") {
      const meta = STATES[ticket.state];
      return `<button class="node state-${ticket.state}${extra}" type="button" data-id="${ticket.id}" aria-pressed="${state.selected === ticket.id}"><span class="aperture" aria-hidden="true"></span><span class="nid">${ticket.id}</span><span class="nstate"><span class="mark" data-explain="${meta.explain}">${icon(meta.icon)}</span><span class="sr">${meta.label}</span></span><span class="ntitle">${ticket.title}</span></button>`;
    }

    function renderBoard() {
      const list = visible();
      const lanes = boardLanes();
      const solo = lanes.length === 1;
      const columns = lanes.map((lane) => {
        const items = list.filter((ticket) => ticket.state === lane);
        const meta = STATES[lane];
        let cards;
        if (lane === "done" && filterIsAll() && items.length > 12) {
          cards = `<p class="lane-empty">${items.length} done. Open the Done filter to list them.</p>`;
        } else {
          cards = items.length ? items.map((ticket) => card(ticket, " in-column")).join("") : `<p class="lane-empty">None</p>`;
        }
        return `<section class="column lane-${lane}"><header class="column-head">${icon(meta.icon)}<span>${meta.label}</span><em>${items.length}</em></header><div class="column-stack">${cards}</div></section>`;
      }).join("");
      const board = `<div class="board${solo ? " is-solo" : ""}" data-cols="${lanes.length}">${columns}</div>`;
      const ticket = byId[state.selected];
      if (!ticket || !list.some((item) => item.id === ticket.id)) return board;
      const incoming = related(ticket.id, "in");
      const outgoing = related(ticket.id, "out");
      const group = (items) => items.length ? `<div class="cone-group">${items.map((item) => card(item, " cone-card")).join("")}</div>` : "";
      const line = `<span class="cone-line" aria-hidden="true"></span>`;
      return `<div class="with-cone">${board}<div class="cone">${group(incoming)}${incoming.length ? line : ""}${card(ticket, " cone-card")}${outgoing.length ? line : ""}${group(outgoing)}<p class="cone-note">${ticket.outcome}</p></div></div>`;
    }

    function renderGraph() {
      const list = state.surface === "goals" ? goalNodes() : shownTickets();
      if (!list.length) return `<p class="empty">None</p>`;
      const geometry = layoutGraph(list);
      state.graphW = geometry.width;
      state.graphH = geometry.height;
      const focusId = state.surface === "goals" ? null : state.selected;
      const hot = new Set();
      if (focusId) {
        hot.add(focusId);
        for (const edge of geometry.connections) {
          if (edge.from === focusId || edge.to === focusId) {
            hot.add(edge.from);
            hot.add(edge.to);
          }
        }
      }
      const paths = geometry.connections.map((edge) => {
        const on = focusId && (edge.from === focusId || edge.to === focusId);
        const dim = focusId && !on;
        return `<path data-from="${edge.from}" data-to="${edge.to}" d="${edge.d}" class="${edge.membership ? "is-member" : `flow-${edge.color}`}${on ? " is-hot" : ""}${dim ? " is-dim" : ""}"></path>`;
      }).join("");
      const nodes = geometry.nodes.map((ticket) => {
        const meta = STATES[ticket.state];
        const dim = focusId && !hot.has(ticket.id);
        const attr = ticket.kind === "goal" ? `data-goal="${ticket.id}"` : `data-id="${ticket.id}"`;
        const pressed = ticket.kind === "goal" ? state.scope === ticket.id : state.selected === ticket.id;
        return `<button class="node state-${ticket.state}${dim ? " is-dim" : ""}" type="button" ${attr} aria-pressed="${pressed}" style="left:${ticket.x}px;top:${ticket.y}px"><span class="aperture" aria-hidden="true"></span><span class="nid">${ticket.id}</span><span class="nstate"><span class="mark" data-explain="${meta.explain}">${icon(meta.icon)}</span><span class="sr">${meta.label}</span></span><span class="ntitle">${ticket.title}</span></button>`;
      }).join("");
      const width = Math.max(geometry.width, 640);
      const height = Math.max(geometry.height, 420);
      return `<div class="graph-frame"><div class="graph-viewport" id="graph-viewport"><div style="width:${width * state.scale}px;height:${height * state.scale}px"><div class="graph dir-${state.dir}" style="width:${width}px;height:${height}px;transform:scale(${state.scale});transform-origin:0 0"><svg class="edges" aria-hidden="true">${paths}</svg>${nodes}</div></div></div><div class="zoom" aria-label="Zoom"><button type="button" data-zoom="out" data-explain="Zoom out">−</button><button type="button" data-zoom="in" data-explain="Zoom in">+</button><button type="button" data-zoom="fit" data-explain="Fit">Fit</button><button type="button" data-zoom="one" data-explain="Actual size">1:1</button></div></div>`;
    }

    function renderGoals() {
      const list = goalNodes();
      if (!list.length) return `<p class="empty">None</p>`;
      if (state.arrangement === "graph") return renderGraph();
      return `<div class="list">${list.map((goal) => {
        const source = goals.find((item) => item.id === goal.id);
        const group = members(goal.id);
        const done = group.filter((ticket) => ticket.state === "done").length;
        const needs = group.filter((ticket) => ticket.state === "attention").length;
        const parent = source.partOf ? goals.find((item) => item.id === source.partOf) : null;
        const signal = needs ? `<span class="signal">${needs} need you</span>` : `<span class="signal quiet">${STATES[goal.state].explain}</span>`;
        return `<button class="goal" type="button" data-goal="${goal.id}" data-explain="Open ${goal.title}"><span class="mark" aria-hidden="true"><svg class="icon"><use href="#icon-overview"/></svg></span><span class="goal-copy"><strong>${goal.title}</strong>${parent ? `<span class="part">Part of ${parent.title}</span>` : `<span class="part">${source.outcome}</span>`}</span><em>${done}/${group.length}</em><span class="meter" aria-hidden="true"><i style="width:${group.length ? (done / group.length) * 100 : 0}%"></i></span>${signal}</button>`;
      }).join("")}</div>`;
    }

    function contextHits() {
      if (state.context === "authority") return authorities.filter(matchesQuery);
      return rooms.flatMap((room) => room.records.map((record) => ({ ...record, room: room.room, path: record.path || room.path }))).filter(matchesQuery);
    }

    function ctxCard(record) {
      const tags = (record.tags || []).slice(0, 4).map((tag) => `<span class="ctx-tag">${tag}</span>`).join("");
      const relation = (record.relations || [])[0];
      const summary = record.summary || "";
      const detail = record.detail && record.detail !== summary ? record.detail : "";
      const path = record.path || "";
      return `
        <article class="ctx-card kind-${record.type}" data-record="${record.id}" aria-pressed="${state.record === record.id}" tabindex="0" role="button" data-explain="Open ${record.title}">
          <div class="ctx-card-top">
            <span class="type">${record.type}</span>
            <span class="state">${record.state || "active"}</span>
            <span class="id" title="${record.id}">${record.id}</span>
          </div>
          <strong>${record.title}</strong>
          ${summary ? `<span class="summary">${summary}</span>` : ""}
          ${detail ? `<span class="detail">${detail}</span>` : ""}
          <div class="ctx-fields">
            ${path ? `<div class="ctx-field is-path">${foldPathControl(path)}</div>` : ""}
            ${relation ? `<div class="ctx-field"><span class="key">${relation.type}</span><span class="val mono">${relation.target}</span></div>` : ""}
            ${tags ? `<div class="ctx-field"><span class="key">tags</span><span class="val"><span class="ctx-tags">${tags}</span></span></div>` : ""}
          </div>
        </article>`;
    }

    function renderContext() {
      const query = state.query;
      const sub = `<nav class="subnav" aria-label="Context views"><button type="button" data-context="rooms" aria-pressed="${state.context === "rooms"}">Rooms</button><button type="button" data-context="authority" aria-pressed="${state.context === "authority"}">Project authority</button><span class="spacer"></span><button class="text-button" type="button" id="expand-rooms">Expand all</button><button class="text-button" type="button" id="collapse-rooms">Collapse all</button></nav>`;
      if (state.context === "authority") {
        const list = authorities.filter(matchesQuery);
        if (!list.length) return `${sub}<div class="context-shell"><p class="empty">None</p></div>`;
        return `${sub}<div class="context-shell">
          <div class="context-intro">
            <h2>Project authority</h2>
            <p>Checked-in documents that own durable rules for this checkout.</p>
          </div>
          <div class="authority-grid">${list.map((record) => `<article class="authority" data-record="${record.id}" aria-pressed="${state.record === record.id}" tabindex="0" role="button"><span class="cat">${record.category}</span><strong>${record.title}</strong><span>${record.summary}</span>${record.files ? foldPathControl(record.files, { label: "files", actions: false }) : ""}</article>`).join("")}</div>
        </div>`;
      }
      const blocks = rooms.map((room) => {
        const records = room.records.filter((record) => matchesQuery({ ...record, room: room.room }));
        if (query && !records.length && !room.room.toLowerCase().includes(query.toLowerCase())) return "";
        const nest = room.depth > 0 ? " is-child" : "";
        return `
          <details class="room-doc${nest}" open style="--depth:${room.depth}">
            <summary class="room-doc-head">
              <span class="mark" aria-hidden="true"><svg class="icon"><use href="#icon-folder"/></svg></span>
              <span class="room-doc-copy">
                <b>${room.room}</b>
                ${room.path ? foldPathControl(room.path) : ""}
              </span>
              <em>${records.length}</em>
            </summary>
            <div class="room-doc-body">${records.length ? records.map(ctxCard).join("") : `<p class="lane-empty">None</p>`}</div>
          </details>`;
      }).join("");
      return `${sub}<div class="context-shell">
        <div class="context-intro">
          <h2>Rooms</h2>
          <p>Context records stay readable on wider cards. Paths stay folded until you need them; the path, GitHub, and editor controls sit together on each room and card. A room’s path control also opens or closes every card path under it.</p>
        </div>
        ${blocks || `<p class="empty">None</p>`}
      </div>`;
    }

    function related(id, direction) {
      const ticket = byId[id];
      if (!ticket) return [];
      if (direction === "in") return (ticket.requires || []).map((req) => byId[req]).filter(Boolean);
      return tickets.filter((other) => (other.requires || []).includes(id));
    }

    function nextAction(ticket) {
      if (ticket.next) return ticket.next;
      return {
        attention: "A person has to decide.",
        running: "An agent is working.",
        ready: "An agent can start.",
        planned: "Acceptance still needs to be named.",
        waiting: "A prerequisite is still open.",
        done: "Recorded complete."
      }[ticket.state];
    }

    function briefFor(ticket) {
      const acceptance = (ticket.acceptance || [ticket.outcome]).map((line) => `Done when: ${line}`).join("\n");
      const incoming = related(ticket.id, "in").map((item) => item.title).join(", ") || "None";
      const outgoing = related(ticket.id, "out").map((item) => item.title).join(", ") || "None";
      return [ticket.title, ticket.outcome, acceptance, `Next: ${nextAction(ticket)}`, `Depends on: ${incoming}`, `Unblocks: ${outgoing}`, `Source: ${ticket.path}`].join("\n\n");
    }

    function stepsFor(goal) {
      const lines = [`Continue this goal: ${goal.title}`, goal.outcome || ""];
      for (const lane of LANES) {
        const group = members(goal.id).filter((ticket) => ticket.state === lane);
        if (!group.length) continue;
        lines.push(`${STATES[lane].explain}:\n${group.map((ticket) => `- ${ticket.title}`).join("\n")}`);
      }
      return lines.filter(Boolean).join("\n\n");
    }

    async function copyText(text, button) {
      const label = button?.querySelector("[data-copy-label]");
      const previous = label ? label.textContent : button?.textContent;
      try {
        await navigator.clipboard.writeText(text);
        if (label) label.textContent = "Copied";
        else if (button) button.textContent = "Copied";
        setTimeout(() => {
          if (label) label.textContent = previous;
          else if (button) button.textContent = previous;
        }, 1200);
      } catch {
        window.prompt("Copy", text);
      }
    }

    function renderInspector() {
      const inspector = document.getElementById("inspector");
      const close = `<button class="icon-button" type="button" id="close" aria-label="Close" data-explain="Close"><svg class="icon"><use href="#icon-close"/></svg></button>`;
      if (state.surface === "context" && state.record) {
        const record = contextHits().find((item) => item.id === state.record) || authorities.find((item) => item.id === state.record) || rooms.flatMap((room) => room.records).find((item) => item.id === state.record);
        if (!record) { showInspector(false); return; }
        const kind = record.category || record.type || "context";
        const fields = record.category ? [
          ["category", record.category],
          ["summary", record.summary],
          ["files", record.files],
          ["approval", record.approval]
        ] : [
          ["context_id", record.id],
          ["type", record.type],
          ["state", record.state || "active"],
          ["summary", record.summary || record.title],
          ["detail", record.detail],
          ["room", record.room],
          ["path", record.path],
          ["source", record.source?.ref],
          ["tags", (record.tags || []).join(", ")],
          ...((record.relations || []).map((rel, index) => [`${rel.type}${index ? `_${index}` : ""}`, rel.target]))
        ].filter(([, value]) => value);
        showInspector(true);
        inspector.innerHTML = `
          <div class="inspector-head">
            <span class="inspector-state kind-${record.type || "authority"}"><span class="type" style="color:var(--kind,var(--quiet));font:600 12px/1 var(--mono);letter-spacing:0.04em;text-transform:uppercase">${kind}</span></span>
            ${close}
          </div>
          <h2>${record.title}</h2>
          <p class="outcome">${record.summary || record.detail || ""}</p>
          <div class="yaml-panel">
            ${fields.map(([key, value]) => `<div class="yaml-row"><span class="key">${key}</span><span class="val${/id|path|source|files|target|_/.test(key) || key.endsWith("_id") ? " mono" : ""}">${value}</span></div>`).join("")}
          </div>
          ${record.path ? `<div class="source-row"><svg class="icon"><use href="#icon-folder"/></svg><span title="${record.path}">${record.path}</span><span class="ctx-card-actions">${pathActions(record.path)}</span></div>` : ""}`;
        return;
      }
      const ticket = byId[state.selected];
      if (!ticket || state.surface !== "tickets") {
        showInspector(false);
        return;
      }
      const meta = STATES[ticket.state];
      const incoming = related(ticket.id, "in");
      const outgoing = related(ticket.id, "out");
      const owners = [];
      const owner = goals.find((goal) => goal.id === ticket.goal);
      if (owner) {
        owners.push(owner);
        const parent = goals.find((goal) => goal.id === owner.partOf);
        if (parent) owners.push(parent);
      }
      const acceptance = ticket.acceptance || [ticket.outcome];
      const markHtml = (item) => {
        const itemMeta = STATES[item.state] || STATES.planned;
        return `<span class="mark" data-explain="${itemMeta.explain}">${icon(itemMeta.icon)}</span>`;
      };
      const relCard = (item) => `
        <button class="rel-card state-${item.state}" type="button" data-id="${item.id}" data-explain="Open ${item.title}">
          ${markHtml(item)}
          <span><b>${item.title}</b><small>${item.id}</small></span>
          <svg class="icon go"><use href="#icon-arrow"/></svg>
        </button>`;
      const flowPill = (item) => `
        <button class="flow-pill state-${item.state}" type="button" data-id="${item.id}" data-explain="Open ${item.title}">
          ${markHtml(item)}
          <b>${item.title}</b>
        </button>`;
      const preview = (items) => {
        const shown = items.slice(0, 3);
        const rest = items.length - shown.length;
        return `${shown.map(flowPill).join("")}${rest > 0 ? `<span class="flow-more">+${rest} more</span>` : items.length ? "" : `<span class="flow-more">None</span>`}`;
      };
      const section = (label, items) => {
        const many = items.length > 3;
        const mode = many ? "is-rail" : items.length > 2 ? "is-stack" : "";
        return `
          <section class="section">
            <div class="section-head"><span>${label}</span><em>${items.length}</em></div>
            <div class="section-body ${mode}">${items.length ? items.map(relCard).join("") : `<p class="lane-empty">None</p>`}</div>
          </section>`;
      };
      const goalChips = owners.map((goal) => {
        const parent = goals.find((item) => item.id === goal.partOf);
        return `
          <button class="goal-chip" type="button" data-goal="${goal.id}" data-explain="Open goal ${goal.title}">
            <svg class="icon"><use href="#icon-overview"/></svg>
            <span><b>${goal.title}</b><small>${goal.id}</small></span>
            <span class="part">${parent ? `in ${parent.title}` : `${members(goal.id).length} tickets`}</span>
            <svg class="icon go" aria-hidden="true"><use href="#icon-arrow"/></svg>
          </button>`;
      }).join("");
      const briefLabel = ticket.state === "attention" ? "Copy decision brief" : "Copy work brief";
      showInspector(true);
      inspector.innerHTML = `
        <div class="inspector-head">
          <span class="inspector-state state-${ticket.state}">
            <span class="mark" data-explain="${meta.explain}">${icon(meta.icon)}</span>
            ${meta.label}
          </span>
          ${close}
        </div>
        <h2>${ticket.title}</h2>
        <p class="outcome">${ticket.outcome}</p>
        <section class="section">
          <div class="section-head"><span>Causal neighbors</span><em>${incoming.length} in · ${outgoing.length} out</em></div>
          <div class="flow-map" aria-label="In and out">
            <div class="flow-col"><span class="label">In<em>${incoming.length}</em></span>${preview(incoming)}</div>
            <span class="flow-arrow" aria-hidden="true"><svg class="icon"><use href="#icon-arrow"/></svg></span>
            <div class="flow-col"><span class="label">Here</span><div class="flow-here">${ticket.title}</div></div>
            <span class="flow-arrow" aria-hidden="true"><svg class="icon"><use href="#icon-arrow"/></svg></span>
            <div class="flow-col"><span class="label">Out<em>${outgoing.length}</em></span>${preview(outgoing)}</div>
          </div>
        </section>
        ${section("Depends on", incoming)}
        ${section("Unblocks", outgoing)}
        <section class="section">
          <div class="section-head"><span>Goal</span><em>${owners.length}</em></div>
          <div class="section-body">${goalChips || `<p class="lane-empty">Unassigned</p>`}</div>
        </section>
        <section class="section">
          <div class="section-head"><span>Done when</span></div>
          <ul>${acceptance.map((line) => `<li>${line}</li>`).join("")}</ul>
        </section>
        <section class="section">
          <div class="section-head"><span>Next</span></div>
          <p class="next-line"><svg class="icon"><use href="#icon-${meta.icon}"/></svg>${nextAction(ticket)}</p>
        </section>
        <div class="source-row">
          <svg class="icon"><use href="#icon-folder"/></svg>
          <span title="${ticket.path}">${ticket.path}</span>
          <span class="ctx-card-actions">${pathActions(ticket.path)}</span>
        </div>
        <div class="actions"><button class="text-button" id="copy-brief" type="button">${icon("ticket")}<span data-copy-label>${briefLabel}</span></button></div>`;
    }

    function bindGraph() {
      const viewport = document.getElementById("graph-viewport");
      if (!viewport) return;
      let drag = null;
      viewport.addEventListener("pointerdown", (event) => {
        if (event.target.closest("button") || event.button !== 0) return;
        drag = { x: event.clientX, y: event.clientY, left: viewport.scrollLeft, top: viewport.scrollTop };
        viewport.classList.add("is-drag");
      });
      viewport.addEventListener("pointermove", (event) => {
        if (!drag) return;
        viewport.scrollLeft = drag.left + drag.x - event.clientX;
        viewport.scrollTop = drag.top + drag.y - event.clientY;
      });
      const end = () => { drag = null; viewport.classList.remove("is-drag"); };
      viewport.addEventListener("pointerup", end);
      viewport.addEventListener("pointercancel", end);
    }

    function render() {
      hideExplain();
      if (!state.ready) {
        showInspector(false);
        document.getElementById("canvas").classList.remove("has-graph");
        document.getElementById("canvas").innerHTML = state.loadError
          ? `<p class="empty">Could not load repo-data.json (${state.loadError}). Run <code>node docs/proposals/quiet-dashboard/build-repo-data.mjs</code>.</p>`
          : `<p class="empty">Loading this checkout…</p>`;
        return;
      }
      renderRail();
      renderBar();
      renderProgress();
      const canvas = document.getElementById("canvas");
      const graph = state.arrangement === "graph" && state.surface !== "context";
      canvas.classList.toggle("has-graph", graph);
      canvas.innerHTML = state.surface === "goals" ? renderGoals() : state.surface === "context" ? renderContext() : state.arrangement === "board" ? renderBoard() : renderGraph();
      bindGraph();
      renderInspector();
    }

    let explainAnchor = null;
    let explainTimer = 0;

    function hideExplain() {
      clearTimeout(explainTimer);
      explainAnchor = null;
      const tip = document.getElementById("explain");
      tip.hidden = true;
      tip.textContent = "";
    }

    function placeExplain(anchor) {
      const tip = document.getElementById("explain");
      tip.textContent = anchor.dataset.explain;
      tip.hidden = false;
      const rect = anchor.getBoundingClientRect();
      const tipRect = tip.getBoundingClientRect();
      const left = Math.min(Math.max(8, rect.left + rect.width / 2 - tipRect.width / 2), window.innerWidth - tipRect.width - 8);
      const below = rect.bottom + 8;
      const top = below + tipRect.height <= window.innerHeight - 8 ? below : Math.max(8, rect.top - tipRect.height - 8);
      tip.style.left = `${left}px`;
      tip.style.top = `${top}px`;
    }

    function explainFrom(node) {
      return node instanceof Element ? node.closest("[data-explain]") : null;
    }

    document.body.addEventListener("pointerover", (event) => {
      const anchor = explainFrom(event.target);
      if (!anchor?.dataset.explain || anchor === explainAnchor) return;
      explainAnchor = anchor;
      clearTimeout(explainTimer);
      explainTimer = setTimeout(() => {
        if (explainAnchor === anchor) placeExplain(anchor);
      }, 280);
    });

    document.body.addEventListener("pointerout", (event) => {
      const anchor = explainFrom(event.target);
      if (!anchor || explainFrom(event.relatedTarget) === anchor) return;
      if (explainAnchor === anchor) hideExplain();
    });

    document.body.addEventListener("focusin", (event) => {
      const anchor = explainFrom(event.target);
      if (!anchor?.dataset.explain) return;
      explainAnchor = anchor;
      placeExplain(anchor);
    });

    document.body.addEventListener("focusout", (event) => {
      if (explainFrom(event.target)) hideExplain();
    });

    document.getElementById("canvas").addEventListener("scroll", hideExplain, true);
    window.addEventListener("scroll", hideExplain, true);

    document.getElementById("search").addEventListener("input", (event) => {
      state.query = event.target.value;
      render();
    });

    document.body.addEventListener("click", (event) => {
      if (state.status && !event.target.closest(".status-wrap")) {
        state.status = false;
        document.getElementById("status-panel").hidden = true;
        document.getElementById("status-button").setAttribute("aria-expanded", "false");
      }
      const theme = event.target.closest("#theme button");
      if (theme) { state.theme = theme.dataset.theme; applyTheme(); return; }
      if (event.target.closest("#project-switch")) {
        if (PROJECTS.length > 1) {
          state.projectMenu = !state.projectMenu;
          render();
        }
        return;
      }
      if (event.target.closest("#path-toggle")) {
        state.pathOpen = !state.pathOpen;
        render();
        return;
      }
      if (event.target.closest(".fold-path-actions a, .fold-path-actions button, .ctx-card-actions a, .ctx-card-actions button")) {
        event.stopPropagation();
        return;
      }
      const foldPath = event.target.closest("[data-fold-path]");
      if (foldPath) {
        event.preventDefault();
        event.stopPropagation();
        const next = foldPath.getAttribute("aria-expanded") !== "true";
        setFoldPathExpanded(foldPath, next);
        const roomHead = foldPath.closest(".room-doc-head");
        const roomDoc = roomHead?.closest(".room-doc");
        if (roomDoc) {
          for (const child of roomDoc.querySelectorAll(".room-doc-body [data-fold-path]")) {
            setFoldPathExpanded(child, next);
          }
        }
        return;
      }
      const project = event.target.closest("[data-project]");
      if (project) {
        const next = PROJECTS.find((item) => item.projectId === project.dataset.project);
        if (next) {
          applyProject(next);
          repoMeta = { ...repoMeta, counts: next.counts };
          render();
        }
        return;
      }
      if (state.projectMenu && !event.target.closest("#project")) {
        state.projectMenu = false;
        render();
      }
      const surface = event.target.closest(".surfaces button");
      if (surface) {
        const previous = state.surface;
        state.surface = surface.dataset.surface;
        state.selected = null;
        state.record = null;
        if (state.surface === "goals") state.scope = "all";
        else if (state.surface === "tickets" && previous === "goals") state.scope = "unassigned";
        render();
        return;
      }
      const arrange = event.target.closest("#arrangement button");
      if (arrange) { state.arrangement = arrange.dataset.arrange; render(); return; }
      const dir = event.target.closest("#direction button");
      if (dir) { state.dir = dir.dataset.dir; render(); return; }
      const filter = event.target.closest("#filters button, #progress [data-filter]");
      if (filter) {
        toggleFilter(filter.dataset.filter);
        render();
        return;
      }
      const zoom = event.target.closest("[data-zoom]");
      if (zoom) {
        if (zoom.dataset.zoom === "in") state.scale = Math.min(1.75, state.scale * 1.2);
        if (zoom.dataset.zoom === "out") state.scale = Math.max(0.4, state.scale / 1.2);
        if (zoom.dataset.zoom === "one") state.scale = 1;
        if (zoom.dataset.zoom === "fit") {
          const viewport = document.getElementById("graph-viewport");
          state.scale = Math.max(0.4, Math.min(1, (viewport.clientWidth - 48) / state.graphW, (viewport.clientHeight - 48) / state.graphH));
        }
        render();
        return;
      }
      if (event.target.closest("#expand-rooms") || event.target.closest("#collapse-rooms")) {
        const open = Boolean(event.target.closest("#expand-rooms"));
        document.querySelectorAll("#canvas details").forEach((node) => { node.open = open; });
        return;
      }
      if (event.target.closest("#status-button")) { state.status = !state.status; render(); return; }
      if (event.target.closest("#expand")) {
        state.focus = !state.focus;
        render();
        applyRailWidth(state.railW);
        return;
      }
      if (event.target.closest("#new-goal")) {
        const checkout = currentCheckout();
        copyText(`Plan a VibeHub goal in ${checkout.path}.\nBreak the outcome into tickets with acceptance and direct dependencies.\nSurface human decisions early.\nKeep planning records local.`, event.target.closest("#new-goal"));
        return;
      }
      if (event.target.closest("#copy-steps")) {
        const goal = activeGoal();
        if (goal) copyText(stepsFor(goal), event.target.closest("#copy-steps"));
        return;
      }
      if (event.target.closest("#copy-brief")) {
        const ticket = byId[state.selected];
        if (ticket) copyText(briefFor(ticket), event.target.closest("#copy-brief"));
        return;
      }
      const branch = event.target.closest("[data-branch]");
      if (branch) { state.branch = branch.dataset.branch; state.selected = null; state.record = null; render(); return; }
      const context = event.target.closest("[data-context]");
      if (context) { state.context = context.dataset.context; state.record = null; render(); return; }
      const record = event.target.closest("[data-record]");
      if (record) {
        if (event.target.closest("a, [data-fold-path], .fold-path")) return;
        state.record = record.dataset.record;
        state.selected = null;
        state.surface = "context";
        render();
        return;
      }
      const goal = event.target.closest("[data-goal]");
      if (goal) {
        state.scope = goal.dataset.goal;
        state.surface = "tickets";
        state.selected = null;
        state.filters = [];
        state.arrangement = "board";
        render();
        return;
      }
      if (event.target.closest("#scope-all")) {
        state.scope = "all";
        state.surface = "tickets";
        state.selected = null;
        render();
        return;
      }
      if (event.target.closest("#scope-open")) {
        state.scope = "unassigned";
        state.surface = "tickets";
        state.selected = null;
        render();
        return;
      }
      if (event.target.closest("#back")) {
        state.surface = "goals";
        state.scope = "all";
        state.selected = null;
        render();
        return;
      }
      const node = event.target.closest("[data-id]");
      if (node) { state.selected = node.dataset.id; state.record = null; state.surface = "tickets"; render(); return; }
      if (event.target.closest("#close") || (event.target.closest("#canvas") && !event.target.closest(".node, .goal, .row, .ctx-card, .authority, .zoom, .subnav"))) {
        if (!state.selected && !state.record) return;
        state.selected = null;
        state.record = null;
        render();
      }
    });

    document.body.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const card = event.target.closest(".ctx-card[data-record], .authority[data-record]");
      if (!card || event.target.closest("a, button, input, textarea")) return;
      event.preventDefault();
      card.click();
    });

    bindInspectorResize();
    bindRailResize();
    render();
    loadRepoData();
  </script>
</body>
</html>
