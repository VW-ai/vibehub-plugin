spec_id: "convention-ticket-runtime-artifacts-001"
type: convention
state: draft
intent:
  summary: "要确保我们的所有关键的思考，不同级别的我们都沉淀了"
  detail: |
    Proposed working convention:

    - Raw sessions and full tool traces remain cold provenance.
    - High-fidelity, non-normative synthesis lives under this room's
      `artifacts/` directory.
    - Independently reviewable intent, decision, constraint, contract,
      convention, context, and change claims live as draft specs until
      explicitly promoted.
    - `progress.yaml` records implementation milestones and evidence only after
      the decision map is clear; it must not be used as a design-ticket ledger.

    This preserves the loop from exploration to action without allowing an
    assistant-generated synthesis to masquerade as user-ratified authority.
