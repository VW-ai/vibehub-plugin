spec_id: "decision-ticket-closeout-001"
type: decision
state: superseded
intent:
  summary: "Run 的 Artifact、Evidence 与 Outcome 如何关闭 Ticket，并提出但不越权执行 Semantic Closeout？"
  detail: |
    **Question**: Define the feedback boundary from operational work to durable
    semantic state.

    The answer must specify:
    - what evidence satisfies each acceptance condition;
    - verifier versus human-judgment authority;
    - how Outcome records partial, failed, or successful results;
    - when follow-up Tickets are derived;
    - how a closeout proposes create/amend/stale/supersede effects;
    - why DONE does not itself authorize canonical semantic mutation;
    - which detailed traces cool into retrievable history rather than normal
      context.

    This historical question is resolved by
    `contract-ticket-closeout-001`.
