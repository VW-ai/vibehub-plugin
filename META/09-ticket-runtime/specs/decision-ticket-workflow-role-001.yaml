intent:
  summary: "Workflow 在 Planning、Ticket contract 与 Run 之间究竟是什么：模板、版本化方法，还是图的一部分？"
  detail: |
    **Question**: Freeze Workflow's single product meaning so it does not remain
    overloaded across skills, receipts, execution traces, and planning.

    The explored distinction was:
    - Workflow is a reusable method for a class of work;
    - Plan/Ticket Graph is the project-specific compiled instance;
    - Ticket is one schedulable contract;
    - Run is one actual attempt using a Workflow version.

    The answer must define what is durable, what is referenced by version, and
    what becomes a Run-specific prompt or method invocation.

    This ticket is unresolved; the explored distinction is not yet ratified.
