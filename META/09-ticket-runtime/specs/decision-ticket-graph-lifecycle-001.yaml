spec_id: "decision-ticket-graph-lifecycle-001"
type: decision
state: draft
intent:
  summary: "Plan、Ticket Graph、Ticket 与 Run 分别拥有什么生命周期，谁可以怎样修改工作图？"
  detail: |
    **Question**: Define the legal operational transitions and graph-mutation
    authority.

    The answer must distinguish:
    - Plan revision from the current executable graph;
    - parent/child decomposition from execution dependency;
    - Ticket state from Run state;
    - automatic mutations from proposed graph diffs;
    - verifier failure, human gate, retry, split, merge, supersede, cancel, and
      emergent follow-up work;
    - initial planning graph from the graph that actually executed.

    **New planning input from Wayne**: Planning may require human intervention
    without forcing the system to fabricate a fully explicit downstream graph.
    Technical research, technical decisions and frontend/design choices may
    themselves be blocker Tickets. Work beyond such a blocker may remain a
    directional planning frontier rather than a valid Ticket, then be compiled
    or refined after the blocker resolves.

    The answer must therefore decide whether the graph admits a non-executable
    placeholder/fog object distinct from Ticket, how human review approves a
    partial graph, and what event causes downstream planning to resume.

    This ticket is unresolved.
