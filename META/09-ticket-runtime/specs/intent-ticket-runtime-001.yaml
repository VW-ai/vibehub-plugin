  confidence: 0.95
  source_ref: "Wayne Ticket Runtime discussions in Codex sessions 019fa1de-8499-7e23-9576-c29db4d0168b and 019fa272-202e-73a1-8b80-9abfbfee0790"
  produced_at: "2026-07-27"
relations:
