    type: challenges
    detail: "Explores whether context-to-action should become an explicit Ticket compiler and runtime rather than remain Task-oriented and host-surface-first."
  - target: "intent-project-001"
    type: challenges
    detail: "The eventual App/Runtime/Plugin boundary may refine the current plugin-first product intent."
