spec_id: "intent-ticket-runtime-001"
type: intent
state: active
intent:
  summary: "把关于 Ticket 的想法一步一步沉淀到 META，再用它制定并驱动 Plugin 的 Ticket System 改造"
  detail: |
    Provisional destination: make the path from durable user intent and current
    semantic state to a machine-validated, executable Ticket Graph clear enough
    that the existing Plugin can dogfood the first trustworthy loop.

    The way is clear when the project has canonical definitions and authority
    boundaries for Plan, Ticket, Run, Gate, Outcome/Evidence, context binding,
    graph mutation, semantic closeout, storage, and the first implementation
    slice. The resulting contracts must be implementable without silently
    deciding unresolved ontology in code.

    This destination is intentionally narrower than shipping the future App,
    Server, unattended scheduler, external tracker integration, or rebrand.
constraints:
  - kind: must
    rule: "Preserve high-value intermediate reasoning without treating exploration artifacts as canonical truth"
  - kind: must
    rule: "Use one canonical decision map to drive the first Plugin dogfood loop"
  - kind: must
    rule: "Machine-validated Specs enter canonical knowledge as active; human intervention is reserved for explicit authority gates"
  - kind: must
    rule: "Any change to current Task/Run, plugin-first, App, or storage authority must explicitly relate to or supersede the existing active spec"
  - kind: must_not
    rule: "Do not implement a second Ticket state machine in Plugin and App"
indexing:
  type: intent
  priority: P0
  layer: epic
  domain: "ticket-runtime"
  tags: [ticket, planning, work-graph, loop-engineering, wayfinder]
provenance:
