spec_id: "decision-ticket-skill-driven-boundary-001"
type: decision
state: active
intent:
  summary: "Skill 可以包含脚本，但本质上还是 Skill 驱动。"
  detail: |
    **Decision**: Ticket is a Skill-operated Git collaboration protocol, not a
    generic Runtime workflow engine.

    Skills own scene recognition, orchestration, and semantic judgment:
    planning from scenarios/outcomes, Ticket boundary selection, backchaining,
    forward normalization, context choice, validation, execution guidance,
    protected-boundary routing, deviation detection, and closeout.

    A Skill may package and call scripts. Those scripts are its deterministic
    hands: they read and query documents, validate schemas and typed DAG
    relations, calculate digests, check stale bases, produce diffs, perform
    bounded atomic writes, and project the graph for Agents or HTML. Scripts
    report facts and enforce integrity; they do not decide the product meaning
    of the next step or encode one mandatory proposal-to-receipt workflow.

    Core libraries may implement those reusable mechanics once. CLI, MCP, the
    local host, and HTML remain thin access or projection adapters. None owns a
    second Ticket lifecycle, semantic database, or hidden authority model.

    The system may expose stable operations for portability across Agents and
    hosts, but those operations are capabilities composed by Skills rather
    than the owner of Ticket intelligence.
constraints:
  - kind: must
    rule: "Skills own Ticket scene selection, semantic judgment, and orchestration"
  - kind: must
    rule: "Bundled scripts and shared libraries own deterministic document reads, validation, digesting, diffing, atomic writes, and projection"
  - kind: must
    rule: "CLI, MCP, HTML, and any local host remain thin peers over the same deterministic capabilities"
  - kind: must_not
    rule: "Do not encode Ticket product judgment or one mandatory end-to-end workflow in Core, SQLite, or a daemon"
  - kind: must_not
    rule: "Do not create adapter-specific storage semantics or lifecycle rules"
