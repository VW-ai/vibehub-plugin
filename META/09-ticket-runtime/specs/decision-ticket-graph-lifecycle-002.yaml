spec_id: "decision-ticket-graph-lifecycle-002"
type: decision
state: active
intent:
  summary: "Ticket 的语义生命周期跟 Git 走；Proposal、Validation、Decision、Receipt 是按需要产生的文档，不是固定五阶段 workflow。"
  detail: |
    **Decision**: The selected Git worktree/tree is the Ticket semantic
    lifecycle boundary.

    Ticket definitions and typed relations describe the current graph.
    Proposal, Validation, Decision, ApplicationReceipt, Outcome, and Evidence
    documents preserve the meaningful causal record when that record exists.
    They are not mandatory stages for every mutation. A Skill decides which
    facts are needed from the change class and authority boundary:

    - delegated clarification or decomposition may be validated and applied
      directly with a compact semantic receipt;
    - an initial plan, experience/product change, architecture or principle
      deviation, permission/side-effect escalation, or policy/risk boundary
      creates an explicit proposal and blocking human Decision;
    - inconclusive validation or honest Planning Fog remains visible rather
      than fabricating downstream Tickets.

    Deterministic scripts bind a mutation to the observed Git HEAD when
    committed, the current graph digest, and every targeted Ticket revision.
    They fail stale changes before writing. A successful apply updates the
    affected Ticket documents and its semantic receipt as one validated
    worktree change set. Normal Git commit, merge, and conflict semantics carry
    collaboration and history; there is no parallel `latest.yaml` generation,
    SQLite application intent, cross-store writer fence, or SQLite terminal
    receipt.

    Each worktree reads its checked-out Ticket world. Same-named branches or
    Tickets in sibling worktrees may proceed independently. SQLite Run state
    binds repository identity, worktree identity, exact HEAD/dirty graph
    digest, Ticket ID, and Ticket revision. Switching branch or changing the
    bound graph makes an active Run stale or suspended instead of transferring
    it silently.

    DONE and readiness are reconstructed from durable Ticket, Decision,
    Outcome, and Evidence facts plus any currently live Run observations.
    Losing SQLite may lose heartbeat or a claim, but never durable completion.
constraints:
  - kind: must
    rule: "Every semantic mutation is bound to the observed Git source, graph digest, and targeted Ticket revisions and fails closed when stale"
  - kind: must
    rule: "Proposal, Validation, Decision, and semantic Receipt documents are created according to semantic need and authority, not as a mandatory fixed workflow"
  - kind: must
    rule: "A successful graph change leaves a Git-readable causal record sufficient to reconstruct why the current Ticket world exists"
  - kind: must
    rule: "Local Run coordination binds exact worktree plus HEAD or dirty graph digest and Ticket revision; branch switches stale or suspend it"
  - kind: must_not
    rule: "Do not use internal generations, latest.yaml, SQLite intents, dual-store fences, or SQLite receipts as Ticket lifecycle authority"
  - kind: must_not
    rule: "Do not introduce a global cross-branch scheduler or silently reconcile semantic conflicts across Git histories"
