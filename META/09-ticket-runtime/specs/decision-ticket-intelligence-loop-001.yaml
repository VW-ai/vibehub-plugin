spec_id: "decision-ticket-intelligence-loop-001"
type: decision
state: active
intent:
  summary: "Agent 何时生成或修订 Ticket，并如何发现、选择和组合 Ticket intelligence Skills？"
  detail: |
    **Question**: Define the intelligent Ticket loop without turning it into a
    mandatory end-to-end workflow.

    The answer must decide:
    - which scenes invite Ticket generation or revision, including explicit
      planning, blocker resolution, execution discovery, validation findings,
      and Run closeout;
    - how the Agent distinguishes no durable work, elaboration, decomposition,
      expansion, and Planning Fog before proposing a graph mutation;
    - how the host Agent discovers and composes query/context, shape, validate,
      and closeout intelligence;
    - when invocation is explicitly requested, Agent-initiated, or merely
      suggested by a hook;
    - how authority gates prevent an intelligent loop from silently expanding
      product, technical, permission, or risk boundaries;
    - what minimum observable proposal or receipt lets the loop be inspected
      and improved without encoding every reasoning step.

    Exact operation schemas, graph transitions, context packet contents, and
    closeout semantics remain owned by their focused Decision Tickets.

    This ticket is unresolved.
