      completed_at: "2026-07-30T14:26:57-07:00"
      evidence: "The installed Ticket Review Skill and production loopback host now enroll a named local WebAuthn authority, require user presence and verification for plan-review and protected-boundary Decisions, append exact detached Git receipts, and let fresh CLI/MCP/Skill processes verify them against a dynamically reread repo-external trust registry. Complete repository/worktree/checkout/Decision/scope binding, tamper/replay/expiry/revocation failure, Decision-first recovery, protected UI exposure, release packaging, and adversarial tests are implemented in dbc60dc3fbc22995060a0ee1e6768602c928470c. The independently validated implementation settlement updated the M3.5 Ticket without changing topology, producing 11 Tickets and 11 direct relations at graph digest sha256:deb8bbe622fff55343016cae043e0792a0b7a6c6dcb330a28e9ffdc7ca2421a9 and was path-exact checkpointed in e8f2afd23d5651b3a90442f5d92e02ee2559720c; see the dated M3.5 implementation artifact."
    - id: "m3-6-install-local-decision-authority"
      name: "Install-local Ed25519 Decision authority pivot"
      status: completed
      completed_at: "2026-07-30T14:56:25-07:00"
      evidence: "Commit dd771df13185fc472ade73d6962b3e3e8be78403 replaces the M3.5 WebAuthn ceremony with one explicit Plugin-host click and a repository-scoped installation-local Ed25519 key outside Git and SQLite. Exact detached Decision/repository/worktree/named-branch/scope receipts support fresh-process verification and dynamic recognition of registry revocation, remove expiry, and make no biometric, named-human, or repository-owner identity claim. Detached checkouts remain readable but durable Decisions fail closed; a revoked running host stays bound and fail-closed while the next named-branch host rotates; a non-semantic process-releasing SQLite writer mutex serializes dead owner-record recovery, and complete owner records publish atomically. The threat model honestly excludes arbitrary same-UID, Plugin/runtime, and local OS-account compromise. The independently validated successor graph preserves the historical M3.5 outcome, adds a distinct M3.6 Ticket, and contains 12 Tickets and 12 direct relations at graph digest sha256:09d0081f034778d293e4563b0a45bb411c1e2e1baf714cb1d9c8abe20f247be2."
