    - id: "m4-ticket-authoring-lifecycle"
      name: "Ticket planning, writer CAS, and graph-mutation lifecycle"
      status: in_progress
      evidence: "Core-internal pure outline-generation compiler and whole-generation Git publication substrate: atomic staged bootstrap, immutable no-replace revisions/generations, worktree-specific Git-admin writer arbitration, lock-held scope/head recheck, monotonic revision and no-implicit-removal guards, fsync-before-visibility ordering, retained exact generations, and focused fault/concurrency/symlink tests. The untracked operational lock is installed by atomic rename of a staged nonempty directory. Release claims owner-T as releasing-T, unlinks only that marker, then removes the canonical directory only if still empty; a successor's nonempty owner-U makes a stale removal fail harmlessly, while crash-empty state can be removed or atomically replaced. Public proposal submit/inspect/list and proposal-validation record/list/inspect bind exact snapshots, targets, proposal/candidate digests, repository incarnation, and task worktree through one Core/CLI/MCP spine; validation remains append-only claimed_unverified semantic evidence with contrary receipts preserved. The registered ticket.proposal.review.inspect operation derives eligibility and next action from the complete bounded validation-set digest/high-water/count. ticket.proposal.authority.decide accepts no caller-authored authority: only a non-serializable trusted host provider may return a host-authenticated principal, human-authority or delegation basis, and exact accepted passing validations. Bootstrap, expansion, declared human gates, and protected signals require a human basis; ordinary CLI/MCP has no provider and fails closed with trusted_authority_unavailable. The immutable decision closes the validation ledger. ticket.proposal.apply persists an immutable exact-candidate intent, enters the Git writer through an intent fence, commits a terminal published/reconciled SQLite application receipt, then releases the fence. A simulated receipt failure after Git visibility retains the exact fence; retry adopts it, recognizes current==candidate, records a reconciled receipt, and releases the lock. Cleanup after an already-committed receipt verifies the canonical head equals the candidate before claiming that exact fence; malformed or foreign fences, stale third heads, and mismatched immutable bindings fail closed. Ticket-readiness validation, explicit removal/supersession, complete Ticket definitions, and the broader execution lifecycle remain open."
