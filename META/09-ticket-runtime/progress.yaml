    - id: "m6-ticket-review-host"
      name: "Interactive review host and trusted human decision bridge"
      status: completed
      completed_at: "2026-07-29"
      evidence: "A foreground loopback-only one-proposal review host now projects a current exact candidate and the complete validation-set binding/summaries into a quiet zoomable orthogonal Ticket workflow, accepts only authorize/reject intent plus exact CAS bindings from the browser, derives the human-authority provider result inside the host, verifies the exact Core receipt before automatic application, and revokes the short-lived capability after rejection, successful application, or 30 minutes. A stale proposal fails closed: the canvas shows the current canonical graph rather than constructing a mixed candidate from a later head. Static assets are packaged with the CLI; the host, graph, Inspector, keyboard/mobile disclosure, and local-trust explanation were exercised in a disposable proposal. The boundary is intentionally cooperative same-OS-account trust, not cryptographic user-presence proof."
