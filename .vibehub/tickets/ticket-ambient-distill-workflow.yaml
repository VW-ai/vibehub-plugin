  "active_contract_revision": 1,
  "constraints": [
    "No background capture, daemons, hooks cadence, or hidden state; distill runs only inside explicit skill workflows.",
    "Update distill cost must be proportional to the rooms the ticket enters, never to whole-project drift debt.",
    "Semantic judgment stays in skills/agents; every deterministic step goes through vh.mjs."
  ],
  "context": "Distill returns in two modes. Cold start: when vh drift reports COLD_START, a distill skill proposes the room tree and writes room.yaml per room; it runs once per project, may be perceptible, and must be resumable with per-room progress (a recursive lazy variant was explicitly rejected). Update: ticket-plan runs vh drift at every start; the agent semantically reconciles only rooms the current ticket enters (re-reading only the exact changed/added/deleted files vh drift lists), then vh align stamps them; unrelated drifted rooms get the stale write-back and are left alone — align-on-use. Governance: distilled documents carry distilled provenance and are the lower-trust layer; human-ingested decisions win conflicts; there is no runtime activation gate — PR review on Git is the gate.",
