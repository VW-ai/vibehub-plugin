  "context": "The owner wants large graphs to make Tickets requiring human judgment visibly distinct. This cannot be a UI-only color inferred from words such as approve, review, or human. Model authority at the acceptance-criterion boundary because a Ticket may be largely Agent-executable while reserving one product or permission choice for a human. Preserve the lightweight trust model: schema-valid Git documents and explicit conversation-backed Evidence, not a new attestation service. The graph should show that a human boundary exists and whether acceptance-linked Evidence has been recorded, while READY/BLOCKED/DONE/DEVIATED continue to mean execution/dependency truth.",
