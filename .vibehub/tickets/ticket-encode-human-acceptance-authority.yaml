  "active_contract_revision": 2,
  "constraints": [
    "Model authority per acceptance criterion rather than labeling an entire Ticket human when only one boundary may require human judgment.",
    "Authority names the criterion's decision owner, not the Agent or person performing the implementation.",
    "Do not infer authority from Ticket prose, constraints, tags, filenames, Evidence wording, generic risk, or Agent confidence.",
    "Do not change READY/BLOCKED/REFINE/DONE/DEVIATED semantics; graph dependencies and successful Outcomes remain the only unlock mechanism.",
    "The Ticket remains the complete Agent-runnable package; do not add Event, Brief, dispatcher, policy-engine, account, lease, signature, or hidden-state machinery.",
    "Existing schema-valid Tickets and Evidence without optional authority or origin remain valid and behave as Agent-origin documents."
  ],
  "context": "The branch already implements the minimal durable carrier: per-acceptance authority, human-origin Evidence, mechanical closeout enforcement, exact Agent handoff, and visible Workbench attention state. The remaining gap is narrower than a general attention-routing framework. A Ticket is already the complete package an Agent reads and runs. Planning must decide whether a human-owned judgment is merely terminal sign-off inside that package or a real scheduling boundary that should be visible as a separate Ticket dependency. Known boundaries are encoded during planning. If execution discovers one later, the checked-in graph is replanned before execution crosses it: the same or a later Agent may revise the current Ticket or split out a new decision Ticket. No session is assigned or resumed automatically. Downstream work whose real acceptance depends on that choice stays at maturity: draft and becomes REFINE after the decision, reusing the existing rolling-wave mechanism. The Rooms UI Ticket is the dogfood case: its proposal, owner choice, and implementation were incorrectly packed into one firm Ticket, so READY could not say whether the proposal had reached the owner and the implementation criteria falsely pretended the design was already known.",
