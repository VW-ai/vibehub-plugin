  "active_contract_revision": 1,
  "constraints": [
    "This Ticket produces a semantic and interaction proposal for explicit owner review; it does not change production projection, vocabulary, colors, or routing.",
    "Do not infer a primary phase from an untrusted Session, heartbeat, cache, browser state, Agent claim, or stale Run record.",
    "Do not flatten primary phase, dependency condition, human authority, deviation, closeout routing, archive history, and live presence into one enum merely to simplify rendering.",
    "Do not turn the upper-right slot into a carousel, arbitrary metadata bucket, multiple competing badges, hover-only fact, or color-only signal.",
    "Preserve the approved compact upper-right position and current graph-first interaction while allowing the proposal to change its exact semantics.",
    "Do not require a project-format migration or rewrite historical source before the protected decision and a firm implementation Ticket exist."
  ],
  "context": "The owner first identified REFINE as internal jargon, rejected PLAN and Plan with Agent as longer but no clearer replacements, and set a cognitive and visual ceiling: the normal UI should expose no more than four primary Task states and must not assign another card color to every internal fact. The emerging semantic axis is Context stability and forward motion. DRAFT means the Context or path can and must still change; READY means it is stable and the next actor can act; RUNNING means the work loop is advancing, including independent closeout; DONE means independently accepted. Consequently BLOCKED and material DEVIATED belong to DRAFT and cannot coexist with READY or RUNNING. NEEDS YOU is different: it is cross-phase attention. On DRAFT it asks a person to stabilize Context, on READY it says the next actor is Human, and on RUNNING it marks a Human boundary encountered mid-flow. Independent closeout normally stays inside RUNNING rather than becoming a major REVIEW state. These are strong owner directions, while exact derivation, eligibility edge cases, priority, labels, and visual treatment still require proposal-level validation before implementation.",
