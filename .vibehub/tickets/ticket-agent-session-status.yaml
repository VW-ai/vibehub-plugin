  "constraints": [
    "Preserve prior uncommitted Goal/Epic implementation and unrelated .claude/ files.",
    "Runtime snapshots are disposable observations, never semantic authority or proof.",
    "No daemon, global host scan, installed provider hooks, automatic agent scheduling, commit, push or deployment.",
    "Distinguish explicit agent reports from process observation; heartbeats establish connectivity, not meaningful activity."
  ],
  "context": "User authorized implementation of separate Ticket state and Agent session state. Implement a provider-neutral foreground session reporter and command wrapper, local worktree-scoped disposable session storage, explicit assignment, state reports, heartbeat freshness and visible Workbench session details. Ticket truth remains in Git; runtime data does not create Evidence, Outcomes or unlocks. Existing agents integrate by reporting, and commands launched through the wrapper are observed. Do not claim universal automatic detection of pre-existing Codex, Claude or other host sessions. This bounded local observability feature amends the prior no-runtime-state boundary, without implementing AgentProfile/WorkflowProfile routing or the separate ticket-define-agent-workflow-runtime scope.",
