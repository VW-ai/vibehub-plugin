    {
      "acceptance_id": "external-settlement-entry-is-explicit-and-bounded",
      "criterion": "An open Ticket can expose Settle external work only through an explicit Human or Agent action that names the exact Ticket and current acceptance; the action assembles its external refs, dependencies, Evidence, and source without scanning unrelated repositories or inventing a generic background monitor."
    },
    {
      "acceptance_id": "postconditions-are-verified-before-evidence",
      "criterion": "The settlement Agent verifies each claimed external fact through authoritative tools or immutable refs before recording acceptance-linked Evidence, distinguishes unavailable, pending, failed, and verified postconditions, and never treats a webhook, user assertion, status label, or stale cached response alone as proof when stronger verification is required."
    },
    {
      "acceptance_id": "settlement-hands-off-to-independent-closeout",
      "criterion": "After verification, the same path records current authority-correct Evidence and invokes the first-class independent closeout handoff; it cannot write a successful Outcome directly, and incomplete or contradictory proof leaves exact acceptance IDs unresolved with the correct next action."
    },
    {
      "acceptance_id": "release-and-deployment-workflows-close-the-loop",
      "criterion": "The repository's PR, tag, GitHub Release, public-site deployment, and equivalent external workflow guidance end at VibeHub settlement rather than the external side effect; fixtures reproduce the v0.8 omitted-closeout failure and prove the revised path records exact merge, tag, workflow, asset, checksum, deployment, or approval facts only after they exist."
    },
    {
      "acceptance_id": "restart-and-dsh-adapter-boundary-is-honest",
      "criterion": "The current Plugin can resume settlement from Git plus external refs after a new Agent Session, while a future DSH adapter may map supported wakeups to the same explicit action; neither path claims to restore private executor state, persist a watcher, or bind VibeHub to DSH Agent Team internals."
    },
    {
      "acceptance_id": "external-failure-and-permission-cases-are-safe",
      "criterion": "Regression covers missing credentials, denied permission, rate limits, deleted or changed external objects, failed workflows, wrong tags or commits, incomplete assets, stale approvals, and successful postconditions; no case fabricates Evidence, loops indefinitely, or mutates unrelated Tickets."
    }
  ],
  "constraints": [
    "Do not add a required daemon, scheduler, webhook service, database, or universal external event bus to the lightweight Plugin.",
    "Do not let notification, session completion, or user-facing success copy directly imply Evidence, Outcome, DONE, or archive.",
    "Do not couple settlement to GitHub only; GitHub release and deployment are the first concrete fixtures for a generic explicit Agent-verification path.",
    "Keep DSH host events optional and behind the existing opaque compatibility adapter."
  ],
  "context": "The v0.8 publication Ticket remained open after PR merge, authoritative delivery metadata, tag, workflow, Release, checksum, and archive verification had all occurred because the external workflow never returned to VibeHub settlement. This pattern will recur for deployments, approvals, hosted builds, external project systems, and human actions. Build one explicit, user- or Agent-triggered settlement path on top of the closeout handoff. The current lightweight Plugin does not need a daemon or universal event listener: it assembles the exact Ticket contract and external refs for an Agent to verify with available tools. DSH may later wake the same action from supported host events, but automatic completion is never inferred from notification alone.",
