      "revision": 3,
      "state": "active"
    },
    {
      "acceptance_id": "loop-agent-degradation",
      "criterion": "Each of Codex and Claude Code plugins captures selected synthetic events and queries expected Context after restart/handoff. Project disable halts new work and fences late results; Runtime/Judge/Worker unavailability leaves coding usable. Verify each of three configured API routes with a synthetic real request and record actual models/build/latency; unsupported or not-run remains unresolved. Prove bounded backlog, source revocation and recovery without cloud or production SLO claims.",
      "identity": "sha256:4564796b0f15a02d8368d228c5e905470a92794b7cb35c4119e93366209d1500",
      "revision": 3,
      "state": "active"
    }
