    {
      "acceptance_id": "loop-worker-conflict",
      "criterion": "Exercise heavy synthesis through the same local runner with each real Codex and Claude subscription executor on synthetic inputs, selecting one at a time. Results have cited proposals and durable receipts, with A→B→A notices, continued alternatives, explicit adoption and stale/duplicate handling. Seen is not adopted; independent acceptance stays separate. Interactive work-request delivery remains a supported additional route, not the default heavy-work prerequisite.",
