  "context": "Two copies of this repository currently land on every user's disk. Measured on one machine at 0.8.0: 30M at ~/.claude/plugins/marketplaces/vibehub, of which 14M is .git history, plus 17M at ~/.claude/plugins/cache/vibehub/vibehub/0.8.0, together 47M of the 54M total under ~/.claude/plugins. Both copies are the whole repository because the marketplace is registered as this git repository and the plugin entry declares \"source\": \"./\", resolving the plugin to the repository root. Research against the host documentation and the marketplace schema establishes that no install-time filtering exists — no .claudeignore, no files allowlist in plugin.json, no .gitattributes export-ignore — so a subset cannot be shipped from the repository root. scripts/build-claude-marketplace.mjs already emits the answer: a self-contained directory holding .claude-plugin/marketplace.json plus plugins/vibehub/ containing the built artifact, whose plugin entry declares \"source\": \"./plugins/vibehub\". Publishing that generated output fixes both copies at once and introduces no new source type, because the relative-path form is what the script already emits. Whether that form also has the widest host support is not established here and must not be relied on: in the official marketplace's 291 entries it is the minority form at 53, against 153 url and 85 git-subdir. The owner chose this route over an archive-at-a-release-tarball form, and chose a dedicated VW-ai/vibehub-marketplace repository over an orphan branch of this one, on 2026-09-01. Three obstacles are known before execution starts and must not be discovered during it. First, the route as chosen can recreate the problem it solves: a dedicated repository that the host clones accumulates history, and the 6.4M official marketplace is not a counter-example because it carries no .git at all — it is fetched as a content snapshot marked by .gcs-sha. Growth is therefore a real risk and it is concentrated: of the artifact's 3.19MB, roughly 2.65MB is four documentation screenshots (workbench-ticket-action-2x.png 936K, quiet-workbench-desktop-2x.png 848K, workbench-rooms-narrow-2x.png 392K, issue-blocked-by-2x.png 324K) plus a 156K jpg, and committing a changed copy of those on every release is exactly the mechanism behind today's 14M of .git. Second, the artifact has grown sharply since the last release: v0.8.0 built 54 files at 724,304 bytes uncompressed and 359,971 compressed; HEAD builds 67 files at 3,189,241 uncompressed and 2,716,594 compressed — 4.4x uncompressed, 7.5x compressed, essentially all of it those images. Third, the checked-in .claude-plugin/marketplace.json cannot simply be deleted: verify-release-version.mjs reads both marketplace.version and marketplace.plugins[0].version and fails unless five declarations agree, and README.md still instructs /plugin marketplace add VW-ai/vibehub-plugin. Its fate has to be decided here, or the documented install path keeps delivering the whole repository after this Ticket closes. The generated manifest is also currently named vibehub-local and carries no top-level version field.",
