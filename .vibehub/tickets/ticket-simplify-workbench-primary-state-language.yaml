      "criterion": "One shared Workbench model deterministically projects exactly four human-facing phases without changing raw host facts: DONE next_action becomes DONE; REPLAN, WAIT, and REFINE become DRAFT; EXECUTE and NEEDS_HUMAN become READY; CLOSE_OUT becomes RUNNING with an explicit verifying stage; trusted active execute runtime may promote EXECUTE to RUNNING, while stale, absent, planning-only, completed, or failed runtime cannot. Graph cards, minimap, overview, focused panel, narratives, and accessible names consume that projection rather than independently remapping canonical labels; copied Agent payloads deliberately do not carry browser-owned presentation metadata."
    },
    {
      "acceptance_id": "one-upper-right-substate-is-truthful",
      "criterion": "Every Ticket card renders at most one textual/icon upper-right substate in the existing badge position with deterministic priority DEVIATED over BLOCKED over NEEDS YOU over VERIFYING over WAITING over empty. REPLAN maps to DRAFT+DEVIATED, WAIT to DRAFT+BLOCKED, NEEDS_HUMAN to READY+NEEDS YOU, CLOSE_OUT to RUNNING+VERIFYING, and trusted runtime waiting_human or waiting_tool may supply NEEDS YOU or WAITING only when a higher-priority canonical condition is absent. READY and RUNNING never coexist with BLOCKED or DEVIATED, and live presence remains a separate fact rather than consuming the slot."
