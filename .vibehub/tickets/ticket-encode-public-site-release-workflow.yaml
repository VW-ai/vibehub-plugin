  "context": "The public site is now live at vibehub.icu through the existing Sites project recorded in site/.openai/hosting.json. The owner explicitly asked to preserve the successful release process as reusable repository knowledge. A project-local Skill is the right entry point because deployment requires Agent judgment and protected platform operations, while small dependency-free scripts can make configuration, build metadata, and post-deploy content checks mechanical. This project-specific publisher must not become a Plugin Skill shipped to VibeHub users.",
