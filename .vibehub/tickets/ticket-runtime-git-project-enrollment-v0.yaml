    {
      "acceptance_id": "selected-folder",
      "criterion": "Expose a bounded local Git inspection API for an explicitly selected existing directory. Resolve symlinks and nested paths to the actual worktree root and common Git directory; use Git worktree inventory to discover linked worktrees outside that root and enumerate branch refs separately from checkouts. Return explicit detached/unborn, locked/prunable/unavailable worktree and non-Git/unsupported bare-repository states. Inspect only selected/Git-registered paths, execute fixed Git argv without shell/remote calls or inherited GIT_DIR/worktree overrides, and bound subprocess time/output. Main/linked selections of the same currently observed common directory identify one checkout candidate; matching remote URLs, branch names, paths or OIDs never unify independent clones or prove historic incarnation continuity.",
      "identity": "sha256:46a1614e4ec905023958c3df8acc47f6b1d736a562883d138c7451d3dbd1ee10",
      "revision": 2,
      "state": "active"
    },
    {
      "acceptance_id": "git-init-onboarding",
      "criterion": "Provide separate inspect/enroll/refresh and explicit initialize APIs. Initialize only a selected non-Git directory after a fresh ancestry check, preserving existing files and refusing to overwrite an existing/nested Git repository; create no commit, remote, hook, push or activation. Use the accepted DomainStore with explicit store:read/store:write actions, one versioned git-enrollment/catalog record per authenticated tenant/Project, caller expected-version CAS and an immutable enrollment-change source row in the same transaction. Git inspection stays outside the synchronous transaction, followed by bounded freshness recheck and CAS; report stale/changed discovery rather than claim atomicity with external Git. Persist opaque repository, checkout, worktree and ref-incarnation IDs and retain superseded/tombstoned metadata. Add another repository to the same Project explicitly; do not dedupe clones by remote. Refresh records observations without silently repairing ambiguous identities, moving a Project or auto-adopting exploration context. Exact old IDs may be associated with a moved instance only through an explicit authenticated continuity declaration with prior/current references; label that as operator-declared, not independently proven Git continuity. Persisted mappings remain usable across unchanged rescans/restart at an explicitly observed assurance level; do not require routine re-enrollment. Distinguish operational mapping from certified historical incarnation continuity. Actually observed disappearance/reappearance, conflicting metadata or ambiguous rename yields a recorded gap and unresolved/new-incarnation mapping rather than silently repairing old identity. Git admin-directory plus local stat identity may support observed worktree continuity, but equal stat/path/name/OID or unchanged snapshots do not certify an unobserved branch delete/recreate. Explicitly expose that historical limitation without disabling ordinary unchanged operation. Preserve historical origins and offer new-incarnation enrollment without rewriting past events or scope bases.",
      "identity": "sha256:b5824ea465cb43d8ec54a562198328b1ea573d5d3321a4933cc2256063dece37",
      "revision": 2,
      "state": "active"
    },
    {
      "acceptance_id": "enrollment-conformance",
      "criterion": "Real temporary Git plus SQLite fixtures cover main/linked/nested-folder selections; external sibling worktrees; spaces and symlinks; refs without checkouts; unborn and detached HEAD; branch switching/rename; deletion/prune/recreation at the old name/path; independent clones with the same remote; restart and path-move declarations; multiple repositories in one Project. Prove unchanged rescans/restart reuse operational mappings without re-enrollment. A same-name, same-OID delete/recreate between observations must not be falsely certified as uninterrupted historical incarnation; retain the observed-assurance limitation. Observed disappearance/reappearance must produce explicit gap/new-incarnation handling. Prove stable historical references, explicit ambiguity and idempotent selection association; stale catalog CAS loses without partial source-row writes; foreign/revoked/expired/read-only contexts fail before prohibited discovery or persistence. Verify failed initialization/storage/changed Git leaves user files and prior records intact and returns bounded errors without echoing process output, credentials or arbitrary file contents. Document version/bounds, current identity/branch-scope integration and migration limits; run affected public-entry integration tests, identity/branch-scope tests and component boundary checks. No watcher, graph projection, Git merge, UI, plugin activation or remote synchronization is delivered.",
      "identity": "sha256:2ac67fbfb23f0eddc73c89ffca8c3a4880fa3857ff2b516872d2ce3493b00b99",
