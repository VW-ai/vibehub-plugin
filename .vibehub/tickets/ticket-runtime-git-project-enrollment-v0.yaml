    "Candidate/proposal results cannot certify acceptance, grant access or silently overwrite governing Context; retain independent review and user-reserved decisions.",
    "Branch/exploration scope, worktree execution provenance and Project overview remain distinct; awareness is not adoption.",
    "Honor App project activation and executor-independent Ticket contracts. No installation, real model use, or implementation is claimed by this planning record."
  ],
  "context": "Local L1 enrollment adapter only. A trusted local caller supplies an opaque authenticated context already scoped to a Project; the App owns Project creation/pairing later. Use built-in Git CLI and accepted local SQLite DomainStore, with no additional package, daemon, generic registry framework or Git metadata marker protocol. Candidate APIs may be named inspectFolder(context, folder), initializeFolder(context, folder), enroll/refresh(context, expectedVersion, selection); exact names are ordinary implementation choices. Persist a bounded version-1 catalog under namespace git-enrollment/key catalog; retain immutable change snapshots using appendSource in the same CAS transaction. DomainStore getRecord(context, namespace, key) and transaction(context, tx => tx.compareAndSwap/appendSource) are the concrete integration; no raw database access and no Git command inside the synchronous transaction. Persist current observed mappings through routine unchanged rescans/restart so normal local work stays seamless. Operational mapping has observed assurance and is not a certificate of uninterrupted historical incarnation. Git admin-dir plus local stat continuity can support unchanged worktree mapping without becoming universal proof. Actually observed disappearance/reappearance or contradictory metadata requires explicit gap/new mapping; unobserved same-name/same-OID ref recreation remains a stated historical limitation, not a reason to halt every scan. Preserve prior provenance independently and never upgrade observational assurance into certified historical fact. Existing branch-scope contract supplies identity/view semantics; production Graph projections and enrollment generations remain separate. Start only when both preserved direct prerequisites are DONE; do not treat the currently developing store as already accepted.",
