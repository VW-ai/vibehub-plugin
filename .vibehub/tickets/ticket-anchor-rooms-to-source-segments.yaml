  "active_contract_revision": 1,
  "constraints": [
    "Do not remove the overlapping-territory rule; move it to segment granularity. Two Rooms owning the same knowledge is the defect it exists to prevent.",
    "Existing Rooms with path-prefix anchors must keep validating and behaving identically; this is an extension, not a migration.",
    "Do not change how segments are computed. `source segment` is the single definition of a segment and its determinism is what makes anchors stable.",
    "Do not add a second store, manifest, or cache; anchors stay declared in room.yaml and everything else stays derived."
  ],
  "context": "Running Peel's two source files through the bulk pipeline proved the anchor model is the remaining blocker. Room anchors are path prefixes, and vh.mjs:801 rejects any two Rooms in a non-containment relationship whose anchors overlap. Both sources are single files, so a tree that assigns topical slices of one file to sibling Rooms is rejected outright — the first proposed tree failed with 21 overlap errors. The only shape the validator accepts is the root Room anchoring both files while every sub-Room carries anchors: []. That validates, but coverage accountability then collapses onto the root: `context coverage --room <sub-room>` is uninformative for every Room that actually holds Context, and Pass 4's by-Room sharding and Pass 5's per-Room settlement are unusable. The executor's judgement, which this Ticket accepts: Peel's original flat single Room may not have been only a diligence failure — it is close to the only shape the validator readily accepts when all material lives in one directory of files. A second, related asymmetry surfaced in the same run: contextCoverage reads coverage_exceptions per Room but reads citations repository-wide, so an exception only lowers the uncovered total for the Room that anchors the segment, and would have to be duplicated into every anchoring Room once several may anchor one file.",
