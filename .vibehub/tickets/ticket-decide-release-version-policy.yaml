  "context": "Observed on a real install: the local plugin sat at 648c5f62 while main was at 928ed611, exactly 143 commits ahead, with a restructured skills tree, a new vibehub-core, changes to all eleven SKILL.md files, changed migration guidance, and fully replaced Workbench assets. Both declared 0.8.0. The host reported that vibehub was already at the latest version and did nothing; only uninstall followed by install produced current content. The host mechanism is confirmed rather than inferred: the declared version string is the cache key, resolved from the marketplace entry's version, else plugin.json's version, else the git commit SHA. A plugin that declares a version therefore goes silently stale whenever content moves and the string does not; one that declares none is compared by SHA and cannot. verify-release-version.mjs already forces five manifests and the tag to agree on one version, but nothing forces a bump when shipped content changes and nothing gives main between releases a distinguishable identity. What a public version number means, whether main carries a pre-release identity, and what a contributor must do when landing a shipped change are public-surface and contributor-workflow choices, which this repository already treats as owner decisions rather than executor judgment. All three candidate policies are grounded in facts already established rather than requiring new investigation: bump-per-shipped-change follows from the allowlist in scripts/build-plugin-artifact.mjs, a distinguishable pre-release identity follows from the release cadence in CHANGELOG.md, and content-addressed distribution follows directly from the confirmed resolution order — a plugin declaring no version anywhere is compared by git commit SHA and therefore cannot go silently stale, which is why that option would make a CI bump gate unnecessary. Writing the three up with their consequences is a write-up, not a study.",
