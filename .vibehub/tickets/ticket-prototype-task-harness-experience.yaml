  "active_contract_revision": 1,
  "constraints": [
    "Do not treat these prototype visuals, typography, layouts, or mocked state as production authority.",
    "Do not constrain normal Agent Chat with a bespoke semantic workflow or require users to learn Skill names.",
    "Do not implement cross-Project coordination, automatic knowledge graphs, cloud sync, personal Context hierarchy, team collaboration, or a native desktop wrapper in this Ticket.",
    "Use mocked or disposable prototype state with no parallel source of truth, hidden durable state, or production backend.",
    "Technical DSH integration, compatibility, and executor event mapping remain owned by their feasibility and implementation Tickets."
  ],
  "context": "This Ticket is deliberately replanned to match the work actually accepted by the owner. The checked-in prototypes are not a high-fidelity replacement shell and must not become the visual baseline. Their durable value is the low-fidelity product model: a Ticket Graph is the first frame; entering a Ticket opens one Task Context Space; normal Chat, explicit Fork, Compare, Bring Back, scoped Context, Task craft, Start, execution presence, human attention, Evidence, closeout, and return form one continuous loop. Technical DSH seams are independently owned and proven by the foundation Spike. Future interaction and visual work starts from the accepted product logic, current Graph Workbench, and Codex/Linear quality bar rather than polishing these disposable assets.",
