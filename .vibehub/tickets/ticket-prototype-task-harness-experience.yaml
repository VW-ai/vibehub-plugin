  "context": "The owner rejected the first additive-slot and standalone prototypes as product UI. Those builds proved interaction inventory and DSH feasibility only. The product direction is now whole-application ownership: DeepSeek Harness remains the underlying runtime and plugin substrate, while VibeHub replaces the visible root layout, navigation, Workspace and Session framing, conversation chrome, composer, inspectors, onboarding, settings presentation, typography, motion, and responsive system. The result must feel like a completely different application before a VibeHub-specific control is opened. Chat remains a native high-capability Agent experience; Fork, Graph, Compare, Bring Back, Context, Ticket, Start, Run, attention, and Evidence form one continuous task loop around it. The prototype must also make the extension contract explicit because taking the DSH root removes child slots unless VibeHub deliberately recreates them.",
