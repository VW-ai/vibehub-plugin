    {
      "acceptance_id": "segment-determinism",
      "criterion": "`vh.mjs source segment --repo <root> --path <file>` returns identical segment ids for identical file bytes across repeated runs. Markdown splits at heading boundaries yielding `path#heading-slug`; every other file type splits into windows of at most 60 lines with boundaries snapped to the nearest blank line, yielding `path#L<start>-<end>`. Segments cover every line of the file with no gap and no overlap."
    },
    {
      "acceptance_id": "coverage-recomputation",
      "criterion": "`vh.mjs context coverage --repo <root> [--room <path>]` reports, per anchored source file, every segment cited by no Context `source.ref` or `evidence[].ref` and listed in no room `coverage_exceptions`, plus an uncovered total. Every value is recomputed from the working tree on each run and never read from stored state."
    },
    {
      "acceptance_id": "room-schema-exceptions",
      "criterion": "`room.schema.json` accepts an optional `coverage_exceptions` array of `{segment, reason}` objects; every existing room document without the field still validates, and `project validate` passes on this repository."
    },
    {
      "acceptance_id": "no-new-store",
      "criterion": "The change adds no manifest, progress file, cache, daemon, or second store. Segmentation and coverage are derived on every invocation."
    },
