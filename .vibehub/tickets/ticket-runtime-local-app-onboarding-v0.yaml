  "context": "Own launch/stop/reconnect and real onboarding/settings UI. A simple local UI is sufficient; choose minimal shell from the profile rather than requiring native desktop polish. Domain/semantic explorer remains separate.\nRolling-wave split: ticket-runtime-local-app-setup-v0 owns a first user-operable real setup shell, terminal-approved owner pairing, Git Project/worktree enrollment, secure API provider settings and the authoritative switch using already accepted modules. This Ticket stays draft and keeps every historical dependency. It consumes that new independently verified input, then owns actual plugin/executor connection, authentic login/quota/recovery states and the full capture/model/delivery disable walkthrough. Startup/setup obligations are made executable earlier, not deleted from the composed product. Its original Acceptance and Contract v1 remain immutable history; the same responsibility IDs are refined at v2 to distinguish foundation proof from full integration proof. No live adapter obligations, user permission or external-send authorization are implied by the earlier setup success.",
