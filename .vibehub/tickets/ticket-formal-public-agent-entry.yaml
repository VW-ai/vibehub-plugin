  "active_contract_revision": 1,
  "constraints": [
    "Keep Coding Agent as the primary product experience; the persistent product entrance is a minimal orientation layer, not a conventional multi-page marketing navigation or dashboard.",
    "Do not add routes, a backend, persistence, analytics, model calls, accounts, iframe content, a motion dependency, or writable product state.",
    "Do not invent founder identities, testimonials, metrics, customers, or capabilities; preserve the truthful installation and deterministic-example boundaries.",
    "Use the existing cool-neutral quiet-intelligence direction. Formality must come from hierarchy and precision, not serif editorial styling, gratuitous gradients, glassmorphism, 3D spectacle, or excessive animation.",
    "Reset and Exit demo must be immediate when keyboard initiated; use animation only for explanatory first-time spatial changes, respect reduced motion, and keep press feedback within 100-160ms.",
    "Do not deploy, bind a domain, change hosting configuration, mutate the installed graph UI, or modify the already-successful prior Outcome."
  ],
  "context": "The owner accepts the Coding-Agent-first interaction direction but finds the current result too prototype-like and visually inexpensive. The demo also lacks a stable way back to the product entrance after development begins. Preserve the initial conversation-first model and deterministic dark-mode cycle, but give the page a brand-level frame that remains visible in both the arrival and active-demo states. The VibeHub wordmark or Overview action should always return to the initial product conversation, and the active workspace should expose an explicit Exit demo action. Formality should come from disciplined hierarchy, fewer faux-window conventions, larger readable type, quieter surfaces, more exact spacing, restrained depth, and a reduced number of tiny all-caps labels—not from ornamental effects, a conventional marketing dashboard, or additional content. The resulting page should feel like a finished public product surface rather than a concept mockup while staying static, honest, and lightweight.",
