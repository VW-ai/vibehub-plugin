{
  "acceptance": [
    {
      "acceptance_id": "origin-provenance-is-canonical-and-immutable",
      "criterion": "skills/contracts/ticket.schema.json gains exactly one optional origin object on schema_version 2 with no new document kind: {harness: codex, thread_id, forked_from_id: string or null, turn_id, item_id: string or null, selection: {start, end, text_sha256} or null, captured_at}; omission means no origin and is the sole compatibility rule, every existing Ticket validates unchanged, ticket validate rejects a malformed origin, and vh.mjs ticket apply together with every host path built on it refuses removing or changing an existing origin and refuses adding origin to an already checked-in Ticket; origin is never derived from Thread names, previews or transcripts."
    },
    {
      "acceptance_id": "create-task-from-finalized-message-is-exact",
      "criterion": "A Create Task action is offered only on finalized assistant messages and on an active selection inside one, never on live streaming items or user messages, and only while the Project scope is bound; it opens a confirmation surface with Task title, derived ticket_id, required outcome, context prefilled from the quoted text and exact source identity, and a preview of the Context packet the Task would send; confirming writes exactly one draft Ticket through validateTicket with that origin and one placeholder acceptance, the source Chat continues unchanged with an inline association marker at the origin Turn, the new Task appears in the Graph and Task list as REFINE, and when unbound the action is disabled with the missing scope explained."
    },
    {
      "acceptance_id": "attach-and-quote-into-task-are-explicit",
      "criterion": "Attach to Task lets the user pick an existing Task of the bound Project and appends one provenance reference of the form codex-thread:<thread_id>/turn:<turn_id> to a Task without a successful Outcome to that Ticket's provenance_refs without touching origin, deliveries, acceptance or relations; an explicit Quote into Task places the selected text into that Task's task-scoped conversation draft where it reaches the Agent only inside the host-built packet humanMessage; neither action mutates the source Chat, creates a Thread, infers content from the transcript, or turns the association into a depends_on relation."
    },
    {
      "acceptance_id": "remember-is-a-governed-proposal",
      "criterion": "Remember on a finalized assistant message or selection opens a surface listing only existing Rooms of the bound repository, prefilled summary and detail from the selection, a type from the Context schema enum, and the exact source reference and quote; confirming writes exactly one Context document through the same validation as context put with state active, the Codex Thread and Turn as source ref, and at least one evidence entry, leaving it uncommitted so Git review remains the activation gate; Remember never runs automatically, never creates a Room, never writes outside the bound repository, and is disabled with explanation when unbound."
    },
    {
      "acceptance_id": "task-workspace-returns-to-source",
      "criterion": "A Task with origin shows an origin chip in its Workspace naming the source Thread, Turn and selection excerpt, and Return to source opens that Thread on the chat route scrolled and focused to the origin item; the source Chat renders association markers for every Task born from it, the sidebar and Task list show each Task's origin, and the Graph renders a Chat-to-Task provenance edge with its own edge kind exposed as a DOM attribute, always drawn for the selected or focused Task and never rendered as or counted among depends_on relations; one Chat birthing several Tasks lists all of them."
    },
    {
      "acceptance_id": "bridge-writes-are-explicit-recoverable-and-uncommitted",
      "criterion": "The host advertises a second explicit write class beside explicitImportOnly naming the exact Ticket and Context paths the bridge may write and commits false, in both /health and bootstrap; no bridge action runs git add, commit or push and written paths surface as uncommitted changes; if anything after a bridge YAML write fails, including a later Start whose Thread naming or first Turn fails, the checked-in Ticket remains valid and its Workspace still offers its derived next action; after an app-server restart and a browser reload every origin, association and linkage is recovered from checked-in YAML and Codex-native Thread identity only, and the static no-second-store test is extended to the bridge."
    },
    {
      "acceptance_id": "bridge-surfaces-hold-the-baseline",
      "criterion": "The confirmation surfaces and pickers restore focus on close, trap Tab while open, close on Escape, and expose keyboard paths for every pointer action; new elements meet the WCAG AA floors of the existing contrast test in both themes; the browser interaction guard gains negatively controlled checks for finalized-only placement, the Create Task flow, Attach, Remember, origin chip and Return to source at 1280x800 and 390x844 in Light and Dark; the hookPrompt timeline divider no longer reads Project instructions and gains fixture coverage; npm test, npm run verify and the guard pass."
    }
  ],
