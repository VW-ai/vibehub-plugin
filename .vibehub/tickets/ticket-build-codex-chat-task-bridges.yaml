  "context": "The production Codex-first shell is accepted, so this Ticket implements the smallest exact bridge between continuous ordinary Chat and durable VibeHub work. Today Make Task and Remember are disabled placeholders, no shell path writes a Ticket or Context document, Task-to-Thread linkage is derived only from the Codex Thread name, and no origin is recorded anywhere because Ticket schema v2 has no slot for it. The bridge adds one optional typed origin field to the Ticket schema following the v0.8 deliveries precedent with omission as the only compatibility rule, a Create Task action that writes one draft Ticket carrying immutable origin, an Attach action that appends a provenance reference to an existing Task, a Remember action that writes one Context document into an existing Room as a governed proposal whose activation gate remains Git review, a Workspace origin chip with return to the source Turn, and inline, list and Graph association presentation that never becomes a dependency edge. The UI noun is Task; the canonical document kind stays ticket. Every write lands uncommitted in the one bound repository and is advertised as an explicit chat-bridge write class. Audio capture, final visual identity, packaged install and the daily-use alpha remain other Tickets. A Task-update-from-Chat action beyond Attach and Quote into Task is deferred to a later Ticket.",
