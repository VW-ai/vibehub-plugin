  "context": "The capability layout baseline identifies DomainStore and GraphStorage as the smallest coherent production SQLite cluster. DomainStore owns the real SQLite connection and synchronous transaction boundary; GraphStorage is already a finite adapter over a caller-owned scoped transaction view. Relocating them together does not split atomicity or require the later application-service transaction seam. Phase 0 SqliteCandidateStore, provider settings, app bootstrap storage and Graph/Context/Exploration orchestration have different roles and remain outside this Ticket.",
