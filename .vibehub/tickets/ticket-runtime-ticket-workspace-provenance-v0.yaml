    {
      "acceptance_id": "management-conformance",
      "criterion": "Real-store/API-ready fixtures prove A-create/B-execute/C-independent-closeout, later Contract/reopen, two concurrent attempts, source event retry, crash/restart and workspace removal. Hiding unrelated Tickets preserves authorized dependency stubs/blockers and a restore path; no global status mutation or record deletion occurs.",
      "identity": "sha256:75b4b039f0045c79a361c1718dbc4d508ce190841697b5beb4e51644be42de53",
      "revision": 1,
      "state": "active"
