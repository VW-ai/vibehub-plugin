      "criterion": "Implement bounded queries for current relevant, created-here, participated-here, execution-finished-here, accepted-here, Project-wide and hidden/archived views. Return reason for inclusion. A Ticket created in A but active in B appears in B; current visibility preferences do not alter Ticket identity, dependencies or acceptance.",
