  "context": "The user requests distinct Goals, Epics, and Tickets with canonical relations. This supersedes the earlier dependency-only hierarchy decision. Goals describe intended benefits and success criteria; Epics group a coherent capability under one Goal; executable Tickets may belong to one Epic. Standalone existing Tickets remain valid. Containment never substitutes for depends_on. Implement storage, validation, read/write operations, hierarchy projection, safe format migration and skill guidance; this request does not include publication or a Workbench redesign.",
