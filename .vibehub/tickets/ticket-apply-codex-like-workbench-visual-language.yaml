  "constraints": [
    "Preserve the dependency-free read-only loopback Workbench and canonical validated-document boundary; add no network font, third-party UI runtime, persistence, writable route, Desktop application, or parallel state model.",
    "The approved whole-card operational state must remain visually and semantically distinct from human authority/evidence attention, and neither axis may rely on color alone.",
    "Do not trade away Victor's causal-cone interaction, Inspector detail, exact source, focused link, archive/query behavior, minimap/pan/zoom, or READY-gated Agent handoff for visual simplification.",
    "Hierarchy, position, selection state, and interaction carry meaning wherever safe; visible copy is reserved for distinctions, exceptions, exact facts, errors, and actions that would otherwise be ambiguous."
  ],
