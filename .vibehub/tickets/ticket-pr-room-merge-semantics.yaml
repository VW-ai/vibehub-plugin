  "context": "vibehub-pr predates Rooms and knows nothing about merging them. Three gaps close together, per decision-derived-alignment-recompute and decision-stale-origin-layers. Detection: two branches naming the same territory differently (two room directories with overlapping anchors) merge without any git conflict and silently double-claim code, so validation must detect anchor overlap between rooms where neither contains the other — detection only, no automated fusion, because parallel work overlapping is an anomaly that needs surfacing, not machinery. Origin: stale reasons split into drift:-prefixed mechanical marks (derived state, clearable when recomputation shows anchors fresh) and unprefixed semantic claims (knowledge, preserved across merges until addressed); the convention lands once in the knowledge-governance reference, drift reports whether a stale room's hashes currently match so resolution is mechanical where possible, and the deferred write-back instruction adopts the prefix. Judgment: the PR skill gains a few judgment-first lines — after a merge, alignment state is recomputed against the merged tree, never hand-picked from a side; same-slug room.yaml conflicts are boundary decisions; semantic stale survives.",
