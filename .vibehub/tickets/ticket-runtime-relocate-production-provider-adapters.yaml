  "context": "The capability layout baseline currently places all Judge-like files in one flat adapter directory, but a read-only consumer audit found that only JevJudge, TypeSafeJevJudge and OpenRouterJevJudge are production provider routes used by LocalJudgeRuntime. Their shared judge-input helper is provider-boundary serialization. Haiku and Claude CLI are comparison transports; heuristic, recorded and SQLite are Phase 0 replay; cached and resilient serve benchmark or verification flows. This Ticket performs the smallest truthful production move and leaves those other roles for their own research or verification migrations.",
