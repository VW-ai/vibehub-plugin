  "constraints": [
    "Systematic transition logic lives only in the lifecycle contract and its owner skill; no skill restates another skill's transition.",
    "Skill additions stay to a few judgment-first lines; deterministic behavior goes in vh.mjs.",
    "No background capture, polling, or checkpoint cadence."
  ],
  "context": "Three gaps close together. Retrieval: context query cannot scope to a room, so an agent entering a room cannot cheaply ask for everything the room knows; a --room filter over the room subtree (including sub-rooms) fixes it deterministically. Discovery: ticket-plan's trigger already covers work discovered during execution, but ticket-run never tells the executor what to do with it, inviting silent scope creep or lost work; the rule must live in exactly one place — a new execution-discovers-work event in the ticket lifecycle contract owned by vibehub-ticket-plan, with ticket-run pointing to planning without naming or restating the transition (the ownership test mechanically enforces single-sourcing). Settlement: knowledge currently enters only via explicit user ingest or distill; run and closeout gain a short judgment line delegating durable cross-ticket facts to the ingest skill, into the room the ticket entered — explicit delegated capture, never background capture.",
