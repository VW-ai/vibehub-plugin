      "criterion": "A local Git repository named vibehub-personal exists as a sibling of the current Plugin checkout, contains an explicit private-data policy, ignores configured personal data roots, leaves licensing and public distribution explicitly undecided, and does not contain Private pilot records or modify vibehub-plugin tracked runtime files."
