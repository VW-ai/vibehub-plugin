  "context": "Rooms are currently invisible in the local graph UI beyond the room chip on context cards. The quiet-intelligence constraint already demands that stale facts appear in situ at the locus that owns them, and room drift states (FRESH, DRIFTED, STALE, UNKNOWN, WARNING) are the first real mechanical source of that signal. Everything needed is mechanically derivable from canonical documents: the room tree and room.yaml self-descriptions, drift states via the same snapshot-hash comparison vh room drift uses, and ticket-to-room consumption edges from context_refs paths. This is a large ticket that starts with UI/UX design before any implementation: the visual form of the rooms surface is an owner decision governed by the quiet-intelligence standard. Deliberately out of scope: re-clustering or re-laying-out the causal ticket graph by room — the graph's primary object remains the execution order.",
