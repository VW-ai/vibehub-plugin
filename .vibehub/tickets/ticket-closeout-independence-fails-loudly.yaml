      "criterion": "node vh.mjs ticket closeout rejects an Outcome whose input does not declare an independence source drawn from a closed set covering a subagent with no execution context, a separate session started from the handoff, and a different human; the rejection is a machine-readable error envelope, writes nothing under .vibehub/outcomes, and leaves the Ticket's next_action at CLOSE_OUT, proven by a test that asserts no file appears."
