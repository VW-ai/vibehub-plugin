      "criterion": "The declaration is carried by an explicit field whose addition to outcome.schema.json is made deliberately, with the schema's compatibility handling stated, rather than smuggled into summary free text; existing Outcomes without the field remain valid and readable."
    },
    {
      "acceptance_id": "the-record-shows-who-judged",
      "criterion": "A reader of a checked-in Outcome, and the Workbench projection of it, can see the declared independence source without reconstructing the session. The criterion is presence and readability only: because the engine must not verify the claim, an executor that declares a source it did not use produces an Outcome that is not mechanically distinguishable, and the gain is that silence becomes a false statement in a reviewable Git document rather than an absence."
