      "criterion": "The current unified Dashboard information architecture, project/worktree navigation, board and graph views, visual tokens, card styling, Inspector, Context surfaces, and responsive shell remain recognizably intact; implementation is a targeted graph-control and computation correction rather than a return to the previous Workbench shell or a broad restyle.",
