    {
      "acceptance_id": "bounded-diff-capture",
      "criterion": "Use an async fixed-argv isolated Git comparison profile, at most 8 MiB copied index, 2 MiB child output, 5-second child/15-second sample deadline, 256 paths, 48 KiB approved metadata and one bounded resample. Tiny scratch metadata/index reads existing objects without copying history or modifying source metadata; no external filters/process/fsmonitor/hooks/diff/textconv, lazy fetch, network or submodule recursion can execute, including a source-config change race. Unsupported conversion/index/path profiles and binary/oversize/unmerged cases are explicit; rename is D+A with detection disabled. Tracked dirty signature changes on further content edits despite unchanged status; no raw patch/file text is retained. Up to 128 bindings/hints coalesce with 250 ms quiet/2-second maximum debounce, one in-flight sample/one pending envelope, at most four per drain and no installed watcher or autonomous timer.",
      "identity": "sha256:d7f15ba87404018577ff75a3927786f4ec5d0e5230cecbe070ba900edc2c9f88",
      "revision": 2,
      "state": "active"
