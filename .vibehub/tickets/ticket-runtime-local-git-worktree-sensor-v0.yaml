      "revision": 2,
      "state": "active"
    },
    {
      "acceptance_id": "enrolled-project-sensor",
      "criterion": "Consume the enrolled common-repository/worktree registry and current activation generation; observe enabled linked worktrees even outside selected folder. Branch-only refs are not live execution locations. Stop on disable/revocation and record gaps; fresh membership does not backfill arbitrary history.",
