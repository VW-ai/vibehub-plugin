  "constraints": [
    "Implement within semantic-runtime/ with its own dependencies, build, tests and release; host/source integrations consume public contracts and never import sibling plugin internals.",
    "Retain existing replay/provider behavior, run affected contract tests and component boundary checks; release composition also runs standalone and plugin artifact checks. Do not rebuild completed Phase 0 work.",
    "Fast judges and workers produce auditable candidates/proposals; canonical writes require explicit authority and concurrency checks. Do not infer acceptance from model confidence.",
    "Use synthetic or explicitly selected, destination-authorized input for live calls; credentials stay outside Context, logs and Git. Existing Peel authorization is not blanket authorization for new sources or destinations.",
    "Implement only the local sensor/metadata adapter and synthetic composition tests/docs. No new daemon, generic watcher/queue/identity registry, automatic source enrollment, App UI/HTTP wiring, host session capture, Graph mutation or live model/private repository collection. All historical Ticket Contracts and Acceptance identities remain unchanged; this refinement appends the next revisions of the same five responsibilities."
  ],
  "context": "Implement a composable local Git sensor, not a watcher daemon or installed host plugin. Its concrete useful path is selected synthetic worktree -> bounded approved metadata snapshot -> actual DurableIngress normalized GIT_DIFF, immutable snapshot/cursor/outbox and post-commit receipt -> authorized read after reopening the SQLite store. It performs no model call, semantic processing, source completion, canonical write, GitHub request, cloud send or automatic App capture. App/controller wiring and measured Codex/Claude session capture stay with their existing Tickets. Retain the same five responsibilities with executable scope; no additional database, scheduler, queue framework or identity registry is needed.\n\nPublic composition: LocalGitWorktreeSensor({store, authority, monotonicNow?}) internally constructs GitProjectRegistry, ProjectActivation and DurableIngress over the exact supplied handles. The constructor does not start filesystem observation, spawn Git, migrate a database or invent a source. Export strict inert-data validation for the metadata wire format and bounded error codes. Public methods are bind(context,{registration_id}), hint({registration_id}), async drain(context,{limit:1..4, force?:boolean}), status(context,{registration_id}), and close(). bind uses an actual owner-created DurableIngress registration whose immutable execution tuple exactly names an active repository/checkout/worktree from the actual enrolled catalog; its producer principal must equal the opaque caller, its actual installation must match, snapshots must be enabled, and its fixed source mapping maps git_worktree_snapshot to GIT_DIFF. A human/service owner uses existing ingress.registerSource first; the sensor does not add idempotent registration, search private ingress keys or self-certify a client-supplied catalog. The bound ID is that registration_id, not a second identity. bind returns {registration_id, repository_id, checkout_id, worktree_id, state:bound}. drain returns {status:drained|idle|paused, results:[{registration_id, status:accepted|duplicate|unchanged|pending|gap|paused, event_id?, receipt?, code?}], more_due:boolean}; only actual successful intake can carry a receipt. status returns {registration_id, state:bound|pending|closed, pending_event_id:null|id, last_receipt_event_id:null|id, gap_summary, counters}. These are scoped results; another Project cannot learn pending IDs/counters. close aborts the current child and clears retained bytes/bindings; no external state is deleted. The namespace requirements remain the existing Git/activation/ingress ones: this slice adds no durable sensor namespace. Up to 128 bindings are held in memory; binding and status do not read file content. The same source can be rebound by the same authorized owner after process restart. Multiple independent observers may produce independent snapshots; do not promise one global observation per content hash.\n\nAuthorization: bind/drain require sensor:capture plus the exact public ingress:read/submit, store:read/write, project:inspect, activation:read/admit actions used by the composed methods; no implicit wildcard or graph/publisher permission. status requires sensor:read, store:read and ingress:read, and returns only the current process's bounded counters/status for the caller's actual scope and source. Trusted monotonic scheduling time injection is a test/composition capability, never a JSON option. hint is an untrusted bounded wake-up hint for an already bound ID, contains no path/text/catalog/identity override, and cannot authorize capture. It performs no I/O and returns queued/coalesced/ignored/overflow. drain selects only bindings in the authenticated caller's scope, verifies actual producer/current source policy and activation before any content read, and checks them again between subprocesses and before intake. Authority expiry/revocation, disabled source, stale membership or disabled Project prevent new reads and acceptance. No action mints credentials or accepts an arbitrary transaction callback.\n\nActivation and membership: derive the epoch from actual ProjectActivation state, never from a hint. bind can record selected configuration while disabled but cannot read Git content; drain stays paused. The only paths eligible for content capture come from active worktrees in the actual enrolled catalog, including linked worktrees outside the originally selected folder. A branch-only ref is never a live location. Check actual common/admin directory identities and membership around capture; if a selected worktree was removed/recreated/moved without accepted continuity, return membership_gap and ask the existing owner refresh/re-enrollment flow to reconcile it. Do not search neighboring folders or auto-enroll a clone. A normal unchanged observation stays usable at the registry's documented observed assurance level; no routine mandatory re-enrollment. Physical stat, path, HEAD or stable before/after snapshots cannot certify an unobserved delete/recreate or A->B->A transition. Catalog drift is reported, not used to rewrite an old event. No Git I/O runs inside DomainStore transactions; actual ingress.submit supplies the final same-store epoch/Git/ACL/auth fence. Process stop can abort its own child and discard pending bytes; cross-process disable cannot recall an already started read, but no late old-epoch event can be accepted. Re-enable samples current state only after explicit new hint/drain and records a gap, with no historical scan or disabled-period backfill.\n\nMetadata wire v1: a strict, bounded JSON snapshot has kind git_worktree_snapshot, schema_version, comparison_profile, capture timestamps, catalog version and immutable source ref, actual repository/checkout/worktree/installation IDs, observed physical-identity pins, exact Git object format, HEAD {state:branch|detached|unborn, oid:null|fullOID, branch_base64:null|bytes}, index digest and status, separate staged and unstaged change metadata, untracked path/lstat metadata, capture consistency, interval/gap information, and explicit mapping status. Host Session/Execution IDs are omitted from RawEvent and represented as unknown in this metadata; exploration is unmapped because no production exploration enrollment exists. A ref incarnation can be shown only as an observed catalog association with its assurance and matching actual ref observation, never as an exploration. Immutable code base is the actual verified HEAD commit when present; unborn has null base, not an invented empty commit. Branch checkout cannot retarget earlier event identity, base or mapping. RawEvent has source_native_event_id:null, occurred_at:null, observed_at equal to the capture observation time, actual Git identity tuple, delivery channel local_git, and provenance for a service-owned local source object plus the exact Git commit when present. Current source ACL/sensitivity determine captured access without broadening; snapshot policy approves only exact metadata bytes built by this sensor in this operation, not arbitrary caller JSON or a sanitized flag. Filesystem paths in metadata are relative base64 byte strings, never coerced into lossy UTF-8 or diagnostic text. No absolute project path, commit message/author, environment, config content, file text, patch body, transcript or credential is retained in the event or logs. Relative filenames remain potentially sensitive source data under captured ACLs; this local capture approval grants no external model destination permission.\n\nComparison profile: implement one explicitly named safe bounded raw-byte comparison profile. Preserve HEAD->index and index->working-tree as distinct observations; retain modes/OIDs and conflict stages where supported. Changes A/D/M/T and unmerged state are explicit. Rename similarity is deliberately disabled; a rename is represented as deletion/addition with rename_detection:disabled, not silently missed or invented. Text/binary classification is bounded and may be unknown; binary changes retain metadata/digests without bytes. Untracked files expose bounded relative paths and lstat metadata only, never file content; consequently untracked content equality is not claimed. Gitlinks/submodules are metadata-only and never recursively scanned. The dirty signature must change for a further tracked text edit while status/path remain unchanged: hash a complete bounded raw diff/content-comparison stream and discard its bytes. Never use Git's all-zero unstaged OID or status/path alone as a content digest. Hash prefixes are not full digests; over-limit data yields explicit oversize/unknown coverage, no complete assertion. The profile does not emulate arbitrary Git user conversion/configuration. Reject unsupported filter, working-tree-encoding, EOL/ident conversion, split/sparse-index or unsafe path cases with a bounded unsupported_profile gap. Preserve a header-level observation only when it explicitly marks the missing comparison; it cannot be labeled a complete diff. A plain repository with no conversion features must succeed. Define exactly which source-local ignore rules the profile uses; do not imply global/info excludes were applied if isolation omitted them.\n\nSubprocess isolation is essential even for metadata: extend/reuse the existing tiny GitProvenance scratch-metadata pattern with a bounded copied index and read-only reference to the source object directory. No clone, object/history/ref-tree copy, conversion emulator or source metadata mutation. All commands use fixed argv, no shell; no inherited Git config/env/credentials, no pager, hooks, fsmonitor, external diff/textconv/filter process, submodule recursion, network transport or lazy fetch. Minimal private scratch config has no source remotes/config/includes, and command overrides/scratch attributes fix the comparison profile. Inspect/refuse unsupported source conversion semantics with bounded read-only checks, but safety must not depend on a check-then-use source-config race: worktree commands never load source execution config. Source index/ref/config bytes remain unchanged; temporary private index/config is cleaned on normal/error/cancel paths. Reject symlinked or unsafe index/metadata inputs instead of following an arbitrary target. A source-config swap after profile inspection must not execute any helper. Existing GitProvenance alone proves raw-object reads, not this new dirty/index surface, so add hostile-helper fixtures for it.\n\nBounds and scheduling: each child has a 5-second timeout and at most 2 MiB combined retained stdout/stderr; one sample has a 15-second deadline, at most one resample on detected race, and no unbounded retries. Input index copy <=8 MiB; at most 256 changed+untracked path entries, each <=4096 raw bytes; approved metadata text <=48 KiB, entire RawEvent/intake remains under existing 128 KiB limits. Excess is a bounded code/gap, not silent truncation or partial success. Up to 128 bound sources/hints, one in-flight sample per sensor instance, at most one exact pending intake envelope globally, and at most four due bindings per drain. No own timer/polling daemon: host calls hint and drain. hint coalesces per source with 250 ms quiet debounce and 2-second maximum wait measured by the injected monotonic scheduling clock; force skips debounce only, never authorization/bounds. Repeated hints before a due drain produce one sample. Within a running binding, an unchanged complete semantic signature suppresses another event; exclude observation timestamp from that signature. Restart or another observer may create a fresh independent observation, not a replay assertion. Test scheduling deterministically; deadlines are safety bounds, not real-time performance promises.\n\nSnapshot assurance: perform bounded before/after HEAD/ref/admin/index and content-signature checks around the work. On a detected mutation discard mixed results and retry at most once within the sample deadline, then record unstable_capture. Stable endpoints are observed consistency, not an atomic filesystem snapshot; document the remaining ABA/unobserved-write limitation. Filesystem traversal must stay in the registered worktree, never follow symlink directories or untracked-file targets; symlink changes may be represented by bounded link metadata. Permission failures, invalid path bytes, deletion/recreation, index locks and races are explicit unknown/gaps. This metadata is a work signal, not source completion or proof that a commit contains all changes.\n\nDelivery deliberately uses the original Ticket's explicit drop policy instead of adding another durable queue. Each snapshot is an independent source observation with producer.sequence:null and no fabricated causal parent; this cannot advance a contiguous source watermark or imply capture completeness. The running process retains one exact RawEvent/snapshot/epoch/retry key until actual ingress acceptance or explicit drop, and calls actual ingress.submit only outside filesystem work and outside another transaction. Its deterministic event ID comes from ingress.eventIdFor for the retained random observation key; source observation time and approved bytes stay unchanged on retry. drain makes at most one submit attempt for a pending envelope, up to three attempts across explicit calls. Temporary store failure retains that single envelope; further hints coalesce within the same fixed limits. Retry reconciles an existing receipt first when readable, including a lost response after commit, and returns the original first pins rather than claiming a new acceptance. A different process is not allowed to reconstruct a lost envelope from a path or digest. Exhaustion, process stop, changed activation epoch, membership/access change or capacity failure drops the local pending copy and records a bounded gap/unknown-delivery result; no new event can impersonate its old identity. If actual receipt status is unavailable or unreadable, distinguish unknown admission from confirmed non-admission.\n\nGap truth: status returns current-process reason counts (saturating), nullable observation interval, pending ID/state and last accepted receipt ID, never pending content. A later admitted snapshot includes bounded gap summary; every new process starts with an explicit unknown preceding interval because it has no durable collector offset. No claim to know how many changes occurred while offline or after a crash. If store/auth is unavailable, the gap exists only in the returned/in-memory diagnostic until a future authorized snapshot; do not claim it was durably recorded. The existing ingress cursor capacity (4096 entries and tighter 1 MiB record bound) remains explicit: stop that stream at capacity, no silent truncation, pruning, sequence reset or producer-epoch rotation. ACK means actual committed ingress receipt only, not downstream handoff/completion. This slice never invokes ingress.handoff, completeSourceEvent, Graph mutation or any model. Ordinary Git/editor/coding commands never depend on drain success, and no blocking hook is installed.\n\nVerification uses only newly created temporary synthetic repositories and SQLite databases. Include real primary and outside-folder linked worktrees; SHA-1 and supported SHA-256, unborn/detached/branch-switch, stage-only/worktree-only/staged-then-further-edit, deletion/addition(rename-disabled), binary, symlink/untracked and unmerged cases. Test current enrollment and captured base survive later checkout/ref changes without history rewrite. Bounded fake clock and controlled subprocess/file phase hooks may deterministically place editor churn, index changes, file changes during comparison, checkout change, source config swap, deletion/recreation and access/epoch changes; those hooks are trusted test internals, never public JSON or production untrusted callbacks. Hostile clean/process filter, fsmonitor, external diff/textconv, hook, promisor/remote and submodule fixtures leave invocation markers absent and source index/ref/config unchanged. Test exact retry/dedupe/lost response after real ingress commit, reopen and read approved metadata/event/cursor/outbox, malformed/oversize/getter rejection without execution, cross-Project/producer denial, captured ACL tightening and disabled binding, expiration during capture, no old-epoch replay after re-enable, closed/busy store/drop/capacity limits and cancellation cleanup. Record measured command count/bytes/duration for a fixed synthetic <=256-path workload without making a large-repository/native-filter fidelity claim. Run focused sensor plus affected ingress/Git/activation/core provenance tests and component boundaries; no live capture of this repository, private paths/traces, credentials or model calls belongs in acceptance.",
