      "acceptance_id": "worktree-state-model",
      "criterion": "Deliver LocalGitWorktreeSensor with strict metadata v1 and the bind/hint/drain/status/close API specified in Context, composing the same actual Git registry, activation and DurableIngress. Execution-bound existing source registration resolves repository/checkout/worktree/installation; actual HEAD branch/detached/unborn and separate HEAD-to-index, index-to-working-tree and untracked metadata have exact digests/base provenance and path bytes. Real host Session/Execution stay unknown and exploration unmapped; no invented enrollment, retroactive checkout mapping or false atomic-snapshot assurance. Authorized admitted metadata reopens as the exact RawEvent/normalized GIT_DIFF/snapshot/first receipt/cursor/outbox through public ingress reads.",
