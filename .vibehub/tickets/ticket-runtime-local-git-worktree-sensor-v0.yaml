      "acceptance_id": "worktree-state-model",
      "criterion": "Observations distinguish HEAD, index, working tree and untracked state and bind repository/checkout/worktree/session/execution, immutable code base and explicit exploration mapping. Checkout/ref movement cannot retroactively move old events to another exploration; uncertain mapping is surfaced.",
