  "constraints": [
    "Task, not Chat, remains the primary durable and user-facing unit; Chat is an unconstrained exploration and steering surface around Tasks.",
    "The Ticket Graph remains the home model for committed work; research may vary how it transitions into one Task but may not replace it with a flat chat history, Kanban clone, or generic dashboard.",
    "Use Codex desktop as the interaction-quality baseline, not as a pixel-copy target, and avoid paper, editorial, marketing-dashboard, sci-fi cockpit, and decorative graph aesthetics already rejected by the owner.",
    "Do not implement production DSH integration, personal Rooms, cross-Project orchestration, collaboration, or a high-fidelity visual system in this Ticket.",
    "Treat DSH Agent Team and every other executor-internal task mechanism as opaque; research the human-facing Task and Session layer only."
  ],
  "context": "The owner has rejected several visual-first mockups and does not want another arbitrary skin. Research must begin from the actual VibeHub scenario: the home object is a Task graph; the user creates work, observes mostly autonomous execution, understands what happened, answers exact attention requests, reviews Evidence, and intervenes through a capable Chat when useful. DSH should feel like a different application, but the first integration remains a non-invasive Plugin that preserves its runtime and extension ecosystem. The study therefore separates interaction architecture from visual styling, extracts reusable patterns from excellent task, agent, command, project, and branching-chat products, then expresses a small set of end-to-end alternatives against the same scenario. The owner chooses the base interaction direction; only then should high-fidelity visual work continue.",
