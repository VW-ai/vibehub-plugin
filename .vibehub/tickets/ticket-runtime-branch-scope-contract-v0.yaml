      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "participation",
      "criterion": "Model many Sessions/executions per worktree and multiple exploration executions of one Ticket while preserving exact Acceptance/Evidence association. Worktree deletion or Session restart does not erase exploration lineage or silently rebind another execution.",
      "identity": "sha256:3a7f7a48157a8bcdfdca9bb677c3f8cbe301bf89cf4bd521039ff0e02b291cd4",
      "revision": 1,
      "state": "retired"
    },
    {
      "acceptance_id": "view-and-authority",
      "criterion": "Executable view selection separates selected shared Project Context, local exploration assertions, and other-exploration notices. Incompatible hypotheses in separately scoped explorations do not automatically contest Project truth; same-scope concurrent changes and violation of governing constraints remain explicit. Project overview is an aggregate, not main.",
      "identity": "sha256:039b7df88fd74e29af176746a2d7c65691519bb7c4450367bf680a33fb43ec48",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "scope-conformance",
      "criterion": "Synthetic public-entry tests prove the mapping/lifecycle/view invariants plus denied cross-Project references. Run affected tests and component boundary checks; publish extension/migration requirements for current single-lineage Graph and immutable catalog bounds.",
      "identity": "sha256:0a30d1351059054a469cc7bbbf57a0cf0c58d73fa2c63b3acb03eafc4927b524",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "participation",
      "criterion": "Model many Sessions/executions per worktree and multiple exploration executions of one Ticket, preserving exact Acceptance/Evidence association. Provide stable execution-workspace provenance refs distinct from administrative Workspace. Creation, participation, execution completion and independent acceptance may have different origins; worktree deletion/recreation or Session restart does not rewrite historical identity. This contract supplies identities, not a second Ticket state machine.",
      "identity": "sha256:fd6f0f38f0046ad0ca3f9abfe01296ad569d9227152618a45c04cb31a33a5874",
      "revision": 2,
      "state": "active"
    }
