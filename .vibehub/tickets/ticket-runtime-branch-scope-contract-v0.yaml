      "acceptance_id": "scope-identity",
      "criterion": "A stable Project-scoped exploration identity binds an explicit repository/ref incarnation and selected base revisions; branch names and filesystem paths are attributes. Fixtures distinguish same-name branches across repositories/clones, explicit shared exploration enrollment versus merely matching refs, rename, branch switch, detached HEAD, delete/recreate and non-Git Project work. Mapping ambiguity is explicit, never guessed from main or timestamp.",
