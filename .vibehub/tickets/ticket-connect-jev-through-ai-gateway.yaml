  "constraints": [
    "Never read, print, log, commit, or place the API key in Agent-visible output; retrieve it directly from the macOS Keychain service vercel-vb into the ignored local env file.",
    "Keep AI SDK and JEV implementation inside semantic-runtime so the shipped VibeHub Skill plugin remains independently installable.",
    "Keep semantic core and policy code provider-independent; typesafe-ai/jev belongs in an adapter.",
    "Use only synthetic content for live smoke calls and test fixtures.",
    "Do not treat JEV output as canonical truth or let the adapter bypass existing policy thresholds, defer behavior, provenance, or audit storage."
  ],
  "context": "Phase 0 already has a provider-independent SemanticJudge interface plus offline replay. This slice installs Vercel AI SDK inside semantic-runtime, adds the requested runnable openai/gpt-5.5 example, and connects typesafe-ai/jev as the first live judge adapter. The API key comes directly from the macOS Keychain item vercel-vb into an ignored semantic-runtime/.env.local file and must never enter logs, Git, Ticket evidence, or Agent-visible output.",
