schema_version: 1
kind: ticket
ticket_id: ticket-first-runtime-pivot
outcome: Installed VibeHub uses the Ticket graph as the development control plane in Ticket-managed repositories while preserving the Context Layer as high-quality semantic infrastructure and preserving context-only repository behavior.
context: The public README and active decision-ticket-intelligence-loop-001 and decision-ticket-skill-driven-boundary-001 already establish Ticket orchestration as the development control loop and Skills as its semantic owner. Active decision-workbench-006 assigns the one unconditional protocol injection to SessionStart, while decision-workbench-010 keeps hooks mechanical and Context semantics in Skills. The installed runtime still injects the earlier context-first ceremony unconditionally, so this Ticket aligns runtime behavior with the already accepted product and architecture rather than selecting a new product direction. Ticket-managed means the exact checkout contains the canonical .vibehub/tickets/protocol.yaml. In that mode, SessionStart should route concrete deliverables through Ticket planning or a READY Ticket Run, and execution should rely on the compiled ContextBinding, current Decisions, and prerequisite Outcomes. Context query remains the governed source for project-wide knowledge when planning or a Ticket exposes a gap; ingest remains the path for durable cross-Ticket semantics. Generic periodic knowledge reminders should not interrupt a Ticket Run, but their mechanical cadence must remain observable as a shadow checkpoint so migration quality can be measured. Repositories without a Ticket ledger remain context-first and retain the existing reminder safety net. This bounded change deliberately preserves the current Installed, Connected, and Activated evidence contract; recognizing Ticket operations as activation value requires a separate governed product decision. Two partial prototype edits already exist in hook-ingest.ts and knowledge-checkpoint.ts; treat them as unverified starting work, not as accepted design or evidence. This Ticket is a bounded runtime adoption pivot, not the historical M5 multi-path dogfood proof.
acceptance:
  - acceptance_id: canonical-context-truth
    criterion: A successful canonical knowledge operation amends or supersedes intent-workbench-003 so governed retrieval states the Ticket-managed shadow and context-only reminder contract; Evidence binds the resulting Spec revision and operation receipt, while canonical validation, provenance, placement, conflict, stale, and receipt quality gates remain unchanged.
  - acceptance_id: checkpoint-dual-mode
    criterion: At the configured cadence, Ticket-managed tasks record a deduplicated shadow checkpoint without injecting the generic knowledge reminder, while context-only tasks preserve the existing fired, deferred, replay-deduplicated, and successful-canonical-write reset behavior.
  - acceptance_id: dogfood-findings
    criterion: Before the executor releases the Run, docs/TICKET_RUNTIME_DOGFOOD.md documents the real bounded Plan, independent Validate, Run, and Evidence experience with every observed bug or UX friction, its evidence, and its disposition; acceptance-linked Evidence references that document without requiring the historical M5 parallel/join proof.
  - acceptance_id: installed-guidance
    criterion: Managed project instructions, setup guidance, MCP/manual routing, and release assertions consistently present Ticket as the primary development surface when a Ticket ledger exists, describe register_scope and self_report as optional coordination, and preserve query/ingest as Context Layer quality mechanisms rather than mandatory per-task ceremony.
  - acceptance_id: session-routing
    criterion: SessionStart deterministically emits Ticket-first guidance for Ticket-managed checkouts and context-first guidance for checkouts without a Ticket ledger; the Ticket path names planning or READY execution, compiled ContextBinding authority, gap-driven query, durable cross-Ticket ingest, acceptance-linked Evidence, independent closeout, and protected human Decisions without requiring conversation memory.
  - acceptance_id: verification
    criterion: Focused Core, CLI/MCP, skill-package, and release-assertion tests cover both repository modes and pass; the implementation adds no transcript parser, hidden semantic store, daemon, scheduler, or reduction in Context Layer canonical validation.
constraints:
  - Hooks continue to own lifecycle timing and mechanical evidence only; Skills own semantic query, capture, planning, execution, and closeout judgment.
  - Do not remove, bypass, or weaken canonical knowledge validation, provenance, placement, conflict, stale, or receipt semantics.
  - Preserve the current Installed, Connected, and Activated evidence contract; Ticket-based activation value is a separate governed product decision.
  - Do not require the historical M5 parallel-path, join, worktree-recovery, or full release dogfood proof for this bounded runtime pivot.
  - Do not change Git-native Ticket semantic authority or introduce a second lifecycle, transcript parser, daemon, generic scheduler, or semantic dual-write.
  - Preserve user-owned working-tree changes and the existing Installed and Connected activation proofs.
