schema_version: 1
kind: ticket
ticket_id: ticket-closeout-contract-decided
outcome: The repository has an accepted Git-native closeout contract that distinguishes attempted, partial, failed, successful, and deviated outcomes; binds accepted evidence to Ticket acceptance; and proposes follow-up semantic work without granting itself authority to mutate canonical knowledge.
context: "The M4 contract is settled by contract-ticket-closeout-001 as an Agent-owned technical decision. Executors append bounded Evidence against one exact Ticket revision, ContextBinding, Run generation, execution-start source, and acceptance ID; Evidence may cite only ordinary symlink-free worktree files or exact commits, rejects Git administration paths, and never self-certifies. A different verifier appends the Outcome and adjudicates every current acceptance. One exact Ticket subject, Run ID, and generation admits only one terminal Outcome: equivalent delivery is idempotent and a conflicting closeout fails closed. Only a valid successful current Outcome whose exact binding and bound Decision authority remain current derives completion. Later authority withdrawal preserves the raw Outcome trace but withdraws operational DONE and downstream READY. Partial, failed, stale, and deviated attempts remain visible and unlock nothing. Follow-up Ticket refs and semantic-closeout refs are durable proposals; canonical knowledge mutation remains governed by its own authority. All semantic facts are reconstructed from Git after disposable Run state is deleted."
acceptance:
  - acceptance_id: contract-settled
    criterion: contract-ticket-closeout-001 is active, machine-valid, and implemented without a manufactured human approval gate for objectively adjudicable Evidence and Outcome mechanics.
  - acceptance_id: evidence-adjudication
    criterion: Every current Ticket acceptance has an exact Evidence and adjudication rule; the verifier differs from the executor and cannot accept mismatched or executor-only assertions.
  - acceptance_id: semantic-closeout-boundary
    criterion: Closeout may reference follow-up Tickets and create, amend, stale, or supersede proposals while requiring the governing knowledge authority to perform any canonical mutation.
  - acceptance_id: terminal-forms
    criterion: Successful, partial, failed, stale, and deviated attempts remain durably distinguishable; one exact Ticket subject, Run ID, and generation can have only one terminal Outcome; and only complete accepted current Evidence plus a currently valid binding and bound Decision authority derives DONE and direct downstream readiness.
constraints:
  - Outcome, accepted Evidence references, deviations, blockers, and semantic closeout are Git-readable durable facts.
  - Leases, heartbeat, retries, and live progress may remain disposable operational facts.
  - DONE is not semantic authority.
  - Detailed traces cool into bounded retrievable history rather than normal execution context.
context_refs:
  - ref: META/09-ticket-runtime/specs/contract-ticket-closeout-001.yaml
    purpose: Defines the active Evidence, independent adjudication, Outcome, and semantic-closeout contract.
  - ref: META/09-ticket-runtime/specs/contract-ticket-context-binding-001.yaml
    purpose: Defines the exact packet and execution subject Evidence must bind.
  - ref: META/09-ticket-runtime/specs/decision-ticket-closeout-001.yaml
    purpose: Preserves the resolved historical question.
  - ref: META/09-ticket-runtime/specs/decision-ticket-graph-lifecycle-002.yaml
    purpose: Governs Git-native semantic lifecycle and optional document types.
  - ref: skills/_stdlib/lifecycle.md
    purpose: Defines canonical knowledge mutation authority outside Ticket completion.
relations:
  - type: depends_on
    target_ticket_id: ticket-context-binding-decided
    rationale: Evidence and Outcome can be adjudicated only after the exact governing Ticket, semantic facts, mapping, and repository source are defined.
provenance_refs:
  - META/09-ticket-runtime/spec.md
  - META/09-ticket-runtime/specs/contract-ticket-closeout-001.yaml
  - META/09-ticket-runtime/specs/contract-ticket-context-binding-001.yaml
  - META/09-ticket-runtime/specs/decision-ticket-closeout-001.yaml
  - conversation:2026-07-30-mr-ready-no-dogfood
