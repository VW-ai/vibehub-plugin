schema_version: 1
kind: ticket
ticket_id: ticket-execution-closeout-ready
outcome: A fresh Agent can select one currently eligible Ticket, receive its exact bounded context, execute against an exact worktree and Ticket revision, and leave Git-native Outcome and Evidence that either establishes accepted completion and direct downstream eligibility or preserves a visible unresolved deviation.
context: M2 now provides exact-source planning and independent semantic validation, and the reconciled Git lifecycle lets passing graph definitions enter the current graph while review or delegation gates execution. This Ticket is the stable M4 integration boundary. Implementation detail may be decomposed after the context-binding and closeout contracts are accepted, but the promised result is fixed. A small execution and closeout Skill should compose current Ticket reads, governed context retrieval, exact Run binding, evidence reporting, verification, and graph tending without becoming a generic scheduler. Claims, leases, heartbeat, retries, and live progress may be disposable; Ticket meaning, accepted completion, Evidence references, deviations, blockers, and follow-up work must survive deletion of that runtime state. The success and deviation paths are both required, but ordinary technical choices remain delegated.
acceptance:
  - acceptance_id: evidence-without-self-certification
    criterion: The executor can persist bounded artifacts and Evidence references, but only the accepted verifier or human authority defined by the closeout contract can satisfy acceptance and establish completion.
  - acceptance_id: exact-run-binding
    criterion: Every execution attempt binds repository and worktree identity, HEAD or dirty graph digest, Ticket ID and revision, context identity, and acting Agent; a branch switch or relevant Ticket edit stales or suspends it.
  - acceptance_id: fresh-agent-entry
    criterion: A fresh Agent with repository access and no planning conversation discovers an eligible Ticket and starts correctly from its Ticket document, direct prerequisites, accepted bindings, and compiled context packet.
  - acceptance_id: recovery-after-db-loss
    criterion: After deleting disposable Run state and rebuilding local indexes, the same Ticket graph, accepted completion, Outcome, Evidence, blocker, and downstream eligibility are reconstructed from Git.
  - acceptance_id: success-and-deviation
    criterion: Accepted current evidence makes only direct dependents with all prerequisites and gates satisfied eligible, while partial, failed, stale, or deviated work unlocks nothing and leaves an actionable blocker or follow-up path.
constraints:
  - Implement a small composable execution and closeout Skill, not a daemon, generic workflow engine, or global scheduler.
  - SQLite may coordinate live attempts but owns no durable Ticket semantics.
  - Do not introduce global cross-worktree locking or silently transfer a Run across branch or Ticket changes.
  - Do not infer readiness or completion from authored status fields or executor prose.
  - Protected product, architecture, principle, permission, side-effect, policy, or risk deviations stop the affected path while independent work may continue.
context_refs:
  - ref: META/09-ticket-runtime/specs/contract-ticket-planning-validation-skills-001.yaml
    purpose: Defines the implemented planning, independent-validation, and execution-authority boundary this execution Skill composes.
  - ref: META/09-ticket-runtime/specs/decision-ticket-closeout-001.yaml
    purpose: Names the Outcome, Evidence, and semantic-closeout decision this implementation must consume.
  - ref: META/09-ticket-runtime/specs/decision-ticket-context-binding-001.yaml
    purpose: Names the context-compilation decision this implementation must consume.
  - ref: META/09-ticket-runtime/specs/decision-ticket-graph-lifecycle-002.yaml
    purpose: Governs exact worktree Run binding and durable completion reconstruction.
  - ref: META/09-ticket-runtime/specs/decision-ticket-mvp-002.yaml
    purpose: Defines the first complete Git-native Skill-driven dogfood loop.
relations:
  - type: depends_on
    target_ticket_id: ticket-closeout-contract-decided
    rationale: The implementation cannot truthfully derive completion, deviation, Evidence acceptance, or follow-up work until the closeout contract is accepted.
provenance_refs:
  - META/09-ticket-runtime/artifacts/2026-07-29-ticket-git-native-skill-driven-pivot-plan.md
  - META/09-ticket-runtime/progress.yaml
  - META/09-ticket-runtime/specs/decision-ticket-mvp-002.yaml
