schema_version: 1
kind: ticket
ticket_id: ticket-git-review-intervention-ready
outcome: The accepted Ticket graph HTML supports attributed plan review, comments, simple edits, and protected decisions as exact-source Git-native changes while remaining a pure projection with no UI-owned or SQLite-owned Ticket lifecycle.
context: M1A already provides the complete read-only direct-unlock graph, deterministic layout, pan, zoom, fit, minimap, causal focus, and progressive Inspector. M2 now provides exact-source planning and independent semantic validation, and the reconciled Git lifecycle establishes that passing graph definitions enter the current graph while review or delegation gates execution rather than Ticket activation. M3 adds the minimum intervention semantics demonstrated by the dogfood need. Human input must become inspectable Git document changes routed through those same planning, validation, stale-source, and protected-authority boundaries as Agent-authored changes. The HTML must not regain the retired trusted-provider or cross-store application workflow, and it must not invent readiness, completion, or proof.
acceptance:
  - acceptance_id: disposable-runtime-proof
    criterion: A fresh process after deletion of the disposable database reconstructs every durable review comment, edit, and decision from Git, with no UI-only semantic state.
  - acceptance_id: git-native-interventions
    criterion: A reviewer can create an attributed comment, simple Ticket edit, plan decision, or protected-boundary decision whose durable representation is an inspectable exact-source Git change.
  - acceptance_id: projection-preserved
    criterion: Complete graph visibility, direct-unlock reading, deterministic layout, pan, zoom, fit, minimap, causal focus, and progressive inspection remain intact.
  - acceptance_id: stale-and-authority
    criterion: Source drift blocks advancement, and protected decisions require the exact human authority appropriate to their question rather than browser-authored identity or implicit delegation.
constraints:
  - HTML is a projection and intervention surface, never a source of truth or raw persistence editor.
  - Do not restore the retired trusted-provider, generation, SQLite authority, or mandatory proposal-to-receipt workflow.
  - Runtime state, selection, hover, and scenario lenses must not alter deterministic graph layout.
  - Healthy state remains quiet while blockers, decisions, deviations, stale context, Runs, and proof stay attached to their graph locus.
context_refs:
