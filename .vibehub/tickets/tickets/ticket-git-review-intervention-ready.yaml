  - ref: META/09-ticket-runtime/specs/contract-ticket-planning-validation-skills-001.yaml
    purpose: Defines the implemented exact-source planning, independent validation, and execution-authority gate this intervention surface must reuse.
  - ref: META/09-ticket-runtime/specs/decision-ticket-review-surface-001.yaml
    purpose: Governs the accepted graph experience and intervention boundary.
  - ref: packages/cli/assets/ticket-review-host
    purpose: Contains the deterministic graph projection and progressive intervention controls.
relations:
  - type: depends_on
    target_ticket_id: ticket-review-host-interventions-ready
    rationale: The integrated M3 foundation requires a secure browser surface and trusted embedding boundary that read back through canonical Git projection.
  - type: depends_on
    target_ticket_id: ticket-review-intelligence-handoff-ready
    rationale: The integrated M3 foundation requires review facts to feed Planning and Validation intelligence without bypassing it or trusting raw Decisions.
