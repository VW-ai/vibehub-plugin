  - ref: META/09-ticket-runtime/specs/decision-ticket-graph-lifecycle-002.yaml
    purpose: Requires comments, edits, and decisions to follow Git semantics.
  - ref: META/09-ticket-runtime/specs/decision-ticket-review-surface-001.yaml
    purpose: Governs the accepted graph experience and intervention boundary.
  - ref: packages/cli/assets/ticket-review-host
    purpose: Contains the current Git-native read-only graph projection.
