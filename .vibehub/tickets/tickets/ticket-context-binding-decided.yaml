schema_version: 1
kind: ticket
ticket_id: ticket-context-binding-decided
outcome: The repository has an accepted exact Feature Room and repository context-binding contract that lets a Ticket revision compile a bounded execution packet and fail closed on missing, stale, ambiguous, or oversized required context.
context: The M4 contract is settled by contract-ticket-context-binding-001 as an objectively adjudicable Agent-owned engineering decision. The v0 compiler binds the exact current Ticket revision and graph, accepted direct-prerequisite Outcomes, relevant current Decisions, repository/worktree/branch identity, execution-start code source, and every authored repository context reference. Files and directories compile deterministically into one bounded UTF-8 packet; missing, overlapping, symlinked, special, binary, changing, stale, or oversized context fails closed. Feature Room enters v0 through its checked-in Spec, mapping, and provenance files rather than a premature provider framework. Git preserves the binding manifest and packet digest; disposable Run state owns only live coordination.
acceptance:
  - acceptance_id: contract-settled
    criterion: contract-ticket-context-binding-001 is active, machine-valid, and implemented without a manufactured human approval gate for its objectively adjudicable technical choices.
  - acceptance_id: packet-boundary
    criterion: The contract and tests define deterministic packet contents and bounds, required facts, directory expansion, and fail-closed behavior for missing, stale, ambiguous, overlapping, conflicting, binary, symlinked, changing, or oversized context.
  - acceptance_id: semantic-linkage
    criterion: Every execution attempt and later Evidence binds the exact Ticket revision, graph, prerequisite Outcomes, relevant Decisions, Feature Room or repository facts, repository/worktree/branch source, ContextBinding, and packet digest the fresh Agent received.
constraints:
  - Feature Room is consumed first through exact checked-in semantic files; a generic provider framework is deferred.
  - Conversation memory and SQLite cannot satisfy a missing durable binding.
  - The contract preserves Git branch and worktree isolation and records the exact non-ledger execution-start source.
  - Ordinary implementation choices remain Agent-owned; only genuine product, principle, permission, side-effect, policy, or material-risk questions become protected blockers.
