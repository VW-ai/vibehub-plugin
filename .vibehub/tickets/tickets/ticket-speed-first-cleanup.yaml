schema_version: 1
kind: ticket
ticket_id: ticket-speed-first-cleanup
outcome: Installed VibeHub is a lightweight Skill-first Git-YAML plugin with no required CLI, MCP, SQLite/native runtime, per-turn hook pipeline, generic dispatcher, lease/ContextBinding/attestation stack, or writable local host, while explicit Context capture/query and one Ticket execution/closeout vertical slice still work after a clean install.
context: The repository owner explicitly authorized a deletion-first cleanup, accepts temporary breakage and mistaken deletion, and wants missing capabilities rebuilt only when real use exposes a gap. Use Git history and this branch as rollback; do not repair components scheduled for deletion. The current Core, CLI, MCP, tests, packaging, hooks, and runtime ceremony are mostly deletion targets rather than migration parity requirements. Keep only Skill-owned workflows and small YAML/graph helpers. Context quality means schema-valid direct YAML, stable IDs, readable current source/evidence, no obvious dangling relations or lifecycle references, and an explicit capture/query roundtrip that survives a fresh process or reclone. The Ticket minimum is explicit entry, direct Ticket YAML, graph validation, Agent execution, acceptance-linked evidence/closeout, and direct dependent unlock. Human review and decisions default to Agent conversation and GitHub branch/PR/comments; any retained local projection is read-only. Obsolete pre-pivot Ticket definitions and artifacts may be deleted. Existing dirty ticket-first runtime changes are completed prior work and must be captured as a cheap rollback baseline before the hard cut, not laboriously migrated.
acceptance:
  - acceptance_id: baseline-checkpoint
    criterion: The completed ticket-first runtime pivot worktree is captured in Git before hard deletions, providing a cheap exact rollback point.
  - acceptance_id: context-minimum-works
    criterion: In a clean temporary repository, explicit capture writes schema-valid stable-ID Context YAML with readable source/evidence; a fresh process or reclone can query it; malformed YAML and obvious dangling references fail visibly.
  - acceptance_id: footprint-and-gap-report
    criterion: Closeout reports before-and-after production files, production dependencies, and packaged bytes plus gaps encountered during implementation; only observed gaps are rebuilt and no parity checklist is required.
  - acceptance_id: legacy-runtime-absent
    criterion: The repository, installed artifact, manifests, and lockfile contain no required CLI package or bin, MCP server or host config, better-sqlite3/native runtime, runtime launcher, per-turn hook/cadence pipeline, generic operation dispatcher, Run lease/heartbeat/generation machinery, ContextBinding compiler/artifacts, local Decision attestation/trust store, or writable loopback host.
  - acceptance_id: plugin-clean-install
    criterion: Claude and Codex plugin installation exposes the Skills and succeeds without a global vibehub executable, MCP configuration, database initialization, native build, daemon, hook process, or writable local server.
  - acceptance_id: ticket-vertical-slice-works
    criterion: In a clean temporary repository, explicit Ticket entry creates and reads a YAML graph, validation catches missing endpoints and dependency cycles, an Agent records acceptance-linked evidence and closeout, and successful closeout unlocks a direct dependent while non-success does not.
constraints:
  - Optimize for speed and code deletion; temporary broken intermediate commits are acceptable.
  - Do not build a retirement lifecycle, generic migration or archival framework, compatibility layer, dual-write path, or new coordination service.
  - Do not repair code scheduled for deletion except when necessary to extract indispensable data.
  - Preserve the minimum Context quality invariants, not the old runtime internals or complete artifact history.
  - Preserve unrelated user changes and create the rollback baseline before destructive implementation.
