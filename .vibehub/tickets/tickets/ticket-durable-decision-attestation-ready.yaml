    purpose: Defines the required cross-process authority, trust-root, binding, and fail-closed contract.
  - ref: META/09-ticket-runtime/specs/contract-ticket-git-review-interventions-001.yaml
    purpose: Defines the M3 same-session boundary this Ticket must extend without weakening.
  - ref: packages/cli/src/ticket-review-host.ts
    purpose: Contains the installed launcher and trusted embedding seam that must become a real Plugin-owned human entrypoint.
  - ref: packages/core/src/ticket-decision-attestation.ts
    purpose: Contains the current private process-local registry and exact binding model to preserve or supersede.
  - ref: skills/vibehub-ticket-plan/SKILL.md
    purpose: Defines how a fresh planner consumes authority receipts and preserves unverified boundaries.
