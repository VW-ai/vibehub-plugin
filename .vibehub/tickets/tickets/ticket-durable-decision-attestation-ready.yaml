schema_version: 1
kind: ticket
ticket_id: ticket-durable-decision-attestation-ready
outcome: The installed Plugin can record one explicit human Decision whose exact authority any fresh authorized process can verify across restart without trusting repository-editable YAML, SQLite, browser state, OS username, Git author, or prior process memory.
context: "M3 deliberately stops at a fail-closed same-dispatcher attestation: raw Decision YAML preserves intent and evidence, while the trusted session registry can temporarily promote only the exact document it wrote and re-read. The production vibehub ticket review launcher supplies neither a trusted human principal nor durable authority, and each Skill invocation starts a fresh dispatcher that correctly sees current_unverified. Implement the smallest local Plugin-owned attestation mechanism that closes this boundary. It must provide a real installed human action, bind the full canonical Decision and its exact repository incarnation, worktree, branch or detached commit, graph or Ticket subject, protected boundary, selection or delegated scope, principal, and validity window, and let a fresh process verify that evidence independently. The technical mechanism may be chosen against objective security and portability criteria; this Ticket does not preselect a keychain, signature format, helper process, or IPC design."
acceptance:
  - acceptance_id: bounded-local-mechanism
    criterion: The implementation remains a narrow Decision-attestation boundary rather than a generic workflow engine, remote identity platform, SQLite semantic authority, or mandatory review lifecycle, and includes adversarial integration tests through the installed entrypoint and fresh process.
  - acceptance_id: exact-complete-binding
    criterion: Verification binds the complete canonical Decision digest, decision ID and path, principal, authority basis, repository incarnation, worktree identity, branch or detached commit, graph digest or Ticket revision, boundary, selection or delegated scope, and validity state.
  - acceptance_id: failure-and-recovery-matrix
    criterion: Restart, tampering, replay into another repository, worktree, branch, commit, subject, boundary, principal or scope, expiry, and revocation fail closed; recovery requires a new explicit human action and leaves prior evidence inspectable.
  - acceptance_id: fresh-process-verification
    criterion: After the trusted UI host and writer process exit, a newly started Plugin or Skill process independently verifies the exact attested Decision and projects it as authority only for its bound current subject and scope.
  - acceptance_id: installed-human-entrypoint
    criterion: The shipped Plugin exposes a real explicit human review or protected-decision action that supplies a named principal and produces the attestation; constructor injection available only to tests or embedders does not satisfy this criterion.
  - acceptance_id: untrusted-writer-cannot-mint
    criterion: A process that can freely edit the repository, Ticket YAML, Decision YAML, SQLite database, Git author metadata, browser request, or local bearer cannot mint or widen accepted human authority without the Plugin trust root.
constraints:
  - The trust root and authority proof must not be writable solely through the governed repository or disposable database.
  - Git remains the durable collaboration and evidence substrate, but editable Git bytes alone cannot authenticate the human principal.
  - The loopback bearer grants local host access only and cannot become Decision authority.
  - Preserve branch and worktree semantic isolation and fail closed on detached or ambiguous source identity.
  - Do not weaken exact-subject currentness, independent Ticket validation, or the distinction between Decision intent and authority.
  - Prefer the smallest local, inspectable mechanism that satisfies the acceptance criteria; avoid premature remote identity or multi-user infrastructure.
context_refs:
