schema_version: 1
kind: ticket
ticket_id: ticket-runtime-loop-proven
outcome: One authorized real Plugin feature has completed through the Git-native Ticket loop from planning and review or delegation through execution, verification, Outcome, Evidence, follow-up closeout, and clean recovery without any retired Ticket semantic authority.
context: This is the post-merge M5 real-project composition proof. It begins only after ticket-runtime-mr-ready establishes the shipped runtime and after the repository owner authorizes one bounded Plugin feature. Planning then refines the target into its smallest truthful Ticket paths. The proof uses the released Git ledger, Skills, deterministic operations, graph HTML, and disposable coordination to validate natural parallel paths, a real join, worktree isolation, recovery, deviation handling, and continued clean-cut integrity. It is intentionally not a prerequisite for the Ticket Runtime MR.
acceptance:
  - acceptance_id: clean-cut-proof
    criterion: Repository search, typechecking, package tests, packaged-file inspection, and graph-HTML verification find no retired Ticket table, trigger, generation, latest pointer, semantic SQLite service, trusted provider, cross-store fence, operation, adapter, export, fixture, compatibility shim, or active documentation path.
  - acceptance_id: composition-proof
    criterion: The dogfood graph exercises at least two genuinely independent work paths and a real join; no false serialization or fabricated parallelism is introduced.
  - acceptance_id: deviation-path
    criterion: Focused integration evidence proves that a protected deviation remains unresolved and visible, routes the required decision or follow-up work, and cannot falsely complete or unlock its affected path.
  - acceptance_id: mr-baseline-preserved
    criterion: The post-merge dogfood starts from the reviewed installed runtime; any required correction is made explicitly and re-verifies the affected MR gate before the real-loop proof may succeed.
  - acceptance_id: real-loop
    criterion: The authorized feature is planned, machine-validated, reviewed or explicitly delegated, executed through truthful dependency paths, independently verified, and closed with Git-readable Outcome and accepted Evidence.
  - acceptance_id: recovery-proof
    criterion: Deleting the disposable database and rebuilding local indexes preserves the same semantic graph, accepted completion, Evidence, decisions, and downstream eligibility.
  - acceptance_id: worktree-proof
    criterion: Two worktrees at different sources remain semantically isolated, and a branch switch or relevant Ticket edit makes the bound execution stale or suspended rather than transferring it.
constraints:
  - The full proof uses no retired proposal, validation, authority, application, generation, or SQLite semantic backend.
  - Git remains the sole durable Ticket semantic authority; SQLite remains disposable live coordination, indexing, and cache.
  - No migration, dual-write, generic workflow engine, global scheduler, hidden auto-merge, force-push, or branch deletion is introduced.
  - Historical dated META artifacts may remain only as explicit provenance, not active architecture.
context_refs:
  - ref: META/09-ticket-runtime/artifacts/2026-07-29-ticket-git-native-skill-driven-pivot-plan.md
    purpose: Defines the original real-loop, recovery, worktree, and legacy-audit proof.
  - ref: META/09-ticket-runtime/progress.yaml
    purpose: Records this real feature proof as post-merge M5.
  - ref: META/09-ticket-runtime/specs/decision-ticket-mr-ready-boundary-001.yaml
    purpose: Requires the released MR-ready runtime before real dogfood begins.
  - ref: META/09-ticket-runtime/specs/decision-ticket-mvp-002.yaml
    purpose: Preserves the original complete real dogfood promise.
  - ref: META/09-ticket-runtime/specs/decision-ticket-review-surface-001.yaml
    purpose: Requires the graph HTML to continue satisfying the human review use case.
relations:
