schema_version: 1
kind: ticket
ticket_id: ticket-review-facts-projected
outcome: Current and historical ReviewContribution and Decision facts are reconstructed from Git and projected at their exact graph, Ticket, or relation locus without changing graph topology or layout.
context: Project durable review documents mechanically into subject-local trace and attention data. Comments and edit proposals show attribution, body or bounded field diff, source binding, record path, and current versus historical status. A raw current Decision always projects as an artifact with a typed repository-path reference and current_unverified authority state. It becomes gate_decision only when the same trusted dispatcher supplies an unexpired authority receipt bound to the exact complete Decision document, repository incarnation, worktree, branch or detached commit, subject, session, and digest. Restart, tampering, source mismatch, branch or worktree mismatch, and expiry retreat to unverified. Relation subjects bind stable semantic facts rather than a source token that includes their own trace. Page trace reads honestly and keep graphDigest and layout inputs independent of review facts.
acceptance:
  - acceptance_id: authority-trace-boundary
    criterion: Claimed contributions and raw Decision YAML never project as gate authority; only an exact current same-session authority receipt may promote the matching Decision to gate_decision, and restart or mismatch fails closed to current_unverified.
  - acceptance_id: decision-detail-trace
    criterion: Decision projection preserves a typed durable record path and the structured plan disposition, delegated boundaries, protected boundary, selection, and resolution references needed to verify the complete document without deriving authority from display text.
  - acceptance_id: layout-invariance
    criterion: Adding, selecting, filtering, attesting, expiring, or staling review facts changes no Ticket coordinates, direct unlock relations, pan, zoom, fit, minimap geometry, or causal-cone layout.
  - acceptance_id: stable-relation-binding
    criterion: A persisted relation review remains verifiable without self-referencing the full inventory source token and becomes historical when its endpoints, dependent Ticket revision, or direct relation meaning changes.
  - acceptance_id: subject-local-trace
    criterion: Ticket, relation, and graph inspection reconstructs matching comment, edit proposal, plan review, and protected Decision facts from Git with exact record references, attribution, authority state, and current or historical status.
constraints:
  - Projection is derived read state and owns no mutable review lifecycle.
  - Do not infer Ticket readiness, completion, accepted Evidence, or downstream eligibility in M3.
  - Healthy graphs remain quiet; comments, decisions, stale bindings, conflicts, and unverified authority appear only at their subject locus.
  - Never promote a Decision from repository bytes alone.
context_refs:
  - ref: packages/core/src/contract/ticket-review-schemas.ts
    purpose: Contains the browser-safe structured trace schemas and authority-receipt requirements.
  - ref: packages/core/src/ticket-decision-attestation.ts
    purpose: Defines the exact process-local receipt binding used only by trusted dispatcher sessions.
  - ref: packages/core/src/ticket-ledger/projection.ts
    purpose: Projects the Git definition graph and attaches bounded review traces without changing topology.
  - ref: packages/core/src/ticket-review-projector.ts
    purpose: Defines current trace binding, raw Decision retreat, and projection rules.
relations:
  - type: depends_on
    target_ticket_id: ticket-review-ledger-kernel-ready
    rationale: Projection requires strict durable ReviewContribution and Decision facts, stable identities and digests, plus the explicit distinction between raw evidence and session authority.
provenance_refs:
  - META/09-ticket-runtime/artifacts/2026-07-30-ticket-m3-git-review-intervention.md
  - META/09-ticket-runtime/specs/contract-ticket-git-review-interventions-001.yaml
  - META/09-ticket-runtime/specs/decision-ticket-review-surface-001.yaml
  - ticket-git-review-intervention-ready
