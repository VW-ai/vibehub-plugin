  "context": "Rolling-wave planning per decision-draft-ticket-maturity: a big project planned on day one keeps its whole road in the graph — firm tickets up front, a human-input blocker in the middle, a chain of drafts behind it whose direction is known but whose acceptance cannot honestly be written yet. The mechanism is small and rides existing patterns: an optional maturity field with the single value draft (absence means firm, every existing ticket stays valid); ticketStatus yields REFINE for a draft whose dependencies are all satisfied and the frontier excludes drafts unconditionally, so an under-defined ticket cannot be picked up by execution; refinement re-enters ticket-plan, which rewrites acceptance for real and removes the marker in place on the same ticket_id so Git history keeps the sketch-to-firm evolution — encoded as a lifecycle event owned by ticket-plan following the execution-discovers-work single-sourcing pattern the ownership test enforces. Draft is orthogonal to human authority (badge: a human decides here; draft: everything behind is a sketch). Workbench visual treatment is out of scope here — it joins the rooms-surface design proposal behind its owner-approval gate; this ticket only makes the projection expose the state honestly.",
