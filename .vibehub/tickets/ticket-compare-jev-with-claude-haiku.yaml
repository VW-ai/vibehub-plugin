  "constraints": [
    "Reuse the successful JEV run b6854e64-6104-4ee3-8cb2-84a054c84a44 rather than issuing another JEV benchmark solely for comparison.",
    "Send only the already sanitized checked-in Peel fixture through Vercel AI Gateway; do not send provenance ledgers, labels, curation notes, raw trajectories, local identifiers, or credentials.",
    "Do not read, print, log, or commit AI_GATEWAY_API_KEY. Load it only through the ignored semantic-runtime/.env.local file.",
    "Keep both adapters behind the same SemanticJudge contract. Model-specific prompting, structured output parsing, routing metadata, and retry handling stay outside semantic core.",
    "Treat model-reported probabilities as uncalibrated and compare downstream decisions and labeled metrics rather than claiming raw confidence equivalence.",
    "A single 20-event comparison is regression evidence, not a productization gate or a permanent model-routing decision."
  ],
  "context": "The first live JEV benchmark completed with 20 events and 80 decisions but exposed asymmetric behavior: acceptance precision was high, Context target precision was weak, schedulable-work recall was low, and durable-value abstained on every event. This follow-up adds Claude Haiku 4.5 as a second provider-independent SemanticJudge and performs an apples-to-apples comparison. The existing successful JEV audit is reused instead of spending JEV rate-limit capacity again. Live Haiku requests use the same previously authorized sanitized fixture and local Gateway credential.",
