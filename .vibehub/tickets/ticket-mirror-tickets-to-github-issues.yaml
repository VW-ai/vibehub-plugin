      "acceptance_id": "projection-script-is-deterministic-and-idempotent",
      "criterion": "A checked-in Node script (no new runtime dependencies beyond gh and node) reads .vibehub/tickets, outcomes, evidence, and the shared ticket graph projection, and computes for every Ticket an Issue title, body, labels, open/closed state, and the set of Evidence comments. Running it twice against the same repository state performs zero GitHub writes on the second run, proven by a fixture-based test that asserts the computed plan is empty when the remote already matches."
