  "context": "Tickets, Evidence, and Outcomes already live as Git-native documents under .vibehub/. The owner wants collaborators on GitHub to see the same Ticket graph natively in Issues so the project reads as coordinated, without adding any operational load to Agents. The governing rule is that Git remains the single source of truth and GitHub Issues are a read-only projection of it: Issue comments by humans are discussion and are never pulled back; durable decisions still enter through vibehub-ingest. Mapping lives in the Issue body as a hidden marker <!-- vibehub:ticket-id=<id> --> so no new Ticket field and no CI write-back commit is needed; each Evidence record is posted as one comment keyed by a hidden <!-- vibehub:evidence-id=<id> --> marker so reruns are idempotent. The Ticket state shown on the Issue comes from the same next-action projection the CLI and Workbench use (vh.mjs ticket graph). The repository already has GitHub Actions (verify.yml, release.yml) and gh auth, and currently holds 86 Tickets, most DONE, so the first live run will create many closed Issues; a dry-run mode must exist and be exercised before the first live run. This direction is compatible with decision-external-work-systems-compose-into-personal-tickets: that decision forbids treating an external system as the organizer of personal Tickets; here GitHub is a display surface for VibeHub truth, not an authority.",
