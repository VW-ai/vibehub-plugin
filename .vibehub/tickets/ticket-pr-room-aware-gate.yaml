  "context": "vibehub-pr's preparation step runs only document-level validation, which never looks at drift — so a branch could ship drifted or unstamped rooms and export staleness to the whole team, exactly what align-on-use exists to prevent. The gate is the last stop of 谁用谁修: at PR preparation, room drift must show every room this branch entered as FRESH; drift:-prefixed stale marks on unentered rooms are honest recorded debt and may ship; an unexplained DRIFTED room blocks the handoff until aligned or honestly marked. The summary also predates Rooms: reviewers should see contract and shared-reference diffs first because their blast radius exceeds skill prose (ownership tests and pointer networks hang off them), followed by the rooms entered with their knowledge changes — all mechanically derivable from alignment stamps and context placement paths. Both changes are a few judgment-first lines in the existing skill; no new commands, no new mechanics.",
