      "criterion": "Validate typed semantic role, applicable Project/exploration/Ticket/code version, exact sources and rationale alongside lifecycle state; incomplete applicability is explicitly uncertain. Shared governing claims remain visible unless superseded/retracted through the authorized domain path, not because someone hid a card.",
