      "criterion": "The design gives one explicit Ticket definition and an executable granularity decision procedure based on independently observable outcome, scheduling/parallelism, retry and rollback boundary, authority, transaction or consistency boundary, verification cost, reviewer cognitive load, and lifecycle overhead; it includes split, keep-together, merge-back and draft/refine rules plus representative examples whose recommended decomposition can be independently checked.",
