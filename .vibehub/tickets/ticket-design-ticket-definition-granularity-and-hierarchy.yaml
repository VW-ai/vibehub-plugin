  "active_contract_revision": 1,
  "constraints": [
    "This is a design and prompt-contract Ticket. Do not change canonical Goal, Epic or Ticket schemas, lifecycle behavior, dashboard hierarchy, or Skill execution semantics before owner selection.",
    "Do not create child implementation Tickets until the proposal establishes what a child Ticket means and whether canonical parent/child containment should exist.",
    "Preserve the current strong reviewability of Contract, Evidence and Outcome; reduce ceremony by choosing a larger truthful work unit rather than weakening provenance.",
    "Do not treat a fixed wall-clock interval, number of commits, test count, Evidence volume or Agent activity as proof of progress. Calibration must compare material outcome movement with cost and risk.",
    "Do not introduce parent/child Ticket relationships merely to make a dense graph visually manageable; presentation clusters and execution/ownership semantics must remain distinct.",
    "Reuse draft maturity and REFINE for honestly underdefined downstream work instead of fabricating precise child acceptance early."
  ],
  "context": "VibeHub's Ticket procedure is explicit and produces unusually reviewable execution history, but the unit it governs is not explicit enough. The Semantic Runtime refactor exposed the failure mode: capability work was decomposed into many file-level Tickets, so planning, validation, Evidence, Outcome and reporting overhead dominated the actual refactor and made the graph harder for a person to review. At the same time, current sources disagree about hierarchy: the Ticket schema exposes only depends_on, product prose describes Goal → Epic → Ticket containment and points to a missing planning-hierarchy contract, the dashboard can project task_of/sub_goal_of from a personal store, and the accepted product decision treats Task hierarchy as a topology-derived view unless durable containment operations are demonstrated. This Ticket produces the design that reconciles those layers. It does not preselect parent/child Tickets or implement a schema. It also designs a mandatory prompt-level calibration loop so long-running Agents periodically prove material outcome progress and replan when ceremony, local correctness, or elapsed work is no longer proportional to the intended result.",
