      "acceptance_id": "goal-epic-hierarchy-choice-is-decision-ready",
      "criterion": "The design distinguishes benefit, capability containment, executable work, causal dependency and visual grouping; compares at minimum Goal/Epic ownership with dependency-only Tickets, topology-derived clusters, canonical parent/child Tickets, and a constrained hybrid; names the durable operations that would justify containment; explains schema, migration, review UI and progress-rollup effects; and recommends one coherent model while explicitly reconciling or proposing revision of the current no-parent-child product decision.",
      "identity": "sha256:b1bf8c6cc55b53caa648485393ab3036a69bf4228c7101d9e1fb9ddf62719422",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "direction-calibration-prompt-is-testable",
      "criterion": "The design includes concrete Ticket Plan and Ticket Run prompt text plus validator checks that require an initial outcome hypothesis, material-progress signals, a ceremony budget, risk- and size-aware checkpoint timing, and a stop/replan path when progress is not proportional. The 60–90 minute visible-result checkpoint is evaluated as a default starting rule rather than a universal elapsed-time success metric, and fixtures cover wrong-direction momentum, repeated verification, blocked work, legitimate long-running validation, research, refactor and user-authority boundaries.",
      "identity": "sha256:d941e66fa74203366a2e1adb0fe7d6d14ddc25f9aa50094d3e936cbb105339b4",
