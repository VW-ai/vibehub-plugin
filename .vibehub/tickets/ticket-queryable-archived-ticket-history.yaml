      "acceptance_id": "archive-and-delivery-membership-are-canonical",
      "criterion": "Ticket schema v1 gains one optional deliveries array and no new document kind. A pull_request entry is exactly {kind: pull_request, ref: canonical https://github.com/<owner>/<repo>/pull/<number>, state: proposed|delivered|abandoned, delivered_at?, delivered_commit?, reverted_by?}; a cherry_pick entry is exactly {kind: cherry_pick, ref: commit:<40-hex>, state: delivered, delivered_at, delivered_commit, reverted_by?}. For pull_request, delivered_at and delivered_commit are required only for delivered and forbidden for proposed/abandoned; reverted_by is allowed only on a delivered entry. delivered_commit is 40-hex, reverted_by is commit:<40-hex>, and ref is unique per Ticket. Archive is a derived boolean orthogonal to operational status: true only when the Ticket has a successful Outcome and at least one explicit delivered entry. Omitted deliveries means [] and current, the sole backward-compatibility strategy; no migration, inference, move, or deletion occurs."
    },
    {
      "acceptance_id": "history-edge-cases-stay-truthful",
      "criterion": "A checked-in state-table test proves: successful Outcome plus no delivery or only proposed/abandoned pull_request entries is current; partial/failed/deviated Outcome is current regardless of delivery; successful plus any delivered pull_request or cherry_pick is archived; multiple entries preserve all memberships and any delivered entry archives; reverted_by preserves the historical archived delivery and a fix/reopen is represented by a new current Ticket whose provenance_refs contains `reopens:<old-ticket-id>`, never by deleting its Outcome or unarchiving it. Closing an unmerged PR changes its explicit entry from proposed to abandoned; no external PR state is inferred."
    },
    {
      "acceptance_id": "one-query-model-serves-cli-json-and-web",
      "criterion": "One exported query projection serves `vh ticket graph --scope <current|all> [--delivery <canonical-ref>] [--room <room-slug>]...` and the Workbench. Scope defaults to current; delivery accepts either the canonical pull_request URL or commit:<40-hex>; repeated Rooms form a union of each selected Room subtree based on canonical context_refs; scope, exact delivery-ref membership, and Room union compose by intersection. Tickets sort by ticket_id, relations by prerequisite then dependent id, and an ordinary relation is included only when both endpoints are visible; the existing JSON success/error envelope is the only CLI output contract. Unknown scope, malformed delivery ref, or unknown Room returns invalid_argument and Web shows that error without broadening."
    },
    {
      "acceptance_id": "filtered-graphs-preserve-causal-truth",
      "criterion": "The current-work graph suppresses unrelated archived history but never falsifies dependency state: every archived Ticket directly adjacent to a visible current Ticket remains as a subdued card carrying the textual ARCHIVED label; each deeper hidden direction is one keyboard-focusable relation stub labelled with hidden Ticket count and direction. Activating a stub adds exactly the next archived hop, records the newly revealed Ticket ids explicitly, and preserves every already-visible card's x/y coordinates; repeated activation progresses one hop, while all-history removes stubs and restores the complete canonical graph."
    },
