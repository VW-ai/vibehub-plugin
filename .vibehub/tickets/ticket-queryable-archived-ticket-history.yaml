  "context": "Scheduled inside the owner's single concentrated Web Workbench upgrade PR. The repository keeps completed Tickets indefinitely, while vh ticket graph and the Workbench currently project the whole lifetime set. A browser-only hide-DONE toggle would lose the core requirement and make consumers disagree, so this Ticket owns the smallest canonical Git-native carrier: an optional typed deliveries array on Ticket, while archive remains a derived view over successful Outcome plus an explicit delivered entry. Proposed PR membership is recorded on the feature branch; delivered is written only after the authoritative external merge or cherry-pick has happened and is cited by its exact commit, so this PR can dogfood pending membership but cannot claim itself archived before merge. Reopen/fix work is a new Ticket, revert annotations preserve historical delivery, and omitted deliveries are the single legacy default. The shared query projection uses current/all scope intersected with exact delivery membership and a union of selected Room subtrees, consumed identically by CLI JSON and Web. The interaction contract chooses progressive causal context: nearest archived one-hop boundaries are subdued cards with textual ARCHIVED labels; deeper ancestry is a labelled stub revealing one hop per activation without moving existing cards; all-history restores the complete graph.",
