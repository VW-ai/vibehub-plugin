  "context": "Future direction captured by intent-queryable-ticket-history-by-pr-and-room. The repository currently keeps completed Tickets indefinitely, but both vh ticket graph and the Workbench project the whole set. Ticket, Evidence, and Outcome schemas have no first-class archive or delivery-PR membership, so a browser-only hide-DONE toggle would lose the owner's core requirement and make other consumers disagree. When this work is scheduled, define the smallest Git-native carrier and deterministic projection that can distinguish current from archived history, associate the Tickets delivered by a PR, and compose all/per-PR/per-Room queries across CLI/JSON and Web UI. The owner has suggested one interaction direction for preserving causal context without restoring the whole lifetime graph: render the closest archived one-hop Tickets as subdued or translucent cards, leave deeper archived ancestry as expandable relation stubs, and reveal another hop when the user activates a stub. Treat that as an input to evaluate, not settled acceptance. This remains draft because the desired capability is clear but schema placement, lifecycle edge cases, and detailed filtered-graph interaction are not yet honest enough for implementation acceptance.",
