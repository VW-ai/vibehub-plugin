 "context": "ticket-mirror-tickets-to-github-issues established that Git is the source of truth and GitHub Issues are a read-only projection keyed by a hidden vibehub:ticket-id marker, and decision-github-issues-are-a-read-only-ticket-projection records that an outside Issue becomes a Ticket only through deliberate planning that cites the Issue URL as a context ref. The engine has never permitted that: loadRepository requires every context_refs entry to resolve to a regular file inside the repository, so an http URL is rejected and no checked-in Ticket uses one. The recorded rule and the implementation have therefore contradicted each other since the rule was written, and the first hand-run intake attempt hit it immediately — a batch of six Tickets citing Issue URLs as context refs was rejected outright and the URLs had to move to provenance_refs. Beyond that, five Issues filed by hand on 2026-09-01 carried an invented convention: Ticket-shaped bodies deliberately without the mirror's marker, plus a hand-written note that they are proposals rather than projections. Nothing defines that convention, nothing distinguishes inbound from mirrored Issues to a reader or to the sync script, and nothing says what becomes of an inbound Issue once its Ticket exists and starts producing a mirrored Issue of its own. The rule itself is no longer open: the owner chose close-and-point over leaving inbound Issues open or retrofitting the mirror's marker onto them, and asked that the handling live inside VibeHub rather than being improvised each time an outside Issue arrives. That decision is recorded as decision-inbound-issue-closes-into-its-mirror; what remains for this Ticket is implementing it and resolving the ref contradiction it runs into.",
