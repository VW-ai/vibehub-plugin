 "context": "npx-first was already chosen and implemented: ticket-decide-npx-first-install-experience recorded path A, a self-contained vibehub-core skill folder making skills.sh supported, and docs/INSTALL.md names npx skills add VW-ai/vibehub-plugin as the recommended path with marketplaces listed after it. The marketplace path was kept alongside and rotted. It delivers the entire development repository twice — measured at 30M for the marketplace clone including 14M of git history, plus 17M for the plugin cache, 47M of the 54M total under ~/.claude/plugins — against the 544K of skills/ that npx installs. No install-time filtering exists in the marketplace mechanism, so repairing it required publishing a generated marketplace from a dedicated repository, with a new publication pipeline, a bound on that repository's history growth, and a migration for existing users: a large permanent surface for a path the documentation does not recommend. The owner chose retirement. The cost is known before execution and is not small: eleven SKILL.md files carry a partial-install fallback line naming the host marketplace; verify-release-version.mjs derives two of its five agreeing version declarations from .claude-plugin/marketplace.json; scripts/build-claude-marketplace.mjs, scripts/build-codex-marketplace.mjs, test/host-marketplaces.test.mjs, and parts of test/release.test.mjs exist only for this path; README.md line 19 and docs/INSTALL.md both advertise it; and the Codex marketplace entry goes with the Claude one, which is acceptable only because npx skills add installs into .agents/skills/ as well as .claude/skills/. Anyone currently installed through a marketplace — including the owner — must move to npx, and for them this is an improvement rather than a regression, since a 47M install becomes a 544K one. The acceptance was trimmed from eight criteria to six before execution, deliberately. The independence-gate Ticket that preceded this one carried three meta-criteria of the form 'a test asserts that…', and each fix produced a new artifact that could itself be wrong, so four adjudication rounds went almost entirely to guard quality rather than to the feature. Here the doc-and-Skill criteria are merged behind one mechanical check, and the two proof criteria are merged into one that requires performing the install and the migration rather than describing them.",
