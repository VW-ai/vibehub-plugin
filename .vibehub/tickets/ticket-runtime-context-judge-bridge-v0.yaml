  "active_contract_revision": 1,
  "constraints": [
    "Implement only inside semantic-runtime/ through actual capabilities. No new dependency, persistent namespace/table, model adapter, generic registry/callback, index/cache framework, dispatch journal, full Policy executor, Query/FTS/ranker, Compiler, App/HTTP/cloud/Worker/plugin wiring, automatic capture/ACK/source refresh, Git mutation or canonical write. Construction is inert and performs no enrollment, activation, key lookup, source read or network call. Synthetic fixture setup may explicitly create its own selected sources, typed revisions and adoption through existing public APIs.",
    "Keep LocalJudgeRuntime constructor exact {store,authority,provider_settings,canonical_reader,configuration}; configuration remains exact {schema_version:1,scope,settings_project_id,artifact,egress_policy}. Validate/freeze the real compilePolicyArtifact output and known installed descriptors; an artifact may contain the existing descriptor, the new descriptor or both, and each chosen method must require its exact corresponding node descriptor. Reject unknown/spoofed descriptor or family before credentials/send. No public input-profile selector, arbitrary mapper, ready-made prepared proof or caller target text is added.",
    "Add LocalJudgeRuntime.evaluateContext(context,request,{signal}={}); request is the unchanged existing JudgeRequest shape {invocation_id,node_id,epoch,execution,exploration_id,execution_workspace_id,expected_binding_version,expected_catalog_version,expected_project_selection_version,at,event_id,target_refs,expected_source_fence}. at is GraphCommitAddress2 and target_refs are zero to eight unique sorted exact same-scope/same-generation entity revision refs. No local/current selector is inferred: a new evaluation requires at equal the owned current head. Existing evaluate retains its previous at-most32 judge-target profile and all four families. Both methods retain bounded decision/deferred/cancelled/refused result semantics; a profile mismatch cannot be routed automatically to the other method.",
    "Export CONTEXT_JUDGE_NODE_OPERATION with id semantic-context-judge, version1, type judge, inputs {event:event_ref,selection:signal_ref}, outputs {relevant:boolean,confidence:number,targets:candidates_ref,decision:signal_ref}, error_outputs {error:error_ref}, exclusive positive/negative/uncertain branches. Config has the existing exact required fields family,question_id,question_version,question_text,confidence_threshold,impact, but family enum contains only context_relevance. Compute its own fixed implementation identity through existing descriptor fingerprint conventions; do not change JUDGE_NODE_OPERATION identity or any legacy Core v1 protocol. The existing boolean-targets DecisionSchema remains unchanged.",
    "Export executeContextJudgeNode({runtime,context,request,inputs,signal,deadline_ms}) with the existing typed handler-style outputs/branch/error and flat reserved usage. inputs exactly {event,selection}; event is the actual admitted event_ref, selection is a signal_ref whose digest binds the fixed runtime-context-v1 profile tag plus normalized request. Check before send. Its deadline may only tighten the same-process runtime deadline. Existing executeJudgeNode and its legacy request-only selection signal stay unchanged. Neither bridge accepts actions/Graph assertions/callbacks, and executePolicyRun continues rejecting Judge and Worker nodes.",
    "Require current opaque LOCAL_AUDIENCE human/service grants for context:read plus all existing Judge actions: judge:execute, model:dispatch, source:read, store:read/write, ingress:read, graph:read, exploration:read, source:invalidation:read, project:inspect and activation:admit. Resolve actor/tenant/Project from the grant and retain trusted scope-to-settings_project_id binding. Source ACL or author labels in JSON never substitute for actual admission. Local Context read authorization alone cannot authorize a provider send.",
    "Eligible target is an actual typed entity selected by LocalContextStore current mode at the request pin, exact projection head, no competitors/quarantine, immutable assertion and projection status candidate|validated|resolved. Use validateContextContent1, current ContextInputs applicability proofs and verified exploration publication; do not fabricate judge-target revisions, alter existing Context content/status, infer current identity from source folders or silently follow another generation. Adopted B may remain eligible after A is superseded because its real owned current instance is independent; A source lineage remains exact. Unspecified applicability remains explicit uncertainty in selection metadata, not inferred universal scope or policy compliance.",
    "Fixed model text for each selected Context is role + newline + summary + two newlines + detail, with no other fields. It must be nonempty and at most4096 UTF-8 bytes including separators; a valid larger Context is explicitly ineligible for this bridge rather than silently truncated/summarized. Alias is target- plus SHA256 of the exact revision ref, type is context. Keep the original ref map outside model input. Event text is the actual retained/admitted snapshot at event_id with verified payload digest, at most16384 bytes. Envelope remains exactly {event:{type,timestamp,payload:{text}},stateRefs:[{id,type,text}],question:{family,text}}; no structural actor/scope/worktree/path/source/ACL fields, entire records, rationale, canonical text or other-exploration material is appended. Approved text itself is not claimed universally sanitized.",
    "Reuse actual ingress event/receipt/getRegistration and full selected revision provenance.events/access_events. Union is at most32 distinct normalized events and32 registrations; validate retained digests and current/source-captured principal access. Across targets prepare at most8 distinct Ticket selection pins [at,address], retaining configured canonical reader limit16 and each Context limit8 exact Ticket refs. Several record keys on one actual selection are one pin, not additional pins; reuse union keys only within this invocation/context while asserting each target's own actual support. Every actual support registration needs the fixed owner egress policy; missing entry/deny refuses. Preserve normal->INTERNAL, sensitive->CONFIDENTIAL, restricted->RESTRICTED mapping and highest captured/current level. authority.materialize must approve each selected provider destination using the actual scoped source facts; no local-only or unlisted-provider fallback.",
    "Prepare actual canonical/Ticket/Context material outside transactions. A fixed private instance-branded proof must bind exact revision bytes, normalized applicability, publication/owner facts, source registrations/versions, current local head/binding/catalog/workspace, immutable origin base, current Project declaration/version, source fence, current grant and frozen configuration. Inside actual ProjectActivation.withAdmission recheck only fixed selected internal reads, never nested public Context/Graph/canonical snapshots or caller hooks. Repeat before send after async credential retrieval/backoff and before result/cache return. No transaction spans await. Preserve the documented observed-endpoint/send race and inability to recall already-sent input.",
    "Shared known nonnull origin must remain authorized current/historical, known nonnull current Project selection current/authorized; null coverage remains explicitly unavailable. Context Ticket refs retain their exact historical/current roles and actual supporting events. Keep configured active Authority material visible through its existing separate read path, never fold it into stateRefs/question. Returned selection extends the existing nonsecret pins with input_profile {id:runtime-context,version:1} and per-target exact ref, asserted/projected lifecycle, applicability status/verified refs and publication-origin ref, without raw target/canonical text. governance_evaluated:false and shared_material_sent:false are mandatory.",
    "Use the existing three explicit-key routes and source-configured provider policies without SDK retries/default-env fallbacks. Deadline remains min(artifact,node,ProviderSettings timeout100..120000ms,optional tighter bridge deadline). Attempts remain min(node,artifact,settings1..3), reserving the full node max_tokens/max_cost_microunits per attempt against artifact totals without refund/reset. Only configured allowed transient retries consume the same budget; 401/403/schema/policy/target failures do not broaden routing. Preserve observed null usage when unreported and bounded error-code-only failures. New model envelope max65536 bytes and existing request/result max1MiB,depth<16,nodes<=50000 stay unchanged.",
    "Keep one existing cache/in-flight key namespace per runtime instance: authenticated scope/actor/kind plus invocation_id across both methods. The request/entry/in-flight identity additionally includes the fixed input profile and descriptor/node identity; same invocation_id under another profile conflicts, including zero-target decisions, rather than creating a second dispatch or sharing a legacy success. Completed-decision cache remains at most128 entries/8MiB and in-flight at most8. Reprepare/reauthorize actual current Context/canonical/source/pins and settings before a same-actor hit; changed same-key requests conflict, failed/deferred/late work cannot become cached success, eviction/restart has no durable exactly-once guarantee. Zero targets returns the existing local no_visible_targets negative after current proof/local admission without credential lookup or send.",
    "Offline conformance must exercise candidate/validated/resolved actual Contexts; excludes historical/stale/superseded/rejected/contested/foreign/raw judge-target/canonical selection payloads on evaluateContext, and rejects runtime_context on legacy evaluate. Include actor-separated hits, both directions of cross-method invocation reuse/in-flight contention, evicted/restarted instances, exact target alias validation/invented outputs, source-policy/local-only/three-route compatibility, closure/text/count/JSON bounds, direct and inherited Ticket/code support, shared pin races, grant/source/activation/binding/catalog/Project/settings change after awaited credential and after send, deadline/cancellation/late completion. Existing legacy Judge/Policy behavior must pass unchanged.",
    "Live smoke is an explicit synthetic fixture command, not run by ordinary test/verify or construction. At most and, for a successful smoke, exactly4 actual TypeSafe fetch sends using one route/attempt per invocation and fresh distinct invocation IDs/opaque contexts. Cases1–3 expect yes/no/yes for relevant own, unrelated own and adopted B after A supersession; record actual matches/mismatches without changing inputs post hoc. Case4 counts a new send at the actual transport boundary, performs actual source revocation after that boundary, allows its real provider response to complete, then requires final refusal with null decision/empty targets and no cached success. Do not substitute a cached hit, pre-send refusal, cancellation or timeout and call it completed-response discard; an incomplete fourth response is an honest incomplete smoke. No expected model label is assigned to revoked case4. Invalid lifecycle/foreign/zero-target/retry/cache checks must not add a fifth send; no automatic retry on model disagreement. A temporary harness observer may count only its own approved synthetic body and must never log headers/credentials/raw exceptions.",
    "Evaluation must leave working Graph, exploration origins/receipts/outbox and ingress ACK state unchanged; fixture preparation/adoption and deliberate revocation are separately explicit setup effects. Write only sanitized synthetic measurements with exact input/result/selection identities, expected/observed labels for first3, actual send/attempt counts, provider-completed/final-discard facts for fourth, latency/reserved/observed-or-unknown usage, and excluded-canary assertions. Credential access only through actual ProviderSettings.useCredential, using already authorized local key provisioning; no private traces, user project scan, external deployment or canonical record/model output publication.",
    "Verification: node --test test/context-judge*.test.mjs plus affected test/judge-*.test.mjs and test/context-*.test.mjs; npm run verify and npm run verify:standalone from semantic-runtime/; npm run verify:artifact from root; git diff --check. Deterministic recorded transport cases need no secret or model. Keep live smoke evidence separate from deterministic verification and report route/model availability honestly. This Ticket owns only the bridge; Query remains draft with all five acceptance obligations and existing four dependencies/history unchanged until a separate independently validated refinement consumes this Outcome."
  ],
  "context": "Small independently usable local library bridge between the accepted Context lifecycle and Judge runtime contracts. It enables meaningful selected Context relevance tests before the larger Query implementation. Reuse existing Graph/Context/canonical/source facts and provider orchestration; do not implement Query/FTS/ranking, Compiler, delivery, App, host integration or Worker execution. No Query acceptance responsibility is transferred, retired or waived. Both exact direct prerequisite Outcomes are independently successful and included below.",
