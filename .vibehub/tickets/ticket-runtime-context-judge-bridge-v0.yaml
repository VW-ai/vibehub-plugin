{
  "acceptance": [
    {
      "acceptance_id": "typed-context-input-is-selected",
      "criterion": "Add the exact evaluateContext method and separate pinned Context Judge descriptor/typed bridge for context_relevance only. Select at most eight actual current own-exploration runtime_context entity revisions through the accepted Context profile, applicability and publication/source proofs; candidate, validated and resolved noncontested current heads are eligible. Historical/stale/superseded/rejected/contested/foreign/denied or untyped targets refuse before send. Derive the fixed bounded role/summary/detail text and target-ID-to-original-ref map from those immutable revisions, preserving exact local/shared/Ticket/source pins and explicit uncertain applicability. No caller target text, shadow assertion, source-label forgery, canonical Authority text or other-exploration hypothesis is inserted into model targets. Keep shared origin/current-Project rules separately pinned and checked and report governance_evaluated:false/shared_material_sent:false; relevance never implies canonical truth or adoption.",
      "identity": "sha256:8c199c23cbb3382354f08cd404b9e1cac3907209e818534a2f1f0a86719ef83f",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "context-dispatch-preserves-judge-guards",
      "criterion": "Reuse the existing actual Judge provider/settings/authority/activation path for the new fixed input profile, preserving explicit configured source-registration policy, current and captured ACL/sensitivity, provider allowlists/local-only restrictions, minimal model envelope, deadline and shared attempt/token/cost reservations, bounded telemetry, cancellation and late-result refusal. Recheck every Context/Ticket/canonical/source/owner/head/binding/catalog/current-Project/fence/settings/grant pin immediately before each send and before exposing/caching a decision. Profile-tag the existing actor-scoped global invocation/cache/in-flight identity so cross-method reuse conflicts rather than returning the wrong result or dispatching twice. Existing evaluate/executeJudgeNode, four legacy families, descriptor identity and legacy executePolicyRun remain compatible; no Core v1 wire or generic provider/Policy framework is introduced.",
      "identity": "sha256:e04233ee0a6addc80c08431fd34cad7318c0fb45f13298b934fce21ba6ecd3b3",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "context-bridge-conformance-and-live-smoke",
      "criterion": "Real disposable Git/SQLite, scoped grants, admitted events, actual typed Context mutations/adoption, settings and recorded transports prove positive/negative relevance mapping, all eligible states, honest uncertain applicability, A superseded while adopted B remains eligible, each excluded lifecycle/scope, exact Ticket/code provenance, bounds, missing/denied source policy, three-route regression, cross-profile cache/in-flight collision, changed grants/selected pins, pre-send and in-flight revocation, timeout/cancellation and no late success. Refused inputs send zero requests; evaluation creates no Graph/origin/receipt/outbox/ACK/canonical effect. A separate opt-in fixed synthetic TypeSafe JEV smoke exercises exactly four actual new provider sends: relevant own Context, unrelated own Context, adopted B after A supersession, and a fourth in-flight revocation whose completed response is discarded. Use fresh opaque invocation contexts and distinct invocation IDs, report the first three observed labels/latencies and the fourth refusal rather than assigning it an expected model label; retries/cache/invalid-input checks add no send. Record honest unavailable/not-run or mismatched model outcomes, bounded usage and structural canary exclusion with no secrets/private traces. Focused/affected tests, full Runtime verify, standalone verify and unchanged plugin artifact checks pass; deterministic acceptance needs no live credential.",
      "identity": "sha256:08137d7a0d8cbf246dad9d4f865e38b3838a5cd648c197cb7348e96087656385",
      "revision": 1,
      "state": "active"
    }
