      "criterion": "Submitting while the active Turn streams queues the message by default in a host-owned transient per-Thread queue: the queued list renders above the composer with edit, delete and a per-row Steer, the Send control reads Queue while a Turn is live and Alt+Enter performs the opposite of the Send label for one message, each queued message starts as its own turn/start with a new Turn id after turn/completed, nothing is sent after turn/interrupt until an explicit Resume, and Steer uses turn/steer with the exact expectedTurnId; the conformance row running-composer-steer is rewritten to this contract with its proof fields, and a node test plus a guard check cover queue then start, interrupt then paused then resume, and steer, with the fixture call log showing N queued messages becoming N turn/start requests with distinct Turn ids each after the prior turn/completed."
