  "context": "Owner dogfood of the accepted production shell against the real Codex app surfaced behavioural gaps in ordinary Chat. A read-only audit of the 0.149.0 app-server schema, upstream source at rust-v0.149.0 and the installed Codex desktop app established the seams. Today the shell steers any submission made during a live Turn through turn/steer, while Codex desktop keeps a client-side queue of follow-ups sent as turn/start after turn/completed, with Queue as the default, Steer as the per-message opposite, and per-row edit, delete and steer; the app-server's own thread/queue/* requests exist only under the experimental API and are not pinned, so the shell mirrors desktop with a host-owned transient queue rather than depending on unstable seams. model/list returns displayName, isDefault, supportedReasoningEfforts, defaultReasoningEffort and inputModalities, thread/start and thread/resume return the effective model and reasoningEffort, thread/settings/updated broadcasts the current thread settings, and turn/start accepts model and effort, so a truthful picker is possible; the conformance row model-mode-pickers moves from deferred to pass. The stable UserInput variants are text, image, localImage, audio, localAudio, skill and mention; fuzzyFileSearch and skills/list are stable discovery seams; the composer today accepts only a file input with no paste or drop handling. thread/tokenUsage/updated, thread/compact/start, thread/name/set and thread/name/updated are stable. Collaboration mode, permission profiles and the server-side queue stay out until they leave the experimental API; photos library, appshot, pasted-text-as-file, open-in-terminal and client-side auto titling are niche and excluded. Sidebar freshness when a brand-new Chat's first Turn starts on the real runtime, recorded during the 0.149.0 repin, is closed here because it is the same daily-use surface. Replan after a partial Outcome on 2026-08-23: seven criteria were accepted and turn-completion-notifies-once-and-sidebar-stays-fresh stayed unresolved because the sidebar refresh keyed on turn/started, while the real 0.149.0 app-server lists a new Thread only once its first userMessage is durable, about 1.5 to 3 seconds later; the fixture lists immediately, which hid the gap. The next cycle keys the refresh on the durable userMessage item/completed or thread/status/changed with a bounded retry after turn/started, makes the fixture delay listing until the userMessage is durable so the guard can see it, and asserts the new Thread's own live dot in the real-runtime lifecycle walk; the criterion text is unchanged.",
