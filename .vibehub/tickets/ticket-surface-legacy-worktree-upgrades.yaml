      "acceptance_id": "dashboard-preserves-structured-failure-detail",
      "criterion": "Dashboard APIs and UI preserve structured compatibility or validation diagnostics with actionable worktree context; unexpected validation failures show a bounded summary and details suitable for troubleshooting rather than collapsing every failure to a message-only internal error, without exposing bearer tokens or unrelated filesystem data.",
      "identity": "sha256:dd68e6792a6d40ed96b63c6b3e79ecfd5fb3e30d49dba0ec829c96635aba0825",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "upgrade-discovery-is-read-only-and-tested",
      "criterion": "Mixed registered-worktree fixtures covering current format 4, migratable formats 2 and 3, malformed markers, unsupported-newer format, dirty worktrees, and unavailable paths prove discovery and UI rendering are deterministic and read-only: no repository bytes, index, HEAD, branch, refs, commits, hooks, remotes, or migration-pending state change during install, Dashboard start, discovery, selection, or refresh; focused tests, the full suite, and Plugin artifact verification pass.",
      "identity": "sha256:00ad33b3cfbec46eaf52ad666c45edce0d852d1ab927f13d11519ac1473b95aa",
      "revision": 1,
