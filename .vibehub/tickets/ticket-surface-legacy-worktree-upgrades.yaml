  "active_contract_revision": 1,
  "constraints": [
    "Do not run migration during Skill installation, marketplace refresh, Dashboard start, discovery, validation, query, selection, or refresh.",
    "Reuse the shared compatibility operation, migration registry, vibehub-migrate workflow, and release-paired upgrader; do not add a second detector, migration table, rewrite engine, or background updater.",
    "Do not scan outside user-selected roots except registered worktrees already authorized by the existing discovery contract.",
    "Do not stash, reset, checkout, clean, commit, push, run hooks, move refs, or modify an incompatible worktree from the Dashboard.",
    "Keep current worktrees fully usable when sibling worktrees need migration, repair, or removal."
  ],
  "context": "After installing the V4-era plugin, the Dashboard discovered registered worktrees whose checked-in `.vibehub` data still used formats 2 and 3. Seven of nine discovered worktrees failed when the current format-4 runtime tried to load them, yet the UI exposed only `Could not read this ticket graph` and `VibeHub validation failed`. The current checkout validated successfully, so this was not graph corruption; discovery treated any checkout with `.vibehub/version.yaml` as loadable without running compatibility preflight. The owner reasonably expected a visible upgrade or migration experience after obtaining V4. Existing accepted safety contracts deliberately forbid silent migration during installation, refresh, validation, query, or UI launch, and already provide explicit agent-driven migration plus a release-paired bounded multi-worktree upgrader. This Ticket connects those capabilities through honest read-only diagnosis and handoff rather than inventing another migration engine or mutating repositories from the Dashboard.",
