      "acceptance_id": "discovery-classifies-every-connected-worktree",
      "criterion": "Dashboard discovery performs the shared read-only project compatibility preflight for every connected available VibeHub worktree and reports CURRENT, MIGRATION_REQUIRED, UNSUPPORTED_NEWER, malformed, or unavailable with detected and target formats plus a stable reason; a version marker alone no longer implies that the graph is loadable, and one incompatible worktree never prevents current worktrees or other projects from loading.",
      "identity": "sha256:4480da28928ca138818e465bfcd69fc00c48442d12769505638bfdaade75c5cf",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "legacy-worktrees-have-an-upgrade-state",
      "criterion": "Branches and worktrees that require migration remain visible but render a specific Upgrade required state before any graph request, naming the exact worktree and detected-to-target format path; selecting one presents that state and its next action instead of `Could not read this ticket graph`, while malformed and unsupported-newer formats remain distinct and never masquerade as migratable.",
      "identity": "sha256:9c62eab187b9e6273cbc84281ea2c80ac8ba24ce34fdd92343ab639e0d6b0e96",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "upgrade-handoff-is-exact-and-actionable",
      "criterion": "The upgrade state provides a copyable Agent handoff containing the exact worktree path, detected format, target format, and instruction to use the installed VibeHub migration workflow, and names the existing release-paired bounded multi-worktree upgrader when immutable matching release identity is available; it never fabricates a floating `latest` command, implies that downloading Skills migrated data, or asks users to decode raw schema errors.",
      "identity": "sha256:9fafcd66565ef2fef7a4bcc864f3231bae6ab51c9fd53c080732d5b83365eab5",
      "revision": 1,
      "state": "active"
    },
