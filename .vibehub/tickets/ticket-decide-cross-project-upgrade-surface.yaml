  "context": "The owner has now settled the product behavior that was open when this Ticket was created. An explicit VibeHub upgrade does more than report: it discovers affected projects, enumerates every registered existing worktree, attempts the declared mechanical migration separately on each safe worktree, validates it, creates a local migration commit, reports the worktree-to-commit mapping and every skipped reason, never pushes, and leaves semantic work to a later Agent session in that worktree. decision-explicit-upgrade-migrates-safe-worktrees supersedes the earlier read-only machine-wide decision. Safety starts deliberately conservative: automatic write requires a reachable writable registered worktree on a named branch, no Git operation in progress, a completely clean status, a complete recognized migration chain, a same-HEAD deterministic preview touching only declared paths and reaching valid CURRENT state, an unchanged pre-commit snapshot, and a successful local commit; current is a no-op, malformed or newer is unsupported, and every other failure is pending with an exact reason. The remaining decision work is engineering-boundary work rather than another product choice: compare one-shot and installed invocation shapes against this behavior, select the smallest one, and replace the old absolute no-required-CLI sentence with a testable exception. The candidate exception is narrow: all migration semantics remain in the shared engine and migrations reference; the outside-project entry adds only explicit invocation, discovery, per-worktree orchestration, local commit, and human-readable reporting; no Skill depends on it, no background process invokes it, and it owns no durable truth outside Git.",
