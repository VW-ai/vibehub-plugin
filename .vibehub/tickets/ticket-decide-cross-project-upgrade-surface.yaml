 "context": "decision-upgrade-drives-every-affected-project commits VibeHub to discovering and driving migration across every affected project when a user takes an update. That obligation is deliberately narrow: the machine-wide half only discovers and reports, while the migration itself stays with the next Agent session opened in each project. Even so it cannot attach to the documented update command, because npx skills update belongs to skills.sh and VibeHub cannot hook it. It therefore requires an entry point that runs outside any project — a surface VibeHub has never had, and one that skills/vibehub-setup/references/architecture-boundary.md currently forbids in its strongest form: the product ships no required CLI, MCP server, database, daemon, hook cadence, native runtime, local web service, background capture, or hidden state, and anything a Skill introduces beyond that is a defect rather than a feature. That boundary was written for two reasons and only one has expired. It avoided the old CLI-plus-local-database coupling, which is void now that truth lives in per-project Git. It also acted as a forcing constraint that pushed capability back into Skills and documents, which still works; removing it without a replacement would reintroduce the failure it prevented. A candidate replacement exists and is narrower and testable: new capability always lands in the engine, and any outside-a-project entry adds only cross-project scope, human-readable output, and invocation convenience, with zero capability that exists only there. Skills never call it and it is never a prerequisite for a Skill — a property that is true by construction, because a Skill's work is always in-project and the engine is already on its path, and that test/skill-contracts.test.mjs can assert in the same way it already asserts that every engine command a Skill cites resolves. What such an entry needs is small and derived: which projects on this machine hold a .vibehub, which format each is at, and whether a migration applies. All three are recoverable by scanning, so the index behind it can be a pure cache — deletable and rebuildable — and never becomes an authority. This Ticket does not absorb ticket-vibehub-cli, which is scoped to whether vh.mjs should be split behind a stable Agent-facing command; that is a maintainability question about the engine, while this is a product question about reach. The two answers constrain each other and should be read together, but they are not the same decision. The scope of what is being decided is smaller than it first appears, and the decision should be made against the smaller thing: the entry reads .vibehub directories, reports formats and migration states, and writes nothing outside the project the user is in. A read-only reporter is a weaker precedent than a general cross-project tool, and whether the boundary should be narrowed for it is a different question from whether it should be narrowed for one that acts.",
