  "active_contract_revision": 1,
  "constraints": [
    "Authority stays Git-native Context inside a Room; no approval service, second lifecycle, hidden state or background capture.",
    "Additive only: Context schema_version stays 1, existing Context types keep their meaning, and no project-format migration is introduced.",
    "context governing and context guard are read-only and deterministic over their inputs; the guard never invents a change record or Ticket completion.",
    "Preserve unrelated uncommitted work in this worktree."
  ],
  "context": "The user asked for golden truth in VibeHub: a game's contracts or resources, a system's architecture graph, that Agents must follow while implementing and must update only through strict rules. The owner confirmed this is a Context type inside the existing Room tree, not a separate data room, and that no human approval is required unless the Context itself demands it. Implement type authority in the Context schema and engine with an authority object carrying governs (Room anchor syntax: path prefixes or segment ids), canonical (current repository file paths that are the source of truth), update_rules (ordered non-empty steps), validation (non-empty checks) and optional approval none|human. Add two read-only engine operations: context governing returns every active authority Context covering a set of repository paths and/or a Ticket's context_refs; context guard reports every authority whose canonical artifact is in a changed path set (explicit input or derived from git status) without an active change Context in that same set relating to the authority and citing the changed canonical path. Wire the Skills: ingest captures authority Context; plan attaches governing authority to context_refs; run reads governing authority before implementing, follows update_rules in order, records the change Context, and routes approval human through the existing human boundary; validate and closeout run the guard and treat violations as blocking. Project the type into the Rooms surface and document it. The contract type keeps its prose meaning. Context schema_version stays 1 and no project-format migration is introduced because the change is additive.",
