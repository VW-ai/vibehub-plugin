  "context": "Baseline §6.1: the Workbench is a thin desktop shell — the native window owns directory selection, recent repositories, and window lifecycle; the app starts the existing read-only host inside its session; the WebView loads the shared frontend; quitting the app ends host, watcher, and token. §8.1 defines the non-semantic RepositorySession (repoRoot, branch, commit, dirty read fresh from Git; selectedTicket, tab, viewport as UI preference only). §8.2 is the persistence allowlist: recent repository paths, window frame, last selected Ticket and tab, and pan/zoom may persist; the bearer token, Ticket states, frontier, and projected snapshots must not. §10: the WebView must not receive arbitrary local file permission — directory choice, Git metadata, and .vibehub reads pass through a narrow native or Node bridge restricted to the selected worktree. §12: calling the exported startVibeHubUi is acceptable initially, but avoid making skills/ relative paths a long-term structural dependency. WKWebView targets macOS dogfood first; cross-platform shells are a later evaluation (§6.2).",
