{
  "acceptance": [
    {
      "acceptance_id": "local-job-contract",
      "criterion": "Map actionable request and existing Worker protocol identities explicitly; persist bounded job/attempt/input/bundle/schema/Project/exploration/base pins, current source access and activation generation. Expose executor admission/claim/result/receipt via local authenticated interfaces without depending on an interactive coding Session.",
      "identity": "sha256:35fcd82e655e40103528ef60a1686673ee0fc47de0e211936a80a808604a20eb",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "local-job-controls",
      "criterion": "Enforce concurrency, deadline, retry/queue budget, permission/tool/source ceilings, cancellation and pause for missing login/quota. Inputs are selected refs/fragments and explicit filesystem grants, not arbitrary host access. No silent paid-API or remote-executor fallback.",
      "identity": "sha256:9ea5e99b1a0fbfdf069be2f24ccaafd56872c317bf9735532a04921d7d898403",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "local-result-admission",
      "criterion": "Accept only schema-valid cited candidate results with current access/base/activation checks; duplicates have one receipt, stale/late/revoked output cannot mutate Graph. Worker cannot independently accept its own Ticket or write canonical state. Use existing guarded Graph commands and continuation semantics.",
      "identity": "sha256:3a29d7209011a7a366d6cd5efc6e4428b1c4055d3ddea91659454f78ad2274fd",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "local-runner-recovery",
      "criterion": "Real-store/fake-executor fault tests prove crash before/after claim/result/ACK, restart, duplicate execution, disable/cancel race, bounded backlog, unavailable inputs and unknown executor. Mark internal Worker origin so capture cannot trigger recursive jobs; native coding stays usable.",
      "identity": "sha256:b780ef64f688787b59cdb988040c19236d59193c513987493e324ee66715ad70",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "policy-worker-integration",
      "criterion": "Implement the local WorkerNode dispatch and result-continuation adapter against the durable Policy journal: extend/register the bounded kernel handler so a supported WorkerNode atomically enqueues one pinned local job/outbox effect and yields without waiting. After guarded result admission, append a new explicit input and pinned-policy run/snapshot, never mutate the old run. Prove dispatch/restart/double-result/cancel/disable races using the real journal; the current non-model kernel alone does not provide this behavior. This adapter requires no remote BYO enrollment or old remote scheduler/result service.",
      "identity": "sha256:4099e45d9a8d94f590a59541285cbb3aea7084f754f64ac2e11df2e4490cc97a",
      "revision": 1,
      "state": "active"
    }
  ],
  "active_contract_revision": 1,
  "constraints": [
    "Implement only inside semantic-runtime/ through documented public contracts; do not import sibling Skill or UI internals.",
    "Preserve original PRD/Tech Design and successful contract/provider Outcomes; completed reference fixtures are baseline, not proof of a live service.",
    "Use synthetic or explicitly selected destination-authorized input; never read or log credentials or ingest arbitrary private traces. No external deployment is authorized by this plan.",
    "Candidate/proposal results cannot certify acceptance, grant access or silently overwrite governing Context; retain independent review and user-reserved decisions.",
    "Branch/exploration scope, worktree execution provenance and Project overview remain distinct; awareness is not adoption.",
    "Honor App project activation and executor-independent Ticket contracts. No installation, real model use, or implementation is claimed by this planning record."
  ],
  "context": "Local transport/composition of existing Worker protocol and actionable WorkRequest contracts, not a second lifecycle or cloud BYO service. Own queue/admission/attempt/cancel/result persistence with fake executors; concrete CLI execution is separate.",
