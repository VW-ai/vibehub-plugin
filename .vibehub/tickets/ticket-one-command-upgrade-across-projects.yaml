    "Only a terminal successful compare-and-swap may produce `migrated`; every other result must prove no user bytes or Git-visible baseline state changed, and `recovery_failed` stops subsequent writes.",
    "A mechanical result may be committed only when it is valid and writable at CURRENT format with every declared semantic step represented by durable pending guidance for a later Agent session.",
    "Do not absorb `ticket-vibehub-cli`, historical-context-ref format 3, hosted services, UI launch mechanics, or automatic push into this delivery."
  ],
  "context": "The prerequisite decision is successful and replaces this Ticket's original read-only draft. The selected outside-project surface is a dependency-free npm-layout `vibehub-upgrade.tgz` attached to each GitHub Release, with exactly one bin. Release upgrade is a two-command, same-tag recipe: install Skills from `https://github.com/VW-ai/vibehub-plugin/tree/<release-tag>`, then run `npx --yes https://github.com/VW-ai/vibehub-plugin/releases/download/<release-tag>/vibehub-upgrade.tgz --root <bounded-root> [--root <another-root>]`. The data-upgrade half is one command and is identical across hosts. `npx skills update` plus a floating `releases/latest` upgrader is not supported because the two can resolve different revisions. The package embeds and self-checks the same release's coordinator, shared `vh.mjs`, contracts, and migration registry; it owns orchestration, not migration semantics. Discovery never defaults to a home or machine scan: it finds `.vibehub` only below realpath-normalized explicit roots without following symlinks, deduplicates repositories by common Git directory, and expands outside a root only through that repository's `git worktree list --porcelain` records. Each registered worktree is classified independently. Automatic write requires a reachable writable worktree with `.vibehub`, named non-unborn branch, no merge/rebase/cherry-pick/revert/bisect, byte-empty complete porcelain status, recognized older format, complete mechanical chain, and twice-identical disposable preview from the same HEAD that changes only declared paths, reaches valid CURRENT state, and records any semantic work as pending. Before real writes, a temporary index constructs and verifies the exact future tree and unsigned commit. After materialization, the final pre-CAS gate rechecks branch/HEAD, declared bytes and types, real-index tree equality, and exact staged-only status. The sole success boundary is `git -c core.hooksPath=<new-controlled-empty-dir> update-ref <branch> <prepared-commit> <old-head>`; all pre-CAS failures restore and prove the exact clean preimage, while successful CAS is terminal. Git commit hooks, reference-transaction hooks, signing helpers, stash, reset, checkout, clean, push, background invocation, telemetry, and a durable project index remain forbidden. The successful decision's proposal contains the exact architecture-boundary replacement and test obligations; implement them without broadening into the separate general-CLI maintainability question.",
