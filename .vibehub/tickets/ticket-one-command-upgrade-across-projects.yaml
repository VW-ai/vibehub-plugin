  "constraints": [
    "Implement the exact successful decision and proposal; do not reopen the invocation choice, unsafe predicate, or owner-approved registered-worktree behavior inside execution.",
    "The one-shot package is a GitHub Release asset only: no npm-registry publication, global installation requirement, general-purpose CLI, package dependency, or development-repository execution.",
    "All migration semantics remain in the shared engine and migrations reference; the coordinator may discover, classify, orchestrate, commit, and report but may not carry a second migration implementation.",
    "Never scan without at least one explicit bounded root, follow directory symlinks, enumerate unregistered branches, or treat discovered repository authority as permission to scan its surrounding filesystem.",
