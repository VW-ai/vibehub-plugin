 "context": "Direction only; the entry point's shape is not yet decided. A survey of one developer's machine on 2026-09-01 found three VibeHub projects, of which two were write-blocked and their owner did not know: Undercurrent at format_version 1, and nomi at 0.4-unversioned with no .vibehub/version.yaml and a populated flat .vibehub/context/ of 19 entries, both returning format_mismatch MIGRATION_REQUIRED against the current engine. Per-project detection already works, on demand, from inside a project, using format_version alone. decision-upgrade-drives-every-affected-project commits VibeHub to reporting machine-wide while leaving the migration itself to the next Agent session opened in each project. That split matters for scope: the doing already works, and this Ticket delivers only the finding out. It is still unbuildable until one thing is settled — npx skills update belongs to skills.sh and cannot be hooked, so the obligation needs VibeHub's own entry point running outside any project, and whether such an entry may exist at all is a boundary question owned by ticket-decide-cross-project-upgrade-surface. Two facts are already fixed and will not change with that decision. nomi has no version.yaml at all, so a pending-upgrade marker cannot live in the version file for the very case that most needs one. And a project with uncommitted work must be surfaced rather than silently modified: Undercurrent currently carries unstaged edits alongside its stale format. A third observation is deliberately not carried as a constraint — that installs today contain the plugin's own .vibehub tree, which a naive directory walk would mistake for a user project — because retiring marketplace distribution removes it.",
