  ],
  "context": "`npx skills add` copies Skill folders into a project and does not prune folders that no longer exist upstream, so renaming a Skill leaves the old folder in place beside the new one. The failure is not an error — it is two Skills visible to the Agent for the same job, the retired one still loadable because the shared helper it points at still exists. Host marketplace installs are unaffected: their plugin cache is isolated per version. skills.sh is not ours to change, but detection is: vibehub-setup already inspects the exact checkout for existing skills and memory systems, so it is the natural place to notice a retired folder. This is a general consequence of any Skill rename, discovered while retiring vibehub-ticket-review, and is deliberately not bundled into that rename.",
