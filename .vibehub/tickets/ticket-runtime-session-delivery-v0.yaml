      "acceptance_id": "session-contract",
      "criterion": "Implement session registration/heartbeat/expiry/subscription scoped by authenticated Project/exploration/execution and optional worktree. Multiple Sessions may share a worktree; reconnect uses a stable delivery cursor without pretending the new registration is the old Session. Capabilities come from the host probe.",
      "identity": "sha256:67dfc638ce48516ea50e5a846db6c772209380b7be4190bb4959f147b89f1eee",
      "revision": 2,
      "state": "active"
