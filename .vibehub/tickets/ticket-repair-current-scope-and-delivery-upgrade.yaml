  "active_contract_revision": 1,
  "constraints": [
    "Do not infer delivery from Ticket status, branch names, filenames, prose, or an arbitrary current PR; a delivered entry requires an exact canonical PR or commit reference, delivered timestamp, and 40-hex commit.",
    "Do not hide READY, REFINE, or BLOCKED work, and do not make delivery/archive state another operational Ticket lifecycle.",
    "Do not delete, relocate, squash, or rewrite Evidence and Outcomes merely to reduce the current graph.",
    "CLI JSON and Workbench must consume the same exported query projection; no browser-only filtering, cache, database, or second source of truth.",
    "Preserve the user's existing uncommitted Harness prototype files and limit edits to this Ticket's projection, migration, canonical Ticket data, tests, documentation, Evidence, and Outcome."
  ],
  "context": "Real dogfood of the v0.8 Workbench showed that scope=current renders 47 of 53 Tickets, including 38 DONE cards. Thirty-four successful Tickets have no delivered membership because the deliveries field was added after those Tickets and the project format was not advanced, so the legacy omission fallback incorrectly keeps completed history in the current action surface. The deeper compatibility flaw is that the Ticket data contract changed while Ticket schema_version, project format, the migration registry, and their tests remained independent, allowing the project to report CURRENT without upgrading canonical data. Fix the projection and the upgrade gap together: current work is seeded by non-DONE Tickets and expands only the minimum direct DONE causal boundary needed to understand those open Tickets; delivery/archive remains the canonical PR/history model and All remains complete. Advance the project format, advance Ticket documents to schema v2, and add an explicit agent-driven migration that adds an explicit deliveries array to legacy Tickets, populates delivered entries only from exact reviewable PR or cherry-pick evidence, and leaves an empty array when no authoritative delivery can be established. Apply that audit to this repository's existing Tickets as the first migration proof and mechanically bind future compatibility checks to the declared schema transition.",
