      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "degrades-without-git",
      "criterion": "Validation still runs in a checkout with no reachable git history: when the recorded commit cannot be read, a closed Ticket's unreadable ref is reported as an unverifiable ref rather than crashing or silently passing, and the test suite continues to pass when run outside a git checkout.",
