  "active_contract_revision": 1,
  "constraints": [
    "Do not edit closed Tickets, Evidence, or Outcomes to make validation pass; the point of this Ticket is that they should not have to change.",
    "Do not weaken validation for open Tickets or for Room anchors.",
    "Do not begin validating Context `source.ref` or `evidence[].ref`; they are unchecked today and are records, not live pointers. Widening the check is separate work.",
    "Keep the helper dependency-free; shell out to git rather than adding a git library."
  ],
  "context": "Executing ticket-generalize-review-to-room-trees surfaced this: renaming one skill directory made 37 context_refs across 24 closed Tickets unreadable and broke `project validate` repo-wide. The validator resolves every Ticket context_ref against the working tree forever, but a closed Ticket is a record of what was read at the time, not a promise about today's layout. As written, the rule means this repository can never restructure its own directories without rewriting closed records. Git's own answer is that content is addressed by commit, and Tickets already carry `commit:` provenance. The distinction that matters is live pointer versus record: a Room's anchors and alignment stamp are used to compute drift now and must stay resolvable; a closed Ticket's context_refs are not.",
