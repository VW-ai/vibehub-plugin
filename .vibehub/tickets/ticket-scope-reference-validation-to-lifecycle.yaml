      "criterion": "A Ticket that has a recorded Outcome has each `context_refs` entry validated against a commit recorded for that Ticket rather than against the working tree. A ref readable at that commit passes even when the path no longer exists at HEAD; a ref readable at neither the commit nor the working tree still fails.",
