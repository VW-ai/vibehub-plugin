  "active_contract_revision": 1,
  "constraints": [
    "Move quickly and delete obsolete presentation structure instead of preserving CSS compatibility.",
    "Do not weaken loopback binding, bearer validation, expiry, or security headers to make the link portable.",
    "Keep the UI read-only and dependency-free; this Ticket does not authorize browser writes.",
    "Reuse the mechanical graph layout and inspector data projection where useful, but do not let old DOM structure dictate the redesign.",
    "Treat user-owned Chrome, Safari, or another normal browser as a first-class viewer, not a fallback from Codex."
  ],
  "context": "Immediate dogfood exposed three failures in the just-restored UI: the client removes the bearer fragment from browser history so an address-bar copy cannot authenticate in another browser; the page nests a collapsible surface, signal, sheet, workspace, canvas, inspector, and bottom status treatment into a visually confused stack; and the launch/copy experience makes the local UI appear Codex-only even though the launcher can open the operating system browser. Replace the presentation, not the canonical data architecture. Keep the direct validated Git-YAML projection and read-only loopback host, but make the authorized link portable for its short lifetime and rebuild the page as one intentional graph application rather than a web panel embedded inside another web panel.",
