  "context": "The current 45-Ticket dogfood graph exposed two different problems that must not be conflated. First, canonical Ticket outcomes are deliberately complete and average far beyond a compact card: at the real 232px card copy width, 90% of the current outcomes require about 12 lines, so simply making every card tall enough would push cards toward roughly 230px and make the dense graph harder to scan. Second, as repositories accumulate hundreds or thousands of historical and current Tickets, layout quality alone cannot provide orientation; the Workbench needs progressive information architecture, query/focus modes, and honest explanations for hidden context. The owner wants roughly 90% of card copy readable directly, is open to a shorter graph-only description while preserving the full outcome in expanded detail, and expects the large-graph UI/UX to become a genuinely powerful future surface. This Ticket produces the concrete proposal and contract needed before production implementation is planned.",
