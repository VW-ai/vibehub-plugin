  "constraints": [
    "Do not create a new user-facing Skill for large material; absorption is ingest's behavior at scale.",
    "Do not name the branch or its reference after input size in anything a user must remember.",
    "Do not delete vibehub-distill or rewrite the checked-in knowledge-room Context that describes it; narrow it in place.",
    "Do not extend scope to semantic Room anchors, artifact-authority Context, or Ticket-splitting pressure.",
    "Keep the pipeline harness-portable: subagents are an optimization, never a requirement."
  ],
