  "constraints": [
    "Implement within semantic-runtime/ with its own dependencies, build, tests and release; host/source integrations consume public contracts and never import sibling plugin internals.",
    "Retain existing replay/provider behavior, run affected contract tests and component boundary checks; release composition also runs standalone and plugin artifact checks. Do not rebuild completed Phase 0 work.",
    "Fast judges and workers produce auditable candidates/proposals; canonical writes require explicit authority and concurrency checks. Do not infer acceptance from model confidence.",
    "Use synthetic or explicitly selected, destination-authorized input for live calls; credentials stay outside Context, logs and Git. Existing Peel authorization is not blanket authorization for new sources or destinations.",
    "REFINE this same Ticket from its prerequisite Outcomes before execution; bind concrete schemas, commands, workloads and thresholds rather than treating draft acceptance as implementation authorization."
  ],
  "context": "Define a connector substrate for webhook, polling, backfill, lifecycle, and quota handling. Delivery slice: post-alpha. Architecture: 5 Macro Architecture; 8.1 Event Gateway; 21 External Connector Architecture; 22 Security & Privacy; 24 Failure Handling; 25 Enterprise Multi-tenancy. Scope: Provider-neutral connector lifecycle; Webhook, polling, and backfill convergence; Cursor, quota, retry, and gap behavior; Connector conformance harness. Excluded: Concrete GitHub/Slack/Docs implementation; Credential provisioning UI; Platform-specific secret manager; Direct Semantic Working Graph writes.  Refine exact adapter endpoints, fixtures, commands and measurable limits after its direct prerequisites close.",
