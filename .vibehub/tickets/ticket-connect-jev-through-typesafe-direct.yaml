  "active_contract_revision": 1,
  "constraints": [
    "Do not send the sanitized Peel fixture or other real project data to api.typesafe.ai without explicit destination-specific user authorization.",
    "Never expose, serialize, print, log, or commit the value of TYPESAFE_API_KEY; runtime presence checks and SDK authentication consumption are allowed. Retrieve it from macOS Keychain only through a command whose output is redirected directly into ignored local environment state.",
    "Keep TypeSafe SDK types, request mapping, resolved-model metadata, and transport errors inside the adapter boundary; semantic core stays provider-independent.",
    "Treat the 436 ms synthetic direct observation and the existing 304 ms Gateway median as route observations, not a provider-wide benchmark or a permanent routing decision.",
    "A future real-corpus direct benchmark is a separate authorization and Ticket outcome."
  ],
  "context": "The existing JEV adapter reaches TypeSafe through Vercel AI Gateway. The owner supplied an official TypeSafe key and asked whether Gateway was causing latency. Current evidence says the Claude CLI path, not JEV Gateway, dominates the observed comparison latency: the accepted Gateway JEV run has 304 ms median provider latency, while an official direct synthetic JEV 1.13.0 call completed in 436 ms after one earlier 529 overload. This Ticket adds the official transport and safe measurement seam without treating one synthetic call as a provider-wide speed conclusion. Sending the sanitized Peel fixture to api.typesafe.ai is a separate destination decision and remains outside this Ticket.",
