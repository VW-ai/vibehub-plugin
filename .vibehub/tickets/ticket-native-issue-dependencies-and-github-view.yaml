  "constraints": [
    "Relations flow one way from Ticket depends_on to GitHub; never read GitHub relationships back into .vibehub documents.",
    "The Actions workflow keeps issues:write and contents:read only; any view that needs a Project or a PAT is documented as one-time human setup, not automated in CI.",
    "Do not add a runtime dependency beyond node and gh."
  ],
  "context": "The first live mirror showed dependencies only as Blocked by #N text in the body; the sidebar Relationships section stayed empty. GitHub exposes a REST API for issue dependencies (GET/POST/DELETE /repos/{owner}/{repo}/issues/{n}/dependencies/blocked_by with an integer issue_id) and it was verified working on VW-ai/vibehub-plugin: #35 now natively shows Blocked by #44 and #44 shows Blocking #35. GitHub marks blocked issues with a Blocked icon on the Issues page and on Projects boards, and gh issue view prints Blocked by and Blocking rows. The documented Issues search syntax has no blocked/blocking qualifier; Projects views can group, filter by field, and show roadmap and board layouts, but creating a Project cannot be done with the Actions GITHUB_TOKEN, so any Project-based view is a one-time human setup that the sync then feeds. The owner asked for native dependencies and for picking or building the most suitable GitHub view. The one-way rule from decision-github-issues-are-a-read-only-ticket-projection applies unchanged: relations flow from Ticket relations to GitHub, never back.",
