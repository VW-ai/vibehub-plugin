    {
      "acceptance_id": "incremental-graph-wire-and-compatibility",
      "criterion": "Publish executable versioned validators for exact scoped graph commit/manifest addresses, mutation requests/effect plans and page cursors, with bounded inert JSON and explicit per-row/closure/page budgets compatible with DomainStore. Preserve V1 Working Graph validators and addresses unchanged. Specify the new digest commitment and deterministic ordering; reject cross-scope/generation, missing predecessor, unknown versions, malformed/accessor inputs and ambiguous old/new address coercion. Define exact legacy read/import compatibility or explicit unsupported conversion without rebinding prior digests. Pin identity/catalog versions and exact source/canonical provenance; a hash or copied catalog grants no authority. No storage/network/provider dependency is introduced into core.",
      "identity": "sha256:b9f0d7413821cf80dfbb65dcc5545b1d35f3fb433f9f211722c3b5f0ffe5f0fe",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "incremental-graph-transition-semantics",
      "criterion": "Implement deterministic incremental transitions over a small selected-record port, using existing immutable semantic/provenance validation wherever compatible. Cover new/update entity and relation assertions, exact relation endpoints and inherited ACLs, graph CAS mismatch returning an unapplied proposal with zero effects, separately admitted semantic-base conflict, explicit conflict resolution preserving competitors, and source ACL/tombstone transitions with predecessor-only source/epoch admission. Port facts must pin the current committed head, scoped source bodies and lifecycle authority; a caller-provided projection or lifecycle message cannot certify itself. Output bounded append/CAS/audit/outbox effect descriptors for a future transaction without claiming persistence or advancing semantic/source completion merely from receipt. Preserve old-epoch restrictions, immutable event identity, historical refs, derived-only lifecycle and separate canonical-write authority.",
      "identity": "sha256:c999ee5fe10d676c26c8007773a33165002fcc20b0c2339930873804bd4c5dde",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "incremental-graph-history-pages-and-current-access",
      "criterion": "Implement exact point-in-time semantic lookup and bounded history/head/conflict page contracts with maximum page size64 and a cursor bound to scope, generation, exact selected commit, collection and position. A miss cannot fall forward to latest. Historical reads intersect complete captured provenance with current source access; revoked/unknown/tombstoned or stale access proof denies content, including relation/parent closure and after page continuation. Old page cursors never carry access grants. The selected-record port exposes actual fact requests so tests reject whole-history/all-entity materialization for one bounded operation. State how a real adapter validates/rebuilds projections incrementally from immutable commits and retains old source/canonical/enrollment pins; dynamic live enrollment, branch adoption, ranking, compaction, pruning and a generic checkpoint engine remain outside this Ticket.",
      "identity": "sha256:f87c3d320c22dbe7f011870d90a9bb6bb355ca94441e7b4a516570aafa4ed7e9",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "incremental-graph-oracle-and-scale-conformance",
      "criterion": "Use synthetic deterministic in-memory indexed-port fixtures to compare compatible/contradictory assertions, resolutions, exact relation endpoints, lifecycle/ACL changes, tombstones, temporal epoch admission and historical reads against the accepted V1 oracle on bounded traces. Run a same-generation1040-transition workload with at least600 distinct entity/relation records, retaining readable old references and pages across both128/512 thresholds without resets or pruning. For fixed small-support mutations at early and late positions, assert at most64 selected-record reads and no all-history/all-entity fetch; report actual runtime, maximum plan/row bytes and record/page counts without claiming production throughput. Verify missing, cross-scope, digest-inconsistent or stale selected facts fail closed; the trusted repository port remains an authentication boundary and hashes do not prove authenticity and bounds reject atomically at the pure-plan boundary. Run existing Working Graph/public-entry/event/identity/causal tests and component boundaries. No SQLite production-store claim, live host collection, private trace, model call or external traffic is part of this proof.",
      "identity": "sha256:e63aef716284489bb1ca00bf7ee94f3c8282f722353a804ba5695bffd15b6999",
      "revision": 1,
      "state": "active"
    }
