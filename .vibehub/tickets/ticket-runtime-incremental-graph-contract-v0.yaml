  "constraints": [
    "Implement only inside semantic-runtime/ with existing independent core/public-entry boundaries; no new database, ORM, dependency, HTTP endpoint, polling worker or generic storage framework.",
    "Do not remove or increase V1 fixture bounds as a substitute for an incremental contract; do not use automatic generation rollover to hide global capacity or erase provenance/access history.",
    "Preserve accepted entity/relation/conflict/provenance/current-access/epoch semantics and separate canonical authority. Models and hashes do not confer acceptance or source authenticity.",
    "Pure selected-record conformance proves semantics and bounded lookup behavior, not crash durability, source permission administration, host enrollment or production scale. The existing graph-store Ticket remains draft until this exact prerequisite Outcome is reviewed.",
    "Use synthetic selected fixtures only; no private traces, credentials, live models, remote services or changes to root/plugin/site artifacts."
  ],
  "context": "Required prerequisite discovered while refining graph-store, not a replacement for its production persistence obligations. The accepted wire-v1 reference implementation validates an entire immutable catalog plus state.snapshots (at most128); each snapshot carries cumulative arrays bounded at512. Persisting those fixtures, or storing deltas and reconstructing the same full state for every operation, still limits a Project to127 semantic transitions and is not a usable local alpha store. Do not solve this by increasing constants, silently resetting generations, discarding historical ACLs or labelling a commit-chain hash as a wire-v1 snapshot digest. A local read-only measurement of16 independent fixture assertions took about4.5s and produced1,032,544 JSON bytes/17 snapshots; this is illustrative environment-specific evidence of cumulative growth, not a performance target or production benchmark.\n\nImplement only the smallest provider/store-independent incremental contract and selected-record in-memory conformance port inside semantic-runtime/. Keep the existing V1 API/fixtures unchanged as a bounded semantic oracle. The new version must specify exact inert wire schemas for an immutable scoped graph commit/manifest, exact semantic revision/address compatibility, per-command expected-graph and semantic-base requests, delta writes, current projection CAS requirements, source/access/canonical provenance references, catalog/enrollment version pins, source watermarks and page cursors. The contract should reuse current immutable SemanticRevision/provenance validators where compatible; do not replace the relation vocabulary, conflict policy or authorization semantics. Suggested port facts are exact committed head/revision lookup, entity head at a selected commit, unresolved conflicts at that commit, accepted event body/digest, current source-access restrictions, explicit identity/enrollment facts and bounded page reads. The trusted adapter supplies those facts under one coherent scope/transaction; caller-authored JSON cannot certify a projection or source authority. A coherent malicious repository response is outside a pure function's authentication power: validation must reject inconsistent/missing selected facts, while the adapter authenticates and selects them. Do not promise that hashes authenticate an arbitrary port. Concrete names can follow repository conventions.\n\nAvoid a generic query/ORM/event-sourcing framework. One graph commit remains a local ordered immutable transition; use stable exact references and an indexed lookup/step protocol, not a cumulative all-entity snapshot body. The output is a deterministic bounded mutation/effect plan: immutable records to append, projection keys/expected versions to update, audit/receipt/outbox descriptors, and an exact next graph address. A stale graph CAS returns the original unapplied proposal and no writes; an admitted semantic base mismatch retains competing revisions/conflict. The later DomainStore adapter owns actual atomicity and receipts. A source lifecycle command has separate explicitly authenticated authority over its targets, which the port must attest; membership, model confidence or a recent timestamp is insufficient. Historical content reads always use current source restrictions and opaque caller identity supplied by the adapter.\n\nPin byte/depth/node and per-command reachable-support bounds compatible with the selected store; bounds apply to each request/row/closure/page, not total Project lifetime. Define a concrete maximum page size64 and scope/generation/exact-commit/collection/position-bound cursor schema. Cursors are locators, never credentials. Point lookup and pages must not materialize every earlier commit or every entity. Keep exact historical membership and predecessor-only source epoch admission, including old restrictions after later watermark changes. Dynamic enrollment is an explicitly versioned input, preserving old catalog/event references; do not build the live Session/Execution enrollment service in this Ticket. Current Git enrollment's empty host arrays remain a truthful integration boundary.\n\nThe required1040-step synthetic conformance trace spans at least600 distinct entities/relations and crosses both legacy thresholds in the same generation without resets or discarded history. Constant-support operations at early and late positions must use no more than64 selected-record reads and must not request an all-history/all-entities collection; bounded page iteration is separate from command admission. Small traces compare actual semantic results with the existing V1 oracle. Different new commit/address digests must be explicit versioned behavior rather than a false byte-compatible promise. Current-vs-historical ACL, tombstone and conflict semantics remain identical. Define how the subsequent SQLite adapter stores immutable per-record sources plus a small CAS head/projection and rebuilds by bounded pages/checkpoints; do not implement that adapter or a checkpoint engine here.\n\nThis candidate is planning only. Parent owns ongoing Room alignment and prioritizes the local App setup independently. No human product choice is manufactured; the missing incremental contract is an ordinary concrete engineering prerequisite.",
