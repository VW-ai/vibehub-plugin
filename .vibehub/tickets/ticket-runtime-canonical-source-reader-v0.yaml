  "active_contract_revision": 2,
  "constraints": [
    "Implement within semantic-runtime/ with its own dependencies, build, tests and release; host/source integrations consume public contracts and never import sibling plugin internals.",
    "Retain existing replay/provider behavior, run affected contract tests and component boundary checks; release composition also runs standalone and plugin artifact checks. Do not rebuild completed Phase 0 work.",
    "Fast judges and workers produce auditable candidates/proposals; canonical writes require explicit authority and concurrency checks. Do not infer acceptance from model confidence.",
    "Use synthetic or explicitly selected, destination-authorized input for live calls; credentials stay outside Context, logs and Git. Existing Peel authorization is not blanket authorization for new sources or destinations.",
    "Use existing Runtime namespaces and storage; no new dependency/table, generic registry or transaction callback API. Export CanonicalSourceReader({store,authority,repository_path,execution,registration_id,selection}), refresh(context,{epoch,publisher_ref,expected_graph,previous_selection,commit_oid,idempotency_key,observation}) and resolve(context,{at,address}). selection fixes schema_profile, selection_id, trusted source-policy identity and exact record/ID/path bindings. observation fixes producer sequence/timestamp pins; document its exact inert shape and derived retry-key algorithm in semantic-runtime/docs/canonical-source-reader-v0.md. Keep the optional Graph expected_source_fence extension compatible when omitted.",
    "JSON-as-YAML supports the referenced schema versions only. Ordinary YAML, legacy/reconstructed acceptance bindings and unsupported governed segment forms are explicit unsupported states, not guessed conversions. Reject duplicate JSON keys, invalid UTF-8/nonfinite values, unknown fields and non-inert API inputs without payload diagnostics. Runtime owns independent validators and sanitized fixtures: no sibling implementation imports or hard-coded repository records. Room stale/alignment remain recorded freshness claims; inactive Authority or unavailable same-commit artifact proof affects governing usability, but stale Room alone does not.",
    "Bounds: 1..16 record files; 32 total unique selected paths including Authority artifact entries; 64 KiB per record and 256 KiB aggregate record bytes; 16 path components; 1 MiB per tree and 4 MiB aggregate raw Git-object bytes; 128 Git subprocesses, 10 seconds each and 30 seconds cumulative Git-I/O time. Cache selected verified objects within a call; no recursive ls-tree/diff. All existing stricter ingress/DomainStore/Graph depth/node/32-support/1 MiB row-plan-response limits still apply, including overhead, and reject atomically rather than truncating or enlarging limits.",
    "GitProvenance currently discovers its object directory through source rev-parse. The reader must enter the hardened scratch view immediately using actual enrolled checkout/common-dir/worktree metadata and known format (a narrowly trusted object-directory option is allowed), verify physical enrollment membership, and never accept an arbitrary client object path or load source include/helper configuration. Preserve the existing adapter API. Do not claim an OS sandbox against privileged filesystem swaps. Git payload remains {kind:git_revision,object:git_commit,path,digest}; tree/blob/artifact-entry and absence proofs belong in typed bundle data.",
    "Provide a narrow authenticated DurableIngress.getRegistration(context,{registration_id}) if needed to read current registration/version without expanding cursor/events; retain existing getSource and source/object guards. Revoked historical objects must not be expanded merely to authorize a new allowed commit. Publish with coverage:null, preserving existing Graph coverage semantics and current authorization; never reset unrelated coverage or bypass it. Bundle source watermark means only exact selected admitted observation/receipt positions, with no new cursor completion or caught-up claim. Config policy changes use a new explicit selection identity; current/historical materialization still checks actual source access and typed fence freshness.",
    "Each refresh has one Graph assertion, no per-record publication stages. events/canonical_refs include every current selected support; base_revision is lineage only, without accumulated prior parents. Durable ingress receipts may remain after failed publication; exact retry reuses them only after pin/access checks, without ACK. New refresh requires current activation; an already committed exact retry may follow existing authorized disabled-read semantics without fresh Git reads, but must still reject a stale fence as a successful current result. Generic receipt metadata is not a current-content claim. Reader current means the selected Graph revision, never proof of current filesystem/branch-tip freshness; resolve separately labels historical and quarantined results.",
    "Run cd semantic-runtime && node --test test/canonical-source-reader*.test.mjs test/git-provenance*.test.mjs test/durable-ingress*.test.mjs test/graph-store*.test.mjs test/graph-source-invalidation.test.mjs test/source-invalidation*.test.mjs; npm run verify; npm run verify:standalone. From repository root run npm run verify:artifact and git diff --check. All acceptance fixtures use temporary selected synthetic projects with no provider call, source fetch, private trajectory or user repository mutation."
  ],
  "context": "读取并投影已有 canonical Git 记录. Refine from successful Git provenance Contract 1 and source-invalidation Contract 2; consumed Graph Store/DurableIngress Contract 3 remain implementation context. Deliver one explicit selected commit -> actual immutable ingress observations -> one bounded atomic canonical-selection Graph assertion. The owner supplies repository/execution/source registration and a canonical path/ID allowlist. Existing sources and historical structured citations remain intact. Scope excludes recursive import, per-record Graph staging, a registry/scheduler/daemon, source ACK/completion, model inference, host/App wiring, branch adoption and canonical writes. The JSON-as-YAML source subset is deliberate; later consumers can use the typed bundle and exact canonical refs without a new ontology or persistence protocol.",
