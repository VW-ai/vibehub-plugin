      "acceptance_id": "canonical-reader-contract",
      "criterion": "Export CanonicalSourceReader and bounded GitProvenance.readFileAtCommit({commit_oid,path}) for an explicitly enrolled repository/execution and owner-configured canonical path/ID allowlist. Support profile vibehub-records-v1: UTF-8 JSON object text in .json/.yaml files using public Context v1, Room v1, bound Ticket v3 and native-bound Evidence/Outcome v2. Independently validate the referenced schemas, exact Acceptance/Contract identities, selected record IDs, revision membership, Evidence coverage and Outcome status; human acceptance requires exactly bound human-origin Evidence with its input citation. Record origin/independence remain checked-in claims, never authenticated approval or model-assigned authority. Verify full commit, selected tree-chain and regular blob hashes without source configuration, network, worktree text or source writes, retaining exact tree/blob/digest pins and distinguishing proved absence from unavailable objects. Canonical-path authority requires explicit trusted configuration plus actual caller/enrollment/source grants. Authority rules/artifact paths are validated at that same commit; Room stale/alignment metadata is retained as a freshness claim and cannot itself revoke valid governing rules. Map the complete bounded selected records and exact canonical refs into one actual Graph canonical-selection assertion, supported solely by actual DurableIngress normalized events; initial Graph lifecycle stays candidate and no canonical promotion occurs.",
      "identity": "sha256:8788657cc930e447614fd0cc1c04e2dbca5ae8d2360cac7d2fb45baf8d1a2baf",
      "presentation": {
        "label": "canonical-reader-contract"
      },
      "revision": 2,
      "state": "active"
    },
    {
      "acceptance_id": "canonical-reader-lifecycle",
      "criterion": "One explicit refresh revalidates the entire configured selected closure at one immutable commit, admits deterministic per-record git_revision observations, then publishes exactly one atomic LocalGraphStore assertion with expected_graph CAS. The bundle binds config/request identity, selected commit, exact per-record provenance, usability states, selected admitted-source positions and project fence; every selected binding input is a supporting event, while the prior bundle is base lineage only. Invalid/unsupported records cannot serve old text as current. Deleted files become tombstoned path projections with verified tree absence and whole-commit path:null/raw-commit-digest events, never fabricated blobs or Git-commit source tombstones. Same-selection refresh allows only the same commit or proven descendant of the exact prior selection; rewind/divergence/unknown ancestry leaves it unchanged, with historical/divergent reads requiring an independently explicit selection. Authorize before byte reads and content returns. Add fixed optional expected_source_fence to Graph mutation identity and check it inside the transaction before effects/precommit and on duplicate/reconcile paths; a changed fence conservatively rejects/quarantines. Consult Graph/ingress receipts before read/retry, reuse only exact deterministic pins under current ACL/fence, reject changed keys, and preserve admitted facts but no new selection on failed publication. Never ACK/complete ingress. Exact reads distinguish current, historical, quarantined and unavailable; retained structured citations survive restart/source GC under current permissions with no latest fallback.",
      "identity": "sha256:850090b88539f087dc41c84aed7c10681dbbf67afe2f121a3639abd3ca0cff47",
      "presentation": {
        "label": "canonical-reader-lifecycle"
      },
      "revision": 2,
      "state": "active"
    },
    {
      "acceptance_id": "canonical-reader-fixtures",
      "criterion": "Use temporary existing-project Git/SQLite fixtures and the actual enrollment, activation, ingress, Graph and invalidation APIs. Cover bootstrap/restart; changed authority/Acceptance and stable presentation-only hashes; valid historical versus forged/misbound Outcome; human-authority Evidence; stale Room retaining governing rules; unavailable support/artifact; unsupported source forms and duplicate JSON keys; deletion, symlink/gitlink, corrupt/missing objects and unchanged source metadata. Cover descendant/rewind/divergence/incomplete ancestry; captured/current ACL and a new allowed commit after an older object is revoked; revocation during reads and cross-process fence movement before publication; stale-fence retries/reconciliation/resolve; activation disable/re-enable; exact/changed retries; crash after partial ingress before publication and lost reply after atomic publication. Verify unchanged semantic selection on failure, historical citations and no ACK/completion. Exercise the documented record/path/byte/Git-I/O and existing Graph plan/closure limits without truncation or enlarged upstream caps. Adding at least 1000 unrelated files must not add selected file/blob reads or a recursive project scan. Run focused suites, full Runtime/boundary and clean standalone verification plus separate plugin artifact isolation; record bounded counts/bytes/local timings, with no model or live host/App integration claim.",
      "identity": "sha256:26fbee68a85713ac6a9c603b6837ba290d18107486dec7783b754bc206d8540a",
