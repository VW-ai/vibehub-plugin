    {
      "acceptance_id": "protocol-addressable-context",
      "criterion": "Core contracts define stable Context identity, immutable ContextVersion identity, canonical and exact-version references, Proposal identity with base_version_id and workstream scope, Conflict identity, provenance, authority, and lifecycle states; references are deterministic and remain resolvable after later versions exist.",
      "identity": "sha256:c736bb6dceaa4887dbef8c480a9818a1786b899ac6949b6346596ab8d4572cc5",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "protocol-promotion-reconciliation",
      "criterion": "A pure transition layer implements optimistic promotion semantics for unchanged, orthogonal, equivalent, stale, contradictory, and authority-protected proposals. Contradictions preserve both candidate heads, mark the accepted Context contested, and require an explicit resolution version rather than silent last-write-wins.",
      "identity": "sha256:8e62c932f293c695155f9d1f8ded1b714b3eaf2ef4dbf85a9fbf4493e2f0309b",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "protocol-multi-agent-fixture",
      "criterion": "A deliberately small fixture with one Project, two Repositories, two concurrent Executions, compatible changes, a contradictory Context variation, per-repository watermarks, and a resolution proves the contract end to end and rejects cross-tenant, cross-project, stale-base, and unauthorized promotion.",
      "identity": "sha256:c358d3989bbae6b1d545d8f223dc119854f6eeaed1b66a320832ac14e2b591da",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "protocol-runtime-boundaries",
      "criterion": "The protocol is documented as the online v0 handoff, existing offline replay and provider adapters remain compatible, Semantic Runtime verification and standalone verification pass, and the existing Skill plugin artifact remains isolated.",
      "identity": "sha256:3e34128d449d429a0d5285290270e7b4efd5045cc4c7bf9740a1289f74b1ecf8",
      "revision": 1,
      "state": "active"
    }
  ],
  "active_contract_revision": 1,
  "constraints": [
    "Keep semantic core independent of HTTP frameworks, database clients, deployment hosts, model providers, and existing plugin implementation code.",
    "Do not implement a general CRDT or branch the whole project graph; version and reconcile the smallest Context object that changed.",
    "Do not let a fast judge silently create or replace canonical truth.",
    "Preserve the existing Phase 0 audit and evaluation contracts while adding the online protocol as a separate layer."
  ],
  "context": "The offline replay proves bounded semantic judgment, but the online alpha needs a stable domain and concurrency protocol before storage or UI choices become implementation facts. This Ticket owns that protocol and its executable core tests; it does not deploy a service.",
