  "context": "The owner wants the install story to feel like the current generation of agent tools (for example heygen-com/hyperframes: npx skills add <repo> for agents plus npx <tool> init for the project), instead of three host-specific marketplace commands. An empirical test on 2026-08-22 showed that npx skills add VW-ai/vibehub-plugin already copies all eleven skills into .claude/skills/ (and .agents/skills/ for Codex and Cursor) but silently omits skills/vibehub-core/scripts/ and skills/vibehub-core/contracts/ because they carry no SKILL.md, so every copied Skill's ../scripts/vh.mjs and ../contracts references break. The plugin is deliberately dependency-free Skills plus one helper script, with no global CLI, MCP server, daemon, or background activation, and the owner wants zero ongoing Agent load. Candidate directions include: (a) make the shared helper reachable by every skill after a skills.sh copy (for example a bootstrap that locates or fetches vh.mjs, or restructuring so each skill is self-contained); (b) publish a small npm package so Skills call npx vibehub <command> and humans run npx vibehub init, with version pinning between Skill text and package; (c) keep marketplaces as the only supported path and document skills.sh as unsupported. The owner also asked that the GitHub Issues mirror (scripts/sync-github-issues.mjs and its workflow) become an optional, one-time choice offered during project setup rather than something an Agent runs later.",
