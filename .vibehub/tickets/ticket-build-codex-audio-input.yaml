  "context": "Both prerequisites hold successful Outcomes. The pinned 0.149.0 protocol carries ordinary audio and localAudio Turn inputs with no format constraint and no transcription notification: an ordinary audio input reaches the model as an input_audio content part, while transcript events exist only on the experimental realtime sideband whose live probe still reports protocol-present-current-ephemeral-thread-unsupported. Codex desktop's voice affordance is dictation into text, which would require a transcription loop this product forbids, so the shell's voice input is honest audio attachment: record, review as a removable chip, send as the stable audio data URL input inside one ordinary Turn. The prototype microphone survived into the production Composer with getUserMedia, MediaRecorder, a 90 second cap and an 8 MiB bound, but has no visible timer, no true cancel, and only a transient toast on permission denial. One seam is unverified: whether the backend accepts MediaRecorder mime types through the audio data URL, settled by one ephemeral live probe recorded in the lock. DSH audio stays unsupported and realtime stays hidden behind the capability truth.",
