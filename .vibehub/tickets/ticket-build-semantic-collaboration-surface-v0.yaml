      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "explorer-causal-inspection",
      "criterion": "Show producer/session/worktree/ref/code revision, Context semantic role/applicability/rationale, selected shared base, origins/variants/adoptions/supersession, evidence/source watermarks and audit links from actual domain APIs. Scope-local supersession does not imply Project-wide invalidity; code merge and Ticket completion are not automatic semantic acceptance. Keep authorized history after workspace removal and distinguish archived UI state from lifecycle change.",
