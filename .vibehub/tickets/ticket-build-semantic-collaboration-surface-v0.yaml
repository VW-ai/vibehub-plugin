    {
      "acceptance_id": "local-app-composition",
      "criterion": "Compose the delivered local app onboarding shell with actual Project/exploration/Room APIs: select enabled Project, inspect all linked branch/worktree contexts, Ticket origin/participation/completion and Worker processing status. Preserve goal/constraint/acceptance-focused Tickets with optional development skills, and show disabled/stale state without deleting history.",
      "identity": "sha256:f42d8be942cf5df04c1760170c672b5e76194f81438ff052c2e54105eb2e96dc",
      "revision": 1,
      "state": "active"
