    {
      "acceptance_id": "workspace-ticket-lifecycle",
      "criterion": "Use the actual Ticket workspace-management API to show creation, participants, execution-finished and independently accepted locations with exact versions; filter current relevant versus Project/all/history and hide/restore without global mutation. A-create/B-execute/C-review, unknown legacy origin and deleted-workspace history stay understandable; authorized external blockers remain visible.",
