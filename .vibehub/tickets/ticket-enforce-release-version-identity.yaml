 "context": "Direction only; the enforcement cannot be specified before the policy exists. Two facts already bound it. First, whatever gate lands must key off scripts/build-plugin-artifact.mjs's allowlist for what counts as shipped content rather than inventing a second list. Second, a staleness check that a user can run has to ship: PLUGIN_PATHS does not include scripts/, so a check placed there never reaches an installed user, and the refinement must either place it under skills/vibehub-core/scripts/ or state plainly that it is maintainer-side only. The decision this Ticket depends on determines which of these is even needed: a content-addressed distribution policy makes the CI bump gate unnecessary, while a bump-per-change policy makes it the whole deliverable. One input changed materially after this Ticket was planned. finding-npx-updates-by-content-not-by-version establishes that skills.sh never reads a declared version and updates by content hash or unconditional re-fetch, so once marketplace distribution is retired the silent-staleness failure this Ticket was written against cannot occur on the surviving path. Refinement must therefore start by asking whether a CI bump gate is still warranted at all, and if so on what grounds — release metadata that a human reads, and a version a migration entry can be keyed to, rather than protecting a user from running stale code. A staleness check that a user runs is likely to be unnecessary outright.",
