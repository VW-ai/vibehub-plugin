      "acceptance_id": "anchors-normalized-before-collision",
      "criterion": "Anchors are normalised to a canonical repository-relative form before collision is decided, so `.`, `./docs`, `docs/`, and `docs` are compared as the territory each actually denotes. Two Rooms whose normalised territories overlap are rejected at `room put` and by `project validate`, with the existing overlapping-territory message."
    },
    {
      "acceptance_id": "repo-root-anchor-is-honest",
      "criterion": "A Room anchoring the repository root is either rejected, or accepted and then genuinely treated as owning everything — including colliding with every other anchored Room. Whichever is chosen is stated in the room schema, and the current silent middle where it owns files without colliding is gone."
    },
    {
      "acceptance_id": "empty-territory-anchors-are-reported",
      "criterion": "An anchor that denotes no territory — `#`, `/`, and any other form parsing to an empty path — is rejected at write, or reported in `unresolved_anchors`. It is never silently accepted and then filtered out of the missing-anchor report."
    },
    {
      "acceptance_id": "vibehub-internals-not-anchorable",
