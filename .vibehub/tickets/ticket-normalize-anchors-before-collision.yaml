    {
      "acceptance_id": "anchors-normalized-before-collision",
      "criterion": "Anchors are normalised to a canonical repository-relative form before collision is decided, so `.`, `./docs`, `docs/`, and `docs` are compared as the territory each actually denotes. Two Rooms whose normalised territories overlap are rejected at `room put` and by `project validate`, with the existing overlapping-territory message.",
      "identity": "sha256:8299c5d66b009a785b8c13cf04808e6937922e5822fe0b05b70ce0d3c24cbc94",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "empty-territory-anchors-are-reported",
      "criterion": "An anchor that denotes no territory — `#`, `/`, and any other form parsing to an empty path — is rejected at write, or reported in `unresolved_anchors`. It is never silently accepted and then filtered out of the missing-anchor report.",
      "identity": "sha256:c5f8eca2fe987062a1a34d35ee0d526c0e7e62ce53c31c53f3eb7eebf19aac3d",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "existing-anchors-unchanged",
      "criterion": "Every Room checked in today keeps validating with identical drift, coverage, and alignment output. Normalisation changes which anchor forms are recognised as equivalent, not what any current anchor means.",
      "identity": "sha256:ef897d8d679a93ad5577f55d8ab1c6b1b79fd71350fe447aab2971732bef8255",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "regression",
      "criterion": "Tests cover `.` against `docs`, `./docs` against `docs`, a trailing slash against its bare form, `#` and `/` as whole anchors, an anchor reaching into `.vibehub/`, and the full existing Room set validating unchanged.",
      "identity": "sha256:c085164a8d44e324d8e48b0d0cad5564a4eefe093ddd6d09c2da4a101d44a5a2",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "repo-root-anchor-is-honest",
      "criterion": "A Room anchoring the repository root is either rejected, or accepted and then genuinely treated as owning everything — including colliding with every other anchored Room. Whichever is chosen is stated in the room schema, and the current silent middle where it owns files without colliding is gone.",
      "identity": "sha256:821ac5d92f9d1226056a0efbd68391c172eab89e1e2560be9b874771e58656ba",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "vibehub-internals-not-anchorable",
      "criterion": "An anchor cannot draw `.vibehub/` documents into a Room's coverage territory; Room, Context, Evidence, Outcome and Ticket documents are not source material to be absorbed.",
