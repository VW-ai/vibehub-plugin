  "context": "Found by adjudication, and pre-existing rather than introduced: anchorsCollide compares anchors as strings, so a Room anchoring \".\" and a Room anchoring \"docs\" are judged non-overlapping while both in fact own docs/. Reproduced — both room put calls succeed, project validate returns valid:true, and context coverage shows the two Rooms owning the same file; the \".\" Room additionally owns .vibehub/ internals. That is exactly the defect the overlapping-territory rule exists to prevent, reached through an anchor form the rule does not normalise. A related family escapes a different check: \"#\" and \"/\" parse to an empty path, own nothing, and are filtered out by anchoredTerritory before the missing-anchor report, so they are neither honoured nor flagged. Both behaviours are identical before and after the last-hash parse fix.",
