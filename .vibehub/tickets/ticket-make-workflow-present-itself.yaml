  "active_contract_revision": 1,
  "constraints": [
    "Move quickly and replace duplicated prompt logic directly; do not build a general Prompt framework or compatibility layer.",
    "Keep the shared lifecycle reference short enough to read whenever a Ticket Skill triggers; detailed prose and duplicated policy are defects.",
    "Test observable ownership and behavior contracts, not exact paragraphs or model phrasing.",
    "Do not add a new lifecycle state, background hook, dispatcher, daemon, service registry, PID file, persistent cache, database, or cross-task host discovery protocol.",
    "Do not turn UI presentation into an implicit approval gate: only an explicit protected human boundary pauses execution.",
    "Keep the local UI read-only and retain the short-lived bearer in the URL fragment.",
    "Explicit Ticket Review remains supported as a fallback but is not the primary user path."
  ],
  "context": "Dogfood showed that the local graph is useful but still behaves like a tool the user must remember to request. The owner wants the Ticket workflow itself to present the UI at the right moments and also identified that prompt behavior becomes unmanageable when lifecycle rules are duplicated across Skills without unit-like checks. Treat the Skills as one distributed program: define one concise shared lifecycle/ownership contract, let each Skill own only its transition, route all UI presentation through Ticket Review, and test observable trigger behavior rather than exact prose. Plan/apply may present a newly created graph without inventing an approval gate; routine READY execution remains quiet; protected human attention presents the exact Contract; successful or non-successful closeout presents Log; PR review can present the branch graph. Explicit Ticket Review remains a fallback. The launcher may add narrow mechanical focus parameters, but no background hook, prompt runtime, daemon, registry, cache, or second lifecycle is authorized.",
