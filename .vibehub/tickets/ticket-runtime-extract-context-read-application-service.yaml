  "constraints": [
    "Preserve the exact metadata, planning and final-snapshot order and all callback-before/callback-after authorization checks; do not weaken the current revocation race defenses.",
    "Preserve original domain error codes across DomainStore callback wrapping, including context_transition_invalid and all current Context, Exploration, Graph, canonical and storage codes.",
    "Do not move or change Context mutate, adopt or receipt flows; Exploration bind/mutate/adopt/selection; Graph initialize/mutate/read/rebuild; Query or Judge behavior; SQLite schema/SQL; providers; secrets; CLI, HTTP or UI.",
    "Do not introduce a generic dependency-injection container, repository interface, event bus, transaction abstraction, new public export or new durable compatibility shim.",
    "Keep the new boundary under src/local for this seam-proving Ticket; moving it to src/application/context is a later path-only migration after the boundary is independently accepted.",
    "Ordinary verification stays offline and deterministic; no credential, Keychain lifecycle, host, network, provider or live JEV call is authorized."
  ],
  "context": "LocalGraphStore still mixes Graph, Exploration and Context use cases. Its typed Context read path is the smallest safe leaf because it is read-only yet already has a complete three-snapshot authorization workflow. Extracting that workflow establishes the first real Context application boundary before any directory move. The service must own its synchronous DomainStore read snapshots and reuse the exact canonical, ContextInputs and ExplorationInputs instances from the existing graph service bundle; it must not receive or expose a transaction handle, call public Graph operations, or touch the shared write transaction.",
