    {
      "acceptance_id": "activation-authority",
      "criterion": "Expose a small documented local ProjectActivation API backed by the accepted DomainStore and LocalCredentialAuthority. Reads and explicit set-enabled/set-disabled commands derive exact tenant/Project from an opaque current context, require separate activation read/write grants plus needed store actions, and restrict switch mutation to trusted human/App-service principals; a host-adapter/worker cannot toggle merely because it can submit events. An absent activation record means disabled, epoch 0. Persist versioned enabled state, a monotonically increasing safe-integer activation epoch and immutable transition sources; each actual enabled/disabled transition advances the epoch, while a same-state command with the current expected version is a no-op. Caller expected-version CAS rejects stale commands without partial history/outbox writes; a lost response is reconciled by reading authoritative state, not replaying an unbounded command ledger. Enable requires a current enrolled Git Project; disable remains possible even when its enrolled paths are unavailable. Read GitProjectRegistry membership from the same DomainStore transaction for authority-bearing checks, never from client path/ref assertions or a stale snapshot. Existing and newly registered worktrees inherit their Project switch without duplicating per-worktree switches; validate referenced repository/checkout/worktree IDs against current active membership when admission carries execution provenance. Persist across restart, keep Projects/tenants independent and preserve enrollment historical-assurance limits. Plugin installation, source text and conversational inference never enable a Project.",
      "identity": "sha256:943240bafabf364e345f9e586deb651ddae7dc04958d42ff92ba517580988f70",
      "revision": 2,
      "state": "active"
    },
    {
      "acceptance_id": "disable-fencing",
      "criterion": "Provide a composable synchronous admission transaction wrapper for the four stages capture, dispatch, result and delivery. It owns one accepted DomainStore transaction, rechecks opaque context/action/scope, current enabled state, exact caller-captured activation epoch and applicable enrolled execution IDs, then gives the authorized transaction to a trusted bounded callback so its record/source/outbox effects commit with that check. Missing/wrong epoch, disabled Project, invalid membership or denied/expired/revoked context rejects before the callback; async callbacks, stale handles and exceptions cannot leave partial effects. The epoch is a freshness fence, never authentication, a Job attempt fence or permission to skip current source ACLs. Disable atomically advances the epoch and appends a durable cancellation notice with its transition; older epochs remain rejected after re-enable. Show a real SQLite race/rollback fixture proving that effects committed before disable remain historical and a stale result or queued-delivery commit after disable produces no semantic mutation/delivery intent. Define one trusted App cancellation coordinator as the sole owner of the activation outbox: it processes bounded queue batches with durable progress, uses existing Worker cancel/expire transitions and atomically acknowledges the notice only after the relevant local queue updates/checkpoint commit. Acknowledgement is local processing/handoff, not proof a remote/model process stopped. Test restart and duplicate notice processing using synthetic queue state and the existing Worker protocol. Do not build the coordinator loop or production queues here. No network/model/host call occurs inside a SQLite transaction; consumers must recheck immediately at their actual dispatch/injection boundary, propagate cancellation and reject late results. A process/send already started before disable cannot be recalled by this module, and a committed delivery intent is not host receipt. Document these limits rather than claiming global instantaneous cancellation.",
      "identity": "sha256:99e3f419227beea36feee02325533d10637b736744c3a3ec994ed9cd65b170b3",
      "revision": 2,
      "state": "active"
    },
    {
      "acceptance_id": "reenable-gap",
      "criterion": "Re-enable persists the new epoch and closes the recorded disabled interval with explicit no-automatic-backfill semantics; retained sources and already completed semantic history remain unchanged. Expose actual transition/gap references in the read API without claiming capture continuity for app outages or intervals never observed. Old capture/dispatch/result/delivery envelopes keep their original epoch and cannot be silently relabelled. Specify and test the bounded recovery protocol with synthetic queue fixtures: default is leave pre-disable pending work cancelled/fenced; any recovery requires an explicit selected list of at most 64 previously persisted pending-work references, current enabled epoch, fresh source/access/base validation and new request/Job identities linked to the old work. Worker terminal states never reopen and already completed work is not replayed. A reference list is a recovery request, not permission to import disabled-period/private raw sessions; no directory/session scan or automatic disabled/outage backfill is implemented. Recovery queue composition and live consumer integration remain owned by later runner/ingress/delivery Tickets. Temporary SQLite plus Git fixtures and public-entry tests cover explicit enable/disable, unknown and newly registered worktrees, tenant/Project isolation, stale cached epoch, disable between admission and later result/delivery, cancellation duplicates/checkpoints, outage/closed store, process restart, CAS races, rollback, and re-enable with rejected old work. Prove the admission callback is not invoked on denied paths and native coding remains independent of Runtime availability. Document bounded input/error behavior and run affected auth/store/enrollment/Worker tests plus component boundary checks. No scheduler, Collector, provider/model call, plugin install, UI, HTTP pairing, background watcher or separate database is delivered by this Ticket.",
      "identity": "sha256:362c12cf851bde655bab1261bb59261f809d055b1430f93d0e9487cb0d2d5cf7",
      "revision": 2,
      "state": "active"
    }
