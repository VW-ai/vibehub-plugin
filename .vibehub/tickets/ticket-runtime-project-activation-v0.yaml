    {
      "acceptance_id": "disable-fencing",
      "criterion": "Disable rejects new capture/dispatch/delivery, pauses or cancels queued work, and prevents delayed pre-disable results from changing semantic state or injecting context. Define crash-safe epoch/fencing and cancellation acknowledgements with existing request/job protocols; already completed state stays historical.",
      "identity": "sha256:ac2fec6b9ccc9db6a31d15983820e782ddf9a951db5060e37cc386e3773c12b2",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "reenable-gap",
      "criterion": "Re-enable exposes disabled-period gaps and an explicit bounded pending-work recovery choice; never silently backfills private sessions. Tests cover disable during ingress/dispatch/result/delivery, stale plugin cache, app outage, restart and new worktree. Ordinary coding continues throughout.",
      "identity": "sha256:29022dfc9212b4d665dd81fe8dc911a815571909ea4ed8e295a12e998eef32f8",
      "revision": 1,
      "state": "active"
    }
