  "context": "Local L1 API foundation only. Reuse one DomainStore namespace (project-activation) for a small current-state record, immutable transition sources and cancellation outbox; no new database, generic state-machine framework, queue registry or scheduler. Candidate API names are get(context), setEnabled(context, { enabled, expectedVersion }) and withAdmission(context, { epoch, stage, execution? }, tx => ...); exact names are ordinary implementation choices. Use explicit activation:read, activation:write and activation:admit grants alongside store:read/store:write and any Git registry read action. The trusted process constructs GitProjectRegistry and activation around the same DomainStore so its documented registry read inside the transaction shares the lock/snapshot. Registry reads perform no Git subprocess; absent/unavailable/removed mappings never gain authority from a client path. Project-level operations need not invent a worktree; consumers that require execution provenance must provide and validate the full enrolled ID tuple. The persisted epoch is independent of DomainStore row version and Worker attempt fencing; it changes only on actual switch transitions, never from model/source instructions. Safe integer exhaustion or malformed persisted state fails closed. Transition time is trusted display/audit metadata, not an ordering substitute for epoch/CAS. Disable need not scan every queue atomically: its epoch fences all conforming commits immediately and its durable notice drives eventual queue cancellation. The sole App coordinator owns acknowledgement; individual collectors/workers cannot prematurely consume a shared cancellation notice. A fixture coordinator may persist a bounded cursor/receipt and cancel synthetic Worker states through their existing pure transitions, but this Ticket does not implement its live loop. Recovery is a documented/tested consumer protocol over selected pre-disable persisted work, not a new recovery scheduler or arbitrary callback dispatch API. Existing Worker wire v1 remains immutable: activation metadata belongs in the local stored envelope alongside the exact Job/ref/digest and is not accepted as a model-supplied field. The Agent Work Request Ticket is still planned, so describe its analogous terminal/new-request rule without inventing a shipped request API or adding that independent foundation as an execution prerequisite. Later ingress/Judge/runner/session-delivery Tickets already own applying this gate at their real boundary; completion here proves the API and synthetic composition, not a fully activated product. Preserve normal coding on store/app failure. Planning may proceed now, but implementation remains blocked until the preserved Git enrollment prerequisite has a successful independently adjudicated Outcome; inspect its final API then and revise this candidate if that API differs.",
