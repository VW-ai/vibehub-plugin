    {
      "acceptance_id": "auth-identity-contract",
      "criterion": "Implement local human/host-adapter/service authentication, credential audience, expiry/revocation and no model-provider credential reuse on the accepted local profile. Define connector/Worker identity kinds and conformance rules for later enrollment without requiring their live infrastructure. Localhost is not itself sufficient authentication.",
      "identity": "sha256:dff5bc80467a1bfc649a8c648ab63a22d17f06dd343aad2ea4baf3464416752e",
      "revision": 2,
      "state": "active"
    }
