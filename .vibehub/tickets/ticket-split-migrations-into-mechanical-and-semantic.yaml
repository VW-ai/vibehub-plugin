  "context": "skills/vibehub-migrate/references/migrations.json is the single versioned source of migration guidance, and every one of its entries is an undifferentiated list of Agent-facing prose steps. The steps are not undifferentiated in nature. In the format-1-to-format-2 entry, raising every Ticket document from schema_version 1 to 2, adding an explicit deliveries array, writing .vibehub/version.yaml with format_version 2, and proving compatibility and validation pass are all deterministic; classifying each Ticket's delivery membership from exact reviewable history, which the entry explicitly forbids inferring from status, branch name, filename, or prose, is judgment. The entry already permits an empty deliveries array when no authoritative delivery can be established, so the deterministic steps alone yield a structurally valid, writable format-2 project. The cost of not separating them is concrete and currently being paid: Undercurrent on the owner's machine is write-blocked at format 1, waiting on an Agent for work that is almost entirely mechanical. nomi is a harder case in the same shape, since its 0.4-to-0.5 entry genuinely needs judgment — building a Room tree and placing 19 flat Context entries into the lowest room that owns each claim — but even there, writing version.yaml and rewriting refs are mechanical once the placement is known. This Ticket implements decision-migrations-declare-mechanical-and-semantic-halves. It changes the shape of the migrations reference, adds an engine path that executes the mechanical half, narrows the migrate Skill to the semantic half, and makes the classification an obligation of any future release that changes the data layer rather than something rediscovered by whoever hits the migration.",
