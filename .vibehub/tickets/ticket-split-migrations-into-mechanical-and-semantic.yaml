  "active_contract_revision": 1,
  "constraints": [
    "Do not add forward-compatibility shims or dual read paths; this splits how a migration is executed, not whether the data layer stays clean.",
    "Do not let the mechanical half infer anything the reference marks as judgment; where an authoritative value cannot be established it writes the entry's declared empty or default value and says so.",
    "The mechanical engine operation acts only on the exact repository/worktree passed to it and never scans other projects, creates commits, or pushes; a future explicit upgrade coordinator may invoke it separately for each safe registered worktree under decision-explicit-upgrade-migrates-safe-worktrees.",
    "migrations.json remains the single source; the engine reads the classification rather than carrying a second copy of it.",
    "Preserve the no-shims and explicit-trigger rules in decision-agent-driven-upgrade-migration as refined by decision-explicit-upgrade-migrates-safe-worktrees; this Ticket adds no background conversion.",
    "Do not migrate the owner's real projects as part of this Ticket; rehearsals use disposable copies.",
    "Authoring guidance belongs in the migrations reference beside the step it governs, not in a Skill; the Skill points at it as it already points at the reference."
  ],
  "context": "skills/vibehub-migrate/references/migrations.json is the single versioned source of migration guidance, and every one of its entries is an undifferentiated list of Agent-facing prose steps. The steps are not undifferentiated in nature. In the format-1-to-format-2 entry, raising every Ticket document from schema_version 1 to 2, adding an explicit deliveries array, writing .vibehub/version.yaml with format_version 2, and proving compatibility and validation pass are all deterministic; classifying each Ticket's delivery membership from exact reviewable history, which the entry explicitly forbids inferring from status, branch name, filename, or prose, is judgment. The entry already permits an empty deliveries array when no authoritative delivery can be established, so the deterministic steps alone yield a structurally valid, writable format-2 project. The cost of not separating them is concrete and currently being paid: Undercurrent on the owner's machine is write-blocked at format 1, waiting on an Agent for work that is almost entirely mechanical. nomi is a harder case in the same shape, since its 0.4-to-0.5 entry genuinely needs judgment — building a Room tree and placing 19 flat Context entries into the lowest room that owns each claim — but even there, writing version.yaml and rewriting refs are mechanical once the placement is known. This Ticket implements decision-migrations-declare-mechanical-and-semantic-halves. It changes the shape of the migrations reference, adds an engine path that executes the mechanical half, narrows the migrate Skill to the semantic half, and makes the classification an obligation of any future release that changes the data layer rather than something rediscovered by whoever hits the migration. A second obligation attaches to the semantic half. When a format change adds a field whose content is written rather than computed — the worked example is a summary or subtitle on every Ticket — an Agent back-filling it across a hundred existing documents needs to know what the field is for, which existing material the value derives from, what makes a value good, and what must not be used as a shortcut. Without that, each back-fill is one Agent's private reading and no later reader can tell whether two values meant the same thing. The format-1-to-format-2 entry already carries exactly this kind of guidance for delivery membership, undeclared and mixed in beside mechanical steps; this Ticket makes it a declared part of the entry so it arrives from the same versioned source that says the field exists. The owner has since replaced only the execution-location rule through decision-explicit-upgrade-migrates-safe-worktrees: the mechanical engine operation remains scoped to one exact repository/worktree per invocation, but may be called either from an in-project Agent session or by the future explicit upgrade coordinator separately for each safe registered worktree. This Ticket builds that single-worktree engine primitive and its classification contract; it does not discover worktrees, create migration commits, or push.",
