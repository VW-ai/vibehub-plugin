  "active_contract_revision": 1,
  "constraints": [
    "Pure deterministic script: no agent calls, no network, no token spend; runs in milliseconds on this repository.",
    "Only filter-clean git blob hashes are compared; raw working-tree file contents are never hashed directly.",
    "The alignment block in room.yaml is written only by vh align; submodule interiors are out of scope for v1."
  ],
  "context": "The approved drift design treats per-file filter-clean blob hashes as the only ground truth. vh drift takes one snapshot (git ls-tree -r HEAD overlaid with git status --porcelain -uall --no-renames), resolves each room's anchor globs against it, and set-compares with the hashes recorded at alignment: changed, added, and deleted files any of which make the room DRIFTED; no rooms/ tree is COLD_START; a manual stale flag makes the room STALE regardless of hashes; an unresolvable state is UNKNOWN. last_aligned_commit is provenance plus a direction check — when merge-base --is-ancestor shows HEAD is behind the baseline, report a WARNING and never allow backward realignment. An adversarial audit with sandbox git experiments fixed the requirements: --no-renames (rename detection silently drops old paths, letting an emptied room look FRESH), -uall (porcelain collapses untracked directories), and hash-not-commit ground truth (aligning a dirty tree while stamping HEAD makes commit diffs report already-aligned content as drift forever).",
