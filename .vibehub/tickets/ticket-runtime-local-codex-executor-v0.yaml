      "acceptance_id": "subscription-auth",
      "criterion": "Use the CLI-owned existing subscription login and documented reauthentication flow; expose redacted ready/login-required/quota/unavailable states. Never copy/export OAuth tokens or implicitly switch billing to API keys. Authentication source must be verified without exposing secrets; do not promise unlimited usage.",
