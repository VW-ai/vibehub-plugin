  "context": "The owner wants plugin updates to stop requiring users to manually pull every release, without allowing a new plugin bundle to silently rewrite checked-in Context, Rooms, Tickets, Evidence, or Outcomes. Mature plugin systems separate host-owned bundle refresh from plugin-owned durable-state migration. VibeHub already decided that data upgrades are agent-driven restructures rather than forward-compatibility shims, but projects have no project-level format marker and the current migration skill detects only legacy shape errors. Implement the missing compatibility layer inside the existing dependency-free helper and Skill system: an explicit project format document, a read-only compatibility preflight, write gates, versioned migration guidance, and clean-install proofs from both Codex and Claude Code marketplace artifacts. Claude Code can consume marketplace auto-update and reload behavior; current Codex only exposes explicit marketplace refresh and new-session activation, so documentation and tests must state that limitation honestly rather than introducing a plugin-owned daemon, hook cadence, or self-modifying updater.",
