  "context": "Commit 74ab68f deleted the CAS semantic store together with the feature taxonomy, leaving .vibehub/rooms/product/ flat; a real dogfood project demonstrated the gap (no way to express membership or assembly of knowledge). The approved rebuild is Git-native: .vibehub/rooms/<slug>/ directories, one room.yaml self-description per room (description, boundary, anchors as segment-boundary globs, alignment block, stale flag with reason), sub-rooms as subdirectories, context entries placed inside their owning room directory, cross-room links via existing relates_to/depends_on relations. Identifiers are semantic kebab-case slugs only — no sequence numbers, no hashes, no timestamps in filenames. Rooms are domain-agnostic (deliberately not called features); only anchors are Git-specific.",
