  "context": "The owner decided on 2026-08-23 that vibehub.team replaces vibehub.icu as the canonical production hostname, with vibehub.systems as an additional redirect-only domain. Today site/release/scripts/release.mjs, site/release/SKILL.md, site/package.json, site/README.md, site/public/robots.txt, site/public/sitemap.xml, and the product Room intent all hardcode vibehub.icu and only check the single www.vibehub.icu redirect. Neither new domain resolves yet; the owner performs DNS, Pages custom-domain binding, and certificate activation manually in Cloudflare. There is no CI auto-deploy for the site and none is added; publishing stays the manual wrangler direct upload from a clean commit.",
