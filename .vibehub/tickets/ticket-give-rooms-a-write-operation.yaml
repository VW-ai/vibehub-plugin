  "constraints": [
    "Do not add a delete operation; removing a Room stays a git rm, consistent with how Context documents are moved with git.",
    "Do not let the write stamp alignment; `room align` stays the only thing that stamps.",
    "Keep the bare-invocation behaviour compatible with test/skill-contracts.test.mjs, which re-invokes every command it finds in a SKILL.md without arguments."
  ],
  "context": "The first real user of the bulk absorption pipeline reported that Pass 3 instructs the Agent to delegate Room writing to $vibehub-distill, but roomOperation supports only drift, tree, align and stale. Rooms are created by hand-writing .vibehub/rooms/<path>/room.yaml, and neither bulk-absorption.md nor vibehub-distill/SKILL.md says so — distill step 4 says write its room.yaml without saying that means a raw file write. A fresh Agent looks for a command and does not find one, then either stalls or invents a path.",
