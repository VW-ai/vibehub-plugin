  "constraints": [
    "Do not change how segments are computed; `source segment` stays the single definition.",
    "Do not make room put preserve alignment implicitly. The write must never stamp; the fix is documentation, so that what the stamp says stays a property of what the caller wrote.",
    "Do not weaken the overlapping-territory rule while fixing the parse."
  ],
  "context": "Two defects the segment-anchor adjudication surfaced and recorded as follow-ups rather than criterion failures. First: parseAnchor splits an anchor at the FIRST '#', so for a source file at docs/a#b.md the id `source segment` itself emits, docs/a#b.md#_preamble, resolves to nothing when a Room anchors it — it lands in unresolved_anchors — and a sibling anchoring the prefix docs/a is spuriously rejected as overlapping. Splitting at the last '#' closes the emitted-id half without touching segmentation, which the anchor Ticket was constrained not to change. Second: room put is a whole-document replace that keeps only what the caller passes, so a Room re-put without its alignment block loses the stamp and reports UNKNOWN / never aligned. Pass 4 of bulk-absorption.md tells the Agent to re-put a Room purely to add a coverage_exception and says to carry existing fields through without naming alignment, which is the exact sharp edge.",
