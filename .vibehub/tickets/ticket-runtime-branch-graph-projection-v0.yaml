  "context": "Local stage L1, still draft Contract1. Refine only after the accepted real Graph repository and canonical-source reader supply concrete executable inputs. The pure branch selector requires governing assertions from a trusted governing-context reader; current Graph/ingress capture facts, caller shared pins and a governing boolean do not establish canonical authority. Add the existing canonical-source-reader as an actual prerequisite, preserving the current branch-scope and GraphStore dependencies. Its source-access-invalidation prerequisite follows GraphStore, so this introduces no dependency cycle or new service. The intended smallest storage direction is one service-bound Graph generation per exploration plus separately pinned authoritative shared baseline, individual durable enrollment/origin/lineage records and bounded selected indexes, not a persisted 512-record cumulative reference fixture. Generation labels alone do not implement adoption or governing visibility. A cross-exploration adoption must retain exact source/destination revisions, current authorization and checked semantic lineage and commit destination Graph/lineage/receipt/outbox atomically; current LocalGraphStore outer-transaction ownership needs a small trusted internal composition refactor, not nested transactions or caller effect plans. Branch-aware reads must enforce adoption support/current access so an unscoped raw route cannot bypass that boundary. Keep existing unscoped immutable refs valid. The real Context schema1 has no per-record revision; the reader must expose an explicit projection-revision-to-immutable-commit/path/blob mapping or a new exact canonical-view pin, never pretend schema_version or commit count is a canonical record revision. Bind that actual output before revising branch Acceptance. Actual runtime publication runs remain distinct from future Codex/Claude Session enrollment; no invented host IDs. Also settle honest unborn Git bases without fake commits, relation endpoint adoption, bounded lineage closure and incomplete governing coverage in the executable refinement. No current criterion is retired or claimed complete; all original branch isolation, governing visibility, explicit adoption and real recovery obligations remain. UI/ranking/notifications, Git merge, canonical promotion and replication stay with their existing owners.",
