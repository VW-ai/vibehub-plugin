  "active_contract_revision": 2,
  "constraints": [
    "Implement only inside semantic-runtime/ through documented public contracts; do not import sibling Skill or UI internals.",
    "Preserve original PRD/Tech Design and successful contract/provider Outcomes; completed reference fixtures are baseline, not proof of a live service.",
    "Use synthetic or explicitly selected destination-authorized input; never read or log credentials or ingest arbitrary private traces. No external deployment is authorized by this plan.",
    "Candidate/proposal results cannot certify acceptance, grant access or silently overwrite governing Context; retain independent review and user-reserved decisions.",
    "Branch/exploration scope, worktree execution provenance and Project overview remain distinct; awareness is not adoption.",
    "Scope exclusions: no cross-exploration adoption, host Session/Execution enrollment, App/UI/HTTP transport, Policy/model/Worker loop, Ticket business lifecycle, notifications/relevance routing, GitHub integration, P2P/cloud/replication, Git write/merge/promotion or retention/pruning. No live model call is required for deterministic acceptance. Do not add a generic identity/configuration registry, ORM, scheduler or hook framework.",
    "Public construction: export LocalExplorationStore and EXPLORATION_NAMESPACE='exploration-projection'. new LocalExplorationStore({store,authority,canonical_reader}) requires actual DomainStore/LocalCredentialAuthority capabilities. canonical_reader is inert exact configuration {repository_path,execution:{repository_id,checkout_id,worktree_id},registration_id,selection:{schema_profile,selection_id,policy_id,object_format,records}}, using the existing CanonicalSourceReader fields and limits. Copy/validate data before reading it; construct the actual reader internally with the same store/authority, never accept an arbitrary reader or caller resolver callback. Retain a configuration digest in the format/origin facts. This v0 accepts one frozen canonical selection profile per Project service composition; changing it requires explicit later migration/config support, not reinterpretation of old pins. Constructing/opening alone performs no enrollment, schema migration, source capture or Project activation.",
    "Wire aliases: Execution is exactly {repository_id,checkout_id,worktree_id}; CanonicalPin is exactly {at:GraphCommitAddress2,address:exact SemanticRevisionAddress,record_keys:[unique configured record keys]}. record_keys has at most 16 entries and never excludes configured active Authorities from returned governing material. An empty optional key list is a filter, not proof of empty authority. IDs retain existing opaque ID grammar; no path/name/remote-derived identity. Semantic addresses, assertions, operation schemas, source snapshots, source policies and publisher_ref string retain their existing public contracts.",
    "Public bind(context,{epoch,idempotency_key,publisher_ref,execution,expected_catalog_version,expected_binding_version,exploration_id,shared_base}) is the single explicit enrollment/rebinding command. exploration_id:null creates a new service-owned exploration/generation, captures the observed Git base and shared_base:CanonicalPin|null, initializes Graph with coverage:[], and creates its first binding atomically. A nonnull existing exploration requires shared_base:null (unchanged origin), same repository_id and an explicitly selected target; it creates/reuses the exact ref enrollment and replaces the current worktree binding by expected-version CAS without moving old origins. One active binding per registered worktree; multiple explicit explorations for a ref are allowed and no ref-only automatic selection occurs. A successful response is {status:applied|duplicate,exploration_id,generation_id,execution_workspace_id,binding_version,graph_revision,receipt}. Existing identical actor/key/request returns the same IDs/result. Graph genesis, ownership marker, origin/index, binding retirement/new binding and receipt commit together or not at all. Caller allocated generation/record IDs are not accepted.",
    "Public getBinding(context,{execution}) returns {status:bound|unmapped|rebind_required|unavailable,binding_version,binding,observed_catalog_version}; binding is an authorized current stored record or null. It reads current registered metadata without mutating or performing implicit enrollment. A registered branch/ref/incarnation change, unborn-to-born transition or retired/missing worktree makes the old binding unusable for new writes until explicit bind. Observed renamed attributes preserve identity only where the actual registry proves it; no path/stat/OID alone certifies an unobserved branch delete/recreate. getBinding is metadata lookup, not a host Session claim.",
    "Public setProjectSelection(context,{epoch,idempotency_key,expected_version,pin}) takes a nonnull CanonicalPin verified current by the configured reader and returns {status:applied|duplicate,version,pin,receipt}. It is a human/service-authenticated explicit declaration of the Project selected canonical view, not source promotion or a canonical write. The pointer initially has null version/pin and unavailable coverage; it cannot be silently cleared after a known selection. A stale pointer CAS or changed reuse applies nothing. New source/configuration/pin contents are never substituted under an old operation key. Changing this pointer leaves all fixed exploration shared bases and local heads unchanged.",
    "Public mutate(context,{epoch,idempotency_key,publisher_ref,execution_workspace_id,expected_binding_version,expected_catalog_version,expected_project_selection_version,expected_graph,expected_source_fence,operation,coverage}) accepts only the existing assert/resolve operation kinds through the trusted workspace route. expected_graph must belong to the binding-owned generation. expected_source_fence is the current nonnegative source-invalidation pin; expected_project_selection_version is null or the current pointer version. coverage keeps existing null/at-most-8 selected-cursor semantics. Success retains existing {status:applied|duplicate,receipt,revision?,conflict?} plus operation_origin_ref, whose immutable record binds actor, epoch, publisher/execution, workspace/binding version, exploration/generation, catalog version and observed Git tuple, origin shared base and declared Project pin/version. Graph_revision_mismatch returns unchanged request and no effects; stale binding/catalog/Project pointer rejects with a bounded conflict code. This command does not pretend event.provenance.execution proves the publishing workspace.",
    "Public resolve(context,{exploration_id,at,address,shared_keys}) and page(context,{exploration_id,at,collection,cursor,limit,shared_keys}) use exact existing Graph addressing/collections. at must belong to the selected owned generation. Return {exploration_id,generation_id,graph_revision:at,local:<existing Graph result>,shared:{origin_base,current_project,coverage},availability}. shared entries keep their exact pin, configured/selected record keys, typed current|historical|quarantined|unavailable status and only currently authorized reader material; local Graph material remains separately candidate/derived. Materialization must not expose previously fetched fragments if a later current ACL/fence check rejects. Both methods recheck source/Graph current access, not only the old capture ACL, and work without an accessible current checkout for retained authorized history. They do not fetch Git, refresh a canonical selection, classify contradiction or adopt any context.",
    "Public list(context,{cursor,limit}) returns {items,cursor}, at most 32 authorized exploration metadata candidates per call with their fixed origin and current binding availability summary/exact head references, no automatic semantic payload fan-out. A bounded opaque cursor pins tenant/project, collection ordering and the first-page append high-water mark; it confers no permission. No new exploration added after that mark is silently folded into the page series. Heads/availability describe the actual selected read, not a frozen whole-Project semantic snapshot. Public getReceipt(context,{idempotency_key}) returns the original caller-owned typed operation receipt or null, rechecking all supporting current source/canonical access and the retained source fence; it never re-routes old A output to the current B binding. Service idempotency keys are scoped by tenant/project/actor across these write methods; changed method/request with the same key rejects.",
    "Auth: data reads require local-audience exploration:read + graph:read + store:read + ingress:read + source:invalidation:read; Git binding metadata lookup additionally needs project:inspect. New bind/setProjectSelection/mutate require local human/service exploration:write + graph:write + store:write and their existing read/source permissions, project:inspect and activation:admit; real publisher registration stays the existing graph:publish API. Do not mint grants or trust actor fields in input. Exact successful retries need the original operation permission and currently authorized inputs, but no fresh Git path, live binding, enabled Project or fresh publisher; unchanged authority expiry/revocation rules still apply. No branch ACL is invented: this is semantic routing inside existing scoped Project/source authorization.",
    "Storage/transaction: use existing records/sources/outbox primary-key ranges and CAS. Store the small owned-generation guard in working-graph, so raw LocalGraphStore checks it regardless of an optional exploration namespace handle. A fixed internal Graph entry can perform the admitted exploration command under the existing single transaction owner with an unforgeable internal route or equivalent fixed verified path; no public skip flag, custom transaction callback, precomputed effect-plan admission or nested transaction. Recheck activation, opaque authority, registry/catalog, binding/Project pointer and generation pins before commit. Apply the same current source checks and bounded serialization before commit. Configured canonical reads may preflight outside the writer lock, but acceptance needs exact immutable proof plus fenced current source state and the relevant canonical Graph head/selection under the lock; do not carry an unfenced public resolve result across a write. Do no model/network/Git/filesystem reads inside SQLite views. Keep DomainStore bounded error preservation and no-op/retry CAS semantics.",
    "Physical observation: before a new bind/semantic write, use the explicitly enrolled path and bounded helper-isolated Git metadata observation to check actual common-dir/admin identity, HEAD/ref/detached/unborn against the supplied current registry version. Changed observation returns rebind/refresh-required rather than silently repairing catalog or binding. Do not invoke source hooks/filters/fsmonitor/network or follow untrusted metadata symlinks. Cached catalog plus physical observation is observed assurance, not a filesystem lock or proof of unobserved historical continuity; a Git change after the observation is an explicit cross-system race boundary. Retained history/retry must not depend on inspecting a removed path.",
    "Compatibility/maintenance: a generation ownership claim is created only with a fresh genesis, never retroactively seizes an existing unowned generation. Plain legacy initialize/assert/resolve cannot mutate an owned generation or rewrite the ownership marker. Existing source_access and rebuildProjection paths keep their exact graph:lifecycle/graph:rebuild, source-invalidation, activation and Project enrollment requirements, without adding the exploration live-worktree guard or fabricating a new execution origin. If inherited Project enrollment itself is unavailable, report its existing rejection; no administrative auth bypass. Exact existing unowned addresses/reads/writes and old pure BranchScope wire remain valid.",
    "Capacity/format: versioned exploration format v1, finite schema records and collision-free tuple keys; no cumulative exploration/binding/history arrays. Point commands touch bounded selected rows; list/page limit 1..32, Graph pages retain at most their existing 64 candidate limit, selected canonical record count <=16, configured artifact path count <=32, data depth <=16, <=50000 inert JSON nodes and <=1 MiB aggregate input/record/response bounds. Existing core 32-element support closure and all tighter downstream byte/depth/event/cursor limits remain unchanged. Reject overflow atomically rather than truncate proof or silently return an incomplete-authority success. Page cursors include stable scope/query/pin identity; current authorization remains mandatory. No automatic pruning, hidden all-history reconstruction or implicit repair; corrupt selected indexes fail with a diagnostic and retain authoritative rows.",
    "Verification commands: add focused real-store branch-projection tests under semantic-runtime/test and synthetic child fixtures only; run those plus affected graph/canonical-reader/Git/activation/ingress/core-branch tests, npm --prefix semantic-runtime run verify, npm --prefix semantic-runtime run verify:standalone, and npm run verify:artifact. Record exact commands/results, bounded synthetic per-page/record counts and release boundaries as acceptance-linked Evidence. Independent closeout must review each active Contract2 criterion; this candidate is not implementation Evidence."
  ],
  "context": "Accepted branch-scope Contract2, incremental Graph Contract1, real GraphStore Contract3 and canonical-source-reader Contract2 are the implementation inputs. This is the smallest authenticated local service slice before App/host/UI integration: one service-owned Graph generation per exploration, individual durable bindings and immutable operation origins, exact canonical base/current-Project views and bounded Project metadata navigation. It is not a source/session registry, Policy consumer or context adoption engine. Existing real Git enrollment remains the identity source, existing Graph owns semantic transitions/current source access, and the selected canonical reader owns authoritative record verification. Implement one narrow trusted Graph integration for shared transaction ownership rather than nested transactions or an extensible callback/plugin framework. Responsibility transfer, not completion: ticket-runtime-branch-graph-projection-v0 Contract1 sha256:2e4a7c4d06c2966c8c15f5f47a3fe4dd7e309831022212390900228e1e5c536c, explicit-adoption@1 sha256:e790df1c7a9f1ff19aba8786a4b64a4987e89937d98118739b06e19110f39924, and the adoption-specific portion of branch-recovery@1 sha256:04fc751bfc552185f68a8f6ba1ff104e60137c3337adbe30c6750209d7df3e2a, as preserved at commit:323c163fdd011ae4a6e3c2f237890b34ecf64f79:.vibehub/tickets/ticket-runtime-branch-graph-projection-v0.yaml, move to ticket-runtime-exploration-adoption-v0 explicit-adoption@1 and adoption-recovery@1. Cross-Ticket derived_from is not supported; these exact Context citations and symmetric transfer notes are audit provenance, not formal cross-Ticket Acceptance lineage. No old Contract or Acceptance semantic identity changes, no old Evidence is rebound, and no adoption obligation is waived. Current shared selection is explicitly declared and Project-scoped; it is not inferred from main or the currently checked-out branch. Known configured active Authority records remain distinct from all local candidates. Exact pins point to the reader's real Graph address/revision/record keys and immutable Git proof; Context schema1 has no numeric record revision. Pure v1 reference inputs cannot represent unborn bases or these actual canonical pins, so preserve the old API and document this storage wire as a bounded compatible successor rather than fabricating a v1 input. Source/host IDs not present in the actual catalog remain unmapped; Runtime publisher runs are not Codex/Claude Sessions. V0 binding uses one repository_id per exploration; a Project may contain many repositories/explorations and actual outside-folder linked worktrees, but cross-repository exploration bases remain unsupported rather than guessed. No source/schema/platform prerequisite is missing; ordinary internal transaction composition, finite row keys and proofs are part of this one executable slice.",
