      "acceptance_id": "branch-recovery",
      "criterion": "Real-store fixtures cover restart, duplicate adoption, branch/worktree lifecycle, two simultaneous local executions, stale destination, revoked source and exact historical reads. No code merge or Worktree deletion automatically promotes or erases semantic content.",
      "identity": "sha256:04fc751bfc552185f68a8f6ba1ff104e60137c3337adbe30c6750209d7df3e2a",
      "revision": 1,
      "state": "retired"
    },
    {
      "acceptance_id": "branch-projection",
      "criterion": "Implement the documented LocalExplorationStore in-process API on the existing DomainStore and LocalGraphStore with one fixed exploration namespace and a versioned format record, no new table/dependency/framework. Persist individual immutable exploration origins, exact selected canonical-base pins, ref enrollment pairs, execution-workspace bindings, operation origins/receipts and bounded indexes; never store a cumulative 512-record BranchScope fixture or an ever-growing catalog copy. Service-owned generation and binding identities are allocated by the authenticated bind command. New/existing real Git enrollment is read from the current registry, including linked worktrees outside the selected folder; branch names, paths and source-event citations never establish semantic origin. A new exploration retains its actual observed Git base, including explicit unborn/null, and optional exact reader-verified shared baseline; existing exploration binding cannot rewrite that origin. Binding transitions append history and use expected catalog/binding versions. Detached work requires explicit target selection; a first commit after unborn or an observed branch switch requires an explicit new binding. Worktree/ref deletion, unavailable paths and observed recreation retain old identities and historical records. Ordinary unchanged rescans remain usable at observed assurance. Point/Project-page reads are selected and bounded rather than reconstructed from all prior events; unsupported stored formats and corrupt selected indexes fail closed. The unchanged pure v1 branch contract remains a semantic reference on its supported committed-base/exact-pin subset, not the storage wire or proof of host Session enrollment.",
      "identity": "sha256:3d0d917623f152d38381cf66601a531110b43a7511c652f5aa8d6ccb434bf1c0",
      "revision": 2,
      "state": "active"
    },
    {
      "acceptance_id": "branch-write-routing",
      "criterion": "Route every new assert/resolve command for an owned generation through a fixed trusted exploration integration in the single existing Graph/activation transaction. Under the writer lock verify the actual scoped grant/actor, current activation epoch and enrolled execution, registry/catalog version, current worktree/ref/binding version and owned exploration/generation; reject stale or foreign routing instead of silently rebasing. Atomically append the actual execution-workspace origin, selected Project/shared-base pins, Graph effects, receipt and outbox. Ordinary legacy LocalGraphStore initialize/mutate cannot bypass an owned-generation marker even when opened without the exploration namespace; preserve ordinary unowned generations and authorized historical reads. Other-generation semantic parents/endpoints remain forbidden by the existing core. A source event may be cited under its real ACL but does not certify where this assertion was made. Same-theme A/B candidates stay in separate generations; stale Graph CAS has no effects and same-generation semantic conflicts retain existing behavior. Exact committed retries reconcile before new Git inspection, preserve the original A origin/result across later switching to B, and recheck current input ACL/fence; changed key reuse rejects. Revocation/lifecycle and rebuild retain their existing narrow authenticated paths without requiring the removed bound worktree, and cannot turn into an ordinary assertion bypass. Physical Git checks remain bounded pre-transaction observations followed by catalog/mapping CAS, not a claim that Git and SQLite share an atomic filesystem lock.",
      "derived_from": [
        {
          "acceptance_id": "branch-concurrency",
          "revision": 1
        }
      ],
      "identity": "sha256:629e75f54aea9199fef272fbea2add20a7a953043ecb680b111e9809532a3cef",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "branch-shared-view",
      "criterion": "Use an actual CanonicalSourceReader constructed from the trusted frozen v0 owner configuration and the exact same store/authority to verify every selected canonical pin {at,address,record_keys}, including its retained reader issuance, immutable source mapping and current access/fence. Never accept a caller governing boolean, fake Context numeric revision or plausible Graph JSON as authority. Branch resolve/page responses keep local candidates, immutable origin shared base and separately declared current Project selection distinct. Include every active usable Authority in the configured selection regardless of optional shared-key filtering; expose the configured keys and selected/partial/unavailable coverage without claiming all Project authority or automatically classifying text contradictions. Ordinary local candidates cannot replace/mutate the Project selection or suppress its known rules. Explicitly report exact current/historical/quarantined/unavailable status; denied source material is not exposed and stale/quarantined rules are not silently presented as current. A new explicit Project selection declaration is CAS/idempotency guarded and does not update any exploration origin or adopt its contents. An initially missing selection, including an unborn Project, remains unavailable/partial; it is not evidence that no rules exist. Project overview pages list authorized exploration/workspace metadata and exact head references, not main-branch truth or merged semantic content. No read, Git merge, workspace deletion, source refresh or selection change adopts, rebases or promotes context.",
      "derived_from": [
        {
          "acceptance_id": "branch-concurrency",
          "revision": 1
        }
      ],
      "identity": "sha256:1253529fd54bd118f551ab2081c2060662ee05ff121c56e8b4345ab2b211978c",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "branch-view-recovery",
      "criterion": "Demonstrate the complete local view/write slice with actual temporary Git repositories and SQLite: A/B same-theme alternatives, multiple real linked worktrees including an external folder, independent clones with the same branch name, same-ref explicit multiple-exploration selection, branch switch, actual observed delete/recreate, detached HEAD, unborn then first commit, unavailable/deleted worktrees retaining exact history, restart and two real child-process writers. Cover both stale Graph and stale binding/catalog/Project-selection CAS, expiry/revocation/disable races, SIGKILL before commit and committed lost-response retry after switching workspaces or removing Git paths; no partial generation/binding/origin/Graph/receipt/outbox publication. Exercise current/historical/revoked canonical baselines, optional filters that cannot hide configured active Authorities, null/partial coverage, changed config/pin identity, foreign generation/source/actor/tenant, inaccessible inherited support and operation receipts, inert/accessor/Proxy and capacity rejection, missing/corrupt format/index rows, maintenance/lifecycle with a disappeared binding and legacy unowned Graph compatibility. Persist at least 600 individual exploration origins using repeated real enrolled worktrees and selected reads/pages of at most 32 candidates to prove no cumulative 512-item store ceiling; report actual record/range access and page/response bounds without an SLA. Run focused/affected tests, full Runtime verify, clean standalone verify and unchanged shipped plugin-artifact verification. Deterministic acceptance performs no model/credential/private repository reads. Adoption/retry/lineage cases transferred to the separately blocked adoption Ticket are not claimed by this criterion.",
      "derived_from": [
        {
          "acceptance_id": "branch-recovery",
          "revision": 1
        }
      ],
      "identity": "sha256:3feaf1c35cfaa34f18feb493aabb28d10714300c5c9bb4ee231d71da9e16e966",
