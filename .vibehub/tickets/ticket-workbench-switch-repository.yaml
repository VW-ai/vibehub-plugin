    {
      "acceptance_id": "in-app-switching-entry",
      "criterion": "With a repository open, the app offers an in-app way to change repository — an Open Repository… menu item bound to Cmd-O plus a recent-repositories menu listing previously opened worktrees — and choosing either opens the selected exact worktree in the same running app session, reusing the persisted window frame, without quitting; proven by a headless probe over the real binary that prints the built menu with titles, key equivalents and recent-worktree entries, and drives the same open path a selection invokes."
    },
    {
      "acceptance_id": "previous-session-fully-released",
      "criterion": "Switching terminates the previous repository's host process and watcher before or as the new session becomes visible, leaving no orphan process and no listening port; a test over the real binary asserts the old host pid is dead, its port unreachable, its previously authorized URL no longer resolving, and no preference key holding a token."
    },
    {
      "acceptance_id": "switch-confirmation-is-consistent",
      "criterion": "An in-app switch to a different repository uses the same explicit confirmation semantics the deep link already applies, refusal leaves the current session untouched, and no switch path changes projects silently."
    },
    {
      "acceptance_id": "recents-reflect-real-use",
      "criterion": "The recent-repositories list updates on each successful open and stays within the persistence allowlist; a remembered repository that fails validation is reported honestly, dropped from recents when the cause is permanent — notADirectory, notAVibeHubRepository or notAnExactWorktree — and kept when the cause is transient, such as gitFailed, so a temporary failure never erases a valid entry."
    },
    {
      "acceptance_id": "switching-changes-no-ticket-state",
      "criterion": "Automated tests prove that switching repositories — including a refused switch and a switch to an invalid path — leaves canonical Git YAML byte-for-byte unchanged in both worktrees, and that every Ticket state in the newly opened repository is recomputed from its own Git YAML rather than carried over from the previous session."
    }
