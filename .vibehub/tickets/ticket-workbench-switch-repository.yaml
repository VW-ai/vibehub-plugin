  "context": "Dogfood gap found by the repository owner while using the shipped Workbench: with several local repositories using VibeHub, there is no quick way to change which one the window shows. The gap sits exactly between two closed Tickets, each of which met its own acceptance. ticket-workbench-quiet-surface scoped the recent-repositories list out of the shared frontend as shell-owned, so the page shows only the current repository identity. ticket-workbench-macos-shell built recent repositories into the launch picker, but AppDelegate closes that picker once a repository opens and the menu carries only About, Quit, Copy, Select All, Close Window and Minimize. Nothing owns switching while a session is running, so today the only paths are quitting and relaunching, or sending a deep link for the other repository from a terminal — vibehub://open already implements the confirm-switch resolution, which proves the switch semantics exist and are only missing an in-app entry. Browser mode is deliberately out of scope: vh-workbench.mjs binds one --repo per foreground command, and a page-level repository picker would need the frontend to address more than one host, which is a different and larger question. Reuse rather than reinvent: DeepLinkPlanner already distinguishes focus-current-session, open-known-repository, confirm-first-use and confirm-switch, HostSession already starts and terminates a session host, and AppDelegate.open already performs a complete switch by terminating the old host, starting the new one and replacing the window; what is missing is only the entry point that reaches them. Note the window is replaced rather than reused — WorkbenchWindowController documents that swapping the WebView URL in place crashes on a repository switch — so a switch must construct the new window as the existing path does. Sequencing: the baseline puts multi-repository recents and repository validation recovery in Phase 2 while dogfood release closes Phase 1; this Ticket deliberately pulls that forward on the owner's dogfood request rather than expanding Phase 1 scope by accident.",
