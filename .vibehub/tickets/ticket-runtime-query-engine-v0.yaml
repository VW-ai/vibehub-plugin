    {
      "acceptance_id": "lifecycle-aware-selection",
      "criterion": "Consume the scoped Context lifecycle/read contract when constructing current/as-of candidate sets: return role/applicability, exact lineage, selected shared base and explicit historical/superseded status. User/workspace UI hide preferences never silently remove governing Context from Agent compilation; current authorization still gates history.",
      "identity": "sha256:4b0cb24124e0ee587b15f52b0c2517d13a719194c3ffd3faa0ba778fcfe7841c",
