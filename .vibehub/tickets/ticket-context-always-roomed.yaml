  "active_contract_revision": 1,
  "constraints": [
    "No dual read paths, aliases, or compatibility shims for the removed root context directory.",
    "The legacy-directory failure must be a visible validation error, never a silent skip.",
    "Skill text stays short and judgment-first; deterministic enforcement lives in vh.mjs."
  ],
  "context": "The initial Room rebuild kept a flat .vibehub/context/ for cross-room entries, so knowledge had two homes and an ambiguous placement rule. The owner decided every Context entry must have an owning room: place each claim in the lowest room that owns it, and knowledge spanning several rooms belongs to their lowest common ancestor room, creating a parent or top-level room when none exists. vh context put must therefore require --room. A leftover populated .vibehub/context/ must fail validation with migration guidance rather than being silently ignored, because silent ignoring is knowledge loss. Speed-first applies: no dual read paths and no compatibility shim for the removed root directory.",
