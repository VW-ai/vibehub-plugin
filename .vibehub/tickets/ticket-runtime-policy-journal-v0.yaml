    {
      "acceptance_id": "ingress-consumer-delivery-recovery",
      "criterion": "When this still-draft Policy journal is refined and implemented, consume the accepted durable-ingress pending-intent/atomic-handoff contract and retain the full source-event delivery recovery obligation transferred from ticket-runtime-durable-ingress-v0. Persist consumer pending/leased/succeeded/retryable/deferred/dead-letter state, lease expiry/fencing, bounded backoff/attempt/deadline budgets and poison-event isolation without blocking unrelated events. Audited operator replay names exact retained source/event and current source access plus activation/base authority; it creates a new explicit attempt or generation and never rewrites original bytes, first receipt, closed epoch or completed semantic effects. Couple successful consumer ownership and later semantic completion to their respective real transactions; intake ACK alone cannot advance completed_through. Fault-inject before/after handoff, consumer effect, completion and ACK plus duplicate concurrent resume, proving one logical effect and recoverable/fenced failure. Integrate this with the existing PolicyRun journal and later local runner rather than add a second scheduler. Concrete queue/checkpoint schemas and tuning remain part of this Ticket subsequent refinement, which remains draft until its existing prerequisites finish.",
      "identity": "sha256:fcf07364e6b8ead087828d6edf1b72bb30133ee89f3359823c35d4f3b7c415bc",
      "revision": 1,
      "state": "active"
    }
  ],
  "active_contract_revision": 2,
  "constraints": [
    "Implement within semantic-runtime/ with its own dependencies, build, tests and release; host/source integrations consume public contracts and never import sibling plugin internals.",
    "Retain existing replay/provider behavior, run affected contract tests and component boundary checks; release composition also runs standalone and plugin artifact checks. Do not rebuild completed Phase 0 work.",
    "Fast judges and workers produce auditable candidates/proposals; canonical writes require explicit authority and concurrency checks. Do not infer acceptance from model confidence.",
    "Use synthetic or explicitly selected, destination-authorized input for live calls; credentials stay outside Context, logs and Git. Existing Peel authorization is not blanket authorization for new sources or destinations.",
    "REFINE this same Ticket from its prerequisite Outcomes before execution; bind concrete schemas, commands, workloads and thresholds rather than treating draft acceptance as implementation authorization."
  ],
  "context": "Build durable PolicyRun journaling, idempotency, and crash resume. Delivery slice: alpha. Architecture: . Scope: Run/attempt journal, scheduler integration, leases/fencing, idempotency ledger, cancellation, recovery scanner, and crash tests.. Excluded: Worker executor internals, cross-region DR, and transport-level exactly-once claims..  Required transitive artifacts: graph-store: Journal/action/outbox transactions integrate the accepted real Graph repository. Refine exact adapter endpoints, fixtures, commands and measurable limits after its direct prerequisites close. Explicit local-scope transfer: the durable-ingress Contract v3 delivers persistence/receipt/cursor/pending intent and atomic synchronous handoff only. This existing consumer Ticket retains event-level leases, bounded retry/backoff/defer, poison dead-letter and audited operator replay as ingress-consumer-delivery-recovery; none is claimed shipped by intake. Keep existing dependencies unchanged: judge -> source-access-invalidation already transitively requires durable-ingress, so no reverse/circular or redundant edge is introduced. This is planning ownership only; no consumer implementation in the intake task.",
