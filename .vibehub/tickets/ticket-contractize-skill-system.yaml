  "context": "A whole-skill audit against the modularity rule found the lifecycle contract pattern (shared JSON + ownership test) working but applied to only one dimension. Three gaps: knowledge-governance rules are scattered and incomplete — placement judgment lives only in the ingest skill, trust layering only in the distill skill, and the query skill, which most needs trust layering to answer honestly, does not know the rule at all; vh.mjs invocations cited across skills have no test welding them to the real command surface, which already caused two real drifts (a stale context put example after --room became required, and the artifact verification script failing at runtime); the product-wide architecture boundary (no database, daemon, CLI, MCP server, background capture) is restated in four skills in four wordings (setup, ingest, query, run), while plan and distill carry only skill-specific temptations (no second lifecycle or lease; no progress files) and simply lack the product-wide pointer. The three-layer test convention (unit / contract / e2e) recorded in convention-skill-contract-test-layers governs where each fix lands. Prompts stay judgment-first: contracts carry the system, skills carry the judgment.",
