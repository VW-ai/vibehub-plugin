  "active_contract_revision": 1,
  "constraints": [
    "Use near-black deep graphite as the public background direction; do not turn the site into a generic neon-on-black technology template or recolor semantic Workbench states for decoration.",
    "The product UI is evidence, not illustration: reuse the current typed Workbench fixture, components, geometry, Inspector lenses, Rooms, and state language before creating any new visual object; raw schema may appear only inside explicitly labelled educational source-file viewers.",
    "The coding-agent composer is one familiar entry metaphor, not a fake Agent application, terminal, arbitrary prompt runner, or multi-step demo.",
    "Normal vertical reading is primary. Each lower section answers one product question and uses static legibility first; no autoplay sequence, Back or Next controls, stage rail, video player, feature grid, or horizontal page travel.",
    "Do not deploy, commit, push, publish, or change the installed local Workbench in this Ticket."
  ],
  "context": "The owner accepts the current overall direction and has further clarified that the website should teach through the product's real files rather than custom explanatory tables. The hero leads with Stop managing chats. Manage the work. and Turn every coding request into a Ticket with your context. The first viewport makes the real Ticket Graph unmistakable. The second screen answers What is a Ticket? by showing a complete schema-valid Ticket file whose outcome, relations, context_refs, acceptance, constraints, and provenance correspond to the selected persistent-dark-mode Workbench Ticket; the prior custom anatomy table is removed. The next screen answers How is context built up? with a small real file browser for room.yaml plus Decision, Constraint, and Contract Context documents, a concise Capture to Room to Ticket reference to Outcome return lifecycle, and the faithful Rooms Workbench showing the same Product Room and consuming Tickets. Raw files appear only in these educational source viewers; normal product inspection remains parsed and human-readable. Later sections explain Evidence and independent Outcome, then separately explain repository files, Git, and GitHub. The surrounding website stays simpler than the product and reuses the real Workbench rather than drawing a parallel state model.",
