  "acceptance": [
    {
      "acceptance_id": "setup-launch-lifecycle",
      "criterion": "A documented single local launch command exposes the connected setup page through the existing startLocalRuntime lifecycle, with one process/terminal and token-free URL; reuse supported Node and current explicit/default data directory. Explicitly initialize/migrate only the App-owned DomainStore/config files, preserve foreign/newer/corrupt files and pre-existing user data, and retain bootstrap behavior for existing callers. Nonsensitive readiness distinguishes App/storage readiness from unavailable optional secure-store/host/model capabilities. SIGINT/SIGTERM and an authenticated explicit Stop action revoke sessions, stop new commands and close handles without deleting data or stopping unrelated coding tools; the page shows offline/reconnect and restart instructions. Restart with the same data retains non-secret Projects/settings/switches and requires fresh pairing. No process-manager daemon, auto-login or automatic capture starts.",
      "identity": "sha256:a1ccf89ce8025d8a300e1947e088b063e1263cb4edcf022346869b5b605dcd26",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "setup-paired-owner-boundary",
      "criterion": "Implement the bounded one-terminal pairing described in Context: at most one pending browser request, a high-entropy pending HttpOnly SameSite=Strict capability expiring within two minutes, non-secret comparison code and explicit approval only from the attached launcher TTY. Neither GET, loopback/origin alone, the comparison code, noninteractive stdin nor an unauthenticated API can grant owner access; approval consumes only that exact pending request. Use instance-specific cookie names and exact-origin session binding; approved sessions are memory-only, expire within one hour, are revocable and die on restart/stop. No credential in URLs, JSON replies, logs, browser JS/persistent storage or provider input. Every private endpoint authenticates before inspecting paths/stores, checks exact Host/Origin and typed bounded JSON/custom-header requests for mutation, rejects cross-origin/CSRF/rebinding and unknown fields, and derives narrow current LocalCredentialAuthority contexts from fixed owner/tenant plus persisted Project allowlist. No public scope/grant minting or generic store capability. HTTP tests cover unapproved/wrong/reused/expired requests, missing/revoked/foreign-instance cookies, tampered scope, origin/method/content-type/body bounds and no side effects on denial. Same-OS-account hostile process isolation is explicitly outside this local profile.",
      "identity": "sha256:6a29747beae6f21ab0bf084e4d77e118bd7cc7c0b5caa563b567603f501aeb7b",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "setup-project-registration",
      "criterion": "A paired owner can add/select a Project using a bounded explicit absolute path, inspect actual Git metadata, separately initialize a non-Git folder without overwriting files, explicitly enroll and refresh using GitProjectRegistry expected versions, and view registered external worktrees plus branch refs without checkouts. Show bare/unborn/detached/unavailable/removed and stale-CAS states truthfully; no disk crawl, GitHub/remote/commit requirement or automatic checkout. Persist at most 64 server-created Project IDs with bounded display metadata and setup attempt state in the accepted store. Registering the same selected common-directory identity in an existing Project reuses its existing enrollment; an independent clone is not merged by remote URL. The global App list and scoped enrollment commit separately: failure before/after enrollment must retain a retryable attempt under the same Project ID, reconcile actual registry state on retry/restart and avoid orphan/duplicate projects or rollback of user files/.git. Unknown Project IDs and changed preview/expected base must not redirect operations to another folder. Test real temporary Git/SQLite, two Projects, nested/symlink/spaced paths, safe init, external/new worktree, restart and fault-injected list/enrollment boundary.",
      "identity": "sha256:9ccf740e56043b14be57f04bbbedc9d92a9f1b905852c57a8a10638be8bc1f3b",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "setup-provider-credentials",
      "criterion": "Expose authenticated Project-specific ProviderSettings config, replace/remove and redacted status through the real setup UI and safe typed endpoints, deriving a stable bounded key from the exact [tenant_id, project_id] tuple. Offer OpenRouter typesafe/jev-1.13, Vercel typesafe-ai/jev and TypeSafe jev-latest with semantic-judge-v0 capability and existing timeout/attempt/explicit fallback limits; reject arbitrary models/base URLs and show subscription Worker settings separately. A local password field submits only to the selected Project/provider, clears after each attempt and on Project/provider change, and is never prefilled from stored credentials. Reuse MacOSSecretStore with no useCredential/read-key endpoint or plaintext fallback; locked/denied/unsupported store is actionable while ordinary setup/coding remains usable. Configured means secure item exists and is visibly unverified; save/status never calls any model or silently substitutes another route. Serialize setup-owned async provider operations and recheck live owner/session/Project authorization after waiting and immediately before actual provider-store dispatch; expired queued work must not invoke the store. Ignore late UI responses from a previously selected Project so A credentials/status cannot appear as B. Test with synthetic secret-store canaries, delayed calls, cross-Project/tenant-key collision cases, unauthorized/expired dispatch, replacement/removal/restart, bounded secret-free errors/responses/logs and one temporary app-owned native Keychain fixture when supported; never read existing user keys.",
      "identity": "sha256:bacd2b7a715fc5e0c7f90835ed00b08488f2c9f1cb42f10e07ff8b670d5969b2",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "setup-project-switch-truth",
      "criterion": "Render and mutate real ProjectActivation state using read plus explicit enabled/disabled commands with current expected version. New Projects are disabled; stale/double-click/lost-response commands reconcile authoritative state without inventing success or silently retrying an old CAS. Enable requires valid current enrollment; disable remains available when paths or optional providers are unavailable. Linked/newly refreshed worktrees inherit their Project switch, other Projects remain independent, and restart preserves exact epochs/gaps/history with no automatic disabled-period import or recovery. Use real domain admission tests to confirm disabled/stale epoch gates; clearly state no live Collector/Worker/delivery is connected by this Ticket. Display Codex and Claude plugins and subscription Workers as not connected/unsupported rather than simulated login/verified states, and keep semantic Context/Ticket demo data outside the connected setup surface.",
      "identity": "sha256:15a853c8f8b15b4f99a07d4a3d4e98ee611210f9ab953686109ec0192191e972",
      "revision": 1,
      "state": "active"
    },
