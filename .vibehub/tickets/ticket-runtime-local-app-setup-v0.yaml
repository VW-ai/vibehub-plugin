  "constraints": [
    "Implement only inside semantic-runtime/ and preserve its standalone dependency/test/release boundary and existing plugin artifact. No native shell, new frontend framework, generic settings framework, generic auth service, cross-scope SQL API or background daemon is required.",
    "Reuse current bootstrap/auth/store/Git/activation/provider public contracts. Add only small setup-specific transport, pairing and persistence glue; keep semantic core host/provider/storage independent.",
    "Serve only allowlisted assets and typed setup operations on 127.0.0.1. No directory listing, arbitrary file read/write, shell/SQL endpoint, remote bind, external asset or caller-selected model endpoint.",
    "Credentials enter locally and are sent only to the selected app-owned secure-store operation; never return/read/display existing keys, log bodies or bearer/cookie values, persist secrets in ordinary files/browser storage, or fall back to plaintext. No real user credential, private trace, model/provider request, host login/installation or external deployment is needed for this Ticket.",
    "All configuration, activation and enrollment changes require current paired owner authority and exact server-owned Project scope. Configuring one Project cannot overwrite another or reveal its status through a stale client response.",
    "Do not claim usable semantic capture, policy evaluation, Context/Ticket Graph screens, live plugin connection, Worker readiness, real provider verification or full product onboarding from this setup slice. Preserve the separate original onboarding obligations and historical dependencies."
  ],
  "context": "Ship the useful setup portion of the existing local-app-onboarding direction before unfinished host adapters and subscription executors. Reuse startLocalRuntime/CLI through an explicit setup entry or mode, not a second general service or daemon. Serve a small connected setup interface using the prototype's visual/setup patterns; keep its synthetic semantic explorer separately labelled and disconnected. Suggested internal files are src/local/app-setup.mjs, a small app-session module if needed, allowlisted local UI assets, and focused integration/browser tests; naming is not an acceptance requirement.\nOne stable server-owned local tenant/owner and a bounded list of at most 64 opaque App-created Projects is enough. Persist a small versioned setup catalog using the accepted DomainStore in a private control scope/namespace. Browser requests select only a known Project; the service resolves its exact scope and issues narrow current in-process domain contexts. No arbitrary tenant/principal/action or credential-reference input becomes authority. ProviderSettings accepts a single Project key, so derive a stable bounded collision-safe hash of [tenant_id, project_id] rather than concatenate or pass a raw tuple.\nPairing uses the existing launcher terminal: the token-free page may request a bounded short-lived pending browser capability in an HttpOnly SameSite=Strict cookie and display a non-secret comparison code. The same attached TTY shows that code and requires explicit local approval before owner authority exists. The comparison code alone never authenticates. The pending capability is high-entropy, one-time and expiring; use per-instance cookie names and exact-origin binding because browser cookies are not port-scoped. Noninteractive launches never auto-approve. One terminal suffices; no provider key, App credential or pending capability is printed or placed in a URL or browser persistent storage. This protects the local web boundary, not mutually hostile processes under the same OS account.\nSelect an absolute folder path explicitly; do not pretend a browser file-upload input is a native folder capability. Inspect through GitProjectRegistry, display real common-directory/ref/worktree results, and require separate visible initialize/enroll/enable actions. A tiny persisted reserved/enrolling/ready-or-error setup record makes the cross-scope catalog-to-Project enrollment sequence recoverable under the same Project ID. The control catalog and Project registry cannot share the existing single-scope transaction; never fake atomicity or remove initialized Git/user files after a later failure. Reconcile a recorded attempt against the real enrolled catalog on retry/restart.\nThis slice configures the existing three JEV semantic-judgment routes only. Saving settings or a key never invokes a model and never marks that user's credential verified. Plugins and subscription Workers show not-connected/unsupported capability facts; no CLI auth scan, installation, simulated connected state or worker selection pretending to execute is delivered. App enabled state is the real Project switch, not evidence that a collector or semantic pipeline is connected. The paired original onboarding Ticket retains the full integration and live end-to-end verification. No Graph dependency or namespace is introduced; register future namespaces only when their owning module is actually composed.\nHTTP transport clarification: require exact Host on every request. Reject any supplied mismatched Origin and cross-site Fetch Metadata. Authenticated private GET requests may omit Origin, as ordinary same-origin browser reads commonly do; absence never bypasses session/Project authorization. Mutations and pairing requests require exact Origin plus the setup custom header and bounded typed JSON. This preserves the paired-owner boundary while making actual browser reads work.",
