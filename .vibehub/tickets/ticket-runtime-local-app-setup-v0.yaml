      "acceptance_id": "setup-connected-walkthrough",
      "criterion": "Perform an actual browser walkthrough against this running setup service and temporary selected Git Projects, not the fixture-only prototype: pair through the same launcher terminal, inspect/init/enroll, see an external linked worktree and a refreshed new worktree, switch between two Projects, configure each supported route, enter/replace/remove a synthetic credential, enable one Project while leaving the other disabled, exercise stale/offline/secure-store failure, stop/restart and recover remembered state after fresh pairing. Record which secure-store path was truly exercised; ordinary CI uses a fake store and the supported native check uses only a fresh synthetic app-owned entry with guaranteed cleanup. Verify keyboard labels/focus and no horizontal overflow at the reviewed viewport, plus no secret in URL/replies/browser persistence/server diagnostics/database config. Run affected public API/auth/store/provider/Git/activation/HTTP tests, boundaries and clean standalone verification. No external model, private-session collection, real plugin installation or Worker execution is claimed; those remain required by the paired original onboarding Ticket.",
      "identity": "sha256:c1acd97b7d1186e69264abeaa6fe86f3ddc78b27cdfd3435ed17cf1093f0fcba",
