    {
      "acceptance_id": "judge-input-is-pinned-and-minimal",
      "criterion": "Implement the documented LocalJudgeRuntime one-shot invocation and typed JudgeNode bridge against actual authenticated ingress and LocalExplorationStore v2 selected pins. Materialize only the selected event snapshot and at most 32 exact same-exploration typed candidate revisions, with bounded currently authorized provenance closure; caller text, target IDs, ACLs and governing booleans cannot establish authority. Bind the exact compiled node, four-family DecisionSchema, redacted/minimized input hash, source fence, exploration/workspace/catalog/Project selection pins and configured shared coverage. Keep origin/current canonical rules separately pinned and checked; no Authority text or other-exploration hypothesis enters the target array. Preserve no-authority/unknown-coverage distinctions. Validate visible target identity and return exact target-ref mappings. The narrow bridge returns the existing typed handler-style outputs, branch and conservative budget usage for the v2 selection; the legacy executePolicyRun remains unchanged and continues to reject Judge/Worker nodes. No full PolicyRun, promotion or acceptance-success claim follows from a positive judgment.",
      "identity": "sha256:c53d0f15a6b1e2b212d6a2883c2cada242900b0d4ba7687288cd89f7b07252c2",
      "revision": 3,
      "state": "active"
    },
    {
      "acceptance_id": "routing-policy-controls-provider-use",
      "criterion": "Compose actual LocalCredentialAuthority, ProviderSettings and the three existing OpenRouter/Vercel/official TypeSafe adapters under one inert trusted configuration binding exactly one tenant/Project to its settings Project ID. For each real supporting ingress registration combine current/captured principal ACL and actual source sensitivity with the explicit owner-configured local-only, provider allowlist and selected-fields-or-deny text policy; refuse missing policy and apply the documented conservative sensitivity mapping. Recheck current source, activation epoch, selected versions, live authority and settings identity immediately before each provider send and before accepting its result. Construct explicit-key SDK clients only inside useCredential; never use process-environment/default-Gateway/subscription fallback. Enforce one deadline and attempt/token/cost-reservation budget across primary and only configured/authorized transient retries/fallbacks; 401/403, schema errors and policy denial cannot broaden a route. Preserve bounded observed telemetry separately from validateDecision and report unknown cost as unknown.",
      "identity": "sha256:c3003b529a5ab988530807c1d1e70828a296eb65dd4e82c5decfa3401553e899",
      "revision": 3,
      "state": "active"
    },
    {
      "acceptance_id": "judge-failure-is-explicit",
      "criterion": "Return the documented bounded decision/deferred/cancelled/refused outcome for timeout, abort, transport failure, rate limit, invalid schema or target, low confidence, changed pins/access/activation/settings and exhausted routes/budgets. The original deadline and attempt reservations never restart inside the invocation; late completions cannot publish, cache or expose a decision after a failed final check. Low-confidence normal-impact results DEFER and high-impact results ESCALATE as recommendations, never acceptance or canonical truth. A bounded per-instance completed-decision cache permits same-actor reuse after current ACL/fence/policy checks; duplicate in-flight invocation keys refuse without another send; changed invocation reuse conflicts, rejected/failed work leaves no reusable success, and different scopes/actors cannot read cache entries. The cache is explicitly process-local, with bounded eviction and no durable attempt, restart, exactly-once model dispatch or PolicyRun journal claim.",
      "identity": "sha256:34d6335769f6c8d6576ecebd07978f94a8d5cf70198dd19addbfe2390091bfed",
      "revision": 2,
      "state": "active"
    },
    {
      "acceptance_id": "recorded-fixtures-cover-routing",
      "criterion": "Using actual temporary Git, SQLite, scoped grants, registered ingress sources, LocalExplorationStore and ProviderSettings with synthetic secret storage, prove all four existing decision families, all three configured adapters, exact candidate/pin identities, source closure and separate shared-rule metadata. Recorded adapter/transport cases cover primary success, permitted fallback, forbidden provider/local-only/missing policy, 401/403 no-fallback, transient retry exhaustion, timeout/cancellation, malformed/invented targets, low confidence, bounded telemetry, cache reuse/isolation/change/eviction, and source/credential/activation/binding/catalog/Project/settings races before send and before result. Assert zero sends for refused input and no late cache/result publication, no credential or structural private-path/identity metadata, no unrelated branch text, and no deliberately excluded synthetic canary in provider input or audit; owner-approved text is not claimed to be universally sanitized. A real synthetic TypeSafe JEV smoke must exercise this new public runtime, both A/B candidate views, all four families, explicit candidate publication through existing exploration mutate, and one in-flight revocation rejection; record actual result/latency and any not-run route honestly without changing Phase 0 benchmark claims. Run focused/affected tests, full Runtime verify, standalone verify and unchanged shipped plugin-artifact checks. Deterministic acceptance uses no real credential or model.",
      "identity": "sha256:d17101bb50aa4cad96536821dcd82bd8ff7156ee9bfe35c5739622329408ec64",
