      "acceptance_id": "routing-policy-controls-provider-use",
      "criterion": "Consume explicit local provider settings to route eligible Judge requests through OpenRouter, Vercel or official TypeSafe adapters with model-specific capability/schema checks. Enforce Project activation, current access, redaction and latency/cost/attempt budgets. Only selected/explicitly allowed fallback routes may receive data; API keys remain in local secure storage. No provider-specific core branches or subscription-to-API substitution.",
