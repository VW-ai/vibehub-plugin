    {
      "acceptance_id": "semantic-api-public-contract",
      "criterion": "Implement versioned scoped APIs for Project/Repository and exploration enrollment, Session/Execution registration, exact/current revision lookup, query/context materialization, candidate submission and explicit per-item adoption. Contracts enforce schema/size limits, idempotency, opaque cursors and object authorization; do not treat a branch name or worktree path as a credential.",
      "identity": "sha256:0e9b3eabe31e76030e45e014a403bd828a8fe4f8f3c9827280958ad9f817bb71",
      "revision": 2,
      "state": "active"
    },
    {
      "acceptance_id": "semantic-api-concurrency",
      "criterion": "Mutation commands pin source/destination/base revisions and authority. Stale GraphRevision CAS applies nothing; a separately admitted semantic conflict preserves alternatives. Per-exploration adoption does not promote Project canonical truth. Canonical Git materialization remains explicit and does not follow automatically from a Git merge.",
      "identity": "sha256:83ecb04fd10eb85116654c499257ffa6d986833c992d9d07fd4e50aa1d8229ee",
      "revision": 2,
      "state": "active"
    },
    {
      "acceptance_id": "ticket-workspace-management-api",
      "criterion": "Expose scoped Ticket origin/participation/execution-completion/independent-acceptance lineage and current-workspace relevance filters using the shared provenance projection. Implement per-user/workspace hide/restore preferences separately from shared Ticket business state with idempotency and current access; no destructive record delete endpoint is implied. Publish examples covering A-create/B-execute/C-closeout and unknown legacy origin.",
      "identity": "sha256:7597af8c384896b7ef03bd0bdda74a2dec1b7fe2eb41db2f3a2ce9ead5077013",
      "revision": 1,
      "state": "active"
    }
  ],
  "active_contract_revision": 3,
  "constraints": [
    "Implement within semantic-runtime/ with its own dependencies, build, tests and release; host/source integrations consume public contracts and never import sibling plugin internals.",
    "Retain existing replay/provider behavior, run affected contract tests and component boundary checks; release composition also runs standalone and plugin artifact checks. Do not rebuild completed Phase 0 work.",
    "Fast judges and workers produce auditable candidates/proposals; canonical writes require explicit authority and concurrency checks. Do not infer acceptance from model confidence.",
    "Use synthetic or explicitly selected, destination-authorized input for live calls; credentials stay outside Context, logs and Git. Existing Peel authorization is not blanket authorization for new sources or destinations.",
    "REFINE this same Ticket from its prerequisite Outcomes before execution; bind concrete schemas, commands, workloads and thresholds rather than treating draft acceptance as implementation authorization."
  ],
  "context": "提供 Project / semantic reference / proposal 命令 API. Delivery slice: alpha. Architecture: Tech Design §§19,25,26. Scope: Authenticated clients register projects and sources, resolve exact semantic versions, query/materialize Context and submit guarded semantic proposals through versioned public APIs.. Excluded: Only this bounded outcome; independently owned components are consumed through public contracts..  Refine exact adapter endpoints, fixtures, commands and measurable limits after its direct prerequisites close. Responsibility-transfer update: branch-graph-projection now owns guarded local enrollment/writes/views only; ticket-runtime-exploration-adoption-v0 retains the actual explicit-adoption and adoption-recovery obligations. This Ticket directly consumes that command or its persisted lineage, so remains blocked on its successful Outcome. Existing Acceptance/Contract history and all existing dependency edges are unchanged.",
