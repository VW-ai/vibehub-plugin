{
  "acceptance": [
    {
      "acceptance_id": "acceptance-and-contract-revisions-are-canonical-data",
      "criterion": "The versioned Ticket schema and shared validator represent every Acceptance with a stable logical acceptance_id, positive monotonic revision, immutable deterministic identity over logical ID, revision, criterion, explicit/default authority and immutable lineage, active or retired selection outside that identity, optional exact derived_from revision refs, and explicitly non-contract presentation data; they enforce unique (acceptance_id, revision) pairs, valid lineage, no revision gaps or identity collisions, and at most one active revision per logical ID. The stable ticket_id similarly owns positive monotonic complete Contract revisions whose immutable identities bind the exact Acceptance-revision identities, with active Contract selection outside historical identity; documented canonical serialization proves unrelated Ticket metadata, formatting, ordering, selectors, and presentation-only edits do not mutate historical semantic identities.",
      "identity": "sha256:e9266d60a5e5664eb2915d48594c2f2cefdb7ca3b6be4416b5ce81547cb7f1b8",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "current-repository-migration-preserves-historical-truth",
      "criterion": "A pinned regression fixture reproduces the policy audit at snapshot 59de368c8a420d2913a6aa7a9d35cf7f52a7e569—307 Evidence and 95 Outcomes reconstructable with zero legacy-unresolved, including 24 Evidence and the two named successful Outcomes whose contracts later drifted. Dogfooding processes every legacy document present at the actual migration commit, including the post-snapshot decision Evidence and Outcome, derives rather than hardcodes its corpus totals, preserves each old Outcome as successful for its old Contract revision, materializes later active revisions where required, and records reviewable migration Evidence without deleting historical files or falsely treating an old Outcome as adjudication of a newer contract.",
      "identity": "sha256:39702ecd3007324ea8cc6eef9acec9d042589d0fb1e80c8b9274bf2314b80fa5",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "evidence-and-outcomes-bind-exact-revisions",
      "criterion": "The atomically versioned Evidence schema requires every native or reconstructed bound record to carry exact Acceptance revision refs and immutable identities plus binding origin, and the atomically versioned Outcome schema requires every bound record to carry the exact complete Contract revision and identity it adjudicates. The only unbound alternatives are: migration-created legacy-pending-reconstruction, which preserves the complete old payload and is valid only with the owning Ticket's matching semantic-pending ref; and semantic-migration-created legacy-unresolved, which preserves the payload plus a machine-readable missing-or-ambiguous-history diagnostic and attempted provenance after the pending ref is cleared. Neither may be emitted by ordinary evidence or closeout writers or satisfy coverage, authority, DONE, archive, or dependency unlock; engine validation otherwise rejects missing, mismatched, nonexistent, retired-as-current, silently rebound, or tampered identities, preserves human-origin authority semantics, and keeps all historical proof readable.",
      "identity": "sha256:42b36afd187383c169a4528bbbea692b3f46b8ff4f7498a36c0f310095144e7e",
      "revision": 1,
      "state": "retired"
    },
    {
      "acceptance_id": "legacy-proof-migration-reconstructs-history",
      "criterion": "A declared project-format migration separates deterministic document/schema materialization from a semantic step with complete Git-history authoring guidance. The mechanical half dry-runs before writing and converts every legacy Ticket, Evidence, and Outcome into an explicit legacy-pending-reconstruction representation without inventing a revision or changing its asserted payload, reaches valid writable CURRENT with a durable per-Ticket pending ref, and makes revision-bound Ticket mutation, Evidence, closeout, and lifecycle credit wait on that ref while unrelated valid project work remains writable. The semantic half uses only each proof file's first appearance on the current HEAD ancestry to replace pending shapes with legacy v1 Acceptance and Contract bindings, appends the current contract as a later active revision only when semantic drift exists, marks origin reconstructed, emits legacy-unresolved only for demonstrably missing or ambiguous history, removes the pending ref only after that Ticket is complete, and is idempotent with identical identities, lineage, active selections, pending guidance, and unresolved reports on rerun.",
      "identity": "sha256:1a626dc79d574e0ccaebedc54e2012b2ae7c6bd0fff8738cba6d26c56a2e09e6",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "migration-and-host-artifacts-stay-atomic",
      "criterion": "Versions, all three document schemas, engine, migration registry, migration Skill guidance, upgrade package, Codex and Claude installed Plugin artifacts, Workbench host, and user/maintainer documentation advance as one format change; clean old-format fixtures and safe registered-worktree upgrade fixtures prove the mechanical half reaches valid writable CURRENT state with explicit legacy-pending-reconstruction documents and semantic refs, ordinary writers cannot create pending shapes or attach revision-bound work to their Ticket, unsafe worktrees remain unchanged and reported, semantic reconstruction runs only in the opened worktree under Agent review, no command pushes, and rollback preserves every prior revision and proof file.",
      "identity": "sha256:e24ab3ae136e313117e3643f4fcf699999f831e4d7189b0bc60f7cda6765124f",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "projection-uses-only-active-contract-coverage",
      "criterion": "The shared next_action derivation, Ticket get/graph/frontier queries, dependency unlock, DONE and archive projection count Evidence and Outcomes only when their exact bound revisions cover the active Contract revision; fixtures prove historical success stays queryable but does not close or unlock a newer active revision, unchanged migrated contracts retain their correct lifecycle truth, a new active revision routes through existing EXECUTE, NEEDS_HUMAN, CLOSE_OUT, and DONE behavior, and legacy-unresolved remains an explained proof-binding condition rather than a new Ticket status.",
      "identity": "sha256:76b3963aaba5743602c9ea3d0e95b18a3fee912ff63f802c7d1e72908541f5f7",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "regression-suite-proves-identity-and-rollback-boundaries",
      "criterion": "Focused and full verification cover stable serialization, criterion and authority changes, non-contract copy changes, Acceptance membership and ordering, new ID versus new revision, split/merge lineage, retirement, closed-revision mutation rejection, native and reconstructed proof, multiple historical revisions, missing and ambiguous Git history, idempotent migration, rollback, human authority, current projection, archive and dependency unlock, CLI/Workbench parity, installed-host parity, and deterministic artifact reproduction, with the complete repository suite passing.",
      "identity": "sha256:e8c28dfa2dd79418d3b4e4e66c43f6c50617ea38fc128a174d81e771bb1f7273",
      "revision": 1,
      "state": "retired"
    },
    {
      "acceptance_id": "semantic-mutation-appends-and-preserves-lineage",
      "criterion": "Ticket planning and apply behavior reject in-place mutation or deletion of any revision that already has Evidence or an Outcome and provide one canonical append path whose fixtures prove: strengthening, correcting, or redefining the same responsibility creates the next revision under the same acceptance_id; a separately passable responsibility starts a new ID at v1; split and merge retire predecessors and create new IDs with exact derived_from lineage; no-longer-applicable obligations retire without deletion or fabricated lineage; and display-only copy changes use non-contract presentation data without creating a new revision.",
      "identity": "sha256:308917ada45c32db366702d09c6930fd3081b6d6dd00ef1ff26a36f21be99de9",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "workbench-explains-revision-history",
      "criterion": "Workbench uses the same host projection to show the active Contract revision, each Acceptance's logical ID and revision, active or retired state, derived_from lineage, Evidence binding and origin, historical versus current Outcome coverage, and actionable legacy-unresolved detail; representative UI tests prove a user can distinguish old successful history from work required on the active revision without reading raw YAML or seeing historical proof labelled globally failed or stale.",
      "identity": "sha256:a1fe28d1801797090f335ff14ef8fd23fbfcc2c290be6354749c5d191d5e8967",
      "revision": 1,
      "state": "retired"
