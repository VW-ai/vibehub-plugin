  "context": "Both prerequisites hold successful Outcomes: the shared next-action contract exists and the owner explicitly selected Git reconstruction with unresolved fallback. The accepted proposal defines per-criterion identity as the stable serialization of ticket_id, acceptance_id, defaulted authority and criterion text, the complete contract as the sorted set of those triples, reconstruction through firstCurrentAddition on HEAD ancestry only, and the fallback semantics under which drifted or unreconstructable proof stops contributing to DONE, archive, dependent unlock and CLOSE_OUT until independently reviewed. This Ticket implements that policy: one optional binding structure on the Evidence and Outcome schemas following the deliveries and origin precedent, a deterministic replayable format 2 to 3 migration with a dry-run impact report whose counts are always recomputed at the migration HEAD, a closed-contract mutation guard beside the origin guard, and stale or unresolved proof explained through the existing seven next-action rows with new stable reasons rather than a new status. The Ticket document itself stores no digest; identity stays purely derived so the contract cannot drift against itself. A reconstructed binding may record its provenance commit as a reference, never as identity. Review of legacy-unresolved cases follows existing authority semantics: criteria with human authority return to the owner, the rest to independent adjudication; the audit at the planning HEAD showed two drifted successful Outcomes including one archived delivery, and the exact set is recomputed by the dry run at execution time. The explicit reopen protocol for closed contracts remains future work.",
