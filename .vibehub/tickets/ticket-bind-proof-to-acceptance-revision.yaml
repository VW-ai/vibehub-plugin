      "criterion": "One shared exported function in skills/vibehub-core/scripts/vh.mjs computes a per-criterion sha256 digest over the UTF-8 canonical JSON array of ticket_id, acceptance_id, authority with agent defaulted explicitly, and criterion text, and a complete-contract digest over the acceptance-id-sorted set of those triples; identical inputs produce identical digests from the source tree and from both installed Plugin artifacts, no timestamp, Git commit, filename or repository position enters the serialization, and unrelated Ticket context, constraints, relations, deliveries or copy changes leave every digest unchanged, proven by tests."
