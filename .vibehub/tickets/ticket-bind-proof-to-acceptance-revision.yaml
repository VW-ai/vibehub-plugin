    {
      "acceptance_id": "evidence-and-outcomes-bind-exact-revisions",
      "authority": "agent",
      "criterion": "The atomically versioned Evidence schema requires every native or reconstructed bound record to carry exact Acceptance revision refs and immutable identities plus binding origin, and the atomically versioned Outcome schema requires every bound record to carry the exact complete Contract revision and identity it adjudicates. The only unbound alternatives are: migration-created legacy-pending-reconstruction, which preserves the complete old payload and is valid only with the owning Ticket's matching semantic-pending ref; and semantic-migration-created legacy-unresolved, which preserves the payload plus a machine-readable missing-or-ambiguous-history diagnostic and attempted provenance after the pending ref is cleared. Neither may be emitted by ordinary evidence or closeout writers or satisfy coverage, authority, DONE, archive, or dependency unlock. Every Evidence selected by a native Outcome must bind the same exact Acceptance revision and identity that the adjudicated Contract contains. Evidence may cover several exact revisions, but after any included logical Acceptance advances, that grouped Evidence remains historical and native closeout must cite replacement Evidence whose complete claimed set is exact for the active Contract; it cannot partially reuse the old group for unchanged siblings while ignoring its stale claim. A reconstructed Outcome preserves its immutable legacy evidence_ids even when some refer to older revisions; those mismatched refs remain readable history but never become revision coverage, and every accepted human-authority revision still requires at least one referenced human-origin Evidence bound to that exact revision and identity, so stale human approval for v1 cannot satisfy a strengthened v2. Engine validation otherwise rejects missing, mismatched, nonexistent, retired-as-current, silently rebound, or tampered identities, preserves human-origin authority semantics, and keeps all historical proof readable; semantic migration encountering an invalid stale-human-proof closeout fails atomically and preserves the valid pending state for review.",
