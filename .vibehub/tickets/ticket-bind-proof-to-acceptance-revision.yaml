    {
      "acceptance_id": "evidence-and-outcomes-bind-exact-revisions",
      "authority": "agent",
      "criterion": "The atomically versioned Evidence schema requires every native or reconstructed bound record to carry exact Acceptance revision refs and immutable identities plus binding origin, and the atomically versioned Outcome schema requires every bound record to carry the exact complete Contract revision and identity it adjudicates. The only unbound alternatives are: migration-created legacy-pending-reconstruction, which preserves the complete old payload and is valid only with the owning Ticket's matching semantic-pending ref; and semantic-migration-created legacy-unresolved, which preserves the payload plus a machine-readable missing-or-ambiguous-history diagnostic and attempted provenance after the pending ref is cleared. Neither may be emitted by ordinary evidence or closeout writers or satisfy coverage, authority, DONE, archive, or dependency unlock. Every Evidence selected by a native Outcome must bind the same exact Acceptance revision and identity that the adjudicated Contract contains. A reconstructed Outcome preserves its immutable legacy evidence_ids even when some refer to older revisions; those mismatched refs remain readable history but never become revision coverage, and every accepted human-authority revision still requires at least one referenced human-origin Evidence bound to that exact revision and identity, so stale human approval for v1 cannot satisfy a strengthened v2. Engine validation otherwise rejects missing, mismatched, nonexistent, retired-as-current, silently rebound, or tampered identities, preserves human-origin authority semantics, and keeps all historical proof readable; semantic migration encountering an invalid stale-human-proof closeout fails atomically and preserves the valid pending state for review.",
      "identity": "sha256:5b7f7382d8e53700fecba086387ca5fcdf0b17e22b7192954ddd132c2ad5a525",
      "revision": 2,
      "state": "retired"
    },
    {
