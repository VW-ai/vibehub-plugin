      "authority": "agent",
      "criterion": "Focused and full verification cover stable serialization, criterion and authority changes, non-contract copy changes, Acceptance membership and ordering, new ID versus new revision, split/merge lineage, retirement, closed-revision mutation rejection, native and reconstructed proof, multiple historical revisions, missing and ambiguous Git history, idempotent migration, rollback, human authority, current projection, archive and dependency unlock, CLI/Workbench parity, installed-host parity, and deterministic artifact reproduction. A dedicated adversarial migration fixture proves that reconstructed human Evidence bound to v1 cannot support an Outcome for a strengthened v2 Contract and that rejection rolls the semantic migration back to its valid pending bytes. A representative production Workbench test asserts the user-visible active Contract, Acceptance revision, retired-history, lineage, exact-current-proof, historical Outcome, and binding-origin distinctions. The complete repository suite passes.",
      "identity": "sha256:b8e82f7b943cb561cb942b252d5d7fc2842ba225ec7088912dad82a7deab650b",
      "revision": 2,
      "state": "active"
    },
