  "active_contract_revision": 3,
  "constraints": [
    "Implement the selected semantic policy exactly; do not collapse revision history back into a current-or-stale boolean.",
    "Never delete, change the asserted semantic payload of, or silently rebind a historical Acceptance revision, Contract revision, Evidence record, or Outcome; the explicit migration may enrich legacy documents with pending then exact binding metadata without altering their original assertion or judgment.",
    "Do not use Git commit identity, filename, timestamp, array position, or mutable repository position as semantic identity.",
    "Unrelated Ticket context, constraints, relations, deliveries, formatting, provenance, and presentation-only copy must not change Acceptance or Contract identity.",
    "legacy-unresolved is only for missing or ambiguous reconstruction; a reconstructable Outcome for an older Contract revision remains historically successful even when a later revision is active.",
    "Human-authority Acceptances still require human-origin Evidence bound to their exact revision.",
    "Keep the existing Ticket lifecycle and shared next_action contract; do not invent a revision-specific Ticket status.",
    "The migration must declare a deterministic mechanical half and separately guided semantic Git-history half, remain idempotent, and preserve rollback through Git.",
    "legacy-pending-reconstruction is an explicit temporary migration shape, not a successful binding, stale proof, or legacy-unresolved result; ordinary Ticket, Evidence, and Outcome writers may not create it, and revision-bound work on that Ticket remains blocked until the semantic step resolves it.",
    "Do not add a database, ledger service, daemon, hidden cache, signature authority, runtime compatibility shim, automatic push, stash, reset, or cross-worktree semantic mutation."
  ],
  "context": "The owner selected an append-only semantic model. One logical Acceptance keeps its acceptance_id while strengthening, correction, or redefinition appends a monotonic revision; an independently passable obligation gets a new ID; split or merge creates new IDs with derived_from lineage from retired predecessors; and an obligation that no longer applies is retired without deletion. Contract revisions bind exact Acceptance-revision membership. Evidence remains valid for its exact Acceptance revision and Outcome remains successful for its exact complete Contract revision, while a later active Contract revision needs new adjudication. Presentation-only copy is non-contract data. Legacy proof is reconstructed from first appearance on current Git ancestry; ordinary contract drift creates old and new revisions, while legacy-unresolved is reserved for missing or ambiguous history. The existing upgrade contract requires a valid CURRENT project after the deterministic mechanical commit but defers Git-history judgment to an Agent in each worktree, so the new schemas need one explicit legacy-pending-reconstruction shape: it preserves unversioned historical payloads without assigning a false revision, cannot be created by ordinary writers or count as current proof, and must be resolved by the declared semantic step before revision-bound Ticket work continues.",
