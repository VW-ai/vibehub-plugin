    {
      "acceptance_id": "ingress-policy-effects",
      "criterion": "Map signals to exploration-scoped assertions/relations and IGNORE/INGEST/DEFER/ESCALATE intents. When synthesis is needed, compose the local runner-owned WorkerNode dispatch/result-continuation adapter, supplying the pinned tool-bearing bundle/schema and yielding without waiting. Consume its new pinned-policy continuation after guarded proposal validation; do not implement a second scheduler or result gateway here. Missing auth/quota/capability or disabled Project remains pending/deferred/cancelled, not invented success. Preserve multiple targets, sources and protected authority; no interactive developer Session is required for background maintenance.",
      "identity": "sha256:1ac92c0beb0c7f1dcdb675a6eb9a07383215ea59cf92bd92c5ae100bf3b285a1",
      "revision": 3,
      "state": "active"
