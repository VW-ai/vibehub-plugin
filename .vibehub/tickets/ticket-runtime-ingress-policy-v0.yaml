      "criterion": "Map signals to exploration-scoped assertions/relations and IGNORE/INGEST/DEFER/ESCALATE intents. When synthesis is needed, offer a versioned tool-bearing work request through the local bridge or leave pending; a missing separate Worker never authorizes fabricated results. Preserve multiple targets, sources and protected authority.",
