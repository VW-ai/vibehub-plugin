    {
      "acceptance_id": "derived-acl-rule",
      "criterion": "DurableIngress ordinary submit, event/receipt/snapshot/cursor reads, pending inspection and handoff consult current registration policy plus the O(1) source-object summary before accepting or returning content; one denied provenance support denies the full result while unrelated objects remain usable. repository_removed and installation_revoked atomically install the exact deny-all historical-read policy enabled:false, allowed_principal_ids:[], sensitivity:restricted, allow_snapshots:false. visibility_changed and author_access_redacted must preserve all no-broadening dimensions together: requested principals are a subset of current principals, sensitivity is nondecreasing, enabled and allow_snapshots cannot change false to true, and at least one historical-read dimension (principal set or sensitivity) is strict; enabled:false alone is never accepted as proof of historical-read denial. The privileged submitSourceLifecycle path remains ProjectActivation capture-gated and producer/catalog/identity/causal validated, accepts no snapshot bytes or mutable payload, and bypasses current registration/object content denial only to atomically capture normalized lifecycle metadata and install its guard. For an exact Graph source_access mutation only, LocalGraphStore's selected accepted_event port derives the deterministic invalidation ID from the operation/prior event and authenticated scope, then may resolve the current retained invalidation event and exact prior lifecycle events referenced by current Graph projections after ordinary ingress access denies them; it still enforces graph:lifecycle authority, captured event ACL, target, digest, producer epoch and sequence checks. Assertions, resolve/query, receipts, pages and ordinary ingress APIs never use this path. A target absent from Graph remains only a durable guard/notice and never creates a fake Graph observation.",
