      "acceptance_id": "source-lifecycle-events",
      "criterion": "Add the fixed local source-invalidation domain and three exact DurableIngress commands: submitSourceLifecycle atomically admits one fresh SOURCE_ACCESS_CHANGED or SOURCE_TOMBSTONE metadata event and applies its guard/policy/fence; applyAdmittedSourceLifecycle applies an exact already-admitted event without rereading private payload; applyAdministrativeInvalidation records repository_removed, installation_revoked, visibility_changed or author_access_redacted without fabricating an event. Every event-backed command writes the deterministic scope+event_id invalidation ID consumed by the unchanged Graph source_access operation, with no scan or caller locator. Existing updateSourceAccess keeps its request/result shape and atomically emits a direct_access_update fence notice. Per-(sourceObjectKey,sourcePartitionKey) rows compare sequence only within one partition/producer epoch, while an O(1) per-object summary maintains blocking-stream count plus irreversible tombstone. Only a strictly newer sequenced active event in the same authoritative stream may clear that stream's unknown guard; cross-stream integers are never compared, null order never reopens, other blocking streams still deny, and a tombstone never reopens. Exact retry returns the original bounded receipt and changed reuse rejects. All concrete Runtime composition sites include the new namespace; missing namespace fails closed rather than disabling guards.",
      "identity": "sha256:428fad9a465d6c93d31e341a9cac1d59c361ed145a05c65192027e729dac34c7",
