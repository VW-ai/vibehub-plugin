  "constraints": [
    "Implement within semantic-runtime/ with its own dependencies, build, tests and release; host/source integrations consume public contracts and never import sibling plugin internals.",
    "Retain existing replay/provider behavior, run affected contract tests and component boundary checks; release composition also runs standalone and plugin artifact checks. Do not rebuild completed Phase 0 work.",
    "Fast judges and workers produce auditable candidates/proposals; canonical writes require explicit authority and concurrency checks. Do not infer acceptance from model confidence.",
    "Use synthetic or explicitly selected, destination-authorized input for live calls; credentials stay outside Context, logs and Git. Existing Peel authorization is not blanket authorization for new sources or destinations.",
    "REFINE this same Ticket from its prerequisite Outcomes before execution; bind concrete schemas, commands, workloads and thresholds rather than treating draft acceptance as implementation authorization.",
    "Keep one fixed local source-invalidation domain in the existing DomainStore; do not add a generic registry, event bus, scheduler, callback trust hook, second database or migration.",
    "Use per-object/per-sourcePartition rows plus an atomically maintained O(1) object summary; do not cap lifetime source streams, compare sequence across streams or scan all guards during materialization.",
    "Never let lifecycle handling expose raw content. The selected Graph path is exact retained normalized security metadata only, preserves captured ACL checks and is unreachable from all ordinary reads and non-source_access operations.",
    "Immediate denial must work while Project capture is disabled and before any Graph lifecycle mutation; fresh capture and reopening stay activation-gated, and absence of an admitted Graph target never authorizes fabricating one.",
    "repository_removed and installation_revoked must install deny-all current read policy; enabled:false alone is capture control and must never be represented as historical-read invalidation.",
    "Explicitly compose the source-invalidation namespace. Missing support fails closed; no compatibility fallback may silently skip guard checks.",
    "Do not claim nonexistent cache, index, compiler, connector or Worker state was recomputed. Supply only the bounded fence/feed contract their later Tickets must consume."
  ],
  "context": "Executable local invalidation refinement 2026-09-22. The accepted DurableIngress Contract3 and LocalGraphStore Contract3 are the exact direct prerequisites and their historical dependency edges remain unchanged. Current Graph reads already re-run DurableIngress current registration ACL/sensitivity through retained admitted-event provenance, including while Project capture is disabled. This Ticket fills the remaining local gap: constant-time object denial, an atomic source-policy invalidation fence/feed, and a narrowly authorized lifecycle-metadata path that cannot become a general private-content bypass.\n\nIMPLEMENTATION AND COMPOSITION. Add semantic-runtime/src/local/source-invalidation.mjs with the fixed DomainStore namespace source-invalidation. DurableIngress remains the sole mutation owner because it owns registrations, admitted events and their private storage keys; the new module supplies fixed keys, validation, transaction helpers and SourceInvalidationFeed, not a callback or generic event bus. Extend the public Runtime exports, durable-ingress and graph-store fixtures/examples, and every composition that constructs those services so its explicit DomainStore namespace allowlist contains source-invalidation. DomainStore schema2 already supports the rows, sources and indexed source ranges, so add no table or migration. A missing namespace or corrupt/missing guard/summary fails with bounded unknown_namespace/corrupt state; it never silently restores unguarded behavior. The concurrently maintained JEV smoke remains outside this Ticket; coordinate before touching its composition.\n\nCOMMANDS AND AUTHORITY. submitSourceLifecycle(context,{registration_id,epoch,event,expectedVersion,access_state,access}) accepts exact fields, requires source:invalidation:capture plus ingress:submit/store:read/store:write/project:inspect, and requires the authenticated principal to be the registration's producer. It uses ProjectActivation stage capture and in one existing DurableIngress transaction validates the current registration/version, event ID, mapping/catalog/identity, exact partition and producer epoch, causal cursor, at most32 distinct source objects, and event type. access_state is exactly active, unknown or tombstoned: SOURCE_ACCESS_CHANGED permits active/unknown and SOURCE_TOMBSTONE requires tombstoned. No snapshot_text argument exists; payload must be an immutable object_revision or git_revision, never snapshot or mutable_pointer. This path may bypass registration enabled/current allowed-principal and object-summary content checks only for this lifecycle envelope, then atomically admits the normalized event/cursor/outbox and applies the policy/guards/fence. It never returns or accepts provider body bytes.\n\napplyAdmittedSourceLifecycle(context,{registration_id,event_id,expectedVersion,idempotency_key,access_state,access,activation_epoch}) is the migration/retry path for an exact immutable event already admitted by DurableIngress. It resolves the stored event, receipt, catalog and captured registration link internally without public readEvent and never reads raw body or snapshot bytes. active requires a current non-null activation_epoch and ProjectActivation result admission; unknown/tombstoned require activation_epoch null and may strengthen denial while capture is disabled. applyAdministrativeInvalidation(context,{registration_id,expectedVersion,idempotency_key,reason,access}) is limited to repository_removed, installation_revoked, visibility_changed or author_access_redacted and creates a notice/registration restriction but no event/object observation. The first two reasons require the exact deny-all policy {enabled:false,allowed_principal_ids:[],sensitivity:'restricted',allow_snapshots:false}. For the latter two, and for optional access on unknown/tombstoned lifecycle commands, apply one shared conjunctive no-broadening validator: requested allowed principals are a subset of current, sensitivity is nondecreasing, enabled and allow_snapshots cannot change false to true; administrative visibility/redaction also requires at least one historical-read dimension (principal set or sensitivity) to be strict, so enabled:false alone is insufficient. This is necessary because existing historical read authorization intentionally ignores enabled and checks current principals/sensitivity. These apply APIs require source:invalidate plus ingress:read/store:read/store:write and human/service kind. Existing updateSourceAccess retains its exact public request/result and ingress:register authority while atomically emitting reason direct_access_update; setting enabled:false there blocks capture but does not claim historical reads are invalidated. Optional lifecycle access is null for object-only guarding or the complete registration access shape; active broadening is governed separately below and every registration change uses its expectedVersion CAS. Captured event ACL always remains an independent upper bound.\n\nSTREAM ORDER AND SUMMARY INVARIANT. Define streamKey as sourcePartitionKey({partition,event.producer without sequence}); DurableIngress already prevents two live registrations from owning the same exact partition/producer epoch, and every guard also pins registration_id for audit. Persist one unbounded fixed row per (sourceObjectKey,streamKey), not a lifetime array: {object,stream,registration_id,state,event_id,event_digest,sequence,notice_sequence}. Persist one summary per object: {blocking_stream_count,tombstoned,version}. active contributes zero blockers, unknown contributes one, and tombstoned sets the irreversible global bit. Replacing a same-stream row atomically adjusts the count by the old/new contribution. A non-null sequence may replace only a lower non-null sequence in that same stream; equal exact input is retry, equal changed input conflicts, lower is superseded, and a prior null sequence is permanently incomparable. A new stream creates its own row. Its active state cannot remove another stream's blocker; effective access is allowed only when tombstoned=false and blocking_stream_count=0. No timestamp, arrival order, registration version or bare sequence across streams decides precedence. A tombstone summary bit never clears. Corrupt count/row transitions reject the transaction rather than recomputing with an unbounded scan.\n\nMULTI-TARGET AND POLICY EFFECTS. A lifecycle event has at most32 unique targets. Restrictive unknown/tombstoned input may atomically strengthen targets whose same-stream position is not newer and reports applied/superseded target references in its bounded receipt; it never weakens a newer row or widens any registration-policy dimension. An active input may clear only its same-stream comparable unknown rows and registration broadening is refused unless every requested target transition is comparable and every resulting object summary is unblocked and not tombstoned. Exact command identity is scoped actor+registration+event/idempotency key and retains an inert request digest. Event-backed commands also write exactly one deterministic invalidation record whose ID is sourceLifecycleInvalidationId(authenticated scope,event_id); export that pure bounded helper so GraphInputs derives the lookup from its unchanged source_access event rather than scanning or accepting a caller locator. Changed reuse or an existing event ID with a different digest/state rejects. Fresh submit always keeps its normal cursor/outbox admission in the same transaction; historical/admin application changes no source cursor, ingress completion or ACK. Failed auth/version/digest/size/transaction writes nothing. A stale but valid fresh event may retain its ordinary ingress receipt plus a superseded lifecycle result, but cannot change guard, policy or fence.\n\nREAD AND MATERIALIZATION FENCES. Every ordinary DurableIngress materialization path performs current registration/captured ACL checks and one summary lookup for each provenance source object: submit, getReceipt, readEvent, readSnapshot, getSource cursor expansion, listPending and handoff. Any tombstoned, blocking or corrupt summary denies the whole item; there is no filtered cursor, partial result or sanitized-snapshot exception. Events with no invalidation row use an initialized zero-blocker summary created on first admission; after this Ticket a missing required summary is corruption, not active. At most32 provenance targets keeps event checks bounded; summaries make each target O(1), independent of retained stream count. Registration reads additionally obey current allowed principals and sensitivity. repository_removed/installation_revoked therefore deny every historical read through their forced deny-all registration policy even when no object guard exists; enabled:false by itself blocks only future capture. LocalGraphStore ordinary accepted-event reads continue through this exact boundary, so historical resolve/receipt/page fail closed immediately after the invalidation transaction even when no Graph lifecycle mutation exists. One denied support denies a multi-source derived revision; unrelated objects remain usable.\n\nGRAPH LIFECYCLE SELECTION. SourceInvalidationFeed.readLifecycleEvent requires store:read, source:invalidation:read, source:invalidation:consume and service/worker kind and accepts only the deterministic invalidation_id; callers cannot supply a registration, path or arbitrary locator. It returns only normalized SOURCE_ACCESS_CHANGED/SOURCE_TOMBSTONE metadata, admitted receipt/digest, captured access and invalidation reference; no raw envelope, snapshot bytes, provider token or arbitrary source content. In LocalGraphStore, enable a special selected accepted_event resolver only when write=true and operation.kind=source_access. It derives the current ID with sourceLifecycleInvalidationId(scope,operation.event.event_id). For prior lifecycle observations, the resolver authorizes only observations encountered through the current head's source_access projection rows for the current at-most32 targets and matches their immutable graph-accepted-event/access_update facts; no feed scan or general fallback is allowed. Ordinary acceptedEvent remains first choice and the special current/prior path is attempted only for source_access_denied. The selected resolver and authorizeLifecycle share the exact cached record and still require graph:lifecycle, source:invalidation:consume, current publisher/activation authority, matching target set, captured effective ACL containing the Graph principal, producer epoch and advancing sequence. It bypasses only current registration/object denial for these lifecycle metadata lookups. If the caller never had captured access, Graph mutation remains unavailable while the ingress guard still protects reads. Assertions, resolution, coverage, normal reads, stored receipt validation and pages always use ordinary acceptedEvent. Unknown/tombstoned Graph targets and core ordering checks remain unchanged, so a tombstone-before-content produces a guard/notice but no fabricated Graph object, assertion, catalog or observation.\n\nATOMIC FEED AND DISABLE SEMANTICS. Each effective policy/object change writes its command receipt, stream guards, object summaries, immutable notice and one Project-scoped monotonic fence in the same transaction as its registration/event changes. Fence sequence is a safe integer and fixed-width notice IDs support indexed getSourceRange pages. Administrative restriction and unknown/tombstoned application of already-admitted events bypass ProjectActivation solely so denial works while disabled. Fresh submitSourceLifecycle is capture-gated even when restrictive, and active historical reopening is result-gated; disabling a Project never authorizes fresh capture or reopening. Denial requires no Graph commit, ACK or completion. Retention is append-only here; no pruning or legal-erasure claim.\n\nCONSUMER CONTRACT. SourceInvalidationFeed head(context) returns the Project fence; page(context,{after,limit}) returns immutable bounded notices and a locator; assertFence(context,{sequence}) succeeds only while the exact scoped fence is current; readLifecycleEvent is the narrow security metadata operation above. page uses limit1..64, fixed-width sequence bounds and the existing1MiB complete-response cap, with no OFFSET/full scan. A later canonical reader/query/index/cache/compiler must pin before building and recheck before serving; mismatch quarantines the output and the consumer may page notices. This Ticket implements no such consumer, checkpoint, ACK, cache, index, compiler, vector deletion, recomputation worker or scheduler and claims no downstream refresh.\n\nFIXTURES. Use actual temporary SQLite, real DurableIngress and LocalGraphStore, and admitted synthetic events. Include atomic crash tests around fresh lifecycle admission+guard/fence, admin/historical application and summary count changes. Prove normal producer lifecycle admission after current registration/object denial succeeds only through the explicit capture-gated metadata method, while ordinary content and disguised snapshot/mutable payload fail. Cover same-stream0/2/1, exact replay, null order, two registrations/producer epochs targeting one object, permanent tombstone, multi-target partial restrictive effects and all-target active broadening. Instrument summary reads to show O(targets), not retained-stream scans. Prove repository/installation forced deny-all blocks historical ingress and Graph reads; enabled:false alone still permits an otherwise authorized historical read and applyAdministrativeInvalidation rejects that insufficient policy. For Graph, prove current and prior lifecycle selection for a captured-authorized service after current revocation, and negatives for a never-captured principal and every non-source_access path. Also cover namespace omission, Project disabled behavior, multi-source closure, source-version races,32-target/64-page/1MiB bounds, stale fence, restart and SIGKILL before/after commit. Run event, causal, auth, DomainStore, ProjectActivation, DurableIngress, GraphStore and boundary suites. All fixtures are synthetic; no model/network call, repository content, credential, Peel trace or connector is used.\n\nEXCLUSIONS. No provider connector, organization IdP, permissions UI, host/session enrollment, Policy worker, generic event bus, cache/index/compiler implementation, vector erasure, legal retention, cloud sync, canonical Git write, source completion or automatic semantic mutation. Existing downstream Tickets retain those responsibilities. This Ticket supplies the bounded local security substrate without weakening local-first privacy or ordinary Agent/plugin availability.",
