      "acceptance_id": "store-implements-revision-protocol",
      "criterion": "Implement the real LocalGraphStore in the existing scoped DomainStore using independently accepted incremental wire2 manifests/commits/finite plans and unchanged V1 semantic revision/conflict/address/provenance behavior. Provide explicit publisher registration, initialization, assertion/conflict/lifecycle mutation, receipt/head/point/page and bounded rebuild APIs described in Context. Retain entities, relations, assertions, all conflicts/resolutions, lifecycle/source-epoch projections, original catalog/source provenance and exact captured per-source watermarks as individual immutable records plus indexed per-key deltas. Initialize explicit versioned domain format, reject unsupported/newer/corrupt formats without overwrite, and document initial/future migration and retention boundaries. No bounded cumulative reference-state wrapper, snapshot-digest coercion or whole-history reconstruction occurs on request paths.",
