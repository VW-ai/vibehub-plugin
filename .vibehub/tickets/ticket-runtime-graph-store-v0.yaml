  "constraints": [
    "Implement within semantic-runtime/ with its own dependencies, build, tests and release; host/source integrations consume public contracts and never import sibling plugin internals.",
    "Retain existing replay/provider behavior, run affected contract tests and component boundary checks; release composition also runs standalone and plugin artifact checks. Do not rebuild completed Phase 0 work.",
    "Fast judges and workers produce auditable candidates/proposals; canonical writes require explicit authority and concurrency checks. Do not infer acceptance from model confidence.",
    "Use synthetic or explicitly selected, destination-authorized input for live calls; credentials stay outside Context, logs and Git. Existing Peel authorization is not blanket authorization for new sources or destinations.",
    "REFINE this same Ticket from its prerequisite Outcomes before execution; bind concrete schemas, commands, workloads and thresholds rather than treating draft acceptance as implementation authorization."
  ],
  "context": "Implement the transactional Semantic Working Graph store. Delivery slice: alpha. Architecture: . Scope: Schema, migrations, transactional adapter, current projections, snapshot reads, outbox coupling, and adapter conformance.. Excluded: Dedicated graph database, unrestricted ontology, canonical code history, ranking, and connector ingestion..  Required transitive artifacts: graph-contract: The Graph adapter implements the accepted revision/assertion/snapshot contract. Refine exact adapter endpoints, fixtures, commands and measurable limits after its direct prerequisites close.\n\nRefinement finding2026-09-22: preserve every current Acceptance revision and Contract2; do not promote this Ticket to firm or execute a bounded fixture wrapper as the alpha store. The accepted Working Graph reference requires an entire ordered state with at most128 snapshots,512 records per snapshot array and one immutable catalog. Per-transition delta storage followed by full reference-state reconstruction still has those lifetime limits and does not meet the current production-adapter criterion. A proposed SQLite schema must separate total retained history from per-operation/row/page limits and retain exact historical authorization and rebuild semantics. The new direct incremental-graph-contract prerequisite supplies the missing versioned transition/address/paging input; refine this same Ticket only after its independently successful Outcome. The selected SQLite/DomainStore prerequisite remains DONE and its historical dependency is preserved unchanged.\n\nCandidate adapter direction, deliberately not executable acceptance yet: one working-graph namespace in the existing DomainStore, immutable genesis/catalog/admission pins and per-commit/revision/conflict/source records, a small scoped CAS head and independently versioned disposable current projection, exact idempotent command receipts and one atomic outbox intent. Avoid a cumulative state.snapshots JSON row and duplicate whole-history rows. The prerequisite must settle the actual commit/address/index/paging format before SQL/repository implementation is authorized; do not invent snapshot_digest compatibility. Proposed API families are initialize, applyAssertion, resolveConflict, updateSourceAccess, getReceipt, resolveExact/resolveAt, bounded history/head pages and rebuildProjection. Mutations must derive tenant/Project from opaque auth, authenticate trusted App/human graph/lifecycle authority distinctly and compose current ProjectActivation epoch/expected-head CAS inside the same DomainStore transaction. Reads select the actual current authorization state rather than accepting a caller current_graph. Actual production source ingestion/invalidation, host Session/Execution enrollment, branches/adoption and user-facing HTTP APIs remain owned by their existing downstream Tickets; do not create a cycle to claim these already exist.\n\nThe real adapter refinement must pin exact schemas/bounds and prove more than128 transitions and512 independent records in one generation, restart/history pages/current ACL, exact retry and conflicting duplicate behavior, concurrent SQLite CAS, immutable command/revision/audit/outbox atomicity, pre/post-commit failure, deterministic paged rebuild, corrupt/newer schema refusal and migration/retention policy. A bounded prototype may inform these choices but cannot retire or close current Acceptance. New catalog/enrollment and compaction/checkpoint work may be necessary, but only independently proven formats can become actual implementation prerequisites. No graph implementation or canonical plan application occurs in this candidate.\n\nRead-only refinement preparation2026-09-22 after incremental Contract1 independently DONE (Outcome contract-v1; sha256:c74c56f1972c38122f0aea93b245e462da73e8d66110f154d910dc7f35931976): preserve every Acceptance revision and Contract2 unchanged and keep this Ticket draft. Actual DomainStore needs a separately executable selected-read prerequisite (ticket-runtime-store-selected-reads-v0): bounded scoped source ranges, coherent read snapshots and same-write-transaction exact/range source reads. Existing source composite PK suffices; no new DB/table/ORM is justified. This added causal edge supplements, never replaces, the two historical dependencies. Refine the real adapter only after this small input is accepted and its exact public API is available.\n\nThe now-concrete adapter direction uses incremental wire2 manifests/commits and unchanged V1 semantic revision/provenance addresses, not coerced snapshot digests. Store canonical individual commits/revisions/catalog and accepted-event pins plus ordered sequence keys and independently versioned derived temporal/page indexes; no cumulative state.snapshots, full entity/source array or full-history reconstruction during bounded mutation/point/page reads. The same scoped DomainStore transaction authenticates current caller/publisher/source facts, calls the pure planner, checks head/projection CAS, then appends semantic records, audit, exact idempotent command receipt and durable graph-changed outbox together. Never accept a client effect plan as authority. Exact retries reconcile the original receipt under current access; stale GraphRevision remains zero-effect and semantic base mismatch remains a separate admitted conflict. Read snapshot uses exact selected commit membership and live access state from its coherent current view. Old cursor is location only. Bounded restartable projection rebuild may replay canonical commit pages; it must not rewrite immutable semantics, historical access or original event catalogs. Retention remains explicit/no pruning until a later tested protocol.\n\nSource/publisher enrollment is a real remaining refinement input, not self-certified JSON. Internally construct DurableIngress/GitProjectRegistry with the same store and authority. Accept selected already-admitted event IDs and their actual immutable receipts/catalogs; compare every supplied normalized body to that original pin and recheck current ingress source policy when materializing support. A caller-authored catalog/event/sanitized flag is not an accepted source. Current Git identityCatalog has sessions/executions=[] while every semantic assertion needs a mapped Execution. The smallest proposed ownership is inline App-owned semantic-publisher runs: explicit authenticated human/service graph:publish registration allocates a Project-only runtime service Session/Execution and immutable owner/installation attribution; it does not claim a Codex/Claude conversation, host attachment or Worker success. Build each current command catalog from current Git membership plus only the selected publisher run, retain it with that command, and keep historical ingress catalogs separate. Do not accumulate every lifetime execution in one catalog. Compare inline ownership against a separate prerequisite only if another independently scheduled consumer actually requires it; no generic identity server or source connector is proposed.\n\nIngress receipt/handoff does not prove semantic completion. Exact watermarks must come from real selected source cursor/coverage facts; unknown coverage remains unknown and no completed_through is advanced from ACK or a single Graph assertion. Current ACL/tombstone transitions still require distinct authenticated target authority, and disable must not prevent administrative revocation from taking effect. Refine that narrow administrative path explicitly rather than weakening ordinary epoch-gated result writes. Later source invalidation, Policy journal and branch/HTTP Tickets keep their existing responsibilities and dependencies; this preparation does not claim or implement them.\n\nFinal Graph acceptance revision must still bind real1040-transition/600-object same-generation SQLite conformance, historical/current-ACL pages, bounded indexed lookups, restart/duplicate/concurrent-CAS tests, before/after-commit process death, source authority negatives and deterministic paged rebuild. Temporary planning design is intentionally not a canonical Context path or execution authorization. No Graph source, schema or record is written by this candidate.",
