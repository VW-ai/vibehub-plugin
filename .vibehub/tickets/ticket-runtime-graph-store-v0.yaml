  "context": "Executable local adapter refinement2026-09-22. Exact independently accepted prerequisites are DomainStore Contract2, incremental Graph Contract1 and selected-read Contract1; the Ticket refs bind their Outcomes/Evidence. Use current accepted auth/Git/activation/ingress as implementation inputs, not fictional enrollment. This is the actual persisted local Graph adapter, not an in-memory fixture wrapped in JSON. Preserve every prior Acceptance/Contract revision and all existing dependency edges. The original four obligations remain implemented in full; authenticated source/publisher admission is a separately verifiable additional obligation.\n\nKeep this as one coherent adapter Ticket: canonical commit format, atomic current/temporal/page indexes and bounded repair must share one consistent stored representation; splitting repair into a later task would leave the current index format unproved and fail the existing rebuild obligation. The independently useful generic selected-read primitive is already a separate accepted Ticket. Live source ingestion, host enrollment, Policy completion, connector invalidation and public delivery remain with their existing independent owners. No new service or generic registry is needed. Implementation can be split across two owned production files plus independent fixture work without adding another persisted lifecycle.\n\nPUBLIC API AND AUTH. Implement LocalGraphStore({store,authority}) in semantic-runtime/src/local/graph-store.mjs using the supplied real DomainStore and LocalCredentialAuthority, constructing its GitProjectRegistry, ProjectActivation and DurableIngress from those same objects. Namespaces are registered by the trusted owner; add only working-graph alongside the existing dependent namespaces. Do not accept a supplied fake port, current_graph, current principal, catalog, executable effect plan, SQL or client callback. Inert bounded exact request fields precede property access. All methods derive tenant/Project and audience from the current opaque grant and use bounded errors without supplied text/SQL diagnostics.\n\nregisterPublisherRun(context,{epoch,run_key}) is an explicit human/service graph:publish operation with store read/write, project:inspect and activation:admit. It allocates immutable Project-only Session/Execution IDs for the ACTUAL logical semantic publication run, binding authenticated actor/kind, current Git installation/workspace and activation epoch. It records no host identity, process continuity, online/running state, Job or Worker success. No open/close state machine is added. Exact scoped actor+run_key retry returns the original registration; a changed epoch/identity under that key rejects. New registration is activation-gated. Return {status:'registered'|'duplicate',publisher_ref,session_id,execution_id,epoch}. Each subsequent new write requires the same actor, installation and epoch; disable/re-enable fences old publication runs. A fresh scoped credential for the same principal can explicitly resume the same logical run in its still-current epoch, without implying process liveness. Credentials never enter stored records. Historical receipts are separately readable under current authority, independent of resumability.\n\ninitialize(context,{generation_id,epoch,idempotency_key,publisher_ref,coverage}) creates one immutable wire2 genesis/manifest and small CAS head. mutate(context,{epoch,idempotency_key,publisher_ref,expected_graph,operation,coverage}) accepts the core assert/resolve/source_access operation bodies, except callers cannot supply operation.watermarks. For assert/resolve, assertion.execution_id must exactly equal the authenticated publisher run's execution. The service constructs current catalog_pin internally. Return {status:'applied'|'duplicate',receipt,revision?,conflict?,access_revision?} after commit, or the accepted graph_revision_mismatch result with the original unapplied request and effects:[]; no silent rebase. initialize/mutate require human/service graph:write, store read/write, project:inspect, activation:admit and ingress:read. source_access additionally requires graph:lifecycle, a deliberately Project-scoped operator grant; validate every explicit event target is an admitted object in this scope and retain an immutable target/event/predecessor/actor/epoch authority receipt. A source event's taxonomy or captured ACL never grants lifecycle authority. All new semantic writes, publisher registrations and rebuild batches compose ProjectActivation.withAdmission in the same SQLite transaction; no ordinary or administrative semantic write bypasses activation.\n\ngetHead(context,{generation_id}) returns the exact current graph reference plus bounded maintenance state. getReceipt(context,{generation_id,idempotency_key}) returns the exact immutable receipt or null only to its scoped actor with graph:read and current source access. resolve(context,{at,address}) and page(context,{at,collection,cursor,limit}) reuse accepted wire2 graph addresses, V1 exact/logical semantic refs and collection/cursor shapes. Reads require graph:read/store:read/ingress:read and perform one coherent DomainStore.readSnapshot. They work while Project capture is disabled if current read access still permits. Exact misses never fall forward to latest; cursor scope/generation/commit/selector is checked and conveys no grant. Every returned point/page or receipt payload is gated by actual current ingress registration policy as well as core captured/provenance/current Graph access. A denied selected support causes the entire operation to return a bounded denied result/error without partial content or a fabricated continuation. This intentionally conservative first adapter may deny a whole page containing inaccessible ingress support; it does not rewrite immutable event ACLs or pretend filtered continuity. Pure core ACL-filtered pages retain their defined bounded-candidate behavior when all repository evidence itself is materializable.\n\nPUBLISHER/CATALOG AND SOURCE TRUST. Each command catalog consists of the current actual Git catalog plus ONLY its selected runtime publication Session/Execution, with explicit runtime attribution. Never fabricate a Codex/Claude session or accumulate lifetime Session/Execution history in one current catalog. Retain each exact selected command catalog as an immutable fact. Original normalized events validate under their retained DurableIngress catalog_ref, independently of the new command catalog. Current Git catalog changes cannot reinterpret old event IDs. For every new, inherited, relation endpoint or lifecycle event, resolve its actual DurableIngress.readEvent by event_id, compare the entire normalized body/digest and retain the original receipt, catalog and current source registration locator. Arbitrary caller event/catalog/sanitized JSON cannot become an accepted fact. Accepted-event catalog bodies come from the real scoped immutable ingress source row named by its authorized receipt, with exact kind and digest checked. Graph source locators remain linked to ingress after first publication, so subsequent source ACL or sensitivity tightening gates copied historical Graph content. The trusted service may retain the required event/catalog bytes in its own immutable facts, but they never replace current source policy.\n\nDISABLED REVOCATION. All Graph writes stay activation-gated, including lifecycle and maintenance. The existing authenticated DurableIngress.updateSourceAccess already runs without Project activation, persists a source-access audit and CAS revision, and can remove principals or raise sensitivity while disabled. Graph reads recheck this policy in their actual coherent view, so a read starting after that restriction commits denies old retained Graph support/receipts/pages. No new Graph administrative bypass, fabricated lifecycle event or automatic disabled-gap capture is added. A snapshot read concurrent with a later revocation may linearize before it; already returned bytes cannot be recalled. Captured ACLs are never broadened by live ACL expansion; raising live sensitivity cannot materialize an old lower-classified event. An actual Graph tombstone/lifecycle transition still consumes a real previously admitted event through normal enabled-epoch mutation and explicit graph:lifecycle authority. Current source restriction during disable is not mislabeled as an immutable source tombstone. Existing later source-access-invalidation/Policy/connector Tickets continue to own live lifecycle routing, downstream caches and delivery; no obligations are removed or made circular.\n\nWATERMARK OWNERSHIP. coverage is [] or up to8 exact {registration_id,target_event_id} selectors for initialize; mutation accepts null (inherit the prior captured vector) or the same array only for assert, while resolve/source_access require null. No raw watermark vector, completed flag or arbitrary numeric head is accepted. Duplicate sourcePartitionKey selectors reject. Each registration/cursor comes from actual authorized DurableIngress.getSource within the same transaction; a non-null target_event_id must resolve to an admitted event from that exact registration. It selects coverage THROUGH THAT OBSERVED POSITION ONLY; it does not assert the upstream producer/global Project head. A null or unsequenced target remains unknown. Feed the resulting exact source tuple/target and real cursor into projectFreshness, retaining input/projection gaps and unknown states. Bound aggregate selected cursor input before constructing this vector; reject rather than truncate or silently omit inaccessible sources. The receipt stores exact selector, registration/cursor versions and immutable cursor snapshot refs used for this capture. The snapshot is a retained bounded input, not a new growing canonical Graph ledger; existing ingress cursor4096-entry/1MiB capacity remains explicit. Omission inherits a historical captured vector rather than claiming it is freshly observed. [] explicitly records unknown empty coverage. Never call completeSourceEvent or ACK an ingress intent; a Graph assertion is not proof that all Policy processing completed. Current accepted ingress leaves completion null/incomplete. Future durable consumer completion remains its existing owner's work. Project views cannot label selected-source coverage as all-project freshness.\n\nPERSISTENCE AND EXACT FACTS. Reuse DomainStore schema2 without a new table/database. Initial Graph format1 metadata pins semantic wire1, commit wire2 and index version1. Missing domain metadata is initialized only by an explicit owner write; unsupported/newer/corrupt metadata fails closed without overwriting. There is no legacy cumulative-snapshot import or automatic digest conversion. Future incompatible domain changes need explicit tested migration; current initial format and refusal paths are implemented, documented and covered. Canonical immutable sources retain individual ordered GraphCommit2 records, manifests, V1 semantic revisions/conflicts/resolutions/access updates, original catalog/admission facts, complete external command input, per-command audit/authority records and receipts. Keys hash versioned full tuples into the existing200-character grammar; retained values contain full tuple keys and digest checks. No command path reads all history or stores cumulative snapshots/entities/source/catalog arrays.\n\nUse canonical commit source IDs c/<generationHash>/<fixedWidthSequence>; hash-address lookups map to exact sequence and verify the original commit. Small CAS records retain one current head and active projection build per generation plus per-key current projections. Versioned derived temporal index entries are sources v/<viewHash>/<family>/<keyHash>/<fixedWidthSequence>, containing full key, logical version, origin and bounded value. BINARY descending range with selected-sequence cutoff finds latest-as-of with limit1. Page indexes are sources p/<viewHash>/<collectionHash>/<fixedWidthSequence> containing exact core kind/key/origin. Commit sequence is a sparse page position: the accepted planner emits one revision and at most one new conflict per transition; heads index the first assertion for that entity. Head/history/conflict collection filters get their own exact prefix, not an all-entity scan. A64-candidate full page may return a continuation whose next page is empty; no extra unbounded lookahead is needed. Same-generation total history is independent of per-row/operation/page budgets.\n\nThe internal selected-record port is built from these actual records under one read/write view, with current principal from opaque authority, current head/access_view and actual latest/as-of selection. It checks current lineage membership and immediate predecessor/origin proofs without walking every older commit on each request. Accepted absent keys are attested from complete active indexes produced by this adapter's atomic writes/rebuild. Required dangling/malformed/digest-inconsistent facts fail closed; physical logical database tampering by the trusted same-OS-account owner is not authenticated merely by hashes. Do not claim detection of a coherently rewritten whole database or add an online full scan/Merkle framework. Source_access retains all latest observer/epoch restrictions within the accepted per-operation limit; old epochs and permanent tombstones are not discarded. Current source-policy reads use the same actual SQLite snapshot, not caller-supplied current_graph. Pre-return/precommit authority checks, activation/enrollment fences and exact source version observations remain intact.\n\nATOMICITY AND RETRIES. Within one admitted BEGIN IMMEDIATE transaction, resolve current publisher/source/catalog/coverage, recompute the core plan, check exact head/projection CAS, append all source/admission/catalog/semantic/audit/command/receipt records, update current/temporal/page indexes and enqueue exactly one graph_changed intent. Validate every core plan before applying its finite named effects; no arbitrary client plan is applied. A stale expected_graph writes NOTHING, including no admission/denial/receipt/conflict row. Semantic-base mismatch after valid graph CAS is the distinct successful conflict path. Any size, auth, missing source, corruption, planner, CAS or outbox failure rolls back every effect. The receipt pins raw request digest separately from internally constructed core command digest, original actor/run/epoch/catalog/coverage/source facts, prior/next graph and exact effect refs. Scoped actor+generation+idempotency_key is checked before rebuilding new current pins: an exact already committed retry returns the original receipt/result refs even after later Graph/Git writes or Project disable, provided current read access still permits; changed request contents conflict, and newly denied support/receipt rejects. Lost response is not inferred rollback. No mutation ACK advances ingress completion, acknowledges ingress pending intent, dispatches a model/Worker, accepts a Ticket or promotes canonical Git.\n\nBOUNDED REBUILD. rebuildProjection(context,{generation_id,expected_graph,epoch,cursor,limit}) is a human/service graph:rebuild operation with current Project admission, using bounded synchronous pages of at most64 canonical commits and the same1MiB aggregate range limit; callers reduce limit on page-capacity failure. A first null cursor explicitly starts/pins a build; subsequent exact cursor requests resume stored progress under a fresh current admitted maintenance request. No original semantic result is relabeled to a new epoch. Persist new index-prefix/progress and fence new semantic mutations while that build is active; retain the old active index for healthy reads. Replay each canonical delta with exact sequence/predecessor/record-digest checks, reconstructing per-key versions/page membership without re-authorizing historical commands under today's actor and without returning private payloads. Final atomic head/index pointer switch occurs only at the same pinned head after complete replay. Crash/restart resumes a prior durable step; stale/changed cursor or expected head applies nothing, duplicate step reconciles original progress, and half-built indexes are never used as complete. Every step is activation-gated; after re-enable explicit fresh maintenance steps may resume the retained canonical-log rebuild, not automatic backlog execution. Unsupported/corrupt canonical records refuse repair. Old index prefixes remain retained; no pruning, generic checkpoint engine, lease, scheduler, background loop or destructive retention/erasure is introduced. Publish repair procedure and retained-storage growth; future cleanup needs its own tested retention contract.\n\nLIMITS AND ACCEPTANCE MEASUREMENT. Preserve the accepted core1MiB/16-depth/50000-node operation/row budget,32 support/current-access closure cap and64 page candidates; every physical envelope also fits DomainStore limits, so overflow is a whole-operation bounded rejection, never provenance truncation. Coverage is at most8 selected sources and aggregate1MiB cursor inputs; the real ingress4096/1MiB per-stream limit is explicitly unchanged. These limits are per operation/row/selected coverage, not total Graph commits or entities. Use actual real SQLite1040 transitions/600 distinct semantic objects in one generation with original old refs retained, bounded fixed support and no generation reset/pruning; count actual selected-record reads and query/row activity at early/late points, preserve the pure-port<=64-call proof for the fixed-support fixture and document adapter overhead. Query plans must use bounded scoped primary-key ranges and no full history/entity scan or OFFSET on ordinary request paths. Report max plan/row/page bytes, record/page counts, rebuild batch counts, actual wall time and database bytes as environment-specific measurements, not an SLA. Full-log scans are confined to explicit bounded maintenance replay. Current graph/public entry/V1/event/identity/causal/auth/store/Git/activation/ingress tests and standalone boundaries must pass.\n\nConformance includes real retained sanitized ingress bytes and real publisher registration, actual restart/exact/historical pages, concurrent duplicate/conflicting/stale-CAS writers, source policy changes while disabled, whole-page/receipt denial, original catalog reuse after current metadata changes, all competitor conflict resolution, parent/relation ACL closure, target authority negatives, unknown coverage,0/2/1 and null cursor cases without fabricated completion, raw getters/oversize/unknown namespace/foreign contexts, SIGKILL before commit and after commit before reply, immutable source bytes, interrupted paged rebuild, corrupted selected indexes/missing required rows, and foreign/newer/corrupt schema preservation. Test fault boundaries by wrapping trusted process-local store transactions in child fixtures if needed; no production crash-injection endpoint/framework is added. Rebuild proves equivalent exact historical semantic/provenance/current-ACL results after switching derived indexes. Use deliberately synthetic temporary Git/SQLite/source content; no live host transcript, credential, model or network call inside deterministic acceptance. A separate parent opt-in JEV smoke may later materialize authorized synthetic Graph context/source after closing the transaction, call the model and report measured output; it is not part of Graph store correctness or a claim of semantic quality.\n\nEXCLUSIONS AND CONTINUITY. No HTTP/UI/Collector/host plugin, model integration, real Worker execution, branch adoption, ranking/search/vector index, Policy scheduler, canonical promotion, cloud/distributed replication, automatic migration, source fetch, checkpoint/pruning or generic registry/framework. The shipped local adapter is useful through its explicit authenticated in-process API; it does not claim the entire local App context workflow is connected. Existing downstream Tickets retain all those responsibilities and historical dependencies. Shared project records accompany eventual implementation commits; this candidate itself is planning only until independently validated and applied.\n",
