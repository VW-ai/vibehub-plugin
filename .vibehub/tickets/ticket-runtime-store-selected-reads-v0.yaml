  "context": "The real Working Graph adapter needs exact historical selected-record lookups and bounded page/rebuild scans. Existing sources already has PRIMARY KEY(tenant_id,project_id,namespace,id), but the public DomainStore has only exact getRecord/getSource and BEGIN IMMEDIATE write transactions. Add only this independently verifiable read prerequisite. Reuse the existing Node SQLite connection, opaque LocalCredentialAuthority, namespace allowlist, inert JSON validation, bounded errors and transaction guard. The parent Graph Store remains draft and still owns all semantic persistence, source/publisher admission, idempotent mutations, indexes, rebuild and end-to-end conformance. This Ticket adds no Graph/domain schema, SQL exposure, generic query language, ORM, new dependency or listener.\n\nExact proposed API: store.getSourceRange(context, namespace, {lower,upper,order,limit,after}) returns {rows,last_id}; lower is inclusive, upper exclusive, order is 'asc' or 'desc', limit is an integer1..64, after is null or an exclusive continuation ID within [lower,upper). All fields are required; lower,upper,after use the existing case-sensitive ASCII identifier grammar and length bound, lower < upper in BINARY order. Ascending adds id > after, descending id < after. Each returned row is {id,kind,value}; last_id is null for an empty page or the last returned id. It is a locator, not an access grant or a claim that another row exists. No count/offset query, unbounded iterator, implicit scope, wildcard, SQL fragment or silently chosen range is accepted. The caller pins its semantic as-of cutoff; this primitive has no semantic/history authority. The complete JSON response must fit1MiB in aggregate (existing per-value depth16/node50000 limits still apply); reject an oversized page without returning a partial proof. Iterate no more than64 SQLite rows, checking aggregate size while consuming rather than loading every large value with .all(). Returning fewer rows solely because the byte budget was reached is forbidden; the caller can explicitly reduce limit.\n\nstore.readSnapshot(context, operation) runs one synchronous read-only callback inside BEGIN DEFERRED/COMMIT or rollback, returning its result only after a fresh opaque grant check. Its frozen, callback-lifetime handle exposes getRecord(namespace,key), getSource(namespace,id), and getSourceRange(namespace,options), bound to that context and scope. Every handle call checks read permission and expiry/revocation. The same getSource and getSourceRange methods are added to existing write-transaction handles and read their actual uncommitted writes without opening a nested transaction. Standalone ranges execute one bounded SELECT; when called inside a snapshot/write callback they use that existing coherent view. No mutator exists on the read handle. One connection-level guard prohibits nested readSnapshot/transaction, close, and rebuild during either callback, including before a first read. Existing top-level scoped reads may compose within the active view; they do not create a second transaction. Handles become stale after success, failure, expiry or rejection. Async/Promise/thenable callbacks are rejected synchronously; no callback-result accessor may be invoked while detecting them. Do not expose SQLite handles/iterators or accept callback code from clients.\n\nAuthentication is store:read for read snapshots/ranges; existing write handles continue to require store:write and store:read for their read methods. Scope and local API audience come solely from the opaque current authority. Check input options as inert exact JSON before field access/destructuring. Unknown namespaces, copied/foreign/revoked contexts, malformed range IDs/order/limit and escaped continuation reject with bounded codes. Retain schema version2 and unchanged migrations/DDL/core preservation rules; this is an API addition using the existing primary-key range index. New bounded page-capacity error is acceptable only if named/documented and tested; do not echo bodies or SQL diagnostics.\n\nConformance uses real temporary SQLite and two independent connections/processes in WAL mode. A reader performs a first scoped record/source read, a second writer commits replacements/appends, then the reader sees the old snapshot and a new read sees the new data. Prove exact ascending/descending boundaries, empty/reversed ranges, exclusive continuation, scope/namespace separation and read-your-write inside one real mutation transaction. Use at least2048 synthetic immutable rows and EXPLAIN QUERY PLAN for each direction to establish SEARCH through the existing scoped primary-key range, with no full source scan, OFFSET or temporary sort. At most64 rows are iterated/returned per request independent of total history. Test aggregate overflow without partial results, inert getters, expired/revoked mid-callback authority, stale handles, nested/close/rebuild attempts, thrown and asynchronous callbacks, malformed persisted selected JSON and normal use after each rollback. Re-run domain-store/auth/Git/activation/durable-ingress suites and component boundaries; no model, live host, private trace, credential or network call is needed. This Ticket does not claim Graph functionality or performance beyond the measured bounded query.",
