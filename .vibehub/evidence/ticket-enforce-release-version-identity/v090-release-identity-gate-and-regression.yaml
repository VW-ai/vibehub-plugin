  "summary": "The verifier now imports the build artifact's exported PLUGIN_PATHS allowlist, finds the latest reachable stable release tag, parses and compares SemVer without dependencies, and enforces changed-content, prerelease, stable-release, manifest, tag, and changelog invariants from one implementation. Verify CI runs the gate after full-history checkout and before tests. The Git-backed regression reproduces 143 shipped-content commits under 0.8.0 and proves rejection, while covering unrelated changes, unreachable and prerelease tags, malformed and non-monotonic versions, accepted prerelease state, finalized stable state, and the first stale shipped change after v0.9.0. INSTALL and RELEASE document why the content-addressed npx updater needs no user staleness command and how migration remains release-paired. package.json, the Claude manifest, template header, and dated changelog consistently prepare 0.9.0 without creating its tag. The full suite passed 196 tests with 189 pass, 0 fail, and 7 sandbox-only socket skips; the built artifact independently verified 67 files and 3,302,127 bytes.",
