  "summary": "Commits f59a1b2 and 73a6385 add the optional discriminated Ticket deliveries array, the derived successful-plus-delivered archive predicate, one exported current/all/delivery/repeated-Room query projection shared by CLI JSON and Web, deterministic endpoint-visible relations, progressive archived boundary cards and one-hop stubs, explicit URL filters, and aligned Product, Ticket Lifecycle, and Workbench Room contracts. State-table and schema tests cover omitted legacy deliveries, proposed/abandoned/unmerged pull requests, delivered pull requests and cherry-picks, failed/partial/deviated Outcomes, multiple memberships, revert preservation, and reopen provenance. Full verification passes 62/62 plus the dependency-free 54-file, 698815-byte artifact. A real Codex in-app-browser fixture proves the default current view contains three current Tickets plus one textual/dashed ARCHIVED boundary and one keyboard-focusable upstream stub; Enter reveals old-foundation, removes the exhausted stub, records history=old-foundation, and preserves every prior card coordinate, selected current-web-work Ticket, Log lens, and direction. All history contains five Tickets and no stubs; exact pull request delivery returns the two archived members; product/web returns four, knowledge returns two, and repeated normalized Rooms return their five-Ticket union. Invalid scope, delivery, Room, and history values render Ticket graph unavailable with zero Ticket cards rather than broadening. Copy focused link reports success and the live URL preserves scope, sorted repeated filters, history, selected Ticket, Log lens, direction, and the 64-character bearer fragment without persistent browser state. At 1440x960, 1180x820, and 390x844, both left-to-right and top-to-bottom views retain four current nodes, one archived boundary, and one stub without document overflow or console warnings/errors; the narrow history target is 44.8px high after the browser-found c2bf1a4 fix and all graph controls are 44x44. The complete plugin remains Git-native and read-only, with all four Rooms FRESH at a8331ac.",
