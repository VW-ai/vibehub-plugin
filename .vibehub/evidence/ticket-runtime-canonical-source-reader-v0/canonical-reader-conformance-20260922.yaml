  "summary": "Implements the explicit immutable Git selection reader with independent JSON-as-YAML public-record validation, exact Acceptance/Contract/Evidence/Outcome binding, same-commit Authority artifact proofs and typed historical/unusable states. Hardened selected reads enter a scratch Git view from actual enrollment, authorize each commit before bytes, verify hashes and use fixed shared I/O budgets. Actual deterministic ingress observations support one candidate Graph assertion; prior selection is lineage only and no ingress ACK, canonical promotion, model call or App/host wiring occurs. A metadata-only immutable verified-read issuance fact in the existing working-graph namespace binds the exact assertion/configuration/request/generation/fence, preventing generic Graph JSON from impersonating verified source records without another table, namespace or secret. Optional Graph expected_source_fence is checked inside publication and on duplicate/receipt/reconciliation paths, preserving legacy unpinned behavior. The 144-test affected suite passes on the frozen implementation, covering all reader/profile/Git/ingress/Graph/invalidation tests. Real SIGKILL tests preserve partial intake without selection and recover lost publication replies exactly. Actual refresh tests cover changed Authority and Acceptance/Contract history, stale Graph CAS, rewind/missing ancestry, old-object revocation followed by a new authorized descendant, disable/re-enable, current/captured ACL, typed reads after actual Git GC, and changed-key rejection. Independent review regressions reject fabricated canonical Graph content, successful Outcomes without independence claims, and Outcomes citing Evidence with any forged extra Acceptance binding. Full/standalone verification is recorded separately.",
