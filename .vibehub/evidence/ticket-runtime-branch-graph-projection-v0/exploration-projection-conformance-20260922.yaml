  "schema_version": 2,
  "summary": "Implements the exact Contract2 in-process LocalExplorationStore using one exploration namespace and the existing single activation-admitted Graph transaction. Real enrolled Git worktrees bind to service-owned isolated generations and immutable origins; source event citations remain distinct from actual publishing workspace. Fixed actual CanonicalSourceReader proofs retain origin base and declared Project baseline separately, preserve configured active Authorities under optional filters, and recheck source access/fence and exact reader issuance. Legacy Graph cannot bypass owned generations even without exploration namespace; ordinary unowned Graph and narrow lifecycle/rebuild paths retain compatibility. Shared trusted mutation validation prevents forged watermarks. Exact actor/key retry returns original result before new Git inspection while rechecking original input access. Bounded index/declaration witnesses reject lost or regressed ownership, append horizon, Project selection and worktree binding rather than treating corruption as initial absence. 125 focused/affected tests pass, including real Git/SQLite public API, current/historical/revoked pins, A/B alternatives, semantic conflicts and cross-generation rejection, unborn/detached/switch/delete/recreate/outside-folder/clone identities, actual expiry/revocation/disable races, two child writers and SIGKILL/lost-response recovery. Independent review reran61 focused tests and separately reproduced12 one-row corruption variants with zero row deltas. Scope excludes adoption, host Session integration, App/HTTP, Policy/Judge dispatch and canonical promotion. Physical Git is observed, not an atomic lock with SQLite; one canonical configuration per Project and one repository per exploration remain explicit.",
