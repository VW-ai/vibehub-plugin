  "summary": "Commit 9d70122 makes the causal graph the default full-width Workbench surface, removes the permanent overview rail and both empty Implementing surfaces, and adds an on-demand operational Overview limited to READY frontier, pending and upcoming human boundaries, deviations, REFINE count, and exact VibeHub source dirtiness. The retained production graph still exposes causal-cone selection, relation controls, minimap, pan/zoom, progressive Execution/Contract/Log Inspector, exact source, and READY-gated Agent handoff. Ticket selection and lens changes now replace only explicit ticket/view query state while preserving the 64-character bearer fragment; opening the resulting URL in a second tab on the same live host restored the selected Ticket and Log lens, and copy feedback says the link is valid only while that local host runs. Full verification passed 51/51 tests and the 53-file, 659222-byte installed artifact. Real-browser DOM comparison against tag v0.7.0 measured the 1440x960 canvas growing from 1208x800 (966400 px2) to 1440x854 (1229760 px2), +27.3%, and the 1180x820 canvas from 972x660 (641520 px2) to 1180x714 (842520 px2), +31.3%. At 390x844 the canvas, full-screen Inspector, and 370px on-demand Overview had no horizontal overflow; graph controls, Inspector tabs and close button, Overview items and close button, Copy, and source details were at least 44px. Keyboard Enter opened the Ticket, Escape returned focus from Overview, and the reduced-motion media rule remains mechanically verified. Product and Workbench Rooms were aligned to the implementation commit and all four Rooms report FRESH.",
