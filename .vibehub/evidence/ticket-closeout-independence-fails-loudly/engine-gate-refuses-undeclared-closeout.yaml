  "summary": "node vh.mjs ticket closeout now rejects an Outcome whose input carries no independence declaration, before validation and before any write. Probed on a disposable copy: the envelope is {\"ok\":false,\"error\":{\"code\":\"missing_independence\",...}}, naming the closed set subagent|separate_session|different_human and instructing the Agent to stop rather than adjudicate its own work; no file appeared under .vibehub/outcomes. A source outside the set is rejected separately as outcome.independence.source must be one of subagent, separate_session, different_human. A correctly declared Outcome passes the gate and proceeds to the pre-existing repository validation, which then rejected the probe for omitting acceptance ids — proving the new gate neither swallows nor replaces the checks already there. test/skill-contracts.test.mjs 'closeout without a declared independence source writes no Outcome' asserts the error code, the absence of the Outcome file, that the Ticket still routes EXECUTE rather than adjudicated, and the invalid-source rejection.",
