  "summary": "A checked-in Outcome carries independence as an ordinary field, so a reader of the YAML sees the declared source directly. The Workbench needs no separate change because vh-ui.mjs projects the whole Outcome document as outcomeRecord: outcome rather than an allowlist of fields; test/skill-contracts.test.mjs 'the declared independence source reaches a reader and the Workbench' asserts that structural property, so a later refactor to field-picking would fail the suite. Recorded honestly and deliberately not overclaimed: because the engine must not verify the claim, an executor that declares a source it did not use produces an Outcome that is not mechanically distinguishable from a legitimate one. What the change buys is that silence becomes a false statement in a reviewable Git document instead of an absence nobody can see. The contract test also asserts the Skill states plainly that the declaration is unverified, so no reader mistakes it for proof.",
  "ticket_id": "ticket-closeout-independence-fails-loudly"
