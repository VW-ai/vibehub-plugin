  "summary": "outcome.schema.json gains an explicit independence object with a required source enum and an optional free-text note, deliberately absent from the schema's required list. Read tolerance and write strictness are separated on purpose: validateOutcome accepts a document without the field so the 89 Outcomes written before this contract remain valid and readable, while the ticket closeout write path requires it. Confirmed by project validate on the real repository after the change: valid true, outcomes 89, no document rejected. The field is documented in the schema as a self-declared provenance claim the engine records and never verifies. The contract test asserts the schema enum equals the engine's INDEPENDENCE_SOURCES set and that independence is not in required.",
