  "summary": "Addressed two independently discovered validator defects without changing the Ticket contract or existing Evidence. Freshness validation now rejects a known maximum at the first missing accepted position even when target_sequence is null or before the attested epoch: that position would necessarily extend the contiguous prefix. Regression covers zero/nonzero origins, null and before-start heads, MAX_SAFE_INTEGER boundaries, and valid sparse unknown vectors. Replaced recursive source/Git cycle traversal with an iterative DFS so valid reverse-ordered 4096-entry causal chains do not exhaust the JavaScript stack; tests verify full-capacity cursor validation/completion, overflow refusal, full-depth Git ancestry and cycle rejection. Final targeted suite passes 29/29 tests and boundary check passes 51 files with zero errors. Re-ran independent review probes: 2808 cursor/freshness oracle cases, 1024 complete-DAG cases and 41 malformed replay-effect rejections pass; reverse-depth probe now reports cursor true and Git advance; original impossible-summary probe is rejected. Context guard passed with zero applicable authorities/violations before this append. Earlier Evidence remains historical; this supplemental proof describes the corrected implementation.",
