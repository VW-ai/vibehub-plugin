  "summary": "The Spike pins official DeepSeek Harness commit 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca and published @deepseek-ai/dsh 0.1.0-rc.7, including Node and pnpm requirements. A deterministic source probe passed nine exact contracts: Bundle/Profile, root layout, conversation extension slots, custom Conversation nodes, Session fork, no-model-turn commands, durable event feed, local Web composition, and the limits of the shipped Codex provider. The out-of-tree dsh-vibehub-foundation-spike Bundle was installed through the official pinned CLI into an isolated Web Profile; the generated composition ordered dsh-base, dsh-web-app, then the VibeHub Bundle. The real Profile booted on 127.0.0.1:31807 and advertised the VibeHub browser module in its official client manifest. In the running official UI, the Bundle rendered Context inside the native composer, Graph and Run as conversation view tabs, and execution state through shell.overlay. A clearly labelled no-model assistant fixture exposed the VibeHub Fork action; clicking it called ctx.sessions.fork and created and selected a real child Session in the official sidebar. The host command path still runs without a model turn. A restart test also exposed that an unknown custom event without schema registration or ignorable metadata makes DSH reject restored history; the Spike now marks its transitional event ignorable, and the report requires production Run events to register their replay contract before writing. The feasibility report retains product-owned Compare and Bring Back semantics, the Codex App Server adapter boundary, monorepo package shape, upgrade smoke tests, and explicit stop conditions. DSH's shipped subagent-codex remains final-text-only and insufficient for progress, approval, resume, or persistent execution.",
