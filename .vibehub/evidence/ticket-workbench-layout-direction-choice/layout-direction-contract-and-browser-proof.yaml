  "summary": "Commit edf4140 amends the active Workbench Context and local graph authority from mandatory top-to-bottom to one deterministic two-orientation causal layout. The same sorted ranks, Ticket nodes, relations, Inspector, minimap, pan/zoom, source truth, and causal cone render left-to-right by default or top-to-bottom by explicit accessible controls; left-to-right uses right/left relation ports and ArrowLeft/ArrowRight causality, while top-to-bottom uses bottom/top ports and ArrowUp/ArrowDown. Direction is normalized to ltr or ttb, written as an explicit direction URL query while preserving Ticket, Execution/Contract/Log lens, and the 64-character bearer fragment, and an invalid value visibly normalized to ltr. A second live-host browser tab restored ticket-workbench-layout-direction-choice, Log, ttb, and the fragment exactly. Switching direction without reload preserved the selected Ticket, Log lens, complete related/dimmed causal projection, and attention/state classes; a graph-tools propagation repair also prevents direction, Fit, or zoom controls from accidentally clearing Inspector focus. Real-browser geometry at 1440x960 showed the canvas-first → layout-direction → dense-layout causal chain advancing monotonically in x for ltr and y for ttb, with orientation-matched SVG paths and minimap endpoints. At 1180x820 both controls were visible and document scrollWidth equalled 1180. At 390x844 both orientations had document scrollWidth 390 and every direction/zoom/Fit control measured 44x44; the reduced-motion rule remained active. Keyboard ArrowUp in ttb and ArrowLeft in ltr each moved from layout-direction to its canvas-first prerequisite. Full verification passed 52/52 tests plus the 53-file, 664546-byte dependency-free artifact, project/Ticket validation passed, and Product plus Workbench were aligned to edf4140 with all four Rooms FRESH.",
