  "summary": "Migration commit ba3564612253b99b9346d7ebe7673e28b4505a72 records exactly two R099 production moves: DomainStore and transaction-scoped GraphStorage from src/local into src/adapters/sqlite. Their implementation changes are limited to the relative import depth required by the new directory; public exports, constants, schemas, SQL, transaction ownership, authorization, CAS/rollback behavior, bounded reads and errors remain unchanged. All production, test and helper references resolve the new paths. Phase 0 sqlite-store.mjs, ProviderSettings, local service bootstrap and Graph/Exploration/Context/Query/Judge orchestration remain outside this move. The relocation manifest binds the old DomainStore blob f930b80ee47ee6e57fb8425512f3e514d4c7229a and GraphStorage blob c9d180bcdee34405c938089b31d1966db5f5cad2 to the migration commit; the repository-only manifest test skips when standalone packaging omits docs/history. Focused layout/DomainStore/GraphStorage checks pass 30/30 after an earlier 108/108 transaction/storage run. Boundary checking scans 246 files with zero errors, zero production SCCs and zero baselined direction exceptions. Full Runtime verification passes sequentially with 1025 total / 1023 passed / zero failed / two expected skips. Standalone locked-install verification passes sequentially with 1025 total / 1017 passed / zero failed / eight expected skips. An earlier attempt to run both exhaustive suites concurrently made the unchanged Context Judge capacity test exceed its five-second wall-clock budget; the test passed 24/24 when isolated, an independent read-only subagent confirmed the migration changes no Judge, storage or deadline behavior, and both required suites then passed separately. Plugin artifact verification passes with 79 files and 3670088 bytes. Project and Ticket validation, Context guard, git diff checking and semantic-runtime Room alignment pass; the Room is FRESH. No credential, Keychain lifecycle, host, network, provider or live