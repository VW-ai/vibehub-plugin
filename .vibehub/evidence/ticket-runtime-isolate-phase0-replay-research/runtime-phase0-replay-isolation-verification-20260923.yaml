  "summary": "Implementation commit aa707aa5b4b8d1c0d41e66628699d727386aaeea isolates the audited 32-path Phase 0 closure as one research/phase0-replay vertical: 31 whole-file moves plus the deliberate src/core/contracts.mjs split. The formal shared module exports exactly the 13 accepted production symbols; the replay module exports exactly its four replay-only symbols. The policy compatibility loader and its test moved out of the formal Runtime, src/core is empty, production imports no research, and the formal root surface removes exactly replay, compareRuns, validatePolicy, normalizeEvent, normalizeState and loadPhaseZeroPolicyArtifact while retaining judgeInputHash. The existing replay, audit, comparison, benchmark and provenance command names point to the new research paths. Before broad verification, the visible calibration confirmed all 32 old paths absent, all declared destinations present, the 31+1 split, both compatibility extractions, and the exact six export removals; focused formal and Phase 0 verification passed 70/70. The append-only relocation manifest has 32 unique old/new records and every old_blob independently matches the migration parent. Layout and boundary checks pass across 249 files with zero production SCCs, zero direction exceptions and zero errors; the focused layout/boundary suite passes 32/32. Full offline npm run verify passes 1007 Runtime tests (1005 pass, two expected environment skips, zero failures) plus 32/32 Phase 0 tests. Locked standalone installation copies no research, scans 214 formal files and passes 986 tests with 21 deliberate historical/research exclusions and zero failures. Root plugin artifact verification passes with 79 files and 3670088 bytes. Project/Ticket validation passes at 236 Tickets, 543 pre-Evidence records and 182 Outcomes; four current refs in three still-active Tickets follow the relocated research paths while completed historical records remain untouched. Context guard reports no authorities or violations, git diff checking passes, and the semantic-runtime Room is FRESH. No credential, Keychain item, network, host, model provider or live JEV call was used.",
