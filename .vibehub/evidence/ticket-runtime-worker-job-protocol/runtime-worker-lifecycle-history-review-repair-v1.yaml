  "summary": "Independent Worker closeout review found that recomputing state digests could hide impossible lifecycle histories: an earlier success could precede another live attempt and produce a second result effect; successful Jobs could be relabeled cancelled/superseded/expired; a nonretryable failed Job lost its retry classification; completed revision zero and inconsistent temporal states passed. Repair retains exact classified failure in each failed Attempt, derives legal final Job status and later queued termination branches, admits previous attempts only after retryable failure or pre-deadline lease expiry, enforces actual lease-expiry/renewal windows and Job/Attempt time agreement, and requires the minimum persisted claim/start/terminal revision count. Added four regression tests covering all six original review probes, nonretryable failure reload/requeue refusal, early expiry/detached time/unearned renewal, and positive later termination of legitimately queued retries. Reviewer probe now rejects all six malformed histories; focused Worker and root public integration suite passed 33/33, dependency/import boundaries passed 68 files/zero errors, git diff --check and pre-append context guard passed. Job/Result envelope APIs are unchanged; unreleased wire-v1 internal Attempt shape adds failure. Documentation clarifies continuation is a trusted artifact/node routing hint; existence checks do not authorize arbitrary entry or guard bypass, and future result ingress must validate a new PolicyRun business route. Structural history checks do not authenticate persisted state or replace durable CAS. Root owns final full/standalone/artifact verification and reviewer owns independent Outcome.",
  "ticket_id": "ticket-runtime-worker-job-protocol"
