  "summary": "This replacement Evidence deliberately binds only the complete active Contract-v3 set: six unchanged v1 revisions, two strengthened v2 revisions, and evidence/outcomes binding v3. It supersedes old grouped proof for closeout selection without deleting or rebinding any historical Evidence. The grouped-Evidence regression proves a native Outcome cannot partially reuse a stale group after one claimed Acceptance advances and can close successfully with a complete exact replacement. The full repository suite passed 195 tests with 188 passes, zero failures, and seven sandbox-only loopback skips; the separately exercised artifact remains verified at 67 files and 3,300,616 bytes. Project validation, pinned/current legacy reconstruction, rollback, lifecycle, host projection, production Workbench visibility, installed-host parity, and deterministic build coverage are all included in that run.",
