  "summary": "The pack grounds fork in three daily engineering scenarios, the risky-instruction sandbox, prompt A and B comparison and alternative-approach exploration, evaluates every affordance against them, and lists anti-scenarios with their excluding decisions including that a fork is never a Task or dependency. Commits 3682da7 and 99c7004 build three review-only surfaces in the real shell gated on a fork review state that is null in production and fed by fixtures whose sink refuses sends with zero model spend: direction A replaces the raw UUID line with a navigable Forked-from chip carrying the derived shared-Turn note, a source-side N-forks listing and an honest dashed missing-source state; direction B indents forks under their listed source in the sidebar with a depth cap, screen-reader prefixes, flat orphans and the recency-reorder trade-off named; direction C makes a selection in a fork return to the source composer as a labeled quote that quote-source serializes with exact fork identity on an explicit human send. Each direction is captured wide and narrow in Light and Dark with keyboard-focus captures, twenty-three PNGs under docs/proposals/fork-chat/captures, and annotated with the canonical data and host projection it needs; a fourth direction, per-message Fork from here on stable lastTurnId, is defined but not built, and side-by-side Compare is costed as requiring a two-pane transcript surface and recommended to wait.",
