  "summary": "The checked-in first-party inventory covers Thread lifecycle, Turn lifecycle, every pinned 0.147.0 ThreadItem family, streaming deltas, approvals and user input, delegated agents, attachment/audio posture, failure/retry/reconnect, keyboard and accessibility boundaries. The executable contract pins the exact Codex package, upstream commit, and generated protocol hash; defines stable Thread/Turn/item/request identity, authoritative item completion, live-versus-replay truth, animation-frame batching, a 500-event/240-item bounded carrier, sanitization and unknown-item fallback; and keeps ordinary Chat independent of VibeHub Task protocol. The source-backed audit compares seven maintained or relevant clients, records exact license/maintenance/dependency/security/reuse boundaries, recommends a bounded MIT reducer pattern from codex-gateway plus selected MIT assistant-ui headless primitives, rejects whole-product/runtime adoption, and forbids reuse from the unlicensed candidate.",
