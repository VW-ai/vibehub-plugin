  "summary": "The correction closes the three exact independent-closeout gaps without broadening the prototype. The pinned interaction inventory now explicitly covers agentMessage.memoryCitation, model and collaboration-mode posture, ordinary microphone/audio input, discoverable keyboard shortcuts, focus return, accessibility, retry, completion, failure and interruption. The executable contract, deterministic fixture and renderer retain citation entries plus source Thread identity instead of silently dropping memoryCitation. Authoritative TurnStatus interrupted/failed adds a visible terminal boundary while preserving every already-recorded Turn item. Real Codex browser exercise created a durable Thread, started a long Turn, interrupted it through the production Stop control, reconciled the same Thread from app-server, rendered exactly one Turn interrupted boundary, cleared running state and retained history. The mixed wide carrier rendered one citation and one interruption boundary at 1280 px with no overflow; the explicit 390x844 carrier rendered both with a 390 px body and 374 px Composer. Focused runtime tests passed 6/6 under the normal host-owned Codex configuration.",
