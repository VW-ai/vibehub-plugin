  "summary": "Implements the fixed LocalQueryEngine query/next slice over actual selected Context and canonical facts. QueryInputs binds the authenticated Project/actor, exact own and related exploration commits, immutable origin bases, Project selection, source fence, actual watermark/lag state, typed lifecycle/publication/applicability and current source authorization. Bounded exact/head/one-hop lineage recipes, literal Ticket/Room/repository proofs and a real positional Unicode index form one selected-window union; own, notice and shared layers remain distinct. Conflict alternatives are completely materialized and paginated as one atomic unit, including the admitted 16-variant boundary. rankContextWindowV1 keeps its exact four-field public input, produces a text-free replayable factor trace and preserves per-variant scores while a conflict group uses only the maximum for ordering. Optional relevance calls the actual same-store Context Judge capability once, rechecks all local proof after await, never runs from next, and makes zero provider sends when the mandatory local response cannot fit. Missing optional model/index capability degrades explicitly; authorization or pin movement refuses. Independent review found and the implementation corrected empty-vector freshness, preflight pagination, field-crossing phrases, declared-any Room scope, replay size and conflict score attribution defects; the reviewer reran the corrected paths without editing the repository and reported no remaining concrete defect.",
