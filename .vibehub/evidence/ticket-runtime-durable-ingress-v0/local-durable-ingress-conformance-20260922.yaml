  "summary": "Exact Contract3 implementation uses one accepted DomainStore and internally composed Git registry/ProjectActivation. Service-owned immutable stream registration/start/mapping/producer and explicit access CAS govern strict RawEvent intake; approved unchanged UTF-8 snapshot bytes have checked digest, service-built capture grant and immutable partition+snapshot identity. One gated transaction preserves first raw/normalized envelopes, registration/access revision, full catalog/mapping/grant pins, exact cursor acceptance and outbox; postcommit receipt is durable intake only. Stable authenticated observation helper plus core partition/fingerprint/idempotency/cursor logic preserve first pins and distinguish retries from conflict or independent same-object observations. Pending read is bounded64; authenticated synchronous handoff commits one consumer effect/receipt/ACK atomically, with no completeSourceEvent or semantic completion. Consumer leases/retry/dead-letter/operator replay explicitly remain in paired draft journal. 26 meaningful ingress tests pass on real temp Git/SQLite: sanitized bytes/reopen/retry, first receipts, foreign/unknown authority, no raw canary persisted, digest/UTF-8/size/inert input/policy limits, pointers without I/O, 0/2/1 and null sequences, independent Git observations, same snapshot identity conflict/reuse, source ACL/sensitivity tightening, immutable captured grants, cursor entry ACL, expired/revoked context, removed worktree, registration/activation/catalog callback CAS fences, pending cap and actual near-1MiB cursor rollback. Real child writers exercise duplicate/conflict admission, SIGKILL before intake/handoff commit, lost response after commit, duplicate effect and disable races; old epochs remain fenced through re-enable. Related event/causal/store/Git/activation124/124 and auth/foundation7/7 passed. Full verify and isolated standalone install+verify each passed400 tests with0 failures and1 intentional native-Keychain skip. Final focused28/28 (26 ingress plus2 offline fake-Judge composition tests) passed after the final async-policy guard. Boundaries106files0errors, diffcheck and Context guard pass. Ticket acceptance tests use synthetic content and no models, private traces, keys or network sources; a separately user-authorized fixed-corpus live JEV smoke is documented outside this acceptance. No HTTP/real Collector/Policy service/scheduler/automatic recovery is claimed.",
