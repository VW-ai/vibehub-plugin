  "summary": "Scope: only the retired-name rule. What I changed: validateRetiredNames in skills/vibehub-core/scripts/vh.mjs now excuses OCCURRENCES rather than files, and the filename-shaped META inference is deleted. An allowance is {path, text, occurrences (default 1), reason}: it excuses exactly that many occurrences of that exact single-line text, and every occurrence of the retired name in the file that no allowance's text accounts for still fails. Three shape rules keep an allowance from widening back into a file pass - its text must contain the retired name, must be single-line, and must occur exactly as many times as declared. Structural exemptions are unchanged in kind: .vibehub/evidence/, .vibehub/outcomes/, .vibehub/history/, a Ticket under .vibehub/tickets/ that has an Outcome file, and META/legacy-* now only as the segment directly under META/ and only as a directory. The dated-basename META rule is gone entirely. Context source.ref/evidence[].ref subtraction now requires the document to actually be Context: kind context under .vibehub/rooms/. The allowlist was re-derived from zero: I emptied allowed_paths, ran the check, and judged each of the 14 surviving occurrences across 7 files on its merits. The prior entry for .vibehub/tickets/ticket-contract-the-skill-graph.yaml was dropped because that file is already structurally exempt; the dated META attestation, which used to pass on its filename, now carries three explicit entries. What I attacked, all against the fixed tree, each shown failing where the same input passed at HEAD 6f623ce. (1) An extra live occurrence appended to the allowlisted scripts/measure-graph-layout.mjs ('// live: read ../vibehub-ticket-review/assets/app.js at runtime'): HEAD said valid:true; now 'Live reference to retired Skill vibehub-ticket-review (1 unexcused occurrence)'. (2) META/09-ticket-runtime/2026-09-01-live-contract.md naming skills/vibehub-ticket-review/assets/app.js: HEAD said valid:true while the identical content at live-contract.md failed; now both fail. (3) A $-invocation appended to the allowlisted file: fails. (4) A near-miss - the excused LEGACY_APP_PATH line re-quoted with single quotes - fails twice, as an unexcused occurrence and as an allowance whose named text is gone. (5) An exact duplicate of the excused line: fails, because one allowance names one occurrence unless it declares more. (6) A legacy- segment at depth, META/09-ticket-runtime/legacy-notes/live.md: fails; META/legacy-ui/note.md still passes and META/legacy-note.md, a file wearing the name, fails. (7) A stale allowance whose text was removed: fails. (8) Contract-shape attacks aimed at rebuilding a blanket pass - a multi-line text, the entire file as text, a text not containing the retired name, occurrences:99, occurrences:0, and a directory path 'scripts/' - are all rejected. (9) Third hole, found by attacking rather than by the brief, and closed: at HEAD any JSON file anywhere could claim the Context exemption by carrying {\"source\":{\"ref\":\"skills/vibehub-ticket-review/...\"}}; assets-config.json at the repo root passed. It now fails, as does the same document under .vibehub/rooms/ with a kind other than context, while a genuine Context ref still passes and the same Context's prose still fails. What did not hold and is disclosed, not fixed. (a) The scanner skips .git, node_modules and the gitignored dist/coverage/test-results, so a live reference inside dist/bundle.js passes - documented as regenerated build output, but it is an exemption by directory. (b) Files classified as binary are skipped: the retired path plus a NUL byte in assets/blob.dat passes. (c) The check is substring matching, so 'skills/vibehub-ticket' + '-review/...' split across a concatenation passes; no textual scan can close this. (d) .vibehub/history/ is a whole-directory exemption the criterion grants, and anyone may write a live file into it: .vibehub/history/x/live.md passes. (e) A Ticket counts as closed when an Outcome file exists, which is how the rest of vh.mjs defines closed (loadRepository line 867), so a Ticket with a partial Outcome - still live work - is exempt. This is load-bearing here: .vibehub/tickets/ticket-contract-the-skill-graph.yaml carries one occurrence of the retired name and is silenced only by its own partial Outcome; moving that Outcome aside makes the check fail on it. I left the definition alone rather than diverge from the codebase's own notion of closed. (f) The rule permits an allowance to name a $-invocation and justify it, but in this layout that is unusable: the contract lives under skills/vibehub-core/, so quoting a $-invocation in it trips the reference check first. A retired name therefore cannot be called anywhere in this repository, which is stricter than the criterion requires; the code path that would excuse a named $-invocation is unreachable here and is exercised only through the accounting shown in the per-occurrence test. Counts taken at 2026-09-01T09:47:41Z, immediately before writing this: skills validate ok:true valid:true, 12 Skills, 19 edges, 9 events, 1084 files scanned. project validate ok:true valid:true, 6 rooms, 66 contexts, 103 tickets, 301 evidence, 94 outcomes, no unverifiable refs. npm test 180 tests, 180 pass, 0 fail (175 before; the retired-name cases went from 3 to 8). git status --short lists exactly four modified files and no untracked ones: the Ticket YAML, skill-graph.json, vh.mjs, test/skill-graph.test.mjs. Existing tests changed: 'a retired name in a live reference fails, and the exempt classes do not' encoded the bug twice - it asserted a dated META basename is exempt and used a file-level allowance - so the dated-META assertion moved to a new failing case and the allowance gained its text; 'an open Ticket is live, and an allowlist may not cover a $-invocation' encoded correct behaviour and was updated only for the new allowance shape and renamed; 'an allowance whose file no longer names the retired Skill fails' encoded correct behaviour and was extended with the missing-text and moved-count cases. No other criterion was touched: the contract still declares all 12 Skills with edges and owned events, the six other failure modes still fail, and nothing gained a runtime role or wrote to .vibehub/ beyond this Evidence document.",
