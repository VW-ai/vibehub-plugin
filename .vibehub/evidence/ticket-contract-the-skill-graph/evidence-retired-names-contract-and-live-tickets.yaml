  "summary": "Scope: the retired-name rule only. Third repair pass, addressing the two defects the second adjudication named plus the latent one it disclosed, and four more holes I found by attacking the check myself. WHAT I CHANGED, in skills/vibehub-core/scripts/vh.mjs. (1) The contract is no longer exempt by path. The line 'if (file.path === SKILL_GRAPH_CONTRACT) continue;' is gone. The contract's legitimate occurrences are subtracted STRUCTURALLY: contractResidual() re-serialises the parsed contract with each retired entry's name and replacement and each allowance's text blanked, and that residual is scanned like any other file. Anything else in the document - a stray key, a reason quoting a live path, an allowance path - is live. (2) A Ticket is a historical record only when its Outcome status is 'successful'. A partial, failed or deviated Outcome means the work is live and the Ticket YAML is a live document. (3) A fourth allowance shape rule: the excused text must be strictly narrower than the bare name. Stripping every occurrence of the name must leave something non-blank, so 'vibehub-ticket-review', the same padded with whitespace, or the same repeated, are all rejected. (4) Allowance excusing is now span CONSUMPTION, not count subtraction: each allowance deletes up to its declared count of its text (longest text first) and what remains is scanned. Counting let two overlapping allowances subtract twice for one occurrence. (5) The Context source.ref/evidence[].ref exemption is likewise structural - the parsed ref values are blanked and the document re-serialised - instead of subtracting their occurrence count from the whole file. (6) Symlinks are scanned. Git stores a symlink as a blob holding its target path, so that path string is checked-in content; the walk still never follows a link and cannot leave the root. (7) Binary-classified files (a NUL in the first 8000 bytes) are scanned as latin1 instead of skipped. They are flagged so the Skill-reference scan still ignores them. (8) A case-varied spelling of the retired name is reported as a Case-variant reference. (9) countOccurrences returns 0 for an empty needle and a retired entry must declare a non-empty name; an empty name previously spun countOccurrences forever. (10) The contract gains ONE allowance, for this Ticket's own YAML - its context prose names the retired Skill because the retirement is its subject - now that a partial Outcome no longer silences it. JUDGMENT CALL ON THE DIVERGENT NOTION OF 'CLOSED'. I chose option (a): only the retired-name check requires a successful Outcome. loadRepository still treats any Outcome as closed for the lifecycle-scoped context_refs validation delivered by ticket-scope-reference-validation-to-lifecycle, which is closed and accepted. Reasoning: the two checks answer different questions. A context_ref is pinned to the commit that closed the loop, so 'an Outcome exists' marks the point after which refs are read historically; a retired name in a still-live Ticket is text someone will read and copy tomorrow. Changing the reference validation would alter accepted behaviour for every Ticket carrying a non-successful Outcome, and I could not verify that at the fidelity the instruction demands without re-running that ticket's acceptance work, so I did not touch it. The divergence is written into the comment above isHistoricalRecord so the next reader sees it is deliberate. A follow-up would need to settle: whether a partial Outcome should also re-open context_ref resolution at HEAD rather than at the recorded commit, and what that does to the Tickets that currently carry non-successful Outcomes - in this repository, of the 28 Tickets naming the retired Skill exactly one (this one) has a non-successful Outcome, but the reference check spans all 103 Tickets, which I did not survey. REAL BEFORE/AFTER, run on this worktree. Every 'before' below is HEAD 113ca38's vh.mjs, either run in place before I edited it or extracted with 'git show 