 count-based, but it is still an exemption. (6) The case-variant check reports variants only when there is no exact-case failure in the same file, and an allowance cannot excuse a case-variant occurrence unless its text also contains the exact-case name. No such occurrence exists in this repository (I grepped case-insensitively and found only exact matches), but a legitimate title-cased mention would have no way to be excused short of rewriting it. (7) An allowance text must contain the name and be narrower than it, but it can still be short and generic - 'x vibehub-ticket-review' is a legal text. The shape rules bound how MUCH an allowance excuses (one span per declared count, and a stale count fails), not how meaningful it is. Review is what catches a lazy allowance. (8) The whole check is textual. A reference constructed at runtime, or living outside the repository, is out of reach. VERIFICATION, real output at the end of this work with a tree clean of probes: skills validate --repo . -> ok true, valid true, 12 skills, 19 edges, 9 events, files_scanned 1107 (up from 1085 because symlinks and binaries are now scanned). project validate --repo . -> ok true, valid true, format_version 2, 6 rooms, 66 contexts, 103 tickets, 302 evidence, 94 outcomes, no unverifiable context refs. npm test -> tests 191, pass 191, fail 0 (180 before; 11 cases added). git status --short -> three modified files: skills/vibehub-core/contracts/skill-graph.json, skills/vibehub-core/scripts/vh.mjs, test/skill-graph.test.mjs. Nothing untracked. This Evidence document is written after that run and is itself the only later addition. TESTS. Eleven cases added, listed in refs. One existing case changed: 'a retired name in a live reference fails, and the exempt classes do not' wrote .vibehub/outcomes/ticket-closed.yaml as {\"note\": ...} with no status and expected the Ticket beside it to be exempt. That encoded the defect - it asserted that any Outcome closes a Ticket. It now writes {\"status\": \