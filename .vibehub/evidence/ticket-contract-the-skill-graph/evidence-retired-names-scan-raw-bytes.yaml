  "summary": "SCOPE: the retired-name rule only. Fourth repair pass, closing the single defect the third adjudication ruled on - the ninth hole, a REGRESSION the third repair introduced - and re-attacking the result. I am not judging this criterion; I am recording what I changed, what I verified first-hand, and what remains open.\n\nFILES CHANGED: skills/vibehub-core/scripts/vh.mjs and test/skill-graph.test.mjs. Nothing else. No commit, no stash, no Outcome edit.\n\nTHE DEFECT, REPRODUCED FIRST. At a983332, contractResidual and contextResidual both JSON.parse the file, blank the legitimate fields, JSON.stringify, and scan that RE-SERIALISATION, so any bytes JSON.parse discards never reach the scan. REAL OUTPUT, before: injecting `\"context_id\": \"../vibehub-ticket-review/assets/app.js\",` as a SHADOWED duplicate of the first key of .vibehub/rooms/product/decision-retire-ticket-review-skill-name.yaml gave `skills validate` -> {\"ok\":true,\"data\":{\"valid\":true,...}}, while grep counted 3 occurrences of the retired name in the raw file. The same injection of a duplicate `owner` key into skills/vibehub-core/contracts/skill-graph.json also gave valid:true. AFTER the fix, on the identical probes: both give ok:false, `Live reference to retired Skill vibehub-ticket-review (1 unexcused occurrence)`, on .vibehub/rooms/product/decision-retire-ticket-review-skill-name.yaml and on skills/vibehub-core/contracts/skill-graph.json respectively. Both probe files were restored and `git status --short` shows only the two files I changed.\n\nTHE FIX. The scan now reads the RAW file text. contextResidual/contractResidual are replaced by parseJsonWithSpans, a positional JSON parser that records, for every string leaf, the raw span its literal occupies; contextSpans and contractSpans select the legitimate fields (source.ref and evidence[].ref for a kind:context document under .vibehub/rooms/; retired[].name, retired[].replacement and retired[].allowed_paths[].text for the contract); blankSpans consumes exactly those spans out of the raw text, right to left, keeping the surrounding quotes so removal can never join neighbouring bytes into a name. Allowance consumption then runs on top, unchanged. The parser mirrors JSON.parse's semantics deliberately: an object member is stored with the LAST duplicate winning, so a shadowed earlier duplicate's span is NOT consumed and its bytes stay in the scan. That is the whole fix. Nothing else about the check changed: per-occurrence allowance spans, the successful-Outcome definition of closed, the narrower-than-the-name shape rule, symlink scanning and binary scanning are untouched.\n\nWHAT HAPPENS WHEN A VALUE CANNOT BE LOCATED - MY CALL, AND WHY. Three outcomes, all fail-safe in the same direction. (1) The file is not parseable as JSON at all (or has trailing content after the closing brace, which JSON.parse rejects): the exemption is simply not available, the raw file is scanned whole, and no complaint is raised - a non-Context file under .vibehub/rooms/ is an ordinary file and saying so would be noise. (2) JSON.parse succeeds but the positional parser fails, or the two disagree about the document: a LOUD error, `Legitimate-field exemption not applied: the document ... ; the whole file is scanned`, AND nothing is consumed, so the raw bytes are still scanned. I chose loud-and-scan over silently-consume-nothing and over skipping the file because a parser disagreement is precisely how the next quiet bypass would arrive; the cost is a possible false positive, never a false negative. (3) The contract itself unparseable: unreachable in practice, because `skills validate` reads it with readDocument first and refuses the run with invalid_document; the branch exists and reports loudly if it is ever reached. Note the direction of the whole design: locating a span can only ever cause MORE to be scanned than intended, never less.\n\nEDGE CASES THE SPAN APPROACH CREATES, AND HOW THEY BEHAVE. A parsed value that appears more than once in the raw text: only ITS OWN span is consumed - verified by a case where source.ref equals a live prose mention in the same document, which fails with 1 unexcused occurrence. Different escaping between the parsed value and the raw bytes: irrelevant by construction, because the span is taken from the raw text - verified for escaped solidi, a \\u escape inside the name, a value containing an escaped quote, and a value whose every character is \\u-escaped so it appears ZERO times literally; all four pass clean and all four still fail when one live prose mention is added beside them. A lone-surrogate escape in the ref also passes clean. A `__proto__` member is an own property to JSON.parse, so nodeValue builds null-prototype objects to agree with it; otherwise every document carrying one would be reported as a parser disagreement it is not.\n\nTHE UNICODE-ESCAPE LAUNDERING ATTACK THE SECOND REPAIR CLOSED IS STILL CLOSED - and I found that the test guarding it was INERT. test/skill-graph.test.mjs built its escaped ref with `RETIRED.replace(\"r\", \"\\\\u0072\")`, but RETIRED is `vibehub-old-alpha`, which contains no `r`, so the replace was a no-op and the escaped half of that case never ran. It asserted a defence it never exercised. I changed it to escape a letter the name actually contains (`a` -> \\u0061). That existing test ENCODED A BUG - not a bug in the checker, a bug in the test's own confidence - and it is the only existing test I changed. With a real escape it passes: the escaped ref's span is consumed and a live prose mention in the same document still fails.\n\nEVERY OTHER EXISTING TEST IS UNCHANGED and all 28 still pass, including each of the six failure modes the `validation` criterion mandates. I re-ran every attack the existing Evidence records and each still fails as recorded: symlink target path, NUL byte, case variant, META date-shaped basename, non-successful Outcome leaves a Ticket live, unnamed $-invocation inside an allowlisted file, allowance naming a $-invocation, stale allowance (missing file / missing text / moved count), bare-name allowance, overlapping allowances, regex metacharacters in an allowance text, stray key in the contract, an allowance `reason` quoting a live path, and only-a-Context-document may claim the ref exemption.\n\nNEW TESTS ADDED (8): duplicate-key probes on BOTH a Context document and the contract, including duplicates of the EXEMPT fields themselves (source.ref, retired[].replacement); an exempt ref whose text also appears as live prose; the four JSON-escaping shapes above; unparseable and trailing-content Context documents scanned whole; an unparseable contract refused up front; the __proto__ case; and the loud-failure case. npm test: 199 tests / 199 pass / 0 fail (191 before, 8 added).\n\nWHAT I TRADED AWAY - stated plainly, because the last Evidence was marked down for an omission of exactly this kind. (i) The positional parser is recursive, so a document nested far deeper than JSON.parse's own limit exhausts the stack. Verified: a Context document with 20000 levels of array nesting produces `Legitimate-field exemption not applied ... (Maximum call stack size exceeded)` PLUS the ordinary live-reference error. That is a new FALSE-POSITIVE risk that did not exist before, on documents no real Context document resembles. I accepted it rather than rewriting the parser iteratively, because the failure is loud and over-strict, never silent. It has its own test. (ii) The check now parses every kind:context document under .vibehub/rooms/ twice (JSON.parse plus the positional parse) and compares two JSON.stringify outputs. That is a small cost on 66 documents; `skills validate` still returns in well under a second on this repository. (iii) A second JSON parser is now maintained in vh.mjs alongside readDocument's JSON.parse. If the two ever drift, the drift shows up as the loud disagreement error rather than as a bypass, but it is real added surface and a future maintainer should keep it in mind.\n\nHOLES THAT REMAIN OPEN. Inherited, previously disclosed, unchanged by this pass, and I re-verified the first two rather than trusting the record. (1) ENCODING: a UTF-16LE Context document carrying `../vibehub-ticket-review/assets/app.js` still passes GREEN - reproduced this pass. The criterion speaks of a bare string; a name not spelled in literal bytes is not one, and no textual scan closes the class. (2) A directory carrying a .git entry is skipped wholesale; git cannot track such a path, so it cannot reach a clean checkout. (3) The scan skip list is hardcoded, with a drift test against .gitignore. (4) The whole-directory exemptions (.vibehub/evidence/, outcomes/, history/, META/legacy-*) and (5) the Context source.ref/evidence[].ref exemption are granted by the criterion by name. (6) Case variants are reported only in the absence of an exact-case failure in the same file, and cannot be excused. (7) An allowance text may be short and generic; the shape rules bound how much one excuses, not how meaningful it is. (8) The check is textual, so a reference assembled at runtime from fragments is out of reach. (9) NEW, and I am naming it because it follows from the allowance mechanism rather than from my change: an allowance whose `path` is the contract itself can excuse an occurrence IN the contract, exactly as it can in any other file. That is the sanctioned per-occurrence mechanism, not a per-file pass - the entry still names the path, the exact text and why, and the count must match - but it does mean the contract is not privileged in either direction. The previous implementation had the same property.\n\nWHAT I AM NOT CLAIMING. I am not claiming the criterion is met - that is the closeout Skill's call. I am not claiming the raw-bytes scan closes the encoding class; it does not. I am not claiming I found every hole: three implementers before me each shipped one the next attacker found, and the honest prior is that this pass has one too. What I can say precisely is that the specific defect the third adjudication ruled on - a live path in plain ASCII in the contract or in a Context document, carried by a shadowed duplicate JSON key - now fails, that the raw file rather than a re-serialisation is what gets scanned, and that no attack recorded in the existing Evidence has been reopened.\n\nGATES, real output at the end of the pass: `npm test` -> tests 199 / pass 199 / fail 0. `skills validate --repo .` -> {\"ok\":true,\"data\":{\"valid\":true,\"skills\":12,\"edges\":19,...,\"events\":9,\"retired\":[{\"name\":\"vibehub-ticket-review\",\"replacement\":\"vibehub-review\"}],\"files_scanned\":1108}}. `project validate --repo .` -> {\"ok\":true,\"data\":{\"valid\":true,\"format_version\":2,\"rooms\":6,\"contexts\":66,\"tickets\":103,\"evidence\":303,\"outcomes\":94,\"unverifiable_context_refs\":[]}}. `git status --short` -> only ` M skills/vibehub-core/scripts/vh.mjs` and ` M test/skill-graph.test.mjs`; every probe file was restored.",
