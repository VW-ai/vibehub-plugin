  "summary": "Implemented the authenticated per-item LocalExplorationStore.adopt command over the existing Graph-owned activation transaction. Exact historical A selection, separate current source head, B binding/Graph, Project/shared pins and source fence are verified. Server materialization creates a fresh B candidate, preserves original A and lifecycle access restrictions, and proves semantic relation mappings through actual prior adoption publication records. No caller content/proof, new table, model call, canonical promotion or App integration is introduced. Exact retry and actor-owned receipt reauthorize A/B and support while surviving restart, branch/worktree removal and Project disable. Independent review exposed missing route consistency in both source publication and retained B origins; fixed checks bind the immutable origin to actual request, Graph command/receipt, workspace/version witness and publisher. Thirteen independent adversarial cases now pass, including first historical adoption after source branch/worktree deletion. Deterministic cases also prove cross-actor endpoint mapping, A-to-B-to-C adoption, lifecycle preparation/refusal and extra B restrictions, aggregate32/33 boundary, fresh B-only endpoint revocation with A still readable, current grant/head/base/pointer races, two process writers and both SIGKILL boundaries.",
