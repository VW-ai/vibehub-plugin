  "summary": "The owner explicitly accepted the Codex-base build as a low-fidelity carrier and deferred high-fidelity visual work. The new product-logic authority defines the near-term think-first and act-first paths, the complete single-Workspace loop, the longer-term person-centered multi-Workspace direction, the separate Ticket and trusted Run lifecycles, the human attention axis, and the default center surface in Explore, Ready, Running, Needs you, Review, and Done. The disposable browser prototype now opens with Run as the dominant work surface, preserves a phase-aware Composer for Chat and steering, organizes the sidebar by human attention, and lets a reviewer traverse explicit Branch, Compare, Bring Back, scoped Context, Ticket craft, Start, Run progress, exact attention, Evidence review, closeout, governed Context proposals, reopen, and follow-up. It claims no high-fidelity visual completion, production backend, or durable UI state. The complete repository test suite passed 99/99, and the local-only preview returned a healthy response on 127.0.0.1:55724.",
