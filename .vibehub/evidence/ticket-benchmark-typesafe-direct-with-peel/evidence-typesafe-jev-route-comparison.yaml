  "summary": "The deterministic route comparator accepted Gateway run b6854e64-6104-4ee3-8cb2-84a054c84a44 and direct run d7fb03d5-d369-423a-adb2-0c2028f046da only after matching tenant, project, dataset, point-in-time state, evaluator labels, semantic graph/questions/thresholds, and all 80 decision input hashes. Direct observed median latency was 141.568 ms versus Gateway 303.622 ms (46.6% ratio); direct P95 was 228.749 ms versus Gateway 543.311 ms. Five of 80 decisions differed. Direct improved acceptance recall from 0.50 to 0.667 at unchanged 1.0 precision, while Context decision precision/recall/coverage tied and Gateway retained higher target precision/recall. The report explicitly includes adapter/API behavior in each route, keeps probabilities uncalibrated, and leaves downstream success, repeated-work reduction, and productization_gate not_evaluated.",
