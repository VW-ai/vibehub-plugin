  "summary": "Private verification receipt data-core-atomicity serializes supported mutations with one data-root directory lock, rescans the complete store after acquiring it, validates cross-record invariants, and requires matching revision plus raw-file SHA-256 for updates, removals, archives, and reopens. Record writes use exclusive temporary siblings, fsync, atomic rename, parent-directory fsync, and cleanup on an injected pre-rename interruption. Two real concurrent CLI processes using one prior snapshot deterministically produce one success and one exit-3 conflict with a valid final store. Lock metadata records schema, host, PID, ps process-start identity when available, a random token, operation, and creation time. Explicit repair requires confirm:true and the exact token, refuses active or unverifiable owners regardless of lock age, and removes only a single verified stale owner record.",
