  "summary": "Implements exact Contract2 using a fixed source-invalidation namespace in the existing scoped DomainStore. Three DurableIngress commands atomically bind lifecycle/admin input, registration CAS, immutable receipts, stream guards, object summaries, notices and Project fence. Ordering is local to partition/producer/epoch; incomparable/null streams remain restrictive and tombstones cannot reopen. All ordinary content and handoff paths check every supporting object. Metadata-only lifecycle capture remains activation-gated; narrowly selected Graph source_access metadata can resolve captured-authorized current/prior lifecycle records after revocation without opening assertions, queries or receipts. Administrative removal/revocation uses exact deny-all, and visibility/redaction are conjunctively non-broadening. The bounded feed provides head/page/assertFence/readLifecycleEvent without a new scheduler, consumer checkpoint, or database migration. Reproduce with npm run verify from semantic-runtime: final current source run passed 584 tests, 582 pass, 2 intentional native opt-in skips, 0 failures; boundary144 files,0 errors. Independent reviewer reran source/crash/ingress/Graph suites63/63 and six adversarial probes. Fixed regressions include missing/rewound fences, corrupted stream tuple, unsafe counts, inert Proxy/error handling, changed historical idempotency-key reuse, and required namespace even for valid zero-provenance events. Four real-process tests prove rollback on precommit SIGKILL, durable exact replay after postcommit SIGKILL, one receipt for concurrent exact requests, and one winner for version competitors. Graph tests prove captured/current ACL separation, prior lifecycle selection, no fake Graph object on tombstone-before-content, and denial of non-lifecycle paths. Tests use temporary synthetic Git/SQLite only. This evidence does not claim automatic host collection, query consumers, recomputation, or canonical acceptance.",
