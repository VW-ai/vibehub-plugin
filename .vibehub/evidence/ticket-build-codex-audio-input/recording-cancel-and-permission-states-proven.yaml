  "summary": "Commits 5dea574, ee5c709 and 3e6242e implement and prove the recording surface: a persistent recording tray with a live elapsed clock counting toward the 90 second cap, a pulsing voice control whose accessible name swaps to Stop recording, and polite composer-note announcements for start and each auto-stop cause including the cap and the size bound; a distinct Cancel control and document-level Escape end recording with tracks stopped and chunks discarded and no chip, plain Stop attaches a removable chip, and recording again immediately after a cancel, a removal or a denied prompt succeeds; a getUserMedia rejection produces a persistent inline state naming the DOMException-derived cause rather than only a toast, the control returns to idle, retry re-prompts with getUserMedia called again, and recording UI never renders without an active MediaStream. test/codex-first-shell-recording.test.mjs covers the state machine, the guard drives all of it in-browser on documented stubbed capture devices with the seam-shortened cap named as the test seam, the contrast test models every new rule in both themes, and the keyboard audit reports zero gaps.",
