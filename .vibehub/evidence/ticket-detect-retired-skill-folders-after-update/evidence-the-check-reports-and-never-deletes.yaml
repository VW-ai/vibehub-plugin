  "summary": "MECHANISM: retiredSkillFolders() calls only readFileSync (on the packaged contract), existsSync, lstatSync and readdirSync. There is no unlink, rm, rename, mkdir or write of any kind in it, and it touches nothing under .vibehub/ — unlike ticket/context/room operations it returns a value that the caller prints and nothing is persisted. It runs only when the setup workflow the user already invoked executes step 1; no hook, watcher, scheduled job, or install-time daemon was added, which is what skills/vibehub-setup/references/architecture-boundary.md forbids. TEST: 'the report leaves the user's agent Skill directory exactly as it found it' plants a retired folder under .claude/skills/, runs the operation, then asserts the folder still exists, its contents are still exactly ['SKILL.md'], the SKILL.md front matter is unchanged, and no .vibehub/ directory was created in the project; it then runs the operation a second time and gets the identical report, which would not hold if the first run had removed anything. PROSE: setup's step 1 ends 'report its exact path and its replacement, and say that deleting the folder is the user's action: setup never deletes, moves, or rewrites anything inside an agent Skill directory'; a test asserts that sentence is present. docs/INSTALL.md's rename note now says the same in user-facing words. DEMONSTRATION on the throwaway project: after the run that reported two entries, `ls .claude/skills` still showed vibehub-core, vibehub-review, vibehub-setup, vibehub-ticket-review and `ls .agents/skills` still showed vibehub-ticket-review — the reported folders were untouched. I then deleted them MYSELF, as the user would, and the same command returned retired []. VERIFY, real output taken 2026-09-01 in the worktree: project validate --repo . -> ok:true valid:true, rooms 6, contexts 66, tickets 103, evidence 305, outcomes 94 (count taken before this Ticket's Evidence was appended); skills validate --repo . -> ok:true valid:true, skills