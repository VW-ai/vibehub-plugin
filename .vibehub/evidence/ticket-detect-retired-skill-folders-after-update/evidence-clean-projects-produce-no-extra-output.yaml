  "summary": "RULE: setup's step 1 says 'When `retired` is empty — including in a project that never installed through skills.sh, where `scanned` is empty too — say nothing about it and continue.' The quiet case is therefore an instruction to the Agent, not a second command; the helper always returns the same envelope shape and the Agent prints nothing when the list is empty. TWO CLEAN SHAPES, both tested: (a) only the replacement installed — .claude/skills/ and .agents/skills/ each hold the replacement folder and nothing retired; the operation returns scanned ['.claude/skills','.agents/skills'] and retired []. (b) a project that never installed through skills.sh — no agent Skill directory exists at all; the operation returns scanned [] and retired []. It does not create the directories it looked for, and it does not fail on their absence: existsSync gates every location. A third clean case is this repository itself, where `skills retired --repo <worktree>` reports scanned including 'skills' and retired [], so the plugin's own vendored tree is clean. DEMONSTRATION on throwaway directories outside the worktree: after the retired folders were deleted, `node ../vibehub-core/scripts/vh.mjs skills retired --repo <demo-project>` returned {\"ok\":true,\"data\":{\"locations\":[\".claude/skills\",\".agents/skills\",\"skills\"],\"scanned\":[\".claude/skills\",\".agents/skills\"],\"retired\":[]}}; on a bare directory holding only README.md it returned the same with scanned []. VERIFY, real output taken 2026-09-01 in the worktree: project validate --repo . -> ok:true valid:true, rooms 6, contexts 66, tickets 103, evidence 305, outcomes 94 (count taken before this Ticket's Evidence was appended); skills validate --repo . -> ok:true valid:true, skills 12, edges 19, events 9, files_scanned 1111; npm test -> tests 206, pass 206, fail 0; git status --short -> M docs/INSTALL.md, M skills/vibehub-core/scripts/vh.mjs, M skills/vibehub-setup/SKILL.md, ?? test/retired-skill-folders.test.