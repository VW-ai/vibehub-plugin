  "summary": "WHAT WAS BUILT: one new read-only helper operation, `skills retired`, added to vh.mjs beside the existing `skills validate` (skillsOperation now dispatches both), plus the step-1 instruction in vibehub-setup/SKILL.md that runs it and reports what it returns. HOW THE RETIRED LIST IS REACHED, and why: `skills validate` reads skills/vibehub-core/contracts/skill-graph.json RELATIVE TO --repo, which only resolves in this plugin's own checkout. `skills retired` has to answer inside a USER's project, which has no skills/ tree at all — the folders sit under .claude/skills/ or .agents/skills/. So it reads the contract that travels with the script, fileURLToPath(new URL('../contracts/skill-graph.json', import.meta.url)), the same mechanism versions.json and dependency-hygiene.json in this file already use; both files ship inside the vibehub-core folder, so the copy is present wherever vh.mjs runs and always describes the plugin version actually installed. In this repository the two paths resolve to the same file, so the two operations cannot disagree here either. No name is hard-coded in SKILL.md or in the operation; a test asserts setup's prose contains no retired name. LOCATIONS INSPECTED: SKILL_INSTALL_LOCATIONS = ['.claude/skills', '.agents/skills', 'skills'] — the first two are the directories `npx skills add` was recorded writing for claude-code and codex in .vibehub/evidence/ticket-implement-npx-first-install-experience/skills-sh-e2e-both-hosts.yaml, the third is a repository that vendors Skill folders at its root, which is this checkout's own shape. All three are returned as `locations`; the ones that exist are returned as `scanned`. DEMONSTRATION on a throwaway project (scratchpad/demo-project, outside the worktree, built by copying vibehub-core, vibehub-setup and vibehub-review into .claude/skills/ and planting an extra copy under the retired name in .claude/skills/ and .agents/skills/). Run from the installed Skill's own directory, exactly as setup would: `cd .claude/skills/vibehub-setup && node ../vibehub-core/scripts/vh.mjs skills retired --repo <project>` returned ok:true with scanned ['.claude/skills','.agents/skills'] and retired listing two entries: path .claude/skills/vibehub-ticket-review, name vibehub-ticket-review, replacement vibehub-review, replacement_installed true; and path .agents/skills/vibehub-ticket-review, same replacement, replacement_installed false. Both install locations were reported, not just the first. WHAT I DO NOT CLAIM: I did not run `npx skills add` end to end in this session; the demonstration reproduces the resulting layout by copying folders. The location list is a fixed list in the script, so a host that installs somewhere else is not covered until that path is added there. VERIFY, real output taken 2026-09-01 in the worktree: `node skills/vibehub-core/scripts/vh.mjs project validate --repo .` -> ok:true valid:true, format_version 2, rooms 6, contexts 66, tickets 103, evidence 305, outcomes 94, unverifiable_context_refs [] (evidence 305 is the count BEFORE this Ticket's Evidence was appended). `skills validate --repo .` -> ok:true valid:true, skills 12, edges 19, events 9, files_scanned 1111, retired [vibehub-ticket-review -> vibehub-review]. `npm test` -> tests 206, pass 206, fail 0 (200 before; +6 from test/retired-skill-folders.test.mjs). `git status --short` -> M docs/INSTALL.md, M skills/vibehub-core/scripts/vh.mjs, M skills/vibehub-setup/SKILL.md, ?? test/retired-skill-folders.test.mjs. I did not commit, did not stash, did not close the Ticket, and do not judge whether this criterion is satisfied.",
