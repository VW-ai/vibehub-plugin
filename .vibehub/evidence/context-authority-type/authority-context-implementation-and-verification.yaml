  "summary": "Added Context type authority with a required authority object (governs in Room anchor syntax, canonical current-tree paths outside .vibehub, ordered update_rules, non-empty validation, optional approval none|human) in context.schema.json and vh.mjs; validateContext rejects the field on other types, malformed or internal anchors, versioned or internal canonical refs, and loadRepository fails on a missing canonical file. Added read-only operations context governing (paths and/or ticket_id; matched scope per authority; deterministic order; honest empty result) and context guard (explicit paths or git status plus optional since revision; a canonical change passes only when an active change Context in the same set relates to the authority and cites the changed artifact; never writes). context put returns advice when a canonical artifact sits outside the owning Room's anchors. Wired ingest (how to capture authority and its change record), query (governing lookup), plan (attach governing authority to context_refs; approval human becomes human-authority acceptance), run (read governing authority before implementing; follow update_rules in order; record change Context; approval human routes to execution-needs-human; run guard before Evidence), validate (governing and guard; violations are material), closeout (guard blocks successful). Rooms projection carries an authority block and the Workbench row reads AUTHORITY with governed scope, canonical artifacts and human approval; verified live on a fixture repository with no console errors. CONCEPT.md, README.md and CHANGELOG.md describe the type. test/context-authority.test.mjs covers schema acceptance and rejection, governing by prefix, segment file and Ticket refs, guard pass and fail with explicit and git-derived paths including since, and the projection. npm run verify passed 333 tests and the 76-file artifact check. Context schema_version stays 1 and no project-format migration was added.",
