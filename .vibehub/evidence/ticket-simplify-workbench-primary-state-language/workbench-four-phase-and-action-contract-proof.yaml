  "summary": "One shared browser model now derives only DRAFT, READY, RUNNING, and DONE from the unchanged host next_action, with exactly one upper-right DEVIATED/BLOCKED/NEEDS YOU/VERIFYING/WAITING slot and canonical precedence that forbids READY or RUNNING from appearing blocked or deviated. The production host explicitly exposes runtime unavailable; the optional model path accepts only trusted, ticket-scoped execute/closeout runtime with a run id, active state, observation time, and unexpired deadline, so CLOSE_OUT is RUNNING+VERIFYING without a false live claim. Real cards keep their anatomy and topology while omitting the former rendered top accent; READY is restrained neutral, RUNNING is active blue, and only verified live presence gets the reduced-motion-safe pulse. The focused Execution panel now leads with Recommended action, a short title and explanation, and the strongest Copy prompt CTA; when a host payload exists the browser returns that exact object rather than adding phase/substate metadata, preserving read-only independent closeout. Real-browser review at the source host confirmed global phase/substate cards and the action-first panel at the default viewport and 390x844 narrow viewport.",
