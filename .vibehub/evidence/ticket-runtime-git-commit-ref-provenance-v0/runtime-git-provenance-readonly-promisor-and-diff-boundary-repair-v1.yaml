  "summary": "Repaired two blocking independent-closeout findings while preserving Contract v1 and historical Evidence. Git2.44 ignores GIT_NO_LAZY_FETCH and a local protocol.file.allow=always bypassed generic protocol.allow=never, causing readCommit to fetch missing promisor objects. An empty GIT_ALLOW_PROTOCOL prevents all transports/helpers, but a stronger regression also found Git can write partialclonefilter config before transport denial. Object/diff reads now use disposable minimal bare metadata with the explicit source object directory and actual object format, without source remotes/config; finally cleanup removes only owned scratch. Synthetic partial-clone tests fingerprint every source .git file before/after missing commit, ancestry, missing tree and locally available commit reads and prove byte-identical config/object state; an allowed synthetic remote-helper protocol never executes its marker helper. Existing SHA-1/SHA-256 behavior remains green. Second finding used valid raw Git trees with a 4225-byte path: per-base diff shape validation now occurs within its failure boundary, with oversized paths returning unresolved limit_exceeded while verified commit metadata survives. Checked-in mktree/commit-tree regression proves this and nonmutation. Both independent reproducer scripts now pass. Final focused Git/public integration suite passes16/16 and boundary check passes60 files; Context guard has zero authorities/violations. No Outcome, source-repository write, external service or user Git mutation was performed. Previous Evidence remains historical; these proofs describe the corrected adapter.",
