  "summary": "Migration commit d9017df27b8407d7db30f772f48e324f7014a73f records exactly three production moves from src/local into src/application/query: query-contract.mjs, query-inputs.mjs and query-engine.mjs. Normalized source comparisons prove the moved implementations are byte-identical after replacing only their six, thirteen and four required relative import specifiers. All old paths are absent with no compatibility shim. src/index.mjs remains the sole production importer outside the Query capability and exports the same LocalQueryEngine symbol; a focused structural assertion fixes that boundary. Current test fixtures and direct tests resolve the new paths. No other production source moved. The existing Query contract validation, authorized input composition, constructor, query/next, cursor and LRU behavior, budgets, text/ranking trace, optional Judge behavior, degradation/cancellation, authorization/source/head/freshness rechecks, errors, schemas, digests, SQL, providers, transaction ownership and public export set remain unchanged. The regenerated layout baseline records the three new application/query nodes and equivalent edges. The relocation manifest binds old blobs b62d715e0043462f05feb5d0e769e8a3b93456bc, fe159875ac1db76cfc7f0edea6a21de44e70caf4 and f7f22f70a68439809c385a48a53270ee8125570f to the new paths, category query-application-capability and the actual migration commit; its focused test skips only when standalone packaging deliberately omits historical records. Focused Query/composition/layout/boundary verification passes 51/51 before the move commit, and final provenance/layout/boundary verification passes 21/21. Boundary checking scans 247 production files with zero errors, zero SCCs and zero direction exceptions. Full Runtime verification passes 1027 total / 1025 passed / zero failed / two expected skips. Standalone locked-install verification passes 1027 total / 1018 passed / zero failed / nine expected skips. Plugin artifact verification passes with 79 files and 3670088 bytes. Project and Ticket validation, Context guard, git diff checking and semantic-runtime Room alignment pass; the Room is FRESH. Historical Ticket, Evidence and Outcome references retain their accepted old paths. No credential, Keychain lifecycle, host, network, provider or live JEV call was used; deterministic JEV and Query/Judge integration coverage remained in both full suites.",
