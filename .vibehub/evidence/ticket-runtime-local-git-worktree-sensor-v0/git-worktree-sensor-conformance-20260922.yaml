  "summary": "Implements exact Contract4 as a callable LocalGitWorktreeSensor, strict metadata v1 and isolated observer, composing existing Git registry, activation and DurableIngress; no new namespace, dependency, watcher, timer or durable queue. bind selects the actual current owner-bound execution registration, including linked worktrees, and never invents host Session/Execution/exploration. hint/drain coalesce bounded in-memory work; actual epoch/current source access fences admission and retries preserve the first bytes/receipt. Captures HEAD/index/staged/unstaged/untracked metadata with path bytes and digests, explicit gaps and null producer sequence. Isolated Git reads use a bounded scratch index/object view, no inherited helper config or network, maximum8MiB index/2MiB output/256 paths/48KiB metadata/5s child/15s sample, one resample and bounded submissions. Nonregular metadata including index/config/HEAD FIFOs returns unsupported_profile through nonblocking nofollow reads. Prior independent findings were reproduced and fixed: same-size binary edits with restored mtime remain visible through Git racy-index checks, staged Gitlink OIDs retained, assume-unchanged/skip-worktree produce explicit unsupported gap, scope keys are tuples, Proxy/getter inputs remain inert, capacity stops rather than rescans, and source config is never loaded by discovery Git commands. Reproduce with node --test test/git-worktree-sensor.test.mjs: final author28/28 and independent28/28 passed; independent FIFO repro fell from blocked>16s to20ms gap. Earlier affected151/151 passed. Final clean npm run verify:standalone installs locked dependencies in a temporary copy and passes585 total583pass2 intentional native skips,0fail plus144 boundary files/0 errors. Root npm run verify:artifact also passed and Git diff check is clean. The checked-in synthetic32tracked8untracked measurement records16 staged/16 unstaged/8untracked,8135-byte metadata,30 commands,69822 output bytes,2passes,360ms,one receipt,zero model calls; timing is not an SLA. Tests cover real temporary Git/SQLite, restart retained metadata, races, gaps, exact lost-response retry, helper-config isolation and no source mutation. App/plugin automatic capture and product-level end-to-end context delivery remain separate work.",
