  "summary": "Implements exact GraphStore Contract3 on existing scoped DomainStore schema2, without new dependencies/tables/migrations or cumulative in-memory graph reconstruction. LocalGraphStore composes real authority, Git Project/activation and immutable DurableIngress, separately registers actor/installation/workspace/epoch runtime publication identities, keeps original event/catalog/coverage pins and commits canonical records/projections/head/audit/command/receipt/outbox atomically. Current source policy plus captured ACL and Graph lifecycle applies to exact/historical reads, receipt metadata, retry, inherited parents and relation closure; source-denied pages fail whole. CAS mismatch has no effects; semantic competing assertions remain explicit until complete resolution. Writes fenced by Project admission, with exact retry reconciliation after disable and original pins retained after current Git metadata changes. Coverage from real bounded selectors preserves gaps/null completion and never ACKs ingress. Resumable maintenance pages canonical deltas into a new index prefix with durable exact step receipts, mutation fencing, restart, current activation gates, final atomic switch, and no canonical mutation/pruning. Oversized rebuild batch rolls back completely and smaller retry advances. Real process tests exercise distinct CAS and exact duplicate writers, SIGKILL before SQLite commit (all rows unchanged), and SIGKILL after commit before facade reply (durable receipt/one outbox on retry). Review-driven repairs: bound as-of temporal predecessor/successor adjacency and current pointer checks so deleted middle/latest/current rows fail closed; missing format cannot be recreated by reads/retry/fresh publication; coverage snapshot digests cannot be corrupted to erase receipt authorization inputs. Dense 48-commit x32-source fixture exposed native SQLite iterator statement lifetime on Node23.9; DomainStore now strongly retains each active StatementSync until finally cleanup, with forced-GC subprocess regression and aggregate-overflow reuse. Final facade20/20, helper9/9, crash4/4, nativeGC1/1, selected-range14/14; independent42/42 earlier focused plus5/5 real crash/GC, additional2/2 final format regression. Full verify516 total514pass2native opt-in skips; after final format fix standalone clean npm ci + verify517 total515pass2skips, zero failures,129 dependency boundary files0errors. Standalone runs outside parent repo. Core V1/incremental/auth/events/identity/causal/store/Git/activation/ingress regressions remain passing. Actual SQLite retained1040 transitions600 objects1041commits one generation,600heads/10pages and441history/7pages; scoped EXPLAIN primary-key SEARCH/noSCAN/noOFFSET. Fixed-support actual adapter queries/rows164/138 at transitions601/801/1040; pure-port <=64 fixture proof unchanged. Max plan16921B,row7959B,page520590B, source rows13092 before/19952 after17 rebuild batches, logical database51548160B. Measured mutations30278.17ms/rebuild1824.86ms on this local concurrent run, not SLA. Old exact view survives rebuild; old index prefixes retained. Public in-process export/docs included. No host plugin, HTTP semantic API, automatic extraction, Policy scheduler, branch adoption, Worker execution or complete App semantic loop claimed.",
