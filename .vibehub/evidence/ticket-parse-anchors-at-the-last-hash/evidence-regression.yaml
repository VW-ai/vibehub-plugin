  "summary": "Four tests appended to test/segment-anchors.test.mjs, one per required case. (1) A segment id whose file path contains # resolves: the test takes the id from `source segment` itself rather than hard-coding it, then asserts unresolved_anchors [] and files [{path:'docs/a#b.md', segment_count:1, uncovered:['docs/a#b.md#_preamble']}]. (2) A prefix anchor that must NOT collide: docs/a beside docs/a#b.md#_preamble, asserted both through `project validate` (exit 0) and through `room put` (exit 0), because overlap is checked in both places. (3) A prefix anchor that must STILL collide: docs beside the same segment anchor, asserted non-zero exit and the message 'claim overlapping territory (docs)' in both places. (4) A Room re-put carrying alignment through: create by `room put`, commit, `room align`, confirm FRESH; re-put the Room with a coverage_exception added and the alignment block carried through verbatim; drift stays FRESH, the written alignment block is byte-identical to the stamped one, and uncovered_total is 0. The same test then pins the constraint from the other side — dropping alignment from the input succeeds with no error, leaves alignment undefined on disk, and returns the Room to UNKNOWN — so a future change that made `room put` preserve alignment implicitly would fail this test. NO EXISTING TEST WAS CHANGED and none needed to be: `npm test` went from 218 pass / 0 fail before the change to 222 pass / 0 fail after, the delta being exactly these four. No existing test encoded either bug; the suite simply had no case where a source file path contained '#', and no case that re-put an aligned Room. `project validate --repo .` returns {valid:true, format_version:2, rooms:6, contexts:67, tickets:106, evidence:328, outcomes:97, unverifiable_context_refs:[]} (counts taken before this Evidence was written) and `skills validate --repo .` returns {valid:true, skills:12, edges:19, events:9, files_scanned:1143}. Holes probed and disclosed, all pre-existing and none introduced: (a) an anchor of exactly '#' parses to an empty path and a segment '#', is accepted by the schema and by `room put`, owns nothing, and does NOT appear in unresolved_anchors, because anchoredTerritory filters empty paths out before the missing-anchor check — verified live, still open, identical under both the first-# and last-# rules; (b) an anchor whose slug side looks like a path, 'docs/nope#b/c.md', is at least reported honestly, landing in unresolved_anchors; (c) an empty-string anchor is rejected by the Room schema before parsing is reached; (d) an anchor naming a whole file whose name contains '#' remains unreachable, the disclosed cost of the chosen reading, recorded on evidence-last-hash-wins.",
