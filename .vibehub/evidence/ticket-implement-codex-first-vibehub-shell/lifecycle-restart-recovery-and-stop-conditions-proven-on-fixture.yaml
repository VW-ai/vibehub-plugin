lk from live Turn through SIGKILL, restart, and ?thread= and ?task= reloads recovering the same Thread. Boundary: every proof ran on the fixture app-server because the local Codex is 0.144.1; generated-protocol-hash-changed and audio-input-removed remain unverified until the pinned binary runs the boot schema probe, the status a real app-server reports for a Turn interrupted by its own death is unconfirmed, and the resume-before-turn model for unloaded Threads has not executed against the binary.",
