ot unavoidable: the contract's own structural occurrences (retired[].name and each allowance's text) could be subtracted the way Context refs already are. Only the $-invocation form is caught there, and by a different check - a $-invocation of the retired name inside the contract fails as naming a Skill that does not exist under skills/, which independently confirms the Evidence's disclosure (f). FIFTH HOLE, and the load-bearing one: a Ticket counts as closed the moment any Outcome file exists, so this Ticket silences itself. .vibehub/tickets/ticket-contract-the-skill-graph.yaml carries one live occurrence of the retired name in its context prose. I moved .vibehub/outcomes/ticket-contract-the-skill-graph.yaml aside and skills validate immediately failed on that Ticket, then restored it. The criterion exempts 'closed .vibehub/tickets/'; a Ticket whose own acceptance criterion is unresolved is not closed, and the repository's green state currently depends on treating it as though it were. Of the 28 Tickets carrying the retired name, 26 are silenced by successful Outcomes and one is genuinely live; the single exception is this one, silenced by its own partial Outcome. The executor disclosed this and chose consistency with vh.mjs's own notion of closed, which is defensible engineering but does not satisfy the criterion as written - and the fix was one more allowlist entry naming that one line, exactly as done fourteen times elsewhere. SIXTH, weaker: an allowance's text may be the bare retired name. With an allowance whose text is exactly vibehub-ticket-review a prose mention passes, and swapping that mention for a live ../vibehub-ticket-review/assets/app.js path leaves the count at 1 and still passes. The three shape rules do not require the excused text to be narrower than the name, so an allowance can still degenerate into a count-bounded file pass. No current allowance is shaped this way - all 14 name substantive text - so this is a latent review-surface weakness rather than a present violation. RULINGS ON THE DISCLOSED HOLES. Skipped build output (dist/, coverage/, test-results/): outside scope. All three are gitignored and git ls-files reports nothing tracked under any of them, so no checked-in Skill, contract, script, UI asset or test can live there; the only residue is that the skip list is hardcoded rather than derived from .gitignore, which can drift. Binary-classified files: an acceptable documented limit - I confirmed the repository tracks zero files with a NUL byte in their first 8000 bytes, and a genuine binary asset cannot carry a meaningful live reference. Split-string references: an acceptable documented limit; the criterion speaks of a bare string, and a path broken across a concatenation is not one. No textual scan closes this. The whole-directory .vibehub/history/ exemption: outside scope, because the current criterion grants it by name - though it is worth recording that the previous adjudication flagged .vibehub/history/ and the Context source.ref subtraction as exemptions the criterion did NOT grant, and the rewrite in ac5e90a added both to the exempt list. The rewrite is stricter overall, but it was authored by the implementer in the same commit as the implementation, and two of its changes retroactively bless what a previous adjudicator had called out. The dated-basename META inference, the third such call-out, was correctly deleted rather than blessed. A Ticket counting as closed once any Outcome exists: a criterion failure, as argued above - the one disclosure that disclosure does not excuse. TWO FURTHER LIMITS NEITHER DISCLOSED NOR MANDATED, both minor. Matching is case-sensitive, so a case-varied skills/<Name>/ path passes; a differently-cased string is arguably a different name, and the folder no longer exists under any casing, so I do not treat this as a failure. Symlinks are skipped by the walker, so a live reference reachable only through a symlinked file passes; the skip is a deliberate guard against escaping the repository root, and a symlink target inside the repository is still scanned at its real path. EVIDENCE ASSESSMENT. evidence-retired-names-exempt-per-occurrence is markedly more honest than the document it supersedes and does not repeat that document's flat falsehood; its disclosure list (a) through (f) is accurate, and I independently confirmed the two claims most easily fabricated - that moving this Ticket's Outcome aside makes the check fail on the Ticket, and that a $-invocation quoted in the contract trips the reference check before any allowance can excuse it. It does overstate in one place, in a milder version of the earlier pattern: 'Three shape rules keep an allowance from widening back into a file pass' is false for a bare-name text, and the test it cites, 'an allowance may not be shaped into a blanket exemption', covers a missing text, an unrelated text, a multi-line span, a directory path and a zero count, but not the one shape that still works. Its disclosure list is also incomplete in one in-scope way: it does not mention that the contract file is skipped wholesale, which is the same defect class the rewrite was written to outlaw. Its counts are honest but already stale on arrival - 1084 files scanned against 1085 now, explained entirely by its own Evidence document being written after the count was taken, and 'no untracked files' was true only in the moment before it wrote itself. VERDICT: partial. graph-contract, validation and no-runtime-role remain accepted on the earlier adjudication and are confirmed undamaged. retired-names-stay-retired stays unresolved: the per-occurrence allowlist it demands genuinely works, but a live ../<name>/ path inside the contract - a place the criterion names explicitly - still passes, and this Ticket's own live reference is silenced by an over-broad reading of 'closed' that this Ticket itself is the sole beneficiary of. Constraints hold: the graph is still not a router, a lifecycle or dispatch state, and the declared graph is the post-rename post-absorb one.",
