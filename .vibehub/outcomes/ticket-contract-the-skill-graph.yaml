  "summary": "Fourth independent adjudication of retired-names-stay-retired, decided against the criterion's CURRENT text in the Ticket YAML, plus confirmation that the three criteria accepted earlier are undamaged. VERDICT: partial. The repair does everything it claims - I reproduced all of it rather than reading it - and it closes the regression the third adjudication ruled on. One NEW hole remains, in the same defect class, and it is the narrowest instance of that class yet: two fields of one file. See the RECOMMENDATION at the end; a human has to decide whether a fifth round is worth it, and I think it is, narrowly.\n\nPRECONDITIONS, verified first-hand at HEAD 1b2fe49 with a clean tree (git status --porcelain empty): npm test -> tests 199 / pass 199 / fail 0. project validate --repo . -> ok:true valid:true (format_version 2, 6 rooms, 66 contexts, 103 tickets, 304 evidence, 94 outcomes, unverifiable_context_refs empty). skills validate --repo . -> ok:true valid:true (12 Skills, 19 edges, 9 events, retired [vibehub-ticket-review -> vibehub-review], 1109 files scanned). All four hold. Every probe below ran on a `git archive HEAD` copy in the session scratchpad with --repo pointed at the copy; the worktree was never mutated and HEAD is unmoved.\n\nTHE THREE ACCEPTED CRITERIA ARE UNDAMAGED, confirmed not re-derived. skills validate passes on this repository, so graph-contract and validation's pass-clause hold at HEAD; test/skill-graph.test.mjs runs 36/36 green inside the 199, covering validation's six mandated failure modes; no SKILL.md outside vibehub-core/contracts references skill-graph.json or `skills validate`, and the only .vibehub/ occurrences of the command's output are inside Evidence prose recording a gate run, which is the accepted reading of no-runtime-role.\n\nWHAT I REPRODUCED OF THE REPAIR'S CLAIMS - all four verified, none taken on trust.\n\n(1) THE POSITIONAL PARSER AGREES WITH JSON.parse. I extracted parseJsonWithSpans and nodeValue into a standalone module and ran a differential against JSON.parse over ~70 hand-built adversarial cases plus 200,000 randomly generated documents. The cases covered: \\u escapes, lone surrogates (\\ud800), surrogate pairs, \\u005cu0072 (an escaped backslash followed by what looks like an escape), escaped solidus, escaped quote, literal control characters U+0000/U+001F/U+007F, U+2028/U+2029, a BOM, duplicate keys at object and nested depth, __proto__ and constructor keys, empty keys, -0, 1e999, 01, 1., .1, +1, Infinity, NaN, trailing commas, trailing content after the top-level value, `truex`, bare atoms at top level, numbers adjacent to strings ([1,\\\"x\\\"], [1e5,\\\"x\\\"], [\\\"x\\\",-0], [1\\\"x\\\"]), every JSON whitespace form plus the non-whitespace \\u000b and \\u00a0, and single-character deletions from random documents. For each I checked three things, not one: acceptance agreement, value agreement under JSON.stringify, and - the one that actually matters for this design - that every recorded span, sliced out of the raw text, is a complete quoted JSON string literal that JSON.parse re-parses to exactly the value the node carries. REAL OUTPUT: `NO DISAGREEMENTS FOUND`. I could not construct an input where the two disagree about which bytes constitute a string leaf. This is the strongest part of the repair and I am recording it as verified.\n\n(2) LAST-DUPLICATE-WINS, SO SHADOWED BYTES REACH THE SCAN. Probe: inject a shadowed duplicate of the first key of .vibehub/rooms/product/decision-retire-ticket-review-skill-name.yaml carrying `../vibehub-ticket-review/assets/app.js`. REAL OUTPUT: ok:false, `.vibehub/rooms/product/decision-retire-ticket-review-skill-name.yaml: Live reference to retired Skill vibehub-ticket-review (1 unexcused occurrence)`. Same result when the shadowed duplicate is of the EXEMPT field itself (`\\\"source\\\": {\\\"ref\\\": \\\"../vibehub-ticket-review/assets/app.js\\\"}` as a shadowed first member). The third adjudication's regression is closed.\n\n(3) AN UNPARSEABLE DOCUMENT GETS NO EXEMPTION; DISAGREEMENT FAILS LOUDLY AND CONSUMES NOTHING. Verified by reading the control flow and by the stack-depth probe below: consumption happens only on the branch where both parsers succeed AND agree, and my differential shows spans are faithful on exactly that branch. A located problem adds an error and returns the file's raw text unchanged, so the direction of the design is as claimed - locating a span can only cause more to be scanned, never less.\n\n(4) SPANS CANNOT JOIN BYTES INTO A NAME. blankSpans keeps both surrounding quotes, so a consumed leaf leaves `\\\"\\\"` between its neighbours, and `\\\"` cannot occur inside a Skill name. Independently, the selected spans are always distinct string leaves at distinct offsets (keys are never selected - the key node is discarded at `members.set(key.value, parseValue())` - and no two selectors can resolve to the same node), so overlap is structurally impossible and the right-to-left order is sufficient. I found no adjacency or ordering case that splits or joins bytes.\n\n(5) THE INERT-TEST FINDING IS TRUE, AND THE CORRECTED TEST IS GENUINELY LIVE. RETIRED is `vibehub-old-alpha`. REAL OUTPUT: the old `RETIRED.replace(\\\"r\\\", \\\"\\\\u0072\\\")` yields `skills/vibehub-old-alpha/SKILL.md` - byte-identical to the unescaped path, so the laundering half never ran; the current `RETIRED.replace(\\\"a\\\", \\\"\\\\u0061\\\")` yields `skills/vibehub-old-\\u0061lpha/SKILL.md`, which spells the name only after unescaping. The escape is now real. I also mutation-tested the defence it guards: replacing blankSpans' span consumption with count-based consumption of the parsed value turned test/skill-graph.test.mjs from 36 pass / 0 fail into 33 pass / 3 fail. The span-versus-count distinction is genuinely covered, not merely asserted.\n\nTHE NEW HOLE - TENTH IN THE SERIES, AND THE REASON THIS IS STILL PARTIAL. contractSpans consumes the raw spans of retired[].name, retired[].replacement and retired[].allowed_paths[].text. allowed_paths[].text is bounded - the staleness rules force it to occur in the named file with a matching count. name and replacement are NOT bounded by anything: validateRetiredNames checks only `typeof === \\\"string\\\"` and non-empty, and validateSkillGraph never requires either to look like a Skill name. So whatever text an author puts in those two values has its bytes consumed out of the contract before the scan, with no allowlist entry naming the path, the text, or a reason.\n\nREAL OUTPUT, in the most realistic form - editing the single existing retired entry, adding no new entry, one field:\n  BEFORE: raw occurrences of vibehub-ticket-review in skills/vibehub-core/contracts/skill-graph.json = 16; skills validate -> ok:true valid:true.\n  Change one value to `\\\"replacement\\\": \\\"vibehub-review (the old skills/vibehub-ticket-review/ folder is gone)\\\"`.\n  AFTER : raw occurrences = 17; skills validate -> ok:true valid:true.\n  CONTROL, the identical sentence moved one key over into `reason`: ok:false, `skills/vibehub-core/contracts/skill-graph.json: Live reference to retired Skill vibehub-ticket-review (1 unexcused occurrence)`.\nSame result through `name`: a second retired entry `{\\\"name\\\": \\\"../vibehub-ticket-review/assets/app-nowhere-else.js\\\", \\\"replacement\\\": \\\"vibehub-review\\\"}` - a string occurring nowhere else in the tree, so nothing else can flag it - gives ok:true valid:true with the live path sitting in the contract at line 252.\n\nWHY THAT IS A FAILURE AND NOT A NECESSARY EXEMPTION. Some exemption on retired[].name is forced: the criterion itself requires the contract to declare the retired name, so those exact bytes cannot be made to fail. The defect is that the exemption is granted by KEY POSITION and is unbounded in CONTENT. The criterion names `contracts` explicitly among the places a live reference must fail, and says an exemption is per occurrence, an allowlist entry names the path AND the exact text AND why, and any occurrence the entry does not name still fails. This is an occurrence in a live file that no entry names and that does not fail. It is the same shape as the three holes before it - a structural exemption invented outside the criterion's named list - which is why I am recording it as (c) a failure rather than a limit, even though its reach is small.\n\nRULINGS ON THE ITEMS THE EVIDENCE DISCLOSES.\n1. UTF-16LE and other non-literal encodings still pass - (b) inside scope, acceptable documented limit. Reproduced: a UTF-16LE Context document carrying ../vibehub-ticket-review/assets/app.js gives valid:true, while the byte-identical UTF-8 control fails. The criterion says \\\"a bare string\\\"; a name not spelled in literal bytes is not one, no textual scan closes the class, and the file would not survive review as a Context document anyway.\n2. A directory containing a .git entry is skipped - (b) acceptable. Reproduced: vendor/nested/.git plus a live path in vendor/nested/live.md gives valid:true. Git refuses to track a path component named .git, so such a directory cannot reach a clean checkout; it is another repository's source, which is the stated intent.\n3. Hardcoded skip list with a drift test - (b) acceptable. .git, node_modules, dist, coverage, test-results; all build or vendor output, and the drift test against .gitignore bounds the rot.\n4. Whole-directory exemptions and 5. the Context source.ref/evidence[].ref exemption - (a) outside scope. The criterion grants both by name. I checked the boundary anyway: the exemption is claimed only by a kind:context document under .vibehub/rooms/, and a fabricated one carrying live paths in evidence[].ref passes skills validate but is REJECTED by project validate, so the tree's other gate bounds it.\n6. Case variants reported only absent an exact-case failure, and never excusable - (b) acceptable. Reproduced: skills/VibeHub-Ticket-Review/SKILL.md fails as a case-variant reference. Reporting one class per file per entry is a message-ordering choice, not a bypass.\n7. Allowance text may be generic - (b) acceptable. The four shape rules plus the count bound how much one entry excuses; they cannot bound whether a human's reason is honest, and the criterion asks for a reason, not a good one.\n8. Runtime-constructed references out of reach - (a) outside scope. The criterion describes textual occurrences.\n9. An allowance whose path is the contract can excuse an occurrence in the contract - (b) acceptable. Reproduced: a stray_note carrying a live path plus an allowance naming that exact line passes. The entry still names path, exact text, and reason, and the count must match; the contract being unprivileged in both directions is the correct reading of \\\"never per file\\\". Note this is exactly what the new hole is NOT: there, nothing names anything.\n10. Stack-depth false positive - (b) acceptable. Measured the window: a Context document nests fine at depth 2000 and at depth 5000 produces `Legitimate-field exemption not applied: the document could not be located in the raw file (Maximum call stack size exceeded)`, while JSON.parse itself still succeeds at 10000. So the false-positive window is roughly depth 2000-10000, on documents no Context document approaches (real ones are three levels deep), and the failure is loud and over-strict, never silent.\n11. A second JSON parser in vh.mjs - (b) acceptable. Real added surface, honestly named, and my 200k-case differential is direct evidence the two do not currently drift. Drift would surface as the loud disagreement, not as a bypass.\n\nDOES THE EVIDENCE OVERSTATE? No - this is the first pass on this criterion where it does not. Every specific claim in evidence-retired-names-scan-raw-bytes I tested held, including the two most checkable ones: that the parser mirrors JSON.parse's duplicate semantics, and that the previously-guarding escape test was inert. Its \\\"WHAT I AM NOT CLAIMING\\\" paragraph predicted that this pass has a hole too. It does, and I found it. The one thing I would sharpen: the Evidence says the contract's legitimately-held content is \\\"three PARSED FIELDS\\\", and enumerates what is scanned normally as \\\"a stray key, a reason that quotes a live path, an allowance path under the retired folder\\\". That enumeration is accurate but it does not ask what happens when one of the three exempt fields carries text it has no business carrying. That is an omission of analysis, not an overstatement of result.\n\nVERDICT: partial. retired-names-stay-retired remains unresolved; graph-contract, validation and no-runtime-role remain accepted.\n\nRECOMMENDATION FOR THE HUMAN - one more bounded round, not a follow-up split. Reasoning, on severity and threat model rather than description. SEVERITY IS LOW AND THE BLAST RADIUS IS ONE FILE. Unlike every predecessor hole - a per-file allowlist (any file), a contract path skip (the whole contract), a duplicate key (any Context document and any contract field) - this one cannot launder a reference into a Skill, a script, a UI asset, or a test. It hides bytes in exactly two values of skills/vibehub-core/contracts/skill-graph.json and nowhere else, and putting a path in retired[].name actively makes the check STRICTER everywhere else, because the checker then hunts that literal across the tree. WHO HAS TO DO WHAT: an author must write the retired-name text into retired[].name or retired[].replacement of the contract. The deliberate route buys almost nothing. The accidental route is real though: retiring a second Skill and writing an explanatory replacement like \\\"vibehub-review (was vibehub-ticket-review)\\\" is a natural thing to type, sits one key away from `reason` which invites exactly that prose, and the value is then echoed back in the checker's own \\\"use X\\\" guidance. WHY CONTINUE ANYWAY: the fix is not new machinery. It is a shape assertion beside the existing \\\"needs a non-empty name and its replacement\\\" check - constrain both values to a bare Skill-name token - and it is a correctness improvement in its own right, since a replacement that is not a Skill name is already meaningless as guidance. The failure pattern that has cost this Ticket three rounds is new scanning machinery breeding new holes; this fix adds none, so its regression risk is materially lower than any previous round's, and the expensive verification - the parser, the spans, the duplicate semantics - is now done and clean and does not need reopening. SCOPE THE ROUND HARD: constrain retired[].name and retired[].replacement to a bare Skill-name token, add a test that a path or prose in either field fails, and change nothing else - not the parser, not blankSpans, not the allowance rules, not isHistoricalRecord. If the fifth pass proposes touching the span machinery, that is the signal to stop, close this criterion as partial with the residue recorded as a documented limit, and split the remainder into a follow-up Ticket. My reason for preferring the round over the split is that the residue is not comfortable to document: \\\"two fields of the contract are exempt from the rule the contract exists to enforce\\\" is a sentence a future maintainer will reasonably read as licence to invent a twelfth structural exemption, and closing it costs less than writing it down honestly.",
