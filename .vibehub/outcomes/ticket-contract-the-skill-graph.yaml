  "summary": "Third independent adjudication of retired-names-stay-retired, decided against the criterion's CURRENT text, plus confirmation that the three criteria accepted earlier are undamaged. VERDICT: partial. The repair is real, is the best of the three, and closes every hole its two predecessors were marked down for - but it introduced one undisclosed REGRESSION in the same commit, in the exact defect class the criterion was rewritten to outlaw, and that is what withholds acceptance.\n\nPRECONDITIONS, verified first-hand at HEAD 892b0ce with a clean tree: npm test 191 tests / 191 pass / 0 fail; project validate ok:true valid:true (format_version 2, 6 rooms, 66 contexts, 103 tickets, 303 evidence, 94 outcomes, unverifiable_context_refs empty); skills validate ok:true valid:true (12 Skills, 19 edges, 9 events, 1 retired entry, 1108 files scanned). All four hold. Every attack below was run on an rsync copy of the worktree under the session scratchpad, never on the worktree itself; git status --porcelain in the worktree is empty and HEAD is unmoved.\n\nTHE THREE ACCEPTED CRITERIA ARE UNDAMAGED. test/skill-graph.test.mjs runs 28/28 green and each of validation's six mandated failure modes still has its own passing case (unresolvable $vibehub reference, Skill missing from the contract, orphan, cycle, reference with no declared edge, declared edge no SKILL.md witnesses), alongside the well-formed control and this repository's real graph. graph-contract: skills validate still declares all 12 Skill folders, 19 edges and 9 events. no-runtime-role: the case 'the checked-in skill graph is development-time only' passes, and the only .vibehub/ documents naming the validator are this Ticket, its Evidence and its Outcomes - prose about the work, not a recorded validator output. I confirmed these rather than re-deriving them.\n\nWHAT THE REPAIR GENUINELY FIXES. Reproduced, all five green-to-failing on the probe copy at HEAD: (1) a symlink docs/probe-link.js -> ../skills/vibehub-ticket-review/assets/app.js now fails, the link's target path being scanned as the blob content git stores; (2) a file carrying a NUL byte plus a live skills/vibehub-ticket-review/SKILL.md now fails instead of being classified binary and skipped; (3) skills/VibeHub-Ticket-Review/SKILL.md now fails as 'Case-variant reference'; (4) a stray NEW key in skill-graph.json holding ../vibehub-ticket-review/assets/app.js now fails, closing the fourth hole the second adjudication named; (5) a $-invocation fails wherever it appears. Span consumption is correct under adversarial shapes I built myself: two OVERLAPPING allowances over one excused line plus one stray live path still reports the stray as 1 unexcused occurrence (count subtraction would have paid for it), and an allowance whose text occurs twice with occurrences:2 consumes both intended spans while a third, different live path in the same file still fails - so a match landing at a different offset than intended cannot buy silence, because equal texts are interchangeable spans. The bare-name shape rule works: an allowance whose text is exactly the retired name is now rejected with 'The excused text is no narrower than vibehub-ticket-review itself' AND the live path it tried to excuse fails alongside it.\n\nTHE HAND-REBUILT ALLOWANCE IS SOUND. Judged on its merits, not its provenance. The entry for .vibehub/tickets/ticket-contract-the-skill-graph.yaml carries a 191-character verbatim single-line excerpt of the Ticket's own context prose. It contains the retired name; stripping every occurrence of the name leaves 170 non-blank characters, so it is strictly narrower; it is single-line; its declared count of 1 equals the file's actual count of 1; and the file holds exactly one occurrence of the retired name in total. Withdrawing the entry makes skills validate fail with precisely that one occurrence, proving the entry - not the Outcome - is what keeps the file green. Appending a SECOND live reference (a probe_live key holding skills/vibehub-ticket-review/SKILL.md) to the same file still fails with 1 unexcused occurrence, proving it excuses exactly the occurrence present and no more. Its reason is honest and factually checkable: the Ticket does carry a non-successful Outcome, so it is a live document. If anything the hand-rebuilt entry is NARROWER than the short-phrase allowances elsewhere in the list, since a longer text matches in fewer places. No finding.\n\nTHE (a)/(b) DIVERGENCE IS SOUND, AND I VERIFIED IT RATHER THAN ACCEPTING IT. The documenting comment above isHistoricalRecord does say so explicitly and accurately: it names the divergence, names loadRepository as the other reading, states that that reading counts a Ticket closed the moment any Outcome exists, and gives the reason. The accepted ticket-scope-reference-validation-to-lifecycle behaviour is genuinely untouched: no hunk in the 892b0ce diff of vh.mjs reaches loadRepository, and 'const closed = outcomes.documents.has(document.ticket_id)' is byte-identical to ac5e90a. test/ticket-context-ref-history.test.mjs passes 5/5, including 'a closed Ticket's context ref resolves at its recorded commit after the path moves' and 'an open Ticket with a dangling context ref still fails against the working tree'. The divergence is also safe by DIRECTION: the retired-name reading is strictly stricter than the lifecycle one, so it can only ever flag more, never fewer, and cannot manufacture a false negative. Two meanings of 'closed' in one file is a real maintenance hazard and a future unifier could bite, but it is documented at the point of divergence and scoped to one function. Not a finding. I also confirmed the status lookup fails CLOSED on every malformed shape: an Outcome of garbage bytes, valid JSON with no status, status 'failed', and status ['successful'] all leave the Ticket LIVE and failing; only a literal status 'successful' exempts it.\n\nNINTH HOLE - UNDISCLOSED, AND A REGRESSION INTRODUCED BY THIS COMMIT. The contract and every kind:context document under .vibehub/rooms/ are no longer scanned as bytes. contractResidual and contextResidual both JSON.parse the file, blank the legitimate fields, and JSON.stringify the result; that re-serialisation is what gets scanned. Any checked-in bytes the parse discards therefore never reach the scan. A duplicate JSON key is exactly such bytes. REAL OUTPUT. Control, to show the ordinary path works: adding a NEW key 'probe_live' holding ../vibehub-ticket-review/assets/app.js to a Context document fails with 'Live reference to retired Skill vibehub-ticket-review (1 unexcused occurrence)'. Attack: adding the SAME live path under a DUPLICATE of the document's own first key (context_id), so JSON.parse keeps only the later value - skills validate reports ok:true valid:true, GREEN, while grep counts the retired name in the checked-in file. The same works on the contract itself: injecting a duplicate 'owner' key whose shadowed value is ../vibehub-ticket-review/assets/app.js leaves the raw file carrying that path twice, JSON.parse still yields owner 'vibehub-core', and skills validate stays valid:true. project validate is also green on it, so nothing else in the toolchain catches it, and python json.load accepts the file, so it is valid JSON that git will happily track and that survives a clean checkout. THIS IS A REGRESSION, NOT AN INHERITED LIMIT: I extracted ac5e90a's vh.mjs, dropped it into the probe copy, and ran the identical Context-document probe - the PREVIOUS implementation FAILS on it correctly, because it scanned the raw text and subtracted counts. The third repair traded a count-subtraction hole for a raw-bytes blind spot and did not notice.\n\nRULING ON THE NINTH HOLE: (c), a criterion failure. The criterion names 'contracts' explicitly among the places a ../<name>/ path or bare string must fail, and it says in terms that no exemption may be inferred and that a file whose only claim to exemption is its name must fail. What the residual approach creates is a partial per-file exemption for exactly two file classes - the contract, and all 66 Context documents, which are agent-written and therefore the likeliest place for a machine-generated stray key. The code comment asserts the opposite in so many words: 'The contract is scanned like every other file. It is not exempt by path.' That is false for any bytes the parse drops. This is not the disclosed encoding class (hole 1): there the retired name is not spelled in literal bytes, whereas here it IS spelled in plain literal ASCII in the checked-in file and is still missed. Nor is it unclosable - scanning the raw text and consuming the parsed field values as spans, the way allowances are already consumed, would close it without returning to count subtraction.\n\nRULINGS ON THE EIGHT DISCLOSED HOLES. I reproduced five of them and they behave exactly as described. (1) Encoding - UTF-16LE and the HTML entity 'vibehub&#45;ticket-review' both reproduce GREEN: (b), an acceptable documented limit. The criterion says 'a bare string'; a name not spelled in literal bytes is not one, and no textual scan closes the class. (2) A directory carrying a .git entry is skipped wholesale - reproduces GREEN: (b), acceptable. Git refuses to track a path named .git, so it cannot reach a clean checkout, and the criterion governs checked-in content; the honest disclosure that it can locally blind the check is correct and worth keeping. (3) Hardcoded skip list vs .gitignore: (b), acceptable. The drift test 'the scan skip list matches .gitignore' exists and passes, which buys the same safety as deriving the list. (4) Whole-directory exemptions - a live file under .vibehub/evidence/ reproduces GREEN: (a), outside scope. The criterion grants .vibehub/evidence/, outcomes/, history/ and META/legacy-* by name, structurally. (5) A Context source.ref may hold any live path - reproduces GREEN: (a), outside scope, granted by name in the criterion. (6) Case variants are reported only absent an exact-case failure in the same file, and cannot be excused: (b), acceptable. The criterion does not require case-insensitive matching at all; this is extra strictness with a cosmetic reporting gap, and I confirmed by case-insensitive grep that no title-cased mention exists here. (7) An allowance text may be short and generic: (b), acceptable. The criterion requires the entry to name the path, the exact text and why; it does not require the text to be meaningful, and the shape rules bound how MUCH one excuses. (8) The check is textual, so runtime-constructed references are out of reach: (a), outside scope. So no disclosed hole is itself a failure - unlike the second adjudication, where one was. The failure is the undisclosed ninth.\n\nTWO FURTHER PROBES THAT DID NOT BREAK IT. A retired name that is a substring of live Skill names (I added a throwaway entry named 'vibehub-ticket') produces 48 errors, i.e. it fails LOUD and over-strict rather than silently - a false-positive risk, not a bypass. Chained retirement (retiring 'vibehub-review', the current replacement) produces 32 errors across the tree; blanking retired[].replacement does mean the contract's own replacement field escapes the scan for the newly retired name, but the situation is caught so loudly everywhere else that it is not a practical bypass. Neither is a finding.\n\nDOES THE EVIDENCE OVERSTATE? Much less than its two predecessors, and in one specific place it still does - the headline place. Every claimed fix (a) through (j) that I sampled reproduces exactly as written, and every disclosed hole I sampled reproduces exactly as written; the counts, the test list and the 'what I am not claiming' section are honest, and the refusal to declare the criterion resolved is correct. But 'The contract is no longer exempt by path ... scanned like any other file' is not true of bytes the JSON parse discards, and change (5) is presented purely as making the Context exemption 'exact rather than count-based' while in fact it also stopped scanning raw Context bytes and lost a class of detection the previous implementation had. A disclosure list framed as exhaustive - 'I am listing everything, including what the criterion arguably grants' - that omits a regression the same commit introduced is the residual overstatement.\n\nVERDICT: partial. graph-contract, validation and no-runtime-role remain accepted and are confirmed undamaged. retired-names-stay-retired stays unresolved: a live ../<name>/ path in the contract - a place the criterion names explicitly - and in any Context document still passes when carried by a shadowed duplicate JSON key, and the previous implementation caught it. The remedy is narrow and does not require revisiting any of the three accepted criteria or the (a)/(b) divergence: scan the raw file text and consume the parsed legitimate field values as spans, rather than scanning a re-serialisation of the parse. Constraints hold: the graph is still not a router, a lifecycle or dispatch state, and the declared graph is the post-rename, post-absorb one.",
