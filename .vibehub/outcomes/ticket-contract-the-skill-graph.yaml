  "summary": "Fifth independent adjudication of retired-names-stay-retired, decided against the criterion's current text in the Ticket YAML, plus confirmation that the three previously accepted criteria are undamaged. VERDICT: successful. The criterion holds. The repair does exactly what it claims, keeps the scope the fourth adjudication asked for, breaks nothing previously closed, and survives a direct attack on the new rule itself. This closes the Ticket.\n\nPRECONDITIONS, verified first-hand at HEAD 0491fde. git status --porcelain empty. npm test -> tests 200 / pass 200 / fail 0. skills validate --repo . -> ok:true valid:true (12 Skills, 19 edges, 9 events, retired [vibehub-ticket-review -> vibehub-review], files_scanned 1110). project validate --repo . -> ok:true valid:true (format_version 2, 6 rooms, 66 contexts, 103 tickets, 305 evidence, 94 outcomes, unverifiable_context_refs empty). All four hold. Every probe ran on an rsync -a --exclude .git copy at /tmp/probe with --repo /tmp/probe; the worktree was never mutated and HEAD is unmoved. Note for anyone reproducing: two tests (the format-2 audit and the dense-routing metric) fail on any .git-less copy because they read git history; I confirmed by running the unmutated copy as a control, 198/200 there and 200/200 in the worktree.\n\nTHE THREE ACCEPTED CRITERIA ARE UNDAMAGED, confirmed not re-derived. The vh.mjs diff 9cd8535..0491fde touches nothing outside validateRetiredNames; skills validate passes on this repository, so graph-contract and validation's pass-clause hold; probes on the copy still fail an unresolvable reference (\"$vibehub-nonexistent names a Skill that does not exist under skills/\") and an undeclared edge (\"$vibehub-migrate is referenced by vibehub-query but no edge between them is declared\"); the contract file and command remain development-time only and no Skill reads them at runtime.\n\n1. THE CLAIMED FIX, REPRODUCED. Real output, all on the copy.\n(a) Prose in replacement, replacement = \"vibehub-review (the old skills/vibehub-ticket-review/ folder is gone)\". BEFORE, with the 9cd8535 vh.mjs dropped in: ok:true valid:true. AFTER at HEAD: ok:false, retired[0].replacement: must be a bare lowercase kebab-case Skill name, not \"vibehub-review (the old skills/vibehub-ticket-review/ folder is gone)\".\n(b) A path in name, a second entry named \"../vibehub-ticket-review/assets/app-nowhere-else.js\". BEFORE: ok:true valid:true. AFTER: ok:false, retired[1].name: must be a bare lowercase kebab-case Skill name, not \"../vibehub-ticket-review/assets/app-nowhere-else.js\".\n(c) CONTROL, the identical sentence in reason instead. BEFORE: ok:false, skills/vibehub-core/contracts/skill-graph.json: Live reference to retired Skill vibehub-ticket-review (1 unexcused occurrence). AFTER: byte-identical failure. The fix widened no exemption.\n(d) A well-formed extra pair, {name: \"vibehub-nowhere-alpha\", replacement: \"vibehub-review\"}: ok:true valid:true, still passing.\nI also probed the grammar itself directly. /^[a-z0-9]+(?:-[a-z0-9]+)*$/ has no g flag, so no lastIndex state, and rejects a trailing newline, a leading newline, a carriage return, a trailing space, a zero-width space, a fullwidth character, a leading or trailing hyphen, a double hyphen, underscores, and any uppercase. The only strings that can occupy those two fields are [a-z0-9] tokens joined by single hyphens.\n\n2. SCOPE DISCIPLINE: CLEAN, and this is the strongest thing about the round. git diff --stat 9cd8535 0491fde is three files, 73 insertions, 0 deletions: the Evidence, +14 in vh.mjs, +37 in the test. I extracted each named function from both revisions and hashed them: parseJsonWithSpans (116 lines), nodeValue, contextSpans, contractSpans, blankSpans, isHistoricalRecord all byte-identical, and I added applyLegitimateSpans and consumeAllowances on my own initiative, also identical. The file walker and SKILL_SCAN_SKIP region diffs empty. The allowance shape rules are untouched: the 14 lines are inserted above \"const allowances = []\" and the rest of validateRetiredNames is unchanged. The contract file skill-graph.json is byte-identical. The fourth adjudication's instruction was followed exactly.\n\n3. NO REGRESSION. Representative sample across all four prior rounds, each re-run on the copy against the REAL repository rather than a fixture, each still failing correctly with real output.\nPer-occurrence accounting, an extra unnamed mention appended to the allowlisted docs/INSTALL.md -> ok:false, docs/INSTALL.md: Live reference (1 unexcused occurrence).\nContract-file scanning -> covered by (c) above.\nOpen Ticket stays live -> ok:false on a new open ticket carrying the name.\nTicket with a NON-successful Outcome stays live -> ok:false; a partial Outcome does not buy the historical exemption.\nDuplicate JSON key in a Context document, smuggling skills/vibehub-ticket-review/assets/app.js into a shadowed source.ref -> ok:false.\nDuplicate JSON key in the contract itself, a shadowed first \"reason\" -> ok:false on skill-graph.json.\nStale allowance, the excused line edited out of docs/INSTALL.md -> ok:false, retired[0].allowed_paths: docs/INSTALL.md no longer contains the excused text.\nBare-name allowance text -> ok:false, The excused text is no narrower than vibehub-ticket-review itself.\nOverlapping allowances cannot double-excuse -> ok:false on the second occurrence.\nSymlink whose target path names the retired folder -> ok:false on docs/probe-link/app.js.\nNUL byte in a script -> ok:false, does not hide the reference.\nCase variant skills/Vibehub-Ticket-Review/ -> ok:false, Case-variant reference.\n$-invocation of the retired name in a live SKILL.md -> ok:false, Retired Skill vibehub-ticket-review is invoked as $vibehub-ticket-review; use $vibehub-review.\nA dated META basename cannot buy an exemption -> ok:false. A non-Context file under .vibehub/rooms/ cannot claim the ref exemption -> ok:false, while a real kind:context source.ref is exempt (positive control, ok:true).\nParser agreement, spot-checked rather than re-run at 200k: I extracted parseJsonWithSpans, nodeValue and JSON_SIMPLE_ESCAPES into a standalone module and ran a seeded generator producing duplicate keys, __proto__ members, lone surrogates, surrogate pairs, every simple escape, \\u escapes, exponent and negative-zero numbers, and nested arrays and objects. REAL OUTPUT: agree 3000/3000. The expensive property established in round three still holds.\n\n4. ATTACKS ON THE NEW RULE ITSELF, with my ruling on each.\nA name that is valid kebab-case but names a Skill that never existed (\"vibehub-never-existed\") -> ok:true valid:true. ACCEPTABLE LIMIT, inherited and disclosed. It creates a no-op retired entry. Nothing is hidden by it: the entry's own span is the only thing exempted, and that span holds only the token the author typed.\nA name that is a substring of a live Skill name (\"vibehub-revie\") -> ok:false, loudly, on eleven files, because substring counting makes every occurrence of vibehub-review a hit. NOT A HOLE: it fails over-strictly and noisily, never silently. The reverse case, a superstring (\"vibehub-review-old\"), passes as a no-op. The Evidence's disclosed limit (b) is real but it is a false-positive direction, not a bypass.\nA retired name that equals a CURRENT Skill name (\"vibehub-review\") -> ok:false on eleven files. NOT A HOLE. I would prefer a dedicated error saying \"that Skill still exists\", but the condition is caught, loudly, and cannot pass.\nEmpty allowed_paths, and allowed_paths absent entirely -> ok:false with all eight real occurrences surfacing. Correct behaviour: dropping the allowlist makes the check stricter.\nDuplicate retired entries, the second with an empty allowlist -> ok:false. A byte-identical duplicate -> ok:true. ACCEPTABLE: entries are scanned independently, so a duplicate can only add failures, never remove them. Worth a uniqueness check some day; not a criterion failure.\nA replacement naming a Skill that does not exist -> ok:true valid:true, and the checker will print \"use vibehub-does-not-exist\" as its guidance. Likewise a replacement that is itself a retired name. ACCEPTABLE LIMIT, and the one I weighed hardest, because the commit's own first rationale is that guidance should be meaningful. But the rule enforces the SHAPE of a Skill name, not its existence, and the criterion's enforcement clause is entirely about the scan. This is a contract-quality gap, not a way for a retired name to reach a live reference. Recording it as a limit rather than a failure.\nCROSS-ENTRY ALLOWANCE LAUNDERING, my own attack, not on the assignment list: declare a bogus retired name and use ITS allowance to excuse a line that also carries a live path to the real retired Skill. BLOCKED. ok:false, docs/probe-x.md: Live reference to retired Skill vibehub-ticket-review (1 unexcused occurrence). Allowances are scoped per entry, so entry B's allowance consumes nothing for entry A. This was the sharpest shape I could construct against the remaining positional exemption and it does not work.\n\nWHAT THIS CHECK NOW PROTECTS AGAINST.\n- A retired name invoked as $name anywhere in the tree.\n- A ../<name>/ or skills/<name>/ path, or the bare name, in any Skill, contract, script, UI asset, test, doc, workflow, or Context document.\n- Any extra occurrence in a file that already holds an allowlisted one; exemption is per occurrence, and the count must match exactly.\n- An allowlist entry that has gone stale: the file is gone, the text is gone, or the count moved.\n- An allowance shaped into a blanket pass: the bare name, whitespace padding, a repeat, a multi-line span, a non-positive count.\n- An open Ticket, or one whose Outcome is not successful, treated as history.\n- A date-shaped basename, a META path, or any other filename claiming an exemption it was not granted.\n- A duplicate JSON key shadowing a live path, in a Context document or in the contract.\n- Case variants of the name, on any filesystem.\n- A NUL byte, a symlink target, or regex metacharacters used to hide or over-match.\n- The contract file itself, scanned like any other file, with only three narrow spans subtracted.\n- Arbitrary text parked in retired[].name or retired[].replacement: those two spans are now bounded to a bare kebab-case token, so the exemption is granted by grammar rather than by key position.\n\nWHAT WOULD STILL GET THROUGH.\n- A name spelled with JSON \\u escapes in a file that is not itself exempt: the scan reads raw bytes by design, so \"skills/\\u0076ibehub-ticket-review/assets/app.js\" passes. Reproduced at HEAD (ok:true) and on 9cd8535 (ok:true), so it is inherited from the round-three raw-byte design, not introduced here. A literal control in the same file fails, proving the file is scanned.\n- Any non-literal encoding: UTF-16LE, base64, a name assembled at runtime from fragments.\n- A name that names no Skill, or a replacement that names a nonexistent or itself-retired Skill: shape is checked, existence is not.\n- Duplicate retired entries: allowed, harmlessly.\n- A retired name that is a substring of a live Skill name: fails over-strictly rather than silently, which is noisy but safe.\n- Whatever a human writes in an allowance's reason. The shape rules and the count bound how much one entry excuses; nothing bounds whether the stated reason is honest.\n- Content under .git, node_modules, dist, coverage, test-results, and inside any directory holding a .git entry.\n- The three exemptions the criterion itself grants by name: historical records, Context source.ref and evidence[].ref, and explicitly allowlisted occurrences.\n\nWHY THIS IS SUCCESSFUL AND NOT A SIXTH ROUND. The criterion's enforcement clause is that skills validate fails when a retired name appears in a live reference, that exemption is per occurrence and never per file, that a stale allowance is itself a failure, that historical records are exempt structurally, and that no other exemption may be inferred from a path or filename. Every one of those is now true under attack, including in the contract file, which is where the last four rounds each found their hole. The residues above are of two kinds only: exemptions the criterion grants in its own words, and limits of literal-byte scanning that the criterion's own phrase \"a bare string\" does not reach. Neither is a structural exemption invented outside the criterion's list, which was the defect class that produced four partials. I looked for a fifth instance of that class, including one attack of my own devising, and there is not one. Closing.",
