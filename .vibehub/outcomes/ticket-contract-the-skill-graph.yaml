  "summary": "Independently adjudicated. graph-contract accepted: the $vibehub-* reference graph was re-derived from the checked-in Skill folders without using the tool under test and yields 22 directed references over 17 undirected pairs, which is exactly the undirected closure of the contract's 19 declared directed edges, with no reference unexplained and no edge unwitnessed; all 12 Skill folders are declared with entry kind; all 9 owned events were cross-checked against vibehub-review/references/ticket-lifecycle.json independently and every owner agrees. validation accepted: all six declared failure modes were triggered on throwaway Skill trees built for this adjudication and each exits non-zero with validation_error - unresolvable $vibehub-nowhere, an undeclared skills/vibehub-gamma folder, an orphan internal Skill with no inbound edge, an invokes cycle alpha -> beta -> alpha, a reference with no declared incident edge, and a declared edge witnessed by no reference - while the well-formed control and this repository both pass. no-runtime-role accepted: no SKILL.md cites skill-graph.json or the skills domain, validateSkillGraph performs no write and never touches .vibehub/, and the only .vibehub/ documents naming the command are this Ticket and its own Evidence, which is the acceptance record rather than a recorded output. retired-names-stay-retired is NOT accepted. Its two claimed guards do hold: a $-invocation of a retired name fails even inside an allowlisted file, and an allowance whose file no longer contains the name is itself a failure. But the criterion requires failure when a retired name appears in a live reference in the form of a $-invocation, a ../<name>/ path, or a bare string in Skills, contracts, scripts, UI assets, or tests, exempting only the enumerated historical classes and prose describing the retirement. The allowlist grants file-wide immunity to every live form except the $-invocation, so a real violation slips past it. Demonstrated on a pristine checkout of HEAD: appending the line '// live: read ../vibehub-ticket-review/assets/app.js at runtime' to the allowlisted scripts/measure-graph-layout.mjs - a scripts/ file, inside the criterion's enumerated scope, carrying a ../<name>/ path, which is one of the enumerated live forms and is not prose describing the retirement - leaves skills validate reporting valid:true. Five of the seven allowlisted paths carry the same exposure. A second, smaller gap: the implementation exempts classes the criterion does not grant. The criterion exempts .vibehub/evidence/, .vibehub/outcomes/, closed .vibehub/tickets/ and META/legacy-*; the code additionally exempts .vibehub/history/, any file under META/ whose basename begins with YYYY-MM-DD, and any META/ path with a legacy- segment at any depth rather than only at the top. The META dated rule is load-bearing here - META/09-ticket-runtime/artifacts/2026-07-30-ticket-m3-5-durable-decision-attestation.md passes only through it - and it is trivially abusable: on the same pristine checkout, a live spec written to META/09-ticket-runtime/2026-09-01-live-contract.md naming skills/vibehub-ticket-review/assets/app.js passes, while the identical content at live-contract.md fails. The good news is that the original defect class is still caught: an undated active META spec naming a retired folder fails, an open Ticket is live, and a Context source.ref subtraction leaves the same file's prose under the rule. Judgment on the disclosed calls. Asserting acyclicity over invokes edges only is legitimate: presents and routes encode the deliberate lifecycle loop through vibehub-review, the loop is governed by the lifecycle contract, and the cycle check still fires on a genuine invokes cycle. Scanning references across the whole Skill folder rather than SKILL.md only is legitimate and strictly stronger; it is what catches a $-invocation hiding in references/ or an agent prompt. Direction-blind reference-to-edge matching is a real loosening rather than a neutral choice: it is needed only because vibehub-distill documents its callers in its own description, yet it accepts a contract that declares a true edge backwards, and because acyclicity is asserted over the direction the contract states rather than the direction the tree witnesses, a reversed invokes edge is unverified. It is bounded today - every one of the 19 declared edges was independently confirmed to be witnessed in its declared direction as well - but it is a hole the tool cannot see. Constraints hold: the graph is not a router, a lifecycle, or dispatch state, and the declared graph is the post-rename post-absorb one. Repository state at adjudication: npm test 175/175/0, project validate valid:true, skills validate valid:true. Evidence corrections: evidence-retired-names-stay-retired overstates in claiming 'the allowlist is not a blanket pass' - it is a blanket pass for every live form other than the $-invocation, which is the hole above - and it presents the META dated-basename rule as a structural historical detector without disclosing that the criterion never granted that exemption class. Its file count of 1078 and evidence-skills-validate-failure-modes's identical 1078 are now 1082; evidence-skill-graph-has-no-runtime-role cites 297 Evidence documents where project validate now reports 301, and its claim that git status listed 'only the two files this Ticket adds' omits that the vh.mjs implementation had already been swept into commit 43978c5, whose message describes only the routing change.",
