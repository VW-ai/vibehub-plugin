y of the caller's input rather than something the operation destroys. bulk-absorption.md's Pass 4 instruction to 'carry the existing fields through' is the mitigation. Two honest qualifications: the executor's own description of the consequence is wrong - the state after a put that omits alignment is UNKNOWN with reason 'never aligned', which I observed directly, not COLD_START - and the residual sharp edge is real, because Pass 4 tells the Agent to re-put a Room purely to add a coverage_exception and the doc does not name `alignment` among the fields to carry, so an Agent following it literally can silently discard a valid stamp. Worth a one-line doc fix; it compromises no criterion. room_id must equal the last --room segment: acceptable, it mirrors the room-is-its-path discipline context put already enforces, and the guard fires with a clear message. A nested room's parent must exist: acceptable, it prevents orphaned subtrees and returns not_found. The extra `created` boolean: acceptable, the criterion asks for the envelope shape of context put and {ok,data} is unchanged; a widened data payload is additive and useful. The overlap error being invalid_input rather than validation_error: acceptable, because the criterion binds the message, not the code, and the message is identical; the code choice is defensible since the rejected input is the argument, not the repository, though a caller matching on code will see a difference from project validate. The no-room-delete Guardrail: it satisfies the first constraint rather than compromising anything. Evidence accuracy: the four Evidence documents are substantively correct and every quoted envelope I re-ran matched. Two are stale in counts rather than in claims - evidence-room-put-regression-coverage cites npm test 210/210 and evidence 310 against 218/218 and 322 now, and evidence-room-put-named-where-needed cites skills validate files_scanned 1118 against 1131 - all explained by the parallel Ticket landing in the same wo