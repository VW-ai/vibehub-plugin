  "summary": "Adjudicated independently at cd5591f by running the operation, not by reading the diff. room-write-operation: in a fresh initialised repo, `room put --room alpha` created the Room ({status:written, created:true}), a second put replaced it in place ({created:false}, description on disk changed to the new text), and an invalid document (empty description, stale as a string, an extra key) was refused with {ok:false, code:validation_error} listing all three faults. Nothing was written on rejection, proven twice rather than asserted: for the replace case the file on disk was byte-compared before and after and is unchanged; for a create case the target room directory was never created and `ls .vibehub/rooms` still showed only the pre-existing room. Validation runs before any filesystem touch. The envelope is the {ok,data} shape context put returns. overlap-checked-on-write: verified at SEGMENT granularity, which is the part that mattered because the shared helper moved under this operation from ticket-anchor-rooms-to-source-segments. With alpha owning docs/x.md#a, putting a new room onto docs/x.md#a was rejected with 'rooms gamma and alpha claim overlapping territory (docs/x.md#a); fuse or split them - two rooms must not own the same anchors' and the room was not created; putting a room onto the disjoint docs/x.md#b succeeded; and putting a room anchoring the prefix 'docs', which swallows alpha's segment, was rejected naming (docs). The message string is character-for-character the one repository validation emits, since loadRooms and room put are the only two callers of overlappingTerritoryMessage. project validate stayed valid:true throughout, so no rejected write left residue. documented-where-it-is-needed: vibehub-distill/SKILL.md step 4 now says to write the Room document with `vh.mjs room put --repo <root> --room <path> --input <room.json>`, explicitly 'never by hand-editing room.yaml', states the --room, room_id and parent rules, says the write stamps 