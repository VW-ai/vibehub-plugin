  "summary": "Adjudicated independently at HEAD 6e3c153 on a clean worktree; I re-ran the four baseline claims myself before judging: npm test 222 pass / 0 fail, project validate valid:true, skills validate valid:true (retired [vibehub-ticket-review -> vibehub-review]), git status clean. All four criteria accepted; all three constraints hold. detects-retired-folder ACCEPTED on my own throwaway install, not on the executor's. I built a project mimicking a skills.sh install (.claude/skills holding vibehub-core, vibehub-setup, vibehub-review plus a stale copy under the retired name; .agents/skills holding only the stale copy) and ran the command the way setup runs it, from inside the installed Skill's own directory: cd .claude/skills/vibehub-setup && node ../vibehub-core/scripts/vh.mjs skills retired --repo <project>. Real output: {ok:true, locations:['.claude/skills','.agents/skills','skills'], scanned:['.claude/skills','.agents/skills'], retired:[{path:'.claude/skills/vibehub-ticket-review', name:'vibehub-ticket-review', replacement:'vibehub-review', replacement_installed:true, reason:'...'}, {path:'.agents/skills/vibehub-ticket-review', ..., replacement_installed:false}]}. Both install locations reported, exact path and replacement in each. On the location list itself: setup's step 1 names no Skill install directory of its own — it inspects AGENTS.md, CLAUDE.md, docs/, .github/copilot-instructions.md, 'project-local skills' and memory folders as prose — and vibehub-setup contains no other enumeration, so there is no location setup inspects that the check misses. The three the check knows are corroborated by .vibehub/evidence/ticket-implement-npx-first-install-experience/skills-sh-e2e-both-hosts.yaml, which records .claude/skills and .agents/skills as the two directories npx skills add actually wrote, plus the vendored skills/ root this checkout itself has. Returning `locations` alongside `scanned` is what makes that claim auditable by the reader rather than assertable by the tool. reports-does-not-delete ACCEPTED against a filesystem snapshot, not against a reading of the source. I took name+size+mtime of every path in the project before the run and after it: byte-identical. The reported folders and their contents survived, no .vibehub/ was created (ls -a showed only .agents and .claude), and a second run produced output diff-identical to the first. The implementation is consistent with that: retiredSkillFolders() calls only readFileSync, existsSync, lstatSync and readdirSync, and persists nothing. No hook, watcher, or install-time daemon was added — the commit bf2eb1a touches only vh.mjs (+63), vibehub-setup/SKILL.md, docs/INSTALL.md, one new test file and the four Evidence files. quiet-when-clean ACCEPTED on both required shapes, built fresh by me. Replacement-only (the replacement folder in .claude/skills and .agents/skills, nothing retired): {scanned:['.claude/skills','.agents/skills'], retired:[]}. Never-installed (a bare directory holding one README.md): {scanned:[], retired:[]} — it does not create the directories it looked for and does not fail on their absence. This repository itself: {scanned:['skills'], retired:[]}. I accept the honest limit the executor stated rather than papering over it: 'no additional output' is finally an instruction to the Agent in SKILL.md prose, and the deterministic part is the empty list plus a test asserting the instruction's presence. That is the strongest form this system offers for a prose-driven Skill, and it matches the contract-layer convention already in test/skill-contracts.test.mjs. regression ACCEPTED. test/retired-skill-folders.test.mjs is new, modifies no existing test, and carries the three named shapes with assertions that match the criterion: retired-present asserts scanned is both locations and that the two entries carry exactly the paths, the replacement, and replacement_installed true then false in order; replacement-only asserts scanned is both locations and retired []; neither asserts scanned [] and retired []. Three further tests cover read-only-ness, this repository's own tree, and setup's prose. The executor's claim of an inherited defence is one I checked rather than took: test/skill-contracts.test.mjs really does regex every `vh.mjs <domain> <op>` cited in any SKILL.md and re-invoke it against a bare temp repository, failing on unsupported_operation / unsupported_domain / invalid_argument, so the new `skills retired` citation is genuinely covered there. CONSTRAINT 1 (never delete, move or rewrite inside an agent Skill directory) HOLDS — snapshot-verified above. CONSTRAINT 2 (no background check, hook or daemon) HOLDS — the diff adds a read-only operation invoked from step 1 of a workflow the user already ran; nothing else. CONSTRAINT 3 (retired names from the shared contract, not Skill prose) HOLDS, and I proved the mechanism rather than reading it. skills/vibehub-setup/SKILL.md contains zero occurrences of any retired Skill name (grep -c = 0), and a test enforces that for every entry in the contract. The operation reads fileURLToPath(new URL('../contracts/skill-graph.json', import.meta.url)) — the copy travelling beside vh.mjs — not the repo-relative path `skills validate` uses, which matters because a user project has no skills/ tree. My decisive probe: in the throwaway install I rewrote ONLY the packaged copy at .claude/skills/vibehub-core/contracts/skill-graph.json to declare a fabricated retired entry (zzz-fake-skill -> zzz-new-skill) and planted that folder. The next run reported .claude/skills/zzz-fake-skill and STOPPED reporting the two real vibehub-ticket-review folders that were still on disk. The list demonstrably comes from the packaged contract, and it works from an installed layout, not only from this checkout. ON THE DESIGN CHOICES I WAS ASKED TO WEIGH: neither oversteps. A separate `skills retired` rather than a fold into `skills validate` is not a preference but a necessity — `skills validate` reads the contract relative to --repo and validates the plugin's own graph shape, so it cannot answer inside a user project, which is the only place this question is ever asked. The extra fields are read-only projections that add no authority: `locations` vs `scanned` is precisely what lets a reader audit the 'every location it inspects' claim instead of trusting it; `replacement_installed` distinguishes a safe delete from one that would leave the user with neither Skill; `reason` is copied verbatim from the contract. None of them lets the operation do anything, and none introduces a second source of truth. EVIDENCE ASSESSMENT: honest, with one staleness to name. The four Evidence documents were written at bf2eb1a and quote 'tests 206, pass 206', 'files_scanned 1111', 'evidence 305', 'skills 12, edges 19'. At HEAD those are 222 tests, files_scanned 1147, evidence 332. The documents label the figures 'real output taken 2026-09-01' and say the evidence count precedes their own append, so they are historical rather than false — but a reader treating them as current numbers would be misled, and I record the current ones here. Every substantive claim I spot-checked held, including two that could easily have been decoration: the packaged-contract mechanism (probed above) and the skill-contracts inheritance (read above). The stated limits are real limits, honestly stated. ONE GAP I FOUND THAT THE EVIDENCE DOES NOT NAME: readdirSync(..., {withFileTypes:true}).filter(entry => entry.isDirectory()) is false for a symlink to a directory, so a retired Skill installed as a SYMLINK is not reported. I verified this live: .claude/skills/vibehub-ticket-review symlinked to a real directory returned {scanned:['.claude/skills'], retired:[]}. This is not a criterion failure — npx skills add copies folders, which is the shape the Ticket's own context describes and the only shape the recorded e2e evidence observed — but it is an unstated limit beside the one the executor did state (a host installing outside the three known locations is not covered). Worth a follow-up only if a host that symlinks appears.",
