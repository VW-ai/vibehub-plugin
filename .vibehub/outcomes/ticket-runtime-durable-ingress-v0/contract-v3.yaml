  "summary": "Independently accepts all five active criteria of exact Contract v3. durable-ack-boundary: source-owned immutable registration, attested origin and mapping bind strict RawEvent intake to opaque Project/producer authority; approved unchanged bounded UTF-8 bytes, digest verification and service-built capture authorization commit with first raw/normalized envelopes, exact registration/access/catalog/mapping/grant pins, cursor CAS and pending intent through the same DomainStore/ProjectActivation transaction. No receipt escapes before commit, and bounded rejection versus retryable failure categories do not expose rejected content. idempotent-redelivery: exact sourcePartitionKey uniqueness and authenticated observation IDs compose the accepted core fingerprint/idempotency/cursor operations; metadata-only retries preserve original receipts and all first pins without writes, conflicting identities/contents/ACL/sequence reject, same-object observations remain distinct, and out-of-order/unsequenced input never invents continuity or completion. delivery-state-machine: bounded pending inspection and original-epoch authenticated synchronous handoff atomically commit one durable consumer effect, immutable receipt and outbox ACK; repeat handoff does not rerun the callback, while errors/async/authority changes/process loss roll back. Neither path calls completeSourceEvent. The paired draft policy-journal retains leases/retry/dead-letter/operator replay obligations. fault-injection-proof: reviewer independently inspected all fixture/writer source and reran the final 26 deterministic ingress tests plus two offline fake-Judge composition tests, 28 passed. Real temporary Git/SQLite and separate child writers exercise exact bytes after restart, sanitizer canary rejection, first pins, retries/conflicts, actual SIGKILL before intake/handoff commit, lost response after commit, concurrent duplicate/conflicting admissions, exactly one effect, and disable races. The tighter capa