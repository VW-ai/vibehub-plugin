  "summary": "PARTIAL, re-adjudicated at 86cf036, replacing the partial recorded at db98153. Four of five criteria accepted. the-record-shows-who-judged, the criterion the prior adjudication left unresolved, is now genuinely met and I verified it by behaviour rather than by source text. closeout-skill-matches-the-engine moves the other way: it was accepted last time with a flagged hole, the executor claimed to close that hole, and I proved by mutation that it is still open.\n\nMETHOD. Everything below I executed myself on a disposable cp -R copy of the worktree; the worktree was never written. I read the two fix commits before probing so I could aim at what they claimed, then tested the claims rather than the diffs.\n\nWHAT I VERIFIED FIRST-HAND.\n(1) Data loss on apply is fixed and I reproduced the fix on real data. I re-applied the checked-in ticket-tighten-completed-dependency-hygiene unchanged on the copy. Its provenance went from ['conversation:2026-08-20-...', 'validation:ticket-fix-archived-stub-label-visibility'] to that same pair plus 'plan-validation:none'. The pre-existing validation: ref survived verbatim. The filter is now startsWith('plan-validation:'), so the two meanings no longer collide. I checked the new namespace is collision-free across the whole repository: 'plan-validation' appears only in vh.mjs, the plan SKILL.md, and two tests, and nowhere in .vibehub. I also checked no stale bare form survives: repository-wide, 'validation:independent' and 'validation:none' appear only inside historical Evidence and Outcome prose, in no engine, Skill, script, or test code. scripts/verify-plugin-artifact.mjs's two apply fixtures and two closeout fixtures carry the new declarations correctly. project validate on the copy: valid true, format_version 2, 103 tickets, 281 evidence, 90 outcomes.\n(2) The Log projection is really fixed, and I confirmed it the way the criterion asks rather than the way the test does. I built a repository, applied a Ticket, recorded Evidence, wrote a real Outcome carrying independence: {source: separate_session}, started the Workbench host, and called GET /api/trace over HTTP with a real token. The outcome record now contains independence: {source: 'separate_session', note: 'probe'} and its body reads 'Independence: separate_session (declared, unverified)'. I then confirmed the rendering half rather than assuming it: assets/app.js sets body.textContent = record.body for trace records, so that line reaches a human on the Log, which is exactly the surface vibehub-ticket-closeout step 5 sends a reader to. The checked-in YAML round-trips the field verbatim. Both halves of the criterion are met. Accepted.\n(3) The engine gate still behaves as specified. closeout with no declaration: {ok:false, error.code:'missing_independence'}, nothing under .vibehub/outcomes. Out-of-set source 'self': validation_error naming the three permitted values, nothing written. On a Ticket routed to CLOSE_OUT by complete Evidence, next_action was CLOSE_OUT before the refusal and CLOSE_OUT after it. apply with no validation declaration: missing_validation_declaration, zero ticket files written.\n(4) npm run verify on the copy: 147 tests, pass 147, fail 0, artifact ok at 67 files / 3,195,295 bytes. The executor's Evidence cites 3,194,128; the difference is their own later SKILL.md growth, not a defect.\n\nWHY closeout-skill-matches-the-engine IS NOW UNRESOLVED. Its three prose clauses are fully met: the Skill names subagent, separate_session, different_human, tells the Agent to state which it used, and tells it to stop, write no Outcome, and report which sources it tried when none is available. The criterion's fourth clause is that test/skill-contracts.test.mjs asserts the sources named in the Skill are exactly those the engine accepts. It still does not. The new extractor takes every backticked [a-z_]+ token in the SKILL.md and keeps those that contain an underscore or are literally the string 'subagent'. That filter already hardcodes one of the three answers it is meant to discover, and it is blind to any single-word source. I mutated the copy to prove both failure directions. Adding '- `colleague` - a bogus fourth source named only in the Skill' to the SKILL.md: the test PASSES. That is precisely the scenario the word 'exactly' exists to exclude, it is the scenario the prior adjudication named, and the commit message for 057d56c states 'a source named only in the Skill now fails', which is true only for underscore-shaped names. Adding an unrelated backticked identifier to prose, 'Read the `next_action` field first.': the test FAILS. So the check is simultaneously too weak to catch a real divergence and too brittle to survive ordinary editing of the document it reads. The engine and Skill sets do match today, so this is a guard defect, not a behaviour defect, and the fix is small: derive the candidate set from the bullet list that defines it, or assert the Skill contains each accepted source and no other member of the schema-adjacent vocabulary.\n\nDEFECT THE EXECUTOR SHIPPED WHILE FIXING, NOT DECLARED. The replacement test for the Log projection cannot execute the probe it claims to perform. It does 'const { buildUiTrace, loadRepository } = await import(vh-ui.mjs).catch(() => ({}))' and probes the projection only 'if (typeof buildUiTrace === \"function\" && typeof loadRepository === \"function\")', otherwise falling back to grepping vh-ui.mjs source text. vh-ui.mjs exports exactly three names: buildUiSnapshot, parseUiFlags, startVibeHubUi. buildUiTrace does not exist anywhere in the file and loadRepository is imported into it, not exported from it. I confirmed by dynamic import that both are undefined, so the guarded branch is dead and the fallback runs on every single run. The commit message claim 'the test builds a real Outcome and probes the projection instead of grepping source' is false for the projection half; it builds a real Outcome and then greps source. I demonstrated the consequence: I removed both the independence field and the Independence body line from outcomeTrace, leaving their text only in comments, and the test still reported a pass while /api/trace no longer carried the field. The behaviour is right and I verified it independently, so the criterion stands accepted; the guard supposedly protecting it does not exist. A working version is three lines: export buildUiSnapshot is already there, and traceRecords is reachable through startVibeHubUi's own HTTP surface, which is how I probed it.\n\nSTALE RECORD, RECORDED RATHER THAN WAVED THROUGH. 057d56c changed engine, Skill, and test code and appended no Evidence, so the Evidence backing this Ticket still describes the design as it was before adjudication. declaration-is-readable-and-projected, the sole Evidence for the criterion I am now accepting, still asserts 'The Workbench needs no separate change because vh-ui.mjs projects the whole Outcome document as outcomeRecord: outcome rather than an allowlist of fields' and cites a test asserting that structural property. That reasoning is the reason the criterion failed the first time, the executor's own fix contradicts it, and the test it cites was deleted in 057d56c. apply-records-whether-validation-happened still names 'a validation:independent or validation:none provenance ref', which the engine no longer writes. I accept both criteria on evidence I gathered myself, and note that a reader trusting the checked-in Evidence would be misled on both points.\n\nOTHER OBSERVATIONS. The no-write test is now honest: it gives the fixture Evidence, asserts next_action is CLOSE_OUT before refusing, refuses, and asserts CLOSE_OUT after, which is the criterion's actual clause rather than a Ticket's default routing. apply now validates the augmented document it is about to write, closing the gap where the injected ref bypassed validateTicket. plan SKILL.md step 7 really does document the declaration now, including the input shape, so the claim the earlier Evidence made prematurely is true at last. A rerun-idempotency assertion and a preserved-validation-ref assertion both exist in the suite now. Separately, and outside this Ticket's criteria: 86cf036 hand-edits ticket-split-migrations-into-mechanical-and-semantic.yaml, and that Ticket carries no plan-validation ref, which shows the apply seam records a declaration only for batches that actually go through apply. That is the seam the criterion asked for and I am not counting it against this work, but the honour system persists for anyone editing a Ticket file directly.\n\nCONSTRAINTS. All five hold. The three sources stay host-agnostic and only presence is checked. The declaration remains a self-declared claim with no principal, credential, registry, signature, or verifier, and the Log states 'declared, unverified' in the reader's face, which strengthens rather than weakens the provenance framing. acceptance-authority.md is untouched. The refusal costs two fields and leaves the Ticket at CLOSE_OUT, so no Ticket with complete Evidence is stranded. No service, daemon, runtime, or hidden state was added.\n\nTO CLOSE THIS TICKET: make the Skill/engine set check derive its candidates from the SKILL.md source list instead of an underscore heuristic; make the projection test call a real projection instead of a dead branch over a source grep; and refresh the two Evidence documents whose claims the fixes falsified.",
