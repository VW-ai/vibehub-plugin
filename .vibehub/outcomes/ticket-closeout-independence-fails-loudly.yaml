  "summary": "PARTIAL. Four of five criteria accepted; the-record-shows-who-judged is unresolved. The engine gate is real and behaves as specified, but the Workbench half of the readability criterion is only half built, and the change carries an unflagged data-loss defect on the apply path.\n\nWHAT I PROBED MYSELF (disposable cp -R copy, never the worktree). (1) closeout with no independence: envelope {\"ok\":false,\"error\":{\"code\":\"missing_independence\"}}, outcomes directory stayed at 89 files, no file for the Ticket, and ticket get still reported next_action CLOSE_OUT / authority_satisfying_evidence_complete on the real Ticket. (2) Out-of-set source \"self\" rejected as validation_error outcome.independence.source must be one of subagent, separate_session, different_human; an unknown key rejected as not allowed; independence:null rejected as must be an object; nothing written in any case. (3) ticket apply with no validation declaration: missing_validation_declaration, and the target ticket file's md5 was byte-identical before and after, so it writes nothing. With {independent:false} it recorded validation:none; with {independent:true}, validation:independent; a second identical apply produced exactly one validation: ref, so reruns do not duplicate. (4) project validate on the real read-only worktree: valid true, format_version 2, outcomes 89, tickets 103, evidence 281 - the pre-existing Outcomes all still load. The schema's required list is the original nine fields and does not contain independence; the source enum equals the engine's INDEPENDENCE_SOURCES. (5) I wrote an Outcome carrying independence on the copy and read the file back: the field round-trips into the checked-in YAML verbatim. (6) I started the Workbench host against the copy and called its own APIs.\n\nTAKEN AS GIVEN, NOT RE-RUN: the npm run verify aggregate (147 tests, 0 fail, artifact 67 files / 3,194,128 bytes). Everything else above I executed.\n\nWHY the-record-shows-who-judged IS UNRESOLVED. The criterion asks that a reader of the checked-in Outcome AND the Workbench projection of it can see the declared source. The first half is fully met - I verified the round-trip. The second half is met in only one of the Workbench's two Outcome projections. /api/subject's contextPackage.agentPayload.outcomeRecord is the whole Outcome document, and I confirmed by live probe that independence reaches it. But /api/trace, which is the Log, projects an Outcome through outcomeTrace() - an explicit field allowlist (kind, subkind, status, acceptedAcceptanceIds, unresolvedAcceptanceIds, occurredAt, summary, body, targets, agentPayload) - and I confirmed by live probe that independence appears nowhere in it, nor in its nested agentPayload. That matters specifically because vibehub-ticket-closeout step 5 routes the reader to exactly that surface: 'ask $vibehub-ticket-review to present the exact Ticket's Log'. A repository-wide grep also shows the string outcomeRecord occurs in exactly four places - its definition in vh-ui.mjs, two tests, and one Evidence summary - and in none of the front-end assets, so no rendered Workbench surface displays the declared source to a human at all. I am not marking this unresolved because the Evidence admits a dishonest declaration is indistinguishable; that admission is written into the criterion itself, which narrows the bar to presence and readability, and I accept that narrowing. I am marking it unresolved because the Workbench half of that narrowed bar is not met on the surface the workflow itself points at.\n\nThe test offered for this criterion is also weaker than the criterion. 'the declared independence source reaches a reader and the Workbench' asserts a regex /outcomeRecord:\\s*outcome\\b/ against vh-ui.mjs source text plus a regex against SKILL.md prose. It never constructs an Outcome, never calls a projection, and never asserts that any reader-facing output contains the field. It guards a line that no front-end consumes and would pass unchanged if the Log projection were the only surface that existed.\n\nCONSTRAINT 2 - JUDGED AND SATISFIED. 'Do not build an identity, permission, approval, or attestation system.' A required declaration field is an assertion, not an attestation system, and the difference is machinery. There is no principal, no credential, no registry, no signature, no verifier, no trust anchor, no revocation, and no state that outlives the document. The gate turns on document shape, not on who is calling: every caller is refused identically and every caller can satisfy it by typing a string, which is what distinguishes an input-validity requirement from authorization, where one subject is granted what another is denied. Nothing downstream branches on which of the three sources was named, so it confers no capability. I checked the evidence.origin precedent rather than accepting it, and it holds - and holds a fortiori. evidence.origin is a self-declared, unverified enum (agent|human) on a Git document that the engine reads with a bare default (evidence.origin ?? 'agent') and never checks; acceptance-authority.md then conditions a real adjudication decision on it, since human-authority criteria may be accepted only against origin: human Evidence. So the shipped product already lets an unverified self-declared provenance enum gate an acceptance judgment. independence.source is the same shape with strictly less consequence: it gates only whether a write is syntactically admissible. If evidence.origin is not an attestation system, this cannot be one. The Ticket's own context text draws the line in the same place. Constraints 1, 3, 4 and 5 also hold: three host-agnostic sources with only presence checked; acceptance-authority.md is untouched since f25a75d, well before this work; the rejection is resolved by adding two fields and leaves the Ticket at CLOSE_OUT for any independent Agent to close, so nothing is stranded; and the change adds no service, daemon, runtime, or hidden state.\n\nDEFECT FOUND, NOT DECLARED BY THE EXECUTOR - validation: NAMESPACE COLLISION AND SILENT DATA LOSS. ticket apply now writes {...ticket, provenance_refs: [...refs.filter(r => !String(r).startsWith('validation:')), validationRef]}. The validation: prefix was already in use in this very repository with an entirely different meaning: .vibehub/tickets/ticket-tighten-completed-dependency-hygiene.yaml carries 'validation:ticket-fix-archived-stub-label-visibility' and ticket-propose-legacy-proof-revision-policy.yaml carries 'validation:legacy-proof-migration-requires-human-policy' - provenance pointers to the Ticket that validated them. I reproduced the loss on the copy: re-applying the first of those Tickets unchanged replaced its existing validation: ref with validation:none, destroying checked-in provenance with no warning in the success envelope. Since apply is the normal path for updating an existing Ticket, any future re-plan touching those two Tickets erases that history. Also note the written document is never validated in its written form: validateTicket and loadRepository both run against the un-augmented input, so the injected ref bypasses validation. The augmented write also makes the two meanings of validation: indistinguishable to a reader.\n\nOTHER SHORTFALLS, RECORDED RATHER THAN WAVED THROUGH. (a) The no-write contract test asserts next_action stays 'EXECUTE' on a freshly applied Ticket with no Evidence - which is that Ticket's routing whether or not the gate exists. The criterion's clause is that a rejected closeout leaves next_action at CLOSE_OUT. I verified that behaviour by hand on a real CLOSE_OUT Ticket and it holds, but no test covers it, so the clause the criterion actually names is unguarded. I still accept the criterion, because the test obligation it spells out - 'proven by a test that asserts no file appears' - is discharged. (b) The Skill/engine welding test proves the Skill names every source the engine accepts, but computes named = accepted.filter(...) and compares to accepted, which can only establish containment in one direction; a fourth source named in the Skill alone would pass a test whose title claims 'exactly'. The sets do match today, and the schema-to-engine equality is a genuine deepEqual, so I accept the criterion. (c) No test asserts apply rerun idempotency, which the Evidence claims; I verified it by hand instead. (d) Evidence apply-records-whether-validation-happened states that 'step 7 documents the declaration and the recorded ref'. It does not. vibehub-ticket-plan step 7 shows the bare ticket apply command with no validation field and no mention of validation:independent or validation:none; only step 6 forward-references step 7. An Agent following the Skill learns the required input shape only by being rejected. (e) Criterion 2's compatibility handling is stated in the schema description and in code comments but nowhere in a contract document a reader would find first; the criterion asks only that it be stated, so I accept it.\n\nWHAT WAS DONE WELL, ON MY OWN INSPECTION. The call sites were updated rather than weakened. I read every changed test hunk: the format-mismatch negative tests still assert format_mismatch and still pass because assertCurrentProjectFormat runs before both new gates; the ui-host provenanceRefs assertion was tightened to ['test:ticket-vertical-slice','validation:none'] rather than relaxed; no expected error code was swapped for the new one. Read tolerance and write strictness are separated deliberately and correctly, and the 89 legacy Outcomes genuinely survive. The gate is placed before validation and before any write, so the refusal is total.\n\nFOLLOW-UP THIS OUTCOME LEAVES OPEN: (1) close the-record-shows-who-judged by carrying independence through outcomeTrace and rendering it on the Log, with a behavioural test that constructs an Outcome and asserts the field in the projection output rather than a regex over source text; (2) fix the validation: namespace collision - a distinct prefix, or a filter narrowed to the two exact literals, and a test that a pre-existing validation:<ticket-id> ref survives an apply.",
