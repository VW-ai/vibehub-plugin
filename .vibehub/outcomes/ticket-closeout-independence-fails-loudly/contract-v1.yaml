  "summary": "PARTIAL, fourth adjudication, replacing the partial recorded at 14d9e3e. Four of five criteria accepted. closeout-skill-matches-the-engine remains unresolved, for a materially narrower reason than any prior round: the mechanism is now genuinely behavioural and survives eleven of the thirteen mutations I aimed at it, but the fix that built it deleted two live assertions without replacement and shipped a sentence in the Skill that states the opposite of what the test does.\n\nMETHOD. I did not implement this work and hold no execution context. Every claim below I ran myself on a disposable cp -R copy at scratchpad/vh-copy; the worktree at scratchpad/vh-plan was never written except by this Outcome, and I confirmed git status --short on it was empty before and after every mutation batch (the copy inherits the worktree's .git pointer file, so I checked rather than assumed that git resolved to the copy's own root - it did). Baseline on the copy: node --test test/skill-contracts.test.mjs 8 pass 0 fail in 2.5s; npm test 147 pass 0 fail in 29.6s. I skipped verify:artifact as slow and not load-bearing for any criterion here, so the executor's artifact claim is unverified by me; the 147/0 test claim I reproduced exactly.\n\nTHE EXECUTOR'S FIVE CLAIMS, CHECKED ONE BY ONE.\n(1) INDEPENDENCE_SOURCES is exported and imported, not regexed. TRUE. vh.mjs:592 exports it; skill-contracts.test.mjs:186 does await import() of the real module and spreads the Set. No regex over vh.mjs source survives in that test.\n(2) The Skill delimits its declared list between markers. TRUE, and load-bearing: deleting both marker lines fails the test (7/1), and moving the subagent bullet outside the region fails it (7/1).\n(3) Both halves are behavioural. TRUE. I probed the engine directly and confirmed the shape the test relies on: a declared member reaches validateOutcome and clears it, then stops on the pre-existing rule \"Accepted criterion has no referenced Evidence: works\"; an out-of-set value stops earlier at path outcome.independence.source, \"must be one of subagent, separate_session, different_human\". So the two loops really do observe different engine behaviour.\n(4) Mutation-checked against the predecessor's exact escape. TRUE. Widening the validator to accept self_review without touching the constant - if (independence.source !== \"self_review\" && !INDEPENDENCE_SOURCES.has(...)) - now fails (7/1). That is the escape that let the whole suite pass at 14d9e3e; it is closed.\n(5) Stated limitation: the probe list is a net, not a proof. TRUE, and I confirmed both halves of it by mutation. Widening the validator to peer_review, a value on neither the probe list nor the Skill, escapes: 8 pass 0 fail. Naming a bogus source in the Skill's prose outside the region escapes: 8 pass 0 fail.\n\nMUTATIONS THE EXECUTOR DID NOT RUN. Thirteen in total; eleven fail correctly. Caught: delimiter markers removed; a declared bullet reformatted from \"- \" to \"* \"; a bogus fourth source added as a proper bullet inside the region; a source removed from the region; the subagent bullet relocated outside the region; the constant widened without the Skill; the validator NARROWED to refuse different_human (this is the one that proves the accepted-members half is not decoration); sourceRejected forced to always true; sourceRejected forced to always false; the missing_independence gate disabled; the independence line dropped from outcomeTrace. Escaped: peer_review validator bypass, and a bogus source named in prose.\n\nIS THE \"EVERY MEMBER IS ACCEPTED\" HALF VACUOUS? NO, and I checked the specific way it could have been. sourceRejected is result.ok === false && some error at path outcome.independence.source, so a member \"passing\" only means it was not refused at that path - and every member probe does in fact fail overall, on the unrelated evidence rule. That would be vacuous if nothing forced the probes to reach the validator at all. The others loop is what forces it: those same inputs, differing only in the source string, must produce that exact error path, so a fixture that never reached validateOutcome would fail the test loudly. Forcing sourceRejected to a constant fails in both directions. Narrowing the validator to refuse different_human is caught by the members loop alone. The half is real, though weaker than it could be: it never asserts an Outcome is actually written, only that the source cleared its gate.\n\nDOES EXPORTING THE CONSTANT COUPLE OR BREAK ANYTHING? NO. vh.mjs already exports seven other bindings and guards its CLI behind a realpath check on process.argv[1], so importing it from a test does not execute the CLI; test/ticket.test.mjs already imports from it. Full suite 147/147 green with the export in place. No new seam.\n\nWHY closeout-skill-matches-the-engine IS STILL UNRESOLVED. The three prose clauses hold. On the fourth - \"test/skill-contracts.test.mjs asserts that the sources named in the Skill are exactly those the engine accepts\" - the honest assessment is that the declared-list half is now met and the document-wide half is not, and that the fix papered over the gap in the one place a reader would look.\n(a) THE SKILL SHIPS A FALSE STATEMENT ABOUT THE TEST. SKILL.md now says, immediately under the delimited list: \"This list is the whole set. No other value is accepted, and naming one anywhere else in this document is a defect the contract tests catch.\" The second clause is false in both readings, proven by mutation on the copy. Adding the prose sentence \"Or use `self_review` when alone.\" leaves the suite green (8/0). Adding \"When in doubt prefer `subagent` over `separate_session`.\" also leaves it green (8/0). The Evidence records this same gap as an honest limitation in the same commit in which the Skill asserts the opposite. I weigh that as a defect rather than a rounding error precisely because this criterion is about the Skill and the test agreeing about the source set: a maintainer who reads that sentence will believe a guard exists that does not, which is how the previous three rounds' escapes were built.\n(b) THE FIX DELETED TWO LIVE ASSERTIONS FROM THIS EXACT TEST AND REPLACED THEM WITH NOTHING. 7068be4 removed assert.deepEqual(schema.properties.independence.properties.source.enum.sort(), accepted) and assert.ok(!schema.required.includes(\"independence\")). Nothing in test/ reads outcome.schema.json any more, and vh.mjs loads only versions.json and dependency-hygiene.json at runtime, so that schema is now unguarded documentation. Proven: I replaced the schema's independence enum with [\"bogus_source\"] and ran the FULL suite - 147 tests, 147 pass, 0 fail. Before this commit that mutation failed. The contract the criterion \"declaration-has-a-defined-home\" is about can now drift from the engine silently.\n(c) The residual peer_review escape I do NOT count against the criterion. A targeted literal bypass inside the validator cannot be caught by any finite black-box probe list, and the executor states that bound plainly rather than claiming coverage it lacks. That limitation is honest and correctly scoped. It is (a) and (b) that keep this unresolved, and both are cheap to close.\nTO CLOSE THIS: delete or correct the false sentence in SKILL.md - it is one line, and the Evidence already contains the true version of it; harvest the declared list from any \"- `token` - \" bullet in the whole document rather than only inside the region, so a source-shaped declaration in prose is compared to the engine like any other; and restore the two schema assertions, which cost two lines and guard a criterion already accepted.\n\nEVIDENCE ACCURACY. source-check-is-behavioural-on-both-sides is accurate in every falsifiable claim, including its stated limitation, which I reproduced rather than took on trust; it is the most honest record in this ticket's history and I say so. But independence-field-has-a-home-without-breaking-history is now STALE AND FALSE in one clause: it says \"The contract test asserts the schema enum equals the engine's INDEPENDENCE_SOURCES set and that independence is not in required.\" Both assertions were deleted by 7068be4 and the Evidence was neither superseded nor corrected. That is the same failure mode - a fix invalidating a checked-in Evidence claim and leaving it standing - that 6f58c8e was written to repair one round ago. I am accepting declaration-has-a-defined-home anyway, because I verified the criterion's actual substance first-hand rather than through that Evidence: outcome.schema.json carries an explicit independence object, additionalProperties false, required [\"source\"], enum of exactly the three sources, absent from the document's required list, with the compatibility reasoning written into its own description; and project validate on the real repository loads all 90 Outcomes valid, most of them without the field. The criterion is met; its Evidence lies about how it is guarded, and that correction belongs on the record.\n\nTHE OTHER THREE, RE-CHECKED FIRST-HAND.\nengine-requires-a-declared-independence-source: probed directly on the copy - closeout with no independence returns code missing_independence and writes nothing; an out-of-set source returns validation_error at path outcome.independence.source naming the three permitted values and writes nothing. Disabling the gate fails the contract test (7/1). Accepted.\nthe-record-shows-who-judged: deleting \"independence: outcome.independence ?? null\" from outcomeTrace fails the test (7/1), so the projection the closeout Skill sends a reader to is welded. Accepted, consistent with the third adjudication.\nvalidate-path-states-the-skip: renaming the missing_validation_declaration error code fails the contract test (7/1); apply refuses an undeclared batch and records plan-validation:independent or plan-validation:none. Accepted.\n\nCONSTRAINTS. All five hold. The three sources stay host-agnostic and only presence is checked; nothing verifies the claim and the Log says \"declared, unverified\" to the reader's face; acceptance-authority.md is untouched; the refusal costs two fields and leaves the Ticket at CLOSE_OUT; no service, daemon, runtime, or hidden state - the only surface change in these two commits is one constant becoming an export of a module that already exported seven bindings.",
