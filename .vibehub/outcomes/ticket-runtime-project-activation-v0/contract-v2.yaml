ewer temporary-Git/SQLite probes passed switch-kind denial, stable no-op, callback revocation rollback, membership-change rollback, all-stage old-epoch fencing, immutable transition sources, backward display-clock behavior, Project isolation and disabling unavailable enrollment without Git-inspection permission. All fourteen Context refs resolve, exact Git prerequisite Outcome is successful, governing authorities are empty, context guard and Ticket validation pass, and git diff --check is clean. No remaining blocker. This accepts a bounded local switch/admission API plus executable synthetic cancellation/recovery protocol, not a live coordinator, Collector, model/host cancellation, production queues, backfill, UI or end-to-end activated product. External sends already started cannot be recalled, delivery intent is not receipt, source ACLs and Worker attempt fences remain separate, and consumers must integrate the epoch gate at their actual boundaries.",
