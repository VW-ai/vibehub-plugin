  "summary": "Independently adjudicated at commit a0b0f442c64daa9c95df1ee2893b08e63c1b3557 (Evidence 926ea60cf41ff025b17a3ee1d28e0ee572f42526) by rebuilding the binary and re-running every proof rather than reading the executor's summary. All five criteria accepted. URI CONTRACT: plutil on the freshly assembled bundle prints CFBundleURLTypes with exactly one scheme (CFBundleURLSchemes.0 = vibehub, CFBundleTypeRole = Viewer) and the plist lints OK; AppDelegate registers kInternetEventClass/kAEGetURL in applicationWillFinishLaunching and reads keyDirectObject as the only entry. DeepLink has exactly three stored properties - repoRoot, ticketId, view - so 'no parameter may express a write' is a property of the type, and the suite fails the compiled Swift on any write path (vh.mjs, ticket apply, file writing, an HTTP method on a URLRequest). I drove 23 refusals through the rebuilt binary myself - unknown scheme, vibehub://apply and vibehub://write, mutate=1, delete=true, write=yes, token, a repeated parameter, a fragment, credentials, a port, relative and traversing repo paths, view without ticket, view=EXECUTION, a non-canonical and a traversing ticket - and every one was refused at stage uri with hostStarted false and no repo reported. NAVIGATION ONLY IN THE LIVE PATH: FocusedSessionURL rewrites the query of the already-authorized session URL and never assigns scheme, host, or port; the probe reports focusFragmentPreserved true, so the bearer fragment survives untouched. NavigationPolicy.swift is untouched by this commit and still denies file:, data:, vibehub:, and any non-session origin. FLOWS: I reproduced all four §9 resolutions over the rebuilt binary - focus-current-session (no prompt), open-known-repository (no prompt), confirm-first-use (requiresConfirmation true, buttons Open Repository / Cancel), and confirm-switch (requiresConfirmation true, buttons Switch Repository / Stay Here, detail naming both worktrees) - and confirmed a repository already in recents still asks when a session is open on another, because the question is about the window being read. The repository is validated by GitMetadata.readSession before anything is focused, opened, or asked. In a real WKWebView, --probe-render --deep-link navigated to ticket-beta/contract with focusedQuery 'ticket=ticket-beta&view=contract', origin 127.0.0.1, assets only /app.css and /app.js, fileNavigationDenied true. MISSING TICKET: --probe-render with an absent Ticket opened the repository and rendered its graph (nodes 2) with ticketPresent false and navigated false, reporting the shared MissingTicketStatement the window sheet also uses. The launcher's own validation is NOT weakened - I confirmed behaviourally that startVibeHubUi still throws 'Unknown Ticket for --ticket', and vh-ui.mjs, vh-workbench.mjs, test/workbench-launcher.test.mjs, test/session-watch.test.mjs and test/ui-host.test.mjs are all untouched by a0b0f44. NO MUTATION: I hashed this worktree's whole .vibehub tree, drove 23 valid and malformed deep links through the binary, and hashed again - identical (sha256 bb7829937ba4dd374b9f77282508f8216b9eb842c66ed36b72028468326f7ef9), with git status --short -- .vibehub empty before and after; both live WebView probes left the fixture's .vibehub byte-for-byte identical. SUITES: npm run verify reports 77 tests, 77 pass, fail 0, and artifact ok with no apps/ directory and no .swift file; the deep-link file alone is 13/13. One earlier full-suite run showed a timing flake in test/session-watch.test.mjs ('invalid YAML keeps the last valid snapshot'), which passed 3/3 in isolation and cleanly on re-run; it belongs to an already-closed Ticket and is untouched by this commit. REGRESSION GUARD PROVEN LOAD-BEARING: the first defect - an application-modal NSAlert raised at launch that answered itself and opened a first-seen repository unasked - was precisely a violation of explicit-repo-switch-confirmation. I reintroduced it in a scratch mutation of AppDelegate.swift and the test 'both confirmations are real prompts the user has to answer' failed, then restored the file clean, so the committed state cannot silently regress to it. The isReleasedWhenClosed = false fix is present in both window controllers and asserted. HONEST LIMITATIONS CARRIED FORWARD: GUI automation is denied in this environment, so neither confirmation sheet nor the missing-Ticket sheet was ever clicked or seen on screen. This does not defeat any criterion: no criterion requires a screenshot, the safety-relevant negative half (nothing opens or switches while the question is unanswered) is proven, the wording is proven through shared statement types printed by headless probes so the sheet and the probe cannot drift, and the affirmative branch calls the same open() that the known-repository and picker flows exercise end to end. The residual unproven step is only AppKit's mapping of .alertFirstButtonReturn to the first added button. The inspector's Copy-deep-link affordance was deliberately not built; it is named only in the Ticket's prose context and by no acceptance criterion, test/ui-host.test.mjs is untouched and expects nothing of it, and I confirmed no half-built vibehub:// affordance exists anywhere in the shared frontend.",
