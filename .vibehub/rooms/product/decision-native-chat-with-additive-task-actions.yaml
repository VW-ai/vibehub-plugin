  "detail": "Ordinary Chat remains a first-class native DSH experience rather than being forced into the VibeHub Task protocol. VibeHub should enrich that experience at moments where discussion becomes durable knowledge or executable work: finalized Assistant answers may expose lightweight actions such as Remember, Plan, Create Task, Attach to Task, Compare, or Bring Back, and richer follow-up state may render inline beneath the owning turn. The exact labels, confirmation flow, scope picker, and distinction between DSH plan mode and VibeHub work planning are deliberately deferred for later interaction exploration. The implementation must use official additive Chat surfaces rather than DOM injection or replacement of the Conversation renderer. At DeepSeek Harness rc.8 commit 141eb6fef83422698aef7a981029e843e8161534, conversation.chat.assistant-actions is a session-scoped list Slot receiving the finalized assistant messageId and rendered between Copy and Branch; conversation.chat.turnTail is a chain Slot for richer whole-row content before the action strip. The shipped ui-message-feedback plugin proves the complete browser action plus Host Remote pattern, while the standard Session kit supplies session identity. A Host action can therefore resolve authoritative Session history from sessionId and messageId, prepare a VibeHub Context or Task proposal, and return reviewable state without scraping rendered text. This is assessed as high feasibility. The current assistant-actions Slot appears only on the closing finalized Assistant message of a completed Turn; extending identical actions to user messages would require another supported Slot or a separate upstream change and is not assumed here.",
