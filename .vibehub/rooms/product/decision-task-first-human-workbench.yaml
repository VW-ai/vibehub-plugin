  "detail": "The primary user-facing unit is Task. The checked-in canonical object may continue to be named Ticket internally for compatibility, but ordinary product language should say Task because it is understandable outside software teams. Chat remains important as a native, unconstrained way to explore, clarify, branch, compare, bring back, and steer work, yet it is not the product's durable center: a conversation may become a Task, attach to a Task, or remain temporary. The home surface is the Task graph, and selecting a Task opens its execution workspace, where the user can start work, understand what the Agent is doing, inspect progress and evidence, intervene, approve, retry, or close it. Agent execution is expected to occupy most of the lifecycle without continuous conversation. Project is domain-general rather than synonymous with a repository or software feature, so research, job search, operations, writing, and mixed human-plus-script work can use the same model. The near-term product should ship as a personal workbench, while keeping these same human-facing objects suitable for a later collaborative service.",
