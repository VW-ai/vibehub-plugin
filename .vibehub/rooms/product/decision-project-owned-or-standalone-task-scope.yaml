  "context_id": "decision-project-owned-or-standalone-task-scope",
  "detail": "A Task normally belongs to one Project, and a Project is a first-class human work scope containing its Task graph and project-level Room tree. A Project need not be a code repository or a development effort. A temporary or standalone Task may have no Project, just as a chat may exist outside a GPT Project. A Task may have child Tasks: a child is a real executable Task with its own lifecycle, Context, Evidence, and Outcome, whereas a checklist item is only local prose; parent-child containment is distinct from dependency. One ordinary Task must not silently become multi-owned across Projects. Cross-project work should be represented explicitly by a coordination Task plus project-owned child or related Tasks and explicit Context references. Outcome writeback defaults to the owning Project and does not mutate Context merely because that Context was read from elsewhere. Context therefore has project-level scope by default, with optional personal-level Context as a later layer analogous to user-level configuration; team-level Context can be added with collaboration. The first DSH Plugin slice may remain single-Project and omit personal Rooms, cross-project coordination, and team semantics.",
