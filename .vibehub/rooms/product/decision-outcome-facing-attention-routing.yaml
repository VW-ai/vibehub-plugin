  "context_id": "decision-outcome-facing-attention-routing",
  "detail": "VibeHub's long-term interaction model is a consumer-grade conceptual simplification of Linear for ordinary people, non-technical teams, and everyday work. The user should express what they want completed in normal language and primarily see outcomes, useful progress, and the few moments that require their judgment, permission, input, or intervention; they should not need to understand Ticket graphs or manage execution objects. Internally, a Ticket remains the stable bounded contract that carries Context, authority, acceptance, dependencies, Evidence, and Outcome, while Agents, models, chats, repositories, tools, and human collaborators are replaceable execution resources. VibeHub routes work outward to the right executor, watches its bounded lifecycle, and pulls it back into the user's attention only at a real boundary or when completion is ready. Over time this attention-routing role may coordinate a person's projects, small teams, collaborators, and personal actions across software and non-software domains. The intended 2C product is therefore closer to an outcome-oriented todo and personal action system than a visible issue tracker, while retaining the rigorous action contract underneath. This decision refines the earlier Ticket-led Agent direction: Ticket remains canonical but is no longer required to be the user's product-level mental model.",
