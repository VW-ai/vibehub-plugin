{
  "context_id": "decision-inbound-issue-closes-into-its-mirror",
  "detail": "GitHub Issues are a one-way projection of the Ticket graph, so once an outside-filed Issue has been planned into a Ticket, that Ticket produces a mirrored Issue of its own and the same subject exists twice. The rule: the inbound Issue is closed, with a comment pointing at the mirrored Issue that now carries the work; the original stays readable as the proposal and its discussion, and the mirror becomes the live record. The alternatives were leaving the inbound Issue open as a discussion thread, which accumulates silent duplicate pairs, and retrofitting the mirror's hidden marker onto it, which would make the projection adopt a document it did not generate. The owner further decided that this is not a convention to remember but behavior to implement: handling a non-standard, outside-filed Issue on its way into the system belongs inside VibeHub, so intake performs the close-and-point step rather than an Agent improvising it each time. The writes land on Issues in the owner's repository under the owner's account, so intake proposes and a human authorizes; the rule removes the question of what to do, not the authorization.",
