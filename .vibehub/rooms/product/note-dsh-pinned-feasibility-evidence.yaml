  "detail": "The feasibility report records DeepSeek Harness rc.7 at 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca as the executed runtime baseline, including isolated bundle/profile boot on port 31807, client-slot rendering and shutdown. Its matrix separates source-proven facilities from executed checks: plugins/bundles, theme/client extensions, session state and host events, graph/run tabs, overlays/fork and task-to-session association. Unknown durable event types still need a registered schema or ignorable/replay policy; a successful boot alone does not prove restart compatibility. The initial Codex process path is one-shot and does not establish resume, streaming progress or approval transport. A narrow replaceable adapter should carry session association, context handoff, observed lifecycle, evidence proposal and restart recovery without copying executor internals. Later rc.8 commit 141eb6fef83422698aef7a981029e843e8161534 source checks found nine extension seams including assistant-actions and turnTail, but the fresh source boot was unfinished. rc.7 runtime evidence and rc.8 source evidence must remain separate. No production host replacement, durable-event commitment or direct Agent execution follows from this historical spike. The exact original seam matrix, source locations, smoke checklist and stop conditions remain in the pinned report and existing spikes/deepseek-harness artifacts.",
