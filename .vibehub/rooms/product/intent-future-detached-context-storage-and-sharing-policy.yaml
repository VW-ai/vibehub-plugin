  "context_id": "intent-future-detached-context-storage-and-sharing-policy",
  "detail": "After the single-repository Codex-first product is useful in daily work, VibeHub may explore detaching durable Context from one Git working tree through an explicit local storage layer, enabling multi-folder or cross-repository views without making hidden state authoritative by accident. That exploration must separately decide identity, migration, export, deletion, conflict, recovery, permission and Git interoperability before any database becomes canonical. A nearer optional policy may let a user choose whether VibeHub documents remain local-only or are shared through ordinary Git push, but the product must distinguish storage policy from synchronization outcome and must never silently edit ignore rules, commit or push. Research into existing Git/context integrations for DeepSeek Harness may inform the later adapter, but it is deferred and does not gate the Codex-first shell. None of these future directions authorizes a database, cross-folder Context activation, automatic Git mutation or a new active implementation Ticket in v1.",
