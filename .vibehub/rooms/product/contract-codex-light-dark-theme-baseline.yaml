  "context_id": "contract-codex-light-dark-theme-baseline",
  "detail": "The first production theme baseline uses the owner-provided Codex values, not an approximate Graphite palette. Light mode uses accent #0169CC, background #FFFFFF, foreground #0D0D0D, Inter UI typography, an opaque sidebar, and reference contrast 45. Dark mode uses accent #339CFF, background #181818, foreground #FFFFFF, Apple system UI typography, a translucent sidebar where the host supports it, and reference contrast 60. These are primitives rather than permission to paint the application blue: accent is reserved for selection, focus, links and primary actions; canvas, sidebar, raised surfaces, borders, hover, muted text, code surfaces and disabled states are derived as a coherent neutral semantic scale and must meet accessibility contrast. Web translucency must have a readable opaque fallback; native material may be added only by a desktop wrapper. Light and Dark are equal product modes with system preference and explicit override. The production result should feel almost the same as Codex at the baseline interaction level while VibeHub Task surfaces use the same tokens rather than introducing a second visual language. Linear remains a secondary hierarchy and density reference, not a competing palette or brand.",
