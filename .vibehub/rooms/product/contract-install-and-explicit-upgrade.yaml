  "detail": "The supported installation path is npx skills add VW-ai/vibehub-plugin. Install every required Skill, including vibehub-core, which contains shared scripts, schemas and templates; missing core is repaired with npx skills add VW-ai/vibehub-plugin -s vibehub-core. Skills.sh copies Skill folders, so installed behavior cannot depend on repository docs, a global CLI, npm-registry VibeHub package or a daemon. Node 20 or newer and Git are required. Host marketplaces are retired; retained plugin metadata is not a supported marketplace distribution. Setup inspects the exact repository for existing knowledge and follows the user-selected VibeHub-only or explicit dual-write arrangement. It keeps new records local and never silently enables GitHub publication. Code version and checked-in data format are separate. CURRENT can be written; MIGRATION_REQUIRED requires an explicit declared upgrade; UNSUPPORTED_NEWER fails visibly. An update uses the same immutable release tag for npx skills add https://github.com/VW-ai/vibehub-plugin/tree/<release-tag> and the release asset https://github.com/VW-ai/vibehub-plugin/releases/download/<release-tag>/vibehub-upgrade.tgz. A floating skills update followed by an unrelated upgrader does not establish that pairing. The one-shot upgrader receives bounded explicit roots and enumerates registered worktrees. Current worktrees are no-ops. Only attached, reachable, writable, completely clean worktrees without an in-progress Git operation and with a recognized migration chain qualify for mechanical changes. Preview twice at the same HEAD, require identical allowed paths and a valid target, recheck HEAD/status, then materialize through a compare-and-swap ref update. Never stash, reset, checkout, push or invoke arbitrary repository hooks to manufacture eligibility. Prove restoration before reporting a failed pre-commit attempt as safely pending; recovery_failed stops rather than continuing. Once the terminal ref update succeeds, report migrated rather than pretending a rollback occurred. Every unsafe, malformed or newer worktree receives a precise skip/pending reason. Semantic enrichment runs later in that worktree with the release guidance; the mechanical half alone leaves a valid writable project. Uninstall removes the user-selected installed Skill folders; historical renamed folders require explicit cleanup and must not coexist silently as duplicate entrypoints.",
