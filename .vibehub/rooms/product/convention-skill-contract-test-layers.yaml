  "context_id": "convention-skill-contract-test-layers",
  "detail": "Systematic, state-machine, or cross-skill content is never written as prose in more than one skill: it lives in exactly one checked-in contract or shared reference (the pattern set by ticket-lifecycle.json) owned by one skill, and every other skill keeps a single pointer line. Testing follows a three-layer pyramid. Unit: deterministic script and schema behavior in vh.mjs and contracts, model-free and millisecond-fast. Contract: model-free assertions that weld prompt text to system reality — an event name appears only in its owner's SKILL.md, every vh.mjs invocation a skill cites resolves to a real domain and operation, required contract pointers are present. This layer tests whether what a prompt says about the system is true, and its absence caused real drift (a stale context put example after --room became required; a verification script failing at runtime). E2E: a real agent executes the skill and an independent agent adjudicates the result — testing a skill itself is e2e by definition, today practiced socially as independent validate and closeout agents per ticket. The thicker the contract layer, the less the expensive e2e layer must cover: e2e should be left with pure judgment, never mechanics.",
