  "detail": "The default application landing is lightweight Codex Chat, not the Task Graph. This revises only the home-surface clause of the earlier Task-first workbench direction: Task remains VibeHub's durable work unit, but Chat and Task must never be presented as the same object or share ambiguous labels. Chat is a Human-led conversational Context Space; Task is a durable Agent-led execution Context with an Outcome and stopping contract. From Chat, a Human can search for and go directly to an existing Task, or later use explicit Chat-to-Task actions. Global search is first-class and searches at least Codex Threads, VibeHub Tasks and durable Context while visibly grouping or labelling every result type so navigation never collapses their semantics. Task activity returns to the Human through a native-feeling attention system: a small bell/inbox and a restrained sidebar attention area surface completion and Needs You boundaries, with a flowing recent-activity presentation rather than making the Task Graph the default landing. The owner proposed a quiet two-signal treatment such as blue for completed work and red for required intervention; the exact color, badge, priority and aggregation rules remain an interaction-research question, not an approved visual contract. Ordinary Running progress should stay calm and inspectable rather than generating notification noise. The intended result feels native to Codex, keeps interaction simple, and lets a user begin chatting immediately while important Tasks can still reclaim attention and open at their exact Context.",
