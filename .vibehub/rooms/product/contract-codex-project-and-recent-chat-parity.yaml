  "context_id": "contract-codex-project-and-recent-chat-parity",
  "detail": "For the Codex carrier, VibeHub must preserve the ordinary Codex information architecture and supported operations for Projects and chats: Project creation and navigation, moving or dragging a chat into and out of a Project, forking a chat while preserving provenance, and a Recents section that includes chats with no Project membership. This parity is behavioral and must be backed by the official Codex/app-server capabilities or by one versioned truthful adapter when an exact native seam is absent. Codex Project membership, Codex Chat or Thread identity, VibeHub Project ownership and VibeHub Task identity are not assumed to be the same object. Their mapping must be explicit so Recents, search, fork, Task association and zero-or-one VibeHub Project ownership cannot silently overwrite one another. No browser-only localStorage or second chat registry may become authoritative.",
