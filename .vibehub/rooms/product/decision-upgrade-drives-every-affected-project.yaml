  "detail": "When a user takes an update, VibeHub is responsible for their existing project data being restructured rather than for announcing that it is stale. That responsibility splits at the line between finding out and doing. Finding out is machine-wide and happens at update time: the upgrade discovers every project that holds a .vibehub, reports which format each is at and which need migration, and leaves the user knowing the full extent of what an update implies. Doing is per-project and happens later, when an Agent is next opened in that project, which is where the work has always belonged — it needs judgment, it produces a reviewable Git diff in that repository, and it has to be seen by whoever owns that project. The rejected alternative was to drive migrations across the machine from the upgrade itself. It was rejected because it would write into repositories the user is not looking at, in a single sweep, with no natural place for per-project review — and because the per-project half already works: the engine returns format_mismatch MIGRATION_REQUIRED with a specific reason the moment anything is attempted in a stale project. What was missing was never the doing; it was that nobody was told which projects were affected. Three projects on the owner's machine, two at MIGRATION_REQUIRED, unnoticed until a survey was run by hand. This extends the scope of decision-agent-driven-upgrade-migration without relaxing it. That decision's honest triggers stand, and its no-background-conversion rule is strengthened rather than weakened: the machine-wide half is read-only, so nothing outside the user's current project is ever written by the upgrade. One consequence must not be discovered later: npx skills update belongs to skills.sh and cannot be hooked by VibeHub, so the reporting obligation cannot attach to the documented update command. It requires VibeHub's own explicit entry running outside any project. Because that entry only reads and reports, the boundary question it raises is materially smaller than a general cross-project tool would be — but it is still a question, and it must be answered before this experience can be built.",
