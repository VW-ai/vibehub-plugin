  "detail": "When a user takes an update, VibeHub is responsible for restructuring their existing project data — and that responsibility is machine-wide. The rejected alternative was the weaker reading: that the next Agent session which happens to open an affected project notices and offers migration. That leaves the user's other projects silently write-blocked for as long as they go untouched, which is exactly the observed failure — three projects on the owner's machine, two at MIGRATION_REQUIRED, unnoticed until a survey was run by hand. This extends the scope of decision-agent-driven-upgrade-migration rather than reversing it. That decision's honest triggers were a validation error naming a legacy structure, or the user asking to upgrade; the second trigger still applies and is still explicit, but it now covers every project the upgrade finds instead of the one the user is standing in. Nothing here permits background conversion: no scan and no write happens except inside a user-invoked upgrade, each project's restructure remains an ordinary reviewable Git change, and a project with uncommitted work is surfaced rather than silently modified. One consequence must not be discovered later: npx skills update belongs to skills.sh and cannot be hooked by VibeHub, so this obligation cannot attach to the documented update command. Honouring it requires VibeHub's own explicit upgrade entry, which is a cross-project surface running outside any project. That surface was previously treated as a someday question owned by nobody; this decision puts it on the critical path, and the boundary question it raises — whether VibeHub gains such an entry at all, and under what replacement for the no-required-CLI constraint — has to be answered before the upgrade experience can be built.",
