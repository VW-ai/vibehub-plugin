  "detail": "Every Ticket, its Evidence, and its Outcome remain part of the project's durable history; completing and shipping work never deletes or moves old canonical records. Ticket schema v1 carries an optional typed deliveries array: omitted means no memberships, pull-request entries move explicitly from proposed to delivered or abandoned, and cherry-pick delivery is an exact commit reference. Archive is derived only from a successful Outcome plus any explicit delivered entry, remains orthogonal to operational status, and is never inferred from Git branches or external PR state. Reverts annotate the historical delivery; reopened work is a new current Ticket with a reopens:<old-ticket-id> provenance reference. The shared query model defaults to current work and composes current/all scope, exact delivery membership, and a union of selected Room subtrees by intersection; Rooms remain owners of Context rather than Tickets. CLI JSON and the Workbench consume that same deterministic projection. In current scope, the nearest archived Ticket adjacent to visible work remains as a subdued card with a textual ARCHIVED label. Deeper archived history becomes a keyboard-focusable count-labelled directional stub; activation reveals exactly the next hop, records revealed Ticket ids in the focused URL, and does not move already-visible cards. All-history restores the complete canonical graph. These semantics replace the earlier exploration notes with the firm contract selected for the concentrated Web Workbench upgrade.",
