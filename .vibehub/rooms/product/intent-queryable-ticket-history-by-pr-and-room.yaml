  "detail": "Every Ticket, its Evidence, and its Outcome remain part of the project's durable history; completing and shipping work must never require deleting old canonical records. The default operational Workbench should not render the project's entire lifetime graph. Once completed Tickets are delivered through a pull request, the system should carry a canonical, queryable association that says which Tickets closed in and belong to that PR, and should project those Tickets as archived outside the default current-work view. Users must still be able to inspect all Tickets and compose useful historical projections, including the Tickets for one PR and Tickets related through one or several selected Rooms. This is a full-stack capability: archive and PR-association semantics, deterministic query projection, and Workbench filtering must share one canonical contract derived from Git-native documents, not a browser-only filter or hidden index. Room-based retrieval is a relation/view over Ticket Context and must not make Rooms own Tickets. Exact schema placement, the authoritative PR-delivery moment, legacy backfill, reopened work, multi-PR delivery, and how hidden completed prerequisites remain intelligible in a filtered causal graph are intentionally left for future Ticket refinement rather than decided implicitly now.",
