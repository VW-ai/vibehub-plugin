  "detail": "skills.sh copies every directory containing a SKILL.md and nothing else, so a helper kept beside the skills was silently dropped and every copied Skill dangled. The fix is structural, not a wrapper: vh.mjs, vh-ui.mjs, contracts/, and templates/github/ live in skills/vibehub-core/, whose SKILL.md states it is infrastructure that nothing invokes directly, and every other Skill references ../vibehub-core/… . The same layout ships through the Codex and Claude Code marketplaces, so one tree serves both paths with no version skew and no network after install. The owner chose this over publishing an npm package that Skills would call through npx (deferred until a human needs to initialize a project outside an agent; the npm name vibehub is taken by an unrelated package) and over declaring skills.sh unsupported (which would leave the silent breakage in place). Project setup offers the GitHub Issues mirror once as a self-contained five-file copy (workflow, sync script, vh.mjs, versions.json, dependency-hygiene.json under scripts/vibehub/) because vh.mjs loads its contracts at import time and a user's Actions checkout has no plugin. Historical documents keep their meaning; only file-path context_refs to the moved files are updated, since the validator requires readable refs and a compatibility shim at the old path is rejected.",
