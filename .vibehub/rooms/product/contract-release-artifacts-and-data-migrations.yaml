  "detail": "Maintainers verify the exact reviewed change before publishing. The current release workflow builds the plugin archive, the one-shot upgrade tarball and checksums as GitHub Release assets; it does not publish a VibeHub npm-registry package. package.json, retained plugin metadata and release notes agree on identity. Shipped content cannot change while claiming the latest stable version; main between releases uses a distinct prerelease. Prepare and review a release on the mainline, tag the exact approved commit and verify the published archive and paired upgrader. Do not tag a feature branch as the final stable release. Optional future computed-version and atomic-main/tag release work remains separately recorded, not an implemented prerequisite. A data-format change ships a versioned migration registry entry. Mechanical steps declare exact allowed paths and independently reach a valid writable target. Semantic steps state their purpose, authoritative source inputs, what good values mean and forbidden inference shortcuts; empty semantic arrays explicitly mean no additional judgment. No compatibility shims or silent background conversion substitute for migration. Current task-memory development does not require an independent Outcome before code review or release. Installation and artifact checks must prove copied Skills remain self-contained and that local planning records are absent from the distribution.",
