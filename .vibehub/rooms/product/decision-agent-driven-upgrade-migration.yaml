  "context_id": "decision-agent-driven-upgrade-migration",
  "detail": "The checked-in data layer (Context, Rooms, Tickets, Evidence, Outcomes) is never burdened with forward-compatibility shims. Instead, upgrading is an explicit, agent-driven restructure: when a user pulls a new plugin version into a project whose .vibehub still has the previous format, the agent converts the old structure into the new one in place, under Git review like any other change. Every release that changes the data layer or skill contracts must therefore ship its migration step as agent-facing guidance in a versioned, single-source migrations reference owned by a migrate skill — the same contract pattern as the lifecycle and knowledge-governance references. Migration triggers are honest and explicit: a validation error naming a legacy structure (such as a populated flat .vibehub/context/) or the user asking to upgrade; never background conversion. The first entry is 0.4-to-0.5: flat context entries move into owning rooms (building the room tree via distill when none exists), ticket context_refs are rewritten to roomed paths, and validation must pass afterwards. This keeps the codebase clean of compatibility branches while making upgrades cheap for users: the agent pays the conversion cost once per project, visibly, in a reviewable diff.",
