  "detail": "The historical cleanup kept rollback baseline 9dee0f095374211d8d7cbeeacac653ebb87bed91 and measured code files falling from 110 to five, source lines from 40,211 to 1,086 and artifact paths from 74 to 28. These measurements describe that cleanup commit only. It removed the large CLI/runtime/native database, hooks, MCP, dispatcher, leases, compiled ContextBinding and cached synchronization state. Shared schemas, direct file validation, explicit durable capture and Git review remained. The then-current proof-cycle checks and four-test count are historical; later task-memory semantics and the read-only loopback UI/session observation exceptions supersede those parts. Retain the deletion-first decision and exact verification provenance without claiming the current project still has that footprint or needs the old mandatory cycle.",
