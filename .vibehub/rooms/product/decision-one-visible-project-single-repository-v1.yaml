  "context_id": "decision-one-visible-project-single-repository-v1",
  "detail": "VibeHub v1 presents one Project concept rather than asking the user to distinguish Workspace, folder, Codex Project and VibeHub Project. The active folder or Git repository is the physical execution, storage and authority boundary; the visible Project is the human-facing work container for that same boundary. In v1 their relationship is one-to-one: opening a VibeHub-enabled repository opens its one VibeHub Project, and Workspace or cwd remains an inspectable implementation property rather than a peer navigation object. Codex app-server remains authoritative for native Thread, ThreadSection, fork, archive, search and execution behavior, while VibeHub remains authoritative for the Project's Task graph, Rooms, governed Context, Evidence and Outcomes. The shell may compose those capabilities behind one Project surface but must not merge their internal identifiers, infer identity by name, or create a second chat-membership store. Recents continues to mean native Chats without Codex Project membership; ordinary Chat remains usable without entering Task protocol. Multi-folder Projects and cross-folder VibeHub Context are explicitly outside v1.",
