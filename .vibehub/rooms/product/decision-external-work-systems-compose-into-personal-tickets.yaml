  "context_id": "decision-external-work-systems-compose-into-personal-tickets",
  "detail": "VibeHub does not require users to replace a project-management system they like. A person or company may continue using Linear, Jira, Feishu, or another organization-centered product for its project lifecycle, Git integration, collaboration, and reporting. At the person's VibeHub layer, that external system is one participating source and action surface rather than the global organizer of the user's work. An external project, issue, comment, document, status, or history may inform a personal Ticket as Context or a typed Reference. Reading from the external system, creating or updating one of its objects, linking a pull request, or reporting completion back may be an executable step or an Acceptance criterion of the personal Ticket; the resulting external state or URL may serve as Evidence. VibeHub should not assume a permanent one-to-one mirror: one external issue may inform several personal Tickets, and one personal Ticket may coordinate facts and actions across several systems. The external product remains authoritative for the organization's shared object, while VibeHub remains authoritative for the person's Ticket, personal Context, Agent coordination, attention boundaries, and Outcome. Connectors should therefore learn the user's intended use and operate through bounded, reviewable reads and writes with explicit authority instead of rebuilding Linear-style project management or silently synchronizing everything.",
