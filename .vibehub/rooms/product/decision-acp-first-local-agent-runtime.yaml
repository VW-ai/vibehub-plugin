  "context_id": "decision-acp-first-local-agent-runtime",
  "detail": "ACP is the chosen execution protocol between a VibeHub host and replaceable coding Agents. The first implementation uses acpx as the preferred first replaceable headless ACP client and runtime facade, launching codex-acp and claude-agent-acp profiles before VibeHub invents provider-specific transports. V1 defaults to the user's already installed and authenticated Codex and Claude Code runtimes and subscriptions; VibeHub must not require API keys or a second provider login, and must not own, copy, export, persist, or synchronize provider OAuth tokens. Other local subscriptions and Agents may be added later through ACP launch profiles or narrowly scoped adapters. Reuse eligible open-source components under pinned versions with license and source provenance; write custom compatibility code only for demonstrated capability gaps. ACP and acpx carry session, stream, permission, cancel, resume, and configuration mechanics, while VibeHub continues to own Task/Ticket, Workflow role selection, exact ContextBinding, Evidence proposals, independent Outcome, and governed Context writeback. This decision chooses the executor protocol and preferred first facade; it does not by itself supersede the current DSH product-shell direction, which remains a separate host/composition decision.",
