 "context_id": "decision-release-version-identity-policy",
 "detail": "Three rules, decided together. First, a change to content inside the artifact allowlist cannot land while the declared version still equals the last published release: on the host where this was observed the declared version is the cache key, and any host that compares versions at all can only conclude what the string says, so a version that does not move is a version that lies. Second, that cost does not fall on each commit: main between releases carries a distinguishable pre-release identity, so the release number itself is only chosen at release time. Third, and this is the part that reaches users: VibeHub never forces an update. A project may sit on an older version indefinitely and nothing nags, auto-upgrades, or breaks. But an update that is taken is owned end to end — VibeHub is responsible for restructuring that user's existing project data into the new format, not for announcing that their format is stale and leaving them to it. The evidence that this third rule is currently unmet is an Agent survey of the owner's own machine, corroborated in ticket-one-command-upgrade-across-projects: three VibeHub projects, two of them write-blocked at MIGRATION_REQUIRED, with the owner unaware until a survey was run by hand. The update command on the supported install path is npx skills update, so this is where the obligation attaches. One design question is deliberately left open for the cross-project upgrade Ticket to answer rather than being settled here: whether the restructure is offered by the next Agent session that opens an affected project, or discovered and driven at update time across every project on the machine. The first is compatible with decision-agent-driven-upgrade-migration as written; the second would require amending it, since that decision forbids background conversion.",
