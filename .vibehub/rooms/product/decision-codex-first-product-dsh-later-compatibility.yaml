  "context_id": "decision-codex-first-product-dsh-later-compatibility",
  "detail": "The immediate product path is Codex-first because the owner actually uses Codex and needs the product to improve that daily workflow. The application should use the official local Codex app-server and the owner's own Codex/OpenAI account as its primary Chat and Agent runtime, then add the VibeHub Task Graph, Task Workspace, Context, Evidence and Outcome layer. DeepSeek Harness remains a supported future compatibility, packaging and ecosystem target for people who use DSH, but DSH-specific shell composition, native Session behavior, Theme integration and public DSH Plugin packaging must not gate the first usable Codex product. Shared core packages must keep runtime and shell adapters replaceable so later DSH support does not require a fork, a duplicate Agent loop or a second Task store. In security language, Codex app-server runs locally while model Turn content may leave the machine through the owner's authenticated OpenAI service exactly as it does in Codex; this is not a separate third-party Codex service. Private Project Context must not be transmitted by probes unless explicitly authorized; synthetic fixtures should prove transport when real content is unnecessary.",
