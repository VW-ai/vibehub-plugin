  "context_id": "decision-codex-first-product-dsh-later-compatibility",
  "detail": "The immediate product path is Codex-first because the owner actually uses Codex and needs the product to improve that daily workflow. The application should use the official local Codex app-server and the owner's own Codex/OpenAI account as its primary Chat and Agent runtime, then add the VibeHub Task Graph, Task Workspace, Context, Evidence and Outcome layer. DeepSeek Harness remains a supported future compatibility, packaging and ecosystem target for people who use DSH, but DSH-specific shell composition, native Session behavior, Theme integration and public DSH Plugin packaging must not gate the first usable Codex product. Shared core packages must keep runtime and shell adapters replaceable so later DSH support does not require a fork, a duplicate Agent loop or a second Task store. In security language, Codex app-server runs locally while model Turn content may leave the machine through the owner's authenticated OpenAI service exactly as it does in Codex; this is not a separate third-party Codex service. Project code, VibeHub Task handoff and Context are normal inputs to the owner's Codex and may be used in real integration probes for this open-source repository; credentials, access tokens and unrelated private data remain excluded. Synthetic fixtures are useful for deterministic regression, not a product privacy requirement.",
