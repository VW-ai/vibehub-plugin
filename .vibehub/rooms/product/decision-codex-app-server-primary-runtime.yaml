  "context_id": "decision-codex-app-server-primary-runtime",
  "detail": "The preferred product architecture is a non-invasive DSH Plugin or Bundle whose principal Chat and execution path is backed by the official Codex app-server rather than a second DSH-native Agent loop pretending to be Codex. Codex app-server owns Codex Threads, Turns, streaming items, tools and skills, approvals, plans, diffs, interruption, recovery, audio inputs, and optionally experimental thread-scoped realtime voice. One version-pinned adapter owns every Codex protocol translation, generated schema, capability probe, lifecycle, authentication handoff, and compatibility fallback; raw app-server events do not become a second VibeHub lifecycle. DSH continues to supply installability, plugin composition, Theme and frontend surfaces, settings integration, and optional ecosystem capabilities. VibeHub continues to own Projects, Tasks, Context, Task-to-Thread or Run linkage, attention, Evidence proposals, and Outcomes, and must not mirror Codex private planning as canonical Task truth. The product must not run both DSH and Codex Agent loops for the same user action, imply live presence from replay alone, or claim unsupported realtime voice as stable. Ordinary audio turn input is part of the baseline; realtime voice stays capability-gated and experimental until its pinned contract is independently proven.",
