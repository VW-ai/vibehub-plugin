  "detail": "The product's high-fidelity visual system should use the Codex desktop app and Linear as its primary quality and taste baselines across the entire DeepSeek Harness shell. Codex contributes a calm, native-feeling, spacious execution workspace in which conversation, progress, artifacts, and intervention feel coherent; Linear contributes precise information hierarchy, disciplined density, quiet navigation, typography, spacing, state treatment, and earned emphasis. This is a directional synthesis rather than a pixel clone or a mixed brand collage. The theme must cover shared shell chrome, navigation, Graph home, Task workspace, Chat, Run progress, attention requests, review, overlays, and responsive states so the user experiences a different, internally consistent application rather than stock DSH with a styled VibeHub panel attached. Paper, editorial, document-editor, decorative dashboard, sci-fi cockpit, excessive cards, and arbitrary dark-product aesthetics remain rejected. Interaction architecture and Task-first product semantics remain independent of the visual layer, and DSH compatibility should be preserved through its Theme Runtime and Plugin surfaces wherever possible.",
