  "detail": "The first VibeHub product inside DeepSeek Harness should not replace or take ownership of the DSH Root shell. DSH retains its application shell, navigation, Session runtime, Chat, tools, permissions, and Plugin ecosystem. VibeHub adds the smallest coherent set of human-facing Task surfaces: a Tasks or Graph page based on the existing Graph Workbench interaction system, and, if a separate surface is necessary, a focused Task Workspace for Run observation, exact human attention, Chat steering, Context, Evidence, and review. Existing Graph behavior such as causal layout, scope, selection, Rooms, progressive Inspector, direction controls, minimap, and focused return should be adapted rather than redesigned; independent-app chrome should be reconciled with the DSH shell so users do not see nested navigation or duplicate Inspectors. The rest of the integration should use official additive Client Slots for Task association, Context controls, Run state, attention, and Evidence actions, plus a global theme that makes stock DSH and VibeHub surfaces visually continuous. If DSH cannot register a top-level page, the same product surfaces may be expressed as official view extensions; that implementation detail does not authorize Root replacement.",
