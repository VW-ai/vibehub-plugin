  "detail": "The pinned DSH rc.8 Root declares sidebar as a single-owner slot. Stock SidebarRoot owns New Session and declares brand mark, brand name, workspace browser, settings, and footer-action child seats. The only additive sidebar seat is footer action, which cannot truthfully carry the primary Tasks destination at the bottom. Therefore a production persistent VibeHub navigation must either accept that inferior footer placement or shadow the Sidebar owner through official composition, preserve native New Session and collapse behavior, and recreate all five child seats. Root, Conversation, Details, native composer, Session and Workspace services remain stock. If those seats or native behavior cannot be preserved, implementation must stop rather than inject DOM or fork upstream.",
