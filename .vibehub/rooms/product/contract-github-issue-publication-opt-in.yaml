  "detail": "The repository workflow is disabled unless VIBEHUB_GITHUB_SYNC is true. The user must explicitly choose both record sharing and mirror installation; having a remote is insufficient. On main, Git-native Ticket records determine generated Issue content and recorded completion. Hidden ticket markers identify mirror Issues, Evidence identifiers identify historical proof comments, and direct prerequisites project to GitHub blocked-by relationships. Git remains authoritative. Title edits, Issue comments and manual closure never write back into project files; later sync restores the repository projection. Criteria are informational task text, not an independently authoritative GitHub checklist, and current format 6 has no maturity labels or mandatory successful Outcome for done. The Issues list with filters is the default overview; an Issue sidebar walks dependencies. Projects board/roadmap is optional human-configured presentation, not a canonical graph or automatic publication prerequisite. A failure is reported by Actions. Inbound external issues require deliberate intake and separate authorization for closure/comment writes. This records the current one-way contract; subsequent reliability work must not be described as already shipped.",
