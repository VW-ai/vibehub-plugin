  "detail": "The near-term product remains a lightweight coding-Agent Plugin for an individual or small team doing real project work. Its job is to provide most of the coordination they actually need without requiring an organization-scale issue-management system: turn a request into a user-visible bounded Ticket, preserve relevant Context, expose dependencies and human boundaries when useful, coordinate Agent execution, and return Evidence-backed completion. This entry wedge does not attempt Linear parity in roadmap planning, customer feedback, organization hierarchy, analytics, or enterprise workflow administration, and it does not prematurely build the later consumer app. Real solo and small-team dogfood should determine the minimum coordination primitives that earn repeated use and can later generalize into the person-centered Ticket and attention system. The Plugin is therefore the practical first form of the broader product, not a separate final identity.",
