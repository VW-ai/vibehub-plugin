  "context_id": "decision-human-and-agent-led-context-spaces",
  "detail": "Chat and Task are both Context Spaces in which a Human and one or more Agents build work. A Chat is normally Human-led: the Human chooses the next direction while the Agent reacts, elaborates, and waits; it may stay temporary and open-ended. A Task is normally Agent-led: it has an explicit Outcome, Context scope, constraints, Acceptance or stopping conditions, and delegated authority for the Agent to advance without continuous conversation. The unifying interaction state is attention ownership — Human, Agent, or nobody owns the next move — so a completed Chat response and a Needs-You Task both return attention to the Human, while an AI-generating Chat and a Running Task give the next move to the Agent. A Chat may become a Task in place by adding an execution contract and delegation without copying its history into a new object. A Task may open Human-led conversation streams for exploration or intervention without ceasing to be the same Task. Agent Session remains a replaceable execution carrier rather than the durable user-facing Task.",
