  "context_id": "decision-release-and-update-experience-is-the-mainline",
  "detail": "The work opened by upgrading a stale install on 2026-09-01 is one mainline with side fixes attached, not a flat pile of defects. The mainline is the release and update experience: what a released version means, what a user actually receives when they install, what happens to their existing project data when they take an update, and how they find out an update concerns them at all. Everything on that line is in scope and is prioritised together. Two things found along the way are explicitly side fixes rather than mainline, and must not compete with it for priority: the closeout independence gate, which is a workflow-integrity defect, and GitHub Issue intake, which is a tooling convenience. They are worth doing and one is already done; they are not what this effort is about. One framing correction matters enough to record, because it was nearly built into the Tickets the wrong way round. That two of the owner's three projects sit write-blocked at MIGRATION_REQUIRED is a symptom, not the problem. The problem is that taking an update does not carry the user's data with it, and that nothing tells a user an update concerns their other projects. The two blocked projects are how that was noticed and are useful as a rehearsal target, but unblocking those two specific repositories is not a deliverable and must not be mistaken for one. A fix that migrated Undercurrent and nomi while leaving the update experience unchanged would resolve the symptom and deliver nothing.",
