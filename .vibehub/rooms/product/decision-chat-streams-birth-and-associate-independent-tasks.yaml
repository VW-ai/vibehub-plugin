  "context_id": "decision-chat-streams-birth-and-associate-independent-tasks",
  "detail": "Chat and Task share the same conversational interaction substrate but remain distinct durable objects. To the Human, a new Chat can feel like an uncommitted Task space: it has a purpose and can accumulate useful Context, but it has no durable execution contract until an explicit Create Task or Attach to Task action occurs. A Chat never has to stop or transform identity when work becomes executable. One Chat stream or branch may birth zero, one or many Tasks and may continue indefinitely afterward. Each created Task owns its Outcome, Context scope, constraints, Acceptance, lifecycle, Evidence and Agent delegation, plus an origin provenance locator identifying the source Chat or Thread, branch and exact Turn or selected range from which it was formed. A Task may also associate with additional Chats later, but origin provenance remains singular and immutable. The Task Workspace provides a full task-scoped conversation so the Human can ask, clarify, intervene or redirect without returning to the source Chat; the Agent receives the Task's authoritative organized Context packet, not an implicit copy of the entire ever-growing source transcript. The Human may also return to the origin Chat and continue directing that broader stream. New messages in either place do not silently mutate the other Context: explicit attach, quote, Remember, Create Task or update actions govern transfer. In Chat UI, lightweight inline or turn-level Task associations may show what work was created or attached; list and Graph views may show the same provenance edge without treating a Chat fork as a Subtask or a Task dependency.",
