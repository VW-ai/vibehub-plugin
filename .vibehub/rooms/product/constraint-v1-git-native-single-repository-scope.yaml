{
  "context_id": "constraint-v1-git-native-single-repository-scope",
  "detail": "The first daily-use Codex carrier and its VibeHub Task system operate against exactly one selected folder containing one Git repository. Checked-in .vibehub Context, Tickets, Evidence, Outcomes and Room alignment remain the canonical durable truth inside that repository. V1 does not aggregate Task graphs, activate Context, inherit Rooms, dispatch write authority or synchronize state across multiple folders or repositories. A Chat may still be ordinary or unprojected in Codex, but creating, attaching or running a VibeHub Task must resolve to the one active repository and its Project scope. The UI must show that scope clearly without introducing a separate Workspace hierarchy. If no eligible repository is open, VibeHub Task actions must be unavailable or explain the missing scope rather than silently creating hidden storage. This is a bounded delivery constraint, not a claim that Project and repository are permanently identical in the long-term domain model.",
