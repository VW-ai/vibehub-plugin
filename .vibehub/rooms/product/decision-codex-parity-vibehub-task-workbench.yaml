  "detail": "The default product experience should be almost the same as Codex for ordinary work: familiar persistent navigation, Chat and Composer behavior, Thread history and recovery, attachments and voice input, streaming execution, tools, approvals, plans, diffs, progress, shortcuts, and coherent Light and Dark modes. A user who already understands Codex should not have to learn DSH plugin concepts, unusual configuration, or a parallel Chat protocol to begin working. VibeHub's additive value starts above that parity floor: Task is the durable unit; a Task may bind one or more Codex Threads or Runs; the product adds the Task Graph, focused Task Workspace, Project and Context scope, DRAFT/READY/RUNNING/DONE posture, Needs You and other bounded sub-state, governed Chat-to-Task and Remember actions, Evidence, independent Outcome, and return-to-work recovery. Chat remains an excellent direct interaction surface, while VibeHub organizes what the interaction is for and what durable work it produces. This supersedes the earlier assumption that stock native DSH Chat is itself the user-facing baseline; DSH remains the installable and composable host shell, but the product baseline is Codex-compatible work interaction plus VibeHub Tasks.",
