  "context_id": "decision-github-issues-are-a-read-only-ticket-projection",
  "detail": "Every Ticket on main is projected onto a GitHub Issue by a script that runs only inside GitHub Actions on push to main (scripts/sync-github-issues.mjs, .github/workflows/sync-issues.yml). The Issue shows the Ticket outcome, acceptance as a task list checked from the current Outcome, constraints, context refs as links, direct dependencies as Blocked-by links, state and maturity as labels, each Evidence record as one comment, and closure when a successful Outcome exists. Mapping is a hidden marker in the Issue body, so the repository gains no Issue-number field and CI never commits. The projection is strictly one way: nothing in an Issue — title edits, comments, manual closure — is read back into .vibehub documents, and the next run restores repository truth. Human comments on Issues are conversation; a durable decision still enters through vibehub-ingest. An Issue filed from outside becomes a Ticket only through deliberate planning that cites the Issue URL as a context ref. No Agent is asked to run, verify, or babysit the sync; a failure is a red check in Actions, not a conversation event. This is consistent with the decision that external work systems compose into personal Tickets without organizing them: here GitHub is a display surface for VibeHub truth, never an authority over it.",
