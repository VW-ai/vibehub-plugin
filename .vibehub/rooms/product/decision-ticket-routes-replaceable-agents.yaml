  "detail": "The Ticket is the stable user-facing action object; Agents, chats, repositories, models, and runtimes are replaceable execution resources selected for that action. As VibeHub expands beyond a single coding repository, the interaction model should move from an Agent or chat that happens to create Tickets toward a Ticket that routes work to one or more suitable Agents. This is a product-perception and UI transition as much as an orchestration change. It is not a requirement for the current open-source release: the near-term product may keep coding-Agent and chat entry points while proving the canonical Ticket cycle first.",
