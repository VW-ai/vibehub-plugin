  "context_id": "note-four-invariants-of-modular-systems",
  "detail": "The owner distilled the skill-system methodology into four invariants that hold for any modular system — teams, pipelines, microservices — independent of AI or natural language. Decomposition: what is the independent unit of work; the test is whether pieces can execute without depending on each other (VibeHub: skills as units, tickets as work units, rooms as knowledge units). Explicit boundary agreement: at every handoff, the shape of the handoff artifact must be explicit and acknowledged by both sides, because implicit assumptions at boundaries make systems break silently (VibeHub: the five document schemas, the lifecycle contract, the canonical-agent-output contract). Shared knowledge, deduplicated: any methodology or rule used by two or more units is extracted to a single referenced source to prevent drift — DRY for governing text (VibeHub: ticket-lifecycle.json, the planned knowledge-governance reference, this room's conventions). Dispatch: every multi-unit system needs a mechanism that decides who handles a request, even if it is one if/else (VibeHub: the host's skill-trigger matching is the dispatch table and each SKILL.md description is its routing entry, with the one-line canonical entry owned by ticket-plan; a deliberate decision rejects any second router). When evaluating or extending the skill system, changes should be judged against these four dimensions.",
