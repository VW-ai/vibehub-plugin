  "detail": "Future hosted or authenticated VibeHub should let the user define an autonomy policy that governs planning and execution rather than relying on one fixed meaning of reasonable cost. The policy expresses how strongly the user prefers uninterrupted autonomous progress versus close intent alignment, together with acceptable budgets for experiments, tokens, elapsed time, external actions, reversibility, and deviation risk. Higher autonomy authorizes more bounded investigation, experimentation, and recovery before reclaiming attention; lower autonomy creates earlier human gates and tighter confirmation. Planning uses the policy to budget evidence gathering and shape known human boundaries. Execution compares the marginal value, cost, and risk of further investigation against that authorized budget, and escalates when the boundary is exceeded instead of silently expanding work or confidently choosing a costly wrong path. The current Skill-first Plugin can dogfood the semantics through prompt instructions and explicit Ticket Context, but a mature online service may need durable user preferences, per-project or per-Ticket overrides, usage accounting, and an inspectable policy-to-decision trace. Exact controls, storage, identity, billing, and enforcement remain deferred until real hosted-product work.",
