  "context_id": "decision-explicit-upgrade-migrates-safe-worktrees",
  "detail": "This supersedes the earlier read-only machine-wide rule and the in-project-only placement rule in the mechanical/semantic migration decision while preserving that decision's core classification. Every release that changes project data must still declare which steps are deterministic and which require Agent judgment. The mechanical half must run alone to a valid writable project; every semantic step remains separately reviewable and must ship guidance covering purpose, authoritative inputs, quality, and forbidden shortcuts. What changes is where the halves run. When the user explicitly invokes VibeHub's upgrade experience, it discovers affected projects and enumerates every registered, existing worktree reported by git worktree list. Each worktree is a separate branch snapshot and is migrated separately; one commit is never assumed to update the others, and branches without a registered worktree are outside this sweep. For every eligible safe worktree, the upgrade runs only the declared mechanical migration, proves the resulting project is CURRENT and valid with any remaining semantic work explicitly pending, and creates one local reviewable migration commit containing only the declared migration paths. It never pushes. A later Agent session in that worktree reports the migration commit and performs only the remaining semantic steps using the shipped authoring guidance. Safety is deliberately conservative. A worktree is safe for automatic write only when it is registered, reachable and writable; is attached to a named, non-unborn branch; has no merge, rebase, cherry-pick, revert, or bisect in progress; has a completely clean status including staged, unstaged, and untracked files; has a recognized older project format with a complete migration chain; and a deterministic preview on the same HEAD touches only declared paths and reaches a valid writable target without semantic judgment. HEAD and status are checked again immediately before commit, and local commit capability must succeed. A current worktree is a no-op, not unsafe. A malformed or unsupported-newer format is reported as unsupported. Every other failed safety predicate is reported as pending with its exact reason; it is never silently skipped, modified, stashed, reset, committed, or pushed. If a verified preview cannot be applied and validated exactly, the worktree is restored to its clean preimage and reported pending. This is explicit upgrade behavior, not background conversion.",
