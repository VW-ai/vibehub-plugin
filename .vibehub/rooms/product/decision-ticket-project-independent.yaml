  "context_id": "decision-ticket-project-independent",
  "detail": "A Ticket does not require a Project parent. For an Agent, two independent Tickets have the same execution shape whether they concern one repository, different repositories, or eventually non-software resources: each is governed by its own Outcome, activated Context, authority, capabilities, acceptance criteria, and direct dependencies. Project remains useful as a user-facing view and as a boundary for authority, resources, collaboration, billing, and reporting, but it must not become the mandatory top-level container of the action graph. Cross-project and same-project work therefore use one Ticket model instead of separate orchestration semantics.",
