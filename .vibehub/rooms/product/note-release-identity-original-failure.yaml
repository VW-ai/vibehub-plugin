  "detail": "The release-identity proposal followed an install that was 143 commits behind while still reporting 0.8.0. The owner selected a shipped-content version gate and distinguishable prerelease identity rather than abandoning semantic release metadata. Updating remained voluntary, but an accepted update should account for affected project data. Later investigation of skills 1.5.23 proved global folder-hash checks and project re-fetch behavior, so version-string cache staleness does not apply to the supported npx path. The current safe upgrade uses an explicit same-tag install and one-shot release asset over bounded roots/worktrees. Earlier floating skills-update and read-only machine-sweep questions are historical alternatives. Pending computed-version and atomic release work has separate decisions and Tickets; this note does not claim it is shipped.",
