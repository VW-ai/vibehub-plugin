  "detail": "The npx-first investigation showed that skills.sh copies directories containing SKILL.md and omits sibling helper directories. A previously successful install therefore left Skills with missing helper paths. Path A placed scripts, contracts and templates inside non-invocable vibehub-core and was selected. Path B, publishing an npm helper for Skills and humans, was deferred until a real standalone initialization need; the npm name was already unrelated. Path C, declaring skills.sh unsupported, was rejected because it left the silent failure. A missing-core repair line is necessary because the installer has no required-Skill dependency mechanism. The proposal originally kept marketplace distribution and suggested offering GitHub sync during setup; later decisions retired marketplaces and require explicit sharing/opt-in instead. Historical Skill counts and obsolete names do not describe the current nine-Skill installation.",
