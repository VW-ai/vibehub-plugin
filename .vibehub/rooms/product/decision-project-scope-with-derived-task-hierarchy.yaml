  "detail": "A Task normally belongs to exactly one Project, and a Project remains the human work scope containing its Task graph and project-level Room tree. A temporary or standalone Task may have no Project. Cross-Project work remains explicit through coordination Tasks, project-owned related Tasks, and governed Context references; reading another Project does not grant writeback authority. This decision corrects the earlier unimplemented assumption that child Tasks were already part of the accepted domain model. Current canonical Tasks remain independently executable units connected by dependency edges, and no Parent Task, Child Task, Subtask, High-Level Task, Low-Level Task, or Task Group lifecycle is committed. The Workbench should first obtain hierarchy and concentration from topology-derived visual clusters. A canonical containment relation may be reconsidered only if dogfood demonstrates durable operations that a view cannot provide, such as inherited Context, shared Outcome or Acceptance ownership, lifecycle rollup, whole-group moves, or whole-group archival. The first DSH Plugin slice may remain single-Project and omit personal Rooms, cross-Project coordination, and team semantics.",
