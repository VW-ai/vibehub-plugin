  "detail": "The Harness contract and product-logic reports explored a graph home with a focused Ticket workspace: Ticket throughout, Chat before and around work, Run during execution. Think-first chat could fork, compare and bring conclusions back before forming a task; act-first began with a bounded outcome. The prototype phases were explore, ready, running, needs-you, review and done, with phase-specific composer and attention behavior. Task, Chat, Agent Session, Run, selected Context, Evidence and Outcome were deliberately distinct. The initial proposal treated DSH as engine under a complete VibeHub shell; later owner decisions chose additive task pages inside the DSH shell instead. The proposed full execution/independent-closeout loop is historical and does not govern current task-memory Skills. V1 scope was one browser workspace, not a cloud service, personal automatic knowledge graph, team administration or new database. Source walkthroughs and their unanswered owner questions remain pinned evidence. Future runtime implementation must reconcile the newer task-memory boundary and obtain its own bounded product decision rather than treating these mockups as shipped functionality.",
