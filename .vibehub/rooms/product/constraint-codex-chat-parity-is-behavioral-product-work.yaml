  "detail": "The production Chat surface must be studied and polished as its own high-value product substrate. Parity includes the streamed rhythm and reconciliation of a Turn; Markdown, code, diffs, commands, tools, plans, subagents, approvals, citations and progress; errors, retry, cancellation and interruption; Composer, attachments, voice, model and mode controls; selection, copy, branching and fork; keyboard, focus, accessibility, wide and narrow behavior. Visual tokens, typography and spacing are necessary but insufficient. The work should use dedicated, independently attributable research and review passes for message rendering, execution and tool surfaces, and Composer and accessibility behavior. Existing low-fidelity prototypes are carriers for learning, not production approval, and unsupported app-server items must remain visible through a truthful fallback instead of being silently dropped.",
