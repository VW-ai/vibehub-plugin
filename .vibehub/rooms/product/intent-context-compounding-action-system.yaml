  "detail": "VibeHub begins with coding-agent development cycles, but its long-term product unit is any user action that can be expressed as a bounded Ticket. The intended product is a personal action and todo terminal used continuously across weeks and months: completed work accumulates durable Context, and that Context improves the planning and execution of later work across software and non-software domains. This is a different form of long horizon from keeping one task running for 100 hours; continuity comes from repeated Ticket cycles over a growing Context layer. The directional path is to make Git mechanics progressively invisible while initially preserving Git review, rollback, and portability; later dogfood may justify user-authorized repository creation and cross-repository Ticket dispatch, including background repositories that hold non-software work such as spreadsheet changes or travel planning. A first-class app may then expose task creation and richer visualization. A hosted, everywhere service is a later option, not a committed storage architecture: replacing Git as canonical storage must be justified independently rather than treated as the goal. Codex and Claude Code remain compatible execution hosts, and ecosystem connectors may extend the action surface. Invisible mechanics must never mean invisible authority or invisible durable resources: users must retain understandable permission, inspection, export, and deletion boundaries.",
