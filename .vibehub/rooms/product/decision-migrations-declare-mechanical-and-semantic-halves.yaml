 "detail": "A migration is not one kind of work. Adding a semantic subtitle to Tickets is the clean illustration: creating the field, defaulting it, and rewriting every document is deterministic and belongs in code, while deciding what any particular subtitle should say requires reading the Ticket and judging. Treating the whole thing as Agent work makes the mechanical half needlessly expensive and, worse, holds a project hostage to attention it does not need. The existing format-1-to-format-2 entry proves this rather than illustrating it hypothetically. Its mechanical half is unambiguous: raise every Ticket document from schema_version 1 to 2, add an explicit deliveries array, write .vibehub/version.yaml with format_version 2, then prove compatibility and validation pass. Its semantic half is equally unambiguous: classify each Ticket's delivery membership from exact reviewable history, explicitly not inferred from status, branch name, filename, or prose. The entry already permits an empty deliveries array when no authoritative delivery can be established, which means the mechanical half alone produces a structurally valid, writable format-2 project and the semantic enrichment can follow later without blocking anything. Undercurrent on this machine sits write-blocked at format 1 for exactly this reason: work that code could finish is queued behind judgment nobody asked for. The rule: every release that changes the data layer declares, as part of shipping it, which steps are deterministic and which require an Agent. The classification is an obligation of the release, not a discovery made at migration time by whoever happens to hit it. The mechanical half must be executable on its own and must leave the project valid; the semantic half is separate, in-project, reviewable Agent work that enriches rather than unblocks. This refines decision-agent-driven-upgrade-migration, which treats upgrading as wholly Agent-driven restructure. Its no-shims rule and its honest-trigger rule stand unchanged; what changes is that an Agent is no longer required for the parts that never needed one. Both halves run inside the project, and the reason is Git rather than caution. A migration is a commit in that repository: it needs a working tree, a branch, and a diff someone can review. An upgrade running across the machine has none of those for a project the user is not in, so even the deterministic half belongs to the session that opens that project. What the machine-wide half contributes is knowing, not doing — which is why decision-upgrade-drives-every-affected-project keeps it read-only. Left open for the implementing Ticket: whether the mechanical half runs the moment an Agent opens a stale project, or only under an explicit command.\n\nDeclaring a step semantic is not enough on its own. When a format change adds a field whose content has to be written rather than computed — a summary, a subtitle, a rationale — every Agent that back-fills it is otherwise inventing its own reading of what the field means, across a hundred existing documents, with no way to tell afterwards whether two of them meant the same thing. So a semantic step must ship the guidance to author it: what the field is for, which existing material the value is derived from, what makes a value good, and what must not be used as a shortcut. The existing format-1-to-format-2 entry already does this without naming it — its rule that delivery membership comes from exact reviewable history and never from Ticket status, branch name, filename, prose, or whichever pull request is currently open is precisely such guidance, buried in a prose step beside mechanical ones. Making it a declared part of the entry means an Agent back-filling a field reads how to do it from the same versioned source that told it the field exists.",
