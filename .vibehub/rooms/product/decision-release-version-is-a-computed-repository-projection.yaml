  "context_id": "decision-release-version-is-a-computed-repository-projection",
  "detail": "Release identity has one semantic input and one mechanical result. Each unreleased shipped change records an explicit release impact of none, patch, minor, or major; the impact is a reviewable judgment and must not be guessed from a file diff. The next stable version is calculated from the highest reachable stable release tag plus the highest impact among the unreleased changes included by the current Git history. A development worktree may project the resulting target as a prerelease identity, but it does not independently reserve or publish that stable version. package.json and the retained Claude plugin manifest are synchronized materializations of the calculation rather than separate authorities. At publication time the calculation is repeated against the exact latest main commit, and only that commit may acquire the unique matching stable tag. This means concurrent worktrees can target the same future release without either owning it; after one release lands, any remaining work recalculates from the new stable baseline.",
