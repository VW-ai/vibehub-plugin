  "context_id": "decision-ticket-records-task-memory",
  "detail": "VibeHub is optional task memory. A Ticket records the desired outcome, useful context, optional completion criteria, progress and relationships. Creating a task does not choose an implementation workflow, assign an Agent, start execution or prescribe a response format. Personal Skills and the host conversation determine how the work is performed. Ordinary questions and implementation need no Ticket. Shared dependency-free validation checks recorded facts. Git-native files remain the durable source of truth; there is no required database, generic dispatcher, provider runtime or background capture. Optional local read-only presentation and explicitly reported Agent sessions do not own task state. Historical Evidence and Outcome remain inspectable but independent closeout is not required to complete a current task. This supersedes execution-mandatory interpretations of the earlier dogfood and speed-first conventions while preserving their lightweight architecture.",
