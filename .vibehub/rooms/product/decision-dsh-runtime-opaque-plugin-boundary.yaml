  "context_id": "decision-dsh-runtime-opaque-plugin-boundary",
  "detail": "DeepSeek Harness is the immediate host, distribution wedge, and runtime integration target, not VibeHub's product boundary. VibeHub should install as a non-invasive Plugin or Bundle through official DSH extension surfaces, including supported frontend surfaces, and should not replace DSH's root application, duplicate its model and tool runtime, or require private coupling to another Plugin. DSH owns Sessions, models, tools, permissions, plugins, and Agent execution. VibeHub owns Projects, the human-facing Task graph, Context activation, attention state, Evidence proposals, and Outcomes. A VibeHub Task may be executed through one Agent session, several sessions, DSH Agent Team, scripts, another Plugin, a different Agent host, or human work; VibeHub must not adapt to or mirror the executor's internal task DAG, roster, mailbox, or planning representation merely because it exists. The thin compatibility adapter only needs stable Task-to-Session-or-Run association, generic lifecycle observation, Context handoff, result-to-Evidence proposal, and restart recovery of that association. Evidence remains a proposal until evaluated against Acceptance, and recovery restores association rather than pretending to reconstruct the executor's private state. Because DSH changes quickly, all host-specific calls should be isolated behind one adapter, pinned to tested versions, and protected by small compatibility smoke tests. The first slice reuses current VibeHub Ticket and Context logic, targets one Project, and prioritizes compatibility plus the complete Task UI over personal-level Rooms, cross-project orchestration, or team infrastructure.",
