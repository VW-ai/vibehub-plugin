  "detail": "The user requests the Goal, Epic and Ticket distinction in both VibeHub understanding and its data model. A Goal describes the intended benefit and success criteria. An Epic groups a coherent capability under exactly one Goal. A Ticket describes independently executable and verifiable work and may belong to one Epic; its Goal is derived through that Epic. Existing and small standalone Tickets remain valid. Persist ownership in Git-native files, validate references, and retain depends_on solely for direct execution prerequisites. Completed Tickets indicate delivery progress, not automatic proof that a business Goal was achieved. This supersedes the earlier restriction to derived hierarchy, while preserving project scope and independent Ticket lifecycle semantics.",
