  "detail": "When a user opens or names a known project, VibeHub should understand more than a repository or a list of Tickets. The project has a reusable playbook-like Context layer — conceptually similar to CLAUDE.md or AGENTS.md but not committed to one file format — describing how work is normally done: which Linear, Jira, Feishu, GitHub, repository, document, or other systems participate; how Tickets are usually created and scoped; which development, review, release, and communication practices apply; what Agent guidance matters; and what typically counts as completion. The system combines this project playbook with the person's durable Context and fresh external References, then uses an existing language model for semantic interpretation and Ticket planning. The playbook is reusable Context, not a rigid long-workflow engine, a duplicate project-management database, or a mandatory parent for every Ticket. It may reuse existing project instructions and external conventions, should record only durable judgments, and must remain reviewable and revisable as the project changes. Project remains an optional user-facing view and governance boundary; the playbook makes entering that scope cheap without changing the project-independent Ticket model. This decision defines a long-term product interaction principle only and does not authorize a new schema, mobile application, connector, or synchronization service.",
