  "context_id": "decision-project-playbook-context-guides-tickets",
  "detail": "When a user opens or names a known Project, VibeHub should understand more than a repository or a list of Tasks. The Project has a reusable playbook-like Context layer — conceptually similar to CLAUDE.md or AGENTS.md but not committed to one file format — describing how work is normally done: which Linear, Jira, Feishu, GitHub, repository, document, or other systems participate; how Tasks are usually created and scoped; which development, review, release, and communication practices apply; what Agent guidance matters; and what typically counts as completion. The system combines this Project Context with any authorized personal Context and fresh external References, then uses an existing language model for semantic interpretation and Task planning. The playbook is reusable Context, not a rigid long-workflow engine or a duplicate project-management database. It may reuse existing project instructions and external conventions, should record only durable judgments, and must remain reviewable and revisable as the Project changes. Project is the normal owning scope for its Task graph and Room tree, but standalone Tasks remain valid and do not require a synthetic Project. The playbook makes entering a known scope cheap without forcing the user to choose an individual Room during Task creation. This decision defines a long-term product interaction principle only and does not authorize a new schema, mobile application, connector, or synchronization service.",
