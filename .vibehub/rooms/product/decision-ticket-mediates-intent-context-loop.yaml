  "detail": "VibeHub's primary interaction object is one Ticket, not a row of equally styled lifecycle objects or a pile of Tickets. A human Request creates the need for a Ticket; existing long-term Context helps the Ticket emerge with the right contract and constraints. Work inside that one Ticket produces Evidence, independent adjudication produces an Outcome, and the durable learning from the Outcome returns to Context so later intent begins from a stronger base. Request, Context, Evidence, and Outcome are not Tickets and must use distinct visual forms. A later dependent Ticket may exist when causally required, but the public product story should first teach the single-Ticket loop: human intent becomes bounded action, and completed action compounds long-term Context.",
