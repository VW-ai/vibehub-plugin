  "detail": "Dogfooding the production shell against the real Codex app, the owner found that follow-ups typed while a Turn streams are routed straight into the running Turn as a steer, whereas Codex queues them and sends them after the Turn completes; that no model or reasoning effort can be chosen; and that attachment entry points such as the plus menu and image paste are missing. The owner's rule: VibeHub does not need to maintain every Codex feature, but the major ones that daily engineering work depends on must work the Codex way, and similar gaps found by comparison should be closed in the same pass. This reverses the earlier deferral of model and mode pickers. The shell remains VibeHub's own web application driving the official Codex app-server; it uses neither DSH nor Cordis, which belong to the separate DSH carrier.",
