  "context_id": "decision-codex-project-import-binds-the-vibehub-project",
  "detail": "VibeHub does not display the user's Codex repositories or chats that are not part of VibeHub by default. Binding happens by explicit human action: the user selects and matches an existing Codex Project, importing it as this VibeHub Project. Only a single-folder Codex Project is eligible, which keeps the binding consistent with the one-repository v1 scope. Import is the moment VibeHub cold-starts that Project, including Room setup. Once bound, anything created on the VibeHub side syncs to VibeHub by default, chats included, so the imported Project and the VibeHub Project are one workspace rather than two mirrored stores. This preserves the Codex-native way of working while keeping VibeHub's surface free of unrelated Codex history.",
