  "context_id": "decision-vibehub-core-supports-codex-and-dsh-harness-bases",
  "detail": "VibeHub owns the durable human-facing Task, Project, Context, Room, Evidence and Outcome product layer. A Codex carrier uses the official local Codex app-server and should feel like a reskinned Codex with additive VibeHub Task capability. A DeepSeek Harness carrier must remain usable without Codex installed by using DSH Sessions, models, tools, permissions and runtime as its base harness. One user action routes through exactly one selected harness adapter; the product must never run duplicate Codex and DSH Agent loops or maintain a second Task store. Shared UI and product packages may be reused, while adapters expose versioned capabilities and truthful fallbacks for differences such as Projects, audio, approvals, tools and Session or Thread semantics. Codex-first remains the immediate dogfood and quality priority because it is the owner's real runtime, but it is a delivery priority rather than a permanent architectural dependency of the DSH distribution.",
