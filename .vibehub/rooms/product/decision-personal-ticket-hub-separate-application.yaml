  "context_id": "decision-personal-ticket-hub-separate-application",
  "detail": "VibeHub Personal Ticket Hub is approved as a separate sibling application repository within the same VibeHub product and Ticket language. The existing vibehub-plugin remains the repository-local protocol, Skills, execution, Evidence, Outcome, and Workbench surface. The new private vibehub-personal repository owns personal cross-project capture, Inbox and Project projections, and Claude Code/Codex capture Skills over a deterministic local CLI. Personal data lives outside application source in a configurable private data root. MVP ends when the schemas, data core, derived views, and equivalent Claude Code/Codex capture paths work; a local Web view, explicit repository handoff, and the five-record Private pilot remain later dependent milestones. Project is an optional view and routing reference rather than a mandatory Ticket parent, and Personal Ticket state never claims repository execution, merge, production proof, Evidence, or Outcome.",
