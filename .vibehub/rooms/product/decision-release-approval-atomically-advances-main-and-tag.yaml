  "detail": "The owner chose the technically strict publication boundary after the ordinary merge-then-tag race was demonstrated. A calculated release candidate is still presented as a reviewable pull request, but the final authorization is one explicit Release operation rather than an ordinary GitHub Merge followed later by tagging. That operation must compare the current protected main ref with the candidate's recorded expected base, and in one actual atomic Git transaction advance main to the reviewed prepared commit and create v<computed-version> at exactly that same commit. A concurrent main change rejects both updates together. The operation then publishes the verified GitHub Release from the already-created tag in the same trusted workflow. Review remains separate from publication; the operation must not auto-approve, silently merge, force refs, or weaken the computed-version contract.",
