  "context_id": "finding-npx-updates-by-content-not-by-version",
  "detail": "An investigation of the skills.sh CLI (npm `skills` 1.5.23, source vercel-labs/skills), read at the tag matching the published version and exercised live in a sandboxed HOME, establishes that the version-as-cache-key failure has no analogue on the npx path. Nothing in skills.sh reads a declared version — not .claude-plugin/plugin.json's version, not package.json, not skill frontmatter; a grep of the non-test source finds version only for the lock schema, the well-known protocol, and the CLI's own version. plugin.json is parsed solely for its skills and name fields, to locate and group skill directories. Update is decided by content, in both scopes. Global update compares the GitHub tree SHA of each skill's own folder against skillFolderHash in the lock, falling back to a clone plus a git tree hash or a SHA-256 over file contents; project update performs no comparison at all and unconditionally re-runs add for every locked skill. Proven in the sandbox: rewriting the recorded hash to a bogus value while leaving plugin.json at 0.8.0 produced an update, so an unchanged version string does not suppress one. Install tracks the default branch tip and pins nothing — there is no ref, tag, or version flag, and a bare owner/repo records no ref, so every later operation re-resolves the branch. Two consequences for this project. First, retiring host marketplace distribution does not merely reduce install size; it makes the observed 143-commit silent staleness structurally impossible, because the only surviving path never consults a version string. The declared version therefore stops being load-bearing for anyone receiving current code and becomes human-facing release metadata: still worth keeping accurate, no longer a defect that harms users. The CI bump gate drops accordingly from a fix to hygiene. Second, npx installs skill folders only. Installing this repository produced twelve skill directories and nothing else: no manifests, no commands, no hooks, no docs. Verified separately that this costs nothing functional, because no file under skills/ references anything outside it — the Workbench assets live inside skills/vibehub-ticket-review/assets. What a user loses from disk is README, CHANGELOG, LICENSE, docs, and the two plugin manifests, all readable on GitHub. The residual risk to watch is therefore not staleness but completeness: anything VibeHub ever ships outside skills/ reaches nobody on this path, and the global update check would not notice it changing.",
