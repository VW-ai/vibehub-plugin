  "detail": "The phrase whole-application reskin must not be estimated or planned as a thin palette swap. Reaching the selected Codex and Linear quality bar requires an explicit visual system for typography, density, spacing, color, elevation, borders, state, motion, icons, focus, hover, overlays, responsive behavior, and the hierarchy between navigation, Chat, tools, Run progress, Graph, Task Workspace, attention, and Evidence. It also requires inventorying stock DSH components and Theme tokens, resolving components that do not honor tokens, testing additive VibeHub surfaces against the same primitives, preserving accessibility, and maintaining visual compatibility as DSH changes rapidly. This work may be staged after interaction architecture is fixed, but it remains a first-class scoped deliverable with its own acceptance and regression review; estimates for the initial Plugin must not assume that most frontend work is merely copying existing VibeHub logic.",
