  "detail": "In the Peel reproduction, a 1,369-line PRD and 672-line HTML source first produced five Context entries, then 32 after the user asked again, followed by three rework Tickets. The failure was incomplete semantic coverage, not merely poor wording. A territorial file-per-Room split could not represent unrelated claims within one long document. The accepted process deterministically segments all supplied sources, surveys semantic ownership, settles the Room tree, extracts per Room and recomputes coverage. Parallel work is per owning Room rather than arbitrary chunks; citations use exact segment IDs, and nonclaims or duplication require a stated exception. The existing ingest Skill owns extraction, distill owns Room shape/alignment, and no additional user-facing Skill or persistent progress manifest is needed. Existing approved Room trees can be reused without asking for a new taxonomy decision. The old twelve-Skill topology is historical. The work also exposed perpetual-live reference validation: completed Ticket refs had blocked legitimate source renames. Current pointers resolve against the working tree; frozen records retain their historical commit. Operational instructions stay once in the ingest bulk-absorption reference; this note records the reproduced failure and why that design was selected.",
