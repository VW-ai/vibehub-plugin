  "context_id": "decision-authority-context-type",
  "detail": "The user wants VibeHub to hold golden truth for a project, for example a game's contracts and resources or a system's architecture graph, so that Agents follow it during implementation. This is a new Context type named authority inside the existing Room tree, not a separate data room. An authority Context names the repository territory it governs using Room anchor syntax, the canonical artifacts that are the source of truth as current repository paths, the ordered update rules an Agent must follow before changing a canonical artifact, and the validation checks that keep implementation and related Context consistent. It does not require human approval by default; approval is demanded only when the Context itself sets approval to human. Planning attaches governing authority to a Ticket automatically without asking the user to pick a Room; execution reads it before implementing and flags conflicts instead of silently diverging; a change to a canonical artifact is recorded as a change Context relating to the authority in the same change set, and a mechanical check refuses closeout when a canonical artifact changed without that record. The existing contract type keeps its meaning as long-range prose; authority is the artifact-backed sibling. Room anchors remain the drift signal, so canonical artifacts should sit inside the owning Room's territory.",
