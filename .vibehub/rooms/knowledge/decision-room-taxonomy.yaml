  "context_id": "decision-room-taxonomy",
  "detail": "VibeHub restores hierarchical knowledge organization as Rooms. A Room is a bounded workspace, deliberately named room instead of feature because feature is software-specific and VibeHub should eventually help anyone do any kind of work; only the anchor implementation is Git-bound today. Layout: .vibehub/rooms/<slug>/ holds a room.yaml self-description (description, boundary, anchors, alignment state, stale flag) plus the Context entries that belong to that room; sub-rooms are subdirectories, so containment is carried by the path and composition by nesting. Cross-room references keep using relates_to and depends_on; containment is never expressed as a relation. Identifiers are semantic kebab-case slugs. Sequence numbers (001, 002) are rejected because they collide under parallel work and imply a false global order; hashes are rejected as a regression to the unreadable CAS store; timestamps are rejected because rooms are spaces, not events. Slug collisions are treated as a signal to split the boundary finer. Timestamps such as created_at live inside file content, never in filenames. This rebuilds, in Git-native human-readable form, the taxonomy that commit 74ab68f deleted together with the CAS semantic store; the flat context model that replaced it could not express feature membership or assembly, which a real dogfood project demonstrated.",
