  "context_id": "decision-stale-origin-layers",
  "detail": "The stale channel splits into two origins, mirroring the distill: source-ref layering. A mechanical mark — written when drift is deferred at ticket start — uses a drift: prefixed reason; it is derived state and may be cleared by realignment whenever recomputation against the current tree shows the anchors fresh. An unprefixed reason is a semantic claim by a human or an agent exercising judgment (the spec is wrong in a way hashes cannot see); it is knowledge, preserved across merges and cleared only by addressing the reason. This makes merge resolution mechanical where it can be and honest where it cannot: drift reports for a stale room whether its hashes currently match, so a drift:-prefixed mark with fresh hashes is clearably stale-stale, while an unprefixed mark always reaches a human or judging agent. The convention lives once in the knowledge-governance reference.",
