  "context_id": "decision-ambient-two-mode-distill",
  "detail": "Distillation is restored in two modes. Cold start: when a checkout has no rooms/ tree, a full-repository distill builds the initial room taxonomy. It runs once per project (at setup or the first ticket), is allowed to be perceptible, and must be resumable with per-room progress so large repositories can continue after interruption. A recursive lazy variant (distill only the neighborhood of each ticket, backfill later) was explicitly rejected: distill-before-ticket recursion makes every ticket's startup path unpredictable, which is worse than paying the full cost once. Update: at every ticket-plan start, a deterministic mechanical drift check (see decision-drift-check-snapshot-hashes) classifies rooms; the agent semantically reconciles only rooms the current ticket enters, and unrelated drifted rooms are merely marked stale with a reason — align-on-use, so each ticket's alignment cost is proportional to the rooms it enters, never to the whole project's debt. Governance: there is no runtime activation gate. Distilled output carries distilled provenance and is the lower-trust layer; human-ingested decisions and constraints win conflicts; PR review on Git is the human gate. User perception target for a normal ticket start is a single line such as: Aligned 2 rooms (3 files drifted).",
