  "context_id": "decision-drift-check-snapshot-hashes",
  "detail": "The mechanical room drift check treats per-file blob hashes as the only ground truth. At alignment time, vh align resolves each room's anchor globs and records filter-clean blob hashes per file plus last_aligned_commit and checked_at, written atomically by the script — agents never hand-edit the alignment block. The check takes one snapshot: git ls-tree -r HEAD for committed blobs overlaid with git status --porcelain -uall --no-renames for the working tree, resolves anchors against it, and set-compares against the recorded hashes: differing hash means changed, recorded-but-missing means deleted, present-but-unrecorded means added; any hit is DRIFTED with exact file lists, no hit is FRESH; a missing rooms/ tree is COLD_START. last_aligned_commit is demoted to provenance plus a direction check: if merge-base --is-ancestor shows HEAD is behind the baseline, the checkout is old and the room is a WARNING — specs must never be realigned backwards to older code. An adversarial audit with sandbox git experiments forced this design: baseline-commit diffs silently drop the old path of renames unless --no-renames is used (a moved-out room would look FRESH), porcelain collapses untracked directories unless -uall is used, and stamping HEAD while aligning a dirty working tree makes commit-based diffs report already-aligned content as drift forever; snapshot-hash comparison closes all of these structurally, survives fresh and shallow clones and gc, and is revert-immune. Stale is the union of two channels: computed drift, and a manual stale flag with reason in room.yaml that captures semantic staleness hashes cannot see; deferred drift is written back as a manual stale mark so the channels back each other up. Glob matching must respect path-segment boundaries (src/auth must not match src/authx). Submodule interiors are out of scope for v1.",
