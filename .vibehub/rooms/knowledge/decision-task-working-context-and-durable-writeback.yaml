{
  "context_id": "decision-task-working-context-and-durable-writeback",
  "detail": "A Task is the Context Space on which Humans and Agents operate. Its working Context preserves the Objective, constraints, selected Context references, conversation Streams, Agent Sessions, execution events, attachments, Evidence, and state history needed to leave and resume the work. Completing a Task must produce a durable result: accepted Outcome, reusable Evidence, decisions, and relevant Context proposals are written back through the owning Project's governed Context protocol. Raw tool calls, transient reasoning, repeated messages, and full execution logs remain inspectable within the Task but are not automatically promoted into long-lived Project Context. This preserves provenance and resume ability without polluting the Context OS. Reading Context from another Project does not grant writeback authority there.",
