{
  "context_id": "decision-context-always-roomed",
  "detail": "The flat .vibehub/context/ directory no longer exists as a home for Context. Every Context entry is placed in the lowest room that owns its claim; knowledge spanning several rooms belongs to their lowest common ancestor room, and when no such room exists one is created (for this repository, a top-level product room holds product-wide decisions). vh context put requires --room, so placement is always an explicit judgment. A leftover populated .vibehub/context/ is a visible validation error that instructs migration into rooms; it is never silently ignored, because silent ignoring would be knowledge loss. This closes the coexistence the initial Room rebuild left open: the earlier layout kept genuinely cross-room entries at the root, which created two places to look and an ambiguous placement rule.",
