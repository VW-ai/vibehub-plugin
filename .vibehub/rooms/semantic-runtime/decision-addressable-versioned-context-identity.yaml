  "context_id": "decision-addressable-versioned-context-identity",
  "detail": "The online service's core experience is that every Context and change can be linked precisely. A logical Context URL resolves to the current accepted view and visibly reports newer versions or conflicts; an immutable version URL always resolves to the exact content that a person or agent consumed; a Proposal URL identifies one working variation. Citations store both context_id and version_id, not only a moving alias. Opening an older version shows its relationship to current canonical state and any active conflict. Context identity therefore survives content evolution, while immutable revisions preserve reproducibility, audit, rollback, and point-in-time agent behavior.",
