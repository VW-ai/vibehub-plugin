  "detail": "用户提出团队设备通过 Tailscale 访问各自数据服务，利用本地数据和私有组网协作。当前是候选部署方向，尚未选择或配置。私有互联、单协调节点加本地缓存、可离线多写副本是不同工程深度；Tailscale 解决连接，不自动解决应用数据复制、一致性、版本冲突或离线可用性。完整 P2P/重连同步后续独立验证，不阻塞单机多 session/多探索的产品验证。模型调用的数据去向仍单独受授权约束，不因为传输私有就声称全部推理本地化。",
