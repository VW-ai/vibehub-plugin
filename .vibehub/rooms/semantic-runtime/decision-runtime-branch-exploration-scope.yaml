  "detail": "用户接受按 branch 或 worktree 分开探索，同时明确一个 worktree 可有多个 session、一个 Ticket 可由多个 worktree 推进。产品隔离单位是可持续追溯的一条探索；Git branch/ref 是其代码关联，worktree 是本地执行实例，session/execution 是参与记录，不能把名字或目录当作全局语义身份。稳定 exploration ID、branch rename/switch/delete/recreate、同名分支跨 repo/clone、detached HEAD 以及非 Git 工作的具体映射是下一项契约任务要验证的工程方案，尚未宣称现有实现支持。不同探索可对同一主题保留不同假设；只有作用域及共同义务重合时才判断业务冲突。",
