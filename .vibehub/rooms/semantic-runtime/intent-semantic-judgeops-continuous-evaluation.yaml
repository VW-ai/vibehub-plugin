  "detail": "Fast semantic policy nodes are product behavior and must evolve through a repeatable CI/CD-like method rather than ad hoc prompt testing. Each evaluation pins the sanitized corpus and point-in-time state, evaluator-only labels, semantic questions and thresholds, model behavior descriptor, transport, and normalized input hashes. Runs record action distribution, per-family precision/recall/coverage and target metrics, abstention, latency, tokens, cost when available, route, rate limits, retries, cache behavior, and downstream consequences. Successful decisions checkpoint by behavior descriptor and input hash so interrupted runs resume safely. Model or policy upgrades replay the same inputs, expose disagreements, keep calibration and productization claims explicit, and advance only through defined gates. The long-term goal is measurable agent development: semantic nodes are tested like software components while downstream task success and repeated-work reduction remain the decisive product metrics.",
