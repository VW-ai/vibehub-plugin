  "context_id": "contract-runtime-outbox-cursor-follows-durable-publication",
  "detail": "Agent-origin engineering constraint surfaced by the platform spike, delegated from Ticket Run to Ingest for the later store, journal and session-delivery adapters. PostgreSQL sequence allocation is not transaction commit order. Example: transaction A allocates 10 and pauses; B allocates 11 and commits; a consumer advances to 11; A commits 10 afterward and a naive WHERE sequence > 11 poll loses it. The production adapter needs a durable scoped publication order, for example a per-scope cursor row locked and advanced in the same transaction as state/outbox publication, or another explicitly proven gap-safe protocol. NOTIFY may wake a reader but does not replace durable replay state. Later acceptance must exercise reversed completion, rollback/gaps and reconnect without omission or duplicated effects. The disposable platform spike uses an identity counter for its bounded single-job/serialized-state proof; its notification test is not production concurrent-cursor conformance. This is not a platform selection or a claim that the future delivery adapter is implemented.",
