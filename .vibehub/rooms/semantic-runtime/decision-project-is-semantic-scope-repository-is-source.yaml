  "context_id": "decision-project-is-semantic-scope-repository-is-source",
  "detail": "The online service must not equate a Project with one Git repository. A Tenant or Workspace owns Projects; a Project represents the product or human goal and may include multiple Repository memberships; a Repository contributes code, commits, pull requests, and source identity; Workstreams or Tickets express bounded work across those repositories; Executions identify the agent, session, branch, or worktree that performed an action. Every Event, State, Decision, Context reference, and audit record needs explicit tenant_id and project_id plus repo_id, workstream_id, execution_id, and source revision where applicable. Project-level Context may omit repo_id. The storage model should use explicit ProjectRepositoryMembership so it can later represent controlled many-to-many membership even if the first release restricts one repository to one active Project.",
