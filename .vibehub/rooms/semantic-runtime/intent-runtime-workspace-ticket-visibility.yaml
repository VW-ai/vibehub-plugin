  "detail": "用户希望不属于当前 workspace 的 Ticket 可以先不管、不看。按产品意图提供当前工作区相关、在此创建、在此参与/执行完成/验收、项目全部及归档等视图，并能看到归属原因。当前相关性不能只按创建地判断：A 创建但 B 正在推进的 Ticket 仍应出现在 B。当前界面隐藏、个人/工作区归档偏好与共享 Ticket 状态、业务取消、物理删除是不同操作；这次讨论不授权删除任何记录。隐藏外部 Ticket 时，当前可见任务所需依赖可保留权限允许的最小引用/阻塞提示，不能伪造依赖消失或完成。具体默认筛选和恢复入口通过 UX 原型验证；可见性偏好不应改变 Agent 的 governing Context 或验收事实。",
