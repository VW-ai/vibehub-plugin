  "detail": "Policy Graph 决定何时做什么；Semantic Working Graph 保存实体、关系、候选、证据、来源和版本。将现有 Skill 能力分别实现为确定性操作、bounded Judge 和需要推理的结构化工作流，不能以万能 prompt 代替执行架构。查询服务承担 scope、检索、关联、过滤和 context 编译；写入先可靠接收 event，再按 policy 抽取、归一、关联及安排必要的沉淀。用户无需反复手动唤醒领域 Skill，但宿主仍须接入采集、query/tool 注册和实际支持的交付时点。API/MCP/tool 描述本身不能保证逐条采集所有消息或主动唤醒任意宿主。",
