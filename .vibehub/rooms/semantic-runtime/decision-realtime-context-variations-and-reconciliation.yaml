{
  "context_id": "decision-realtime-context-variations-and-reconciliation",
  "detail": "Realtime team awareness and canonical mutation are separate operations. Each Agent or workstream may publish an immediately visible sparse Proposal based on base_version_id without rewriting the shared Context. Its effective view is accepted Project Context plus its own workstream overlay and relevant conflict headlines from other workstreams. Promotion uses optimistic concurrency: unchanged bases can advance; orthogonal changes may auto-rebase; semantically equivalent changes may collapse while retaining provenance; contradictory changes remain multiple candidate heads and create a first-class Conflict. The last accepted canonical version stays stable but becomes contested until a reconciliation worker or authorized human produces a resolution version with all relevant parents. JEV or another fast judge may detect relation, contradiction, impact, and escalation need, but it does not silently choose high-impact truth. This applies score frequently, mutate rarely to both agent context and shared project state.",
