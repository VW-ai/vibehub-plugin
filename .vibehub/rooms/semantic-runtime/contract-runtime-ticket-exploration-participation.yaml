  "detail": "一个 Ticket 可以在多个探索或 worktree 中推进，一个 worktree 可以有多个 session，也可承载多个 Ticket 的执行。不要机械复制 Ticket 或把整个 Ticket 的完成状态绑定到某个临时目录。每次执行的进展、Evidence、proposal 与其 Ticket/Acceptance 版本及探索/来源关联；不同探索的证据不能无条件替代另一版本的验收。项目级共享约束仍可约束多个探索，局部隔离也不能消除同一探索内多 session 的并发。",
