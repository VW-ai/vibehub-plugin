  "context_id": "contract-runtime-commit-uncertainty-preserves-command-identity",
  "detail": "Agent-origin implementation contract from the independently accepted Policy kernel, delegated by Ticket Run to Ingest for downstream journal/store adapters. A transaction has one linearization point for graph state, command, receipt, audit and outbox. Cancellation, timeout, transport rejection or malformed acknowledgement after dispatch can leave the commit outcome unknown. The kernel returns indeterminate/commit_unconfirmed with the requested action and exact scoped command_ref instead of claiming clean cancellation. Recovery must look up or retry the identical idempotency key and complete payload digest; it must not invent a new logical key. A not_found receipt lookup is only a read-time observation and cannot prove an in-flight commit will never publish. Only a trusted adapter can confirm not_committed or cancellation before publication. Future durable journal/store implementations must preserve this distinction; current proof is volatile conformance, not production durability or a human platform selection.",
