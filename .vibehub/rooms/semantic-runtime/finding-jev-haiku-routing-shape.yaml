  "detail": "The accepted 20-event and 80-decision Peel comparison found that Claude Haiku had higher recall and coverage in every family and was clearly stronger on Context relevance, while JEV retained higher acceptance target precision and independently schedulable-work precision. Durable-value evidence was too sparse for a broad conclusion. The observed Claude CLI route was much slower and more expensive than JEV, but CLI process latency is not Haiku API latency. The working routing hypothesis is a cascade: JEV handles the fast first pass and high-precision gate, while low-confidence, ambiguous, Context-heavy, or durable-value cases may escalate to a stronger model. This is a corpus-scoped hypothesis, not a permanent model choice; family-specific thresholds and downstream outcomes need continued calibration.",
