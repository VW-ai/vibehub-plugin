  "detail": "The immediate product goal is to put a minimal Semantic Runtime service online quickly, measured in days rather than a long platform build. The smallest valuable slice should prove stable Context and version links, Project and Repository registration, ContextVersion and Proposal creation, optimistic promotion, visible Conflict state, and a realtime activity feed or pull surface for multiple agents. It should reuse the existing provider-independent policy and audit core, use official direct JEV as the initial fast-route candidate with fallback, and preserve ignored/private data boundaries. The alpha should avoid a general graph database, generic CRDT, full enterprise administration, every external connector, and automatic high-impact canonicalization. Those are follow-up capabilities only after the addressable collaboration loop works end to end.",
