  "context_id": "decision-semantic-runtime-strong-service-boundary",
  "detail": "VibeHub's next product layer moves beyond a weak harness that attaches Skills or plugins to individual sessions. Semantic Runtime is the service/kernel that continuously accepts work signals, maintains derived semantic working state, executes provider-independent policy, exposes referenceable query and context-compilation surfaces, and schedules bounded reconciliation work. It is developed in this repository under semantic-runtime/ so existing project history stays available, but it owns separate dependencies, tests, release boundaries, and provider adapters; the shipped Skill plugin must remain independently installable and ordinary agent work must continue when Runtime is unavailable. Git remains code and artifact truth. Whether durable Context eventually becomes cloud-owned or hybrid remains an explicit later decision rather than an assumption of this direction.",
