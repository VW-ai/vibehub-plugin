  "detail": "Agent-origin transport contract from the independently accepted Worker protocol, captured for downstream scheduler and result-ingress work. The WorkerNode enqueue-success edge acknowledges durable job submission; it is not automatically the business route for a later reasoning result. A Job continuation pins an artifact and existing node as a trusted routing hint. The existence/pin check does not authorize entering an arbitrary node or bypassing guards. The later result-ingress adapter must define and validate explicit result-route/new-run entry semantics, with current scope, ACL, freshness and attempt fences, rather than mutating the original PolicyRun snapshot. A succeeded Worker Result retains proposal-only authority and never declares canonical promotion or acceptance. Business instructions and output-schema digests are pinned in immutable Worker operation config; structured business documents travel through exact scoped artifact refs and separate digest/schema validation, not free-text summaries. This records the current protocol boundary, not implementation or acceptance of the future scheduler/result-ingress Tickets.",
