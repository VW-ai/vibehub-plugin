  "detail": "在用户要求开动且避免 over-engineering 后，按已有 local-service-profile Ticket 实现单进程 loopback HTTP 状态入口与 Node 内置 SQLite bootstrap。此为 Agent 在既有技术授权内的工程选择，遵循 Tech Design §18.1；不是用户选择云端平台。无新增生产依赖，无 Docker/数据库 daemon/桌面壳；bootstrap 数据库与 replay、未来域存储隔离，HTTP 仅暴露非敏感状态。Auth、项目注册/开关、provider、Collector、Policy/Graph、Worker 留在各自已规划 Ticket。完成的 Node/Postgres spike 仍是未来 hosted 方案输入，不能强制本地安装 PostgreSQL。",
