{
  "context_id": "constraint-cross-repo-state-uses-causal-watermarks",
  "detail": "A multi-repository Project has no natural total commit order. Runtime may keep one append-only ingest ledger, but the project semantic projection must state the source cursor or watermark through which each Repository, connector, and Execution has been observed. Causal links and per-source ordering are preserved; observed_at is not treated as truth order. A materialized Project view therefore says which repository revisions and connector cursors it reflects. Eventual semantic consistency is acceptable, while canonical promotion still requires explicit authority and provenance. This makes staleness inspectable and prevents an apparently current project graph from hiding lag in one source.",
