  "detail": "VibeHub is not marketed as a plugin or as another coding agent; the plugin is only the lowest-friction install form. The category claim is the Task layer for coding agents: a Task is an agent-runnable Context package (Objective, selected Context, acceptance contract, dependencies, authority boundary, execution trace, Evidence, Outcome, Context writeback). The human only manages the Task; everything below it is infrastructure and only what needs human judgment rises to the Task. Three supporting propositions, repeated everywhere: (1) Chat is not a unit of work. (2) Memory is not enough — memory preserves what was said, VibeHub preserves the development cycle. (3) Agent work needs evidence, not confidence — deliberately demoted from headline to trust mechanism: Evidence is what lets the user NOT supervise the Agent ('Don't supervise the Agent. Inspect the Outcome.'). Contrast line: Linear tells your team what should happen; VibeHub gives Agents what they need to make it happen and brings back what was learned. Chinese form: 你不是来管理 AI 的，你只是想把事情做完。管理 Task，其余交给 VibeHub。",
