  "context_id": "decision-large-media-via-dvc-on-r2",
  "detail": "Chosen 2026-08-23 after the first push of ~90MB of renders was slow and the branch history was rewritten (git filter-repo, force-push of the unmerged branch) to drop them. Google Drive as a DVC remote was tried and abandoned: Google blocks DVC's unverified OAuth client for the sensitive Drive scope, and an own OAuth client in Testing mode expires weekly. R2 is free at this volume, has zero egress, and needs no OAuth — S3 keys go in .dvc/config.local (gitignored), never in chat or in git. DVC lives in its own venv (~/.cache/vh-dvc) because dvc[gdrive] pulled incompatible pyOpenSSL/cryptography into the system Python. Workflow: render → dvc add → dvc push → commit the pointer; dvc pull on a fresh machine. Verified by a byte-identical round trip.",
