  "context_id": "convention-publish-video-render",
  "detail": "Local: DVC lives in ~/.cache/vh-dvc (own venv). Credentials are never in git or chat — ~/.aws/credentials has a [r2] profile and .dvc/config references profile = r2. Steps: npx hyperframes render assets/video/<clip> → assets/video/audio/mix-<clip>.sh (after audio/fetch.sh) → dvc add renders/<clip>-vN.mp4 → dvc push → git commit the .dvc pointer and renders/.gitignore → optionally gh release upload <tag> for a stable public URL (Releases are the public archive; R2 is the working store). CI (.github/workflows/media.yml): verify-pointers fails any PR/push touching assets/video/** whose pointer has no object in R2; the render job (workflow_dispatch: clip, mix, release_tag) installs ffmpeg + Chromium, pulls footage and stems, renders, mixes, pushes to R2, commits the pointer as github-actions[bot], and optionally uploads to a Release. The Cloudflare account id 72091e7e079e357ced7f9603c03a926e and bucket 'vibehub' are not secrets and sit in .dvc/config. Rotate the S3 key pair in Cloudflare if it is ever exposed (the first pair was pasted into a chat on 2026-08-23 and should be rotated).",
