  "detail": "Workflow is preview → lint → check → render. Every timed element needs a stable id; a <video> with data-start must be a direct child of the stage or it renders frozen (caught by the linter in the sample). Overlay timecodes must not exceed the underlying clip's duration. State dimensions explicitly (9:16 for 小红书) or the default is 1920x1080. Prompt skeleton: duration, dimensions, mood, structure (hook → beats → end card), media (voice/music/footage), specifics. Tell the agent to use catalog blocks rather than reaching for Three.js/Lottie. Music level stated explicitly (e.g. subtle BGM under -18dB); captions 40–50 chars per segment with a font that covers Chinese. Expect ~3 min local render per 30s of 1080p. Division of labor: Wayne writes only the storyboard/narrative; the Agent records, composes, renders, and returns the MP4 for review.",
