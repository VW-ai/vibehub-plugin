  "detail": "Narration was tried with local Kokoro TTS (voices bf_emma, af_bella) on 2026-08-23 and rejected by the owner: flat delivery with no emotion, no 起承转合, zero gaps between lines felt suffocating, and reading the on-screen captions aloud sounded wrong. Decision: no voiceover. Structure instead: 起 (0–5.5s) the sentence alone, clean quiet Bach Goldberg Aria; 承 (5.5–16s) agents appear slowly then faster, camera drifts/pauses/jolts/tilts with focus hunting, the same recording low-passed with vibrato and tremolo fades in and keeps growing; 转 (16–19s) the shaking continues under the caption 'Lost in the agent sessions.' (owner replaced 'Where is it now?' as too abstract) — the music is NOT cut; 合 (19s→) the camera settles, light closes in, clean Aria returns over 2.5s. glance uses Schubert Impromptu Op.90/3 (CC BY 3.0, Chiara Bertoglio) throughout with two gentle lifts. Music must be freely licensed recordings, not just public-domain compositions; Rachmaninoff Op.32/10 (CC BY) auditioned and set aside as too heavy. Owner's taste: Rachmaninoff, Bach, Schubert. Mixing is ffmpeg (assets/video/audio/*.sh) after the silent HyperFrames render.",
