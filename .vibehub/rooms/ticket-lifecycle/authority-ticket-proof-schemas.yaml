  "context_id": "authority-ticket-proof-schemas",
  "detail": "A Ticket's acceptance identities, Evidence bindings and Outcome contract revisions are semantic proof objects. Changing their schemas or the identity contract changes what counts as proof for every closed Ticket in every project, so the change is a product decision: append-only revisions, deterministic identities, and explicit migrations are non-negotiable, and a person decides before the canonical documents move. Current Ticket status is an explicit task record. Optional historical proof does not require an execution or closeout workflow, and these identity protections do not restrict ordinary conversation.",
