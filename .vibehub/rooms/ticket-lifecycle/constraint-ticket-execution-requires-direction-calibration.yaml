  "context_id": "constraint-ticket-execution-requires-direction-calibration",
  "detail": "A clear procedure is insufficient if an Agent can execute it correctly while moving in the wrong direction. The Ticket design must include an explicit calibration mechanism before and during execution: name the intended user-visible or architectural outcome, identify material progress signals, budget ceremony relative to implementation risk, and stop or replan when repeated work produces no proportional outcome. A 60–90 minute material-result checkpoint is a useful starting example, with task-size and risk-aware override rules to be designed. A checkpoint must evaluate outcome progress rather than count commands, commits, tests, Evidence, or elapsed effort. The mechanism belongs in the prompt and validation contract so it is difficult to omit during autonomous long-running work.",
