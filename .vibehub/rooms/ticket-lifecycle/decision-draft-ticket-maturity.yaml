  "context_id": "decision-draft-ticket-maturity",
  "detail": "Rolling-wave planning becomes canonical. A ticket may carry an optional maturity: draft marker (absence means firm; every existing ticket stays valid). A draft states the real direction in outcome and context but its acceptance may be coarse placeholders — at least one criterion always, because intent is never empty. The mechanical rule: a draft whose dependencies are all satisfied surfaces as REFINE, never READY, so an under-defined ticket is structurally impossible to execute; the frontier excludes drafts unconditionally. Refinement is owned by planning: when prerequisites close or the awaited human input arrives, ticket-plan re-enters with the accumulated results, rewrites the acceptance for real, and removes the maturity marker in place — the same ticket_id, so Git history preserves the evolution from sketch to firm. This models the owner's scenario: a big project planned day one keeps the whole road visible (a human-input blocker ticket in the middle, a chain of drafts behind it), and each draft firms up only when what it depends on is actually known. Draft is orthogonal to human-authority marking: the authority badge says a human must decide here; draft says everything behind this is still a sketch. Visual treatment in the workbench belongs to the rooms-surface design proposal and its owner-approval gate.",
