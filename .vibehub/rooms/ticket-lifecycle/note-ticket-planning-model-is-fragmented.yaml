  "detail": "The checked-in Ticket schema defines an independently executable record with only depends_on relations. The product concept document separately describes Goal → Epic → Ticket containment and links a planning-hierarchy contract that is absent from the repository. The dashboard can read personal Goal relations named task_of and sub_goal_of, while the current product decision rejects a canonical Parent/Child Task ontology in favor of dependency edges and topology-derived clusters unless dogfood proves durable containment operations. This fragmentation makes it unclear whether Goal, Epic, parent/child, dependency, and visual cluster are product entities, execution semantics, or presentation only. The new design work must reconcile these sources rather than adding another parallel hierarchy.",
