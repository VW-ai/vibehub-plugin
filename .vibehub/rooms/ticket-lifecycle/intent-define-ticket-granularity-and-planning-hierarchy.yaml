  "context_id": "intent-define-ticket-granularity-and-planning-hierarchy",
  "detail": "VibeHub's procedure is strong and reviewable, but the unit it operates on is underdefined. The design must state what makes work one Ticket, when a deliverable should remain whole, when independently schedulable child work is justified, and when dependencies, Goal or Epic containment, or derived visual clusters express the relationship better than parent/child Tickets. It must account for human review capacity: a graph with many mechanically tiny Tickets is not acceptable merely because every node is individually valid. The recent Semantic Runtime refactor is the primary failure case: file-level Tickets repeatedly paid planning, evidence, closeout, validation, and reporting overhead while obscuring the capability-level outcome. This is a product and prompt-design problem, not just a one-off planning mistake.",
