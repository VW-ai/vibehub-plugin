  "context_id": "contract-ticket-record-progress",
  "detail": "Project format 6 uses Ticket schema 4 with recorded status open, in_progress or done. Progress entries have stable update IDs, a summary and optional references; repeating the same update is a no-op, and reopening appends another update to the same Ticket. Acceptance criteria are optional task definition, not permission to begin. A direct unsatisfied prerequisite blocks only an open Ticket; in_progress and done remain recorded facts even when a prerequisite later reopens. Dependency edges are direct prerequisites, not parent ownership. Maturity and deterministic next-Skill routing no longer govern current tasks. Completing a task needs no Evidence or Outcome object. Existing acceptance identities, contract revisions, historical proof and frozen context references keep their original meaning and are never rebound to newer work. Current/all graph scope and delivery queries derive from recorded task status and explicit membership, with no inferred run state.",
