  "detail": "The original audit at 59de368 examined 105 Tickets, 307 Evidence records, 95 Outcomes, 94 successful Outcomes and 43 archived tasks. It found 24 Evidence and two Outcome semantic-drift cases. These are dated audit counts, not current repository totals. Reconstruction uses the first appearance of each proof on the current Git ancestry, not unrelated branches collected through --all, timestamps or present filenames. Git co-presence proves what was recorded together, not private evaluator intent. The owner rejected marking all legacy proof stale, grandfathering every old success onto a changed current contract, and calling every known drift unresolved. Acceptance keeps a stable logical ID and monotonic immutable revisions; a new independent obligation gets a new ID, split/merge keeps lineage, retirement preserves history, and contract identity commits the exact acceptance revision set. Evidence binds an exact acceptance revision and Outcome an exact contract. A changed contract never silently rebinds old success. Migration explicitly reconstructs where history suffices, reserves legacy-unresolved for absent/ambiguous history, remains idempotent and preserves rollback proof. Under format 6 these historical proof rules do not derive current task status or dictate a next Skill.",
