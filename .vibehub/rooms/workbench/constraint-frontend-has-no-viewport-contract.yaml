  "context_id": "constraint-frontend-has-no-viewport-contract",
  "detail": "The shared frontend assets keep graph pan and zoom as closure-local state in app.js with no storage of any kind, and the only URL contract they read is ?ticket=<id> and ?view=<execution|contract|log>. Anything outside the shell that wants to address, restore, or hand off a viewport therefore cannot do so today: the macOS Workbench shell restores recent repositories, window frame, last Ticket, and last inspector tab, but honestly declines to restore pan and zoom rather than faking it, because adding a viewport contract would mean changing the shared frontend rather than the lifecycle adapter. This binds future work in both directions. Deep link, presence overlay, Inbox, and any later shell feature may address a Ticket and an inspector view but must not claim viewport addressing until app.js gains an explicit viewport contract; and adding such a contract is a shared-frontend change that belongs to the surface, must keep every consumer of the read-only API working, and must keep pan and zoom disposable view state rather than durable product state.",
