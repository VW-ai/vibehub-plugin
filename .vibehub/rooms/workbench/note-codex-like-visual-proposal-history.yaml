  "detail": "The visual proposal used a full-bleed causal canvas, compact header, on-demand overview, progressive right inspector and narrow-screen bottom sheet. Whole-card semantic treatment, human attention distinct from phase, causal focus, stroke icons, system/monospace typography and neutral focus were specified for review at 1440, 1180 and 390-pixel widths. The prototype token JSON and state matrix are retained under test/fixtures/ui-proposals/codex-like-workbench. Their old READY/REFINE/deviation examples are historical fixtures rather than current format-6 state authority. Current shared layout, scope and accessibility constraints own production behavior; the proposal records the considered visual rationale and exact review states.",
