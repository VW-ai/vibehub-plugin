  "context_id": "decision-dashboard-classifies-worktree-format-before-graph-load",
  "detail": "A connected worktree is not graph-readable merely because it contains .vibehub/version.yaml. Before invoking Ticket graph validation, Dashboard discovery must classify each worktree as current, migration required, unsupported newer, malformed, or unavailable using the same compatibility and migration registry as the engine. Current worktrees remain usable. Legacy worktrees receive a visible Upgrade required state naming the exact path and detected-to-target format transition, plus a copyable Agent handoff or immutable release-paired upgrader when one exists. Malformed, unsupported-newer, and unavailable worktrees preserve actionable structured detail without leaking tokens or unrelated filesystem information. The Dashboard remains read-only: it never migrates, commits, stashes, resets, or pushes a worktree, and one incompatible worktree must not prevent current siblings from being inspected.",
