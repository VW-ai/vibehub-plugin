  "detail": "The production Workbench must not import the proposal's full visual treatment. Card-top dashed versus solid accents are unnecessary and should not become a primary phase language. Preserve the existing production card anatomy and use new motion only for a trusted live execution effect; when no trusted runtime fact exists, never imply activity. Reuse the existing upper-right card space for one deterministic substate such as NEEDS YOU, BLOCKED, DEVIATED, VERIFYING, or WAITING rather than adding another band, badge system, or color axis. READY and RUNNING must remain visually distinguishable and must not simply share one color treatment; final production colors and motion should fit the existing quiet Workbench rather than the proposal board. In the focused Ticket panel, Recommended action is the most important hierarchy and should be materially more prominent than supporting lifecycle, proof, and metadata. For the current lightweight Plugin, actions primarily assemble and copy the exact context-aware prompt or handoff into Chat; do not pretend the read-only Workbench can directly execute or mutate work. A future DeepSeek Harness Plugin may replace that copy boundary with a native action while preserving the same Task semantics. Outside these bounded changes, keep existing graph, panel, Inspector lenses, Context, Evidence, history, and navigation interactions stable.",
