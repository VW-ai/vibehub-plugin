  "detail": "The unified Dashboard is a continuation of the accepted Workbench rather than permission to discard proven graph behavior. Its graph must offer left-to-right as the desktop default and top-to-bottom as an explicit first-class choice over the same canonical Tickets and relations. Both orientations must use one deterministic dense-layout contract that preserves causal ranks, stable non-overlapping cards, distinct ports, complete relations, and selected causal focus. Status visibility must be composable rather than an exclusive All statuses selector: users must be able to hide Completed in one direct interaction while retaining any meaningful combination of the other states, and board and graph must apply the same semantics. Direction, filters, selection, pan, and zoom are explicit disposable view state, never durable project truth. Restoring these affordances must not roll back the new Dashboard's navigation, Inspector, Context surfaces, or clearer information architecture.",
