  "detail": "The research studied official Codex, Linear, Raycast, Things, Notion, Msty, Superlist and OpenHands material for task navigation, conversation branching, comparison, context inspection, human attention and review. Candidate A Focus Route favored a clear focused workspace, B Spatial Lens emphasized graph context and zoom, and C Live Split kept parallel work visible. The author recommended A; this was a recommendation rather than owner approval. Chat and task remain distinct work modes, context selection must be visible, a fork expresses thought provenance rather than automatic task hierarchy, and bring-back preserves selected conclusions instead of concatenating raw histories. The accompanying rc.8 extension investigation was source-level evidence, not the earlier rc.7 boot result or a completed fresh build. Exact research links, candidate descriptions, examples and evidence limits are retained in the pinned report. Existing apps/harness-interaction-research presents the comparison as an exploration artifact.",
