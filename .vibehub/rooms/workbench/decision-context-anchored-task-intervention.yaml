  "context_id": "decision-context-anchored-task-intervention",
  "detail": "Understanding, discussing, updating, and intervening in a Task are one continuous Context-Space interaction rather than separate product zones. Selecting a Goal, Constraint, Evidence item, Agent step, file region, or conversation message supplies an explicit anchor, so Discuss, Edit, Attach, Fork, or Remember can operate without a general intent-classification module. Approval and rejection remain distinct explicit interrupt actions because they resolve a waiting execution boundary rather than merely add information. A Human message to a running Task is addressed to the Task Context Space, not exposed as a requirement to talk to a particular Agent Session. The runtime adapter should prefer continuing a waiting Session, resumable interrupt, safe queued steering, or a structured Context-changed event. Forking is reserved for explicit parallel exploration or used only as a compatibility fallback when DSH cannot safely steer the active execution. The exact DSH mechanism is deferred to the targeted feasibility Spike. Dragging files and links may later become a polished interaction, but implicit placement or meaning must not depend on hidden intent classification when an explicit anchor or scope action can be offered.",
