  "detail": "Content clarity is the governing priority. A visitor must understand what VibeHub is, how to start, and why the Ticket-driven cycle is useful without learning a novel interaction or selecting objects. The public website borrows the Ticket graph's visual language only to organize that explanation. Normal vertical page scrolling is primary; horizontal canvas travel is removed. The hero and first-layer install action occupy the upper-left, while a clearly legible Ticket path advances diagonally toward the lower-right through Product, use cases, and documentation. Core meaning is visible without selecting a Ticket; selection may expose optional depth only. Ticket typography, object shapes, icon hierarchy, connector treatment, and semantic color established here become design input for a later local Workbench refinement, but the installed UI will not copy the public composition literally because its operational interaction needs differ.",
