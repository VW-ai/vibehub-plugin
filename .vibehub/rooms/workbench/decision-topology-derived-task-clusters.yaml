  "detail": "The multi-Project Work Graph may visually compress related Tickets into expandable Task clusters without introducing a canonical High-Level Task, Low-Level Task, Parent Task, Subtask, or Group entity. Cluster membership and stable identity are derived from the existing directed acyclic dependency graph within Project scope. Candidate clusters may use transitive reduction, convergence or acceptance frontiers, post-dominator-style upstream cones, boundary cost, overlap detection, and compression benefit; the exact algorithm remains implementation work. A convergence Ticket or a small terminal frontier may act as a structural anchor, while shared prerequisites remain outside or appear as non-owning stubs. Cross-cluster dependency edges remain exact Ticket-to-Ticket facts; a collapsed cluster must not invent a causal super-edge or hide a possible two-way boundary pattern. If topology does not yield a confident, useful boundary, the Tickets remain ungrouped. The terminal Ticket often describes validation rather than the human meaning of the work, so Room and Context names are consulted first and AI may generate a short cluster label and purpose from member Outcomes, Acceptance, and Context references. AI never changes membership, dependencies, state, or Acceptance. Label generation and regeneration timing are deferred backend mechanics that must follow product interaction needs; a future Human-pinned label may override generated presentation without changing canonical Task ontology.",
