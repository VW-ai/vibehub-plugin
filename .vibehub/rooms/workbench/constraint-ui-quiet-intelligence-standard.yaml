  "context_id": "constraint-ui-quiet-intelligence-standard",
  "detail": "A VibeHub UI does not receive a lower design bar because it ships inside a lightweight Plugin rather than as a standalone application, and the same standard binds every surface including the user-owned Workbench. The complete causal graph is the primary object and reads top-to-bottom as what becomes executable next: completed foundations at the top, work currently being implemented central, and READY or BLOCKED downstream beneath it. Selection keeps the graph visible and progressively reveals contract, rationale, context, Evidence, Outcome, and Git trace. Healthy state stays quiet while human boundaries, blockers, deviations, stale facts, active work, and proof appear in situ at the graph locus that owns them. The visual direction is fixed to A · Quiet Workbench: compact, cool-neutral, macOS-like spatial tooling with system typography, restrained elevation, a small shape vocabulary, and semantic color only; no style selector ships on the product surface and no visual preference is written into the project. IMPLEMENTING is never a Ticket YAML status: it may appear only as a non-persistent Active-Run presence overlay that never alters Git-native READY, BLOCKED, DONE, DEVIATED, or REFINE, degrades to stale when heartbeats expire, and shows honest absence when no trusted presence source exists; states are never expressed by color alone and the current selection uses a neutral outline rather than a new state color. The Inbox is a cross-repository attention queue, not a notification stream: only Review requested, Decision required, and blocked interventions needing a human count toward the badge, the badge counts unread items that need action, seen remains local UI state that never implies approval or closeout, aggregated items keep their source labels, and the Inbox never derives or overrides Ticket state. Persistence boundary: app-local, non-authoritative UI preferences — recent repositories, window frame, last selection, viewport — may persist as interface preference and sit outside durable product state in the sense of contract-canonical-agent-output, while bearer tokens, Ticket states, frontiers, and projected snapshots must never persist. Every visible affordance must be honest, keyboard reachable, contrast-readable, and reduced-motion safe, with at least 44px touch targets on narrow layouts, and no network fonts or third-party resources. The UI must not become a dense dashboard, a raw YAML or schema viewer, another chat, a warm editorial or serif brand page, or a decorative card collection. Historical runtime architecture is not part of this authority: the surface continues to consume schema-valid canonical Git documents mechanically and may rebuild only the presentation and interaction needed to meet this standard.",
