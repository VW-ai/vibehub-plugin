  "detail": "The selected public-site direction is Causal Canvas (visual direction A). The Ticket graph is not a framed product screenshot or one section among conventional pages: it is the website's navigation and storytelling space. Product, use cases, documentation, installation, and GitHub appear as reachable graph regions or spatial transitions. The site is built and judged first. Its stronger Ticket shapes, icons, hierarchy, and connector language may later inform a separate local Workbench refinement, but this decision does not authorize changing the installed UI now. The checked-in direction image is non-authoritative visual inspiration: its layout, scale, whitespace, and causal composition are approved, while any generated labels, claims, navigation items, metrics, product states, or capabilities must be discarded unless current canonical VibeHub documents support them.",
