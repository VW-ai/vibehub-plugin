  "context_id": "contract-canonical-agent-output",
  "detail": "Agents and VibeHub Skills own semantic judgment and produce canonical Context, Ticket, Evidence, and Outcome documents in the shared JSON-compatible YAML format. The four schemas plus repository validation are the handoff boundary: after validation, the local UI, a lightweight CLI, and Cloud may consume and project those documents mechanically without semantic inference, hidden lifecycle state, or a second source of truth. Ticket archive, delivery membership, current/all scope, and Room-related filtering use one exported query projection for CLI JSON and the Workbench; the browser may preserve disposable focus and explicitly revealed history ids in its URL but may not own a separate archive index. Recover as much of the prior UI's visual and interaction surface as can be derived from canonical documents. Disposable UI state such as selection, pan, zoom, and layout may live in memory but is never durable product state. Invalid documents and invalid filters must fail visibly before projection rather than being guessed into shape or broadened. Any later authorized write surface must write the same canonical documents through the same validation boundary and must not introduce a parallel data model. This contract does not require SQLite, the former large CLI, MCP, a package runtime, hooks, leases, or a persistent cache.",
