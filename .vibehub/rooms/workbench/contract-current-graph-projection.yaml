  "detail": "Use one deterministic causal layout for left-to-right desktop default and explicit top-to-bottom orientation. Causal ranks, stable non-overlapping cards, complete dependency relations, long-edge waypoints, distinct ports and routes avoiding card interiors remain shared behavior. Current scope shows open work and its nearest completed boundary; All restores canonical history, and explicit history expansion preserves existing geometry. Status visibility is multi-select. The board renders only selected lanes; one selected lane fills the width with a responsive grid. Board All tickets and Graph Active tickets describe different pools, and counts must equal what is rendered. Task state uses recorded open/in_progress/done and derived open-only blocking. Session observations remain separate, source-labelled and expiry-bounded; missing trusted presence never implies active execution. Preserve keyboard navigation, neutral selection, meaningful labels beyond color, reduced motion, 44px narrow targets, focus links with their local bearer authorization, Room filters and progressive inspection. Cool-neutral foundations, system typography, restrained elevation and semantic color define the visual language. Decorative gradients, unrelated style selectors, network fonts and third-party resources are excluded. Historical proof remains accessible without dictating current task workflow.",
