  "detail": "The proposal made the Room tree an optional knowledge lens, with canonical directory containment and FRESH, DRIFTED, WARNING, STALE and COLD states derived from Room records. Related-ticket filtering takes the selected Room subtree union and intersects other graph filters, preserving canonical graph coordinates and restoring them when cleared. It used a floating tree and a narrow-screen bottom sheet, readable counts, 44px controls and no decorative filler labels. It remained read-only. The runnable prototype and machine-readable contract under test/fixtures/ui-proposals/rooms-workbench preserve this exploration; current live Dashboard and Room-schema behavior remain the production authority.",
