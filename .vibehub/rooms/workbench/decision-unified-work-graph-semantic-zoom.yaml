  "detail": "The existing VibeHub Graph Workbench remains the starting spatial language rather than being replaced. The Global Work Graph shows Project clusters, Task nodes, and visually lighter Chat meta nodes together. A Chat meta node summarizes one Human-led Context Space, branch count, current attention owner, activity, and explicit Task associations; its individual conversation branches remain hidden globally. Selecting a Task or Chat first supports a lightweight Peek. Focusing a Task enters its Context Space and reveals relevant dependencies, Agent Runs, Evidence, and associated Chats. Focusing a Chat reveals its Conversation Stream graph, where forks represent thought provenance rather than Subtasks; a branch becomes a Task only when it gains an independent Outcome and execution contract. Multi-stream layouts may pin several independent Streams at once, with polished presets for common densities but no canonical limit in the data model. Compare creates a synthesis Stream and Bring Back merges selected conclusions or artifacts rather than concatenating histories. Chat-to-Task and branch-to-Task relations appear on focus to avoid edge noise. Selecting one Project should smoothly reframe and enlarge its clusters while other Projects fade, shrink, or exit toward a secondary rail with spatial continuity, rather than disappearing abruptly. Returning restores the prior Graph position and focus.",
