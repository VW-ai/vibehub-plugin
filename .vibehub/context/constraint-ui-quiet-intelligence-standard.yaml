  "context_id": "constraint-ui-quiet-intelligence-standard",
  "detail": "A VibeHub UI does not receive a lower design bar because it ships inside a lightweight Plugin rather than as a standalone application. The local Ticket surface must feel like a deliberate execution instrument worth returning to: the complete causal graph is the primary object, read left-to-right as what becomes executable next; selection keeps that graph visible and progressively reveals contract, rationale, context, Evidence, Outcome, and Git trace. Healthy state stays quiet while human boundaries, blockers, deviations, stale facts, active work, and proof appear in situ at the graph locus that owns them. The visual language is compact, cool-neutral, macOS-like spatial tooling with system typography, restrained elevation, a small shape vocabulary, and semantic color only. Symbols, relations, position, weight, and whitespace carry structure before cards, labels, borders, or schema vocabulary. Every visible affordance must be honest, keyboard reachable, contrast-readable, and reduced-motion safe. The UI must not become a dense dashboard, a raw YAML/schema viewer, another chat, a warm editorial/serif brand page, or a decorative card collection. Historical runtime architecture is not part of this authority: the surface continues to consume schema-valid canonical Git documents mechanically and may rebuild only the presentation and interaction needed to meet this standard.",
