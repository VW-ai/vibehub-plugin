  "detail": "Canonical project state under .vibehub is limited to Context, Ticket, Evidence, and Outcome documents in their named directories. One-shot query inputs, candidate payloads, browser screenshots, extracted historical assets, test repositories, staged install artifacts, sockets, logs, and other reproducible intermediates belong in standard input or the operating system temporary directory and must be removed when their run or review is finished. Test and launcher code must clean temporary paths on success and failure where it owns their lifecycle. Durable Evidence must not depend only on a temporary path: preserve a stable Git ref and digest, or check in the smallest necessary evidence asset when the visual artifact itself must survive. Do not create an extra cache, tmp, runtime, or session subtree inside .vibehub merely to make temporary work visible.",
