  "detail": "VibeHub is a lightweight plugin whose development control plane is the checked-in Ticket graph and whose durable memory is checked-in Context. Normal development starts from an explicit Ticket cycle. Durable decisions, intent, constraints, contracts, conventions, and reusable explanations are captured only on explicit user instruction or when a Ticket workflow exposes a real cross-Ticket fact. Skills own planning and semantic judgment. Agents read and edit the files with normal host tools; dependency-free bundled scripts provide shared schema and graph validation. The product has no required Core package, global CLI, MCP server, SQLite database, native runtime, generic dispatcher, hook cadence, Run lease or heartbeat, compiled ContextBinding, local Decision attestation, writable local host, dual-write compatibility framework, or persistent digest cache. Git and GitHub own concurrency, rollback, history, and review. A UI may later use a disposable in-process render cache only after profiling; it is never truth, authority, currentness, synchronization, or completion state. Cleanup is deletion-first and speed-first: preserve a cheap Git baseline, remove obsolete machinery, and rebuild only gaps demonstrated by real use. Context quality is protected by schema-valid stable-ID files, readable source/evidence, valid relation endpoints, and a fresh-process capture/query roundtrip. The minimum Ticket slice is explicit entry, direct Ticket YAML, graph validation, Agent execution, acceptance-linked Evidence and independent Outcome, and successful direct-dependent unlock.",
