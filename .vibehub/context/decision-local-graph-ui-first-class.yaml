  "context_id": "decision-local-graph-ui-first-class",
  "detail": "VibeHub must bring back the local Ticket graph UI rather than relying only on Agent conversation and GitHub review. The earlier visual and interaction design is valuable and should be recovered from Git history where it still fits the direct Git-YAML model. A lightweight local launcher or narrow CLI is an acceptable cost when it exists only to select a repository, start the loopback UI, and optionally open the browser. This amends the earlier cleanup decision only where it excluded a local graph host or any CLI entrypoint: it does not authorize restoring the old large CLI, SQLite/native runtime, MCP, hook cadence, dispatcher, leases, ContextBinding, attestation stack, or a second source of truth. The UI reads current Context, Ticket, Evidence, and Outcome YAML directly; Git remains truth. Any writable UI action requires separate explicit product authority and must write the same governed files without hidden state.",
