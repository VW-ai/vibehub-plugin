  "context": "The current assets follow the superseded left-to-right authority. The checked-in demo is the interaction baseline: top-to-bottom causal graph with edge labels and minimap, an Implementing-now switcher strip above the canvas plus a compact sidebar in-progress list, ready frontier and graph summary in the rail, a three-tab inspector (Execution / Contract / Log) with Copy for Agent, and a source dock always answering which exact worktree, branch, commit, and dirty state is shown. Honesty rules: the MVP has no trusted presence source, so every Implementing-now surface must render the explicit empty state (cannot prove any Ticket is being implemented) and never infer IMPLEMENTING from Git-native states — READY/BLOCKED/DONE/DEVIATED/REFINE stay exactly as projected. The demo's style-lab A/B/C selector is a design-exploration artifact and must not ship (§11.1). The demo's owner, progress, agent, and heartbeat fields are presence-overlay data, not canonical Ticket fields — do not fabricate them from YAML. A Copy-deep-link affordance ships only when a handler exists (ticket-workbench-deep-link); until then the inspector offers Copy for Agent only. Coordinate with ticket-rooms-into-workbench, which adds a rooms surface to these same shared assets; its UI/UX proposal is judged against the amended authority and this restructure must not strand it.",
