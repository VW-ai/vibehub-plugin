  "context": "Future direction, not yet executable. Baseline §8.1 defines ImplementationPresence: repositoryRoot, worktreeRoot, ticketId, runId, agentLabel, state, startedAt, lastHeartbeatAt — received in memory by the user-owned Workbench. Hard rules: presence disappears when the Workbench closes; it is never written to Ticket YAML, never enters Git, never restores across app sessions; it is never guessed from dirty files, cursor position, or chat content; a heartbeat timeout degrades the display to stale/disconnected instead of continuing to claim implementation; presence affects only the Implementing-now display and switching, never READY/BLOCKED/DONE or downstream unlock; without a trusted source the interface honestly shows that no implementing Ticket can be proven. §11.3 defines the target interactions: multiple Active Runs ordered by heartbeat freshness, switcher and sidebar selecting the same Ticket with graph scroll and inspector sync, no automatic claim or release of Runs, and Copy for Agent focusing the existing Run for active Tickets while only READY Tickets generate a new ticket-run instruction. The trusted source itself — trusted host task/run events or a separately designed local IPC adapter — does not exist yet, which is why this Ticket stays draft until that source design is ready.",
