  "context": "Future direction, not yet executable. Baseline §11.2 defines the Inbox as an attention queue across recent repositories answering one question: with multiple Agents developing at once, what truly needs me now. Only three kinds enter Needs-you — Review requested (Agent explicitly asks for human inspection), Decision required (multiple valid options need a human product or architecture choice; neither UI nor Agent may pick silently), and Blocked intervention (credentials, permissions, or external coordination) — while heartbeats, percentage changes, watcher refreshes, frontier changes, and completions stay in All activity without consuming the badge. The badge counts unread items that need action, never total messages. Every item must carry the exact repository and worktree identity, Ticket ID and optional Run ID, type, requester and time, why a human is needed, the Agent-prepared bounded context and evidence summary, and a deep link to the exact Ticket; seen is local App UI state only and never implies review, decision, or closeout. Sources keep their labels; the Inbox never derives READY/DONE itself and never becomes a second truth. Blocked on capabilities that do not exist yet: multi-repository recent sessions (Phase 2 direction) and canonical or trusted sources for review requests, decision requests, and presence events — hence draft.",
