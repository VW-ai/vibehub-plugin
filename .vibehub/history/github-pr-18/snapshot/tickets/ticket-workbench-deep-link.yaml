  "context": "Baseline §9 defines the contract: vibehub://open?repo=<absolute-path>&ticket=<ticket-id>&view=<execution|contract|log>. Behavior: when the Workbench is running, focus the window, validate the repository, then select the Ticket; when not running, start the app and require user confirmation for a first-seen repository; when the repo differs from the current session, prompt explicitly instead of switching silently; when the Ticket does not exist, open the repository and show an honest 'not in this worktree' state; the URI carries navigation only and can never mutate a Ticket. Deep links are an enhancement — the Workbench must keep working without any Agent. The inspector's Copy-deep-link affordance becomes honest once this handler exists.",
