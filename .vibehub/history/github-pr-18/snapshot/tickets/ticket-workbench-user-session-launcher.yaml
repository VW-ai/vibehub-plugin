  "context": "The review UI is currently Agent-task-owned: vh-ui.mjs issues a 30-minute bearer token, the lifecycle reference scopes reuse to the current Agent task, and cross-task discovery is forbidden. That policy is right for Agent presentation but wrong as the only daily entry — the baseline (§2–§4) shows users re-asking an Agent every time they want to see Tickets. decision-local-graph-ui-first-class already authorizes a narrow launcher that only selects a repository, starts the loopback UI, and optionally opens the browser. Baseline §13 Phase 0 asks for exactly that as the browser transitional dogfood before any desktop shell. Deliver a documented user entry — a flag or thin wrapper over the exported startVibeHubUi — where host and token lifetime belong to the foreground process instead of a timer, while the Agent-task default behavior stays unchanged. This is explicitly not the vh.mjs CLI split: ticket-vibehub-cli (draft) owns that evaluation, and this launcher must stay inside the already-authorized narrow scope.",
