e. The bearer token is bound to the app session and memory only: it lives in HostSessionReady, is exposed to logs only through redactedDescription, never reaches stdout or any preference, and dies with the process. The Agent-task review flow and Phase 0 launcher remain working fallbacks, proven by the three untouched suites passing in the adjudicator's own run.",
