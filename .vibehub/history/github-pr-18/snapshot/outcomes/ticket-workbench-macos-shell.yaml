wnstream of that closure is verified end to end, so the gap is one of proof method rather than function and does not defeat the criterion. session-lifecycle-clean: independently reproduced by the adjudicator on the real worktree. VibeHubWorkbench --probe-session spawned host pid 76511 on http://127.0.0.1:56398 from shell pid 76504; /health returned {ok:true,schemaVersion:1,readOnly:true}; /api/state without the bearer token returned 401; the handshake carried origin, port and hostPid but tokenPrinted false and no 64-hex string. After SIGTERM the shell exited 0, host pid 76511 was dead, the port was unreachable, the .vibehub tree hashed byte-for-byte identical before and after, and git status was unchanged. A pre-existing user-owned vh-workbench session (pids 96025/96028) was identified before the run, left untouched throughout, and was still the only vh-workbench process afterwards. Teardown is covered on all three paths required: applicationWillTerminate, applicationShouldTerminateAfterLastWindowClosed returning true, and explicit DispatchSource handlers for SIGTERM, SIGINT and SIGHUP, which close the gap AppKit leaves for a plain kill. LIMITATION accepted: SIGKILL cannot be handled by any process, so a force-killed shell leaves its host; this is unhandleable by design, is stated in docs/LOCAL_GRAPH_DESIGN.md and in the Evidence, and the test harness sends SIGTERM before any SIGKILL so the suite cannot leak a host. preferences-only-persistence: the shell writes exactly four keys in its own suite dev.vibehub.workbench.preferences - recentRepositories, windowFrame, lastTicketId, lastInspectorTab - and PreferenceKey is the only key source; the source audit parses every defaults.set call with comments stripped and fails on any key outside the enum, and forbids token, snapshot, and any literal forKey string outside the allowlist. The adjudicator ran --probe-preferences on the fresh binary (allowlist exactly those four, viewportRestored false, written empty) and ran defaults read dev.vibehub.workbench.preferences directly, which reports the domain does not exist - no token, Ticket state, frontier, or snapshot is on disk under any name. websiteDataStore is .nonPersistent(), so no WebView cache survives either, and Ticket state is recomputed from Git YAML by the host on every launch. VIEWPORT, adjudicated explicitly: graph pan and zoom are NOT restored, and the criterion names viewport among the restored items. The adjudicator independently confirmed the cause rather than accepting the executor's account - in skills/vibehub-ticket-review/assets/app.js panX, panY and scale are closure-local let bindings, the file contains zero uses of localStorage, sessionStorage or indexedDB, and the only URL contract the frontend reads is ?ticket= and ?view=. Restoring a viewport would therefore require editing the shared frontend, which would directly violate the sibling criterion shared-frontend-no-fork and the ticket's own module constraint. The criterion is accepted on this reasoning: its authority is the baseline quoted in the Ticket's own context, and that baseline marks the entire positive list including pan/zoom as what MAY persist while marking the bearer token, Ticket states, frontier and projected snapshots as what MUST NOT; the criterion's discriminating purpose is that nothing authoritative is persisted and that what is persisted is pure interface preference restored across launches, and that purpose is met completely. Where two criteria of one Ticket conflict, the one backed by a must-not constraint governs. It is accepted because that purpose is served and because the alternative was forbidden, not because the executor documented it - and the shell declines to fake a viewport it cannot reproduce, reporting viewportRestored false from the running binary, asserting it in the suite, and stating it in docs/LOCAL_GRAPH_DESIGN.md and in three source files. Four of five named items are restored; the fifth is unreachable within the Ticket's own constraints and is declared rather than hidden. narrow-bridge-boundary: NavigationPolicy allows exactly one origin, matching scheme http plus host and port of the session the app started. The adjudicator re-ran the decision matrix on the fresh binary: the session origin and /api/state allow-in-webview; a neighbouring loopback port, localhost on the same port, file:///etc/passwd with and without link activation, and data: URLs all deny. A user-activated http or https link returns open-externally, which the window cancels and hands to NSWorkspace, so it never loads in the WebView - the Evidence describes this as remote-link behavior, which is imprecise for a link-activated localhost or neighbouring-port URL, but the mechanism is accurate and no such URL can reach the WebView. Live confirmation from --probe-render on the real worktree: escapeAttempts fetch-file:blocked,bridge:absent, fileNavigationDenied true, loadedOrigin 127.0.0.1 - the page could not fetch file:///etc/passwd, window.webkit.messageHandlers does not exist, and an attempted top-level file: load was denied with the page still on loopback. Source-level the suite greps compiled Swift with comments stripped and fails on loadFileURL, allowingReadAccessTo, allowFileAccessFromFileURLs, allowUniversalAccessFromFileURLs, WKScriptMessageHandler, WKUserScript, and userContentController.add - none are present, so the page has no callable native surface. Directory choice enters only through NSOpenPanel and Git metadata only through /usr/bin/git -C <selected worktree> with a fixed PATH=/usr/bin:/bin environment. ToolchainLocator was confirmed to contain no reference to repoRoot and --probe-toolchain reports resolvedFrom app-installation, so choosing a worktree can never mean executing code from it. The only shell-to-page channel is a two-second evaluateJavaScript read of the aria-selected tab id, which flows native-inward and grants the page nothing. shared-frontend-no-fork: apps/workbench contains no .html, .css