      "detail": "**Question**: Define the contract between the Ticket Runtime and durable\nsemantic providers.\n\nThe first implementation should center Feature Room: exact Spec identity,\nrevision, mapping context, dependency artifacts, repository snapshot, and\nthe reason each binding is required. It must define drift detection,\ninvalidation/replanning, and how execution evidence links back to governing\nsemantics.\n\nThe design may allow future providers, but should not generalize away the\nstronger guarantees available from Feature Room.\n\nThis historical question is resolved by\n`contract-ticket-context-binding-001`.\n",
