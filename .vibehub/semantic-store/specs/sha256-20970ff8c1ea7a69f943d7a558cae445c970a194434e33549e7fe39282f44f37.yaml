      "detail": "**Contract**: `ticket.worktree.patch` is the sole M1B Ticket definition\nmutation capability. It is a deterministic hand for Skills, not a\nproposal/application workflow or a source of semantic judgment.\n\nThe host supplies one trusted Git worktree. The request cannot choose an\narbitrary writable path. Callers first read the current worktree Ticket\nsource and then bind all four exact-source fields:\n\n- opaque `sourceToken`;\n- `worktreeIdentity`;\n- `resolvedCommit`;\n- semantic `graphDigest`.\n\nThe source token includes a physical inventory digest over canonical\nTicket-ledger paths, file modes, and raw byte digests. Consequently a\ncomment-only, formatting-only, or mode-only edit invalidates an old patch\nrequest even when its normalized Ticket graph digest and individual\nTicket revisions are unchanged. The graph digest remains the normalized\nsemantic identity; the source token is the stricter overwrite guard.\n\nA request contains a bounded non-empty set of unique Ticket changes.\n`put` supplies one complete Ticket document and an expected Ticket\nrevision; `null` means the Ticket must be absent. `delete` supplies the\nexisting Ticket ID and its required revision. Paths are always derived\nfrom the validated Ticket ID. The operation cannot mutate\n`protocol.yaml`.\n\nA protocol-only ledger is a valid empty graph and is the bootstrap base\nfor new Ticket plans. The patch requires an existing valid\n`.vibehub/tickets/protocol.yaml`; it does not invent a missing ledger or\nmake the first Ticket mandatory.\n\nUnder one worktree-local writer lock, Core loads the current ledger,\nchecks the complete expected source and every targeted revision,\nmaterializes the complete prospective graph in memory, and runs the\nexisting strict schema, path, capacity, endpoint, duplicate, self-edge,\nand dependency-cycle validation before touching canonical Ticket files.\nIt stages deterministic YAML outside the canonical ledger, reloads and\nrechecks the exact base, verifies each target preimage immediately before\ninstallation, atomically renames each replacement or explicitly removes\neach deletion, then reloads the ledger and requires the computed target\ngraph digest.\n\nAtomicity is deliberately narrow and honest. Each file replacement is\natomic, but a multi-file patch is not a filesystem transaction and is not\ncrash-atomic. A synchronous failure after installation begins attempts\nreverse rollback only while every installed path still has the exact\ncandidate physical revision. If safe rollback cannot be proven, the\noperation fails with affected paths and requires inspection of\n`git diff -- .vibehub/tickets`. There is no durable local semantic\njournal. Git commit is the multi-file semantic checkpoint.\n\nA successful result reports `applied` or `noop`, before/after exact\nsources, changed paths, per-Ticket before/after revisions, and a\n`checkpointSelection`. It leaves the verified Ticket changes in the\nworktree and does not commit automatically. An optional Ticket checkpoint\nis a separate explicit capability: it may consume the exact post-patch\nsource and changed-path selection, but it is not a stage of this mutation\ntransaction.\n\nThe three Git Ticket reads and this write evaluate the addressed worktree\non every invocation. They create, consult, and replay no SQLite operation\nreceipt. Retrying an old request after raw inventory, HEAD, graph, or a\ntargeted Ticket changes must evaluate the new source and fail stale rather\nthan replay an earlier success.\n\nSkills own planning, decomposition, forward normalization, semantic\nvalidation, protected-boundary decisions, and whether a proposal,\nValidation, Decision, semantic Receipt, Outcome, or Evidence document is\nuseful. Core, CLI, and MCP expose only the same bounded mechanical patch;\nthis contract introduces no mandatory lifecycle and no hidden Ticket\nintelligence.\n",
