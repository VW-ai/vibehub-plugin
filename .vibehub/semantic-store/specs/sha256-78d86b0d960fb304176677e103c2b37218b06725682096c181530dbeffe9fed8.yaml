      "detail": "Semantic checkpointing is a two-phase, fail-closed operation. Prepare\nvalidates a named non-protected branch and returns the exact HEAD,\nsemantic digest and changed semantic paths. Commit recomputes every fact,\nbuilds a path-isolated candidate tree, validates its digest and advances\nthe branch with compare-and-swap.\n\nVibeHub workflow skills request a checkpoint automatically only after a\ncoherent sequence of successful canonical knowledge mutations. The\nreusable vibehub-pr skill owns PR preparation and semantic review\nprocedure, while deterministic core/CLI primitives own Git mutation and\nvalidation. Other skills may delegate their PR phase without inheriting\npersistence mechanics.\n",
