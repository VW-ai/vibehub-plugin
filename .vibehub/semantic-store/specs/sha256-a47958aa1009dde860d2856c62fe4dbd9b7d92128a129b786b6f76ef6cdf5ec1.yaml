      "detail": "Ticket shaping uses `Backchain → Forward Normalize`.\n\nBackchain begins from each observable deliverable or scenario acceptance\nand asks what result, fact, proof, or authorized decision must exist\nimmediately before it can be established. It repeats until paths reach\ncurrent evidence, executable work, a genuine decision blocker, or honest\nPlanning Fog. Parallel necessary paths, joins, and shared prerequisites are\npreserved.\n\nForward Normalize then reads from current facts toward each deliverable and\nremoves duplicates, orphan work, dead ends, redundant transitive edges, and\nfalse serialization. It checks that every Ticket contributes through one\nor more typed relation paths to an observable outcome and that each Ticket\nhas an independent scheduling, blocking, retry, authority, or verification\nboundary.\n\nThis is a typed DAG, not a containment tree. Shared Tickets connect to every\nrelevant path through explicit relations. Scenario lenses are derived from\nthose paths. Work that lacks an independent boundary remains elaboration\ninside a Ticket's executable context rather than becoming another node.\n\nThe Skill owns this reasoning. Scripts may validate graph references,\ncycles, reachability, relation types, canonical ordering, and stale bases,\nbut they do not decide semantic usefulness.\n",
