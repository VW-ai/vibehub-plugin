      "detail": "VibeHub 是 lightweight Plugin，不以拥有 Core、CLI、MCP、自定义 operation runtime 或持久 digest cache 为产品目标。Agent 可以通过宿主文件工具和 Git 直接读取、编辑 Git-native Ticket/Context YAML；不能因为已有工具存在就把所有读写强制路由进工具。\n\n最小确定性能力只保留删除后会造成明确产品破坏的部分：\n- 共享 YAML schema validation，保证 Agent、CI、GitHub projection 与前端 visualization 对同一数据合约解释一致；\n- Ticket graph 的 ID、relation endpoint、dependency cycle、acceptance/evidence 引用等结构完整性验证；\n- 真正需要稳定 diff 时的 deterministic normalization/serialization；\n- 前端或 GitHub surface 无法自行安全重建时所需的轻量 read-only projection。\n\nGit 本身拥有 branch/worktree 隔离、commit history、non-fast-forward push rejection、merge conflict 与 PR review。产品按 one Agent/writer per worktree 设计，不为本来就不安全的 same-worktree concurrent writers 重建第二套并发系统。因此 layered sourceToken/graphDigest/semanticLedgerDigest CAS、SQLite Run lease/heartbeat/generation、ContextBinding 内容编译与复制、installation-local Ed25519 Decision attestation、通用 operation dispatcher、CLI/MCP adapter 都不再是默认必需组件。CLI 与 MCP 应从产品和运行时必经路径删除；只有未来出现一个无法由 Skills、宿主文件能力、Git/GitHub 或 schema validation 覆盖的具体用户失败场景，并有回归测试时，才重新引入对应能力。\n\n这里的 digest cache 仅指 UI 的临时性能优化：UI 第一次读取 YAML 并构建图后，可在进程内记住内容指纹和派生 projection；下一次刷新若指纹未变，就跳过重复 parse/layout/render。它不是另一份数据，不是语义事实，不参与写入权限、CAS、currentness、同步或完成判定，也不需要数据库、CLI、MCP 或服务端。v0 默认不实现这个 cache：已提交视图可直接用 Git commit SHA/ref 识别变化，dirty worktree 直接重新读取 YAML；只有 profiling 证明解析或布局成为真实瓶颈后，才允许添加可随进程退出而丢弃的内存 cache。验证过程中临时计算 hash 不等于建立 cache。\n\n清理执行采用 deletion-first、speed-first：先做一个便宜的 Git rollback checkpoint，然后可以直接删除旧 Ticket definitions/artifacts、CLI/MCP、SQLite runtime、hooks/cadence、dispatcher、leases、ContextBinding、attestation、local writable host 及其测试/打包路径。允许错删；真实使用暴露 gap 后再以最小实现重建。不得为了清理自举而新增 retired lifecycle、通用迁移框架、兼容层、双写、归档协议或新的协调服务。将被删除的 MCP transport、数据库 materialization、lease 或 attestation bug 不单独修复，除非它直接阻止取出必须保留的数据。\n\nContext Layer 的质量保护收窄为少数不可退让的不变量，而不是保留旧实现：YAML 可解析且 schema-valid；稳定 ID；当前内容与证据/来源可读；关系端点和 lifecycle 不产生明显悬空；一次显式 capture/query roundtrip 能在 fresh process/reclone 后成立。旧 store 的完整内部 revision、receipt、cache 或所有历史 artifact 不要求为了一次性迁移造产品机制；必要数据可用一次性、可审阅的转换保留。\n\nTicket 最小 vertical slice 是：用户显式进入 -> Agent 写/读 Ticket YAML -> schema/graph validation -> Agent 执行 -> acceptance-linked evidence/closeout -> direct dependent unlock。Plan/Validate/Run/Closeout 的语义继续由 Skills 拥有，但不要求先复制现有 runtime 的所有操作和证明系统。人类 review 默认走 Agent 对话与 GitHub branch/PR/comment；本地静态 projection 可保留为 read-only，删除 writable loopback host，不把它升级成新的 blocker。\n\nSkills 继续拥有规划、语义判断和工作流编排；小型 validator/render helper 可以作为 Skill bundled scripts、库函数或 CI commands 存在，而不形成长期运行时、独立产品 CLI 或用户必须理解的工具层。",
