      "detail": "VibeHub 是 lightweight Plugin，不以拥有 Core、CLI、MCP 或自定义 operation runtime 为产品目标。Agent 可以通过宿主文件工具和 Git 直接读取、编辑 Git-native Ticket/Context YAML；不能因为已有工具存在就把所有读写强制路由进工具。\n\n最小确定性内核只保留删除后会造成明确产品破坏的能力：\n- 共享 YAML schema validation，保证 Agent、CI、GitHub projection 与前端 visualization 对同一数据合约解释一致；\n- Ticket graph 的 ID、relation endpoint、dependency cycle、acceptance/evidence 引用等结构完整性验证；\n- 必要的 deterministic normalization/serialization，保证稳定 diff；\n- 前端或 GitHub surface 无法自行安全重建时所需的 read-only projection。\n\nGit 本身拥有 branch/worktree 隔离、commit history、non-fast-forward push rejection、merge conflict 与 PR review。产品按 one Agent/writer per worktree 设计，不为本来就不安全的 same-worktree concurrent writers 重建第二套并发系统。因此 layered sourceToken/graphDigest/semanticLedgerDigest CAS、SQLite Run lease/heartbeat/generation、ContextBinding 内容编译与复制、installation-local Ed25519 Decision attestation、通用 operation dispatcher、CLI/MCP adapter 都不再是默认必需组件。它们只有在能给出一个无法由 Git、GitHub、宿主权限或 schema validation 覆盖的具体用户失败场景和回归测试时，才能重新进入产品。\n\nSkills 继续拥有规划、语义判断和工作流编排；小型 validator/render helper 可以作为 Skill bundled scripts 或 CI commands 存在，而不形成长期运行时或用户必须理解的工具层。",
      "domain": "architecture",
      "evidence": [
