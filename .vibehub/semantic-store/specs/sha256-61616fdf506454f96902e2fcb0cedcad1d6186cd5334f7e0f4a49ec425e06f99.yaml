      "detail": "**Question**: Freeze the smallest strict Ticket schema and its invariants.\n\n**Resolution status**: Resolved. Ticket Contract v0 is ratified below.\n\nCandidate fields discussed include identity, objective/outcome contract,\nintent provenance, context bindings, dependencies, scope/non-goals,\nconstraints, acceptance, execution policy, permissions, human gates,\nverifier, artifacts, evidence, and graph-mutation provenance.\n\nThe answer must separate durable Ticket identity from a Run-specific prompt\nor context packet and must state which omissions prevent a Ticket from\nbecoming READY.\n\n`decision-ticket-work-unit-001` now fixes one invariant: outcome-level and\nexecution-level work use the same Ticket contract family. The contract must\ntherefore express decomposition and visibility without creating a second\nTask identity, and must define when a Ticket is directly executable by a\nRun.\n\n**Ratified partial contract — identity boundary**\n\nA Ticket ID denotes one stable outcome promise, not a long-lived work\ncontainer whose intended result may be silently replaced.\n\nThe same Ticket may be revised to clarify its wording, add context, narrow\nimplementation choices, strengthen acceptance, or decompose contained work,\nprovided that completing the revised Ticket still fulfills the original\noutcome promise.\n\nA material change to the promised outcome, non-goal, human-controlled scope,\ntechnical direction, authority, permission, or risk boundary requires a new\nTicket. The old Ticket remains durable and points to the replacement through\nexplicit supersession lineage; its ID is never recycled. Runs, descendants,\napprovals, artifacts, and evidence produced under the old promise remain\nattached to that historical Ticket.\n\n**Ratified partial contract — progressive maturity**\n\nA Ticket receives a stable durable identity before it is executable. Its\ndefinition maturity is a separate axis from its operational status:\n\n- `outline`: a durable outcome/direction and graph position are known, but\n  the execution contract is intentionally incomplete.\n- `specified`: scope, context, acceptance, and dependencies are materially\n  described, but one or more readiness validations remain unresolved.\n- `executable`: every field and authority required to schedule a Run has\n  been validated.\n\nOnly an `executable`, unblocked Ticket may become READY or produce a Run.\nPlanning should create the widest honest graph of outline Tickets it can.\nPlanning Fog is reserved for regions where even a stable outcome or\ndirection cannot yet be named.\n\n**Ratified partial contract — outline Ticket v0**\n\nA canonical outline Ticket requires only:\n\n- a stable durable Ticket ID;\n- one outcome statement sharp enough to distinguish its promise from\n  another Ticket's promise;\n- one containment parent, except for an explicitly top-level Ticket;\n- creation provenance naming the creator, source Ticket/Run when applicable,\n  and the discovery or decomposition reason;\n- mechanical creation time.\n\nScope, non-goals, constraints, context bindings, dependencies, acceptance,\nauthority requirements, permissions, execution policy, and verifiers may be\nadded as definition maturity increases. If even a stable outcome cannot yet\nbe named, the region remains Planning Fog rather than becoming an empty\nTicket.\n\nAuthored outline data does not include status, maturity, current Run,\nprogress percentage, assignee, priority, or workflow step. Those are\nderived Runtime projections or optional upstream product organization, not\nthe minimum semantic Ticket identity.\n\n**Ratified partial contract — specified intelligence handoff**\n\n`specified` is determined by an intelligence handoff test rather than a\nfixed percentage of populated fields: an Agent that did not participate in\nthe source discussion can read the Ticket and its referenced context,\nunderstand the intended boundary, identify dependencies and authority\ngates, and continue reliable planning or decomposition without reopening\nthe original conversation to discover what the user meant.\n\nThe handoff normally requires a materially described outcome, scope and\nrelevant non-goals, constraints, context requirements, known dependencies,\nauthority gates, and acceptance conditions. A validator judges their\nsemantic sufficiency; fields that genuinely do not apply need not be filled\nwith boilerplate.\n\nA specified Ticket is not necessarily runnable. Verification details may\nremain incomplete, a required gate or permission may be unsatisfied, context\nmay not yet compile into a Run packet, and dependencies may remain open.\n\n**Ratified partial contract — executable Run handoff**\n\n`executable` is determined by a Run handoff test: once external blockers are\nremoved, an execution Agent that did not participate in planning can read\nthe Ticket, bound context, and execution policy and begin a Run without\nsilently making an undelegated product, technical, scope, permission, or\nrisk decision.\n\nThis requires sufficiently explicit scope, non-goals, and constraints;\nresolvable context; a feasible verifier and evidence requirement for every\nacceptance criterion; defined permissions, allowed side effects, and\nexecution policy; modeled dependencies and human gates; explicit graph\nmutation authority; and independent validation of the current revision.\n\nDependencies, permissions, or human gates may still be unsatisfied while\ndefinition maturity is executable. Operational readiness remains derived\nseparately: only an executable Ticket whose blockers and required gates are\nsatisfied may project as `READY`.\n\n**Ratified partial contract — derived maturity and independent validation**\n\nTicket authors propose and revise the contract; they do not directly grant\ntheir own Ticket an `executable` maturity. A validator evaluates the current\nTicket revision against versioned readiness rules and derives `outline`,\n`specified`, or `executable` from the fields and authority actually present.\n\nValidation is independent and inspectable rather than necessarily\nadversarial. Its receipt binds the Ticket ID and revision to the validator\nand policy versions, check results, actionable findings, evidence, and\nderived maturity. A readiness-affecting revision invalidates the prior\nresult and must be validated again.\n\nThe first implementation may run authoring and validation through the same\nunderlying model or process, but they remain separate roles with separate\ninputs and outputs. Validators may verify that a required human gate was\nsatisfied; they may not grant the missing human authority themselves.\n\nThe proposal-validation ledger introduced for immutable graph-change\nproposals is a separate evidence family. It binds a proposal and its\nmechanically materialized candidate, not the current canonical Ticket\nrevision, and therefore cannot derive Ticket maturity or satisfy this\nTicket-readiness ValidationReceipt.\n\n**Ratified partial contract — verifiable acceptance**\n\nAcceptance criteria prove the Ticket's promised outcome rather than list\nimplementation steps. An outline Ticket may omit them, and a specified\nTicket may still have unresolved verification details. Before a Ticket can\nderive `executable`, every acceptance criterion must identify a feasible\nverification method and the evidence required to adjudicate it.\n\nVerification may be automated or human. A criterion that requires human\njudgment names an explicit human gate and approval evidence; it must not be\nrepresented as if an Agent or validator could self-approve it.\n\nAcceptance v0 is intentionally a flat list. Each item contains only a\nstable local ID, one independently adjudicable outcome condition, its\nverification method, and the evidence required. Parent Tickets verify their\naggregate outcome; child Tickets verify their independently scheduled local\noutcome. Implementation steps that have no independent outcome and\nacceptance remain elaboration inside a Ticket rather than becoming Tickets.\n\nThe first dogfood slice does not introduce nested Boolean acceptance trees,\nweights, scoring, inheritance, partial-completion percentages, verifier\norchestration, or an acceptance DSL. Repeated real-world failures must\njustify any later structure.\n\n**Ratified partial contract — intelligence before workflow encoding**\n\nTicket structure exists to communicate the semantic contract and judgment\nboundaries an Agent needs: the promised outcome, why it exists, what is in\nand out, what evidence and authority apply, and how success can be known.\nIt must not become a serialization of every workflow transition or UI step.\nWorkflow consumes this intelligence contract; workflow mechanics are modeled\nseparately and may evolve without redefining what the Ticket means.\n\n**Ratified partial contract — derived operational state**\n\n`BLOCKED`, `READY`, `RUNNING`, and `DONE` are Runtime projections rather\nthan author-controlled Ticket fields. An Agent may revise the semantic\nTicket contract and produce validation, gate, Run, Outcome, and graph\nmutation events; it may not directly declare the resulting operational\nstate.\n\nRuntime derives the current state from durable facts including dependency\nrelations and outcomes, authority gates, validation results, active Runs,\nand accepted completion evidence. The underlying events, receipts, and\nmaterialized projections may be persisted for audit and query performance,\nbut a writable status label is never the source of truth.\n\n**Ratified partial contract — Agent-derived Tickets**\n\nAn Agent may create durable Tickets while planning or executing. A newly\ndiscovered Ticket should attach to the earliest, coarsest ancestor Ticket\nwhose outcome truthfully contains that work. This is semantic containment,\nnot attachment by timestamp alone.\n\nEach Agent-derived Ticket must preserve at least:\n\n- its decomposition parent/ancestor;\n- creation provenance, including the creating Agent and, when applicable,\n  the source Run;\n- the discovery or decomposition reason.\n\nParentage expresses outcome containment; execution ordering remains an\nexplicit dependency relation.\n\n**Ratified partial contract — bounded self-expansion**\n\nThe Ticket graph is plan-defined but execution-extensible. Planning fixes\nthe destination, coarse graph, known chains, decision gates, acceptance\nboundaries, and delegated authority; it does not need to predict every leaf\nTicket before execution begins.\n\nAgent graph mutations fall into three classes:\n\n- `elaboration`: add detail to an existing Ticket when the new work shares\n  its acceptance and needs no independent scheduling or verification;\n- `decomposition`: create a descendant Ticket when work inside the\n  ancestor's authorized outcome must be blocked, scheduled, executed, or\n  verified independently;\n- `expansion`: create a proposed Ticket when the discovery would change an\n  outcome, non-goal, technical direction, budget, permission, external side\n  effect, or other human-controlled boundary.\n\nAn Agent-derived decomposition Ticket may enter READY without per-Ticket\nhuman review only when it is necessary for the ancestor's accepted outcome,\nremains within the ancestor's delegated scope and authority, introduces no\nnew human gate, and independently satisfies the `executable` and unblocked\ninvariants. Expansion Tickets remain proposals until human ratification.\n\n**Ratified partial contract — machine-first validation**\n\nThe product-level canonical Ticket lifecycle has no generic\n`draft → human review → active` gate. A Ticket becomes a durable graph node\nwhen its identity and minimum outline contract are recorded; incomplete\ndefinition is expressed by `outline` or `specified` maturity rather than by\na review queue. `active` is not an approval result.\n\nA temporary draft may exist inside an Agent's authoring transaction or UI\ncomposition buffer, but it is not a canonical Ticket state and does not\nrequire routine human review.\n\nMachine review is the default contract-validation mechanism. It must emit\ninspectable findings and evidence for at least:\n\n- structural and schema validity;\n- objective, scope, non-goal, and acceptance clarity;\n- dependency and graph consistency;\n- context, permission, and execution-policy completeness;\n- verifier feasibility and readiness invariants.\n\nPassing machine review may advance Ticket maturity and, when all other\nreadiness conditions hold, allow READY without human action. Failing review\nleaves the Ticket at its current maturity with actionable findings; it does\nnot create a default human approval inbox.\n\nHumans intervene only through an explicit authority or decision gate, such\nas outcome or scope expansion, unresolved product or technical choice,\npermission escalation, material external side effects, or policy-defined\nrisk. Machine review may detect and route such a gate, but cannot grant the\nmissing human authority.\n\nThe former `draft → human review → active` Feature Room convention is not\nthe target for either product Tickets or canonical Specs. Open planning\nquestions should become Decision Tickets; the current Wayfind representation\nremains transitional scaffolding until that separation exists.\n\n**Resolved Ticket Contract v0**\n\nThe versioned Ticket definition contains:\n\n- `schema_version`, `ticket_id`, and `revision`;\n- the stable promised `outcome` and one containment `parent_id`, except for\n  an explicitly top-level Ticket;\n- creation `provenance`;\n- scope in/out, constraints, and context requirements or bindings;\n- graph relations including `depends_on`;\n- authority gates, permissions, allowed side effects, and graph-mutation\n  policy;\n- the flat verifiable acceptance list defined above;\n- execution policy.\n\nValidationReceipt, GateDecision, Run, Outcome/Evidence, and GraphMutation\nremain separate linked records rather than mutable fields embedded in the\nTicket definition. Definition maturity, operational state, active Run, and\nprogress are derived projections and cannot be authored as source of truth.\n\nDetailed context binding, graph lifecycle, Workflow semantics, storage, and\ncloseout remain delegated to their own Decision Tickets. They may refine\nthe representations around this contract but must preserve its identity,\nauthority, validation, and intelligence-handoff invariants.\n\nWayne ratified Ticket Contract v0 on 2026-07-28.\n\n**Claimed**: Codex 2026-07-27\n",
