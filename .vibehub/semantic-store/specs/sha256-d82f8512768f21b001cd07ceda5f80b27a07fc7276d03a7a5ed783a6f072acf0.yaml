      "detail": "M3 adds durable intervention facts without turning review into a mandatory\nTicket lifecycle.\n\nThe canonical ledger remains `.vibehub/tickets/`. Ticket definitions stay\nunder `tickets/`; append-only Reviews live under\n`reviews/<subject-digest>/`; stable exact-subject Decisions live under\n`decisions/`. `graphDigest` continues to identify only Ticket definitions\nand direct topology. `semanticLedgerDigest` identifies the complete\nnormalized Ticket, Review, and Decision meaning. The opaque source token\nadditionally binds the complete raw inventory, so formatting, mode, or\ncomment changes stale an older writer even when normalized meaning is\nunchanged.\n\nFour durable intervention facts are supported:\n\n- `comment` binds an exact graph digest, Ticket revision, or relation tuple\n  and adds non-authoritative context;\n- `ticket_edit` binds an exact Ticket revision and carries one complete\n  replacement Ticket as a proposal, not a canonical Ticket mutation;\n- `plan_review` binds one exact graph digest and records approve,\n  bounded-delegation, or request-changes disposition;\n- `protected_boundary` binds one exact Ticket revision and one exact\n  boundary, then records resolve or decline.\n\nReview identity, path, time, and attribution are host-owned fields. Public\nJSON cannot claim them. The installed CLI review host provisions or reuses\none repository-scoped installation-local profile outside Git and SQLite,\nderives its host attribution from that profile, and exposes one explicit\nsubmit for exact graph or Ticket-revision-and-boundary Decisions. A trusted\nembedding may instead inject exact session capabilities, and the host\nprojects only the intervention controls the active path covers.\n\nA durable Decision document records exact human intent and evidence; it\ndoes not authenticate itself. Raw Git content therefore projects as a\ncurrent-but-unverified artifact. The installed host appends a detached\nEd25519 receipt that binds the complete Decision plus repository\nincarnation, worktree, checkout, exact path and ID, subject, scope, signer,\nconfirmation method, nonce, and issuance time. A fresh reader dynamically\nresolves the public profile from the repo-external registry and verifies\nthe exact signature. The receipt has no time-based expiry; restart\nsucceeds while the exact binding remains current, whereas sibling\nworktree, checkout or subject change, revocation, or document tampering\nfails closed. The older injected-grant path remains session-only.\n\nCurrentness is mechanical and locus-specific. Graph facts compare the exact\ngraph digest; Ticket facts compare Ticket ID and revision; relation facts\ncompare relation reference, endpoints, and dependent Ticket revision.\nHistorical and current-unverified facts remain inspectable but cannot\nauthorize work. Only a current Decision with an exact dynamically verified\ndurable receipt, or the deliberately session-only injected equivalent,\nprojects as `gate_decision` with an `authority_receipt`. Comments never\nmutate the graph.\nA current `ticket_edit` becomes input to a newly authored candidate, which\nmust still pass independent semantic validation before\n`ticket.worktree.patch`.\n\nReview and Decision writers share the worktree writer lock, exact source\nCAS, bounded prospective-ledger validation, atomic no-replace publication,\npost-write verification, and explicit recovery evidence. Checkpointing may\nselect Ticket, Review, and Decision paths and records both graph and\nsemantic-ledger digests, while preserving unrelated staged or dirty work.\n\nThe graph host keeps the complete deterministic direct-unlock layout,\npan/zoom/fit, minimap, and progressive Inspector. Trace failure is visible\nbut does not hide executable context. Current and historical facts remain\ndistinct. Review forms appear only for trusted capabilities, preserve\ndrafts across stale refresh, and name the durable Git document after a\nsuccessful write.\n\nPlanning and Validation Skills refresh the complete graph plus\nsame-snapshot traces before judgment. They treat comments as context,\nreconcile current edit proposals into fresh candidates with Review\nprovenance, honor only current exact authority receipts, retain historical\nfacts as non-authoritative evidence, and never invent a mandatory review\ngate.\n",
