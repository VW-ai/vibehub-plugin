      "detail": "migration 002(user_version 1→2,升级保数据,有测试):\n- 运行域:tasks(五态 CHECK 封顶)/sessions/events(11 型 TimelineEvent\n  判别列 + JSON payload 原样往返)/footprints(原始 file touch,一切\n  足迹派生量之源)/scopes(seq 保申报序)/injections(enqueue/claim\n  原子 FIFO,018)/conflicts+conflict_symbols(序保 1:1 对齐不变式)\n  /conflict_diagnoses(claude -p verbatim + provenance)/notifications\n  (预算账本,020)/mapping_runs(仅 start/exit,无进度分数)。\n- 图域:features(territory/sub-block 同表 parent_id)/specs(无 D,\n  stale/supersede,026)/anchors(足迹→地盘归因 join)/edges。\n- 配置域:settings(repo 0=global,repo 值遮蔽 global)。\n契约铁律落实:milestone 档/twist/filesTouched/session ordinal/\nstaleness 计数/geometry 一律不建列,读时派生(ActivityStore\nreadScopes/sessionIdentity/readDiagnosis 现场计算,有测试钉死:\nread 不计 staleness、蒸馏前文件归因 []=诚实灰区)。\n契约类型四文件(panel/conflict/install + map)canonical 家搬进\ncore/src/contract/(app-demo 副本待切片④消灭)。\nGates:core vitest 59/59(+17)、tsc clean、build 绿。\n",
