      "detail": "The one-time kb migrate-meta command selects current Room copies over legacy duplicates before full validation, validates chosen META Specs, preserves their IDs and draft/active/stale/superseded lifecycle, places each Spec in its Room feature, expands symbol anchors, normalizes only trailing-slash directory anchors, maps heterogeneous relations into the four canonical relation types with OLD-to-NEW supersession, and records source content hashes plus original provenance. It builds the full result in a temporary semantic cache and replaces the Git semantic store only through a digest CAS. Missing relation endpoints are reported and skipped rather than fabricated. The 2026-07-31 migration selected 85 of 109 source files, yielding 88 total canonical Specs and 187 canonical relations.",
