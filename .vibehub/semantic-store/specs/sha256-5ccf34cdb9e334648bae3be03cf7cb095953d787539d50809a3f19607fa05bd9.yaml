      "detail": "VibeHub 不再通过 UserPromptSubmit cadence、shadow checkpoint、transcript boundary、context drift、scope/off-scope 或类似持续检测去适配任意开发流程。普通对话中的持久化只在用户显式请求时按 Capture Routing Contract 路由。\n\n用户显式进入 Ticket development cycle 后，Ticket Plan/Run/Decision/Closeout 已经提供开发边界。Ticket Skills 在需要时读取相关 governed Context，并在周期内产生真正跨 Ticket 仍然成立的 durable semantics 时调用 Context lifecycle；这属于同一开发流程的规则，不是另一套 detector。无需在 complexity/runtime 层重复推断 intent 是否 drift、feature 是否 drift 或 context boundary。\n\nCold-start distillation 仍是显式行为。Context Layer 的 schema、provenance、placement、conflict、stale/supersession 与 validation 质量门槛保持，但何时进入 lifecycle 由显式用户动作或 Ticket workflow 决定，不由 hooks/polling/cadence 决定。",
      "domain": "context-cru",
      "evidence": [
        {
          "confidence": 1,
          "content_hash": null,
          "evidence_id": "decision-project-026:2:1",
          "evidence_ref": null,
          "exact_quote": "context在plan、deviation和plan自动判断，我感觉这也是我们之前做的context drift检测、scope这些，这个在Ticket环节里面没有意义。之前context支持检测，是因为我不知道你的开发流程什么样子；但现在我们直接自己做开发流程，就没有必要在complex层面去触发这些判断。",
