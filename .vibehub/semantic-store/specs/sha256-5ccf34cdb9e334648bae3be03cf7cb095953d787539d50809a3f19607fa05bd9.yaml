      "detail": "用户不应需要记住知识库 CRUD 咒语。SessionStart 协议、MCP discoverability\n与 agent intelligence 应促使模型在非平凡修改前 retrieve，在形成 durable\nintent/decision/constraint 等时 settle，并在 truth 演进时 update/supersede。\n\n“主动”描述 agent 的默认行为，不禁止用户显式 query 或要求沉淀。删除不是\n默认 lifecycle；错误或过时语义优先以 stale/supersede 和 provenance 保留\n演进链。所有 prompt 注入受 token/noise budget 约束。\n",
