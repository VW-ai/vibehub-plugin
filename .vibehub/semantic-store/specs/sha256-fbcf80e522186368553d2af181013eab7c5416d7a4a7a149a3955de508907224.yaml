      "detail": "A durable intent may originate in the user's instruction or in an agent\nproposal that the user adopts. Adoption, not authorship, gives it product\nauthority. The workflow skill decides whether the adopted intent creates a\nnew Task, expands the semantic scope of the current Task, or remains\ncontext-only exploration. A created Task preserves provenance to the\nadopted intent and its success criteria.\n\nMarked stale on 2026-07-27: `decision-ticket-work-unit-001` removes Task as\na canonical entity. Intent adoption remains a valid semantic boundary, but\nTicket genesis now requires a successor Planning/Ticket contract.\n",
