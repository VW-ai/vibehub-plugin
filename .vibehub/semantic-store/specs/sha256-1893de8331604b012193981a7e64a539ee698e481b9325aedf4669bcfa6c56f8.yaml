      "detail": "VibeHub operates inside Claude Code and Codex. A Task has independent\nsuccess criteria; a Run is one execution episode bound to that Task.\nContext-only work binds a repo snapshot but does not require a worktree.\nCode-writing work claims one canonical writer worktree. Task-to-workspace\nownership and Run-to-writer lease are distinct, and lease transfer requires\nmonotonic fencing so a stale Run cannot write after handoff.\n\nContext authority distinguishes query, append operational evidence, propose\nsemantic candidates and promote semantic truth. Mechanical execution may\nappend commands, tests, outcomes and findings, but cannot redefine the\nobjective or promote semantics. Skills decide CONTINUE, EXPAND, DELEGATE,\nHANDOFF and CLOSE; hooks and core only detect candidates and execute\ndeterministic, versioned primitives.\n\nMarked stale on 2026-07-27: `decision-ticket-work-unit-001` replaces Task\nwith Ticket as the sole canonical work-unit identity. The Run, worktree,\nlease, fencing and semantic-authority rules remain design inputs until a\nsuccessor Ticket/Run authority contract is reviewed.\n",
