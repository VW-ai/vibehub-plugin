      "detail": "The v0 compiler binds the current Ticket revision and graph, exact direct\nprerequisite Outcomes, dynamically verified relevant current Decisions\nand their exact authority receipts, repository/worktree/branch identity,\nthe execution-start code source, and every authored context reference.\nRepository file and directory references are expanded deterministically\ninto bounded UTF-8 files with path, byte length, and content digest.\nMissing, ambiguous, overlapping, symlinked, special, binary, changing, or\noversized required context fails closed. Git administration paths and the\nsemantic Ticket ledger cannot be copied back into the generic file packet:\nTicket, Decision, receipt, prerequisite Outcome, and graph identity enter\nthrough their first-class binding fields. Claim recompiles the authored\ncontext manifest before execution begins, so an ignored-file change that\nGit status cannot see still invalidates the binding.\n\nThe Git ContextBinding stores the exact manifest and packet digest. The\noperation response supplies the bounded contents to the fresh Agent.\nContextBinding is a semantic fact; live ownership and heartbeat remain\ndisposable Run coordination. Feature Room v0 is consumed through its\nchecked-in Specs, mapping artifacts, and provenance refs. A generic\nprovider framework is deliberately deferred. Decision verification stays\ndynamic after closeout: revoked or otherwise non-current authority keeps\nthe recorded binding and Outcome traceable but withdraws operational DONE\nand downstream eligibility.\n",
