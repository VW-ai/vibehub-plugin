      "detail": "**Question**: Freeze Workflow's single product meaning so it does not remain\noverloaded across skills, receipts, execution traces, and planning.\n\nThe explored distinction was:\n- Workflow is a reusable method for a class of work;\n- Plan/Ticket Graph is the project-specific compiled instance;\n- Ticket is one schedulable contract;\n- Run is one actual attempt using a Workflow version.\n\nThe answer must define what is durable, what is referenced by version, and\nwhat becomes a Run-specific prompt or method invocation.\n\nThis ticket is unresolved; the explored distinction is not yet ratified.\n",
