      "detail": "本批把 006–010 的裁决落成可本地验证的开发态闭环骨架:\n\n- plugin:manifest + hooks.json + stdio MCP 配置;SessionStart 路由\n  vibehub-query/vibehub-ingest,Stop pending 注入按官方顶层\n  decision:block + reason 唤醒,B2 越界提醒每份 scope 一次;\n- skill intelligence:新增 vibehub-ingest、vibehub-distill、\n  vibehub-query,跨工具拆解/检索/综合 workflow 全住 skill;\n- MCP:register_scope/self_report/kb_retrieve/kb_record/get_manual/\n  kb_apply_distillation 六 capability,description 只描述能力、机械契约与\n  skill 路由,stdio runtime 从 cwd 机械解析 repo/task;\n- core:raw repo-relative glob scope registry + 唯一 matcher;task 首捕保存\n  start_head_sha,commit 从 start_head_sha..HEAD 读侧派生并与 stored hook\n  events 合并成 timeline;GraphStore 支持七 spec 类型、server id、\n  stale/supersede、manifest 整批 apply 与 retrieve;SQLite 升至 v5;\n- injection:CLI 支持 mode/context/db,locus 随队列送达,本地探针已证明\n  CLI → SQLite → hook output 链路。\n\n验证:core 125 tests,MCP 5 tests;core/cli/MCP typecheck+build;Claude plugin\nstrict validation;MCP stdio list/call 与本地 injection delivery probe 全绿。\n真实外部 Claude dogfood 因会向外部模型发送 private repo/plugin context,\n留到用户明确授权后执行;M2 因而保持 in_progress。Tauri 打包按 010 后置。\n",
