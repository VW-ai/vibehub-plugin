      "detail": "VibeHub 聚焦开发工作中的 context lifecycle。核心产品不是一个必须登录的\ndashboard，也不是纯 CLI 工具，而是能在 Claude Code、Codex 等宿主内自然\n工作的 plugin-first local runtime。\n\n产品承诺是确保关键 durable semantics 不漏，并能在后续任务中正确 retrieve；\n不承诺把完整 transcript 当作长期知识。Hook/session/tool evidence 可以保留在\noperational layer，durable layer 只沉淀可复用的 intent、decision、\nconstraint、contract、convention、context、change 与 provenance。\n\nHeadless plugin/runtime 必须独立可用；Workbench App 是同一 runtime 上的\nobservability/intervention surface，用来让用户看见 context、task 与 agent\n状态，并持续 dogfood 底层机制。\n",
