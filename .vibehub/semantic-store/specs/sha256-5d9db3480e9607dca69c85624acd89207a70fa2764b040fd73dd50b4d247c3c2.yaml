      "detail": "**Decision**: The selected Git worktree/tree is the Ticket semantic\nlifecycle boundary.\n\nTicket definitions and typed relations describe the current graph.\nProposal, Validation, Decision, ApplicationReceipt, Outcome, and Evidence\ndocuments preserve the meaningful causal record when that record exists.\nThey are not mandatory stages for every mutation. A Skill decides which\nfacts are needed from the change class and authority boundary:\n\n- delegated clarification or decomposition may be independently validated\n  and applied directly without manufacturing a semantic receipt;\n- an initial plan may enter the current graph after machine validation;\n  human review or explicit delegation gates execution of that active graph,\n  not Ticket activation;\n- a candidate that would select or alter an experience/product choice,\n  accepted architecture or principle, permission/side effect, or\n  policy/risk boundary preserves the unresolved question as a blocker and\n  creates an explicit Proposal or human Decision only when that durable\n  comparison or answer exists;\n- inconclusive validation or honest Planning Fog remains visible rather\n  than fabricating downstream Tickets.\n\nDeterministic scripts bind a mutation to the observed Git HEAD when\ncommitted, the current graph digest, and every targeted Ticket revision.\nThey fail stale changes before writing. A successful patch updates the\naffected Ticket documents as one validated worktree change set. A semantic\nreceipt document is created only when its causal meaning is independently\nuseful; it is not a patch stage. Normal Git commit, merge, and conflict\nsemantics carry collaboration and history; there is no parallel\n`latest.yaml` generation, SQLite application intent, cross-store writer\nfence, or SQLite terminal receipt.\n\nEach worktree reads its checked-out Ticket world. Same-named branches or\nTickets in sibling worktrees may proceed independently. SQLite Run state\nbinds repository identity, worktree identity, exact HEAD/dirty graph\ndigest, Ticket ID, and Ticket revision. Switching branch or changing the\nbound graph makes an active Run stale or suspended instead of transferring\nit silently.\n\nDONE and readiness are reconstructed from durable Ticket, Decision,\nOutcome, and Evidence facts plus any currently live Run observations.\nLosing SQLite may lose heartbeat or a claim, but never durable completion.\n",
