      "detail": "**Prototype question**: Establish the smallest useful human control surface\nfor the first Ticket dogfood loop.\n\nThe prototype should let a human:\n- review through human-understandable scenario/outcome lenses rather than a\n  flat task list or a second canonical object model;\n- review or delegate the coarse plan and its major boundaries;\n- see blockers, human decisions, and deviations immediately;\n- progressively inspect every contributing Ticket without making each one an\n  approval unit;\n- comment or propose simple edits with visible authorship and revision\n  effects.\n\nThe HTML is a project-scoped projection over canonical Ticket operations,\nnever an independent store or raw persistence editor. The prototype should\ndecide the information hierarchy and interaction contract before the final\nApp or replacement of the existing Workbench UX is chosen.\n\n**Prototype 01 — Review horizon**\n\n`artifacts/2026-07-28-ticket-review-surface-prototype.html` is an interactive\nstandalone prototype. It separates the scenario/outcome review layer from\nAgent-owned execution work with a visible “human review horizon”; product\ndecisions and architecture deviations cross that horizon into a focused\nattention queue.\n\nThe prototype supports scenario switching, outcome-only versus full Ticket\nviews, Ticket inspection, local comment/edit demonstrations, and plan review\nversus bounded delegation. It is a proposal awaiting live human reaction,\nnot a ratified UI or a persistence implementation.\n\n**Wayne review of Prototype 01 — rejected direction**\n\nPrototype 01 split the Ticket graph, scenarios, and attention into several\ndashboard-like regions. That obscured the whole workflow, made the surface\nfeel crowded, and left human-review Tickets detached from the place where\nthey occur. The required correction is one at-a-glance workflow in which\nevery Ticket remains visible and attention appears in situ.\n\n**Prototype 02 — Quiet workflow signal**\n\n`artifacts/2026-07-28-ticket-review-surface-prototype-v2.html` starts as one\nquiet Corner Signal and expands that same object into a single workflow\nsheet. All 23 Tickets remain visible across five scenario lanes; human\ndecisions and deviations surface semantically in their original workflow\nposition. Selecting a Ticket progressively opens its decision detail,\ncomments, edit proposal, evidence, and commit trace without replacing the\nworkflow.\n\nPrototype 02 applies `constraint-project-quiet-intelligence-001`. It is\nawaiting live review and is not ratified.\n\n**Wayne review of Prototype 02 — retain as Overview**\n\nPrototype 02 improved whole-plan scanning, but its scenario-by-phase layout\nstill reads as a matrix rather than a real workflow. It does not make\nTicket dependencies, shared prerequisites, forks, joins, or cross-scenario\npaths legible enough. The refined version may remain as an alternate\nOverview, but the primary view should read more like an n8n/Dify dependency\ncanvas.\n\nA healthy graph should contain no orphan Ticket. Every non-top-level Ticket\ncontributes through explicit typed relation paths to a coarse outcome or\nthe overall deliverable. Shared work may feed several scenario lenses or\noutcome paths through explicit dependencies; being shared does not make it\nstandalone or require a UI hierarchy.\n\n**Prototype 03 — Causal Ticket Graph**\n\n`artifacts/2026-07-28-ticket-review-surface-prototype-v3.html` makes Graph\nthe default and retains a quieter Overview as the alternate projection.\nScenario outcomes are real coarse Ticket nodes rather than row labels.\nDirect `depends_on` relations are visible left-to-right connectors;\ncontainment is expressed through spatial scenario and deliverable frames\nrather than a competing set of workflow arrows.\n\nThe canvas demonstrates cross-scenario dependencies, branch and join\nbehavior, in-place human decisions and deviations, pan/zoom/fit, clickable\nrelations with rationale, and causal-path reveal. Clicking a Ticket keeps\nthe graph visible while opening the same progressive detail, comment, edit,\nevidence, and commit surface.\n\nThe sample planning branch also projects\n`convention-ticket-backchain-forward-normalize-001`: synthesize necessary\npaths backward from observable outcomes, then read forward from current\nfacts to remove duplicate, orphan, dead-end, redundant, and falsely\nserialized work. The final canvas still reads in the execution direction.\n\n**Wayne review of Prototype 03 — causal graph retained, ontology refined**\n\nThe primary human reading task is not “which scenario lane owns this\nTicket?” It is “when this Ticket finishes, what becomes executable next?”\nThe review surface should therefore make direct execution relations\nprimary and let a person read the graph in execution order.\n\nA Ticket remains an executable context package: once executable and\nunblocked, a fresh Agent with VibeHub should be able to read its contract\nand bound context and perform the correct work. A scenario is instead a\nplanning and review lens through which a human constrains and validates the\ngraph. A coarse assembly or verification Ticket may prove that a scenario\nhas been achieved, but Scenario is neither a second canonical entity nor\nautomatically identical to one Ticket.\n\nTickets should not be presented as a nested UI hierarchy. Containment,\ndependency, supersession, evidence, and other meanings remain explicit\ntyped relations. The default graph projects the direct unlock/dependency\nrelation; other relation types and scenario lenses refine inspection\nwithout creating competing workflow arrows.\n\n**Prototype 04 — Quiet execution instrument**\n\n`artifacts/2026-07-28-ticket-review-surface-prototype-v4.html` is the\npreserved high-fidelity reference artifact for the converged standalone\nprototype. It starts as the same quiet Corner Signal and expands into one\nzoomable, pannable execution canvas. The sample keeps all 29 Tickets and 35\ndirect unlock relations available at once, applies a deterministic\nleft-to-right layered layout with straight-first orthogonal routing, and\nuses level of detail rather than lanes or pagination when the complete\ngraph is fit to the viewport.\n\nSelecting one Ticket leaves the graph visible and docks one Inspector into\nthe canvas edge. The Inspector exposes the executable handoff, dependency\nsatisfaction, active Run, acceptance evidence, validation, relation\nneighborhood, scenario lens, evidence, commit trace, comments, and edit\nproposals. Selecting one relation exposes its direct-unlock rationale.\nScenario remains an optional review lens over the same stable layout and\nnever causes graph reflow.\n\nRuntime dimensions remain visually independent:\n\n- blue identifies an active Run and its actual execution spine;\n- moss identifies dependency satisfaction, accepted evidence, proof, and\n  valid handoffs;\n- ochre identifies a human authority boundary;\n- rose identifies deviation, conflict, or failed validation;\n- muted violet identifies stale context or a definition that must be\n  recompiled;\n- hover, selection, and related-path focus remain neutral interaction\n  states rather than borrowing a Runtime color.\n\nThe fixed visual base is matte and near-monochrome. Tickets are bounded\nexecution objects, not floating dashboard cards; the readiness aperture\npunctures the Ticket boundary as the one characteristic visual signature.\nThe Inspector is a structural split pane rather than a modal or floating\ncard. Healthy state stays quiet, while human decisions, deviations, active\nRuns, proof, and stale context surface at the exact graph locus that owns\nthem.\n\n**Resolved review-surface decision**\n\nThe v0 project review surface is one lightweight projection over canonical\nTicket reads and operations:\n\n- the primary view is the complete direct-unlock Ticket Graph, read\n  left-to-right as “what may execute next,” with deterministic pan, zoom,\n  fit, minimap, and level-of-detail behavior;\n- Tickets have no presentation hierarchy; scenario is a human planning and\n  review lens over related Tickets, while coarse verification or assembly\n  Tickets may anchor observable scenario completion;\n- human review gates a coarse outcome plan and genuine authority\n  boundaries, not every executable Ticket;\n- human decisions, deviations, stale context, active Runs, and proof remain\n  in situ and are redundantly encoded by shape, words, and restrained\n  semantic color;\n- progressive inspection keeps the graph visible and makes Ticket\n  contracts, direct relation rationale, evidence, commits, comments, and\n  simple edit proposals traceable;\n- comments and edits are attributed Git-native proposals or Ticket\n  document changes through deterministic operations, not writes to an\n  HTML-owned store;\n- graph layout is a derived, reproducible view artifact. Runtime state,\n  selection, hover, or scenario lens changes must not move Tickets.\n\nPrototype 04 fixes the current product and interaction direction. Exact\ntypography metrics, color values, spacing, and future host container remain\nimplementation details as long as they preserve this contract.\n\nWayne accepted this direction through iterative live review on 2026-07-28.\n\n**First live projection — 2026-07-29**\n\nThe CLI now packages a proposal-specific local host derived from Prototype\n04 rather than preserving the HTML only as a static reference. It renders\ncurrent candidate outlines and direct unlocks with deterministic layered\nlayout, orthogonal edges, pan/zoom/fit, a working minimap, causal focus, and\none progressive Inspector. It exposes exact validation summaries and the\nderived authority boundary without inventing readiness, Run, proof, or\nScenario facts. Stale proposals show the current canonical graph rather\nthan a graph mislabeled with the old candidate digest.\n\n**Git-native pivot clarification — 2026-07-29**\n\nThe graph, Inspector, layout, and interaction direction remain ratified.\nTheir data source becomes the current Git Ticket document ledger. The local\nhost no longer owns a trusted-provider/SQLite application workflow; review,\ncomments, edits, and decisions produce inspectable Git document changes.\n\n**M3 live intervention surface — 2026-07-30**\n\nThe graph host now projects durable Git-native Review and Decision facts at\ntheir exact graph, Ticket, or relation loci. Current and historical traces\nremain distinct. M3 first established exact injected session capabilities;\nM3.6 completes the installed path with a repository-scoped install-local\nauthority. The installed host exposes comments, complete Ticket edit\nproposals, graph plan review, and Ticket protected-boundary Decisions.\nOne explicit Decision submit freezes the exact current subject and scope,\nwrites the Decision, and appends its detached Ed25519 receipt.\n\nDurable Decision YAML records the exact choice but cannot authenticate\nitself. A raw Decision stays visible as current-unverified evidence. A\nfresh reader projects executable authority only after dynamically\nverifying the exact signed receipt against the repo-external profile. The\nreceipt has no time-based expiry; source change, tamper, profile mismatch,\nor revocation retreats to current-unverified. The host click proves an\naction by the local Plugin installation, not WebAuthn, biometric presence,\nor named-human identity.\n\nReview stays progressive and in situ: one disclosure row opens inside the\nexisting Inspector, trace failure does not hide executable context, stale\nrefresh preserves the user's draft, and a successful intervention exposes\nits durable Git path. The host remains a projection over canonical\noperations rather than an HTML-owned editor or another chat.\n\n**Claimed**: Codex 2026-07-28\n",
