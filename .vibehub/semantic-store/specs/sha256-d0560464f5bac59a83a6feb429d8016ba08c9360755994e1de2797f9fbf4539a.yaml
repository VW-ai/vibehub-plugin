      "detail": "A Decision document is durable intent and evidence, not a\nself-authenticating authority receipt. M3 may attest one exact Decision\ninside the trusted host process that received the human action, but that\ncapability correctly disappears on restart, branch or worktree change,\nexpiry, or document tamper. Independent CLI Skill invocations therefore\nsee raw Decisions as current-unverified evidence and must preserve the\nprotected boundary.\n\nBefore execution and closeout can use protected Decisions across fresh\nprocesses, VibeHub needs one small durable attestation boundary. A trusted\nhuman ceremony in a real installed-plugin entrypoint must attest the exact\ncanonical Decision document, authority principal, repository incarnation,\ngoverned ref or branch, subject, and scope. A fresh host or Agent must be\nable to verify that attestation without SQLite, a previous process, or\ncaller-supplied authority fields. Arbitrary repository write access must\nnot be sufficient to mint it.\n\nThe implementation may use a signed Git-adjacent receipt, host identity,\nOS-backed key, or another narrow mechanism after focused research. It must\ndefine trust-root enrollment, explicit human presence, expiry or\nrevocation, replay behavior, worktree and branch isolation, and recovery.\nIt must also provide the real production adapter that binds the review host\nto that trusted identity; constructor options and tests alone are not a\nuser-facing integration.\n\nKeep the mechanism scoped to Decision authority. Comments and edit\nproposals remain ordinary attributed Git facts, and Ticket planning,\nvalidation, graph layout, execution scheduling, Outcome, and Evidence do\nnot belong in an authentication subsystem.\n",
