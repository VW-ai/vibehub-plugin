      "detail": "用户反馈表明，agent 可能讨论并采纳重要 intent/decision，却没有执行 knowledge\nwrite。Checkpoint 每隔若干有效 user turns 注入短提醒，要求 agent 回看自\n上次成功写入后的 task-scoped 对话，判断是否出现新的 durable semantics。\n\nHook 只实现 cadence、prompt-id dedupe、高水位与成功 canonical write 后重置。\n是否需要写、如何分类、去重和 placement 继续由模型 + ingest skill 决定。\n没有 durable change 时继续工作，不制造空记录。\n",
