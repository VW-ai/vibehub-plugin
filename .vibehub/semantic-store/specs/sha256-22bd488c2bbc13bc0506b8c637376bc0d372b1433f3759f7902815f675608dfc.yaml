      "detail": "Agent 可能讨论并采纳重要 intent/decision，却没有执行 canonical knowledge write。所有仓库继续按 task scope 机械记录 deduplicated user-turn cadence，并仅由归属于该 task 的成功 canonical knowledge write 重置。\n\n没有 canonical Ticket ledger 的 checkout 保留周期性 knowledge reminder 安全网：到达 cadence 后注入短提醒，由模型 + vibehub-ingest 判断是否存在 durable semantics；没有 durable change 时继续工作，不制造空记录。\n\n存在 .vibehub/tickets/protocol.yaml 的 Ticket-managed checkout 在同一 cadence 记录 shadow checkpoint 并推进 reminder high-water，但不向正在执行的 Ticket Run 注入通用提醒。Ticket Plan、Run Evidence 与独立 closeout 提供主要工作边界；当规划或执行暴露 project-wide knowledge gap 时仍使用 vibehub-query，当 intent、decision、constraint、contract、convention、context 或 change 应跨 Ticket 治理时仍使用 vibehub-ingest。Shadow mode 是对运行噪音的调整，不得削弱 canonical validation、provenance、placement、conflict、stale 或 receipt 质量语义。\n\nHook 只实现 ledger presence 检测、cadence、prompt-id dedupe、高水位与成功 canonical write 后重置。不得解析 transcript、估算 token 或执行语义分类；语义判断继续由 Skills 完成。",
