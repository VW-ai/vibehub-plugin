      "detail": "The completed architecture spikes support a split authority model. A strict\nGit semantic tree carries durable feature/spec/revision/evidence/anchor/\nrelation/provenance truth. SQLite remains canonical for operational state\nand holds rebuildable semantic query caches keyed by repository identity,\ncommit SHA and derived semantic digest.\n\nStable identity-derived paths preserve useful native Git merge behavior.\nMutable global manifests and committed global digests are rejected as\ncollaboration hotspots. Branch commits are durable proposals; merged main\nis shared semantic truth. Provenance uses collision-safe durable content\nidentity while SQLite integer IDs remain cache-local projections.\n\nWayne approved all six review decisions on 2026-07-20. Repositories cut\nover independently when their canonical protocol appears; this avoids a\nglobal flag day and gives every repository one non-dual-write authority\nboundary.\n",
      "domain": "git-semantic-store",
