      "detail": "**Question**: Define storage and authority by semantic meaning rather than by\nmirroring objects across every store.\n\nExisting authority already uses `.vibehub/semantic-store/` for durable\nsemantic state and SQLite for operational state and projections. The\nproposed Ticket records span both temperatures. The answer must avoid\nnamespace collision, split-brain writers, Git noise from high-frequency\ntransitions, and a second copy of Feature Room truth inside Ticket bodies.\n\n**Resolved read-bootstrap boundary (2026-07-28)**:\n\nThe outline-compatible subset of Ticket definition revisions and published\ndependency topology now has an independent Git-native read-bootstrap\nauthority at `.vibehub/ticket-store/`. It is not a namespace inside\n`.vibehub/semantic-store/`, because the existing semantic store has a closed\ninventory and whole-tree replacement semantics.\n\nThe V0 read authority contains:\n\n- one protocol document with a stable store identity;\n- immutable, stable-path outline revisions containing identity, creation\n  provenance, outcome, containment parent, dependencies, and provenance\n  references;\n- immutable generation manifests binding exact definition checksums;\n- one `latest.yaml` pointer naming the default published generation.\n\nA generation is the complete supported whole-project Ticket definition and\nexplicit dependency inventory for one verified worktree. Retained\ngenerations reconstruct exact review snapshots across process restarts and\nlater `latest` changes. The provider is read-only, follows no symbolic\nlinks, applies a pre-parse bound to every file, and enforces the cumulative\naggregate generation bound fail-closed as files are read. It verifies\ncanonical bytes and checksums, tolerates an atomic latest-pointer\nreplacement as either complete old or complete new, and distinguishes\nabsent graphs, expired snapshots, corruption, and scope mismatch.\n\nSQLite remains operational projection/receipt storage and now also holds\nimmutable proposal review contributions. It is not a fallback authority for\nTicket definitions or published topology. META Specs, legacy Task rows, and\nprototype fixtures are likewise forbidden production fallbacks. Current\ncapability projections and trace records are honestly empty until their own\nauthorities exist.\n\nThis outline is not yet the complete ratified Ticket definition: scope,\nacceptance, permissions, execution policy, and their maturity/lifecycle\nrules are not persisted by this format.\n\n**Still unresolved above the outline store**: complete definition storage,\nretention and GC,\nPlan/Run/Outcome/Event/Artifact/Evidence authority, and selection of current\ncapability receipts. The internal publication-head CAS, local writer\narbitration, and fsync boundary are frozen separately below. Large Ticket\nread outcome payloads are\ncontent-addressed and deduplicated across immutable request receipts; each\nreceipt keeps only its small request binding and a payload digest. Quotas,\nretention, and GC for request rows and distinct outcome blobs remain\nunresolved: large-payload bytes grow with distinct canonical outcomes,\nwhile fixed-size receipt metadata still grows with request count.\nTherefore this broader storage Decision remains open even though the\ncanonical read bootstrap is frozen.\n\n**Resolved writer-substrate boundary (2026-07-28)**:\n\nThe same independent store may now be advanced by one Core-owned,\nauthority-neutral generation publisher. Publication is whole-generation\nrather than per-edge CRUD. It uses expected-snapshot CAS under an exclusive\nuntracked lock directory in the worktree-specific Git administration path.\nAcquisition atomically renames a fully written, nonempty staging directory\ninto the canonical lock location. The publisher installs canonical revision and\ngeneration files immutably, bootstraps through atomic rename of one\nfully-synced sibling store directory, and replaces `latest.yaml` atomically\nonly for later complete generations. File and containing-directory syncs\nmake the applicable rename the crash visibility boundary; a crash may leave\nunreachable immutable objects but must not expose a partial generation. If\nthat rename succeeds but its parent sync fails, Core reports an explicit\ncommit-uncertain result with previous/candidate generation identities and\nretains the writer lock for reconciliation through the read surface.\nMalformed, unfenced, or foreign lock state fails closed. Automatic generic\nstale-owner stealing remains deferred; only the exact persisted\napplication-intent recovery described below may adopt or clean a fence.\n\nStatic symlinks and special files are rejected, but this V0 primitive\nassumes the host prevents a hostile same-UID process from actively swapping\nparent paths during filesystem calls. A stronger hostile-local-filesystem\nboundary requires directory-relative primitives or an exclusive broker.\n\nExisting Ticket creation provenance and revision bytes are immutable.\nDefinition revisions are monotonic without gaps, and the V0 writer rejects\nimplicit deletion by inventory omission. It remains a storage primitive,\nnot a public authoring command or evidence of semantic, mutation, or human\nauthority.\n\nStill unresolved after this partial freeze: complete Ticket definition\nstorage, explicit removal and supersession records, generic stale-lock\nrecovery outside an exact application intent, Git commit policy,\nremote/multi-host arbitration, retention and GC, and all non-definition\nruntime fact authorities.\n\n**Resolved immutable proposal-log boundary (2026-07-29)**:\n\nSQLite is the canonical authority for submitted Ticket review\ncontributions. `ticket.proposal.submit` appends one immutable proposal\npayload with stable Core-generated identity, digest, scope binding, claimed\nauthor, and submission time. It has no mutable status and is neither a\nTicket definition nor a graph generation.\n\nProposal insertion and the shared idempotent operation request receipt\ncommit in the same SQLite transaction. Repository, worktree, and repository\nincarnation are bound before replay, incarnation is rechecked around graph\nloading, and task attribution binds the task's exact worktree. A successful\nsubmission therefore cannot leave a proposal without its receipt or a\nsuccess receipt without its proposal.\n\nSubmission reads the exact observed Git Ticket snapshot and exact targeted\ndefinition revisions, materializes Core-generated Ticket identities,\nrevisions, timestamps, and proposal provenance, and mechanically validates\na complete candidate under a 4 MiB decoded logical-input budget. CLI and\nSkill reject oversized raw proposal JSON before parsing, and MCP applies\nfinite frame and proposal-envelope limits. Caller provenance is\nrejected and caller-derived creation attribution is marked\nclaimed_unverified. It never calls the internal Git generation publisher,\nso the Git authority stays unchanged.\n\nThe stored actor and authorAssessment are untrusted attribution and routing\nclaims. Bootstrap always indicates initial_plan_authority. Independent\nsemantic machine validation and trusted human authority remain separate\nreceipts. Technical difficulty alone does not require a human gate.\n\n**Resolved proposal-query and validation-ledger boundary (2026-07-29)**:\n\nSQLite also holds immutable proposal-validation contributions as a\nproposal-specific semantic evidence ledger. Each record is bound to one\nexact graph-change proposal and candidate digest, carries only\nclaimed_unverified producer/policy/actor attribution, and commits with its\nidempotent operation receipt. It does not become Ticket definition,\nreadiness, authority, GateDecision, application, or graph-mutation truth.\n\nProposal and validation inspect/list operations are the only public read\nboundary over these rows. Lists are bounded summaries under\nscope/filter/high-water keyset cursors; direct SQLite access remains\nforbidden. Multiple contrary validation records coexist, and no mutable\nstatus, current/latest pointer, precedence, or automatic aggregation record\nis stored.\n\n**Resolved trusted authority and application-ledger boundary (2026-07-29)**:\n\nSQLite now also owns three immutable record families:\n\n- one terminal authority decision for an exact proposal/candidate and the\n  complete bounded validation-set digest/high-water/count;\n- one application intent retaining the exact complete candidate\n  definitions, repository incarnation, base and candidate snapshot IDs,\n  deterministic store ID, and publication counts needed for recovery;\n- one terminal application receipt binding that intent and authority\n  decision to a `published` or `reconciled` Git generation.\n\nThe authority decision is accepted only from a non-serializable trusted\nprovider injected by the host. Its provider descriptor, host-authenticated\nprincipal, human-authority or delegation basis, resolved assessment, and\nexact accepted passing validation refs are persisted and digest-bound.\nCaller actor and operation JSON cannot mint any of those fields. Once the\ndecision commits, the proposal-validation ledger is closed by both Core\nchecks and a SQLite trigger.\n\nThe application service persists the intent before publication. It then\nenters the Git publisher with a writer-lock fence containing the application\nintent identity, intent digest, and candidate snapshot. That exact fence is\nheld through Git visibility and released only after the SQLite application\nreceipt transaction commits. A retry after Git publication but before\nreceipt persistence may adopt only byte-identical fence facts: current\ncandidate reconciles, original base resumes, and a malformed or foreign\nfence or third head fails closed. Normal release first atomically renames\nexact `owner-T` to `releasing-T`, unlinks only that token-specific marker,\nthen removes the canonical directory only if still empty. A successor's\nnonempty `owner-U` makes stale removal fail harmlessly; crash-empty state can\nbe removed or atomically replaced by staged acquisition. Cleanup after a\ncommitted receipt may claim only its exact fence and only after verifying\nthe canonical Git head equals the candidate. This gives one recoverable\ncross-store protocol without pretending SQLite is the Ticket definition\nauthority.\n\nAuthority and application operations are registered through Core/CLI/MCP,\nbut default CLI/MCP construction injects no authority provider. It can\nexpose review and application contracts but cannot self-authorize bootstrap\nor protected changes. A trusted host decision bridge remains required for\nauthenticated human authority.\n",
