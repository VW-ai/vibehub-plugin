      "detail": "**Supersession note — 2026-07-29**: This contract is retained as design\nprovenance, but its SQLite proposal/validation/authority/application\noperations and generation-backed read source are retired. M1A preserves\nonly the three read responsibilities—graph snapshot, subject inspection,\nand trace listing—on the Git-native Ticket ledger with wire schema v2.\nA successor mutation contract will be written from the Skill-facing Git\npatch boundary rather than reviving the workflow below.\n\n`V0` names the product/contract maturity of this slice. The wire DTOs use\ninteger `schemaVersion: 1`; these version axes are independent.\n\nThis contract freezes the smallest coherent Core surface required by the\naccepted Ticket Review Surface: three graph reads, immutable proposal\ncontribution/query operations, an append-only proposal-validation ledger,\ntrusted authority resolution, and crash-reconcilable application. It does\nnot decide Context Binding, Closeout, generic GateDecision recording,\ncomplete Ticket definition storage, or the trusted host UI.\n\n**One shared read spine**\n\nThe packaged Ticket wrapper, CLI, and MCP now converge on the existing\nCore OperationDispatcher. Adapters do not own alternative semantics or\npersistence. Ticket semantic Skills remain a separate intelligence layer.\nThe browser surface now talks only to a thin local bridge. That bridge uses\nthe same OperationDispatcher and never calls operational or Ticket storage\ndirectly.\n\nThe first three read responsibilities and operation names are:\n\n- `ticket.graph.snapshot`: load one coherent, bounded whole-project\n  direct-unlock projection;\n- `ticket.subject.inspect`: inspect one snapshot-visible Ticket or one\n  snapshot-scoped relation without replacing the graph;\n- `ticket.trace.list`: read display-complete trace records as of the same\n  projection watermark.\n\nFull executable input/output schemas are implemented as an explicit opt-in\nvalidation surface. A storage-agnostic Core source-provider seam and\nstateless read service implement the three responsibilities. The operation\nnames are registered with the shared dispatcher, generated contract\nartifact, packaged Ticket wrapper, CLI `ticket` group, and MCP\n`ticket_operation` tool.\n\nOne separate write responsibility is now registered through those same\nadapters:\n\n- `ticket.proposal.submit`: append one immutable comment or graph-change\n  review contribution without changing the Ticket Graph.\n\nThe proposal decision/application responsibilities are also registered:\n\n- `ticket.proposal.review.inspect`: bind the complete validation set and\n  derive eligibility plus one next action;\n- `ticket.proposal.authority.decide`: ask a host-injected trusted provider\n  for one immutable decision over the exact proposal/candidate/set;\n- `ticket.proposal.apply`: persist an immutable application intent, publish\n  its exact complete candidate under a Git fence, and record one terminal\n  application receipt.\n\nThe App bridge remains future work.\n\nThe public `/contracts` entry remains dependency-light TypeScript\ntypes/constants and does not import Zod or Node Runtime code. Strict Zod\nschemas use an explicit schema entry point. The canonical projection-source\nschema is an internal Core seam, not a public write contract.\n\n**Opaque snapshot, not a hidden graph model**\n\nA snapshot has an opaque `snapshotRevision` and `projectionWatermark`.\nThese names do not imply one canonical global graph revision, historical\ngraph addressing, durable relation revisions, or a choice between Plan,\nproposed, current executable, initial, and executed graph identities.\nThose remain with `decision-ticket-graph-lifecycle-001`.\n\nPagination is allowed only as transport: every page remains bound to the\nsame snapshot and watermark, and the client buffers the supported project\ngraph before presenting it as complete. Snapshot/cursor identity survives\nseparate in-process CLI or MCP invocations without daemon affinity. Above a\ndeclared V0 capacity boundary, Core fails explicitly rather than silently\npresenting a partial graph.\n\nRelations have a `relationRef` unique within a snapshot and explicitly name\nprerequisite and dependent Ticket endpoints. A relation deep link includes\nboth snapshot and relation references. Durable relation identity, revision,\ncomments, and mutations are not frozen here.\n\n**Resolver-selected facts, projections, and capability slots**\n\nPrototype shorthands such as `human`, `deviation`, `waiting`, `running`,\n`done`, `stale`, and `proof` are not writable Ticket states. Selection,\nhover, filters, lenses, pan/zoom, node positions, and edge routes are view\nstate.\n\nThe canonical Git provider supplies\n`currentCapabilityProjections` for the exact `snapshotRevision` and\n`projectionWatermark` before invoking the pure projector. In this bootstrap\nevery capability remains honestly unavailable because no currentness\nauthority exists yet. The projector does not consume append-only receipt\nhistory and never infers currentness, supersession, revocation, or\nprecedence. It validates any resolver-selected set and fails closed on\nambiguity or mismatched binding.\n\nTicket projections and Ticket capabilities bind both `ticketId` and\n`definitionRevision`. Relation projections, relation capabilities, and\nrelation traces bind `relationRef`, `prerequisiteTicketId`, and\n`dependentTicketId`, as well as the snapshot revision and watermark where\napplicable. A relation reference alone cannot transplant data across\nsnapshot sources.\n\nSemantic judgments are supplied only by Skills/validators; validation\njudgments by validators; and active Run/execution-spine observations by\nthe Runtime. Producer eligibility does not freeze a payload. Every\navailable capability uses a strict, bounded, capability-scoped\npresentation envelope (`label`, optional `detail`/`count`, and references)\nwith unknown keys rejected. It is not arbitrary JSON and cannot carry\nScenario, layout, progress, or generic state. Deeper capability-specific\npayloads remain unavailable in V0.\n\nCore validates binding and structure; it does not infer semantic answers.\n\nThe implemented provider seam accepts only one atomic, already-resolved\nprojection source. It has separate `loadLatest` and `loadSnapshot`\nresponsibilities and strict result envelopes. Its default production\nimplementation reads the independent Git-native Ticket store: immutable\ndefinition revisions, immutable retained generation manifests, and one\nlatest pointer. The read service validates request selectors before source\naccess, resolves later graph pages and detail reads by their exact\n`snapshotId`, and never substitutes a new source for an unavailable old\nsnapshot. Failure to reconstruct that exact source is `snapshot_expired`.\n\nMETA Specs, legacy Task rows, the v4 HTML, and the structured v4 fixture are\nexplicitly ineligible as production fallbacks. They do not establish\ncanonical Ticket identity, graph lifecycle, projection currentness, or\ndurable snapshot reconstruction.\n\nCore forwards a verified repository/worktree scope to every provider call.\nThe production provider partitions latest and snapshot lookup by that\ncomplete scope, safely opens bounded canonical files without following\nsymbolic links, validates checksums and graph invariants, and reconstructs\nretained snapshots in a fresh process after `latest` changes. Dispatcher\nreceipt hashes also bind the verified scope and local Git repository\nincarnation before replay. Cross-worktree replay, foreign repositories, and\nsame-path repository replacement are rejected. Filesystem projection runs\noutside the short SQLite receipt transaction.\n\n`ticket.subject.inspect` and `ticket.trace.list` are strictly as-of the\nbound snapshot. They never mix live-head facts into an older canvas.\nRefresh means reading a new snapshot.\n\nTrace targets are typed. URLs allow only absolute HTTP(S); repository paths\nare canonical repository-relative paths that a future host must resolve\nwith real-path containment under the repository root; opaque targets are\ndisplay/copy references and never hrefs. An available `gate_decision` trace\nmust cite a verified authority receipt bound to the decision and subject.\nA claimed actor may be shown as attribution but never authorizes the gate.\n\n**Submit-only proposal boundary**\n\n`ticket.proposal.submit` is now executable because its only effect is one\nimmutable review contribution in SQLite. A comment binds an exact\nsnapshot-visible Ticket revision or relation tuple. A graph-change proposal\nbinds an exact observed snapshot, create-absence and\nrevise-expected-revision preconditions, and complete replacement definition\nbodies. It cannot submit raw JSON Patch, per-edge CRUD, implicit deletion,\nwhole-store replacement, or writable status/maturity/progress.\n\nCore generates proposal identity and digest, scope binding, new Ticket IDs,\ndefinition revisions, timestamps, and proposal provenance. Caller\nactor/reason/source attribution remains claimed_unverified, caller\nprovenance references are rejected, and decoded logical input is capped\nat 4 MiB. CLI and Skill enforce the same raw proposal limit before\nparsing; MCP caps all raw frames at 64 MiB and identified proposal calls\nat 5 MiB including the tool envelope. Core resolves local references and mechanically verifies the\ncomplete candidate graph, endpoints, cycles, bounds, ordering, and revision\ntransitions. Passing that review does not publish the candidate: every result explicitly states\n`review_contribution_only` and `graphMutationApplied: false`.\n\nThe request `actor` remains claimed attribution. `authorAssessment`,\nincluding its elaboration/decomposition/expansion class and authority\nsignals, is untrusted routing input. It cannot self-validate a proposal or\ngrant authority.\n\nIndependent semantic machine validation remains a separate receipt. Human\nauthority remains separate again and is indicated only for initial-plan,\nexperience/product, principle-deviation, permission/side-effect, or\nrisk/policy boundaries. Bootstrap always indicates initial_plan_authority;\nuntrusted authorAssessment cannot mark it delegated. Technical difficulty\nalone is not a human gate. Core may expose a route hint, but the hint is not\nan application decision.\n\nProposal payload insertion and its shared idempotent operation receipt occur\nin the same SQLite transaction. Repository incarnation is rechecked around\ngraph-head loading and task attribution binds the task's exact worktree.\nSubmission never invokes the internal Git generation publisher, so a successful submit cannot alter\n`.vibehub/ticket-store/`.\n\nGeneric `ticket.gate.decision.record` still waits for its own gate-subject\ncontract. Proposal-specific authority and application now use the three\nregistered operations above. Public JSON binds immutable digests only; it\ncannot contain a trusted principal, disposition, authority assertion, or\nprovider result. Those values enter Core only through a non-serializable\n`TrustedTicketProposalAuthorityProviderV0` injected by a trusted host.\n\nNeither command may write status, maturity, progress, completion, Scenario\nCRUD, layout, raw JSON Patch, per-edge CRUD, or persistence directly.\n\n**Bounded proposal-query and validation-evidence boundary**\n\nFive additional operations are frozen through the same shared dispatcher\nand adapter spine:\n\n- `ticket.proposal.inspect`;\n- `ticket.proposal.list`;\n- `ticket.proposal.validation.record`;\n- `ticket.proposal.validation.list`;\n- `ticket.proposal.validation.inspect`.\n\nProposal inspect returns one exact immutable contribution. Proposal list\nreturns bounded summaries under a scope/filter-bound high-water cursor;\ncomplete payloads require explicit inspection. Both preserve the stored\nsnapshot, target, digest, candidate, mechanical-review, and\nclaimed-attribution boundaries without synthesizing a mutable proposal\nstatus or comparing the contribution with the live graph head.\n\nMaterialized graph-change outputs remain compact. Creates expose the\nallocated Ticket, complete new definition, and an added-only dependency\ndelta. Revisions expose the complete replacement plus previousOutcome,\npreviousParentId, and exact added/removed dependency deltas; they do not\nembed a complete previousDefinition. The complete materialized proposal\noutput is capped at 8 MiB before persistence. Overflow fails closed with\nguidance to split the change into smaller bounded proposals, and an\noversized corrupt stored record is never returned by inspection.\n\nProposal validation is candidate-specific semantic evidence for an\nimmutable graph-change proposal. It binds the exact proposal and candidate\ndigests and evaluates promise_preservation, containment_truth,\ndependency_truth, change_classification, delegated_scope, and\nprotected_boundaries. The validator producer, policy, and actor remain\nclaimed_unverified. This is not the Ticket-revision ValidationReceipt used\nto derive outline/specified/executable maturity, and it cannot grant\nauthority, satisfy a GateDecision, authorize application, or mutate the\ngraph.\n\nValidation contributions are append-only. Multiple validators may record\ncontrary assessments against the same proposal and all remain inspectable.\nV0 has no current/latest/winner, supersession, revocation, quorum,\nprecedence, or automatic aggregation rule. List pagination watermarks\nprovide transport consistency only and do not imply semantic currentness.\n\nThe independent `vibehub-ticket-validate` Skill inspects one immutable\ngraph-change proposal and resolves required prior-state context only from\nits exact observedSnapshotId. It inspects affected existing Tickets,\nparents, and dependency endpoints at that snapshot; when retained-edge\nevidence or a changed existing relation is relevant, it uses the\nrelationRef discovered from the exact-snapshot Ticket projection to inspect\nthat exact relation. It never substitutes current/latest context. Missing\ncontext produces an inconclusive blocking finding. The Skill judges the six\nsemantic questions and calls `ticket.proposal.validation.record`. It never\ntrusts authorAssessment, self-authorizes, records a GateDecision, applies\nthe proposal, or invokes the internal Git publisher.\n\n**Executable implementation slice**\n\nThe safe read kernel includes:\n\n- dependency-light browser-safe review DTOs/constants with explicit\n  available/unavailable capability slots;\n- opt-in strict input/output schemas for the three reads and an internal\n  canonical source schema;\n- a deterministic pure projector over resolver-selected snapshot facts and\n  `currentCapabilityProjections`;\n- a structured fixture extracted from the accepted\n  29-Ticket/35-relation prototype;\n- tests for coherence, deterministic ordering, unsupported capabilities,\n  and rejection of authored state/progress/scenario/layout fields.\n\nThe same slice now also includes:\n\n- a repository-scoped, storage-agnostic resolved-source provider interface\n  with a Git-native production provider;\n- a stateless Core read service that maps the three responsibilities to\n  `loadLatest` or exact `loadSnapshot` calls;\n- cross-service-instance reconstruction, no-graph, expired-snapshot,\n  selector-validation, strict provider-envelope, and\n  no-latest-substitution tests;\n- immutable retained generations with corruption and unsafe-file rejection;\n- production dispatcher registration with repository/worktree-bound replay;\n- generated operation contracts, packaged Ticket wrapper, CLI and MCP\n  adapters with byte-semantic parity tests.\n\nThe submit-only addition includes:\n\n- dependency-light proposal DTOs and strict generated operation input;\n- exact comment-subject and graph-change target binding;\n- deterministic Core materialization and mechanical candidate review;\n- an immutable append-only proposal store committed atomically with the\n  operation receipt;\n- the same packaged wrapper, CLI, and MCP adapter path as the reads.\n\nThe proposal-ledger extension freezes bounded proposal inspect/list,\nproposal-validation record/list/inspect, and the independent\n`vibehub-ticket-validate` semantic intelligence boundary. Its implementation\npreserves the immutable ledger, claimed-unverified evidence, and\nno-current/latest rules above.\n\nThe authority/application extension adds browser-safe contracts and strict\nschemas for review, authority decision, immutable intent, and application\nreceipt; one Core service behind the dispatcher; three SQLite immutable\nledgers; and a fenced internal publisher path. Authority binds the complete\nvalidation set by digest, high-water sequence, and count. An authorized\ndecision cites at least one exact passing validation without a blocking\nfinding; contrary receipts remain part of the bound set. Recording a\ndecision closes further validation for that proposal.\n\nCore derives the required path conservatively. Bootstrap, expansion,\nauthor-declared human gates, or any protected authority signal requires a\nhost-authenticated human and human-authority basis. Only non-protected\nelaboration/decomposition may use a trusted delegation basis. Provider\nassessment can strengthen but never downgrade proposal change class or\nerase authority signals.\n\nApplication stores the exact candidate definitions and deterministic\npublication facts before entering Git. Its writer-lock fence binds the\napplication intent ID, intent digest, and candidate snapshot and remains\nheld until the immutable SQLite application receipt commits. If Git\npublication succeeded but receipt insertion failed, retry adopts only that\nexact fence: current candidate records `reconciled`, original base resumes\npublication, and any malformed or foreign fence or third head fails closed.\nThe operational lock directory lives in the worktree-specific Git\nadministration path. Release claims exact `owner-T` as `releasing-T`,\nunlinks only that marker, then removes the canonical directory only if still\nempty. A successor's nonempty `owner-U` makes stale removal fail harmlessly;\ncrash-empty state can be removed or atomically replaced. Completed-receipt\ncleanup additionally verifies that the canonical Git head equals the\ncandidate before touching the exact owner or releasing marker. Successful\ndomain receipts make replay idempotent; failed authority/apply operation\noutcomes are not cached as terminal receipts so changed trusted-host or\nrecovery conditions can be retried.\n\nDefault CLI/MCP construction passes no trusted authority provider. The\noperations are visible, but a caller-selected actor cannot authorize\nbootstrap or any protected change; authority resolution fails closed with\n`trusted_authority_unavailable`. The `vibehub-ticket-apply` Skill follows\nthe derived next action, keeps caller identity separate from authority,\nretries exact interrupted applications, and stops at an unavailable trusted\nboundary rather than fabricating a principal or disposition. App\ndecision-surface integration,\nTicket-readiness validation/currentness, complete Ticket definition\nstorage, generic GateDecision recording, and the wider execution lifecycle\nremain open.\n\nThe representative shapes, error boundary, exclusions, and acceptance tests\nare preserved in\n`artifacts/2026-07-28-ticket-review-operation-contract.md`; the proposal\nquery/validation extension is preserved in\n`artifacts/2026-07-29-proposal-query-validation-ledger.md`; authority and\napplication are preserved in\n`artifacts/2026-07-29-ticket-proposal-application-runtime.md`.\n\n**Claimed**: Codex 2026-07-28\n",
