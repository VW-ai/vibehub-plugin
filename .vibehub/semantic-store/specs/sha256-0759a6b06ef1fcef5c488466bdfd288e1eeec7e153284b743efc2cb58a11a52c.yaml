      "detail": "**Contract**: M2 exposes two intelligence entrypoints:\n`vibehub-ticket-plan` and `vibehub-ticket-validate`.\n\nThe Planning Skill recognizes explicit orchestration, blocker resolution,\nexecution discovery, deviation, and bounded graph-tending scenes. It\ndistinguishes no durable work, elaboration, decomposition, expansion,\ndecision blockers, and Planning Fog. It backchains from observable\noutcomes, then reads forward from current facts to remove duplicate\noutcomes, orphan work, dead ends, transitive convenience edges, and false\nserialization. A node exists only when it has an independent scheduling,\nblocking, retry, authority, or verification boundary.\n\nThe candidate is the exact `ticket.worktree.patch` input: one current\nworktree source plus complete Ticket documents and exact replacement\nrevisions or absence. There is no separate mandatory Proposal object or\ngeneric Apply Skill in this cut. Deterministic scripts validate the public\ninput contract; a semantically independent invocation then evaluates the\ncomplete prospective graph.\n\nThe Validation Skill receives raw deliverable evidence, current Git facts,\nand the candidate without the planner's intended verdict. It checks stable\noutcome identity, fresh-Agent context sufficiency, acceptance as proof,\ndirect dependency truth, graph coverage, Ticket granularity, delegated\nscope, honest Planning Fog, and protected boundaries. Its semantic verdict\nis `passed`, `failed`, or `inconclusive`. It reports authority separately\nas delegated, review before execution, human decision required, or\nPlanning Fog.\n\nA protected signal is not automatically a semantic failure. A passing plan\nmay represent an unresolved human choice as a blocking Ticket and may be\nwritten into the current graph so it is inspectable. The dependent path\ncannot execute until the choice is resolved. Initial plan review similarly\ngates execution authority over an active graph; it is not a\ndraft-to-active lifecycle.\n\n`review-plan` applies the machine-validated graph and pauses execution for\nhuman review. `auto-apply-unless-human-gate` applies the same kind of graph\nand continues only inside delegated, unblocked paths. Internal technical\nchoices with objective engineering criteria remain Agent-owned.\n\nThe validator does not mutate, grant authority, checkpoint, or declare a\nTicket operationally ready or complete. Outcome, Evidence, Run\ncurrentness, and durable Decision semantics remain later focused cuts.\nAny patch is still applied only through the exact-source public capability,\nand checkpointing remains a separate optional Git action.\n",
