      "detail": "**Question**: Define the legal operational transitions and graph-mutation\nauthority.\n\nThe answer must distinguish:\n- Plan revision from the current executable graph;\n- parent/child decomposition from execution dependency;\n- Ticket state from Run state;\n- automatic mutations from proposed graph diffs;\n- verifier failure, human gate, retry, split, merge, supersede, cancel, and\n  emergent follow-up work;\n- initial planning graph from the graph that actually executed.\n\n**New planning input from Wayne**: Planning may require human intervention\nwithout forcing the system to fabricate a fully explicit downstream graph.\nTechnical research, technical decisions and frontend/design choices may\nthemselves be blocker Tickets. Work beyond such a blocker may remain a\ndirectional planning frontier rather than a valid Ticket, then be compiled\nor refined after the blocker resolves.\n\nThe answer must therefore decide whether the graph admits a non-executable\nplaceholder/fog object distinct from Ticket, how human review approves a\npartial graph, and what event causes downstream planning to resume.\n\n**Frozen read semantics (2026-07-28)**:\n\nThe default V0 review graph is the latest published whole-project\ngeneration in the verified worktree. A generation contains versioned Ticket\ndefinitions and only explicit direct dependency edges. Review snapshots are\nimmutable and retained independently from the moving `latest` pointer, so\npagination, inspection, and trace reads never substitute a newer graph.\n\nThis is a read identity and lifecycle decision only. Every stored outline\nexplicitly carries `parentId`: `null` marks a top-level Ticket and every\nsemantically contained Ticket names one parent. Parentage expresses outcome\ncontainment, not execution order or a UI hierarchy; execution order remains\nan explicit dependency relation. This read slice does not decide Plan\nrevisions, directional frontiers, proposed diffs, semantic mutation\nauthority/CAS, split/merge/supersede/cancel behavior, Run state, or the\ninitial-versus-executed graph comparison. The storage-only\npublication-head CAS frozen below is narrower than those unresolved\nlifecycle semantics.\n\n**Frozen storage-level publication substrate (2026-07-28)**:\n\nCore may persist one complete outline-compatible candidate generation\nthrough an authority-neutral publisher below the authorized\nproposal-application service. The publisher accepts an exact expected current snapshot\n(`null` means expected absence), serializes writers through an untracked\noperational lock directory in the worktree-specific Git administration\npath, rechecks current after acquiring that lock, validates the entire\ncandidate graph, installs immutable revision/generation documents, and\nexposes only complete generations. The complete lock directory is installed\nby atomic rename from a fully written, nonempty staging directory. Bootstrap\natomically renames a fully-synced sibling store directory into place; later\npublication atomically replaces `latest.yaml`. Those respective renames are\nthe only visibility commit points.\n\nA candidate identical to the already-current generation converges as an\nunchanged success even when the original expected snapshot is stale; every\nnon-identical stale expectation fails CAS without moving the pointer.\nNew Tickets start at revision 1, changed definitions advance exactly one\nrevision, unchanged definitions reuse their current revision, and creation\nprovenance is immutable. The V0 publisher rejects omission of any current\nTicket, because removal, prune, cancel, merge, and supersession cannot be\ninferred from absence.\n\nThis publisher is not a public Ticket operation and grants no semantic or\nhuman authority. Promise preservation, mutation classification, validation\nreceipts, and trusted authority are resolved above it before the application\nservice may invoke its fenced path. Explicit removal/supersession, partial\nPlanning Fog, Run state, and initial-versus-executed comparison remain\nunresolved.\n\n**Frozen proposal-submission boundary (2026-07-29)**:\n\n`ticket.proposal.submit` may now record an immutable, scope-bound review\ncontribution without advancing the current graph. Comment proposals bind\nan exact snapshot-visible Ticket revision or relation tuple. Graph-change\nproposals bind the exact observed snapshot, use create-absence and\nrevise-expected-revision preconditions, and describe complete replacement\ndefinition bodies rather than raw patches or per-edge mutations.\n\nCore allocates proposal identity and digest, new Ticket IDs, definition\nrevisions, timestamps, and proposal provenance. Caller actor/reason/source\nattribution is explicitly claimed_unverified, and callers cannot inject\nprovenance references. It resolves proposal-local references and\nmechanically validates the complete candidate topology and revision\ntransitions under a 4 MiB decoded logical-input budget, with pre-parse\nraw guards in CLI/Skill and bounded MCP framing, but it does not invoke\nthe internal generation publisher.\nSubmission therefore has `review_contribution_only` effect and never\ncreates a canonical draft, mutates the graph, or grants authority.\n\nAny human or Agent may submit. The request actor and authorAssessment are\nclaimed attribution and routing input only. Independent machine validation\nmust separately judge promise preservation, truthful containment,\nelaboration/decomposition/expansion, and delegated scope. Human authority\nis separately required only for protected experience/product,\nprinciple-deviation, permission/side-effect, risk/policy, or initial-plan\nboundaries. Bootstrap mechanically indicates initial_plan_authority;\nuntrusted authorAssessment cannot route the foundational plan as delegated.\nTechnical difficulty by itself is not a human gate.\n\n**Frozen proposal-query and semantic-evidence boundary (2026-07-29)**:\n\n`ticket.proposal.inspect` and `ticket.proposal.list` expose immutable,\nscope-bound proposal facts through bounded Core reads. They do not create a\nmutable proposal lifecycle, compare a stored proposal with the live graph\nhead, or infer approval/application status.\n\nA graph-change proposal may receive multiple append-only\nproposal-validation contributions. Each binds the exact proposal and\nmechanically materialized candidate and remains claimed_unverified semantic\nevidence. The ledger deliberately chooses no current/latest/winning receipt:\ncontrary assessments coexist and none grants maturity, authority,\nGateDecision satisfaction, application eligibility, or graph mutation.\nProposal validation is separate from Ticket-revision readiness validation.\n\n**Frozen trusted authority and application boundary (2026-07-29)**:\n\nThree further operations are now registered through Core:\n`ticket.proposal.review.inspect`,\n`ticket.proposal.authority.decide`, and `ticket.proposal.apply`. Review\nreconstructs the exact graph-change candidate, loads the complete bounded\nvalidation ledger, and binds that set by digest, high-water sequence, and\ncount. It reports one derived eligibility/next action without creating\nmutable proposal status.\n\nAuthority-decision operation input contains schema version, proposal ID,\nand immutable expected proposal/candidate/validation-set digests only. The\ncaller cannot serialize a principal, disposition, or authority proof. Those\nvalues must come from a non-serializable trusted provider injected by the\nhost. Core conservatively unions proposal, validation, and provider\nauthority signals and never permits a provider to downgrade change class.\nBootstrap, expansion, an introduced human gate, or any protected signal\nrequires a host-authenticated human with a human-authority basis. Only\nnon-protected elaboration/decomposition may use a trusted delegation basis.\nAuthorization cites at least one exact passing validation without a blocking\nfinding and remains bound to the complete set, including contrary receipts.\nThe immutable decision is terminal for one proposal and closes its\nvalidation ledger.\n\nApplication rechecks the exact proposal/candidate and authorized decision,\nthen stores an immutable intent containing the complete candidate\ndefinitions, base snapshot, deterministic store/candidate identity, and\ncounts. Under one SQLite immediate transaction it invokes the Git publisher\nwith a durable fence derived from that intent. The fence remains in place\nuntil the immutable application receipt commits. If Git visibility changed\nbut receipt persistence failed, retry may adopt only the identical intent\nfence: a current candidate is `reconciled`, the original base may resume,\nand a malformed or foreign fence or third graph head fails closed. Release\natomically claims exact `owner-T` as `releasing-T`, unlinks only that marker,\nthen removes the canonical directory only if still empty. A successor's\nnonempty `owner-U` makes stale removal fail harmlessly; crash-empty state can\nbe removed or atomically replaced by staged acquisition. Cleanup after a\ncommitted receipt additionally requires the canonical Git head to equal the\nintent candidate. Successful receipts are immutable, terminal publication\nfacts and make replay idempotent.\n\nThis resolves additive/revision proposal application, not the entire graph\nlifecycle. Removal, cancel, merge, split, prune, supersession, partial\nPlanning Fog, Ticket readiness, Run state, and initial-versus-executed\ncomparison remain open. The default CLI/MCP adapters inject no trusted\nauthority provider, so bootstrap and protected proposals still require a\ntrusted host decision bridge; caller actor claims cannot unlock them.\n",
