      "anchors": [],
      "detail": "当用户说“帮我先记录一下”“沉淀一下”或表达等价请求时，VibeHub 不得仅凭“记录”这个动词直接创建 canonical Context。Agent 应根据内容的未来用途路由：\n\n- 以后要做、完成后即失效的功能想法、Bug、优化、研究问题或交付目标进入 Ticket；信息不足时保留真实 Planning Fog，不伪装成可执行工作。\n- 以后要遵守或记住、在单次工作完成后仍持续指导多个 Ticket 的 intent、decision、constraint、contract、convention 或 durable context 进入 Context Layer。\n- 用户只是要求不要丢失、当前无法判断是否属于工作或稳定语义的原始内容进入 Archive，不自动成为 Ticket 或 canonical Context。\n\n高置信度时 Agent 可直接路由；歧义会改变 canonical 含义时只追问一个最小问题：“这是以后要做，还是以后要遵守/记住？”开发需求默认偏向 Ticket。Context 类型 intent 继续存在，但准入收窄为跨 Ticket 仍然成立的长期目的或方向，不再承担普通 backlog。Archive 是低承诺原始记录层，不参与 Ticket readiness，也不构成项目 canonical truth。",
