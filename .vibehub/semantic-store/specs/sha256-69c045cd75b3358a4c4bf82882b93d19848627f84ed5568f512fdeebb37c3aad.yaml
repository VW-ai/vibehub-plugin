      "detail": "**Decision**: The pivot is a breaking early-stage replacement, not a\ncompatibility migration.\n\nThe first complete dogfood loop consists of:\n\n1. a small Git document protocol that reconstructs Tickets, typed\n   relations, proposals, validation, decisions, Outcomes, and Evidence;\n2. planning, validation, apply, execution, and closeout Skills whose bundled\n   scripts provide deterministic mechanics;\n3. the accepted graph HTML as a pure projection and review/edit surface;\n4. optional disposable SQLite coordination for live Runs and caches;\n5. one real Plugin feature completed through the loop.\n\nExisting graph projection, layout, Skill reasoning, Git scope utilities,\ncanonical validation, and stale-digest checks should be reused. The\nSQLite semantic ledgers, generation/latest protocol, trusted-provider\nauthority bridge, cross-store recovery fence, and their compatibility\nobligations must be removed rather than left behind as deprecated or\nunreachable compatibility code.\n\nImplementation follows\n`artifacts/2026-07-29-ticket-git-native-skill-driven-pivot-plan.md`.\n",
