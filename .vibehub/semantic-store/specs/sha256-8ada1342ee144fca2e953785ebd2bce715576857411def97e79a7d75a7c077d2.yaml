      "detail": "The implementation branch does not have to dogfood unfinished Ticket\nRuntime in order to finish Ticket Runtime. MR-ready requires the complete\nshipped execution surface: derived frontier, exact ContextBinding,\ndisposable Run lease, Git Evidence, independent Outcome closeout, direct\ndownstream unlock, Skill/CLI/MCP/HTML projection, DB-loss recovery, source\nstaleness behavior, package/release verification, and a clean removal of\nretired compatibility code.\n\nOne bounded synthetic repository conformance test proves the root-to-\ndependent loop without making the feature validate itself as a real\nproject. The existing real Plugin-feature dogfood target and multi-path\nproof remain useful post-merge M5 work and depend on this MR-ready runtime.\n",
