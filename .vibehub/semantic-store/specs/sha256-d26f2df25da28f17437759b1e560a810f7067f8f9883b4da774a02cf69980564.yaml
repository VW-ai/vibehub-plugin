  "revisions": [
    {
      "anchors": [],
      "detail": "VibeHub v0 的 Cloud provider 只支持 GitHub。Git-tracked Ticket 与 Context YAML 是语义事实：未提交 worktree 内容是本地进行中的事实，branch commit 是该分支的 durable truth，push 后的 branch/PR 是可共享、可审阅的 truth，merged default branch 是共享项目 truth。\n\nCloud 不建立第二套 canonical semantic database，也不重新实现分支合并或冲突裁决。它通过 GitHub refs、push/PR 与 webhook 读取和同步 Git 事实，提供 archive、索引、projection 与协作可见性。原始会话 archive 保持 non-canonical，并绑定可识别的 repository/ref/commit。频繁 push 是降低 Cloud 观察延迟的产品约定，而不是另建实时 semantic authority 的理由。其他代码托管 provider 不属于 v0。",
      "domain": "architecture",
      "evidence": [
        {
          "confidence": 1,
          "content_hash": null,
          "evidence_id": "decision-project-github-cloud-boundary-001:1:1",
          "evidence_ref": null,
          "exact_quote": "这个所谓的cloud,我理解就是GitHub,目前也只能是GitHub,不能是其他东西,那就answer这个question。我们这边的cloud主要是做这个archive和同步嘛。它的native是truth嘛，我看你这个branch的YAML内容，如果你push的频繁，那你这个就足够的truthful。",
          "produced_at": "2026-07-31T21:34:24.162Z",
