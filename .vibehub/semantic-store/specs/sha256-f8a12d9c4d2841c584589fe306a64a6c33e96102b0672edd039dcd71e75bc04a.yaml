      "detail": "Ticket shaping uses a bounded two-pass reasoning pattern:\n`Backchain → Forward Normalize`.\n\nBackchain begins from each human-understandable scenario/outcome and its\nobservable acceptance. It asks which result, fact, or authorized decision\nmust already exist immediately before that acceptance can be proven, then\nrepeats until the path reaches current evidence, an executable frontier, a\ndecision blocker, or honest Planning Fog.\n\nBackchaining may expose several necessary parallel branches or several\ncandidate path hypotheses. Work that is independently required belongs in\none DAG. Alternative paths remain proposals behind the decision that\nselects among them; an unknown region is not fabricated into empty Tickets.\n\nForward Normalize then reads from current facts toward the outcomes and\nchecks:\n\n- every Ticket is reachable and contributes to at least one ancestor\n  acceptance;\n- duplicated outcomes and shared prerequisites across backward paths are\n  reconciled;\n- unnecessary serialization and transitive dependency edges are removed;\n- independent parallelism, joins, human gates, and blockers are preserved;\n- work without an independent scheduling, blocking, verification,\n  permission, or retry boundary returns to parent elaboration;\n- outcome, verifier, authority, or retry boundaries that should be\n  independent are split;\n- no orphan or dead-end Ticket remains in the proposed graph.\n\nContainment and execution dependency remain different semantics. Every\nnon-top-level Ticket has exactly one truthful containment parent. Scenario\nmembership is derived from that ancestry. A cross-scenario shared Ticket\nattaches to the earliest common ancestor whose outcome contains it, then\nfeeds the affected branches through explicit dependencies.\n\nThis pattern belongs to Ticket shaping intelligence. It produces a bounded\ngraph proposal with rationale, acceptance coverage, blockers, frontiers,\nand proposed merge/prune/redirect mutations. Independent validation judges\nthe proposal; Core enforces graph integrity, revision compare-and-swap,\nauthority, and atomic application. It is not a mandatory end-to-end\nworkflow or a second writable graph model.\n",
