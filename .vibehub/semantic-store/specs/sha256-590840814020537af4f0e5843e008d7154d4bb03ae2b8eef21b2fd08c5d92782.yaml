      "detail": "2026-07-13 至 2026-07-14 的独立 working-tree 审计把修复拆成六个可单独\n评审、验证和提交的边界:\n\n- B1:task identity 改为 repo-qualified opaque ID,legacy branch lookup 仅只读兼容;\n- B2:intervention claim、hook event 与状态推进在 immediate transaction 内原子化,\n  transcript I/O 移到锁外,并补真实双 worker 并发证据;\n- B3:修正 live scope matcher 参数方向,避免已覆盖文件被错误归入灰区;\n- B4:让 production main.tsx 进入 Playwright gate,补齐 modal/focus/race/resize 与\n  typed intervention receipt controller;\n- B5:按 Wayne 裁决由 decision-workbench-014 固定 v8 spatial-workbench 为\n  workbench/app/** 视觉权威,移除未实现或会误导的 affordance/copy;\n- B6:让 isolated/artifact gates 执行真实 production entry、受管 hook/MCP\n  命令、negative corruption proofs 与完整 headless dogfood。\n\nFresh B7 verification 在 committed tree 上通过 build/typecheck、301 个 unit、\nproduction E2E 25、historical E2E 171、bundle/artifact/dogfood、isolated full\nmatrix 与 diff check。最终对抗审查发现 malformed hook flags 会在 catch 前\nexit 2;修复后真实 CLI 子进程钉死 hook exit 0,非 hook 参数错误仍 exit 2,\nreviewer 复审批准。真实 Claude dogfood 涉及外发授权,本 change 不执行、也不把\nM2 总 milestone 冒充为 completed;Tauri 仍后置。\n",
