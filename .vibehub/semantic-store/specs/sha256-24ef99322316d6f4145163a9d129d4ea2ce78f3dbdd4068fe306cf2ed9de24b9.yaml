      ],
      "detail": "**Decision**: Ticket is the only canonical durable work unit. VibeHub does\nnot keep a separate formal Task entity above or beside it.\n\nHuman-visible outcome work and Agent-executable work use the same Ticket\nidentity and contract family. Parent/child decomposition, visibility and\nexecution dependencies express different levels without introducing a\nsecond work-unit lifecycle. Only a Ticket that satisfies the eventual\nexecutable contract may be claimed by a Run.\n\n`task` remains available as ordinary language or a host-system term. It\ndoes not own a canonical ID, schema, lifecycle or state machine. This\nproject is early-stage: existing Task rows, branch-derived compatibility\nstate and task-shaped APIs do not create a migration obligation and may be\nremoved when the Ticket model lands.\n\n**Rationale**: The active Task definition and the proposed strict Ticket\noccupied nearly identical semantic space. Keeping both would force users,\nplanners and runtime code to decide repeatedly which identity owns outcome,\nacceptance, scope, authority and closeout.\n\n**Deferred**: The Ticket contract, exact parent/visibility fields, direct\nexecutability test and lifecycle are separate decisions. This decision\nfixes the ontology; it does not invent those contracts prematurely.\n\n**Claimed**: Codex 2026-07-27\n",
