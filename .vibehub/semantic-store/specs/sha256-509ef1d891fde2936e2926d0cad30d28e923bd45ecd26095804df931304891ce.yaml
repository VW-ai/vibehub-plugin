      "detail": "Query、ingest、distill 是最小 intelligence spine，后续 review/update/setup\n复用同一原则。Skills 通过 progressive context loading 读取 shared stdlib、\nreferences、schemas 与 helper scripts；不要求 agent 每次临场发明 database\n操作。\n\nHooks 只提供 lifecycle evidence 与 cadence；MCP/CLI/core 只验证并执行\nversioned operations，返回 deterministic facts/receipts。Tool description\n只能路由 skill，不能拼成分布式 workflow。\n",
      "domain": "knowledge-lifecycle",
