      "detail": "M3.6 keeps the useful durable-receipt boundary from M3.5 while removing the\nWebAuthn ceremony and its stronger-than-needed human-presence claim. One\nexplicit click in the installed Plugin review host confirms one exact\nDecision. The host signs that Decision with a repository-scoped,\ninstallation-local Ed25519 key whose private material and public trust\nregistry live outside Git and SQLite.\n\nThe detached Git receipt binds the exact canonical Decision document and\ndigest, authority attribution, repository incarnation and roots, worktree,\nnamed branch, protected subject, disposition and granted scope. Detached\ncheckouts remain readable but cannot create durable Decisions because a\ncommit would immediately change their commit identity. The receipt also\nrecords the signer key ID and fingerprint, the\n`plugin_host_click` confirmation method, a nonce, and issuance time.\nSignature bytes are the fixed domain\n`vibehub.ticket-decision-attestation.v1\\0` followed by the canonical\nenvelope without the signature.\n\nFresh Core, CLI, MCP, and Skill readers resolve the public profile from the\nrepo-external registry for every verification. A missing, mismatched, or\nrevoked profile; any Decision, checkout, repository, worktree, subject, or\nscope mismatch; or an invalid signature fails closed. Receipts do not\nexpire. They remain usable only while their exact bound facts are current\nand their signing profile is not revoked.\n\nThis is intentionally local-installation authority, not proof of a named\nperson. `confirmation.method: plugin_host_click` records what the trusted\nPlugin host says happened; it is not biometric verification, WebAuthn user\nverification, or cryptographic proof of human presence. The profile's\nhuman-shaped authority fields preserve the Decision contract as a\n`designated_human` host assertion but identify\n`local-installation:<profileId>`, not an individual or repository owner.\n\nThe threat model protects against repository-only mutation, Git or SQLite\nfabrication, stale checkout reuse, receipt tamper, and fresh-process trust\nconfusion. It does not protect against an arbitrary process running as the\nsame OS user that can read or invoke the installation key, a compromised\nPlugin/runtime, or compromise of the local OS account. Those stronger\nthreats require an OS-backed or remote authority and are explicitly outside\nthis contract.\n",
