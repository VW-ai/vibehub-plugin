      "detail": "Provisional destination: make the path from durable user intent and current\nsemantic state to a machine-validated, executable Ticket Graph clear enough\nthat the existing Plugin can dogfood the first trustworthy loop.\n\nThe way is clear when the project has canonical definitions and authority\nboundaries for Plan, Ticket, Run, Gate, Outcome/Evidence, context binding,\ngraph mutation, semantic closeout, storage, and the first implementation\nslice. The resulting contracts must be implementable without silently\ndeciding unresolved ontology in code.\n\nThis destination is intentionally narrower than shipping the future App,\nServer, unattended scheduler, external tracker integration, or rebrand.\n",
