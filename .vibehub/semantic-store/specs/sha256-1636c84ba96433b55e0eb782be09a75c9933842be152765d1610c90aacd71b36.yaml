      "detail": "decision-workbench-016 的 Interaction & Presentation Protocol 第一条可运行\n纵向切片完成。`WorkflowReceiptV1` 固定 setup/query/review/ingest/update/\ndistill/inject/checkpoint 的 activity、phase、outcome、visibility、typed\nevidence 与 next action 语言；browser-safe contract 不依赖 Node/SQLite，\nruntime projectors 才消费 OperationResult、init/doctor 与 injection facts。\n\n42 个 canonical operations 通过同一份 exhaustive map 推导 activity/effect，\ncaller 不能把 read 冒充 persisted write。doctor、init、queue claim 与\nintervention receipt 均从机械事实重算；generic non-injection intervention\n不可进入 injection projector。TUI renderer 保证 Activity/Trigger/Effects/\nResult/Next 五段始终存在，具备 bounded output、ANSI/control 清理与\nCJK/emoji display-width wrapping。\n\nReview 发现既有 idempotent intervention replay 会把 stale/no_op/unsupported\n覆盖为 already_applied。本次从源头改为保留原 outcome，并用 `replayed:true`\n表达重放；legacy already_applied 仅保留 wire compatibility。\n\nController 验证：Core 220/220、App 59/59、core/app typecheck、core build 与\ndiff-check 全绿；独立 reviewer 最终 APPROVED。\n",
