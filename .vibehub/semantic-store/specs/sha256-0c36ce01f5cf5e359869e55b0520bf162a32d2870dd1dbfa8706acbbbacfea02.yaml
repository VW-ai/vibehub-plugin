      "detail": "**Decision**: Preserve the accepted Ticket promise and execution-handoff\ncontract while removing compulsory containment hierarchy.\n\nA Ticket ID still binds one stable, independently meaningful outcome\npromise. A fresh Agent with VibeHub must be able to read an executable\nTicket and its bound context and perform the correct work without reopening\nthe planning conversation. Acceptance proves its outcome rather than\nenumerating implementation steps. Material promise changes create a new\nTicket with explicit lineage.\n\nTicket nodes are flat. No Ticket is required to have `parentId`, one\ncontainment parent, or an ancestry-derived scenario. Planning,\ndependencies, joins, decomposition, supersession, evidence, verification,\nand contribution to a deliverable are represented by explicit typed\nrelations. The default execution projection emphasizes direct\ndependency/unlock relations.\n\nA scenario remains a derived human planning and review lens over relation\npaths. A coarse integration or verification Ticket may prove a scenario,\nbut Scenario is neither a canonical entity nor a Ticket hierarchy.\n\nThe earlier outline/specified/executable intelligence handoff, machine-first\nvalidation, verifiable acceptance, human authority boundaries, and bounded\nAgent-created Ticket rules remain valid. “Belongs inside earlier work” now\nmeans that the new Ticket has truthful typed relation paths to the\npreviously authorized outcomes; it does not require a tree parent.\n\nThe first protocol should keep the relation taxonomy small and evidence-led.\nExact relation names may be finalized with the Git document schema, but the\ndata model must remain a typed graph rather than a hidden tree.\n",
