      "detail": "Wayne 2026-07-12 review verdict ①附加。细化 decision-project-023 的\n\"人的动作必入\":实质性注入才升里程碑档,\"继续/好的\"类轻量确认不升\n(否则长 session 里程碑档被灌水)。\n机制:hook 捕获 UserPromptSubmit 后,用很薄的 prompt 判定是否里程碑\n并生成一句短摘要;UI 先展示摘要,expand 看用户原文;事件携带\npromptId(输入时分配)做全链路回溯。\n实现注意:CLI 本体保持零 LLM(decision-013)——薄分类走异步\nclaude -p 或先用机械启发式(长度/内容)兜底,LLM 只裁模糊区;\n摘要缺席时 UI 回退到原文截断(诚实降级)。归后端 M1。\n",
