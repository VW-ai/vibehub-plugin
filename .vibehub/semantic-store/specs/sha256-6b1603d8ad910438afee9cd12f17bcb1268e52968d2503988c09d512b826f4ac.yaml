      "detail": "热路径(vibehub hook,每个 tool use 触发):\n- GitFacade.sessionContextAt 单 spawn 拿齐 repoRoot/toplevel/branch;\n  slug/defaultBranch 走 repos 行快路径,仅首见 repo 时 spawn;\n- launch 判定 hasEvent(type 列索引查询)替全时间线 JSON.parse;\n- transcript 尾窗读(256KiB tunable,全文件兜底)替整文件读。\n批路径(team sync):ahead-behind 批量随 for-each-ref 单 spawn\n(%(ahead-behind),git≥2.41,老 git 自动回退逐分支)。\nfixture-export 重排:任务合并单列表+done-today 过滤只写一处;\nlastHookEventAt 由 MAX(events.at) 真派生(替 b3 前的 null 化石);\n裸 anchors SQL 收进 graph-store.countAnchoredFiles;灰区 pre-蒸馏\n布局改走 layoutTerritories 单项(消灭 88 vs 88.5 双源漂移);\nuncategorizedWriteScope/occupancy 助手去重;footprint 计数 SQL\nCOUNT(DISTINCT) 替全量物化。\n边界与策略:resolveDbPath(--db > VIBEHUB_DB > default)收进 core,\n三个 adapter 同源(顺修 hook 路径 --db 被 env 压过的不一致);\nvibehubHome 单点;taskIdForBranch join key 单点(写读两侧共用);\nteam-store 行映射改 SQL 别名(仅 int→bool 留 JS 转换),\nupsertRepo 复用 getRepoByRoot。\n跳过(记录不修):injectable-clock 三处内联(局部性优于抽象);\nconflicts/diagnosis/notification store 面先于调用者存在\n(M2 MCP/ConflictEngine 的契约预置,非死代码);listTerritories\nN+1(蒸馏出数百 feature 前是理论成本)。\nGates:core vitest 93/93(+5)、demo 44/44、Playwright 172/172、\ntsc ×3 clean、真 repo CLI 冒烟过。\n",
