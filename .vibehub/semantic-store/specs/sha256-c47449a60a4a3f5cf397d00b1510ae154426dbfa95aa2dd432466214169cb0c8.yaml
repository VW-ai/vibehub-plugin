      "detail": "- fixture-export 合并语义:同 branch 本地 hook 任务赢过远端行\n  (真五态/statusDetail/worktreePath,远端只贡献 PR 事实);\n  未 push 的本地 branch 任务照进(hooks 先看见);scope 优先 MCP\n  申报、缺席时足迹自陈(distinct edit 数落 Uncategorized,\n  install-types 同思想)。\n- vite middleware `/live-fixture.json`:每请求经 core dist 现场\n  openDb→exportTeamMapFixture(连续请求 capturedAt 不同,实证\n  真读);浏览器 bundle 不碰 native 模块;无 DB/未 sync 依次诚实\n  回退 静态导出→404→前端警告降级。demo 冻结依赖清单未动。\n- e2e +2(live boot 路径两侧分支都必须渲染出合法地图;未知\n  fixture 名回退),Playwright 172/172、demo vitest 44/44、\n  tsc clean;真环境截图:地图实时显示本次 M1 三个切片分支\n  与 walking-skeleton 的并发冲突预警。\n- 补(2026-07-12 裁决③):非当日完成的 done 任务不进导出帧\n  (sameUtcDay,UTC 日界;occupancy doneToday 同源)——左栏\n  \"DONE TODAY\" 组不再混入陈旧 done。core vitest 75/75。\n- 遗留(有意延后):demo 的契约类型副本未消灭——需要 core 提供\n  browser-safe 的 types-only subpath export(packaging pass),\n  不值得为去重赌 172 条 e2e;镜像纪律(改必同步)继续生效。Wayne 2026-07-12 裁决④确认:维持镜像纪律,M2 碰 core 打包时一并做 subpath export 再合。\n",
