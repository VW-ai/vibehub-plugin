  "revisions": [
    {
      "anchors": [],
      "detail": "VibeHub 安装检查必须以只读方式识别 repository 中可能承担持久知识或 Agent 指令职责的既有文档结构，以及可能写入、解释或路由这些内容的 Skills。发现明确或可能冲突的系统时，安装流程不得自行推断权威边界，而应向用户呈现发现并询问选择。\n\n完整启用的产品选择只有两类：保留既有沉淀方式并让 VibeHub 兼容地向两边持久化，或者停止既有沉淀方式并仅使用 VibeHub。具体双存方向、canonical owner 与冲突策略仍需后续 contract 明确。",
      "domain": "project-activation",
      "evidence": [
        {
          "confidence": 1,
          "content_hash": null,
          "evidence_id": "decision-project-activation-knowledge-coexistence-001:1:1",
          "evidence_ref": null,
          "exact_quote": "我们需要保证我们的这套沉淀功能，不会和用户已有的沉淀方式发生冲突。比如我们需要做检测，在安装的时候，看一下用户在 repo 里面有没有其他本身的文档结构，或者有没有一些其他可能会被 misinterpret（误解）的 skill。这些东西我们都要一并考虑，并去询问用户。",
          "produced_at": "2026-07-31T18:46:54.636Z",
          "producer": "codex-install-coexistence",
          "source_ref": "conversation:2026-07-31-install-coexistence",
          "source_type": "user_instruction"
        },
        {
          "confidence": 1,
          "content_hash": null,
          "evidence_id": "decision-project-activation-knowledge-coexistence-001:1:2",
          "evidence_ref": null,
          "exact_quote": "所以肯定只有两种方案：要么保留他以前的沉淀方式，我们这边改一下 CMD，两边各存一份。要么就让用户只用我们这套系统。",
