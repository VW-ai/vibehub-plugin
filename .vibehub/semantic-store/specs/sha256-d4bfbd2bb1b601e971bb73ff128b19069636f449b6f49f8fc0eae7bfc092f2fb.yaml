      "detail": "The default runtime database is ~/.vibehub/workbench.db. It is not one\ndatabase per repository. Repository and worktree identity partition all\ndurable knowledge, activity, cadence, receipts and operational authority\ninside the shared local database. VIBEHUB_DB is an explicit override for\ntests, isolation and advanced operation, not a second product topology.\n",
