      "detail": "The Git semantic authority adapter previously inserted the copied mapping_versions row directly as finalized before copying its feature rows. Finalized-mapping immutability triggers therefore rejected every subsequent feature insert, causing kb.status, search, and ingest to fail whenever an active mapping existed. The copy path now creates a building version, copies the feature hierarchy, anchors, and layouts (including computed_at), recomputes and compares the complete projection checksum, finalizes the target, and then installs the active pointer. A regression fixture includes a layout so omissions are detected by checksum rather than silently accepted.",
      "domain": "git-semantic-store",
      "evidence": [
