      "detail": "Active working convention:\n\n- Raw sessions and full tool traces remain cold provenance.\n- High-fidelity, non-normative synthesis lives under this room's\n  `artifacts/` directory.\n- A decision-shaping reference artifact is repository-versioned when its\n  concrete form carries information that prose alone would lose. This\n  includes interactive HTML, diagrams, executable examples, and evaluation\n  fixtures used to converge a product or technical decision.\n- Preserved reference artifacts use stable dated filenames and are linked\n  from the Specs they informed. A later artifact may supersede the working\n  direction, but earlier linked references are not silently deleted or\n  rewritten into a different historical proposal.\n- Transient screenshots, browser profiles, generated previews, and tool\n  outputs remain outside the repository unless they carry independent\n  evidence that the preserved source artifact cannot reproduce.\n- Canonical intent, decision, constraint, contract, convention, context,\n  and change claims are written as `active` Specs after machine validation.\n  Persisted `draft → human review → active` is not the default ingestion\n  path.\n- Uncertainty is explicit in provenance confidence, evidence, unresolved\n  questions, conflicts, or human-gate relations. It is not encoded by\n  placing every machine-authored Spec into a human approval queue.\n- A temporary draft may exist inside an authoring transaction, but it is\n  not canonical knowledge and need not be persisted as a Spec.\n- Work that still requires a product, technical, scope, permission, or risk\n  decision belongs in a Decision Ticket. Human authority is acquired by\n  resolving that gate, not by promoting an otherwise ordinary Spec.\n- `progress.yaml` records implementation milestones and evidence only after\n  the decision map is clear; it must not be used as a design-ticket ledger.\n\nThe current Wayfind files that use draft Specs as open-question carriers are\ntransitional scaffolding until Ticket Runtime can represent those questions\nas Tickets. They are not the target Spec lifecycle.\n\nThis preserves the loop from exploration to action while separating\nknowledge availability, machine validation, and human authority.\n",
