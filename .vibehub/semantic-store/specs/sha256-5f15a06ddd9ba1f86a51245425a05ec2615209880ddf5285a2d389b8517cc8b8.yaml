      "detail": "Claude Code 适配覆盖宿主公开 hook matrix。普通 hook 只记录 mechanical\nevidence；无条件行为协议仅在 SessionStart 注入一次。Queued context 在\n可靠 boundary 投递，Stop 使用官方 block/reason wire format 唤醒。\n\nRobustness 依赖宿主 hooks 与机械 evidence，不自建进程监听器或 transcript\nparser。信号缺失时诚实降级，不伪造 stalled/ready 精度。\n",
