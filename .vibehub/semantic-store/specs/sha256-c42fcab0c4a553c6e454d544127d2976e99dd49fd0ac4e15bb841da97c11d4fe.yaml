      "detail": "**Decision**: Ticket Runtime returns to the repository-wide Git semantic\nauthority model already ratified by `decision-project-028`.\n\nGit-tracked documents own every durable fact whose loss would change what\nthe project means or why an Agent should act:\n\n- Ticket definitions and typed graph relations;\n- planning proposals and comments;\n- semantic validation findings;\n- human or delegated decisions;\n- graph-mutation/application receipts;\n- Outcomes, accepted Evidence references, deviations, blockers,\n  supersession, and semantic closeout.\n\n“Receipt” is classified by meaning. A receipt that proves a proposal was\nvalidated, authorized, applied, or completed is semantic and belongs in\nGit. A request retry marker, HTTP response cache, process journal, lease,\nheartbeat, or browser capability is operational and may remain in SQLite.\n\nThe first protocol uses stable, reviewable documents under\n`.vibehub/tickets/`. The exact schema may evolve, but it must not recreate\nGit history through an internal immutable-generation store or mutable\n`latest.yaml` pointer. Inventory and graph digests are derived from the\nselected worktree or Git tree.\n\nAuthority is ref-relative:\n\n- an uncommitted Ticket document is a pending local semantic change;\n- a commit is durable truth for that branch;\n- a pushed branch or pull request is a reviewable collaborative proposal;\n- merged Git history determines shared project truth.\n\nReaders identify the exact repository, worktree/ref, resolved commit when\napplicable, and derived Ticket graph digest. They never silently union\nsemantic facts from different branches.\n\nSQLite is a disposable operational accelerator. It may hold active Run\ncoordination, claims, leases, heartbeat, retries, local indexes,\ncommit/digest-keyed caches, file-watcher state, and UI sessions. Deleting\nit may interrupt a live process, but checkout plus deterministic indexing\nmust recover every durable Ticket meaning, decision, outcome, and proof.\n\nThis project is early-stage. The existing SQLite Ticket proposal,\nvalidation, authority, application-intent, and application-receipt ledgers\ncreate no migration or compatibility obligation.\n",
