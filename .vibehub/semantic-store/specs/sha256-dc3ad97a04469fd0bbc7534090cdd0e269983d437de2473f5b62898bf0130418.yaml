      "detail": "Candidate durable Git truth includes intent, decision, constraint,\nconvention, contract, feature/spec, evidence relations, Task definitions and\nhandoffs. SQLite continues to hold session and hook events, cadence,\ninjection claims, writer leases, Run state, real-time timeline, indexes and\nmaterialized projections.\n\nYAML is a strict protocol rather than free-form documentation: use a\nJSON-compatible YAML 1.2 subset, schema_version, stable IDs, one entity per\nfile, no aliases/merge keys/custom tags, duplicate- and unknown-field\nrejection, and deterministic serialization.\n\nCandidate semantics are: uncommitted YAML is proposed/draft local state;\ncommitted YAML is durable local truth; merged main is shared truth. This is\nnot approved. The first gate is a lossless SQLite semantic subset → YAML →\nclean SQLite round trip. Only after review may a decision supersede the\ncurrent SQLite source-of-truth architecture.\n",
